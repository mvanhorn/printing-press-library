version: 2
project_name: investorpaisa-pp-cli
changelog:
  disable: true
builds:
  - id: investorpaisa-pp-cli
    main: ./cmd/investorpaisa-pp-cli
    binary: investorpaisa-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/payments/investorpaisa/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: investorpaisa-pp-mcp
    main: ./cmd/investorpaisa-pp-mcp
    binary: investorpaisa-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: investorpaisa-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The Nifty 200 momentum screener, movers and market breadth in your terminal, with a local history that builds from your first sync."
    install: |
      bin.install "investorpaisa-pp-cli"
      bin.install "investorpaisa-pp-mcp"
