    CreateSubscriptionPayload:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
      required:
      - subscription
      description: Successful subscription creation response.
    CreateSubscriptionArgs:
      type: object
      properties:
        input:
          type: object
          properties:
            description:
              type: string
              description: Human-readable description of the subscription. Auto-generated
                from item names when omitted.
              example: Colegiatura mensual
            nextCollectionDate:
              anyOf:
              - type: string
                description: Date string
              - type: string
                format: date-time
                description: Date object
              - nullable: true
              description: Date of the first (or next) charge. Required when using
                recurring `items`.
              example: 2025-06-01 00:00:00+00:00
            numberOfPayments:
              type: number
              nullable: true
              minimum: 1
              maximum: 999
              description: Total number of invoices to generate before the subscription
                ends. Null means indefinite.
              example: 12
            onlyAutomaticCollection:
              type: boolean
              description: Whether this subscription only allows automatic payment
                collection.
              example: false
            beneficiaryId:
              type: string
              nullable: true
              description: Optional identifier of a different customer who is the
                actual beneficiary.
              example: null
            taxProfileId:
              type: string
              nullable: true
              description: Optional tax profile to use for invoice generation.
              example: null
            customerId:
              type: string
              description: Identifier of the customer who will be charged.
              example: cus_1234567890abcdefghij
            templateId:
              type: string
              description: Optional template to use for subscription messaging.
              example: null
            collectionMethod:
              type: string
              enum:
              - SEND_REMINDER
              - AUTOMATIC
              - NONE
              description: 'How payment is collected: SEND_REMINDER sends a notification,
                AUTOMATIC charges a saved payment method, NONE does nothing.'
              example: SEND_REMINDER
            paymentMethodId:
              type: string
              nullable: true
              description: Identifier of the payment method to use for automatic collection.
                Falls back to the customer's default method.
              example: null
            recurrentDetail:
              type: object
              properties:
                chargeEach:
                  type: number
                  minimum: 1
                  maximum: 999
                  description: Number of intervals between charges.
                  example: 1
                collectionInterval:
                  type: string
                  enum:
                  - DAY
                  - WEEK
                  - FORTNIGHT
                  - MONTH
                  - YEAR
                  description: Time interval unit (e.g. MONTH, WEEK).
                  example: MONTH
                toleranceDays:
                  type: integer
                  nullable: true
                  minimum: 0
                  description: Grace days after the due date before the invoice expires.
                  example: 5
              required:
              - chargeEach
              - collectionInterval
              description: Custom recurrence configuration. Inferred from the concepts
                when omitted.
            modifiers:
              type: array
              items:
                type: object
                properties:
                  modifierId:
                    type: string
                    description: Identifier of the price modifier to attach.
                    example: prm_1234567890abcdefghij
                required:
                - modifierId
              description: Price modifiers (early payment discounts or late payment
                interest) to apply to every generated invoice.
            discounts:
              type: array
              items:
                type: object
                properties:
                  discountId:
                    type: string
                    description: Identifier of the discount to apply.
                    example: disc_1234567890abcdefghij
                  maxInvoices:
                    type: integer
                    nullable: true
                    minimum: 1
                    description: Maximum number of invoices this discount applies
                      to. Null means all invoices.
                    example: 3
                required:
                - discountId
              description: Discounts to apply to generated invoices.
            invoices:
              type: array
              items:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        conceptId:
                          type: string
                          description: Identifier of the payment concept.
                          example: pc_1234567890abcdefghij
                        quantity:
                          type: number
                          minimum: 1
                          description: Number of units.
                          example: 1
                        amount:
                          type: number
                          nullable: true
                          minimum: 0
                          maximum: 99999999999
                          description: Optional unit price snapshot in minor currency
                            units.
                          example: 150000
                        currency:
                          type: string
                          nullable: true
                          description: Optional ISO 4217 currency snapshot.
                          example: MXN
                        description:
                          type: string
                          nullable: true
                          minLength: 1
                          description: Optional line-item description snapshot.
                          example: Colegiatura Junio
                      required:
                      - conceptId
                      - quantity
                    minItems: 1
                    maxItems: 100
                    description: Line items for this invoice.
                  dueDate:
                    anyOf:
                    - type: string
                      description: Date string
                    - type: string
                      format: date-time
                      description: Date object
                    description: Due date for this invoice.
                    example: 2025-06-01 00:00:00+00:00
                  expireDate:
                    anyOf:
                    - type: string
                      description: Date string
                    - type: string
                      format: date-time
                      description: Date object
                    description: Optional expiration date for this invoice.
                    example: null
                required:
                - items
                - dueDate
              minItems: 1
              maxItems: 1000
              description: Pre-defined invoices with explicit due dates and items.
                Mutually exclusive with `items`.
            items:
              type: array
              items:
                type: object
                properties:
                  conceptId:
                    type: string
                    description: Identifier of the payment concept.
                    example: pc_1234567890abcdefghij
                  quantity:
                    type: number
                    minimum: 1
                    description: Number of units.
                    example: 1
                  amount:
                    type: number
                    nullable: true
                    minimum: 0
                    maximum: 99999999999
                    description: Optional unit price snapshot in minor currency units.
                    example: 150000
                  currency:
                    type: string
                    nullable: true
                    description: Optional ISO 4217 currency snapshot.
                    example: MXN
                  description:
                    type: string
                    nullable: true
                    minLength: 1
                    description: Optional line-item description snapshot.
                    example: Colegiatura mensual
                required:
                - conceptId
                - quantity
              minItems: 1
              maxItems: 100
              description: Recurring items whose invoices are auto-generated on each
                collection date. Mutually exclusive with `invoices`.
          required:
          - customerId
          - collectionMethod
      required:
      - input
      description: Request body for creating a subscription.
