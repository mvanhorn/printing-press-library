openapi: 3.0.3
info:
  title: Quentli REST API
  version: 1.0.0
  description: 'Quentli REST API: a Stripe-like payments, invoicing, and subscription-billing
    platform for Latin America (cobranza + SAT CFDI tax invoicing). This CLI manages
    customers, catalog payment concepts and discounts, invoices, hosted payment sessions,
    payments, refunds, subscriptions, tax invoices, webhooks, and customer portal/auth
    links.'
servers:
- url: https://api.quentli.com
  description: Production API
- url: https://api.staging.quentli.com
  description: Staging API for production-like validation
- url: https://api.demo.quentli.com
  description: Demo API hostname served by staging
security:
- organizationApiKey: []
tags:
- name: Auth
- name: Billing
- name: Catalog
- name: Customers
- name: Invoices
- name: Payment Methods
- name: Payment Sessions
- name: Payments
- name: Subscriptions
- name: Tax Invoices
- name: Webhooks
components:
  securitySchemes:
    organizationApiKey:
      type: http
      scheme: bearer
      description: 'Organization API key using `Authorization: Bearer sk_...`.'
      x-auth-env-vars:
      - QUENTLI_SECRET_KEY
      bearerFormat: sk_
  schemas:
    GetCustomersResponse:
      type: array
      items:
        $ref: '#/components/schemas/Customer'
      description: List of customers returned by the query.
    Customer:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the customer.
          example: cus_1234567890abcdefghij
        createdAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when the customer was created.
          example: 2025-01-10 12:00:00+00:00
        updatedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when the customer was last updated.
          example: 2025-01-10 12:00:00+00:00
        name:
          type: string
          description: Name of the customer.
          example: "Juan P\xE9rez"
        username:
          type: string
          description: Username used for customer login and customer identification.
          example: juan_perez_01
        email:
          type: string
          nullable: true
          description: Email address of the customer.
          example: juan@example.com
        phoneNumber:
          type: string
          nullable: true
          description: Primary WhatsApp phone number of the customer, usually in E.164
            format.
          example: '+525512345678'
        organizationId:
          type: string
          description: Identifier of the organization this customer belongs to.
          example: org_1234567890abcdefghij
        secondaryPhoneNumber:
          type: string
          nullable: true
          description: Secondary phone number used for reminders and announcements.
          example: null
        archivedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when the customer was archived.
          example: null
        archivedById:
          type: string
          nullable: true
          description: Identifier of the user who archived this customer.
          example: u_1234567890abcdefghij
        acceptedServiceAgreement:
          type: boolean
          description: Whether the customer has accepted the service agreement.
          example: true
        skipTaxInvoice:
          type: boolean
          description: Whether tax invoice generation is skipped for this customer.
          example: false
        emailVerified:
          type: boolean
          description: Whether the customer has verified their email address.
          example: false
        phoneNumberVerified:
          type: boolean
          description: Whether the customer has verified their phone number.
          example: true
        hasChangedPassword:
          type: boolean
          description: Whether the customer has set a non-default password.
          example: true
        signatureAcceptedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when recurring charges terms were accepted via
            signature.
          example: 2025-01-10 12:00:00+00:00
        optedOutWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when the customer opted out of WhatsApp reminders.
          example: null
        optedInWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when the customer opted in to WhatsApp reminders.
          example: 2025-01-05 10:00:00+00:00
        startedWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when WhatsApp opt-in flow was started for this
            customer.
          example: 2025-01-05 09:55:00+00:00
        replyWithAssistant:
          type: boolean
          nullable: true
          description: Whether to reply to this customer using the assistant.
          example: false
        metadata:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
            - key
            - value
            additionalProperties: false
          description: Custom metadata entries attached to this customer as key-value
            pairs.
          example: &id001
          - key: studentId
            value: A-1029
        meta:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Flattened metadata map where each key maps to a string value.
          example: &id002
            studentId: A-1029
      required:
      - id
      - createdAt
      - updatedAt
      - name
      - username
      - email
      - phoneNumber
      - organizationId
      - secondaryPhoneNumber
      - archivedAt
      - archivedById
      - acceptedServiceAgreement
      - skipTaxInvoice
      - emailVerified
      - phoneNumberVerified
      - hasChangedPassword
      - signatureAcceptedAt
      - optedOutWhatsappAt
      - optedInWhatsappAt
      - startedWhatsappAt
      - replyWithAssistant
      description: Customer record including identity, contact details, and messaging
        preferences.
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            issues:
              type: array
              items:
                type: object
                additionalProperties:
                  nullable: true
          required:
          - message
          - issues
      required:
      - error
      additionalProperties: false
      description: Validation error response with field-level issues.
    UserError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
          required:
          - message
      required:
      - error
      additionalProperties: false
      description: Standard user-facing error response envelope.
    GetCustomerResponse:
      type: object
      nullable: true
      properties:
        id:
          type: string
          description: Unique identifier of the customer.
          example: cus_1234567890abcdefghij
        createdAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when the customer was created.
          example: 2025-01-10 12:00:00+00:00
        updatedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when the customer was last updated.
          example: 2025-01-10 12:00:00+00:00
        name:
          type: string
          description: Name of the customer.
          example: "Juan P\xE9rez"
        username:
          type: string
          description: Username used for customer login and customer identification.
          example: juan_perez_01
        email:
          type: string
          nullable: true
          description: Email address of the customer.
          example: juan@example.com
        phoneNumber:
          type: string
          nullable: true
          description: Primary WhatsApp phone number of the customer, usually in E.164
            format.
          example: '+525512345678'
        organizationId:
          type: string
          description: Identifier of the organization this customer belongs to.
          example: org_1234567890abcdefghij
        secondaryPhoneNumber:
          type: string
          nullable: true
          description: Secondary phone number used for reminders and announcements.
          example: null
        archivedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when the customer was archived.
          example: null
        archivedById:
          type: string
          nullable: true
          description: Identifier of the user who archived this customer.
          example: u_1234567890abcdefghij
        acceptedServiceAgreement:
          type: boolean
          description: Whether the customer has accepted the service agreement.
          example: true
        skipTaxInvoice:
          type: boolean
          description: Whether tax invoice generation is skipped for this customer.
          example: false
        emailVerified:
          type: boolean
          description: Whether the customer has verified their email address.
          example: false
        phoneNumberVerified:
          type: boolean
          description: Whether the customer has verified their phone number.
          example: true
        hasChangedPassword:
          type: boolean
          description: Whether the customer has set a non-default password.
          example: true
        signatureAcceptedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when recurring charges terms were accepted via
            signature.
          example: 2025-01-10 12:00:00+00:00
        optedOutWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when the customer opted out of WhatsApp reminders.
          example: null
        optedInWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when the customer opted in to WhatsApp reminders.
          example: 2025-01-05 10:00:00+00:00
        startedWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when WhatsApp opt-in flow was started for this
            customer.
          example: 2025-01-05 09:55:00+00:00
        replyWithAssistant:
          type: boolean
          nullable: true
          description: Whether to reply to this customer using the assistant.
          example: false
        metadata:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
            - key
            - value
            additionalProperties: false
          description: Custom metadata entries attached to this customer as key-value
            pairs.
          example: *id001
        meta:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Flattened metadata map where each key maps to a string value.
          example: *id002
      required:
      - id
      - createdAt
      - updatedAt
      - name
      - username
      - email
      - phoneNumber
      - organizationId
      - secondaryPhoneNumber
      - archivedAt
      - archivedById
      - acceptedServiceAgreement
      - skipTaxInvoice
      - emailVerified
      - phoneNumberVerified
      - hasChangedPassword
      - signatureAcceptedAt
      - optedOutWhatsappAt
      - optedInWhatsappAt
      - startedWhatsappAt
      - replyWithAssistant
      description: Customer details response. Returns null if the customer does not
        exist.
    CreateCustomerPayload:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
      required:
      - customer
      description: Successful customer creation response.
    CreateCustomerArgs:
      type: object
      properties:
        input:
          $ref: '#/components/schemas/CreateCustomerInput'
      required:
      - input
      additionalProperties: false
      description: Request body for creating a customer.
    CreateCustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the customer.
          example: Juan Perez
        username:
          type: string
          nullable: true
          minLength: 1
          description: Optional username used for login and identification. If omitted
            and auto-increment usernames are enabled, one is generated.
          example: juan_perez_01
        email:
          type: string
          nullable: true
          format: email
          description: Email address of the customer.
          example: juan@example.com
        phoneNumber:
          type: string
          nullable: true
          description: Primary WhatsApp phone number of the customer, preferably E.164.
          example: '+525512345678'
        secondaryPhoneNumber:
          type: string
          nullable: true
          description: Secondary phone number for reminders and announcements.
          example: '+525598765432'
        acceptedServiceAgreement:
          type: boolean
          description: Whether the customer has accepted the service agreement.
          example: true
        skipTaxInvoice:
          type: boolean
          description: Whether tax invoice generation should be skipped for this customer.
          example: false
        assigneeId:
          type: string
          nullable: true
          description: Member id assigned to manage this customer.
          example: cmab12cd3000x1a2b3c4d5e6f
        optedOutWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when the customer opted out of WhatsApp reminders.
          example: 2025-01-15 10:30:00+00:00
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/CreateCustomerMetadataItemInput'
          description: Custom metadata entries attached to the customer.
          example:
          - key: studentId
            value: A-1029
        tags:
          type: array
          items:
            type: string
          description: Tag names to associate with this customer.
          example:
          - VIP
          - Colegiatura
      required:
      - name
      description: Customer creation payload.
    CreateCustomerMetadataItemInput:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          description: Metadata key name.
          example: studentId
        value:
          type: string
          minLength: 1
          description: Metadata value.
          example: A-1029
      required:
      - key
      - value
      description: Custom metadata key-value pair attached to the customer.
    UpdateCustomerPayload:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
      required:
      - customer
      description: Successful customer update response.
    UpdateCustomerArgs:
      type: object
      properties:
        input:
          $ref: '#/components/schemas/UpdateCustomerInput'
      required:
      - input
      description: Request body for updating a customer.
    UpdateCustomerInput:
      type: object
      properties:
        otp:
          type: string
          description: Verification code required for sensitive changes.
          example: '123456'
        data:
          $ref: '#/components/schemas/UpdateCustomerDataInput'
      required:
      - data
      description: Client payload used to update a customer.
    UpdateCustomerDataInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Updated customer name.
          example: Juan Perez
        email:
          type: string
          nullable: true
          format: email
          description: Updated email address.
          example: juan@example.com
        phoneNumber:
          type: string
          nullable: true
          description: Updated primary WhatsApp phone number (E.164).
          example: '+525512345678'
        password:
          type: string
          description: New customer password.
          example: S3curePassw0rd!
        username:
          type: string
          minLength: 1
          description: Updated username.
          example: juan_perez_01
        tags:
          type: array
          items:
            type: string
          description: Updated tag list.
          example:
          - VIP
          - Colegiatura
        tosIp:
          type: string
          description: IP captured when terms are accepted.
          example: 189.203.12.45
        secondaryPhoneNumber:
          type: string
          nullable: true
          description: Updated secondary phone number (E.164).
          example: '+525598765432'
        acceptedServiceAgreement:
          type: boolean
          description: Whether service agreement is accepted.
          example: true
        skipTaxInvoice:
          type: boolean
          description: Whether to skip tax invoices.
          example: false
        signature:
          type: string
          nullable: true
          description: Base64 or URL signature payload.
          example: signed-by-customer
        assigneeId:
          type: string
          nullable: true
          description: Member id assigned to this customer.
          example: cmab12cd3000x1a2b3c4d5e6f
        optedOutWhatsappAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when customer opted out from WhatsApp.
          example: 2025-01-15 10:30:00+00:00
        hasChangedPassword:
          type: boolean
          description: Flag indicating password was changed.
          example: true
        phoneNumberVerified:
          type: boolean
          description: Whether phone number is verified.
          example: true
        emailVerified:
          type: boolean
          description: Whether email is verified.
          example: true
        replyWithAssistant:
          type: boolean
          nullable: true
          description: Whether assistant replies are enabled for this customer.
          example: false
        metadata:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                description: Metadata key name.
                example: studentId
              value:
                type: string
                nullable: true
                description: Metadata value.
                example: A-1029
            required:
            - key
          description: Metadata entries to upsert. Null values delete keys.
          example:
          - key: studentId
            value: A-1029
        meta:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Flat metadata map. Null/empty values remove keys.
          example:
            grade: 5A
      description: Fields that can be updated on a customer.
    GetCustomerPaymentMethodsResponse:
      type: array
      items:
        $ref: '#/components/schemas/PaymentMethod'
      description: Confirmed and non-deleted payment methods for the customer.
    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          description: Payment method identifier.
        createdAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when payment method was created.
        updatedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: Date and time when payment method was last updated.
        customerId:
          type: string
          description: Identifier of the customer that owns this payment method.
        type:
          type: string
          enum:
          - CARD
          - MEXICAN_BANK_ACCOUNT
          description: Type of payment method (card or Mexican bank account).
        confirmed:
          type: boolean
          description: Whether this payment method can be used to collect payments.
        default:
          type: boolean
          description: Whether this is the default method used for automatic collections.
        deletedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          - nullable: true
          description: Date and time when this payment method was deleted.
          example: null
        bankAccountId:
          type: string
          nullable: true
          description: Related bank account identifier, when applicable.
          example: null
        expired:
          type: boolean
          description: Whether this payment method is no longer valid.
        cardDetail:
          type: object
          nullable: true
          properties:
            id:
              type: string
              description: Card detail identifier.
            createdAt:
              anyOf:
              - type: string
                description: Date string
              - type: string
                format: date-time
                description: Date object
              description: Date and time when card details were created.
            updatedAt:
              anyOf:
              - type: string
                description: Date string
              - type: string
                format: date-time
                description: Date object
              description: Date and time when card details were last updated.
            expiryMonth:
              type: number
              description: Card expiration month (1-12).
            expiryYear:
              type: number
              description: Card expiration year (YYYY).
            cardholder:
              type: string
              nullable: true
              description: Name printed on the card, if available.
            bin:
              type: string
              description: Bank Identification Number (first 6 digits).
            last4:
              type: string
              description: Last four digits of the card.
            brand:
              type: string
              nullable: true
              description: Card brand (e.g. VISA, MASTERCARD).
            issuer:
              type: string
              nullable: true
              description: Issuing bank or institution.
            isCorporate:
              type: boolean
              nullable: true
              description: Whether the card is a corporate card.
            country:
              type: string
              nullable: true
              description: ISO country code for the card issuer.
            funding:
              type: string
              nullable: true
              description: Funding category (for example, CREDIT or DEBIT).
          required:
          - id
          - createdAt
          - updatedAt
          - expiryMonth
          - expiryYear
          - bin
          - last4
          description: Card details when `type` is `CARD`.
        bankAccount:
          type: object
          nullable: true
          properties:
            id:
              type: string
              description: Bank account identifier.
            createdAt:
              anyOf:
              - type: string
                description: Date string
              - type: string
                format: date-time
                description: Date object
              description: Date and time when bank account was created.
            updatedAt:
              anyOf:
              - type: string
                description: Date string
              - type: string
                format: date-time
                description: Date object
              description: Date and time when bank account was last updated.
            bankCode:
              type: string
              description: Bank institution code.
            bankName:
              type: string
              description: Bank institution name.
            customerId:
              type: string
              nullable: true
              description: Owner customer identifier.
            deletedAt:
              anyOf:
              - type: string
                description: Date string
              - type: string
                format: date-time
                description: Date object
              - nullable: true
              description: Date and time when this bank account was deleted.
            country:
              type: string
              description: ISO country code where the account is registered.
            verified:
              type: boolean
              description: Whether bank account ownership was verified.
            clabeLast:
              type: string
              description: Last visible digits of the CLABE/account number.
            clabeFirst:
              type: string
              description: First visible digits of the CLABE/account number.
          required:
          - id
          - createdAt
          - updatedAt
          - bankCode
          - bankName
          - country
          - verified
          - clabeLast
          - clabeFirst
          description: Bank account details when `type` is `MEXICAN_BANK_ACCOUNT`.
      required:
      - id
      - createdAt
      - updatedAt
      - customerId
      - type
      - confirmed
      - default
      - deletedAt
      - bankAccountId
      - expired
      description: Saved payment method associated with a customer.
    SetCustomerTaxInfoPayload:
      type: object
      properties:
        customerTaxInfo:
          $ref: '#/components/schemas/CustomerTaxInfo'
      required:
      - customerTaxInfo
      description: Created or updated customer tax profile.
    CustomerTaxInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the tax profile.
          example: cti_1234567890abcdefghij
        createdAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: When the tax profile was created.
        updatedAt:
          anyOf:
          - type: string
            description: Date string
          - type: string
            format: date-time
            description: Date object
          description: When the tax profile was last updated.
        customerId:
          type: string
          description: Customer that owns this tax profile.
          example: cus_1234567890abcdefghij
        legalName:
          type: string
          description: Legal name from the Constancia de Situacion Fiscal.
        default:
          type: boolean
          description: Whether this is the default tax profile.
          example: true
        defaultUsage:
          type: string
          description: Default CFDI usage code.
          example: G03
        taxId:
          type: string
          description: RFC.
          example: XAXX010101000
        taxSystem:
          type: string
          description: SAT tax regime code.
          example: '601'
        zip:
          type: string
          description: Fiscal address ZIP code.
          example: '06100'
        city:
          type: string
          nullable: true
          description: Fiscal address city.
          example: Ciudad de Mexico
        state:
          type: string
          nullable: true
          description: Fiscal address state.
          example: Ciudad de Mexico
        country:
          type: string
          nullable: true
          description: Fiscal address country.
          example: MEX
        neighborhood:
          type: string
          nullable: true
          description: Fiscal address neighborhood.
          example: null
        street:
          type: string
          nullable: true
          description: Fiscal address street.
          example: null
        outerNumber:
          type: string
          nullable: true
          description: Fiscal address exterior number.
          example: null
        innerNumber:
          type: string
          nullable: true
          description: Fiscal address interior number.
          example: null
      required:
      - id
      - createdAt
      - updatedAt
      - customerId
      - legalName
      - default
      - defaultUsage
      - taxId
      - taxSystem
      - zip
      - city
