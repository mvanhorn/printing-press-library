                          amount:
                            type: number
                          currency:
                            type: string
                        required:
                        - displayName
                        - amount
                        - currency
                      quantity:
                        type: number
                        minimum: 1
                      amount:
                        type: number
                        nullable: true
                        minimum: 0
                        maximum: 99999999999
                      currency:
                        type: string
                        nullable: true
                      description:
                        type: string
                        nullable: true
                        minLength: 1
                    required:
                    - quantity
