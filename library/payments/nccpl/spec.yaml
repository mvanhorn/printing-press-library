name: nccpl
description: "Pakistan's clearing-layer market data: investor-class flows, leverage-market positions, risk parameters and settlement reconciliation."
version: "0.1.0"
base_url: "https://www.nccpl.com.pk"
category: payments
spec_source: sniffed
http_transport: browser-chrome
health_check_path: "/api/fipi/latest-date"
cli_description: "Pakistan's clearing-layer data as a local research panel with a coverage audit and an arithmetic self-check, not another dashboard."

auth:
  type: composed
  header: "X-XSRF-TOKEN"
  format: "{XSRF-TOKEN}"
  cookie_domain: "www.nccpl.com.pk"
  cookies:
    - cf_clearance
    - nccpl-session
    - XSRF-TOKEN
  in: header
  env_vars: []

config:
  format: toml
  path: "~/.config/nccpl-pp-cli/config.toml"

cache:
  enabled: true
  stale_after: 24h

mcp:
  transport: [stdio, http]

learn:
  # No ticker_patterns. PSX symbols are ALL-CAPS (HUBC, OGDC, FFC) and
  # entities.Extract already classifies ALL-CAPS alphanumeric tokens as
  # entities. A lowercase pattern is INVERTED here: matchesTicker runs on the
  # RAW token before lowercasing, so "^[a-z0-9]{2,12}$" never matched a real
  # symbol and matched every ordinary word instead, emptying QueryFamily and
  # making every seeded playbook unreachable at recall time (20 failing tests).
  ticker_patterns: []
  synonyms:
    "foreign flows": "fipi"
    "local flows": "lipi"
    "foreigners": "fipi"
    "locals": "lipi"
    "short interest": "slb"
    "margin financing": "mts"
    "most recent": "latest"
  entity_lookup_seeds:
    investor_type:
      - canonical: "101"
        aliases: [all, everyone, all-investors]
      - canonical: "FI"
        aliases: [foreign individual, foreign individuals, foreign retail]
      - canonical: "FC"
        aliases: [foreign corporates, foreign corporate, foreign institutions, foreign institutional]
      - canonical: "FOP"
        aliases: [overseas pakistani, overseas pakistanis, non-resident, nrp]
      - canonical: "FN"
        aliases: [fipi net, foreign net, net foreign]
      - canonical: "LBD"
        aliases: [banks, banks/dfi, banks dfi, dfi, commercial banks]
      - canonical: "LBP"
        aliases: [brokers, broker proprietary trading, broker prop, proprietary]
      - canonical: "LC"
        aliases: [companies, corporates, local companies]
      - canonical: "LI"
        aliases: [individuals, retail, local individuals]
      - canonical: "LN"
        aliases: [lipi net, local net, net local]
      - canonical: "LMF"
        aliases: [mutual funds, mutual fund, funds, mf]
      - canonical: "LNB"
        aliases: [nbfc, non-banking finance, non banking finance companies]
      - canonical: "IC"
        aliases: [insurance, insurance companies, insurers]
      - canonical: "LOO"
        aliases: [other organization, other organisations, other, others]
    market_segment:
      - canonical: "EQUITY"
        aliases: [equities, equity market, stock market, cash market]
      - canonical: "DEBT"
        aliases: [debt market, bonds, fixed income]

resources:
  fipi:
    description: "Foreign Investors Portfolio Investment (FIPI) net flows by investor class and market segment."
    endpoints:
      latest-date:
        method: GET
        path: "/api/fipi/latest-date"
        no_auth: true
        description: "Most recent publication date available for fipi. Needs Cloudflare clearance only; no CSRF or session."
        example: "  nccpl-pp-cli fipi latest-date --json"
        response:
          type: object
          item: LatestDate
        response_format: json
      data:
        method: POST
        path: "/api/fipi/data"
        mutation: false
        description: "Foreign Investors Portfolio Investment (FIPI) net flows by investor class and market segment. Date range. NOTE: this endpoint requires DD/MM/YYYY dates, unlike the sector-wise and single-date endpoints which use YYYY-MM-DD."
        example: "  nccpl-pp-cli fipi data --from-date 01/09/2026 --to-date 04/09/2026 --type 101 --json"
        happy_args: "--from-date=01/09/2026;--to-date=04/09/2026;--type=101"
        body:
          - name: fromDate
            type: string
            required: true
            positional: false
            description: "Range start in DD/MM/YYYY format (for example 01/09/2026). NOT YYYY-MM-DD - this endpoint differs from the sector-wise endpoints."
          - name: toDate
            type: string
            required: true
            positional: false
            description: "Range end in DD/MM/YYYY format (for example 04/09/2026)."
          - name: type
            type: string
            required: true
            positional: false
            default: "101"
            description: "FIPI investor class code. 101 returns all classes."
            enum: [101, FI, FC, FOP, FN]
        response:
          type: array
          item: FlowRow
        response_path: data
        response_format: json
  lipi:
    description: "Local Investors Portfolio Investment (LIPI) net flows by investor class and market segment."
