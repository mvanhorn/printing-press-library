        description: "Trade versus settlement volume and value, UIN-wise, per symbol. Single settlement date. The 'date' field must be YYYY-MM-DD."
        example: "  nccpl-pp-cli settlement-uin data --date 2026-09-04 --json"
        happy_args: "--date=2026-09-04"
        body:
          - name: date
            type: string
            required: true
            positional: false
            description: "Settlement date in YYYY-MM-DD format (for example 2026-09-04)."
        response:
          type: array
          item: SettlementRow
        response_path: sett
        response_format: json
  settlement-cm:
    description: "Trade versus settlement volume and value, clearing-member-wise, per symbol."
    endpoints:
      latest-date:
        method: GET
        path: "/api/sett-info-cm-wise/latest-date"
        no_auth: true
        description: "Most recent publication date available for settlement-cm. Needs Cloudflare clearance only; no CSRF or session."
        example: "  nccpl-pp-cli settlement-cm latest-date --json"
        response:
          type: object
          item: LatestDate
        response_format: json
      data:
        method: POST
        path: "/api/sett-info-cm-wise/data"
        mutation: false
        description: "Trade versus settlement volume and value, clearing-member-wise, per symbol. Single settlement date. The 'date' field must be YYYY-MM-DD."
        example: "  nccpl-pp-cli settlement-cm data --date 2026-09-04 --json"
        happy_args: "--date=2026-09-04"
        body:
          - name: date
            type: string
            required: true
            positional: false
            description: "Settlement date in YYYY-MM-DD format (for example 2026-09-04)."
        response:
          type: array
          item: SettlementCMRow
        response_path: sett
        response_format: json
  tfc:
    description: "Unlisted Term Finance Certificate (TFC) transactions."
    endpoints:
      latest-date:
        method: GET
        path: "/api/un-listed-tfc/latest-date"
        no_auth: true
        description: "Most recent publication date available for tfc. Needs Cloudflare clearance only; no CSRF or session."
        example: "  nccpl-pp-cli tfc latest-date --json"
        response:
          type: object
          item: LatestDate
        response_format: json
      data:
        method: POST
        path: "/api/un-listed-tfc/data"
        mutation: false
        description: "Unlisted Term Finance Certificate (TFC) transactions. Single settlement date. The 'date' field must be YYYY-MM-DD."
        example: "  nccpl-pp-cli tfc data --date 2026-09-04 --json"
        happy_args: "--date=2026-09-04"
        body:
          - name: date
            type: string
            required: true
            positional: false
            description: "Settlement date in YYYY-MM-DD format (for example 2026-09-04)."
        response:
          type: array
          item: TFCTrade
        response_path: tfc
        response_format: json
  market:
    description: "Market-wide traded value and volume series."
    endpoints:
      latest:
        method: GET
        path: "/api/graph-data/latest-data"
        no_auth: true
        mutation: false
        description: "Most recent market-wide traded value or volume series. Needs Cloudflare clearance only."
        example: "  nccpl-pp-cli market latest --graph-type value --limit 30 --json"
        happy_args: "--graph-type=value;--limit=30"
        params:
          - name: graph_type
            flag_name: graph-type
            type: string
            required: true
            positional: false
            default: "value"
            description: "Series to return: value (traded value) or volume (traded volume)."
            enum: [value, volume]
          - name: limit
            type: int
            required: false
            positional: false
            default: 30
            description: "Number of trailing sessions to return."
        response:
          type: object
          item: GraphSeries
        response_format: json
      range:
        method: POST
        path: "/api/graph-data/data-by-date-range"
        mutation: false
        description: "Market-wide traded value or volume series over an explicit date range. Sent as multipart/form-data with YYYY-MM-DD dates."
        example: "  nccpl-pp-cli market range --start-date 2026-03-01 --end-date 2026-09-04 --graph-type value --json"
        happy_args: "--start-date=2026-08-01;--end-date=2026-09-04;--graph-type=value"
        body:
          - name: start_date
            flag_name: start-date
            type: string
            required: true
            positional: false
            description: "Range start in YYYY-MM-DD format."
          - name: end_date
            flag_name: end-date
            type: string
            required: true
            positional: false
            description: "Range end in YYYY-MM-DD format."
          - name: graph_type
            flag_name: graph-type
            type: string
            required: true
            positional: false
            default: "value"
            description: "Series to return: value or volume."
            enum: [value, volume]
        response:
          type: object
          item: GraphSeries
        response_format: json

