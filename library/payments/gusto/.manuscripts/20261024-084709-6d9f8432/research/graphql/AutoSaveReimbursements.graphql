  __typename
  benefitIdsAreNotUniqueErrors
  bonusEarningsErrors
  cashTipsEarningsErrors
  commissionEarningsErrors
  correctionPaymentEarningsErrors
  customEarningsErrors
  customWithholdingErrors
  doubleOvertimeHoursErrors
  employeeId
  employeeJobCompensationMissingErrors
  employeeJobMissingErrors
  employeePayScheduleMismatchErrors
  missedBreakHoursErrors
  missingAddressErrors
  multipleJobsBonusEarningsErrors
  multipleJobsCashTipsEarningsErrors
  multipleJobsCommissionEarningsErrors
  multipleJobsCorrectionPaymentEarningsErrors
  multipleJobsCustomEarningsErrors
  multipleJobsDoubleOvertimeHoursErrors
  multipleJobsMissedBreakHoursErrors
  multipleJobsOvertimeHoursErrors
  multipleJobsOwnersDrawEarningsErrors
  multipleJobsPaycheckTipsEarningsErrors
  multipleJobsRegularHoursErrors
  multipleJobsSeveranceEarningsErrors
  netPayErrors
  overtimeHoursErrors
  ownersDrawDisallowedInputsErrors
  ownersDrawEarningsErrors
  paidHolidayHoursErrors
  paidTimeOffHoursErrors
  paycheckTipsEarningsErrors
  paymentMethodMustBeCheckErrors
  regularHoursErrors
  reimbursementsErrors
  severanceEarningsErrors
  sickHoursErrors
  taxErrors
  totalHoursDoNotFitInPaymentPeriodErrors
  workAddressNotFoundErrors
}

fragment TopLevelPayrollValidationErrorHelper on DraftPayrollValidationError {
  id
  paymentPeriodEndAtRequiredErrors
  payrollAlreadySuccessfullyRunErrors
  payrollBuildErrors
  payrollCurrentlyProcessingErrors
  payrollInputsErrors
  regularPaymentPeriodIsUniqueErrors
  __typename
}