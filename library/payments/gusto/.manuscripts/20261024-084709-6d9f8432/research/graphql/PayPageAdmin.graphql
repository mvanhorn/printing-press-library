query PayPageAdmin($autoSubmissionEnabled: Boolean!, $eorRemoteMigrationBannerActive: Boolean!, $hasPayContractorCapability: Boolean!, $hasPayEmployeeCapability: Boolean!, $manageCompanyOnboardingPermissionActive: Boolean!, $mjpFirstPaydaySearchEndDate: ISO8601Date!, $mjpSwitcherAwaitingNextYearActive: Boolean!, $offCycleReasons: [OffCycleReason!], $timeTrackingActivationPromptActive: Boolean!, $usePayrollIdentifierOffCycle: Boolean!) {
  company {
    id
    canRunPayroll
    companyOnboardingCurrentExperienceType @include(if: $manageCompanyOnboardingPermissionActive)
    finishedOnboardingAt
    isApproved
    isMigrationDashboardFeatureEnabled
    isOnboarding
    isSuspended
    legalEntities {
      nodes {
        ...LegalEntityCountryCode
        __typename
      }
      __typename
    }
    name
    payrollBlockerNotifications @include(if: $hasPayEmployeeCapability) {
      title
      __typename
    }
    suspension {
      id
      suspendedAt
      __typename
    }
    ...DraftOffCyclePayrollsContextProviderCompany @include(if: $hasPayEmployeeCapability)
    ...DraftPayrollsSectionCompany @include(if: $hasPayEmployeeCapability)
    ...EorRemoteMigrationAlertCompany @include(if: $eorRemoteMigrationBannerActive)
    ...MjpSwitcherAwaitingNextYearCompany @include(if: $mjpSwitcherAwaitingNextYearActive)
    ...OtherPayrollOptionsCardContainerCompany
    ...PayContractorsPageSectionCompany
    ...PayPageCriticalAlertsCompany @include(if: $hasPayEmployeeCapability)
    ...PayPageOptionalAlertsCompany @include(if: $hasPayEmployeeCapability)
    ...PayPagePromotionsCompany @include(if: $hasPayEmployeeCapability)
    ...PayrollBlockerPageSectionCompany @include(if: $hasPayEmployeeCapability)
    ...PayrollNotSetupPageSectionCompany @include(if: $hasPayEmployeeCapability)
    ...PayrollUpNextPageSectionCompany @include(if: $hasPayEmployeeCapability)
    __typename
  }
  ...PayPagePromotionsQuery @include(if: $hasPayEmployeeCapability)
}

fragment LegalEntityCountryCode on LegalEntity {
  id
  countryCode
  __typename
}

fragment DraftOffCyclePayrollsContextProviderCompany on Company {
