  hasBonusDraftOffCycles: hasDraftOffCycleType(offCycleType: bonus)
  hasCorrectionDraftOffCycles: hasDraftOffCycleType(offCycleType: correction)
  ...CompanyMemberCoreActiveInternationalEmployeeCount
  __typename
}

