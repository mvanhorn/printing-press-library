query PayrollReviewStep($draftPayrollId: ID!, $hasAccessToPayrollBridge: Boolean!) {
  company {
    id
    achFundingMethods {
      id
      ...PayrollReviewStepFundingMethod
      __typename
    }
    activeTierSubscription {
      edges {
        baseFee
        name
        perEmployeeFee
        __typename
      }
      __typename
    }
    analyticsId
    companyOnboardingPackageRecommendation {
      id
      recommendedPlan
      selectedPlan
      __typename
    }
    draftPayroll(uuid: $draftPayrollId) {
      ...PayrollReviewStepDraftPayroll
      __typename
    }
    firstPayDay
    hasRunPayroll
    isPeoClient
    payScheduleSchemeName
    subscriptions {
      edges {
        node {
          id
          prices {
            __typename
            ...CommercePriceBase
          }
          product {
            id
            namespace
            __typename
          }
          __typename
        }
        startOn
        __typename
      }
      __typename
    }
    ...CompanyMemberCoreVerifiedActiveEmployeeCount
    ...PaymentOptionsSummaryCompany
    ...PaymentSummaryCompany
    ...PayrollFooterCompany
    ...PayrollTaxBreakdownAccordionCompany
    ...UseRiskFeaturesCompany
    ...WireInPaymentOptionsDialogsCompany
    __typename
  }
}

fragment PayrollReviewStepFundingMethod on FundingMethod {
  id
  ...PayFundingMethodsInputFundingMethod
  __typename
}

fragment PayrollReviewStepDraftPayroll on DraftPayroll {
  id
  analyticsId
  payroll {
    id
    __typename
  }
  payrollRisk {
    id
    ...PayrollBridgePaymentRisk
    __typename
  }
  paySchedule {
    id
    autoPilot
    __typename
  }
  ...DismissalFinalPayAlertDraftPayroll
  ...EmployeeHoursAndEarningsAccordionDraftPayroll
  ...FasterPaymentOptionsDraftPayroll
  ...MoveToFourDayDialogDraftPayroll
  ...PaymentOptionsSummaryDraftPayroll
  ...PaymentSummaryDraftPayroll
  ...PayrollBlockedAlertDraftPayroll
  ...PayrollCompanyCostsAccordionDraftPayroll
  ...PayrollDeletedDialogDraftPayroll
  ...PayrollFooterDraftPayroll
  ...PayrollProcessedDialogDraftPayroll
  ...PayrollReviewUpsellDraftPayroll
  ...PayrollStepHeaderDraftPayroll
  ...PayrollSubmissionReminderDialogDraftPayroll
  ...PayrollTaxBreakdownAccordionDraftPayroll
  ...ReverseWireAlertDraftPayroll
  ...UseRiskFeaturesDraftPayroll
  ...UseShowAnomalyDetectionUIDraftPayroll
  ...WireInPaymentOptionsDialogsDraftPayroll
  ...ZeroCheckAmountInfoAlertDraftPayroll
  __typename
}

fragment CommercePriceBase on CommercePrice {
  id
  __typename
  frequency
  ... on CommercePriceFlat {
    amount {
      amount
      currencyCode
      __typename
    }
    __typename
  }
  ... on CommercePricePerUnit {
    amount {
      amount
      currencyCode
      __typename
    }
    unitKey
    unitName
    __typename
  }
  ... on CommercePriceTiered {
    tieredPrices {
      id
      __typename
      ... on CommerceTieredPriceFlat {
        amount {
          amount
          currencyCode
          __typename
        }
        __typename
      }
      ... on CommerceTieredPricePerUnit {
        amount {
          amount
          currencyCode
          __typename
        }
        unitKey
        unitName
        __typename
      }
    }
    __typename
  }
  ... on CommercePriceUnknown {
    amount {
      amount
      currencyCode
      __typename
    }
    __typename
  }
}

