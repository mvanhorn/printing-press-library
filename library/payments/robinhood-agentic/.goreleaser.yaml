version: 2
project_name: robinhood-agentic-pp-cli
changelog:
  disable: true
builds:
  - id: robinhood-agentic-pp-cli
    main: ./cmd/robinhood-agentic-pp-cli
    binary: robinhood-agentic-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/payments/robinhood-agentic/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: robinhood-agentic-pp-mcp
    main: ./cmd/robinhood-agentic-pp-mcp
    binary: robinhood-agentic-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: robinhood-agentic-pp-cli
    repository:
      owner: kevin-magnan
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every tool on Robinhood's official Agentic Trading MCP as a typed, review-first CLI — sanctioned OAuth instead of scraped tokens, plus an offline portfolio journal no Robinhood tool ships."
    install: |
      bin.install "robinhood-agentic-pp-cli"
      bin.install "robinhood-agentic-pp-mcp"
