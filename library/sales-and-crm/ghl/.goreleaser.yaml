version: 2
project_name: ghl-pp-cli
changelog:
  disable: true
builds:
  - id: ghl-pp-cli
    main: ./cmd/ghl-pp-cli
    binary: ghl-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/sales-and-crm/ghl/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ghl-pp-mcp
    main: ./cmd/ghl-pp-mcp
    binary: ghl-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ghl-pp-cli
    repository:
      owner: alex-puckhaber
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every GoHighLevel surface that matters for a marketing/CRM operator — with offline SQL, kill-switch tag awareness,..."
    install: |
      bin.install "ghl-pp-cli"
      bin.install "ghl-pp-mcp"
