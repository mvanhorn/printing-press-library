version: 2
project_name: clay-pp-cli
changelog:
  disable: true
builds:
  - id: clay-pp-cli
    main: ./cmd/clay-pp-cli
    binary: clay-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/sales-and-crm/clay/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: clay-pp-mcp
    main: ./cmd/clay-pp-mcp
    binary: clay-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: clay-pp-cli
    repository:
      owner: adeamos83
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The only Clay tool that can build a table, not just read one."
    install: |
      bin.install "clay-pp-cli"
      bin.install "clay-pp-mcp"
