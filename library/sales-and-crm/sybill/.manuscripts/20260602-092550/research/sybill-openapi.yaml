        description: Upper bound for close date (ISO 8601, e.g. 2025-06-30T00:00:00Z)
      - name: closeDateAfter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lower bound for close date (ISO 8601)
          title: Closedateafter
        description: Lower bound for close date (ISO 8601)
      - name: amountMin
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Minimum deal amount
          title: Amountmin
        description: Minimum deal amount
      - name: amountMax
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Maximum deal amount
          title: Amountmax
        description: Maximum deal amount
      - name: lastActivityBefore
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Upper bound for last activity date (ISO 8601)
          title: Lastactivitybefore
        description: Upper bound for last activity date (ISO 8601)
      - name: lastActivityAfter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lower bound for last activity date (ISO 8601)
          title: Lastactivityafter
        description: Lower bound for last activity date (ISO 8601)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Maximum number of results per page (1-50)
          default: 20
          title: Limit
        description: Maximum number of results per page (1-50)
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor from a previous response
          title: Cursor
        description: Opaque pagination cursor from a previous response
      responses:
        '200':
          description: Successful Response
          content:
