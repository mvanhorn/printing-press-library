openapi: 3.1.0
info:
  title: Sybill API
  version: 0.1.0-alpha
  description: 'Programmatic access to your Sybill workspace — conversations, insights,
    and AI-powered analysis.


    **Alpha:** Endpoints, request/response schemas, rate limits, and behavior may
    change at any time without prior notice.'
  contact:
    name: Sybill
    url: https://www.sybill.ai
paths:
  /v1/health:
    get:
      summary: Health Check
      operationId: health_check_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check V1 Health Get
      security:
      - HTTPBearer: []
  /v1/conversations:
    get:
      summary: List Conversations
      description: List conversations accessible to the API key's organization.
      operationId: list_conversations_v1_conversations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Maximum number of results per page (1-50)
          default: 20
          title: Limit
        description: Maximum number of results per page (1-50)
      - name: startedAfter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lower bound for meeting start time (ISO 8601)
          title: Startedafter
        description: Lower bound for meeting start time (ISO 8601)
      - name: startedBefore
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Upper bound for meeting start time (ISO 8601)
          title: Startedbefore
        description: Upper bound for meeting start time (ISO 8601)
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by meeting type (e.g. EXTERNAL, INTERNAL)
          title: Type
        description: Filter by meeting type (e.g. EXTERNAL, INTERNAL)
      - name: title
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by meeting title (case-insensitive partial match)
          title: Title
        description: Filter by meeting title (case-insensitive partial match)
      - name: attendees
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by an attendee. Accepts three shapes: a participant
            name fragment (e.g. `John`, case-insensitive partial match), a full participant
            email (e.g. `alice@acme.com`, exact match), or a participant company domain
            (e.g. `@acme.com` or `acme.com`, exact match against the email domain).'
          title: Attendees
        description: 'Filter by an attendee. Accepts three shapes: a participant name
          fragment (e.g. `John`, case-insensitive partial match), a full participant
          email (e.g. `alice@acme.com`, exact match), or a participant company domain
          (e.g. `@acme.com` or `acme.com`, exact match against the email domain).'
      - name: crmName
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by associated CRM deal or account name (case-insensitive
            exact-phrase match). Multi-word queries match the full phrase, not individual
            tokens.
          title: Crmname
        description: Filter by associated CRM deal or account name (case-insensitive
          exact-phrase match). Multi-word queries match the full phrase, not individual
          tokens.
      - name: sourceId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by conversation origin. Accepts a reserved native string
            (e.g. `sybill`, `gong`, `chorus`, `fathom`, `grain`, `mindtickle`, `avoma`,
            `fireflies`, `zoho_meetings`, `uploaded_call`, `uploaded_transcript`,
            `sdk_upload`, `zoom_phone`, `outreach_dialer`), or a public-API ``IngestSource``
            UUID to narrow to conversations ingested through that source. Omitted
            means all origins.
          title: Sourceid
        description: Filter by conversation origin. Accepts a reserved native string
          (e.g. `sybill`, `gong`, `chorus`, `fathom`, `grain`, `mindtickle`, `avoma`,
          `fireflies`, `zoho_meetings`, `uploaded_call`, `uploaded_transcript`, `sdk_upload`,
          `zoom_phone`, `outreach_dialer`), or a public-API ``IngestSource`` UUID
          to narrow to conversations ingested through that source. Omitted means all
          origins.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor from a previous response
          title: Cursor
        description: Opaque pagination cursor from a previous response
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConversationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Ingest Conversation
      operationId: ingest_conversation_v1_conversations_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Conversation Ingest
      operationId: delete_conversation_ingest_v1_conversations_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: remoteId
        in: query
        required: true
        schema:
          type: string
          title: Remoteid
      - name: sourceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Sourceid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedRecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
