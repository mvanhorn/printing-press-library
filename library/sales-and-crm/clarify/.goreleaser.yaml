version: 2
project_name: clarify-pp-cli
changelog:
  disable: true
builds:
  - id: clarify-pp-cli
    main: ./cmd/clarify-pp-cli
    binary: clarify-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/sales-and-crm/clarify/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: clarify-pp-mcp
    main: ./cmd/clarify-pp-mcp
    binary: clarify-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: clarify-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//clarify-pp-cli"
    description: "Every Clarify API operation as a typed command, plus the morning briefing, meeting prep, and pipeline analytics the autonomous CRM knows about but cannot run."
    install: |
      bin.install "clarify-pp-cli"
      bin.install "clarify-pp-mcp"
