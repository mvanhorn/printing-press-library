                      type: string
                      required: true
                      positional: false
                      default: acknowledgement
                      description: GraphQL operation name
                      fields: []
                    - name: query
                      type: string
                      required: false
                      positional: false
                      default: |-
                        query acknowledgement($featureFlag: ID!) {
                          acknowledgement(id: $featureFlag) {
                            id
                            level
                            __typename
                          }
                        }
                      description: GraphQL query document
                      fields: []
                    - name: variables
                      type: object
                      required: false
                      positional: false
                      default:
                        featureFlag: feature::has-sent-magic-link
                      description: GraphQL variables as JSON
                      fields: []
                    - name: extensions
                      type: object
                      required: false
                      positional: false
                      default:
                        clientLibrary:
                            name: '@apollo/client'
                            version: 4.1.9
                      description: GraphQL extensions as JSON
                      fields: []
                response:
                    type: array
                    item: acknowledgement
                pagination: null
                observed_auth:
                    - x-castle-request-token
                    - x-csrf-token
