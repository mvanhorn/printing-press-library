name: ignition
description: Discovered API spec for go-ignitionapp
version: 0.1.0
base_url: https://go.ignitionapp.com
spec_source: sniffed
auth:
    type: cookie
    header: Cookie
    format: ""
    env_vars:
        - IGNITION_SESSION_COOKIE
category: sales-and-crm
http_transport: browser-chrome
auth_warnings:
    - 'rejected auth candidate "query" from body: search input'
    - 'Ignition also requires an X-CSRF-Token header (from the page meta[name=csrf-token]); wired via internal/client/ignition_headers.go, sourced from IGNITION_CSRF_TOKEN'
config:
    format: toml
    path: ~/.config/ignition-pp-cli/config.toml
resources:
