                              isCustomPlan
                              isLegacyPlan
                              isOrganizationManaged
                              isTrial
                              notifiedOfImminentPlanUpgradeOn
                              planCode
                              planName
                              planTier
                              renewDate
                              status
                              subscriptionCurrency {
                                isoCode
                                __typename
                              }
                              __typename
                            }
                            __typename
