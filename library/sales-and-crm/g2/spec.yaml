                    updated_at: '2022-01-01T00:00:00.000-06:00'
                    file_name: g2.png
                    title: G2.com
                    description:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        required:
                        - created_at
                        - url
                        properties:
                          id:
                            type: string
                          product_id:
                            type: string
                          url:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          file_name:
                            type: string
                          title:
                            type: string
                          description:
                            type: string
                            nullable: true
                  included:
                    "$ref": "#/components/schemas/included"
  "/api/v2/buyer_intent":
    get:
      summary: Browse buyer intent interactions (product-agnostic)
      operationId: getGlobalBuyerIntentInteractions
      tags:
      - Buyer Intent
      description: |
        **Requires `buyer_intent.read` scope.**

        Query buyer intent data across one or more products in a single request.
        Pass product_id to specify which products, or omit to use your assigned products.
        Supports multi-product queries — the data is not scoped to a single subject product.
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: dimensions
        in: query
        explode: false
        description: Comma separated list of dimensions
        schema:
          type: array
          items:
            type: string
            enum:
            - signal_type
            - time
            - day
            - week
            - month
            - company_id
            - company_name
            - company_domain
            - company_country
            - company_state
            - company_city
            - company_employees
            - company_industry
            - visitor_id
            - visitor_country
            - visitor_state
            - visitor_city
            - product_id
            - product_slug
            - product_name
            - category_id
            - category_slug
            - category_name
            - left_product_id
            - left_product_slug
            - left_product_name
            - right_product_id
            - right_product_slug
            - right_product_name
            - vendor_id
            - vendor_slug
            - vendor_name
            - provider
      - name: measures
        in: query
        explode: false
        description: Comma separated list of measures
        schema:
          type: array
          items:
            type: string
            enum:
            - total_activity
            - visitor_count
            - company_count
            - last_seen_at
      - name: subject_product_ids
        in: query
        description: One or more product IDs, UUIDs, or URL slugs (comma-separated)
          that scope the permissions of this query. Defaults to your assigned products.
        schema:
          type: string
      - name: sort
        in: query
        description: Sort field with optional direction prefix. Use "-" for descending
          (e.g., "-day")
        schema:
          type: string
      - name: page[size]
        in: query
        description: 'Number of records per page (default: 10, max: 100)'
        schema:
          type: integer
      - name: dimension_filters
        in: query
        style: deepObject
        explode: true
        description: Filters represented as query object (e.g., dimension_filters[company_name_cont]=Acme)
        schema:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: string
              format: date-time
          example:
            company_name_cont: Acme
            provider_in: g2
            audience_product_id_in: "<product-uuid-or-slug>"
      responses:
        '200':
          description: Successful responses
          content:
            application/vnd.api+json:
              examples:
                Company-level activity:
                  value:
                    data:
                    - id: 4e461029a40e1748cb562a87a581125d
                      type: buyer_intent
                      attributes:
                        total_activity: 150
                        company_name: Enterprise Corp
                        company_domain: enterprise.com
                    links:
                      self: http://data.example.com/api/v2/buyer_intent?dimensions=company_name,company_domain&measures=total_activity&subject_product_ids=4d4226d5-4959-4648-8fd2-000000000001&sort=&page%5Bsize%5D=10&
                      next:
                      prev:
                With provider dimension:
                  value:
                    data:
                    - id: c72be8462054890d1a74760c5919cfe2
                      type: buyer_intent
                      attributes:
                        total_activity: 80
                        company_name: Enterprise Corp
                        provider: g2
                    - id: 57a93f21a6b22c62794813e31c9aabf5
                      type: buyer_intent
                      attributes:
                        total_activity: 70
                        company_name: Enterprise Corp
                        provider: capterra
                    links:
                      self: http://data.example.com/api/v2/buyer_intent?dimensions=company_name,provider&measures=total_activity&subject_product_ids=4d4226d5-4959-4648-8fd2-000000000001&sort=&page%5Bsize%5D=10&
                      next:
                      prev:
                Summary of data volume:
                  value:
                    data:
                    - id: 075541525d161a64bcfeaf1315997704
                      type: buyer_intent
                      attributes:
                        total_activity: 1250
                        visitor_count: 450
                        company_count: 150
                    links:
                      self: http://data.example.com/api/v2/buyer_intent?dimensions=&measures=company_count,visitor_count,total_activity&subject_product_ids=4d4226d5-4959-4648-8fd2-000000000001&sort=&page%5Bsize%5D=10&
                      next:
                      prev:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            company_id:
                              type: string
                              description: Unique company identifier
                            company_name:
                              type: string
                              description: Company name
                            company_domain:
                              type: string
                              description: Company website domain
                            total_activity:
                              type: integer
                              description: Total page views and interactions
                            provider:
                              type: string
                              description: Data provider (g2, capterra)
                      required:
                      - id
                      - type
                      - attributes
