---
openapi: 3.0.1
info:
  title: G2 API
  version: v2
  description: |
    G2 Marketplace API — products, reviews, vendors, categories, buyer intent,
    market signals, screenshots, credit accounting, and research boards.
    Authentication requires either a G2 OAuth2 token (`G2_OAUTH_TOKEN`) or an
    Account API Token (`G2_API_KEY`). A paid G2 Sell-tier subscription is
    required for production endpoints.
x-mcp:
  transport: [stdio, http]
paths:
  "/api/sandbox/products/{subject_product_id}/buyer_intent":
    get:
      summary: Browse sandbox buyer intent interactions for a product
      operationId: getSandboxBuyerIntentInteractions
      tags:
      - Buyer Intent
      description: |
        **No scope is required to access this sandbox endpoint**

        **⚠️ Sandbox API**: This endpoint is a sandbox endpoint and is data limited. Only data between 6 months to 1 year ago will be available.

        Query buyer intent data using an analytical query interface.

        ## Query Language

        This endpoint uses an OLAP-style query language that supports:
        - **Dimensions**: Group and categorize data (e.g., company_name, company_domain, day)
        - **Measures**: Aggregate numerical values (e.g., total_activity, visitor_count)
        - **Filters**: Apply conditions to limit results

        ### Filter Operators
        Filters use the format `dimension_filters[name_suffix]` where `name`
        is the dimension name and `suffix` indicates the operation:

        - `_eq`: Equals (exact match)
        - `_not_eq`: Not equals
        - `_cont`: Contains (substring match)
        - `_not_cont`: Does not contain
        - `_gt`: Greater than
        - `_gteq`: Greater than or equal
        - `_lt`: Less than
        - `_lteq`: Less than or equal
        - `_present`: Field has a value
        - `_empty`: Field is empty

        ### Time Series vs Aggregated Data
        - **Aggregated**: Request dimensions without `day` for company-level summaries
        - **Time Series**: Include `day` dimension for daily breakdowns over time

        ### Sorting Results
        Use the `sort` parameter to order results by any dimension or measure:
        - **Ascending**: `sort=company_name` or `sort=total_activity`
        - **Descending**: `sort=-company_intent_score` (prefix with `-`)
        - **Default**: Results are sorted by `-company_intent_score` (highest intent first)

        Available sort fields include all dimensions and measures listed above.

        ### Examples
        - Company summary: `dimensions=company_name,company_domain&measures=total_activity`
        - Time series: `dimensions=company_name,day&measures=company_intent_score`
        - Filtered: `dimension_filters[company_name_cont]=Acme&dimensions=company_name`
        - Sorted by activity: `dimensions=company_name&measures=total_activity&sort=-total_activity`
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: subject_product_id
        in: path
        description: Identifier for the subject product
        required: true
        schema:
          type: string
      - name: dimensions
        in: query
        explode: false
        description: Comma separated list of dimensions
        schema:
          type: array
          items:
            type: string
            enum:
            - signal_type
            - time
            - day
            - week
            - month
            - company_id
            - company_name
            - company_domain
            - company_country
            - company_state
            - company_city
            - company_employees
            - company_industry
            - visitor_id
            - visitor_country
            - visitor_state
            - visitor_city
            - company_intent_score
            - product_id
            - product_slug
            - product_name
            - category_id
            - category_slug
            - category_name
            - left_product_id
            - left_product_slug
            - left_product_name
            - right_product_id
            - right_product_slug
            - right_product_name
            - vendor_id
            - vendor_slug
            - vendor_name
            - provider
      - name: measures
        in: query
        explode: false
        description: Comma separated list of measures
        schema:
          type: array
          items:
            type: string
            enum:
            - total_activity
            - visitor_count
            - company_count
            - last_seen_at
      - name: sort
        in: query
        description: Sort field with optional direction prefix. Use "-" for descending
          (e.g., "-day")
        schema:
          type: string
      - name: page[size]
        in: query
        description: 'Number of records per page (default: 10, max: 100)'
        schema:
          type: integer
      - name: dimension_filters
        in: query
        style: deepObject
        explode: true
        description: Filters represented as query object (e.g., dimension_filters[company_name_cont]=Acme)
        schema:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: string
              format: date-time
          example:
            company_name_cont: Acme
            company_intent_score_gteq: 75
            day_gteq: '2024-01-01'
      responses:
        '200':
          description: Successful responses
          content:
            application/vnd.api+json:
              examples:
                Company-level intent score:
                  value:
                    data:
                    - id: 1fdf442713ea42ef94d0a50d5ade2b90
                      type: buyer_intent
                      attributes:
                        total_activity: 150
                        company_name: Enterprise Corp
                        company_domain: enterprise.com
                        company_state: New York
                        company_intent_score: 85.5
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-1
                    links:
                      self: http://data.example.com/api/sandbox/products/f6d9f6d6-3ec1-4380-8525-000000000002/buyer_intent?dimensions=company_name,company_domain,company_state,company_intent_score&measures=total_activity&sort=-company_intent_score&page%5Bsize%5D=10&dimension_filters%5Bcompany_intent_score_gteq%5D=75
                      next:
                      prev:
                Company-level intent score by day:
                  value:
                    data:
                    - id: ee5807a89508ada6db6cc7ba0c68a943
                      type: buyer_intent
                      attributes:
                        total_activity: 25
                        day: '2024-01-15'
                        company_intent_score: 75.0
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-2
                    - id: 4968343b4a4f0aea3fa047ac49f1dfe8
                      type: buyer_intent
                      attributes:
                        total_activity: 35
                        day: '2024-01-16'
                        company_intent_score: 82.5
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-2
                    links:
                      self: http://data.example.com/api/sandbox/products/f6d9f6d6-3ec1-4380-8525-000000000002/buyer_intent?dimensions=company_intent_score,day&measures=total_activity&sort=-company_intent_score&page%5Bsize%5D=10&dimension_filters%5Bcompany_id_eq%5D=uuid-456&dimension_filters%5Bday_gteq%5D=2024-01-01
                      next:
                      prev:
                Company-level activity by signal type:
                  value:
                    data:
                    - id: 819a38b223da182364fca9dd7804c095
                      type: buyer_intent
                      attributes:
                        total_activity: 10
                        signal_type: profile
                        company_name: Enterprise Corp
                        company_domain: enterprise.com
                        company_state: New York
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-3
                    - id: 3de263ea81e5209ef3267df5b72b5f6d
                      type: buyer_intent
                      attributes:
                        total_activity: 5
                        signal_type: pricing
                        company_name: Enterprise Corp
                        company_domain: enterprise.com
                        company_state: New York
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-3
                    links:
                      self: http://data.example.com/api/sandbox/products/f6d9f6d6-3ec1-4380-8525-000000000002/buyer_intent?dimensions=company_name,company_domain,company_state,signal_type&measures=total_activity&sort=-company_intent_score&page%5Bsize%5D=10&
                      next:
                      prev:
                Visitor-level daily behavior:
                  value:
                    data:
                    - id: 32b9f90bfaaa95da90233d838cf31efc
                      type: buyer_intent
                      attributes:
                        total_activity: 5
                        signal_type: pricing
                        day: '2024-01-15'
                        company_name: Tech Solutions Inc
                        company_domain: techsolutions.com
                        visitor_id: visitor-123
                        visitor_country: United States
                        visitor_state:
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-4
                    links:
                      self: http://data.example.com/api/sandbox/products/f6d9f6d6-3ec1-4380-8525-000000000002/buyer_intent?dimensions=visitor_id,visitor_country,visitor_state,company_name,company_domain,signal_type,day&measures=total_activity&sort=-company_intent_score&page%5Bsize%5D=10&dimension_filters%5Bday_gteq%5D=2024-01-01
                      next:
                      prev:
                Summary of data volume:
                  value:
                    data:
                    - id: 90ec419e7ef84b2676f7526a634e1690
                      type: buyer_intent
                      attributes:
                        total_activity: 1250
                        visitor_count: 450
                        company_count: 150
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-5
                    links:
                      self: http://data.example.com/api/sandbox/products/f6d9f6d6-3ec1-4380-8525-000000000002/buyer_intent?dimensions=&measures=company_count,visitor_count,total_activity&sort=-company_intent_score&page%5Bsize%5D=10&
                      next:
                      prev:
                Data volume by topic (Product and Category):
                  value:
                    data:
                    - id: eca178c299b469658d86935b3977411a
                      type: buyer_intent
                      attributes:
                        total_activity: 30
                        visitor_count: 20
                        company_count: 10
                        product_slug: acme-product
                        category_slug: acme-category
                        subject_product_id: f6d9f6d6-3ec1-4380-8525-000000000002
                        subject_product_slug: test-product-6
                    links:
                      self: http://data.example.com/api/sandbox/products/f6d9f6d6-3ec1-4380-8525-000000000002/buyer_intent?dimensions=product_slug,category_slug&measures=company_count,visitor_count,total_activity&sort=-company_intent_score&page%5Bsize%5D=10&dimension_filters%5Bcompany_intent_score_gteq%5D=50
                      next:
                      prev:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            company_id:
                              type: string
                              description: Unique company identifier
                            company_name:
                              type: string
                              description: Company name
                            company_domain:
                              type: string
                              description: Company website domain
                            company_state:
                              type: string
                              description: Company location state
                            visitor_id:
                              type: string
                              description: Unique visitor identifier
                            company_intent_score:
                              type: number
                              description: Intent score (0-100)
                            total_activity:
                              type: integer
                              description: Total page views and interactions
                            day:
                              type: string
                              format: date
                              description: Date for time-series data
                            product_id:
                              type: string
                              nullable: true
                              description: Product UUID
                            category_id:
                              type: string
                              nullable: true
                              description: Category UUID
                            subject_product_id:
                              type: string
                              description: Subject product UUID
                            subject_product_slug:
                              type: string
                              description: Subject product slug
                      required:
                      - id
                      - type
                      - attributes
                  included:
                    "$ref": "#/components/schemas/included"
                  links:
                    "$ref": "#/components/schemas/cursor_pagination"
  "/api/v2/screenshots":
    get:
      summary: Lists screenshots
      operationId: getScreenshots
      tags:
      - Screenshots
      description: "**Requires `screenshots.read` scope.**\n"
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: filter[created_at_gt]
        in: query
        schema:
          type: string
        description: Min time for when a record was created. Using rfc3339 format.
      - name: filter[created_at_lt]
        in: query
        schema:
          type: string
        description: Max time for when a record was last updated. Using rfc3339 format.
      - name: filter[updated_at_gt]
        in: query
        schema:
          type: string
        description: Min time for when a record was last updated. Using rfc3339 format.
      - name: filter[updated_at_lt]
        in: query
        schema:
          type: string
        description: Max time for when a record was last updated. Using rfc3339 format.
      - name: fields[screenshots]
        in: query
        explode: false
        description: Comma separated list of fields for screenshots to include in
          response
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - product_id
            - url
            - created_at
            - updated_at
            - file_name
            - title
            - description
      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. product,vendor)
        schema:
          type: array
          items:
            type: string
            enum:
            - product
            - vendor
      responses:
        '400':
          description: with invalid request parameters
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: 'Invalid parameter: "include"             contains unknown
                    items: "foo"'
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: Unauthenticated
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '401'
                  title: Bad Credentials
              schema:
                "$ref": "#/components/schemas/Errors"
        '200':
          description: With all fields included
          content:
            application/vnd.api+json:
              example:
                data:
                - id: 1dadd35b-0e33-46db-8377-000000000002
                  type: screenshots
                  attributes:
                    product_id: 1dadd35b-0e33-46db-8377-000000000001
                    url: https://images.g2crowd.com/uploads/attachment/file/4/g2.png
                    created_at: '2021-12-01T00:00:00.000-06:00'
                    updated_at: '2022-01-01T00:00:00.000-06:00'
                    file_name: g2.png
                    title: G2.com
                    description:
                links:
                  self: http://data.example.com/api/v2/screenshots?filter%5Bcreated_at_gt%5D=&filter%5Bcreated_at_lt%5D=&filter%5Bupdated_at_gt%5D=&filter%5Bupdated_at_lt%5D=&fields%5Bscreenshots%5D=id,product_id,url,created_at,updated_at,file_name,title,description&include=product,vendor
                  next:
                  prev:
                meta:
                  record_count: 1
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          required:
                          - created_at
                          - product_id
                          - url
                          properties:
                            id:
                              type: string
                            product_id:
                              type: string
                            url:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                            file_name:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                              nullable: true
                      required:
                      - id
                      - type
                      - attributes
                  included:
                    "$ref": "#/components/schemas/included"
                  links:
                    "$ref": "#/components/schemas/cursor_pagination"
