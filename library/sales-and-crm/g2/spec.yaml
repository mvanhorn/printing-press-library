    post:
      summary: Submit or update a review for a product
      operationId: submitCurrentUserProductReview
      tags:
      - Reviews
      description: |
        **⚠️ G2 is currently restricting access to this endpoint.**
         This endpoint allows the user to submit or update a review for a specific product.
         The review is based on predefined questions and answers.'
      security:
      - AccountAPIToken: []
        G2OAuth:
        - openid
        - profile
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
      - name: fields[reviews]
        in: query
        explode: false
        description: Comma separated list of fields for reviews to include in response
        schema:
          type: array
          items:
            type: string
            enum:
            - questions
            - published_at
            - submitted_at
            - user_updated_at
            - url
      - name: include
        in: query
        explode: false
        description: Comma-separated list of relationships to include (e.g. user,answers)
        schema:
          type: array
          items:
            type: string
            enum:
            - user
            - answers
      responses:
        '201':
          description: Review successfully submitted
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            placeholder:
                              type: string
                              nullable: true
                            is_required:
                              type: boolean
                            question_type:
                              type: string
                            format:
                              type: string
                              nullable: true
                            min:
                              type: number
                              nullable: true
                            max:
                              type: number
                              nullable: true
                            choices:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  key:
                                    type: string
                                  value:
                                    type: string
                      url:
                        type: string
                        nullable: true
                      submitted_at:
                        type: string
                      published_at:
                        type: string
                      user_updated_at:
                        type: string
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        attributes:
                          type: object
        '400':
          description: Invalid review submission
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '403':
          description: Not Authorized
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                terms_accepted:
                  type: boolean
                  default: true
                privacy_policy_accepted:
                  type: boolean
                  default: true
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id:
                        type: string
                      value:
                        description: Answer value matching the format of the question
                        oneOf:
                        - type: string
                        - type: number
                        - type: array
                          items:
                            type: string
                    required:
                    - question_id
                    - value
                landing_page_id:
                  type: string
                source_type:
                  type: string
                utm_param_id:
                  type: string
              required:
              - answers
        required: true
        description: Review answers payload
