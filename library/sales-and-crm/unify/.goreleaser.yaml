version: 2
project_name: unify-pp-cli
changelog:
  disable: true
builds:
  - id: unify-pp-cli
    main: ./cmd/unify-pp-cli
    binary: unify-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/sales-and-crm/unify/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: unify-pp-mcp
    main: ./cmd/unify-pp-mcp
    binary: unify-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: unify-pp-cli
    repository:
      owner: nate-larkin
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The read layer Unify's API doesn't ship. Local search, SQL, and coverage reports over a CRM that has no list-records..."
    install: |
      bin.install "unify-pp-cli"
      bin.install "unify-pp-mcp"
