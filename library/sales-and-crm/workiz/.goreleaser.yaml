version: 2
project_name: workiz-pp-cli
changelog:
  disable: true
builds:
  - id: workiz-pp-cli
    main: ./cmd/workiz-pp-cli
    binary: workiz-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/sales-and-crm/workiz/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: workiz-pp-mcp
    main: ./cmd/workiz-pp-mcp
    binary: workiz-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: workiz-pp-cli
    repository:
      owner: eboziev
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Workiz dispatch and pipeline workflow, plus crew utilization, revenue"
    install: |
      bin.install "workiz-pp-cli"
      bin.install "workiz-pp-mcp"
