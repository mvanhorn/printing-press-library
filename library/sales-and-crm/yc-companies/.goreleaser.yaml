version: 2
project_name: yc-companies-pp-cli
changelog:
  disable: true
builds:
  - id: yc-companies-pp-cli
    main: ./cmd/yc-companies-pp-cli
    binary: yc-companies-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/sales-and-crm/yc-companies/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: yc-companies-pp-mcp
    main: ./cmd/yc-companies-pp-mcp
    binary: yc-companies-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: yc-companies-pp-cli
    repository:
      owner: nickpuru
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every YC-backed company in a local database, with watch lists, deltas, and cross-batch stats no scraper has."
    install: |
      bin.install "yc-companies-pp-cli"
      bin.install "yc-companies-pp-mcp"
