version: 2
project_name: home-assistant-pp-cli
changelog:
  disable: true
builds:
  - id: home-assistant-pp-cli
    main: ./cmd/home-assistant-pp-cli
    binary: home-assistant-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/devices/home-assistant/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: home-assistant-pp-mcp
    main: ./cmd/home-assistant-pp-mcp
    binary: home-assistant-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: home-assistant-pp-cli
    repository:
      owner: avanderheyde
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Safe household actions, offline memory, and evidence-backed answers on top of the full Home Assistant control surface."
    install: |
      bin.install "home-assistant-pp-cli"
      bin.install "home-assistant-pp-mcp"
