schema_version = 2
name = "unifi-pp-cli"
display_name = "UniFi"
description = "Every UniFi Network API operation, plus drift detection, topology, and rule prediction no other UniFi tool has."
project_kind = "cli"

[secrets.file]
path = "~/.config/unifi-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
UNIFI_API_KEY = true
