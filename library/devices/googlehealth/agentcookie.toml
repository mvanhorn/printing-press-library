# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "googlehealth-pp-cli"
display_name = "Google Health"
description = "View and manage health and fitness metrics and measurement data from Fitbit, Pixel Watch"
project_kind = "cli"

[secrets.file]
path = "~/.config/googlehealth-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
GOOGLEHEALTH_OAUTH2C = true
