version: 2
project_name: ti-pp-cli
changelog:
  disable: true
builds:
  - id: ti-pp-cli
    main: ./cmd/ti-pp-cli
    binary: ti-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/devices/ti/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ti-pp-mcp
    main: ./cmd/ti-pp-mcp
    binary: ti-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ti-pp-cli
    repository:
      owner: arungk
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "TI part compliance without the portal: anonymous RoHS/REACH per orderable, plus cookie-injected FMD Class-D XML and per-part exemptions."
    install: |
      bin.install "ti-pp-cli"
      bin.install "ti-pp-mcp"
