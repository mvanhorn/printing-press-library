version: 2
project_name: synology-nas-api-pp-cli
changelog:
  disable: true
builds:
  - id: synology-nas-api-pp-cli
    main: ./cmd/synology-nas-api-pp-cli
    binary: synology-nas-api-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/devices/synology-nas-api/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: synology-nas-api-pp-mcp
    main: ./cmd/synology-nas-api-pp-mcp
    binary: synology-nas-api-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: synology-nas-api-pp-cli
    repository:
      owner: eric-jung
      name: homebrew-tap
    homepage: "https://github.com/eric-jung/synology-nas-api-pp-cli"
    description: "REST API for Synology DiskStation Manager (DSM 7.x). All API calls are dispatched through /webapi/entry.cgi with..."
    install: |
      bin.install "synology-nas-api-pp-cli"
      bin.install "synology-nas-api-pp-mcp"
