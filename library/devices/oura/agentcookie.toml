# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "oura-pp-cli"
display_name = "Oura Ring"
description = "The only Oura Ring CLI that remembers everything: sync all metrics to local SQLite, correlate habits with scores, detect anomalies, and alert on multi-day recovery deficits no app can surface."
project_kind = "cli"

[secrets.file]
path = "~/.config/oura-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
OURA_ACCESS_TOKEN = true
