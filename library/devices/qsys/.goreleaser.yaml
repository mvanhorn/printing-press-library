version: 2
project_name: qsys-pp-cli
changelog:
  disable: true
builds:
  - id: qsys-pp-cli
    main: ./cmd/qsys-pp-cli
    binary: qsys-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/devices/qsys/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: qsys-pp-mcp
    main: ./cmd/qsys-pp-mcp
    binary: qsys-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: qsys-pp-cli
    repository:
      owner: drummerms
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Q-SYS specs, configuration, wiring, compatibility, and fault articles in one offline index - answering equipment-list questions no QSC website can take as input."
    install: |
      bin.install "qsys-pp-cli"
      bin.install "qsys-pp-mcp"
