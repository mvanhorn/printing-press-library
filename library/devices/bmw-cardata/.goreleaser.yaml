version: 2
project_name: bmw-cardata-pp-cli
changelog:
  disable: true
builds:
  - id: bmw-cardata-pp-cli
    main: ./cmd/bmw-cardata-pp-cli
    binary: bmw-cardata-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/devices/bmw-cardata/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: bmw-cardata-pp-mcp
    main: ./cmd/bmw-cardata-pp-mcp
    binary: bmw-cardata-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: bmw-cardata-pp-cli
    repository:
      owner: jvm
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Your BMW's telemetry, on the command line — device-code login, live telematic snapshots, charging history"
    install: |
      bin.install "bmw-cardata-pp-cli"
      bin.install "bmw-cardata-pp-mcp"
