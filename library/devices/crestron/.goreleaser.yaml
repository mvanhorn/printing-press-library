version: 2
project_name: crestron-pp-cli
changelog:
  disable: true
builds:
  - id: crestron-pp-cli
    main: ./cmd/crestron-pp-cli
    binary: crestron-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/devices/crestron/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: crestron-pp-mcp
    main: ./cmd/crestron-pp-mcp
    binary: crestron-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: crestron-pp-cli
    repository:
      owner: drummerms
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Crestron product, spec sheet, and firmware release — searchable offline, with fleet-wide currency checks the website cannot do."
    install: |
      bin.install "crestron-pp-cli"
      bin.install "crestron-pp-mcp"
