name: homeassistant
description: Discovered API spec for homeassistant (crowd-sniff)
version: 0.1.0
base_url: http://homeassistant.local:8123/api
spec_source: community
auth:
    type: bearer_token
    header: Authorization
    format: Bearer {token}
    env_vars:
        - HOMEASSISTANT_TOKEN
    env_var_specs:
        - name: HOMEASSISTANT_TOKEN
          kind: per_call
          required: true
          sensitive: true
          inferred: true
    in: header
config:
    format: toml
    path: ~/.config/homeassistant-pp-cli/config.toml
