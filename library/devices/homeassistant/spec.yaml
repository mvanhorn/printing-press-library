        description: Operations on states
        endpoints:
            list_states:
                method: GET
                path: /api/states
                description: Returns an array of state objects with entity_id, state, last_changed and attributes
                params: []
                body: []
                response:
                    type: array
                    item: state
                pagination: null
                meta:
                    source_count: "1"
                    source_tier: official-docs
            get_states:
                method: GET
                path: /api/states/{entity_id}
                description: Returns a state object for specified entity_id
                params: []
                body: []
                response:
                    type: object
                    item: state
                pagination: null
                meta:
                    source_count: "1"
                    source_tier: official-docs
            update_state:
                method: POST
                path: /api/states/{entity_id}
                description: Updates or creates a state representation
                params: []
                body:
                    - name: state
                      type: string
                      required: true
                    - name: attributes
                      type: object
                      required: false
                response:
                    type: object
                    item: state
                pagination: null
                meta:
                    source_count: "1"
                    source_tier: official-docs
            delete_state:
