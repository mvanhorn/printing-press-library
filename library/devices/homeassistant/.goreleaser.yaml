version: 2
project_name: homeassistant-pp-cli
changelog:
  disable: true
builds:
  - id: homeassistant-pp-cli
    main: ./cmd/homeassistant-pp-cli
    binary: homeassistant-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X homeassistant-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: homeassistant-pp-mcp
    main: ./cmd/homeassistant-pp-mcp
    binary: homeassistant-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: homeassistant-pp-cli
    repository:
      owner: adrin425
      name: homebrew-tap
    homepage: "https://github.com/adrin425/homeassistant-pp-cli"
    description: "Discovered API spec for homeassistant (crowd-sniff)"
    install: |
      bin.install "homeassistant-pp-cli"
      bin.install "homeassistant-pp-mcp"
