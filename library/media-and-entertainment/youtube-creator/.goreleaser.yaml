version: 2
project_name: youtube-creator-pp-cli
changelog:
  disable: true
builds:
  - id: youtube-creator-pp-cli
    main: ./cmd/youtube-creator-pp-cli
    binary: youtube-creator-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/youtube/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: youtube-creator-pp-mcp
    main: ./cmd/youtube-creator-pp-mcp
    binary: youtube-creator-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: youtube-creator-pp-cli
    repository:
      owner: jimpresting
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every YouTube Data, Analytics, and Reporting API endpoint, plus offline sync, the moderation verbs Studio hides, and..."
    install: |
      bin.install "youtube-creator-pp-cli"
      bin.install "youtube-creator-pp-mcp"
