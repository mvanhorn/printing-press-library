version: 2
project_name: calibre-ebook-pp-cli
changelog:
  disable: true
builds:
  - id: calibre-ebook-pp-cli
    main: ./cmd/calibre-ebook-pp-cli
    binary: calibre-ebook-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X calibre-ebook-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: calibre-ebook-pp-mcp
    main: ./cmd/calibre-ebook-pp-mcp
    binary: calibre-ebook-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: calibre-ebook-pp-cli
    repository:
      owner: eric-jung
      name: homebrew-tap
    homepage: "https://github.com/eric-jung/calibre-ebook-pp-cli"
    description: "Local ebook library management via calibredb CLI. Operates directly on the Calibre SQLite database — no content..."
    install: |
      bin.install "calibre-ebook-pp-cli"
      bin.install "calibre-ebook-pp-mcp"
