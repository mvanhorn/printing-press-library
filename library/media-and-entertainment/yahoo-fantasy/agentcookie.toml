# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "yahoo-fantasy-pp-cli"
display_name = "Yahoo Fantasy Sports"
description = "Full Yahoo Fantasy Sports read/write CLI and MCP server — set lineups, execute add/drops and FAAB waiver claims, and run local SQLite league analytics."
project_kind = "cli"

[secrets.file]
path = "~/.config/yahoo-fantasy-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
YAHOO_ACCESS_TOKEN = true
YAHOO_FANTASY_TOKEN = true
