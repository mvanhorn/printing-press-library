version: 2
project_name: magnific-pp-cli
changelog:
  disable: true
builds:
  - id: magnific-pp-cli
    main: ./cmd/magnific-pp-cli
    binary: magnific-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/magnific/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: magnific-pp-mcp
    main: ./cmd/magnific-pp-mcp
    binary: magnific-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: magnific-pp-cli
    repository:
      owner: nuno-duarte
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Magnific feature, plus a local archive of every prompt, task, and credit — so your generation history..."
    install: |
      bin.install "magnific-pp-cli"
      bin.install "magnific-pp-mcp"
