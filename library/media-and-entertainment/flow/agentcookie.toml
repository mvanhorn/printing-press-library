# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "flow-pp-cli"
display_name = "Google Flow"
description = "Everything Flow's community CLIs and MCP servers do, plus the two things none of them do: real Google Drive ingestion and an honest audio-drama pipeline that closes the loop Flow itself cannot."
project_kind = "cli"

[secrets.file]
path = "~/.config/flow-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
FLOW_SESSION_TOKEN = true
