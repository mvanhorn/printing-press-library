version: 2
project_name: yt-studio-pp-cli
changelog:
  disable: true
builds:
  - id: yt-studio-pp-cli
    main: ./cmd/yt-studio-pp-cli
    binary: yt-studio-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/yt-studio/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: yt-studio-pp-mcp
    main: ./cmd/yt-studio-pp-mcp
    binary: yt-studio-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: yt-studio-pp-cli
    repository:
      owner: kamiops
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every YouTube creator metric that matters, offline-queryable, with framework-audit binding to your scripts. The CLI..."
    install: |
      bin.install "yt-studio-pp-cli"
      bin.install "yt-studio-pp-mcp"
