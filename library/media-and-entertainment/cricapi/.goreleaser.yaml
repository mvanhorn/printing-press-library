version: 2
project_name: cricapi-pp-cli
changelog:
  disable: true
builds:
  - id: cricapi-pp-cli
    main: ./cmd/cricapi-pp-cli
    binary: cricapi-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/cricapi/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: cricapi-pp-mcp
    main: ./cmd/cricapi-pp-mcp
    binary: cricapi-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: cricapi-pp-cli
    repository:
      owner: rai
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Live cricket scores, fixtures, and fantasy data from CricAPI / Cricket Data, with offline SQLite and the first..."
    install: |
      bin.install "cricapi-pp-cli"
      bin.install "cricapi-pp-mcp"
