version: 2
project_name: rocket-league-tracker-pp-cli
changelog:
  disable: true
builds:
  - id: rocket-league-tracker-pp-cli
    main: ./cmd/rocket-league-tracker-pp-cli
    binary: rocket-league-tracker-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/rocket-league-tracker/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: rocket-league-tracker-pp-mcp
    main: ./cmd/rocket-league-tracker-pp-mcp
    binary: rocket-league-tracker-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: rocket-league-tracker-pp-cli
    repository:
      owner: addisonk
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Rocket League rank lookup, plus a local SQLite store that turns 'right now' into 'last 30 days' — without a..."
    install: |
      bin.install "rocket-league-tracker-pp-cli"
      bin.install "rocket-league-tracker-pp-mcp"
