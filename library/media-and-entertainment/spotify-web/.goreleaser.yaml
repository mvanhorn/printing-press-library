version: 2
project_name: spotify-web-pp-cli
changelog:
  disable: true
builds:
  - id: spotify-web-pp-cli
    main: ./cmd/spotify-web-pp-cli
    binary: spotify-web-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X spotify-web-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: spotify-web-pp-mcp
    main: ./cmd/spotify-web-pp-mcp
    binary: spotify-web-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: spotify-web-pp-cli
    repository:
      owner: dinakar-sarbada
      name: homebrew-tap
    homepage: "https://github.com/dinakar-sarbada/spotify-web-pp-cli"
    description: "You can use Spotify's Web API to discover music and podcasts, manage your Spotify library, control audio playback, and much more. Browse our available Web API endpoints using the sidebar at left, or via the navigation bar on top of this page on smaller screens.

In order to make successful Web API requests your app will need a valid access token. One can be obtained through <a href="https://developer.spotify.com/documentation/general/guides/authorization-guide/">OAuth 2.0</a>.

The base URI for all Web API requests is `https://api.spotify.com/v1`.

Need help? See our <a href="https://developer.spotify.com/documentation/web-api/guides/">Web API guides</a> for more information, or visit the <a href="https://community.spotify.com/t5/Spotify-for-Developers/bd-p/Spotify_Developer">Spotify for Developers community forum</a> to ask questions and connect with other developers."
    install: |
      bin.install "spotify-web-pp-cli"
      bin.install "spotify-web-pp-mcp"
