# Verification manifest for the digg-pp-cli read-only research workflow:
# (1) check that Digg's site and search endpoint answer,
# (2) search stories live across every topic,
# (3) read the highest-scoring stories across every topic,
# (4) read one topic's ranked stories.
#
# Every step is read-only against Digg and needs no prior sync. Run via:
#   printing-press workflow-verify --dir <cli-dir>
name: digg-research-flow
description: Research flow over Digg's live search and ranked stories, across all topics
goal: |
  Confirm Digg is reachable, search every topic for stories on a subject
  with their Digg Scores, list the highest-scoring stories across all
  topics, and list one topic's stories in rank order.

steps:
  - name: doctor
    command: digg-pp-cli doctor
    expect:
      exit_code: 0

  - name: search-all-topics
    command: digg-pp-cli search "election" --since 30d --limit 5 --json
    expect:
      exit_code: 0
      output_contains:
        - "totalMatches"

  - name: top-all-topics
    command: digg-pp-cli top --limit 5 --json
    expect:
      exit_code: 0
      output_contains:
        - "diggScore"

  - name: top-one-topic
    command: digg-pp-cli top --topic sports --limit 5 --json
    expect:
      exit_code: 0
      output_contains:
        - "diggScore"
