version: 2
project_name: vibe-signal-pp-cli
changelog:
  disable: true
builds:
  - id: vibe-signal-pp-cli
    main: ./cmd/vibe-signal-pp-cli
    binary: vibe-signal-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/vibe-signal/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: vibe-signal-pp-mcp
    main: ./cmd/vibe-signal-pp-mcp
    binary: vibe-signal-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: vibe-signal-pp-cli
    repository:
      owner: avanderheyde
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "One question, every low-friction source: a recency-aware, cited signal report instead of ten raw source dumps."
    install: |
      bin.install "vibe-signal-pp-cli"
      bin.install "vibe-signal-pp-mcp"
