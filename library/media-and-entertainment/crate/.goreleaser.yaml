version: 2
project_name: crate-pp-cli
changelog:
  disable: true
builds:
  - id: crate-pp-cli
    main: ./cmd/crate-pp-cli
    binary: crate-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/crate/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: crate-pp-mcp
    main: ./cmd/crate-pp-mcp
    binary: crate-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: crate-pp-cli
    repository:
      owner: justinwfu
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Your record collection as a local database: pick tonight's record, subtract your shelf from a crate-digging search, and price your wantlist without a token."
    install: |
      bin.install "crate-pp-cli"
      bin.install "crate-pp-mcp"
