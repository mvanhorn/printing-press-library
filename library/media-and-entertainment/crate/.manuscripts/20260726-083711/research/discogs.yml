openapi: 3.0.0
info:
  title: Discogs
  version: "2.0"
  description: >-
    The Discogs database of music releases, artists, and labels, plus user
    collections, wantlists, and marketplace pricing. Every endpoint below was
    verified live against api.discogs.com on 2026-07-26.
  contact:
    name: Discogs API
    url: https://www.discogs.com/developers
  termsOfService: https://www.discogs.com/developers#page:home,header:home-general-information
components:
  securitySchemes:
    discogsToken:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Optional. Database reads, public collections, public wantlists, and
        marketplace stats all work with no credential at all (25 requests per
        minute). A free personal access token from
        discogs.com/settings/developers raises that to 60 per minute and unlocks
        private collections, price suggestions, and collection valuation.
      x-auth-vars:
        - name: DISCOGS_TOKEN
          kind: per_call
          required: false
          sensitive: true
          description: >-
            Optional personal access token. Leave unset for keyless use.
security: []
paths:
  /database/search:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: database
      operationId: databaseSearch
      summary: Search the Discogs database for releases, masters, artists, or labels
      description: >-
        The main discovery endpoint. Filter by label, genre, style, year, country,
        and format to find records matching a crate-digging brief.
      parameters:
        - {name: q, in: query, description: "Free-text query across titles and artists", schema: {type: string, example: "blue note"}}
        - {name: type, in: query, description: "Restrict to one entity type", schema: {type: string, enum: [release, master, artist, label], example: "release"}}
        - {name: title, in: query, description: "Match on combined artist and title", schema: {type: string}}
        - {name: release_title, in: query, description: "Match on the release title alone", schema: {type: string}}
        - {name: artist, in: query, description: "Artist name", schema: {type: string}}
        - {name: label, in: query, description: "Record label name, e.g. Blue Note", schema: {type: string}}
        - {name: genre, in: query, description: "Top-level genre, e.g. Jazz, Electronic, Rock", schema: {type: string}}
        - {name: style, in: query, description: "Finer style, e.g. Hard Bop, Ambient, Post Punk", schema: {type: string}}
        - {name: country, in: query, description: "Country of release, e.g. US, UK, Japan", schema: {type: string}}
        - {name: year, in: query, description: "Release year, or a range like 1960-1969", schema: {type: string}}
        - {name: format, in: query, description: "Physical format, e.g. Vinyl, LP, Album, 7\"", schema: {type: string}}
        - {name: catno, in: query, description: "Catalogue number printed on the sleeve or label", schema: {type: string}}
        - {name: barcode, in: query, description: "Barcode, useful for scanning a record in a shop", schema: {type: string}}
        - {name: track, in: query, description: "Track title", schema: {type: string}}
        - {name: per_page, in: query, description: "Results per page, up to 100", schema: {type: integer, default: 50}}
        - {name: page, in: query, description: "Page number, 1-based", schema: {type: integer, default: 1}}
      responses:
        "200": {description: Search results, content: {application/json: {schema: {type: object}}}}
  /releases/{release_id}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: releases
      operationId: releaseGet
      summary: Get one specific pressing of a record
      parameters:
        - {name: release_id, in: path, required: true, description: "Discogs release id, identifying one specific pressing", schema: {type: integer, example: 249504}}
        - {name: curr_abbr, in: query, description: "Currency for any prices, e.g. USD, GBP, EUR", schema: {type: string}}
      responses:
        "200": {description: The release, content: {application/json: {schema: {type: object}}}}
  /releases/{release_id}/rating/{username}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: releases
      operationId: releaseRating
      summary: Get a user's rating for a release
      parameters:
        - {name: release_id, in: path, required: true, description: "Discogs release id", schema: {type: integer, example: 249504}}
        - {name: username, in: path, required: true, description: "Discogs username", schema: {type: string, example: "example"}}
      responses:
        "200": {description: The rating, content: {application/json: {schema: {type: object}}}}
  /masters/{master_id}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: masters
      operationId: masterGet
      summary: Get a master record, the abstract work behind all its pressings
      parameters:
        - {name: master_id, in: path, required: true, description: "Discogs master id", schema: {type: integer, example: 1000}}
      responses:
        "200": {description: The master, content: {application/json: {schema: {type: object}}}}
  /masters/{master_id}/versions:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: masters
      operationId: masterVersions
      summary: List every pressing of a master, for comparing issues and countries
      parameters:
        - {name: master_id, in: path, required: true, description: "Discogs master id", schema: {type: integer, example: 1000}}
        - {name: country, in: query, description: "Filter versions by country of release", schema: {type: string}}
        - {name: format, in: query, description: "Filter versions by format", schema: {type: string}}
        - {name: label, in: query, description: "Filter versions by label", schema: {type: string}}
        - {name: per_page, in: query, description: "Results per page, up to 100", schema: {type: integer, default: 50}}
        - {name: page, in: query, description: "Page number, 1-based", schema: {type: integer, default: 1}}
      responses:
        "200": {description: The versions, content: {application/json: {schema: {type: object}}}}
  /artists/{artist_id}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: artists
      operationId: artistGet
      summary: Get an artist
      parameters:
        - {name: artist_id, in: path, required: true, description: "Discogs artist id", schema: {type: integer, example: 1}}
      responses:
        "200": {description: The artist, content: {application/json: {schema: {type: object}}}}
  /artists/{artist_id}/releases:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: artists
      operationId: artistReleases
      summary: List an artist's discography
      parameters:
        - {name: artist_id, in: path, required: true, description: "Discogs artist id", schema: {type: integer, example: 1}}
        - {name: sort, in: query, description: "Sort field", schema: {type: string, enum: [year, title, format]}}
        - {name: sort_order, in: query, description: "Sort direction", schema: {type: string, enum: [asc, desc]}}
        - {name: per_page, in: query, description: "Results per page, up to 100", schema: {type: integer, default: 50}}
        - {name: page, in: query, description: "Page number, 1-based", schema: {type: integer, default: 1}}
      responses:
        "200": {description: The discography, content: {application/json: {schema: {type: object}}}}
  /labels/{label_id}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: labels
      operationId: labelGet
      summary: Get a record label
      parameters:
        - {name: label_id, in: path, required: true, description: "Discogs label id", schema: {type: integer, example: 1}}
      responses:
        "200": {description: The label, content: {application/json: {schema: {type: object}}}}
  /labels/{label_id}/releases:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: labels
      operationId: labelReleases
      summary: List a label's catalogue
      parameters:
        - {name: label_id, in: path, required: true, description: "Discogs label id", schema: {type: integer, example: 1}}
        - {name: per_page, in: query, description: "Results per page, up to 100", schema: {type: integer, default: 50}}
        - {name: page, in: query, description: "Page number, 1-based", schema: {type: integer, default: 1}}
      responses:
        "200": {description: The catalogue, content: {application/json: {schema: {type: object}}}}
  /users/{username}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: users
      operationId: userGet
      summary: Get a user profile
      parameters:
        - {name: username, in: path, required: true, description: "Discogs username", schema: {type: string, example: "example"}}
      responses:
        "200": {description: The profile, content: {application/json: {schema: {type: object}}}}
  /users/{username}/collection/folders:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: collection
      operationId: collectionFolders
      summary: List a user's collection folders
      description: Works without a token when the user's collection is public.
      parameters:
        - {name: username, in: path, required: true, description: "Discogs username", schema: {type: string, example: "example"}}
      responses:
        "200": {description: The folders, content: {application/json: {schema: {type: object}}}}
  /users/{username}/collection/folders/{folder_id}/releases:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: collection
      operationId: collectionReleases
      summary: List the records in a collection folder
      description: >-
        Folder 0 is the special "All" folder containing every record in the
        collection. Works without a token when the collection is public.
      parameters:
        - {name: username, in: path, required: true, description: "Discogs username", schema: {type: string, example: "example"}}
        - {name: folder_id, in: path, required: true, description: "Folder id; 0 means every record in the collection", schema: {type: integer, example: 0}}
        - {name: sort, in: query, description: "Sort field", schema: {type: string, enum: [label, artist, title, catno, format, rating, added, year]}}
        - {name: sort_order, in: query, description: "Sort direction", schema: {type: string, enum: [asc, desc]}}
        - {name: per_page, in: query, description: "Results per page, up to 100", schema: {type: integer, default: 50}}
        - {name: page, in: query, description: "Page number, 1-based", schema: {type: integer, default: 1}}
      responses:
        "200": {description: The records, content: {application/json: {schema: {type: object}}}}
  /users/{username}/wants:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: wantlist
      operationId: wantlistGet
      summary: List a user's wantlist
      description: Works without a token when the user's wantlist is public.
      parameters:
        - {name: username, in: path, required: true, description: "Discogs username", schema: {type: string, example: "example"}}
        - {name: per_page, in: query, description: "Results per page, up to 100", schema: {type: integer, default: 50}}
        - {name: page, in: query, description: "Page number, 1-based", schema: {type: integer, default: 1}}
      responses:
        "200": {description: The wantlist, content: {application/json: {schema: {type: object}}}}
  /marketplace/stats/{release_id}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: marketplace
      operationId: marketplaceStats
      summary: Current lowest asking price and number of copies for sale
      description: >-
        Keyless. Returns num_for_sale and lowest_price. Note this is the lowest
        price a seller is currently ASKING, not a sale price and not an
        appraisal.
      parameters:
        - {name: release_id, in: path, required: true, description: "Discogs release id", schema: {type: integer, example: 249504}}
        - {name: curr_abbr, in: query, description: "Currency for the price, e.g. USD, GBP, EUR", schema: {type: string}}
      responses:
        "200": {description: The stats, content: {application/json: {schema: {type: object}}}}
  /marketplace/price_suggestions/{release_id}:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: marketplace
      operationId: marketplacePriceSuggestions
      summary: Suggested prices by media condition (requires a token)
      description: Returns HTTP 401 without a personal access token.
      parameters:
        - {name: release_id, in: path, required: true, description: "Discogs release id", schema: {type: integer, example: 249504}}
      responses:
        "200": {description: The suggestions, content: {application/json: {schema: {type: object}}}}
  /oauth/identity:
    servers: [{url: "https://api.discogs.com"}]
    get:
      x-pp-resource: identity
      operationId: identityGet
      summary: Show which Discogs account the current token belongs to
      description: Returns HTTP 401 without a personal access token.
      responses:
        "200": {description: The identity, content: {application/json: {schema: {type: object}}}}
