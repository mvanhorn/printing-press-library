name: eplus
version: 0.1.0
category: entertainment
description: Discover Japanese performances and plan source-backed ticket sale windows.
cli_description: Discover Japanese performances and plan source-backed ticket sale windows.
base_url: https://eplus.jp
http_transport: standard
auth:
  type: none
learn:
  disabled: true
resources:
  events:
    description: Discover domestic performances and inspect sale rounds
    endpoints:
      search:
        method: GET
        path: /sf/search
        description: Search domestic performances
        response_format: html
        html_extract:
          mode: embedded-json
          script_selector: script#json
          json_path: data
        params:
          - name: keyword
            type: string
            default: Radiohead
            description: Event or artist keyword
        response:
          type: object
      detail:
        method: GET
        path: /sf/detail/{id}
        description: Inspect event and performance details
        response_format: html
        html_extract:
          mode: page
        params:
          - name: id
            type: string
            positional: true
            required: true
            description: Public detail ID
        happy_args: id=4592490001-P0030001P021003
        response:
          type: object
