version: 2
project_name: diretta-pp-cli
changelog:
  disable: true
builds:
  - id: diretta-pp-cli
    main: ./cmd/diretta-pp-cli
    binary: diretta-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/diretta/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: diretta-pp-mcp
    main: ./cmd/diretta-pp-mcp
    binary: diretta-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: diretta-pp-cli
    repository:
      owner: prisco-faiella
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The only Go CLI for Diretta.it — live scores, standings, and H2H with offline SQLite cache, MCP server, and 30+..."
    install: |
      bin.install "diretta-pp-cli"
      bin.install "diretta-pp-mcp"
