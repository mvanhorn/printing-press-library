name: diretta
display_name: Diretta.it
version: "0.1.0"
base_url: "https://local-global.flashscore.ninja/2"
cli_description: "Risultati sportivi live, classifiche e statistiche da Diretta.it — zero setup, dati offline, MCP pronto."

# FlashScore Ninja API uses no authentication — only a static public token header.
# Response format is a proprietary custom-delimiter format (records~fields¬key÷value),
# NOT JSON. The generator scaffolds JSON decode; Phase 3 replaces with custom parser.
auth:
  type: none

required_headers:
  - name: x-fsign
    value: "SW9D1eZo"
  - name: User-Agent
    value: "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/117.0"
  - name: Referer
    value: "https://www.diretta.it/"
  - name: Accept
    value: "*/*"

resources:
  matches:
    description: "Football matches and results"
    endpoints:
      today:
        method: GET
        path: "/x/feed/f_1_0_3_it_1"
        description: "Today's football matches. Response: FlashScore custom delimiter format (parsed in Phase 3)."
        response_format: json
        no_auth: true

      yesterday:
        method: GET
        path: "/x/feed/f_1_-1_3_it_1"
        description: "Yesterday's football results. FlashScore delimiter format."
        response_format: json
        no_auth: true

      tomorrow:
        method: GET
        path: "/x/feed/f_1_1_3_it_1"
        description: "Tomorrow's football fixtures. FlashScore delimiter format."
        response_format: json
        no_auth: true

      live:
        method: GET
        path: "/x/feed/f_1_0_3_it_1"
        description: "Live matches filtered from today's feed by status. FlashScore delimiter format."
        response_format: json
        no_auth: true

  match:
    description: "Individual match details"
    endpoints:
      detail:
        method: GET
        path: "/x/feed/dc_1_{matchId}"
        description: "Match general info, score, and basic data. FlashScore delimiter format."
        response_format: json
        no_auth: true
        params:
          - name: matchId
            type: string
            required: true
            positional: true
            description: "Match ID (e.g. vVn0EQM5)"

      stats:
        method: GET
        path: "/x/feed/df_st_1_{matchId}"
        description: "Match statistics: possession, shots, corners, xG. FlashScore delimiter format."
        response_format: json
        no_auth: true
        params:
          - name: matchId
            type: string
            required: true
            positional: true
            description: "Match ID"

      events:
        method: GET
        path: "/x/feed/df_sui_1_{matchId}"
        description: "Match events: goals, cards, substitutions. FlashScore delimiter format."
        response_format: json
        no_auth: true
        params:
          - name: matchId
            type: string
            required: true
            positional: true
            description: "Match ID"

      h2h:
        method: GET
        path: "/x/feed/df_hh_1_{matchId}"
        description: "Head-to-head history between the two teams. FlashScore delimiter format."
        response_format: json
        no_auth: true
        params:
          - name: matchId
            type: string
            required: true
            positional: true
            description: "Match ID"

      lineups:
        method: GET
        path: "/x/feed/df_li_1_{matchId}"
        description: "Team lineups and formations. FlashScore delimiter format."
        response_format: json
        no_auth: true
        params:
          - name: matchId
            type: string
            required: true
            positional: true
            description: "Match ID"

  standings:
    description: "Tournament standings and league tables"
    endpoints:
      table:
        method: GET
        path: "/x/feed/tr_{tournamentId}_{season}_{page}_3_{locale}_1"
        description: "League table for a tournament. FlashScore delimiter format."
        response_format: json
        no_auth: true
        params:
          - name: tournamentId
            type: string
            required: true
            positional: true
            description: "Tournament ID (e.g. naYhNOaA for Serie A)"
          - name: season
            type: string
            description: "Season year (e.g. 2024 for 2024/25 season)"
            default: "2024"
          - name: page
            type: string
            description: "Page number for standings"
            default: "3"
          - name: locale
            type: string
            description: "Locale code (it=Italian)"
            default: "it"

  sports:
    description: "Multi-sport feeds covering 30+ sports"
    endpoints:
      all_today:
        method: GET
        path: "/x/feed/f_2_0_3_it_1"
        description: "All sports today: calcio, tennis, basket, hockey, etc. FlashScore delimiter format."
        response_format: json
        no_auth: true

  odds:
    description: "Match betting odds via GraphQL"
    endpoints:
      match_odds:
        method: POST
        path: "/pq_graphql"
        base_url: "https://2.ds.lsapp.eu"
        description: "Betting odds for a match: 1X2, Under/Over, Asian handicap."
        response_format: json
        no_auth: true
        params:
          - name: eventId
            type: string
            required: true
            positional: true
            description: "Match ID"
          - name: projectId
            type: string
            description: "Project ID (2=Global)"
            default: "2"
          - name: geoIpCode
            type: string
            description: "Geographic region code"
            default: "IT"
