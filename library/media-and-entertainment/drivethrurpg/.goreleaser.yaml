version: 2
project_name: drivethrurpg-pp-cli
changelog:
  disable: true
builds:
  - id: drivethrurpg-pp-cli
    main: ./cmd/drivethrurpg-pp-cli
    binary: drivethrurpg-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X drivethrurpg-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: drivethrurpg-pp-mcp
    main: ./cmd/drivethrurpg-pp-mcp
    binary: drivethrurpg-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: drivethrurpg-pp-cli
    repository:
      owner: kingdomseed
      name: homebrew-tap
    homepage: "https://github.com/kingdomseed/drivethrurpg-pp-cli"
    description: "Curated seed spec for public DriveThruRPG catalog search and authenticated library downloads."
    install: |
      bin.install "drivethrurpg-pp-cli"
      bin.install "drivethrurpg-pp-mcp"
