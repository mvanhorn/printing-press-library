version: 2
project_name: atom-tickets-pp-cli
changelog:
  disable: true
builds:
  - id: atom-tickets-pp-cli
    main: ./cmd/atom-tickets-pp-cli
    binary: atom-tickets-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/media-and-entertainment/atom-tickets/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: atom-tickets-pp-mcp
    main: ./cmd/atom-tickets-pp-mcp
    binary: atom-tickets-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: atom-tickets-pp-cli
    repository:
      owner: avanderheyde
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Find bookable Atom movie tickets, compare real offers, and hand users the official checkout link."
    install: |
      bin.install "atom-tickets-pp-cli"
      bin.install "atom-tickets-pp-mcp"
