version: 2
project_name: adguard-home-pp-cli
changelog:
  disable: true
builds:
  - id: adguard-home-pp-cli
    main: ./cmd/adguard-home-pp-cli
    binary: adguard-home-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/monitoring/adguard-home/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: adguard-home-pp-mcp
    main: ./cmd/adguard-home-pp-mcp
    binary: adguard-home-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: adguard-home-pp-cli
    repository:
      owner: eric-jung
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "AdGuard Home REST-ish API. Our admin web interface is built on top of this REST-ish API."
    install: |
      bin.install "adguard-home-pp-cli"
      bin.install "adguard-home-pp-mcp"
