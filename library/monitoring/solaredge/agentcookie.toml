# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "solaredge-pp-cli"
display_name = "SolarEdge"
description = "Every SolarEdge Monitoring API endpoint, plus local history that answers questions the API itself can't."
project_kind = "cli"

[secrets.file]
path = "~/.config/solaredge-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
SOLAREDGE_API_KEY = true
