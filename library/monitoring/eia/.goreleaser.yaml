version: 2
project_name: eia-pp-cli
changelog:
  disable: true
builds:
  - id: eia-pp-cli
    main: ./cmd/eia-pp-cli
    binary: eia-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/monitoring/eia/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: eia-pp-mcp
    main: ./cmd/eia-pp-mcp
    binary: eia-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: eia-pp-cli
    repository:
      owner: synota
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "U.S. Energy Information Administration Open Data APIv2. Discovery: GET /v2/{path}/ returns child routes,..."
    install: |
      bin.install "eia-pp-cli"
      bin.install "eia-pp-mcp"
