version: 2
project_name: ninjaone-pp-cli
changelog:
  disable: true
builds:
  - id: ninjaone-pp-cli
    main: ./cmd/ninjaone-pp-cli
    binary: ninjaone-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/monitoring/ninjaone/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ninjaone-pp-mcp
    main: ./cmd/ninjaone-pp-mcp
    binary: ninjaone-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ninjaone-pp-cli
    repository:
      owner: sonofcar102
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every NinjaOne endpoint plus fleet-wide cross-org commands the org-scoped console can't give you."
    install: |
      bin.install "ninjaone-pp-cli"
      bin.install "ninjaone-pp-mcp"
