version: 2
project_name: kuma-pp-cli
changelog:
  disable: true
builds:
  - id: kuma-pp-cli
    main: ./cmd/kuma-pp-cli
    binary: kuma-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: kuma-pp-cli
    repository:
      owner: keithah
      name: homebrew-tap
    homepage: "https://github.com/keithah/kuma-pp-cli"
    description: "Uptime Kuma v2 operator surfaces represented by the generated CLI."
    install: |
      bin.install "kuma-pp-cli"
