	function bindlaw(lcode, lno, lnod) {
	var	law;
		law = lcode2lsid(lcode);
		if(law!=false)
		{
		    if (lnod != "") {
			    law = law + ", " + lno + "-" + lnod;
		    } else {
			    law = law + ", " + lno;
		    }
		}
		return law;
	}

                return false;
             }

                 document.getElementById("chkbxSearch_1").checked=true;

             }
             
             var reg2 = new RegExp("([^\u4e00-\u9fa5一二三四五六七八九壹貳肆伍陸柒捌玖\(\)（）])");

             if(result != null && result.length > 0) {
                alert("裁判字號【字別】格式不正確，請重新輸入！！");
                return false;
             }
             
             result = document.getElementById("txtno").value.match(reg);
             if(result != null && result.length > 0) {
                alert("裁判字號【案號】格式不正確，請重新輸入！！");
