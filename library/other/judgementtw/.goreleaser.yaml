version: 2
project_name: judgementtw-pp-cli
changelog:
  disable: true
builds:
  - id: judgementtw-pp-cli
    main: ./cmd/judgementtw-pp-cli
    binary: judgementtw-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X judgementtw-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: judgementtw-pp-mcp
    main: ./cmd/judgementtw-pp-mcp
    binary: judgementtw-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: judgementtw-pp-cli
    repository:
      owner: wayne-lai
      name: homebrew-tap
    homepage: "https://github.com/wayne-lai/judgementtw-pp-cli"
    description: "Search and analyze every Taiwan court judgment offline, with a citation graph, sentencing analytics, and watchlists..."
    install: |
      bin.install "judgementtw-pp-cli"
      bin.install "judgementtw-pp-mcp"
