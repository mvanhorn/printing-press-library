        aliases: [toilet soap, lifebuoy]
    # Appendix-B is FIVE sub-tables, not one. Seeded so a query about wages or fertilizer
    # reaches the right surface instead of falling through to Appendix-A.
    appendix_b_table:
      - canonical: "fertilizers"
        aliases: [fertilizer, urea, dap, "sona urea", npk]
      - canonical: "cement"
        aliases: [cement bag]
      - canonical: "cng"
        aliases: [compressed natural gas]
      - canonical: "wages"
        aliases: [wage rates, wage, labour rate, mason, painter, plumber, electrician, labourer]
      - canonical: "wheat"
        aliases: [wheat rates, wheat flour fine]

resources:
  # NOTE: single-endpoint resources get their command path COLLAPSED by the generator
  # (`index`, not `index get`). Each `example:` below therefore uses the COLLAPSED path and the
  # post-rename flag_name spellings. Upstream #4614 is the detect-and-refuse fix; until it
  # lands this is the author's job. Learned the hard way on MUFAP -- all five promoted commands
  # shipped a broken example that only "worked" because Cobra swallowed the stray positional.
  index:
    description: "The PBS price-statistics release index. Carries TWO JavaScript literal arrays in the served HTML: `data` (148 weekly SPI releases, 2023-07-13..2026-09-03) and `cpidata1` (50 CPI months, July 2022..August 2026)."
    endpoints:
      get:
        method: GET
        path: /price-statistics/
        description: "Fetch the release-index page. THE ONLY ENUMERATOR -- release URLs are UNCONSTRUCTIBLE: 35 distinct annexure filename shapes across 148 rows (top shape covers only 53), including one `Annex.pdf` with no date at all, plus load-bearing typos (SumarySPI, SummaryReport, USCCP, Annexture). A guessed URL returns a clean HTTP 404, never a soft 200. This endpoint's html_extract returns the raw file-link list; the authoritative date-paired index comes from the hand-written JS-literal parser in `releases`."
        response_format: html
        html_extract:
          mode: links
          # Path-segment anchored. Every one of the 202 files on this page sits in the SINGLE
          # constant directory /wp-content/uploads/2020/07/ -- the upload path carries ZERO date
          # information, unlike CDC's informative /assets/uploads/YYYY/MM/. So the parent
          # directory is the correct prefix and there is no dated tree to walk.
          link_prefixes: ["/wp-content/uploads"]
        no_auth: true
        mutation: false
        example: "  pbs-pp-cli index --json"

  file:
    description: "Static annexure/report files. All 202 live in one flat directory; the filename is the only variable."
    endpoints:
      get:
        method: GET
        path: /wp-content/uploads/2020/07/{filename}
        description: "Fetch one annexure, report, or CPI annex file by exact filename. Formats: .xlsx for the 44 most recent weekly releases (2025-10-23 onward) and .pdf for the other 104 -- so the text-layer PDF path covers 70% of the panel and is not optional. Never construct this filename; take it from `releases`."
        response_format: binary
        no_auth: true
        mutation: false
        example: "  pbs-pp-cli file Annex_03.09.2026.xlsx"
        params:
          - name: filename
            type: string
            required: true
            positional: true
            description: "Exact file name including extension, taken verbatim from the release index. Two rows carry a filename whose embedded date DISAGREES with the index `date` field (date=21-08-2025 -> Annex_13.08.2025.pdf, an 8-day discrepancy; date=04-06-2025 -> Annex.pdf), so the index date is authoritative and the filename is opaque."
