        aliases: [irri, "irri-6", irri rice]
      - canonical: "Bread plain (Small Size)"
        aliases: [bread, double roti]
      - canonical: "Beef with Bone (Average Quality)"
        aliases: [beef]
      - canonical: "Mutton (Average Quality)"
        aliases: [mutton, goat meat]
      - canonical: "Chicken Farm Broiler (Live)"
        aliases: [chicken, broiler, live chicken]
      - canonical: "Milk fresh (Un-boiled)"
        aliases: [milk, fresh milk, doodh]
      - canonical: "Curd (Dahi) Loose"
        aliases: [curd, dahi, yogurt]
      - canonical: "Powdered Milk NIDO 390 gm Polybag"
