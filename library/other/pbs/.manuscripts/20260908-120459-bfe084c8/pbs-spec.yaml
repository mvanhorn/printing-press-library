name: pbs
base_url: "https://www.pbs.gov.pk"
spec_format: internal
category: other
cli_description: "The only machine-readable Pakistani price panel — every urban centre and essential item the Bureau prices weekly, min/avg/max, accrued from the scattered release files it indexes in a hand-edited JavaScript array and never publishes as a series."

# ---------------------------------------------------------------------------------------------
# TRANSPORT: MEASURED, not assumed. ~60 probes, every content URL HTTP 200 via plain Go
# net/http, 30-900ms, ZERO Cloudflare challenges, no auth, no cookies, no JS execution.
# Confirmed with BOTH the Go prober and macOS LibreSSL curl -- unlike SBP (LibreSSL 403s) and
# unlike MUFAP (curl 403 / Go 200). PBS needs neither a modern TLS stack nor a browser.
# Do NOT "upgrade" this to browser-http or browser-chrome.
http_transport: standard

# The whole 148-entry release index ships INSIDE the served HTML as two JavaScript literals.
# There is no XHR data API. The only JSON surface (wp-json/wp/v2/posts, x-wp-total 17) serves
# WordPress announcement posts, not prices.

# robots.txt is text/plain and 172 bytes -- the cheapest stable probe on the host, chosen
# deliberately to try to dodge upstream #4612 (doctor calls an HTML-serving 200 "unreachable").
# If doctor still reports unreachable, apply the mufapHealthGet / cdc_health workaround:
# a hand-written internal/cli/pbs_health.go using GetWithHeaders + client.HTMLResponseHeader.
health_check_path: "/robots.txt"

auth:
  # robots.txt VERBATIM: "# START YOAST BLOCK" / "User-agent: *" / "Disallow:" (empty = allow
  # all) / "Sitemap: https://www.pbs.gov.pk/sitemap_index.xml". NO AI-crawler directives of any
  # kind -- no ClaudeBot/GPTBot/CCBot rule, no Content-Signal. The Pakistan Official Statistics
  # & Data Dissemination Policy grants an open government licence permitting commercial and
  # non-commercial reuse with attribution. This is the only source in the candidate pool with
  # affirmative written permission rather than silence or prohibition.
  type: none
  env_vars: []

config:
  format: toml
  path: "~/.config/pbs-pp-cli/config.toml"

# Deliberately NO `cache:` block, inheriting the CDC decision. Auto-refresh-before-read would
# re-fetch the index and an annexure file (55KB-4.4MB) on ordinary local queries. The panel is
# an archival weekly series, not live inventory, so pre-read refresh buys nothing and turns
# cheap local reads into slow network calls. Freshness is reported by `doctor` and `coverage`,
# and advanced explicitly by `sync`, never implicitly.

mcp:
  transport: [stdio, http]
  # No mcp.intents. The press publishes no schema for it and mcp-audit reports intent_count 0
  # across the library, so declaring it blind risks failing spec validation. Same call as CDC.

learn:
  # ticker_patterns DELIBERATELY EMPTY, inheriting the NCCPL/CDC lesson verbatim. PBS has no
  # ticker-like identifiers at all: item keys are the integers 1-51 and city keys are the
  # two-digit codes 01-17. A lowercase ID regex would be INVERTED -- matchesTicker runs on the
  # RAW token before lowercasing, so it would match every ordinary English word ("wheat",
  # "sugar", "onions") and empty QueryFamily, making seeded playbooks unreachable at recall.
  ticker_patterns: []
  synonyms:
    "sensitive price indicator": "spi"
    "essential items": "spi"
    "cost of living": "spi"
    "most recent": "latest"
    "week over week": "wow"
    "year over year": "yoy"
    "price spread": "dispersion"
    "cross city": "dispersion"
    "basket weights": "weights"
  entity_lookup_seeds:
    # All 17 cities VERIFIED from xl/sharedStrings.xml of Annex_03.09.2026.xlsx. `canonical`
    # is the Appendix-A spelling WITH the PBS city code, because that is what the upstream file
    # emits. Aliases carry (a) the bare name, (b) the SOFT-HYPHEN spelling that Appendix-B of
    # the SAME FILE uses, and (c) the bare two-digit code.
    city:
      - canonical: "Islamabad (01)"
        aliases: [islamabad, "islam-abad", "01", isb]
      - canonical: "Rawalpindi (02)"
        aliases: [rawalpindi, "rawal-pindi", "02", pindi]
      - canonical: "Gujranwala (03)"
        aliases: [gujranwala, "gujran-wala", "03"]
      - canonical: "Sialkot (04)"
        aliases: [sialkot, "04"]
      - canonical: "Lahore (05)"
        aliases: [lahore, "05", lhr]
      - canonical: "Faisalabad (06)"
        aliases: [faisalabad, "faisal-abad", "06", lyallpur]
      - canonical: "Sargodha (07)"
        aliases: [sargodha, "sar-godha", "07"]
      - canonical: "Multan (08)"
        aliases: [multan, "08"]
      - canonical: "Bahawalpur (09)"
        aliases: [bahawalpur, "baha-walpur", "09"]
      - canonical: "Karachi (10)"
        aliases: [karachi, "10", khi]
      - canonical: "Hyderabad (11)"
        aliases: [hyderabad, "hyder-abad", "11"]
      - canonical: "Sukkur (12)"
        aliases: [sukkur, "12"]
      - canonical: "Larkana (13)"
        aliases: [larkana, "13"]
      - canonical: "Peshawar (14)"
        aliases: [peshawar, "pesha-war", "14"]
      - canonical: "Bannu (15)"
        aliases: [bannu, "15"]
      - canonical: "Quetta (16)"
        aliases: [quetta, "16"]
      - canonical: "Khuzdar (17)"
        aliases: [khuzdar, "khuz-dar", "17"]
    # The 51 Appendix-A items, VERIFIED from the same sharedStrings read. `canonical` matches
    # the upstream DESCRIPTION string exactly, because item description is the only stable join
    # key: the `Sr.` column restarts at 1 in each of the three ranked sections and the sections
    # are re-ranked every week.
    spi_item:
      - canonical: "Wheat Flour Bag"
        aliases: [wheat flour, atta, flour]
      - canonical: "Rice Basmati Broken (Average Quality)"
        aliases: [basmati, broken basmati, rice basmati]
