        aliases: [ladies sandal]
      - canonical: "Electricity Charges for Q1*"
        aliases: [electricity, bijli, power tariff]
      - canonical: "Gas Charges for Q1"
        aliases: [gas, sui gas, gas charges]
      - canonical: "Firewood Whole"
        aliases: [firewood, lakri]
      - canonical: "Energy Saver Philips 14 Watt"
        aliases: [energy saver, philips bulb]
      - canonical: "Sufi Washing Soap 250 gm Cake"
        aliases: [washing soap, sufi soap]
      - canonical: "Match Box"
        aliases: [matches, matchbox]
      - canonical: "Petrol Super"
        aliases: [petrol, super petrol]
      - canonical: "Hi-Speed Diesel"
        aliases: [diesel, hsd]
      - canonical: "LPG 11.67 kg Cylinder"
        aliases: [lpg, gas cylinder]
