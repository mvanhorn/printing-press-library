version: "2"

linters:
  enable:
    - errorlint
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck

  settings:
    errcheck:
      # The fmt print family writing to stdout/stderr. Excluded as a
      # deliberate, documented decision rather than by adding 294 `_ =`
      # assignments across the tree.
      #
      # MEASURED with `golangci-lint run --max-issues-per-linter=0
      # --max-same-issues=0`: 294 of the 379 production errcheck findings are
      # unchecked fmt.Fprintf/Fprintln/Fprint calls to an io.Writer that is
      # stdout, stderr or a bytes.Buffer. Every one is the ordinary Go idiom,
      # which is why the render-heavy files top the list. Checking them would
      # add nothing a caller could act on: a CLI that cannot write to its own
      # stdout has already lost, and the error is surfaced by the shell.
      #
      # NOTE THE CAP. golangci-lint defaults to max-issues-per-linter=50 and
      # max-same-issues=3, so a default run TRUNCATES this list and reports a
      # much smaller number. An earlier measurement of "153 issues, none in
      # hand-authored files" was that truncation, not a clean bill of health.
      # Always pass both cap flags when auditing this project.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte

    staticcheck:
      # ST1005 (error strings should not end with punctuation or newlines) is
      # disabled ON PURPOSE, and it is the only check turned off here.
      #
      # Its rationale is that short error strings get wrapped into longer
      # sentences by their callers, where a trailing period reads wrong. This
      # CLI's errors are not that shape: a refusal here is a PARAGRAPH that
      # names what was refused, why, what was measured, and which command to
      # use instead — for example the --ticker refusal, which explains that
      # the crosswalk resolves only 28 of 335 register names and points at
      # --search. Those messages are the product's documentation at the point
      # of failure, they are multi-sentence and multi-line by design, and
      # stripping their punctuation would make them read worse, not better.
      #
      # Every other staticcheck check stays on: the 20 findings it raised
      # elsewhere were real and are either fixed or recorded.
      # This is golangci-lint's OWN DEFAULT check set with ST1005 subtracted,
      # not "all". Writing `all` here would be a silent scope change: it
      # switches on the whole ST* stylecheck family that the default disables,
      # and ST1000 alone then fires on every one of package cli's 100+ files
      # for a missing package comment. The point of this block is to turn ONE
      # check off, not forty on.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023

formatters:
  enable:
    - gofmt
    - goimports
