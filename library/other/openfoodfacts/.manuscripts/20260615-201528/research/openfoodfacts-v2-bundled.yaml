    ProductNutritionDataV3:
      type: object
      title: Product Nutrition Data
      properties:
        nutrition:
          type: object
          description: |
            Fields related to the nutrition facts of a product

            Input nutrient sets can be updated directly with API v3.

            API v2 can still be used to update input sets for the default source (*packaging* on the public platform and *manufacturer* on the pro platform).
          properties:
            aggregated_set:
              type: object
              description: |
                A set that combines nutrient data from preferred sources, with normalized units, 
                and for a normalized 100g or 100ml quantity.

                It takes values from multiple sources (by priority: manufacturer, packaging, usda, estimate)
                and normalizes all values to the same unit: g for weights, kJ for energy and energy-kj, kcal for energy-kcal.

                The aggregated_set is read-only, and cannot be modified directly. It is computed from the other nutrient sets available for the product.
              allOf:
                - $ref: '#/components/schemas/product_nutrition_properties'
                - $ref: '#/components/schemas/nutrients_v3_with_source'
            input_sets:
              type: array
              description: |
                An array of nutrient sets of the product.

                Each nutrient set represents a version of the nutrition facts, defined by a combination of:
                - the source of the data (e.g. *packaging*, *manufacturer*, *estimate*).
                - the preparation state (e.g. *as_sold* or *prepared*),
                - the reference quantity (*per 100g*, *per 100ml* or *per serving*), and                

                This structure allows capturing multiple nutritional profiles for a single product.
              items:
                type: object
                allOf:
                  - $ref: '#/components/schemas/nutrients_v3_base'
                  - $ref: '#/components/schemas/product_nutrition_properties'
                  - type: object
                    properties:
                      per_quantity:
                        type: number
                        minimum: 0
                        description: |
                          The nutrition data on the package can be per serving, per 100g or per 100ml.
                          When the data is given per serving, 
                          the actual quantity that defines one serving may vary between products 
                          and is stored in this field.

                          This is essential to understand to which quantity values in `nutrients` apply for.

                          For example, if the label states "per 250g", then this field should be *250*.
                        example: 250
                      per_unit:
                        type: string
                        description: |
                          The nutrition data on the package can be per serving, per 100g or per 100ml.
                          When the data is given per serving, 
                          the actual unit that defines one serving may vary between products 
                          and is stored in this field.

                          This is essential to understand to which quantity values in `nutrients` apply for.

                          For example, if the label states "per 250g", then this field should be *g*.
                        example: g
                      source:
                        type: string
                        examples:
                          - packaging
                          - manufacturer
                          - usda
                          - estimate
                        description: |
                          The nutrition data of products can be obtained through several sources.
                      source_description:
                        type: string
                        description: |
                          A description of the source used for this nutrition set.

                          This provides more information on how and when the source was used.

                          This property is optional.
                        examples:
                          - USDA non-branded foods 2025/04
                          - Import from org-nestle-france through Equadis
                          - 'Estimate from ingredients”, “Estimate from category: Olive oils'
                      last_updated_t:
                        type: integer
                        description: |
                          A timestamp indicating when this nutrition set was last updated.
                        examples:
                          - 1631270265
                          - 1512153487
                      unspecified_nutrients:
                        type: array
                        description: |
                          A list of nutrients that are typically present, but that are not specified for this particular product,
                          especially for packaging source.

                          This property is optional.
                        items:
                          type: string
                        example:
                          - fibers
  parameters:
    id:
      schema:
        type: string
        example: ingredients_en
      in: query
      name: id
      required: true
    process_image:
      schema:
        type: string
        example: '1'
      in: query
      name: process_image
      required: true
    ocr_engine:
      schema:
        type: string
        example: google_cloud_vision
      in: query
      name: ocr_engine
      required: true
    imgid:
      schema:
        type: string
        example: '1'
      in: query
      name: imgid
      required: true
    angle:
      schema:
        type: string
        example: '90'
      in: query
      name: angle
      required: true
    page:
      schema:
        type: integer
        example: 24
      in: query
      name: page
      description: |
        The page number you request to view (eg. in search results spanning multiple pages)
    page_size:
      schema:
        type: integer
        example: 24
      in: query
      name: page_size
      description: |
        The number of elements should be sent per page
    sort_by:
      schema:
        type: string
        example: product_name
        enum:
          - product_name
          - last_modified_t
          - scans_n
          - unique_scans_n
          - created_t
          - completeness
          - popularity_key
          - nutriscore_score
          - nova_score
          - nothing
          - ecoscore_score
      in: query
      name: sort_by
      description: |
        The allowed values  used to sort/order the search results.

        * `product_name` sorts on name
        * `ecoscore_score`, `nova_score`, `nutriscore_score` rank on the [Eco-Score](https://world.openfoodfacts.org/eco-score-the-environmental-impact-of-food-products), [Nova](https://world.openfoodfacts.org/nova), or [Nutri-Score](https://world.openfoodfacts.org/nutriscore)
        * `scans_n`, `unique_scans_n` and `popularity_key` are about product popularity: number of scans on unique scans, rank of product
        * `created_t`, `last_modified_t`, are about creation and modification dates
        * `nothing`, tells not to sort at all (because if you do not provide the sort_by argument we default to sorting on popularity (for food) or last modification date)
    term:
      schema:
        type: string
        example: f
      in: query
      name: term
    RequestedProductType:
      name: product_type
      in: query
      description: |
        Used for READ queries for one product. Expected product type of the requested product. Defaults to the product type of the server the query is sent to (e.g. 'food' for Open Food Facts, 'beauty' for Open Beauty Facts, etc.). 'all' matches all product types. If the product exists on a different server that matches the requested product type, the API will return a 302 redirect to the correct server. Otherwise, the API will return a 404 error. It is possible that new product types will be added in the future.
      required: false
      schema:
        type: string
        enum:
          - all
          - beauty
          - food
          - petfood
          - product
        description: Expected product type of the requested product
        examples:
          - all
          - food
    Cc:
      name: cc
      in: query
      description: 2 letter code of the country of the user. Used for localizing some fields in returned values (e.g. knowledge panels). If not passed, the country may be inferred by the IP address of the request.
      required: false
      schema:
        type: string
        example: us
    Lc:
      name: lc
      in: query
      description: |
        2 letter code of the language of the user.
        Used for localizing some fields in returned values (e.g. knowledge panels).
        If not passed, the language may be inferred by the domain name prefix.
      required: false
      schema:
        type: string
        example: fr
    ProductAvailableFields:
      name: fields
      in: query
      description: Specific fields to return. Use 'knowledge_panels' for Knowledge Panels only.
      required: false
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_.-]+(,[a-zA-Z0-9_.-]+)*$
        description: Custom comma-separated list of product field names
        examples:
          - knowledge_panels
          - knowledge_panels,product_name,nutriments
          - categories_tags,packaging_tags
          - allergens_tags,nutriscores
          - images,brands_tags,categories_tags,countries_tags,languages_tags,ecoscore_tags
    KnowledgePanelClient:
      name: knowledge_panel_client
      in: query
      description: 'Client requesting knowledge panels. Used to customize which knowledge panels are returned. Example values: "web", "mobile". Defaults to "app" for all API requests, and "web" for all other requests.'
      required: false
      schema:
        type: string
        example: web
    ActivateKnowledgePanelsSimplified:
      name: activate_knowledge_panels_simplified
      in: query
      description: If true, knowledge panels will include the simplified_root knowledge panel its simplified sub-panels (e.g. simplified health and environment cards)
      required: false
      schema:
        type: boolean
        example: true
    ActivateKnowledgePanelPhysicalActivities:
      name: activate_knowledge_panel_physical_activities
      in: query
      description: If true, knowledge panels will include the physical activities panel
      required: false
      schema:
        type: boolean
        example: true
    KnowledgePanelsIncluded:
      name: knowledge_panels_included
      in: query
      description: |
        When knowledge_panels are requested, you can specify which panels should be in the response. All the others will be excluded.
      required: false
      schema:
        type: string
        example: health_card, environment_card
    KnowledgePanelsExcluded:
      name: knowledge_panels_excluded
      in: query
      description: |
        When knowledge_panels are requested, you can specify which panels to exclude from the response. All the others will be included.
        If a panel is both excluded and included (with the knowledge_panels_excluded parameter), it will be excluded.
      required: false
      schema:
        type: string
        example: health_card, environment_card
