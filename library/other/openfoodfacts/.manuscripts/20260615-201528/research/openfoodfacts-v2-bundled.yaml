openapi: 3.1.0
info:
  title: Open Food Facts Open API
  description: |
    As a developer, the Open Food Facts API allows you to get information
    and contribute to the products database. You can create great apps to
    help people make better food choices and also provide data to enhance the database.

    **IMPORTANT**: Please read the [API introduction](https://openfoodfacts.github.io/openfoodfacts-server/api/) before using this API.
  termsOfService: https://world.openfoodfacts.org/terms-of-use
  contact:
    name: Open Food Facts
    url: https://slack.openfoodfacts.org/
    email: reuse@openfoodfacts.org
  license:
    name: 'data: ODbL'
    url: https://opendatacommons.org/licenses/odbl/summary/index.html
    x-identifier: ODbL-1.0
  version: '2'
servers:
  - description: dev
    url: https://world.openfoodfacts.net
  - description: prod
    url: https://world.openfoodfacts.org
  - description: proxy (for doc purpose)
    url: http://localhost:8080
security:
  - userAgentAuth: []
tags:
  - name: Products
    description: Endpoints for managing product data and information.
  - name: Images
    description: Endpoints for uploading, cropping, rotating, and managing product images.
  - name: Search
    description: Endpoints for searching products with various filters and criteria.
  - name: OCR
    description: Endpoints for optical character recognition on product labels.
  - name: Suggestions
    description: Endpoints for getting suggestions to aid in product editing.
  - name: Nutrients
    description: Endpoints for retrieving nutrition-related data and facts.
  - name: Personal Search
    description: Endpoints for personalized search and recommendations.
  - name: Authentication
    description: Endpoints for user authentication and session management.
externalDocs:
  description: |
    **IMPORTANT**: Please read the API introduction before using this API.
  url: https://openfoodfacts.github.io/openfoodfacts-server/api/
paths:
  /api/v2/product/{code}:
    get:
      tags:
        - Products
      summary: Get Product Details
      description: |
        Fetches product details by its unique barcode. 
        Can return all product details or specific fields like knowledge panels.

        Use the `blame` parameter to include information about who last modified each field of the product.
      operationId: get-product-by-code
      parameters:
        - name: code
          in: path
          description: The barcode of the product to be fetched
          required: true
          style: simple
          explode: false
          schema:
            type: string
            examples:
              - '3017620422003'
        - $ref: '#/components/parameters/RequestedProductType'
        - $ref: '#/components/parameters/Cc'
        - $ref: '#/components/parameters/Lc'
        - $ref: '#/components/parameters/ProductAvailableFields'
        - $ref: '#/components/parameters/KnowledgePanelClient'
        - $ref: '#/components/parameters/ActivateKnowledgePanelsSimplified'
        - $ref: '#/components/parameters/ActivateKnowledgePanelPhysicalActivities'
        - $ref: '#/components/parameters/KnowledgePanelsIncluded'
        - $ref: '#/components/parameters/KnowledgePanelsExcluded'
        - $ref: '#/components/parameters/Blame'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: get_product_by_barcode_all_response
                oneOf:
                  - $ref: '#/components/schemas/get_product_by_barcode'
                  - title: get_product_by_barcode_knowledge_panels_response
                    allOf:
                      - $ref: '#/components/schemas/get_product_by_barcode_base'
                      - type: object
                        properties:
                          product:
                            $ref: '#/components/schemas/product_knowledge_panels'
                  - $ref: '#/components/schemas/get_product_by_barcode_with_blame'
              examples:
                full-product:
                  $ref: '#/components/examples/get_product_by_barcode_spread'
                knowledge-panels:
                  $ref: '#/components/examples/get_product_by_barcode_knowledge_panels'
                with-blame:
                  $ref: '#/components/examples/get_product_by_barcode_with_blame'
        '302':
          description: Redirect to the correct server for the product type of the requested product
          headers:
            Location:
              schema:
                type: string
                description: URL to the correct server
              examples:
                redirect:
                  value: https://world.openbeautyfacts.org/api/v2/product/8710447445990
        '404':
          description: Product not found
  /cgi/product_image_upload.pl:
    post:
      tags:
        - Images
      summary: Upload Product Image
      operationId: get-cgi-product_image_upload.pl
      description: |
        Photos are source and proof of data.
        The first photo uploaded for a product is
        auto-selected as the product’s “front” photo.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add_photo_to_existing_product-2'
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/add_photo_to_existing_product'
                - $ref: '#/components/schemas/change_ref_properties'
        description: ''
      security:
        - cookieAuth: []
          userAgentAuth: []
  /cgi/ingredients.pl:
    parameters: []
    get:
      summary: OCR on Ingredients
      operationId: get-cgi-ingredients.pl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ocr_on_product'
      description: |
        Open Food Facts uses optical character recognition (OCR) to retrieve nutritional data and other information from the product labels.
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/Code'
        - $ref: '#/components/parameters/process_image'
        - $ref: '#/components/parameters/ocr_engine'
      tags:
        - OCR
  /cgi/product_image_crop.pl:
    post:
      summary: Select and Crop Image
      operationId: post-cgi-product_image_crop.pl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product_image_crop'
      description: |
        Cropping is only relevant for editing existing products.
        You cannot crop an image the first time you upload it to the system.
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/crop_a_photo'
                - $ref: '#/components/schemas/change_ref_properties'
        required: true
      tags:
        - Images
    get:
      summary: Rotate Image
      operationId: get-cgi-product_image_crop.pl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rotate_a_photo'
      description: |
        Although we recommend rotating photos manually and uploading a new version of the image,
        the OFF API allows you to make api calls to automate this process.
        You can rotate existing photos by setting the angle to 90º, 180º, or 270º clockwise.
      parameters:
        - $ref: '#/components/parameters/Code'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/imgid'
        - $ref: '#/components/parameters/angle'
      tags:
        - Images
  /cgi/product_image_unselect.pl:
    post:
      summary: Unselect Image
      description: |
        This endpoint allows the user to unselect a photo for a product.
        The user must provide the product code and the image ID to unselect.
      operationId: post-cgi-product_image_unselect.pl
      tags:
        - Images
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/unselect_a_photo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: unselect_a_photo_response
                type: object
                properties:
                  status:
                    type: string
                    description: status of the unselect operation
                    example: status ok
                  status_code:
                    type: number
                    description: status code of the operation
                    example: 0
                  imagefield:
                    type: string
                    example: front_fr
                    description: image field that was unselected
  /cgi/product_jqm2.pl:
    post:
      summary: Edit Product
      operationId: post-cgi-product_jqm2.pl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add_or_edit_a_product-2'
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/add_or_edit_a_product'
                - $ref: '#/components/schemas/change_ref_properties'
      tags:
        - Products
      description: |
        This updates a product.

        Note: If the barcode exists then you will be editing the existing product,
        However if it doesn''t you will be creating a new product with that unique barcode,
        and adding properties to the product.
      security:
        - cookieAuth: []
          userAgentAuth: []
  /api/v2/search:
    get:
      summary: Search Products
      x-pp-resource: find
      tags:
        - Search
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search_for_products'
      operationId: get-search
      description: |
        Search request allows you to get products that match your search criteria.

        It allows you create many custom APIs for your use case.

        If a search query parameter has multiple values, separate them with commas (`,`).
        When filtering with a language-specific parameter (`fr`, `de`, `en`, etc.),
        specify the language code in the parameter name (for example: `categories_tags_en`).

        **Important:** search API v2 does not support full text request (search_term),
        you have to use [search API v1](https://wiki.openfoodfacts.org/API/Read/Search) for that.
        Upcoming [search-a-licious project](https://github.com/openfoodfacts/search-a-licious) will fix that.

        ### Limiting results

        You can limit the size of returned objects thanks to the `fields` object (see below).

        Example: `fields=code,product_name,brands,attribute_groups`

        Please use it as much as possible to avoid overloading the servers.

        The search endpoint uses pagination: see `page` and `page_size` parameters.

        **Beware:** `page_count` is the number of products returned in the current page, not the total number of pages.

        ### Conditions on tags

        All `_tags`` parameters accepts either:

        * a single value
        * or a comma-separated list of values (doing a AND)
        * or a pipe separated list of values (doing a OR)

        You can exclude terms by using a "-" prefix.

        For taxonomized entries, you might either use the tag id (recommended),
        or a known synonym (without language prefix)

        * `labels_tags=en:organic,en:fair-trade` find items that are fair-trade AND organic
        * `labels_tags=en:organic|en:fair-trade` find items that are fair-trade OR organic
        * `labels_tags=en:organic,en:-fair-trade` find items that are organic BUT NOT fair-trade


        ### Conditions on nutriments

        To get a list of nutrients:

        You can either query on nutrient per 100g (`_100g` suffix)
        or per serving (`serving` suffix).

        You can also add `_prepared_`
        to get the nutrients in the prepared product instead of as sold.

        You can add a comparison operator and value to the parameter name
        to get products with nutrient above or below a value.
        If you use a parameter value it exactly match it.

        * `energy-kj_100g<200` products where energy in kj for 100g is less than 200kj
        * `sugars_serving>10` products where sugar per serving is greater than 10g
        * `saturated-fat_100g=1` products where saturated fat per 100g is exactly 10g
        * `salt_prepared_serving<0.1` products where salt per serving for prepared product is less than 0.1g

        ### Combining filters and pagination (examples)

        1. Breakfast cereals with Nutri-Score A or B, with explicit pagination:
           `/api/v2/search?categories_tags_en=breakfast-cereals&nutrition_grades_tags=a|b&page=2&page_size=20&fields=code,product_name,nutrition_grades`

        2. Multiple constraints in one query (category + nutrients + sorting + compact fields):
           `/api/v2/search?categories_tags_en=orange-juices&sugars_100g%3C8&salt_100g%3C0.2&sort_by=last_modified_t&page=1&page_size=24&fields=code,product_name,nutriments`

        3. Include/exclude tags together:
           `/api/v2/search?labels_tags=en:organic,en:-fair-trade&page=1&page_size=24&fields=code,product_name,labels_tags`

        ### Response structure at a glance

        A successful response contains:

        * `count`: total number of matching products
        * `page`: current page number
        * `page_size`: requested number of products per page
        * `page_count`: number of products actually returned in this page
        * `skip`: number of products skipped before this page
        * `products`: array of products for the current page

        Total page count can be computed with:
        `Math.floor((count - 1) / page_size) + 1`

        ### More references

        See also [wiki page](https://wiki.openfoodfacts.org/Open_Food_Facts_Search_API_Version_2)
      parameters:
        - $ref: '#/components/parameters/additives_tags'
        - $ref: '#/components/parameters/allergens_tags'
        - $ref: '#/components/parameters/brands_tags'
        - $ref: '#/components/parameters/categories_tags'
        - $ref: '#/components/parameters/countries_tags'
        - $ref: '#/components/parameters/emb_codes_tags'
        - $ref: '#/components/parameters/labels_tags'
        - $ref: '#/components/parameters/manufacturing_places_tags'
        - $ref: '#/components/parameters/nutrition_grades_tags'
        - $ref: '#/components/parameters/origins_tags'
        - $ref: '#/components/parameters/packaging_tags'
        - $ref: '#/components/parameters/purchase_places_tags'
        - $ref: '#/components/parameters/states_tags'
        - $ref: '#/components/parameters/stores_tags'
        - $ref: '#/components/parameters/traces_tags'
        - $ref: '#/components/parameters/tag_name_with_language_code'
        - $ref: '#/components/parameters/nutrient_lower_than'
        - $ref: '#/components/parameters/nutrient_greater_than'
        - $ref: '#/components/parameters/nutrient_equal'
        - $ref: '#/components/parameters/ProductAvailableFields'
        - $ref: '#/components/parameters/sort_by'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
    parameters: []
  /cgi/suggest.pl:
    get:
      summary: Get Suggestions
      tags:
        - Suggestions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: get-cgi-suggest.pl
      parameters:
        - $ref: '#/components/parameters/Tagtype'
        - $ref: '#/components/parameters/term'
      description: |
        For example , Dave is looking for packaging_shapes that contain the term "fe",
        all packaging_shapes containing "fe" will be returned.
        This is useful if you have a search in your application,
        for a specific product field.
  /cgi/nutrients.pl:
    get:
      summary: Get Nutrients List
      tags:
        - Nutrients
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nutrients'
      operationId: get-cgi-nutrients.pl
      parameters:
        - $ref: '#/components/parameters/Cc'
        - $ref: '#/components/parameters/Lc'
      description: |
        Used to display the nutrition facts table of a product, or to display a form to input those nutrition facts.
  /api/v2/attribute_groups:
    get:
      summary: Get Attribute Groups
      description: |
        Attributes are at the heart of personal search.
        They score the products according to different criterias,
        which could then be matched to a user's preferences.

        This API helps you list attributes and display them in your application,
        for the user to choose the importance of each criteria.

        note: `/api/v2/attribute_groups_{lc}` is also a valid route, but consider it deprecated
      tags:
        - Personal Search
      operationId: get-attribute-groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: get_attribute_groups_response
                $ref: '#/components/schemas/get_attribute_groups'
      parameters:
        - $ref: '#/components/parameters/Lc'
  /api/v2/preferences:
    get:
      summary: Get Preferences Weights
      description: |
        This endpoint retrieves the weights corresponding to attribute preferences
        for computing personal product recommendations. The weights are used to
        personalize the product recommendations based on user preferences.
      tags:
        - Personal Search
      operationId: get-preferences
      parameters:
        - $ref: '#/components/parameters/Lc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_preferences'
  /cgi/session.pl:
    post:
      summary: Login Session
      operationId: get-cgi-session.pl
      description: Retrieve session cookie for writing operations.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: |
                    Username for login

                    Note: you must always use the username (and not the email)
                    as it is far less brittle.
                password:
                  type: string
                  description: Password for login
                  format: password
              required:
                - user_id
                - password
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Session cookie for subsequent authenticated requests
              examples:
                sessionCookie:
                  value: session=user123&testuser&user_session&abcdef1234567890; domain=.example.net; path=/; SameSite=Lax
        '401':
          description: Authentication failed
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Session cookie containing user ID, username, and session token.
        The value is structured as: user_id&username&user_session&session_token
        e.g. "user_id&exampleuser&user_session&abcdefghijklmnopqrstuvwxyz123456789ABCDEFGHIJKLM".
        The session token is obtained after successful login via the `/cgi/session.pl` endpoint.
    userAgentAuth:
      description: Identification using the User-Agent header. This is recommended in all requests so that we can contact you if there are issues. If we cannot identify the source of problematic API queries, we may have to block them. User-Agent header in the format 'app_name/app_version (URL or contact info)'
      type: apiKey
      in: header
      name: User-Agent
  schemas:
    Product-Base:
      $ref: '#/components/schemas/product_base'
    Product-Misc:
      $ref: '#/components/schemas/product_misc'
    Product-Tags:
      $ref: '#/components/schemas/product_tags'
    Product-Images:
      $ref: '#/components/schemas/product_images'
    Product-Eco-Score:
      $ref: '#/components/schemas/product_ecoscore'
    Product-Ingredients:
      $ref: '#/components/schemas/product_ingredients'
    Product-Nutrition:
      $ref: '#/components/schemas/product_nutrition'
    Product-Nutrition-v3.5:
      $ref: '#/components/schemas/ProductNutritionDataV3'
    Product-Nutriscore:
      $ref: '#/components/schemas/NutriscoreAll'
    Product-Quality:
      $ref: '#/components/schemas/product_quality'
    Product-Extended:
      $ref: '#/components/schemas/product_extended'
    Product-Metadata:
      $ref: '#/components/schemas/product_meta'
    Product-Knowledge-Panels:
      $ref: '#/components/schemas/product_knowledge_panels'
    Product-Attribute-Groups:
      $ref: '#/components/schemas/product_attribute_groups'
    Product:
      $ref: '#/components/schemas/product'
    Ingredient:
      $ref: '#/components/schemas/ingredient'
    Nutrient:
      type: object
      title: nutrient
      properties:
        id:
          type: string
          description: id of the nutrient
        name:
          type: string
          description: Name of the nutrient in the requested language
        important:
          type: boolean
          description: Indicates if the nutrient is always shown on the nutrition facts table
        display_in_edit_form:
          type: boolean
          description: Indicates if the nutrient should be shown in the nutrition facts edit form
        unit:
          description: Default unit of the nutrient
          $ref: '#/components/schemas/nutrient_unit'
        nutrients:
          $ref: '#/components/schemas/Nutrients'
    get_product_by_barcode_base:
      type: object
      title: get_product_by_barcode_base_response
      properties:
        code:
          type: string
          description: |
            Barcode of the product
            (can be EAN-13 or internal codes for some food stores).
            For products without a barcode, Open Food Facts assigns a 
            number starting with the 200 reserved prefix.
        status:
          type: integer
          enum:
            - 0
            - 1
          description: Return values based on ProductOpener/Display.pm analysis
        status_verbose:
          type: string
    product_type:
      type: object
      description: Product type information
      properties:
        product_type:
          type: string
          description: |
            The product type is a fundamental separation that tells on which platform the product is made available:
            Open Food Facts, Open Beauty Facts, Open Pet Food Facts or Open Products Facts.

            Each platform has variations on the way it analyses the product.

            Changing the product type moves the product to the new platform.
            It must be done thoughtfully.
          enum:
            - beauty
            - food
            - petfood
            - product
    product_base:
      type: object
      description: |
        Base product data
      required:
        - code
        - schema_version
      allOf:
        - $ref: '#/components/schemas/product_type'
      properties:
        product_name:
          type: string
          description: |
            The name of the product in the main language of the product (lang field) 
        abbreviated_product_name:
          type: string
          description: Abbreviated product name (e.g. abbreviated product name printed on receipts) in the main language of the product (lang field)
        code:
          type: string
          description: |
            barcode of the product (can be EAN-13 or internal codes for some food stores),
            for products without a barcode,
            Open Food Facts assigns a number starting with the 200 reserved prefix
        codes_tags:
          type: array
          items:
            type: string
            description: |
              A value which is the type of barcode "code-13" or "code-8"
              and
              A series of mask for the barcode
              It helps retrieve barcodes starting by
            examples:
              - code-13
              - 3017620422xxx
              - 301762042xxxx
              - 30176204xxxxx
              - 3017620xxxxxx
              - 301762xxxxxxx
              - 30176xxxxxxxx
              - 3017xxxxxxxxx
              - 301xxxxxxxxxx
              - 30xxxxxxxxxxx
              - 3xxxxxxxxxxxx
        generic_name:
          type: string
          description: |
            Generic / legal name of the product in the main language of the product (lang field)
        id:
          description: |
            internal identifier for the product, usually set to the value of `code`,
            except on the producers platform where it is prefixed by the owner
          type: string
        lc:
          type: string
          description: |
            Main language of the product.
            This is a duplicate of `lang` property (for historical reasons).
        lang:
          type: string
          description: |
            Main language of the product.

            This should be the main language of product packaging (if one is predominant).

            Main language is also used to decide which ingredients list to parse.
        nova_group:
          type: integer
          description: |
            Nova group as an integer from 1 to 4. See https://world.openfoodfacts.org/nova
        nova_groups:
          type: string
        obsolete:
          type: string
        obsolete_since_date:
          description: |
            A date at which the product was declared obsolete.
            This means it's not produced any more.
          type: string
        product_quantity:
          type: string
          description: |
            The size in g or ml for the whole product.
            It is a normalized version of the `quantity` field.
            A `quantity` of "2 x 60 g" leads to `product_quantity`: "120".
          example: '500'
        product_quantity_unit:
          type: string
          description: |
            The unit (either g or ml) for the corresponding `product_quantity`.
            It is computed from the `quantity` field.
            A `quantity` of "6 x 250 ml" leads to `product_quantity_unit`: "ml".
          example: g
        quantity:
          type: string
          description: |
            The quantity of the product, with the corresponding number of portions or unit (g, ml, kg, l, cl, oz, lbs...).
            It should be the value as displayed on the product. The ℮ sign is allowed.
            When it refers to the number of portions, it can be filled without any units (e.g. "6 eggs").
          example: 3 x 150 g
        schema_version:
          type: integer
          description: |
            Version of the product object schema used in the response.
            This indicates the structure of the 'product' field itself.
            For more details, please read: https://openfoodfacts.github.io/openfoodfacts-server/api/ref-api-and-product-schema-change-log
          example: 999
      patternProperties:
        product_name_(?<language_code>\w\w):
          type: string
          description: |
            Product name in language designated by `language_code`, e.g. product_name_fr
        abbreviated_product_name_(?<language_code>\w\w):
          type: string
          description: Abbreviated product name in language `language_code`.
        generic_name_(?<language_code>\w\w):
          type: string
          description: |
            Generic/legal name in language designated by `language_code`, e.g. generic_name_en.
    shape:
      title: Packaging component shape
      x-stoplight:
        id: xrj8agza3dwgf
      type: object
      description: The shape property is canonicalized using the packaging_shapes taxonomy. Taxonomized values are available using the partial taxonomy API, the autosuggest API or the full packaging_shapes taxonomy JSON export.
      examples:
        - id: en:bottle
          lc_name: bouteille
      properties:
        id:
          type: string
          description: Canonical id of the entry in the taxonomy. If the value cannot be mapped to a taxonomy entry, the value will be the name of the entry in its original language prefixed by the language 2 letter code and a colon.
        lc_name:
          type: string
          description: Name of the entry in the language requested in the tags_lc field of the request. This field is returned only of tags_lc is specified. If the translation is not available, or if the entry does not exist in the taxonomy, the value will be the name of the entry in its original language prefixed by the language 2 letter code and a colon.
    material:
      title: Packaging component material
      type: object
      description: The material property is canonicalized using the packaging_materials taxonomy. Taxonomized values are available using the partial taxonomy API, the autosuggest API or the full packaging_material taxonomy JSON export.
      examples:
        - id: en:bottle
          lc_name: bouteille
      properties:
        id:
          type: string
          description: Canonical id of the entry in the taxonomy. If the value cannot be mapped to a taxonomy entry, the value will be the name of the entry in its original language prefixed by the language 2 letter code and a colon.
        lc_name:
          type: string
          description: Name of the entry in the language requested in the tags_lc field of the request. This field is returned only of tags_lc is specified. If the translation is not available, or if the entry does not exist in the taxonomy, the value will be the name of the entry in its original language prefixed by the language 2 letter code and a colon.
    recycling:
      title: Packaging component recycling instruction
      x-stoplight:
        id: 376tk8e2cmyh2
      type: object
      description: The recycling property is canonicalized using the packaging_recycling taxonomy. Taxonomized values are available using the partial taxonomy API, the autosuggest API or the full packaging_recycling taxonomy JSON export.
      examples:
        - id: en:bottle
          lc_name: bouteille
      properties:
        id:
          type: string
          description: Canonical id of the entry in the taxonomy. If the value cannot be mapped to a taxonomy entry, the value will be the name of the entry in its original language prefixed by the language 2 letter code and a colon.
        lc_name:
          type: string
          description: Name of the entry in the language requested in the tags_lc field of the request. This field is returned only of tags_lc is specified. If the translation is not available, or if the entry does not exist in the taxonomy, the value will be the name of the entry in its original language prefixed by the language 2 letter code and a colon.
    packaging_component:
      description: |-
        Each packaging component has different properties to specify how many there are, its shape, material etc.

        The shape, material and recycling properties are mapped to one entry in the packaging_shapes, packaging_materials and packaging_recycling taxonomies, and the value of the property is the canonical name of the taxonomy entry (e.g. en:bottle).

        They may contain values that could not yet get matched to their respective taxonomy, in which case they will contain a free text value prefixed with the language code of this text value (e.g. "fr:Bouteille sphérique" might have been entered by a French user to indicate it is a spherical bottle).
      title: Packaging component (READ)
      type: object
      examples:
        - number_of_units: 6
          shape:
            id: en:bottle
            lc_name: bouteille
          material:
            id: en:bottle
            lc_name: bouteille
          recycling:
            id: en:bottle
            lc_name: bouteille
          quantity_per_unit: 25 cl
          quantity_per_unit_value: 25
          quantity_per_unit_unit: cl
          weight_specified: 30
          weight_measured: 32
          weight_estimated: 26
          weight: 30
          weight_source_id: specified
      properties:
        number_of_units:
          type: integer
          description: umber of units of this packaging component contained in the product (e.g. 6 for a pack of 6 bottles)
        shape:
          $ref: '#/components/schemas/shape'
        material:
          $ref: '#/components/schemas/material'
        recycling:
          $ref: '#/components/schemas/recycling'
        quantity_per_unit:
          type: string
          description: Quantity (weight or volume) of food product contained in the packaging component. (e.g. 75cl for a wine bottle)
        quantity_per_unit_value:
          type: number
          description: Value parsed from the quantity field.
        quantity_per_unit_unit:
          type: string
          description: Unit parsed and normalized from the quantity field.
        weight_specified:
          type: number
          description: Weight (as specified by the manufacturer) of one unit of the empty packaging component (in grams). (e.g. for a 6 pack of 1.5l water bottles, it might be 30, the weight in grams of 1 empty water bottle without its cap which is a different packaging component).
        weight_measured:
          type: number
          description: Weight (as measured by one or more users) of one unit of the empty packaging component (in grams). (e.g. for a 6 pack of 1.5l water bottles, it might be 30, the weight in grams of 1 empty water bottle without its cap which is a different packaging component).
        weight_estimated:
          type: number
          description: Weight (as estimated from similar products) of one unit of the empty packaging component (in grams). (e.g. for a 6 pack of 1.5l water bottles, it might be 30, the weight in grams of 1 empty water bottle without its cap which is a different packaging component).
        weight:
          type: number
          description: Weight of one unit of the empty packaging component.
        weight_source_id:
          type: string
          description: Indicates which field was used to populate the "weight" field. Either "specified", "measured", or "estimated"
    packagings:
      type: array
      title: Packagings (READ)
      description: |-
        The packagings object is an array of individual packaging component objects.

        The Packaging data document explains how packaging data is structured in Open Food Facts: https://openfoodfacts.github.io/openfoodfacts-server/dev/explain-packaging-data/

        The shape, material and recycling properties of each packaging component are linked to entries in the packaging_shapes, packaging_materials and packaging_recycling taxonomies:

        https://world.openfoodfacts.org/data/taxonomies/packaging_shapes.json
        https://world.openfoodfacts.org/data/taxonomies/packaging_materials.json
        https://world.openfoodfacts.org/data/taxonomies/packaging_recycling.json

        If the tags_lc field is set, the properties will include a lc_name field with the translation in the requested language.
      examples:
        - - number_of_units: 6
            shape:
              id: en:bottle
              lc_name: bouteille
            material:
              id: en:bottle
              lc_name: bouteille
            recycling:
              id: en:bottle
              lc_name: bouteille
            quantity_per_unit: 25 cl
            quantity_per_unit_value: 25
            quantity_per_unit_unit: cl
            weight_specified: 30
            weight_measured: 32
            weight_estimated: 26
            weight: 30
            weight_source_id: specified
      items:
        $ref: '#/components/schemas/packaging_component'
      readOnly: true
    packagings_complete:
      title: packagings_complete
      type: integer
      minimum: 0
      maximum: 1
      description: Indicate if the packagings array contains all the packaging parts of the product. This field can be set by users when they enter or verify packaging data. Possible values are 0 or 1.
    product_misc:
      type: object
      title: product_misc
      description: |
        Miscellaneous but important fields of a product
      properties:
        additives_n:
          type: integer
          description: |
            Number of food additives.
        checked:
          type: string
        complete:
          type: integer
        completeness:
          type: number
        ecoscore_grade:
          type: string
          description: |
            See also: `ecoscore_tags`
        ecoscore_score:
          type: integer
          description: |
            See also: `ecoscore_tags`
        food_groups:
          type: string
        food_groups_tags:
          type: array
          items:
            type: string
        nutrient_levels:
          description: |
            Traffic light indicators on main nutrients levels
          type: object
          properties:
            fat:
              type: string
              enum:
                - low
                - moderate
                - high
            salt:
              type: string
              enum:
                - low
                - moderate
                - high
            saturated-fat:
              type: string
              enum:
                - low
                - moderate
                - high
            sugars:
              type: string
              enum:
                - low
                - moderate
                - high
        packaging_text:
          type: string
          description: |
            Recycling instructions as raw text, e.g. Plastic
            bottle to recycle, Plastic cap to recycle.
            This will get automatically parsed and
            will be used to compute the Eco-Score.
            You can either request it (if it exists) or
            send it in a specific language.
          example: packaging_text_en
        packagings:
          $ref: '#/components/schemas/packagings'
        packagings_complete:
          $ref: '#/components/schemas/packagings_complete'
        pnns_groups_1:
          description: |
            Category of food according to [French Nutrition and Health Program](https://fr.wikipedia.org/wiki/Programme_national_nutrition_sant%C3%A9)
          type: string
        pnns_groups_1_tags:
          type: array
          items:
            type: string
        pnns_groups_2:
          description: |
            Sub Category of food according to [French Nutrition and Health Program](https://fr.wikipedia.org/wiki/Programme_national_nutrition_sant%C3%A9)
          type: string
        pnns_groups_2_tags:
          type: array
          items:
            type: string
        popularity_key:
          description: |
            An imprecise measurement of popularity based on Scan statistics. A higher value means higher popularity.
          type: integer
        popularity_tags:
          description: |
            Indicators for the popularity of a product, like the amount of scans in a specific year.
            `popularity_tags` values from previous years are kept, if there is no popularity_tags at all, then it was never popular.
            This field must be used with care. In countries where Open Food Facts is not widely used, 
            a product may obtain the value "top-90-percent-scans-2021" with a single scan.
          type: array
          items:
            type: string
          example:
            - bottom-25-percent-scans-2020
            - top-85-percent-scans-2021
            - top-90-percent-scans-2022
            - top-country-it-scans-2019
            - top-100000-mg-scans-2024
        scans_n:
          type: integer
          description: |
            Number of scans performed with the official Open Food Facts mobile application, the last year 
            for which the product was scanned (current year excluded). This value is computed once a year by scanbot.pl.
            It is possible that a product has never been scanned at all: `scans_n` is not given in this case.
            See also `unique_scans_n` field.
        unique_scans_n:
          type: integer
          description: |
            Number of unique scans performed with the official Open Food Facts mobile application, the last year 
            for which the product was scanned (current year excluded).
            Unique scans means it is based on different IPs.
            This value is computed once a year by scanbot.pl.
            See also `scans_n` field.
        serving_quantity:
          type: string
          description: |
            Normalized version of serving_size.
            Note that this is NOT the number of servings by product.
            <small>(in perl, see `normalize_serving_size`)</small>
        serving_quantity_unit:
          type: string
          description: |
            The unit (either g or ml) for the correponding serving_quantity.
          example: g
        serving_size:
          type: string
          description: |
            Serving size text (generally in g or ml).
            We expect a quantity + unit but the user is free to input any string.
      patternProperties:
        food_groups_(?<language_code>\w\w):
          type: string
          description: see `food_groups`
        packaging_text_(?<language_code>\w\w):
          type: string
          description: |
            Packaging text in language designated by `language_code`
    indexed_taxonomy_tag_entry:
      title: Indexed taxonomy tag entry (lossy, for search only)
      type: string
      description: |-
        This field is used for search only. It is a lossy representation of the taxonomy tag entry, that can be used to index the entry in a search engine.
        A tag entry, that has been matched against a taxonomy (e.g. a category, a label)

        The entry is a string that can contain either:

        - a taxonomy entry id, in the form [2 letter language code]:[normalized canonical name] (e.g. "en:green-teas") -> for entries that could be matched to a taxonomy entry
        - a string in a specific language, prefixed by the 2 letter language code, and normalized (deaccented and lowercased, depending on language)
        (e.g. "fr:thes-verts") -> for entries that could not be matched to a taxonomy entry
    product_base_tags:
      type: object
      title: Product Base Tags
      properties:
        brands:
          type: string
          description: |
            Comma separated list of brands (not taxonomized), in the last language used to edit it (recorded in brands_lc)
            This field is mostly used for debugging and testing purposes. Do not use it for display purposes.
        brands_tags:
          type: array
          description: |
            An array of indexed brands tag entries (for search).

            That is the id of brands found in taxonomy + 
            brands not found in taxonomy (with case / accents / spaces normalized).

            This is mostly used for search as the normalization of entries not in the taxonomy is lossy.
          items:
            $ref: '#/components/schemas/indexed_taxonomy_tag_entry'
        categories:
          type: string
          description: |
            Comma separated list of categories (not taxonomized), in the last language used to edit it (recorded in categories_lc)
            This field is mostly used for debugging and testing purposes. Do not use it for display purposes.
        categories_tags:
          type: array
          description: |
            An array of indexed categories tag entries (for search).

            That is the id of categories found in taxonomy + 
            categories not found in taxonomy (with case / accents / spaces normalized).

            This is mostly used for search as the normalization of entries not in the taxonomy is lossy.
          items:
            $ref: '#/components/schemas/indexed_taxonomy_tag_entry'
        checkers_tags:
          type: array
          items:
            type: string
            description: List of checkers (users who checked the product) tags
        cities:
          type: string
        cities_tags:
          type: array
          items:
            type: object
        correctors_tags:
          type: array
          items:
            type: string
        countries:
          type: string
          description: |
            List of countries where the product is sold.
        countries_tags:
          type: array
          items:
            type: string
        ecoscore_tags:
          description: |
            All ecoscore of a product.
            Most of the time it's only one value,
            but it might eventually be more for products composed of sub-products.
            See also: `ecoscore_score`, `ecoscore_grade`.
          type: array
          items:
            type: string
        emb_codes:
          type: string
          description: |
            Packager code. EMB is the French system of traceability codes for packager.
          example: EMB 2013330
        emb_codes_tags:
          type: array
          items:
            type: object
        labels:
          type: string
        labels_tags:
          type: array
          items:
            type: string
        entry_dates_tags:
          description: |
            The data as a series of tag: `yyyy-mm-dd`, `yyyy-mm`, `yyyy`
          type: array
          items:
            type: string
          examples:
            - - '2016-03-11'
              - 2016-03
              - '2016'
        manufacturing_places:
          type: string
          description: |
            Places where the product was manufactured or transformed.
        manufacturing_places_tags:
          type: array
          items:
            type: string
        nova_groups_tags:
          type: array
          items:
            type: string
        nutrient_levels_tags:
          type: array
          items:
            type: string
    taxonomy_tag_entry:
      title: Canonicalized taxonomy tag entry
      type: string
      description: |-
        A tag entry, that has been matched against a taxonomy (e.g. a category, a label)

        The entry is a string that can contain either:

        - a taxonomy entry id, in the form [2 letter language code]:[normalized canonical name] (e.g. "en:green-teas") -> for entries that could be matched to a taxonomy entry
        - a string in a specific language, prefixed by the 2 letter language code (e.g. "fr:Thés verts") -> for entries that could not be matched to a taxonomy entry
    product_tags:
      type: object
      description: |
        Data about a product which is represented as tags
      allOf:
        - $ref: '#/components/schemas/product_base_tags'
        - type: object
          properties:
            brands_hierarchy:
              type: array
              description: |
                An array of brands tag entries (for display and editing).

                That is the id of brands found in taxonomy + 
                brands not found in taxonomy (as-is, with no normalization).

                This is the field that should be used for display purposes, as it is not lossy.
              items:
                $ref: '#/components/schemas/taxonomy_tag_entry'
            brands_lc:
              type: string
              description: Language code of the last edit for brands
            categories_hierarchy:
              type: array
              description: |
                An array of categories tag entries (for display and editing).

                That is the id of categories found in taxonomy + 
                categories not found in taxonomy (as-is, with no normalization).

                This is the field that should be used for display purposes, as it is not lossy.
              items:
                $ref: '#/components/schemas/taxonomy_tag_entry'
            categories_lc:
              type: string
              description: Language code of the last edit for categories
            countries_hierarchy:
              type: array
              items:
                type: string
            countries_lc:
              type: string
              description: Countries language code
            emb_codes_orig:
              type: string
            labels_hierarchy:
              type: array
              items:
                type: string
            labels_lc:
              type: string
    image_size:
      type: object
      title: image_size
      description: |
        Width and height of an image
      properties:
        h:
          type: integer
          example: 400
          description: |
            The height of the reduced/full image in pixels.
        w:
          type: integer
          example: 255
          description: |
            The width of the reduced/full image in pixels.
    ImageRole:
      title: image_role
      type: object
      description: |
        property of an image (or part thereof) selected for a particular role and a particular language.
      properties:
        angle:
          type: integer
          example: 0
          description: The angle of the image rotation (if it was rotated).
        coordinates_image_size:
          type: string
          example: full
        geometry:
          type: string
          example: 0x0--1--1
        imgid:
          type: string
          example: '121'
          description: The id of the original/source image that was selected to edit(rotate, normalize etc) to produce this new image.
        normalize:
          type:
            - string
            - boolean
            - 'null'
          examples:
            - null
            - 'false'
            - 'true'
          description: Normalize colors.
        rev:
          type: string
          example: '420'
        sizes:
          type: object
          description: |
            The available image sizes for the product (both reduced and full). 
            The reduced images are the ones with numbers as the key( 100, 200 etc)
            while the full images have `full` as the key.
          properties:
            '100':
              $ref: '#/components/schemas/image_size'
            '200':
              $ref: '#/components/schemas/image_size'
            '400':
              $ref: '#/components/schemas/image_size'
            full:
              $ref: '#/components/schemas/image_size'
        white_magic:
          type:
            - string
            - boolean
            - 'null'
          examples:
            - null
            - 'false'
            - 'true'
          description: |
            Photo on white background : Try to remove the background.
        x1:
          type: string
          example: '-1'
        x2:
          type: string
          example: '-1'
        y1:
          type: string
          example: '-1'
        y2:
          type: string
          example: '-1'
    Sizes:
      type: object
      description: |
        The available image sizes for the product (both reduced and full).
        The reduced images are the ones with numbers as the key( 100, 200 etc)
        while the full images have `full` as the key.
      properties:
        full:
          $ref: '#/components/schemas/image_size'
      patternProperties:
        (?<image_size>100|400):
          description: |
            properties of thumbnail of size `image_size`.
            **TODO** explain how to compute name

            For real type: see description of property `full`.
            (Put this way because of a [bug in rapidoc](https://github.com/rapi-doc/RapiDoc/issues/880))
          type: string
    Image:
      type: object
      title: image
      description: |
        This object represent an image that was uploaded to a product.
        "imgid" is an integer which is a sequential number unique to each picture.
      properties:
        imgid:
          type: integer
          example: 123456789
          description: |
            If the image is selected as the front / ingredients / nutrition / packaging image,
            this is the index to access the original image URL in the `images` field of the product.
            If the image is not selected as one of these, this field is null.

            So if the product has the following `images` field:

            ```json
            "images": {
              1: { ... },
              front_en: { imgid: 1, ... },
              ...
            }
            ```

            then the front image can be accessed by `images[1]`.
        sizes:
          $ref: '#/components/schemas/Sizes'
        uploaded_t:
          type: string
          example: '1457680652'
          description: |
            The time the image was uploaded (as unix timestamp).
        uploader:
          type: string
          example: openfoodfacts-contributors
          description: |
            The contributor that uploaded the image.
    ImageUrls:
      type: object
      patternProperties:
        (?<language_code>\w\w):
          type: string
          description: url of the image for language `language_code`
    SelectedImage:
      type: object
      description: URLs of thumbnails image of image of type `image_type`
      properties:
        display:
          description: |
            Thumbnail urls of product image (front) adapted to display on product page
          $ref: '#/components/schemas/ImageUrls'
        small:
          description: |
            Thumbnail urls of product image (front) adapted to display on product list page
          $ref: '#/components/schemas/ImageUrls'
        thumb:
          description: |
            Thumbnail urls of product image (front) in smallest format
          $ref: '#/components/schemas/ImageUrls'
    product_images:
      type: object
      title: Product-Images
      description: |
        Information about Images of a product.

        Images ensure the reliability of Open Food Facts data.
        It provides a primary source and proof of all the structured data.
        You may therefore want to display it along the structured information.

        See also tutorials about images:
        * [Getting images](https://openfoodfacts.github.io/openfoodfacts-server/api/how-to-download-images/)
        * [Uploading images](https://openfoodfacts.github.io/openfoodfacts-server/api/tutorial-uploading-photo-to-a-product/)
      properties:
        images:
          description: |
            This contains properties for all images contained on the product.
          type: object
          title: product_images_properties
          properties:
            front:
              $ref: '#/components/schemas/ImageRole'
          additionalProperties:
            $ref: '#/components/schemas/Image'
          propertyNames:
            type: integer
          patternProperties:
            (?<imgid>\d+):
              description: |
                See property `1` to get the real type of those objects
                (Put this way because of a [bug in rapidoc](https://github.com/rapi-doc/RapiDoc/issues/880))
              type: string
            (?<image_type>front|nutrition|ingredients|packaging|other)_(?<language_code>\w\w):
              description: |
                See property `front` to get the real type of those objects
                (Put this way because of a [bug in rapidoc](https://github.com/rapi-doc/RapiDoc/issues/880))
              type: string
        last_image_dates_tags:
          type: array
          items:
            type: string
        last_image_t:
          description: timestamp of last image upload (or update?)
          type: integer
        selected_images:
          type: object
          title: product_selected_images
          description: |
            URL for selected (important) images of the product.

            This is very handy if you display the product to users.
          properties:
            front:
              $ref: '#/components/schemas/SelectedImage'
          patternProperties:
            (?<image_type>front|packaging|ingredients|nutrition|other):
              description: |
                See property `front` to get the real type of those objects
                (Put this way because of a [bug in rapidoc](https://github.com/rapi-doc/RapiDoc/issues/880))
              type: string
        image_small_url:
          type: string
        image_thumb_url:
          type: string
        image_url:
          type: string
      patternProperties:
        image(_(?<image_type>front|packaging|ingredients|nutrition|other))?(_(?<image_size>small|thumb))?_url:
          description: |
            the URL of image of type `image_type` in size `image_size` (or full size if not given).

            The `image_type` tells which image the url correspond to. `image_type` is `front` if not provided.

            The image is the one for current language (affected by `lc` parameter) if an image exists for this language, the image in main product language otherwise.

            **IMPORTANT:** you should use `selected_images` field instead of this one.
          type: string
    EcoscoreCountryCode:
      type: string
      enum:
        - ad
        - al
        - at
        - ax
        - ba
        - be
        - bg
        - ch
        - cy
        - cz
