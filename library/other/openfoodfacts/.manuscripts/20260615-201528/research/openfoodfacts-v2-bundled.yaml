        The packaging_tag in german of product(s) you are searching for.
        The [Open Food Facts Web App](https://world.openfoodfacts.org/facets/packaging) has a list of possible values for `packaging`. 

        You can use multiple values by using a comma separated list.
        You can add a "-" before values to avoid matching a tag.
    purchase_places_tags:
      style: form
      explode: false
      schema:
        type: string
      in: query
      name: purchase_places_tags
      description: |
        The purchase_places_tags of product(s) you are searching for.

        You can use multiple values by using a comma separated list.
        You can add a "-" before values to avoid matching a tag.
    states_tags:
      style: form
      explode: false
      schema:
        type: string
        example: nutrition-facts-completed
      in: query
      name: states_tags
      description: |
        The states_tags in english of product(s) you are searching for.
        The [Open Food Facts Web App](https://world.openfoodfacts.org/facets/states) has a list of possible values for `states`. Translated values are available at https://static.openfoodfacts.org/data/taxonomies/states.json
        You can use multiple values by using a comma separated list.
        You can add a "-" before values to avoid matching a tag.
    stores_tags:
      style: form
      explode: false
      schema:
        type: string
        example: aldi
      in: query
      name: stores_tags
      description: |
        The stores_tags of product(s) you are searching for.

        You can use multiple values by using a comma separated list.
        You can add a "-" before values to avoid matching a tag.
    traces_tags:
      style: form
      explode: false
      schema:
        type: string
      in: query
      name: traces_tags
      description: |
        The traces_tags of product(s) you are searching for.
        The [Open Food Facts Web App](https://world.openfoodfacts.org/facets/traces) shows a list of possible values for `traces`.

        You can use multiple values by using a comma separated list.
        You can add a "-" before values to avoid matching a tag.
    tag_name_with_language_code:
      in: query
      name: <tag_name>_tags_<language_code>
      description: |
        You can add a language code to a specific tag to query it in a specific language
      style: form
      explode: false
      schema:
        type: object
        patternProperties:
          (?<tag_name>\w+)_tags_(?<language_code>\w\w):
            type: string
            description: |
              Will search in the tags corresponding to `tag_name`,
              in the language corresponding to `language_code.

              `tag_name` is one of the field above which have the `_tags`` suffix:
              categories, nutrition_grades, etc.

              `language_code` is a two letter iso language `language_code.

              You can use multiple values by using a comma separated list.
              You can add a "-" before values to avoid matching a tag.
        examples:
          - packaging_tags_de: null
            summary: packaging in German
            value:
              packaging_tags_de: de:Flasche
          - origins_tags_fr: null
            summary: origins in French
            value:
              origins_tags_fr: fr:France
          - categories_tags_en: null
            summary: categories in English
            value:
              categories_tags_en: en:Beer
    nutrient_lower_than:
      in: query
      name: <nutrient>_lt_<value>
      description: |
        Search on nutrient lower than a value
      schema:
        type: object
        patternProperties:
          (?<nutrient>\w+)(?<prepared>_prepared)?(?<portion>100g|serving)<(?<value>\d+):
            type: string
            description: |
              Will search for products with nutrients lower than  `value`
              per `portion` (100g or serving).

              If `prepared` is "prepared" search in prepared product instead of "as sold".

              Important: the parameter value is discarded and should be empty
        examples:
          - salt_100g_lt_2: null
            summary: salt per 100g is lower than 2g (in product as sold)
            value:
              salt_100g<2: 1
    nutrient_greater_than:
      in: query
      name: <nutrient>_gt_<value>
      description: |
        Search on nutrient greater than a value
      schema:
        type: object
        patternProperties:
          (?<nutrient>\w+)(?<prepared>_prepared)?(?<portion>100g|serving)>(?<value>\d+):
            type: string
            description: |
              Will search for products with nutrients more than  `value`
              per `portion` (100g or serving).

              If `prepared` is "prepared" search in prepared product instead of "as sold".

              Important: the parameter value is discarded and should be empty
        examples:
          - carbohydrates_prepared_serving_gt_10: null
            summary: carbohydrates per serving is greater than 10g in prepared product
            value:
              salt_100g>10: 1
    nutrient_equal:
      in: query
      name: <nutrient>_eq_<value>
      description: |
        Search on nutrient for an exact quantity
      schema:
        type: object
        patternProperties:
          (?<nutrient>\w+)(?<prepared>_prepared)?(?<portion>100g|serving):
            type: string
            description: |
              Will search for products with nutrients exactl  the parameter value
              per `portion` (100g or serving).

              If `prepared` is "prepared" search in prepared product instead of "as sold".
        examples:
          - fat_100g_eq_5: null
            summary: fat per 100g is exactly equal to 5g (in product as sold)
            value:
              fat_100g: 5
    Tagtype:
      name: tagtype
      in: query
      description: Type of a tag / id of a tags taxonomy (e.g. categories, labels, ingredients, etc.)
      required: true
      schema:
        type: string
        example: additives
