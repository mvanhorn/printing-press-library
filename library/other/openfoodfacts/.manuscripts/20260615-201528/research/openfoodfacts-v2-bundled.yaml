    EcoscoreCountryValues:
      type: object
      propertyNames:
        $ref: '#/components/schemas/EcoscoreCountryCode'
      additionalProperties:
        type: number
        default: 0
    agribalyse:
      type: object
      properties:
        agribalyse_proxy_food_code:
          type: string
        agribalyse_food_code:
          type: string
