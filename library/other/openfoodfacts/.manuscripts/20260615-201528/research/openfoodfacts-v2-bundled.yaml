              id:
                type: string
                description: Row ID
              style:
                type: string
                description: CSS style for the row
              values:
                type: array
                description: Array of cell values
                items:
                  type: object
                  properties:
                    text:
                      type: string
                      description: Cell text content
                    icon_url:
                      type: string
                      description: URL of an icon to display in the cell
                    percent:
                      type: number
                      description: Percentage value for progress bars (used with percent columns)
                    evaluation:
                      type: string
                      description: Evaluation level (good, bad, neutral, etc.) for styling
                    level:
                      type: integer
                      description: Indentation level
                    style:
                      type: string
                      description: CSS style for the cell
    element:
      title: element
      x-stoplight:
        id: e2ybdrtmx0tme
      type: object
      description: |
        Each element object contains one specific element object such as a text element or an image element.
      properties:
        element_type:
          type: string
          enum:
            - text
            - image
            - action
            - panel
            - panel_group
            - table
          description: |
            The type of the included element object.
            The element_type also indicates which field contains the included element object.
            e.g. if the element_type is "text", the included element object will be in the "text_element" field.

            Note that in the future, new type of element may be added,
            so your code should ignore unrecognized types, and unknown properties.

            TODO: add Map type
        text_element:
          $ref: '#/components/schemas/text_element'
        image_element:
          $ref: '#/components/schemas/image_element'
        action_element:
          $ref: '#/components/schemas/action_element'
        panel_element:
          $ref: '#/components/schemas/panel_element'
        panel_group_element:
          $ref: '#/components/schemas/panel_group_element'
        table_element:
          $ref: '#/components/schemas/table_element'
      required:
        - element_type
    panel:
      title: panel
      type: object
      description: Each panel contains an optional title and an optional array of elements.
      properties:
        type:
          type: string
          description: Type of the panel. If set to "card", the panel and its sub-panels should be displayed in a card. If set to "inline", the panel should have its content always displayed.
        expanded:
          type: boolean
          description: If true, the panel is to be displayed already expanded. If false, only the title should be displayed, and the user should be able to click or tap it to open the panel and display the elements.
        expand_for:
          type: string
          description: If set to "large", the content of the panel should be expanded on large screens, but it should still be possible to unexpand it.
        evaluation:
          type: string
          description: An evaluation status specifically for this title element. This can be used to directly color the icon if 'icon_color_from_evaluation' is true and this field is present, or it might provide context for the title itself. e.g. bad is red. Please be careful in choosing colors, to avoid 50 shades of red.
          example: bad
          enum:
            - good
            - average
            - neutral
            - bad
            - unknown
        half_width_on_mobile:
          type: boolean
          description: If true, suggests that this panel could be rendered as half-width on mobile devices, allowing for side-by-side display with another half-width panel if applicable.
          example: true
        title_element:
          $ref: '#/components/schemas/title_element'
        elements:
          type: array
          description: An ordered list of elements to display in the content of the panel.
          items:
            $ref: '#/components/schemas/element'
        level:
          type: string
          description: |
            a message level, as levels we use in log.
            It might help theming the panel visually. Some possible values: info, recommendation
          example: info
        size:
          type: string
          enum:
            - small
          description: |
            size is either empty (normal display) 
            or small to indicate a panel that should have a smaller font size
          example: small
        topics:
          type: array
          items:
            type: string
            example: health
          description: topics currently include health, environment, problem
    panels:
      type: object
      title: panels
      description: |-
        The panels object is a dictionary of individual panel objects.
        Each key of the dictionary is the id of the panel, and the value is the panel object.

        Apps typically display a number of root panels with known panel ids (e.g. health_card and environment_card). Panels can reference other panels and display them as sub-panels.
      examples:
        - additionalProperties: string
      additionalProperties:
        $ref: '#/components/schemas/panel'
      readOnly: true
    product_knowledge_panels:
      type: object
      description: |
        Knowledge panels for a product
      properties:
        knowledge_panels:
          $ref: '#/components/schemas/panels'
    product_attribute_groups:
      type: object
      description: |
        Specific data about a product to enable personal ranking
      properties:
        attribute_groups:
          type: array
          description: Each element is an attribute that can help compute a personal ranking for the product
          items:
            title: product_attribute_group
            type: object
            properties:
              id:
                type: string
                description: |
                  Unique id of the attribute.

                  It will be use to match against preferences parameters.
              status:
                type: string
                enum:
                  - known
                  - unknown
                description: wether we have the information to really compute this criteria or not.
              title:
                type: string
                description: |
                  A descriptive sentence about the situation of the product concerning attribute
                example: 'Does not contain: Molluscs'
              match:
                type: number
                format: float
                minimum: 0
                maximum: 100
                description: |
                  a numeric value for the match,
                  telling how much the products ranks well for this particular attribute.
                  The higher the value, the better the match.
              grade:
                description: every attribute as a grade for a to e
                type: string
                enum:
                  - unknown
                  - a
                  - b
                  - c
                  - d
                  - e
              name:
                type: string
                description: The name of attribute, for eventual display
              icon_url:
                type: string
                description: an icon representing the attribute match (often using a color)
              description:
                type: string
                description: An eventual description of the value of the property upon which this attribute is based
              description_short:
                type: string
                description: An eventual short description of the value of the property upon which this attribute is based
    product:
      type: object
      title: product
      description: |
        This is all the fields describing a product and how to display it on a page.

        Refer to the different sub schema for more readable entries:

        * [Product Base](#cmp--schemas-product-base): Base fields of a product
        * [Product Misc](#cmp--schemas-product-misc): Miscellaneous but important fields of a product
        * [Product Tags](#cmp--schemas-product-tags): Tags fields on a product
        * [Product Images](#cmp--schemas-product-images): Information about Images of a product
        * [Product Eco-Score](#cmp--schemas-product-ecoscore): Fields related to Eco-Score for a product
        * [Product Ingredients](#cmp--schemas-product-ingredients): Fields about ingredients of a product
        * [Product Nutrition](#cmp--schemas-product-nutrition): Nutrition fields of a product
        * [Product Data Quality](#cmp--schemas-product-quality): fields related to data quality for a product
        * [Product Extended](#cmp--schemas-product-extended): TODO
        * [Product Metadata](#cmp--schemas-product-meta): Metadata of a product (author, editors, etc.)
        * [Product Knowledge Panels](#cmp--schemas-product-knowledge-panels): Knowledge panels for a product
        * [Product Attribute Groups](#cmp--schemas-product-attribute-groups): Attribute groups for personal product matching
      allOf:
        - $ref: '#/components/schemas/product_base'
        - $ref: '#/components/schemas/product_misc'
        - $ref: '#/components/schemas/product_tags'
        - $ref: '#/components/schemas/product_images'
        - $ref: '#/components/schemas/product_ecoscore'
        - $ref: '#/components/schemas/product_ingredients'
        - $ref: '#/components/schemas/product_nutrition'
        - $ref: '#/components/schemas/NutriscoreAll'
        - $ref: '#/components/schemas/product_quality'
        - $ref: '#/components/schemas/product_extended'
        - $ref: '#/components/schemas/product_meta'
        - $ref: '#/components/schemas/product_knowledge_panels'
        - $ref: '#/components/schemas/product_attribute_groups'
    get_product_by_barcode:
      type: object
      title: get_product_by_barcode_response
      allOf:
        - $ref: '#/components/schemas/get_product_by_barcode_base'
        - type: object
          properties:
            product:
              $ref: '#/components/schemas/product'
    blame:
      title: Blame Information
      description: |
        Information about who last modified each field of the product.
        This is returned when the 'blame' parameter is included in the request.
      type: object
      properties:
        fields:
          type: object
          description: Blame information for product fields
          additionalProperties:
            type: object
            properties:
              userid:
                type: string
                description: User ID of the person who last modified this field
                example: editortester
              t:
                type: integer
                description: Unix timestamp when the field was last modified
                example: 1636466428
              rev:
                type: integer
                description: Revision number when the field was last modified
                example: 5
              value:
                type: string
                description: Current value of the field
                example: Some Cookie
              previous_userid:
                type: string
                description: User ID of the person who previously modified this field
                example: previoustester
              previous_t:
                type: integer
                description: Unix timestamp when the field was previously modified
                example: 1636366428
              previous_rev:
                type: integer
                description: Previous revision number
                example: 4
              previous_value:
                type: string
                description: Previous value of the field
                example: Old Cookie Name
        uploaded_images:
          type: object
          description: Blame information for uploaded images
          additionalProperties:
            type: object
            properties:
              userid:
                type: string
                description: User ID of the person who uploaded this image
              t:
                type: integer
                description: Unix timestamp when the image was uploaded
              rev:
                type: integer
                description: Revision number when the image was uploaded
              value:
                type: string
                description: Image filename or identifier
        selected_images:
          type: object
          description: Blame information for selected images
          additionalProperties:
            type: object
            properties:
              userid:
                type: string
                description: User ID of the person who selected this image
              t:
                type: integer
                description: Unix timestamp when the image was selected
              rev:
                type: integer
                description: Revision number when the image was selected
              value:
                type: string
                description: Selected image identifier
        nutriments:
          type: object
          description: Blame information for nutrition facts
          additionalProperties:
            type: object
            properties:
              userid:
                type: string
                description: User ID of the person who last modified this nutriment
              t:
                type: integer
                description: Unix timestamp when the nutriment was last modified
              rev:
                type: integer
                description: Revision number when the nutriment was last modified
              value:
                oneOf:
                  - type: string
                  - type: number
                description: Current value of the nutriment
        packagings:
          type: object
          description: Blame information for packaging data
          additionalProperties:
            type: object
            properties:
              userid:
                type: string
                description: User ID of the person who last modified packaging info
              t:
                type: integer
                description: Unix timestamp when packaging was last modified
              rev:
                type: integer
                description: Revision number when packaging was last modified
              value:
                type: string
                description: Current packaging data signature
    get_product_by_barcode_with_blame:
      type: object
      title: get_product_by_barcode_with_blame_response
      allOf:
        - $ref: '#/components/schemas/get_product_by_barcode_base'
        - type: object
          properties:
            product:
              $ref: '#/components/schemas/product'
            blame:
              $ref: '#/components/schemas/blame'
    add_photo_to_existing_product:
      type: object
      properties:
        code:
          type: string
          description: |
            Barcode of the product
          example: '3017620422003'
        imagefield:
          type: string
          description: |
            Indicates the type of the image and the corresponding language. It should
            be in the format `{IMAGE_TYPE}_{LANG}` format, where `IMAGE_TYPE` is one
            of `front|ingredients|nutrition|packaging|other` and `LANG` is the 2
            letter language code. Use `other` if you don't want the image to be
            selected. Note that the first image of a product is always selected as front
            picture.
          example: front_en
        imgupload_front_en:
          type: string
          format: binary
          description: |
            This field must contain image binary content.
            The format and extension must be one of gif|jpeg|jpg|png|heic.            
            This field is dynamic and dependent on the value of imagefield in the
            request body. It wil be imgupload_the value of the imagefield stated
            earlier. For example, if `imagefield=front_en`, the name of this field
            should be `imageupload_front_en`.
      required:
        - code
        - imagefield
        - imgupload_front_en
    change_ref_properties:
      type: object
      description: |
        Properties that goes in change ref
      properties:
        comment:
          type: string
          description: |
            A comment on the contribution. It will be shown in product changes history.
            Adding meaningful comments help moderators and users understand a single product history.
        app_name:
          type: string
          description: |
            Name of the app providing the information
        app_version:
          type: string
          description: |
            Version of the app providing the information
        app_uuid:
          type: string
          description: |
            When an app uses a single user to log its contributions,
            it might be interesting to know which user of the app is providing the information.
            You can use this field to provide an identifier (eg: an sha1 of the username) that's privacy preserving. Make sure that your salt is strong, perfectly random and secret

            In case we have trouble with one of your user, it helps our moderators revert edits.
        User-Agent:
          type: string
          description: |
            It is required that you pass a specific User-Agent header when you do an API request.
            But some times it's not possible to modify such a header
            (eg. request using JavaScript in a browser).
            In such cases, you can override it with this parameter.
    add_photo_to_existing_product-2:
      title: add_photo_to_existing_product_response
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                example: /product/3017620422003/nutella-ferrero
              filename:
                type: string
                example: ''
              name:
                type: string
                example: Nutella - Ferrero - 400g
              thumbnailUrl:
                type: string
                example: /images/products/301/762/042/2003/123.100.jpg
              code:
                type: string
                example: '3017620422003'
        image:
          type: object
          properties:
            thumb_url:
              type: string
              example: 123.100.jpg
            imgid:
              type: integer
              example: 123
            crop_url:
              type: string
              example: 123.400.jpg
        imgid:
          type: integer
          example: 123
        status:
          type: string
          example: status ok
        imagefield:
          type: string
          example: front_en
        code:
          type: string
          example: '3017620422003'
    ocr_on_product:
      type: object
      title: ocr_on_product_response
      properties:
        status:
          type: integer
          example: 1
    rotate_a_photo:
      type: object
      title: rotate_a_photo_response
      properties:
        status:
          type: string
          example: status ok
        imagefield:
          type: string
          example: nutrition_fr
        image:
          type: object
          properties:
            display_url:
              type: string
              example: nutrition_fr.67.400.jpg
    crop_a_photo:
      type: object
      description: |
        Select a photo and optionally crop/rotate it.
        The origin of the cropping coordinates is the top-left corner.
        Note that rotation is applied *before* cropping, so the cropping bounding box
        is relative to the rotated image.
      required:
        - id
        - code
        - imgid
      properties:
        code:
          type: string
          description: Barcode of the product.
          example: '04963406'
        imgid:
          type: integer
          description: identifier of the image to select, it should be a number
          example: 2
        id:
          type: string
          description: |
            identifier of the selected image field, should be in the format
            `{IMAGE_TYPE}_{LANG}` format, where `IMAGE_TYPE` is one of
            `front|ingredients|nutrition|packaging|other` and `LANG` is the 2 letter
            language code.
            Note that if you select an image for the main language of the product (ex:
            `ingredients_it` if `it` is the main language), this image will be
            displayed on Product Opener for all languages (ex: on
            `https://fr.openfoodfacts.org`, unless `ingredients_fr` exists).
          example: front_en
        x1:
          type: integer
          example: 0
          description: X origin coordinate of the crop, it must be lower than x2
        y1:
          type: integer
          example: 0
          description: Y origin coordinate of the crop, it must be lower than y2
        x2:
          type: integer
          example: 145
          description: X end coordinate of the crop, it must be higher than x1
        y2:
          type: integer
          example: 145
          description: Y end coordinate of the crop, it must be higher than y1
        angle:
          type: integer
          example: 0
          description: |
            angle of the rotation to apply on the selected image.
            passing `90` as value rotate the image 90 degrees counter-clockwise.
        normalize:
          type: string
          example: 'false'
          description: whether the selected image should be normalized using ImageMagick
          enum:
            - 'true'
            - 'false'
        white_magic:
          type: string
          default: 'false'
          description: |
            whether the source image should be white magiced (background removal) using
            ImageMagick.
          enum:
            - 'true'
            - 'false'
    product_image_crop:
      type: object
      title: product_image_crop
      properties:
        status:
          type: string
          examples:
            - status ok
            - status not ok - image not selected - imgid not in uploaded images
            - status not ok - image not selected - image cannot be read
        imgid:
          type: integer
          description: identifier of the processed image
          example: 2
        imagefield:
          type: string
          description: |
            identifier of the selected image field
            (corresponding to the `id` parameter)
    unselect_a_photo:
      type: object
      title: unselect_a_photo_request
      properties:
        code:
          type: string
          description: code of the product
          example: '4251105501381'
        id:
          type: string
          description: image field (image id) of the photo to unselect
          example: front_fr
    add_or_edit_a_product:
      type: object
      description: |
        You can provide most of the properties defined in the product READ schema.
        This includes language-specific fields like product_name_[language_code], ingredients_text_[language_code], etc.
      allOf:
        - $ref: '#/components/schemas/product_type'
      properties:
        code:
          type: string
          description: The barcode of the product to be added or edited
          example: '0074570036004'
        user_id:
          type: string
          description: |
            Username to authenticate with

            Note: you must always use the username (and not the email)
            as it is far less brittle.
        password:
          type: string
          description: Password to authenticate with
          format: password
        lc:
          type: string
          description: 2 letter code of the language of the interface. Used to determine the language of certain fields (e.g. product_name and taxonomy fields like categories and labels). If not passed, the language may be inferred by the country of the user (passed through the cc field or inferred by the IP address). Full list at https://static.openfoodfacts.org/data/taxonomies/languages.json
        lang:
          type: string
          description: 2 letter language code of the main language of the product (the most prominent on the packaging)
        product_name:
          type: string
          description: Product name in the language sent in the lc field. For backward compatibility only, use the field product_name_[language_code] instead.
        abbreviated_product_name:
          type: string
          description: Abbreviated product name. For backward compatibility only, use the field abbreviated_product_name_[language_code] instead.
        generic_name:
          type: string
          description: Legal name of the product. For backward compatibility only, use the field generic_name_[language_code] instead.
        ingredients_text:
          type: string
          description: Raw list of ingredients text. For backward compatibility only, use the field ingredients_text_[language_code] instead.
        packaging_text:
          type: string
          description: Packaging information text. For backward compatibility only, use the field packaging_text_[language_code] instead.
        quantity:
          type: string
          description: Product quantity with unit
        labels:
          type: string
          description: Product labels (comma-separated list)
        categories:
          type: string
          description: Product categories (comma-separated list)
        brands:
          type: string
          description: Product brands (comma-separated list)
        stores:
          type: string
          description: Stores where product is sold
        countries:
          type: string
          description: Countries where product is sold
        origins:
          type: string
          description: Origins of ingredients
        traces:
          type: string
          description: Traces of allergens
        packaging:
          type: string
          description: |
            Packaging type, format, material.
            The [v3 API documentation](https://openfoodfacts.github.io/openfoodfacts-server/api/ref-v3/#operation/post-api-v3-product-barcode)
            has a more structured data for `packaging`.
          example: Frozen
        serving_size:
          type: string
          description: Serving size
        nutrition_data_per:
          type: string
          description: Whether nutrition data is per 100g or per serving. Note that this field applies to all nutriment fields (existing or new). So if its value is changed, all nutrients should be supplied, so that we don't have existing values per 100g when the new values are per serving, or vice versa.
          enum:
            - 100g
            - serving
      patternProperties:
        product_name_(?<language_code>\w\w):
          type: string
          description: Product name in language designated by `language_code`
        abbreviated_product_name_(?<language_code>\w\w):
          type: string
          description: Abbreviated product name in language designated by `language_code`
        generic_name_(?<language_code>\w\w):
          type: string
          description: Generic/legal name in language designated by `language_code`
        ingredients_text_(?<language_code>\w\w):
          type: string
          description: Ingredients list in language designated by `language_code`, as it appears on the packaging
        packaging_text_(?<language_code>\w\w):
          type: string
          description: Packaging information text in language designated by `language_code`
        nutriment_(?<nutrient_id>[\w-]+):
          type: string
          description: Value for the nutrient designated by `nutrient_id` (from nutrients.txt taxonomy, e.g. energy-kj, energy-kcal, fat, saturated-fat, etc.)
        nutriment_(?<nutrient_id>[\w-]+)_unit:
          type: string
          description: Unit for the nutrient designated by `nutrient_id` (from nutrients.txt taxonomy, e.g. energy-kj, fat etc.)
      required:
        - code
    add_or_edit_a_product-2:
      type: object
      title: add_or_edit_a_product_response
      properties:
        status_verbose:
          type: string
          example: fields saved
        status:
          type: integer
          example: 1
    search_for_products:
      type: object
      title: search_for_products_response
      properties:
        count:
          type: integer
          description: |
            Total number of products found
          example: 2701
        page:
          type: integer
          description: |
            Page number of returned results.

            You can get a different page, by using the `page` query parameter.
          example: 1
        page_count:
          type: integer
          description: |
            Number of products returned in the current page.

            This will differ from page_size only on the last page.
          example: 24
        page_size:
          type: integer
          description: |
            Requested number of products per page.

            To get the number of pages, compute:
            `Math.floor((count - 1) / page_size) + 1`
          example: 24
        products:
          type: array
          description: |
            The products matching the query corresponding to current page
          items:
            $ref: '#/components/schemas/product'
        skip:
          type: integer
          description: |
            Number of matching products skipped before the current page.
          example: 0
    nutrient_unit:
      description: |
        The unit in which the nutrient for 100g or per serving is measured.

        The possible values depends on the nutrient.

        * `g` for grams
        * `mg` for milligrams
        * `μg` for micrograms
        * `cl` for centiliters
        * `ml` for mililiters
        * `dv` for recommended daily intakes (aka [Dietary Reference Intake](https://en.wikipedia.org/wiki/Dietary_Reference_Intake))
        * `% vol` for percentage per volume (e.g. alcohol vol per 100 ml)
        * `%` for percentage

        🤓 code: see the [Units module][units-module],
        and [Food:default_unit_for_nid function][default-unit]

        [units-module]: https://openfoodfacts.github.io/openfoodfacts-server/dev/ref-perl-pod/ProductOpener/Units.html
        [default-unit]: https://openfoodfacts.github.io/openfoodfacts-server/dev/ref-perl-pod/ProductOpener/Food.html#default_unit_for_nid_(_%24nid)
      type: string
      enum:
        - g
        - mg
        - μg
        - cl
        - ml
        - dv
        - '% vol'
        - '%'
    Nutrients:
      type: array
      description: |
        Nutrients and sub-nutrients of a product, with their name and default unit.
        (e.g. saturated-fat is a sub-nutrient of fat).
      items:
        $ref: '#/components/schemas/Nutrient'
    get_attribute_groups:
      type: array
      description: |
        List of groups of attributes for personal search in a specific language.
      items:
        title: attribute_group
        type: object
        properties:
          id:
            type: string
            description: unique id of the group
          name:
            type: string
            description: Name of the group
          attributes:
            type: array
            description: |
              Attributes that are part of this group
            items:
              title: attribute
              type: object
              properties:
                id:
                  type: string
                  description: unique id of the attribute
                name:
                  type: string
                  description: Name of the attribute
                icon_url:
                  type: string
                  description: url of icon to display next to the settings for this attribute
                setting_name:
                  type: string
                  description: a description of the attribute to display to users
                setting_note:
                  type: string
                  description: a complementary note on the attribute
                default:
                  type: string
                  enum:
                    - mandatory
                    - very_important
                    - important
                    - not_important
                  description: Indicates the default setting for this attribute
                panel_id:
                  type: string
                  description: Linked knowledge panel (optional)
    get_preferences:
      type: array
      title: get_preferences_response
      description: |
        Rules to apply to compute personal ranking of a product,
        based upon the setting value of each attribute.
      items:
        type: object
        properties:
          id:
            type: string
            description: id for the setting value
            enum:
              - not_important
              - important
              - very_important
              - mandatory
          name:
            type: string
            description: name for the setting value, translated according to `lc` parameter
          factor:
            type: integer
            description: |
              factor to apply to the property of the product corresponding to attributes
              having this setting value
          minimum_match:
            type: integer
            description: |
              FIXME
    product_nutrition_properties:
      type: object
      properties:
        preparation:
          type: string
          enum:
            - as_sold
            - prepared
          description: |
            Indicates whether the nutrition values refer to the product *as_sold* or *prepared*.

            The preparation state affects nutrient values.
        per:
          type: string
          enum:
            - 100g
            - 100ml
            - serving
          description: |
            The nutrition data on the package can be per serving, per 100g or per 100ml.

            This is essential to understand if values in the `nutrients` object apply for a serving, for 100g or for 100ml.
    nutrient_values_v3_base:
      type: object
      description: |
        Quantity of a nutrient

        (per 100g, per 100ml or per serving) in a standard unit (g or ml)
      properties:
        value:
          type: number
          description: |
            A normalized float value for the quantity, computed from `value_string` if it exists.
          examples:
            - 2
            - 4.1
        value_computed:
          type: number
          description: |
            A normalized float value for the quantity, computed by the system (not entered by a user or manufacturer).
            This is used only for values that are computed from other nutrient values, like energy computed from fat, carbohydrates and proteins.
            And salt or sodium computed from each other.
          examples:
            - 150
            - 250.5
        unit:
          type: string
          description: |
            The unit of the value entered by the contributor (a user or the manufacturer), for the product.
            In most cases, this unit is the unit displayed on the product for the nutrient, but it is not guaranteed, as some apps may force specific units when writing nutrient values.          

            The possible values depends on the nutrient.

            * `g` for grams
            * `mg` for milligrams
            * `μg` for micrograms
            * `cl` for centiliters
            * `ml` for mililiters
            * `dv` for recommended daily intakes (aka [Dietary Reference Intake](https://en.wikipedia.org/wiki/Dietary_Reference_Intake))
            * `% vol` for alcohol vol per 100 ml

            🤓 code: see the [Units module][units-module],
            and [Food:default_unit_for_nid function][default-unit]

            [units-module]: https://openfoodfacts.github.io/openfoodfacts-server/dev/ref-perl-pod/ProductOpener/Units.html
