version: 2
project_name: openbdap-pp-cli
changelog:
  disable: true
builds:
  - id: openbdap-pp-cli
    main: ./cmd/openbdap-pp-cli
    binary: openbdap-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/openbdap/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: openbdap-pp-mcp
    main: ./cmd/openbdap-pp-mcp
    binary: openbdap-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: openbdap-pp-cli
    repository:
      owner: aborruso
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Il catalogo Open Data della Ragioneria Generale dello Stato da terminale: ricerca offline, righe filtrate per nome di colonna leggibile e opere pubbliche cercabili per CUP, CIG o codice fiscale."
    install: |
      bin.install "openbdap-pp-cli"
      bin.install "openbdap-pp-mcp"
