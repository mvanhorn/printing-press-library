version: 2
project_name: scientific-consensus-pp-cli
changelog:
  disable: true
builds:
  - id: scientific-consensus-pp-cli
    main: ./cmd/scientific-consensus-pp-cli
    binary: scientific-consensus-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/scientific-consensus/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: scientific-consensus-pp-mcp
    main: ./cmd/scientific-consensus-pp-mcp
    binary: scientific-consensus-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: scientific-consensus-pp-cli
    repository:
      owner: laci141
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Aggregate PubMed, OpenAlex, Crossref, and Europe PMC into evidence summaries, consensus scores"
    install: |
      bin.install "scientific-consensus-pp-cli"
      bin.install "scientific-consensus-pp-mcp"
