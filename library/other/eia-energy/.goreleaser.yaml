version: 2
project_name: eia-energy-pp-cli
changelog:
  disable: true
builds:
  - id: eia-energy-pp-cli
    main: ./cmd/eia-energy-pp-cli
    binary: eia-energy-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/eia-energy/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: eia-energy-pp-mcp
    main: ./cmd/eia-energy-pp-mcp
    binary: eia-energy-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: eia-energy-pp-cli
    repository:
      owner: avanderheyde
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Query metadata-aware US Energy Information Administration series."
    install: |
      bin.install "eia-energy-pp-cli"
      bin.install "eia-energy-pp-mcp"
