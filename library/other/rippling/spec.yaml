components:
  schemas:
    AccrueLeaveActionRequest:
      type: object
      required:
      - action_type
      - payload
      - workflow_definition_id
      properties:
        action_type:
          type: string
          enum:
          - accrue_leave
        payload:
          $ref: '#/components/schemas/AccrueLeavePayloadUnion'
        workflow_definition_id:
          type: string
    AccrueLeaveCompanyLeaveTypePayload:
      type: object
      properties:
        pto_type:
          enum:
          - COMPANY_LEAVE_TYPE
          type: string
        company_leave_type:
          type: string
        balance_unit:
          description: The unit of time to accrue leave in
          enum:
          - HOURS
          - DAYS
          - WEEKS
          type: string
        balance_increment:
          anyOf:
          - type: number
          - type: string
        balance_action_type:
          description: Choose how to adjust the employee's leave balance
          enum:
          - ADD_BALANCE
          - DEDUCT_BALANCE
          type: string
        recipients:
          type: string
        run_id:
          description: Functions Service run_id. When provided, the request returns
            202 and completion is delivered back to the run via SendRunEvent. When
            omitted, the action falls back to synchronous execution.
          type: string
          nullable: true
      required:
      - balance_action_type
      - balance_increment
      - balance_unit
      - company_leave_type
      - pto_type
      - recipients
      title: AccrueLeaveCompanyLeaveTypePayload
      description: Adjust time off balance of a leave policy or a leave type
    AccrueLeaveLeavePolicyPayload:
      type: object
      properties:
        pto_type:
          enum:
          - LEAVE_POLICY
          type: string
        leave_policy:
          type: string
        balance_unit:
          description: The unit of time to accrue leave in
          enum:
          - HOURS
