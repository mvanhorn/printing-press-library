      - IS_NOT_EMPTY
      - BEFORE
      - AFTER
      - LAST_N
      - NEXT_N
      - CURRENT_CALENDAR
      - PREVIOUS_CALENDAR
      description: Comparison operator for the filter. Single-value operators (EQ,
        NE, GT, GTE, LT, LTE, STARTS_WITH, ENDS_WITH, CONTAINS, NOT_CONTAINS, BEFORE,
        AFTER) require a scalar value. List operators (IN, NOT_IN) require a non-empty
        array. Range operators (BETWEEN, NOT_BETWEEN) require an object with 'from'
        and 'to' keys. No-value operators (IS_EMPTY, IS_NOT_EMPTY) do not require
        a value. Rolling-date operators (LAST_N, NEXT_N) require an object with 'unit'
        (DAY, WEEK, MONTH, YEAR) and 'n' (integer). Calendar-date operators (CURRENT_CALENDAR,
        PREVIOUS_CALENDAR) require a unit string (DAY, WEEK, MONTH, QUARTER, YEAR).
