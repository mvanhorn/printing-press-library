name: care
description: 'care.com CLI: search caregivers, review applicants/messages, analyze
  and reach out - over your own authenticated session'
version: 0.1.0
base_url: https://www.care.com
spec_source: sniffed
auth:
  type: cookie
  in: cookie
  login_url: https://www.care.com/login
  env_vars: []
config:
  format: toml
  path: ~/.config/care-pp-cli/config.toml
resources:
  availabilities:
    description: GraphQL BFF operations for availabilities
    endpoints:
      events:
        method: POST
        path: /api/graphql
        description: Fetch availabilities events
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: AvailabilityEvents
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: "query AvailabilityEvents($providerId: String!) {\n  AvailabilityEvents(providerId:\
            \ $providerId) {\n    freeBusyType\n    providerId\n    recurrenceRules\
            \ {\n      count\n      endTime\n      exDatesTime\n      frequency\n\
            \      id\n      interval\n      startTime\n      untilTime\n      __typename\n\
            \    }\n    timezone\n    name\n    id\n    __typename\n  }\n}"
          description: GraphQL query document
          fields: []
        - name: variables
          type: object
          required: false
          positional: false
          default:
            providerId: 22222222-2222-2222-2222-222222222222
          description: GraphQL variables as JSON
          fields: []
        response:
          type: object
          item: availability_events
        pagination: null
        observed_auth:
        - cookie
  bookings:
    description: GraphQL BFF operations for bookings
    endpoints:
      request_list_jobs_basic:
        method: POST
        path: /api/graphql
        description: Fetch bookings request list jobs basic
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: bookingRequestListJobsPageBasic
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: "query bookingRequestListJobsPageBasic($input: BookingRequestListInput!)\
            \ {\n  bookingRequestList(input: $input) {\n    ... on BookingRequestListSuccess\
            \ {\n      bookingRequests {\n        id\n        status\n        __typename\n\
            \      }\n      __typename\n    }\n    __typename\n  }\n}"
          description: GraphQL query document
          fields: []
        - name: variables
          type: object
          required: false
          positional: false
          default:
            input:
              bookingRequestListFilters:
              - caregiverTiers:
                - PREFERRED
                childCareBookingRequestStatus: IN_PROGRESS
              - caregiverTiers:
                - PREFERRED
                childCareBookingRequestStatus: DEFERRED
              - childCareBookingRequestStatus: SEEKER_NOTIFIED
                jobTypes:
                - JOB_TYPE_IB_RECURRING_CARE
                - JOB_TYPE_OTC
              pageSize: 1
              seekerId: 11111111-1111-1111-1111-111111111111
          description: GraphQL variables as JSON
          fields: []
        response:
          type: object
          item: booking_request_list_jobs_page_basic
        pagination: null
        observed_auth:
        - cookie
      request_list_jobs_extended:
        method: POST
        path: /api/graphql
        description: Fetch bookings request list jobs extended
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: bookingRequestListJobsPageExtended
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: "query bookingRequestListJobsPageExtended($input: BookingRequestListInput!)\
            \ {\n  bookingRequestList(input: $input) {\n    ... on BookingRequestListSuccess\
            \ {\n      bookingRequests {\n        id\n        status\n        __typename\n\
            \      }\n      __typename\n    }\n    __typename\n  }\n}"
          description: GraphQL query document
          fields: []
        - name: variables
          type: object
          required: false
          positional: false
          default:
            input:
              bookingRequestListFilters:
              - bookingInvitationStatuses:
                - ACCEPTED
                caregiverTiers:
                - ALTERNATIVE
                childCareBookingRequestStatus: SEEKER_NOTIFIED
              - bookingInvitationStatuses:
                - INVITE_SENT
                caregiverTiers:
                - PREFERRED
                childCareBookingRequestStatus: SEEKER_NOTIFIED
              - bookingInvitationStatuses:
                - DECLINED
                caregiverTiers:
                - PREFERRED
                childCareBookingRequestStatus: SEEKER_NOTIFIED
              - childCareBookingRequestStatus: SEEKER_NOTIFIED
                jobTypes:
                - JOB_TYPE_IB_RECURRING_CARE
                - JOB_TYPE_OTC
              pageSize: 1
              seekerId: 11111111-1111-1111-1111-111111111111
          description: GraphQL variables as JSON
          fields: []
        response:
          type: object
          item: booking_request_list_jobs_page_extended
        pagination: null
        observed_auth:
        - cookie
  calendars:
    description: GraphQL BFF operations for calendars
    endpoints:
      get:
        method: POST
        path: /api/graphql
        description: Fetch calendars
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: GetCalendar
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: "query GetCalendar($providerId: String!) {\n  AvailabilityCalendar(providerId:\
            \ $providerId) {\n    availability {\n      endTime\n      eventId\n \
            \     freeBusyType\n      recurrenceRuleId\n      startTime\n      __typename\n\
            \    }\n    lastUpdated\n    __typename\n  }\n}"
          description: GraphQL query document
          fields: []
        - name: variables
          type: object
          required: false
          positional: false
          default:
            providerId: 22222222-2222-2222-2222-222222222222
          description: GraphQL variables as JSON
          fields: []
        response:
          type: object
          item: get_calendar
        pagination: null
        observed_auth:
        - cookie
  caregivers:
    description: GraphQL BFF operations for caregivers
    endpoints:
      booking_list_provider:
        method: POST
        path: /api/graphql
        description: Fetch caregivers booking list provider
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: getCaregiverBookingListProvider
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: "fragment CaregiverBasicInfo on Caregiver {\n  avgReviewRating\n\
            \  yearsOfExperience\n  hasCareCheck\n  numberOfReviews\n  isVaccinated\n\
            \  hiredTimes\n  responseTime\n  __typename\n}\n\nfragment MemberBasicInfo\
            \ on Member {\n  id\n  legacyId\n  displayName\n  imageURL\n  isPremium\n\
            \  firstName\n  lastName\n  __typename\n}\n\nfragment RevieweeMetricsFragment\
            \ on Caregiver {\n  revieweeMetrics {\n    ... on RevieweeMetricsPayload\
            \ {\n      metrics {\n        averageRatings {\n          type\n     \
            \     value\n          __typename\n        }\n        totalReviews\n \
            \       __typename\n      }\n      __typename\n    }\n    ... on ReviewFailureResponse\
            \ {\n      message\n      __typename\n    }\n    __typename\n  }\n  __typename\n\
            }\n\nfragment CaregiverFragment on Caregiver {\n  ...CaregiverBasicInfo\n\
            \  ...RevieweeMetricsFragment\n  hasGrantedCriminalBGCAccess\n  hasGrantedMvrBGCAccess\n\
            \  hasGrantedPremierBGCAccess\n  isFavorite\n  isMVREligible\n  isVaccinated\n\
            \  responseRate\n  responseTime\n  signUpDate\n  nonPrimaryImages\n  badges\n\
            \  distanceFromSeekerInMiles\n  verifications\n  isPaymentReady\n  continuousBackgroundCheck\
            \ {\n    hasActiveHit\n    provider {\n      activeSubscriptionsCount\n\
            \      pendingRequestsCount\n      __typename\n    }\n    seeker {\n \
            \     hasLimitReached\n      subscriptionStatus\n      __typename\n  \
            \  }\n    __typename\n  }\n  isServiceReviewable\n  isMarkedAsHired\n\
            \  hiredByCounts {\n    locality {\n      hiredCount\n      __typename\n\
            \    }\n    __typename\n  }\n  member {\n    ...MemberBasicInfo\n    languages\n\
            \    gender\n    hiResImageURL\n    email\n    primaryService\n    address\
            \ {\n      city\n      state\n      zip\n      __typename\n    }\n   \
            \ __typename\n  }\n  placeInfo {\n    name\n    __typename\n  }\n  attributes\
            \ {\n    comfortableWithPets\n    ownTransportation\n    smokes\n    __typename\n\
            \  }\n  educationDegrees {\n    currentlyAttending\n    degreeYear\n \
            \   educationLevel\n    schoolName\n    educationDetailsText\n    __typename\n\
            \  }\n  backgroundChecks {\n    whenCompleted\n    backgroundCheckName\n\
            \    backgroundCheckStatus\n    __typename\n  }\n  profiles {\n    serviceIds\n\
            \    childCareCaregiverProfile {\n      approvalStatus\n      distanceWillingToTravel\
            \ {\n        unit\n        value\n        __typename\n      }\n      ageGroups\n\
            \      availabilityFrequency\n      bio {\n        experienceSummary\n\
            \        title\n        aiAssistedBio\n        __typename\n      }\n \
            \     childStaffRatio\n      id\n      maxAgeMonths\n      minAgeMonths\n\
            \      numberOfChildren\n      offerings {\n        ageRange {\n     \
            \     max {\n            unit\n            value\n            __typename\n\
            \          }\n          min {\n            unit\n            value\n \
            \           __typename\n          }\n          __typename\n        }\n\
            \        __typename\n      }\n      otherQualities\n      payRange {\n\
            \        hourlyRateFrom {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        hourlyRateTo {\n          amount\n\
            \          currencyCode\n          __typename\n        }\n        __typename\n\
            \      }\n      qualities {\n        afterSchoolCare\n        babysitter\n\
            \        certifiedNursingAssistant\n        certifiedRegisterNurse\n \
            \       certifiedTeacher\n        childDevelopmentAssociate\n        comfortableWithPets\n\
            \        cprTrained\n        crn\n        doesNotSmoke\n        doula\n\
            \        earlyChildDevelopmentCoursework\n        earlyChildhoodEducation\n\
            \        firstAidTraining\n        mothersHelper\n        nafccCertified\n\
            \        nanny\n        newbornCareSpecialist\n        nightNanny\n  \
            \      ownTransportation\n        specialNeedsCare\n        trustlineCertifiedCalifornia\n\
            \        __typename\n      }\n      recurringRate {\n        hourlyRateFrom\
            \ {\n          amount\n          currencyCode\n          __typename\n\
            \        }\n        hourlyRateTo {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        __typename\n      }\n      rates\
            \ {\n        hourlyRate {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        numberOfChildren\n        isDefaulted\n\
            \        __typename\n      }\n      supportedServices {\n        carpooling\n\
            \        craftAssistance\n        errands\n        groceryShopping\n \
            \       laundryAssistance\n        lightHousekeeping\n        mealPreparation\n\
            \        swimmingSupervision\n        travel\n        __typename\n   \
            \   }\n      yearsOfExperience\n      __typename\n    }\n    commonCaregiverProfile\
            \ {\n      id\n      repeatClientsCount\n      availabilityFrequency\n\
            \      distanceWillingToTravel {\n        unit\n        value\n      \
            \  __typename\n      }\n      bio {\n        experienceSummary\n     \
            \   title\n        aiAssistedBio\n        __typename\n      }\n      payRange\
            \ {\n        hourlyRateFrom {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        hourlyRateTo {\n          amount\n\
            \          currencyCode\n          __typename\n        }\n        __typename\n\
            \      }\n      merchandizedJobInterests {\n        companionCare\n  \
            \      dateNight\n        lightCleaning\n        mealPrepLaundry\n   \
            \     mover\n        personalAssistant\n        petHelp\n        shopping\n\
            \        transportation\n        __typename\n      }\n      __typename\n\
            \    }\n    petCareCaregiverProfile {\n      availabilityFrequency\n \
            \     approvalStatus\n      distanceWillingToTravel {\n        unit\n\
            \        value\n        __typename\n      }\n      rates {\n        activity\n\
            \        activityRate {\n          amount\n          currencyCode\n  \
            \        __typename\n        }\n        activityRateUnit\n        __typename\n\
            \      }\n      bio {\n        experienceSummary\n        title\n    \
            \    aiAssistedBio\n        __typename\n      }\n      id\n      numberOfPetsComfortableWith\n\
            \      otherQualities\n      payRange {\n        hourlyRateFrom {\n  \
            \        amount\n          currencyCode\n          __typename\n      \
            \  }\n        hourlyRateTo {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        __typename\n      }\n      petSpecies\
            \ {\n        caresForAmphibians\n        caresForBirds\n        caresForCats\n\
            \        caresForDogs\n        caresForExoticPets\n        caresForFarmAnimals\n\
            \        caresForFish\n        caresForHorses\n        caresForMammals\n\
            \        caresForOtherPets\n        __typename\n      }\n      qualities\
            \ {\n        isBondedAndInsured\n        isNappsCertified\n        isPSAMemberAndIsInsured\n\
            \        isRedCrossPetFirstAidCertified\n        doesNotSmoke\n      \
            \  ownsTransportation\n        isCertifiedAndInsured\n        isExperiencedWithChallengingPets\n\
            \        isExperiencedWithSeniorPets\n        isExperiencedWithSpecialNeedsPets\n\
            \        isExperiencedWithYoungPets\n        __typename\n      }\n   \
            \   recurringRate {\n        hourlyRateFrom {\n          currencyCode\n\
            \          amount\n          __typename\n        }\n        hourlyRateTo\
            \ {\n          currencyCode\n          amount\n          __typename\n\
            \        }\n        __typename\n      }\n      serviceRates {\n      \
            \  rate {\n          amount\n          currencyCode\n          __typename\n\
            \        }\n        duration\n        subtype\n        __typename\n  \
            \    }\n      supportedServices {\n        administersMedicine\n     \
            \   boardsOvernight\n        doesDailyFeeding\n        doesHouseSitting\n\
            \        doesPetDaycare\n        doesPetSitting\n        doesPetWalking\n\
            \        groomsAnimals\n        retrievesMail\n        trainsDogs\n  \
            \      transportsPets\n        watersPlants\n        __typename\n    \
            \  }\n      yearsOfExperience\n      __typename\n    }\n    seniorCareCaregiverProfile\
            \ {\n      approvalStatus\n      availabilityFrequency\n      distanceWillingToTravel\
            \ {\n        unit\n        value\n        __typename\n      }\n      bio\
            \ {\n        experienceSummary\n        title\n        aiAssistedBio\n\
            \        __typename\n      }\n      id\n      otherQualities\n      payRange\
            \ {\n        hourlyRateFrom {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        hourlyRateTo {\n          amount\n\
            \          currencyCode\n          __typename\n        }\n        __typename\n\
            \      }\n      qualities {\n        alzheimersOrDementiaExperience\n\
            \        certifiedNursingAssistant\n        comfortableWithPets\n    \
            \    cprTrained\n        doesNotSmoke\n        firstAidTraining\n    \
            \    homeHealthAideExperience\n        hospiceExperience\n        licensedNurse\n\
            \        medicalEquipmentExperience\n        ownTransportation\n     \
            \   registeredNurse\n        woundCare\n        __typename\n      }\n\
            \      recurringRate {\n        hourlyRateFrom {\n          currencyCode\n\
            \          amount\n          __typename\n        }\n        hourlyRateTo\
            \ {\n          currencyCode\n          amount\n          __typename\n\
            \        }\n        __typename\n      }\n      supportedServices {\n \
            \       visitingPhysician\n        visitingNurse\n        transportation\n\
            \        specializedCare\n        specialNeeds\n        respiteCare\n\
            \        personalCare\n        mobilityAssistance\n        medicalTransportation\n\
            \        medicalManagement\n        mealPreparation\n        lightHousekeeping\n\
            \        liveInHomeCare\n        hospiceServices\n        homeModification\n\
            \        homeHealth\n        helpStayingPhysicallyActive\n        heavyLifting\n\
            \        feeding\n        errands\n        dementia\n        companionship\n\
            \        bathing\n        __typename\n      }\n      yearsOfExperience\n\
            \      __typename\n    }\n    tutoringCaregiverProfile {\n      approvalStatus\n\
            \      availabilityFrequency\n      bio {\n        experienceSummary\n\
            \        title\n        aiAssistedBio\n        __typename\n      }\n \
            \     recurringRate {\n        hourlyRateFrom {\n          amount\n  \
            \        currencyCode\n          __typename\n        }\n        hourlyRateTo\
            \ {\n          amount\n          currencyCode\n          __typename\n\
            \        }\n        __typename\n      }\n      id\n      otherGeneralSubjects\n\
            \      otherQualities\n      payRange {\n        hourlyRateFrom {\n  \
            \        amount\n          currencyCode\n          __typename\n      \
            \  }\n        hourlyRateTo {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        __typename\n      }\n      qualities\
            \ {\n        additionalDetails {\n          doesNotSmoke\n          isComfortableWithPets\n\
            \          ownsTransportation\n          __typename\n        }\n     \
            \   professionalSkills {\n          americanTutoringAssociationCertified\n\
            \          certifiedTeacher\n          __typename\n        }\n       \
            \ __typename\n      }\n      supportedServices {\n        tutorsInCenter\n\
            \        tutorsInCoffeeShop\n        tutorsInCommunityCenter\n       \
            \ tutorsInLibrary\n        tutorsInSchool\n        tutorsInStudentsHome\n\
            \        tutorsInTeachersHome\n        tutorsOnline\n        __typename\n\
            \      }\n      distanceWillingToTravel {\n        unit\n        value\n\
            \        __typename\n      }\n      specificSubjects\n      otherSpecificSubject\n\
            \      yearsOfExperience\n      __typename\n    }\n    houseKeepingCaregiverProfile\
            \ {\n      approvalStatus\n      availabilityFrequency\n      bio {\n\
            \        experienceSummary\n        title\n        aiAssistedBio\n   \
            \     __typename\n      }\n      distanceWillingToTravel {\n        unit\n\
            \        value\n        __typename\n      }\n      id\n      otherQualities\n\
            \      payRange {\n        hourlyRateFrom {\n          amount\n      \
            \    currencyCode\n          __typename\n        }\n        hourlyRateTo\
            \ {\n          amount\n          currencyCode\n          __typename\n\
            \        }\n        __typename\n      }\n      qualities {\n        comfortableWithPets\n\
            \        doesNotSmoke\n        ownTransportation\n        providesEquipment\n\
            \        providesSupplies\n        __typename\n      }\n      recurringRate\
            \ {\n        hourlyRateFrom {\n          amount\n          currencyCode\n\
            \          __typename\n        }\n        hourlyRateTo {\n          amount\n\
            \          currencyCode\n          __typename\n        }\n        __typename\n\
            \      }\n      schedule {\n        endTime\n        id\n        ruleName\n\
            \        rules\n        startTime\n        __typename\n      }\n     \
            \ supportedServices {\n        atticCleaning\n        basementCleaning\n\
            \        bathroomCleaning\n        cabinetCleaning\n        carpetCleaning\n\
            \        changingBedLinens\n        deepCleaning\n        dishes\n   \
            \     dusting\n        furnitureTreatment\n        generalRoomCleaning\n\
            \        greenCleaning\n        houseSitting\n        kitchenCleaning\n\
            \        laundry\n        moveOutCleaning\n        organization\n    \
            \    ovenCleaning\n        packingUnpacking\n        petWasteCleanup\n\
            \        plantCare\n        refrigeratorCleaning\n        standardCleaning\n\
            \        surfacePolishing\n        springSummerCleaning\n        vacuumingOrMopping\n\
            \        wallWashing\n        windowWashing\n        __typename\n    \
            \  }\n      yearsOfExperience\n      __typename\n    }\n    __typename\n\
            \  }\n  recurringAvailability {\n    dayList {\n      monday {\n     \
            \   blocks {\n          end\n          start\n          __typename\n \
            \       }\n        __typename\n      }\n      tuesday {\n        blocks\
            \ {\n          end\n          start\n          __typename\n        }\n\
            \        __typename\n      }\n      wednesday {\n        blocks {\n  \
            \        end\n          start\n          __typename\n        }\n     \
            \   __typename\n      }\n      thursday {\n        blocks {\n        \
            \  end\n          start\n          __typename\n        }\n        __typename\n\
            \      }\n      friday {\n        blocks {\n          end\n          start\n\
            \          __typename\n        }\n        __typename\n      }\n      saturday\
            \ {\n        blocks {\n          end\n          start\n          __typename\n\
            \        }\n        __typename\n      }\n      sunday {\n        blocks\
            \ {\n          end\n          start\n          __typename\n        }\n\
            \        __typename\n      }\n      __typename\n    }\n    __typename\n\
            \  }\n  __typename\n}\n\nfragment RecurrenceRule on RecurrenceRule {\n\
            \  endTime\n  startTime\n  rules\n  ruleName\n  id\n  __typename\n}\n\n\
            query getCaregiverBookingListProvider($bookingListInput: CaregiverBookingListInput!)\
            \ {\n  getCaregiverBookingList(bookingListInput: $bookingListInput) {\n\
            \    bookings {\n      id\n      status\n      instantBookingType\n  \
            \    extraInformation {\n        childCareInformation {\n          numberOfChildren\n\
            \          __typename\n        }\n        __typename\n      }\n      userInformation\
            \ {\n        seeker {\n          member {\n            id\n          \
            \  imageURL\n            displayName\n            firstName\n        \
            \    lastName\n            __typename\n          }\n          __typename\n\
            \        }\n        __typename\n      }\n      slot {\n        recurrenceRules\
            \ {\n          endTime\n          rules\n          startTime\n       \
            \   __typename\n        }\n        service {\n          serviceType\n\
            \          careSubtype {\n            ... on ChildcareSubtypeWrapper {\n\
            \              childcareSubtype\n              __typename\n          \
            \  }\n            ... on PetCareSubtypeWrapper {\n              petCareSubtype\n\
            \              __typename\n            }\n            __typename\n   \
            \       }\n          __typename\n        }\n        address {\n      \
            \    latitude\n          longitude\n          addressLine1\n         \
            \ city\n          state\n          zip\n          __typename\n       \
            \ }\n        service {\n          serviceType\n          __typename\n\
            \        }\n        timeBlock {\n          start\n          end\n    \
            \      recurrenceRule {\n            ...RecurrenceRule\n            __typename\n\
            \          }\n          __typename\n        }\n        provider {\n  \
            \        publicId\n          __typename\n        }\n        caregiver\
            \ {\n          ...CaregiverFragment\n          __typename\n        }\n\
            \        __typename\n      }\n      paymentInformation {\n        totalCost\
            \ {\n          amount\n          __typename\n        }\n        lineItems\
            \ {\n          metadata {\n            ... on ProviderFeeMetadata {\n\
            \              numberOfHours\n              numberOfNights\n         \
            \     hourlyRate {\n                amount\n                __typename\n\
            \              }\n              nightlyRate {\n                amount\n\
            \                __typename\n              }\n              __typename\n\
            \            }\n            __typename\n          }\n          __typename\n\
            \        }\n        __typename\n      }\n      cancellationInformation\
            \ {\n        reasonCode\n        __typename\n      }\n      __typename\n\
            \    }\n    __typename\n  }\n}"
          description: GraphQL query document
          fields: []
        - name: variables
          type: object
          required: false
          positional: false
          default:
            bookingListInput:
              caregiverId: ''
              caregiverListBookingStatus: PAST
              instantBookingTypes:
              - RECURRING
              - ONE_TIME
              pageSize: 20
              pageToken: ''
              seekerId: 11111111-1111-1111-1111-111111111111
          description: GraphQL variables as JSON
          fields: []
        response:
          type: object
          item: get_caregiver_booking_list_provider
        pagination: null
        observed_auth:
        - cookie
      get:
        method: POST
        path: /api/graphql
        description: Fetch caregivers
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: GetCaregiver
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: "query GetCaregiver($getCaregiverId: ID!, $serviceId: ServiceType,\
