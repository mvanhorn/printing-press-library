version: 2
project_name: moneycontrol-pp-cli
changelog:
  disable: true
builds:
  - id: moneycontrol-pp-cli
    main: ./cmd/moneycontrol-pp-cli
    binary: moneycontrol-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X moneycontrol-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: moneycontrol-pp-mcp
    main: ./cmd/moneycontrol-pp-mcp
    binary: moneycontrol-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: moneycontrol-pp-cli
    repository:
      owner: dev-abhirup-sc
      name: homebrew-tap
    homepage: "https://github.com/dev-abhirup-sc/moneycontrol-pp-cli"
    description: "Indian market news and quotes without the scraping — offline-searchable and agent-native."
    install: |
      bin.install "moneycontrol-pp-cli"
      bin.install "moneycontrol-pp-mcp"
