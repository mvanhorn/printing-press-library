version: 2
project_name: passive-indices-pp-cli
changelog:
  disable: true
builds:
  - id: passive-indices-pp-cli
    main: ./cmd/passive-indices-pp-cli
    binary: passive-indices-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/passive-indices/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: passive-indices-pp-mcp
    main: ./cmd/passive-indices-pp-mcp
    binary: passive-indices-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: passive-indices-pp-cli
    repository:
      owner: lavs9
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Unifies NSE's index data with the ETFs and index funds that track them — a join neither source site offers."
    install: |
      bin.install "passive-indices-pp-cli"
      bin.install "passive-indices-pp-mcp"
