  /v3/bulk-reports:
    post:
      tags:
      - Bulk Download API > create a bulk report
      summary: Create bulk report fixed infrastructure in ARG EEZ + structure ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: fixed-infrastructure-example-4-structureID
                dataset: public-fixed-infrastructure-data:latest
                format: CSV
                region:
                  dataset: public-eez-areas
                  id: 8466
                filters:
                - structure_id = 313068
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '201':
          description: Created
          headers:
            Date:
              schema:
                type: string
                example: Mon, 18 Nov 2024 17:04:11 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Content-Length:
              schema:
                type: integer
                example: '383'
            Connection:
              schema:
                type: string
                example: keep-alive
            access-control-allow-credentials:
              schema:
                type: boolean
                example: 'true'
            access-control-allow-headers:
              schema:
                type: string
                example: Accept,Content-Type,cookie,refresh-token,Accept-Encoding,Authorization,origin,referer,user-agent,Access-Control-Allow-Origin,indexes-0,indexes-1,indexes-2,indexes-3,indexes-4,indexes-5,indexes-6,indexes-7,x-workspace-password
            access-control-allow-methods:
              schema:
                type: string
                example: GET,POST,PUT,PATCH,DELETE,OPTIONS
            access-control-allow-origin:
              schema:
                type: string
                example: '*'
            access-control-expose-headers:
              schema:
                type: string
                example: indexes-0,indexes-1,indexes-2,indexes-3,indexes-4,indexes-5,indexes-6,indexes-7,x-deprecated-dataset
            Cache-Control:
              schema:
                type: string
                example: no-cache
            content-security-policy:
              schema:
                type: string
                example: 'default-src ''self'';base-uri ''self'';font-src ''self'' https: data:;form-action ''self'';frame-ancestors
                  ''self'';img-src ''self'' data:;object-src ''none'';script-src ''self'';script-src-attr ''none'';style-src
                  ''self'' https: ''unsafe-inline'';upgrade-insecure-requests'
            cross-origin-opener-policy:
              schema:
                type: string
                example: same-origin
            cross-origin-resource-policy:
              schema:
                type: string
                example: same-origin
            etag:
              schema:
                type: string
                example: W/"17f-dwzI6ANTDB0JxV+4HWwTzElujFI"
            origin:
              schema:
                type: string
                example: GFW API Gateway
            origin-agent-cluster:
              schema:
                type: string
                example: ?1
            referrer-policy:
              schema:
                type: string
                example: no-referrer
            strict-transport-security:
              schema:
                type: string
                example: max-age=15552000; includeSubDomains
            transaction-id:
              schema:
                type: string
                example: 35622c47-89a8-4c0a-bd8f-874be9fc573c
            vary:
              schema:
                type: string
                example: Accept-Encoding
            x-cloud-trace-context:
              schema:
                type: string
                example: a42a2311677136d15ea685b32afe9097;o=1
            x-content-type-options:
              schema:
                type: string
                example: nosniff
            x-dns-prefetch-control:
              schema:
                type: string
                example: 'off'
            x-download-options:
              schema:
                type: string
                example: noopen
            x-frame-options:
              schema:
                type: string
                example: SAMEORIGIN
            x-permitted-cross-domain-policies:
              schema:
                type: string
                example: none
            x-xss-protection:
              schema:
                type: integer
                example: '0'
            cf-cache-status:
              schema:
                type: string
                example: DYNAMIC
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 8e4989bc0955e9a2-SCL
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1185fe3e-38c0-42b8-a0d4-d6d03fcb42b5
                name: gise-test2-sar-high-confidence
                filepath: sar_fixed_infrastructure_202407.csv
                filters:
                - label_confidence = 'high'
                status: pending
                geom:
                  type: dataset
                  dataset: public-eez-areas
                  id: 8466
                createdAt: '2024-11-18T17:04:11.339Z'
                updatedAt: '2024-11-18T17:04:11.339Z'
                ownerId: 82
                ownerType: user
                format: CSV
    get:
      tags:
      - Bulk Download API
      summary: Get all reports by user
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: limit
        in: query
        schema:
          type: integer
        description: (Required) Amount of search results to return.
        example: '10'
      - name: offset
        in: query
        schema:
          type: integer
        description: "(Required) Offset into the search results, used for pagination. It starts at 0. It is\n    used in combination\
          \ with the param “limit”. For example, you send  limit = 5 and you get\n    in the response total vessels =10. So,\
          \ If you send offset =0, you will get the first 5 results\n    (first page). Therefore, in order to get the second\
          \ page, you\n    need to send offset = 5 which is the  position of the first element you want from the second page."
        example: '5'
      - name: sort
        in: query
        schema:
          type: string
        description: Query to sort the list of resources
        example: -createdAt
      responses:
        '201':
          description: Successful response
          content:
            application/json: {}
  /v3/bulk-reports/{bulk_report_id}:
    get:
      tags:
      - Bulk Download API > Get bulk report by {id}
      summary: Get bulk report by id
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: bulk_report_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json: {}
  /v3/bulk-reports/{bulk_report_id}/download-file-url:
    get:
      tags:
      - Bulk Download API > Download bulk report file by {id}
      summary: Get url of the data file to download it - GEOM
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: file
        in: query
        schema:
          type: string
        description: (Required) File to download
        example: GEOM
      - name: bulk_report_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json: {}
  /v3/bulk-reports/{bulk_report_id}/query:
    get:
      tags:
      - Bulk Download API > Query data in JSON format
      summary: Get data as json sort by structure end date ASC and only 3 fields
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: limit
        in: query
        schema:
          type: integer
        description: (Required) Amount of search results to return.
        example: '50'
      - name: offset
        in: query
        schema:
          type: integer
        description: "(Required) Offset into the search results, used for pagination. It starts at 0. It is\n    used in combination\
          \ with the param “limit”. For example, you send  limit = 5 and you get\n    in the response total vessels =10. So,\
          \ If you send offset =0, you will get the first 5 results\n    (first page). Therefore, in order to get the second\
          \ page, you\n    need to send offset = 5 which is the  position of the first element you want from the second page."
        example: '0'
      - name: sort
        in: query
        schema:
          type: string
        description: Query to sort the list of resources
        example: structure_end_date
      - name: includes[0]
        in: query
        schema:
          type: string
        description: Optional. Fields to include
        example: structure_id
      - name: includes[1]
        in: query
        schema:
          type: string
        example: structure_start_date
      - name: includes[2]
        in: query
        schema:
          type: string
        example: structure_end_date
      - name: bulk_report_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: Created
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                total: <number>
                limit: <number>
                offset: <number>
                nextOffset: <number>
                metadata: {}
                entries: []
        '401':
          description: Unauthorized
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                statusCode: <number>
                error: <string>
                messages:
                - title: <string>
                  detail: <string>
                  metadata: {}
                - title: <string>
                  detail: <string>
                  metadata: {}
        '403':
          description: Forbidden
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                statusCode: <number>
                error: <string>
                messages:
                - title: <string>
                  detail: <string>
                  metadata: {}
                - title: <string>
                  detail: <string>
                  metadata: {}
        '422':
          description: Unprocessable Entity (WebDAV) (RFC 4918)
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
