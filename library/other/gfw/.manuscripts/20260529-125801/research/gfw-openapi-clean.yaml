openapi: 3.0.0
info:
  title: GFW API - Public endpoints v3
  description: "- Public GFW endpoints that includes V3\n    \n- To get a token go to [GFW Token page](https://globalfishingwatch.org/our-apis/tokens/signup)\n\
    \    \n- Read all [API documentation here](https://globalfishingwatch.org/our-apis/documentation#introduction)\n    \n\
    \nIMPORTANT! Remember to setup environment variables like {{bearer_token}}"
  version: 1.0.0
servers:
- url: https://gateway.api.globalfishingwatch.org
  description: GFW API gateway
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      x-auth-env-vars:
      - GFW_TOKEN
      bearerFormat: JWT
security:
- bearerAuth: []
tags:
- name: Quick Start
- name: 4wings API
- name: 4wings API > Error Handling
- name: 4wings API > AIS Apparent Fishing Effort
- name: 4wings API > AIS Apparent Fishing Effort > PNG format
