        example: distance_from_port_km>=3
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v3/vessels:
    get:
      tags:
      - Vessel API
      summary: List vessels by ids Purse Seine Support
      description: 'Lists vessels given a list of vessels id.

        '
      parameters:
      - name: datasets[0]
        in: query
        schema:
          type: string
        example: public-global-vessel-identity:latest
      - name: ids[0]
