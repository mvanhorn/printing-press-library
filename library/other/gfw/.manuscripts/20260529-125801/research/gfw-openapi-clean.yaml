paths:
  /v3/vessels/search:
    get:
      tags:
      - Vessel API
      summary: Advanced Search vessels - Gear Type = 'CARRIER'
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer [YOUR_API_TOKEN]
      - name: datasets[0]
        in: query
        schema:
          type: string
        example: public-global-vessel-identity:latest
      - name: where
        in: query
        schema:
          type: string
        description: Search in registry data and in GFW Gear Type values
        example: geartypes='CARRIER'
      - name: includes[0]
        in: query
        schema:
          type: string
        example: AUTHORIZATIONS
      - name: includes[1]
        in: query
        schema:
          type: string
        example: OWNERSHIP
      - name: includes[2]
        in: query
        schema:
          type: string
        example: MATCH_CRITERIA
      - name: limit
        in: query
        schema:
          type: integer
        example: '24'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v3/events:
    get:
      tags:
      - Events API
      summary: Get Events - several vessel ids
      parameters:
      - name: vessels[0]
        in: query
        schema:
          type: string
        description: 'Example = 8c7304226-6c71-edbe-0b63-c246734b3c01  OR 6583c51e3-3626-5638-866a-f47c3bc7ef7c OR

          914f83946-6af4-04c6-4974-44a203a87952'
        example: 914f83946-6af4-04c6-4974-44a203a87952,8c7304226-6c71-edbe-0b63-c246734b3c01
      - name: limit
        in: query
        schema:
          type: integer
        example: '1'
      - name: offset
        in: query
        schema:
          type: integer
        example: '0'
      - name: datasets[0]
        in: query
        schema:
          type: string
        example: public-global-port-visits-events:latest
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Events API
      summary: Get GAP events POST - Filter by flag custom polygon GAP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                datasets:
