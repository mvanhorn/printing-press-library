- name: 4wings API > AIS Vessel Presence > Get Data Bins
- name: Vessel API
  description: "For AIS vessel identity dataset, the fields allow are:\n\n- \"registryLastUpdateDate\",\n    \n- \"shipname\"\
    ,\n    \n- \"nShipname\",\n    \n- \"ssvid\",\n    \n- \"callsign\",\n    \n- \"imo\",\n    \n- \"flag\",\n    \n- \"\
    geartypes\",\n    \n- \"transmissionDateFrom\",\n    \n- \"transmissionDateTo\",\n    \n- \"combinedSourcesInfo.shiptypes.name\"\
    ,\n    \n- \"combinedSourcesInfo.geartypes.name\",\n    \n- \"selfReportedInfo.id\",\n    \n- \"selfReportedInfo.shipname\"\
    ,\n    \n- \"selfReportedInfo.nShipname\",\n    \n- \"selfReportedInfo.ssvid\",\n    \n- \"selfReportedInfo.callsign\"\
    ,\n    \n- \"selfReportedInfo.imo\",\n    \n- \"selfReportedInfo.flag\",\n    \n- \"selfReportedInfo.transmissionDateFrom\"\
    ,\n    \n- \"selfReportedInfo.transmissionDateTo\",\n    \n- \"registryInfo.shipname\",\n    \n- \"registryInfo.nShipname\"\
    ,\n    \n- \"registryInfo.ssvid\",\n    \n- \"registryInfo.callsign\",\n    \n- \"registryInfo.imo\",\n    \n- \"registryInfo.flag\"\
    ,\n    \n- \"registryInfo.geartypes\",\n    \n- \"registryInfo.recordId\",\n    \n- \"registryInfo.transmissionDateFrom\"\
    ,\n    \n- \"registryInfo.transmissionDateTo\",\n    \n- \"registryOwners.name\",\n    \n- \"id\""
- name: Vessel API > Error Handling
- name: Vessel API > Examples of possible responses
- name: Events API
  description: Includes examples to get fishing events, encounter events, port visits and loitering events.
- name: Events API > Error Handling
- name: Events API > Event Stats
- name: Reference data
- name: Insights API
- name: Datasets API
- name: Datasets API > SAR Fixed Infrastructure MVT
