openapi: 3.0.3

info:
  title: Bloomest Laundry Manager API
  version: "1.22.0"
  description: |
    Mapping non-ufficiale dell'API consumata dal gestionale web
    `www.bloomestlaundry.app/bloomest/` (v1.22.0 in produzione 2026-05-14).

    **Fonte**: reverse engineering dei service.js + controller.js AngularJS
    snapshot 2026-05-13 (v1.20.0) + 2026-05-14 (v1.22.0).
    JS byte-identici tra v1.20 e v1.22 (versione bumped lato server, non lato bundle).
    Ogni operationId include `x-source: file:linea` per tracciabilita'.

    Questa spec NON e' fornita da Bloomest. E' costruita per:
    - Documentare il contratto effettivo osservato lato webapp
    - Servire da contract da implementare nel facade adapter
      Django -> Bloomest API
    - Permettere validazione automatica delle integrazioni
  contact:
    name: Andrea Tagliazucchi (Bloomest Filottrano)
  x-source-bundle: _analisi-bloomest-app/bloomest-webapp/

servers:
  - url: https://www.bloomestlaundry.app/bloomest
    description: |
      Produzione. Notare il prefisso `www.` — l'host `bloomestlaundry.app`
      (senza www) risolve a un IP che non risponde sul 443 (timeout).
      Verificato 2026-05-14: GET /version → 200 `{"version":"1.22.0","code":53}`

tags:
  - name: auth
    description: Login / logout / sessione utente
  - name: app
    description: Versione applicazione + policy
  - name: laundries
    description: Lavanderie e dispositivi (macchine)
  - name: automation
    description: Domotica / IoT (interruttori, sensori)
  - name: dispenser
    description: Configurazione dispenser detersivi
  - name: lockers
    description: Cassetti / locker
  - name: cashbox
    description: Aggiornamenti firmware cassa POS
  - name: actions
    description: Coda azioni cassa (ricariche, sconti) per medias
  - name: users
    description: Utenti finali (clienti) + gruppi + card
  - name: accesses
    description: |
      Utenti del gestionale web (login back-office). NON sono i clienti
      finali (vedi tag `users`). Hanno userLevel 1-11.
  - name: loyalties
    description: Promozioni / fidelizzazione
  - name: registrationBonus
    description: Bonus di benvenuto nuova registrazione
  - name: contacts
    description: Rubrica contatti aziendali
  - name: alarms
    description: Allarmi e contatti di escalation
  - name: payments
    description: Configurazione gateway pagamento (Satispay, Argentea)
  - name: messages
    description: Messaggi push a clienti (broadcast)
  - name: notifications
    description: Notifiche calendar event-based
  - name: comments
    description: Community / commenti clienti
  - name: profile
    description: Profilo utente gestionale corrente
  - name: statistics
    description: |
      Statistiche aggregate (allarmi, corrispettivo Agenzia Entrate,
      card-report, movimenti, cicli, summaries, sales by device).
      9 sub-tipi via PUT discriminator `?type=X`.
  - name: training
    description: Materiale formativo / knowledge base
  - name: tickets
    description: Ticket assistenza clienti
  - name: reservations
    description: Prenotazioni macchine
  - name: websocket
    description: Stream real-time

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        Sessione server-side post-login. Login flow:
        1. POST /login con `user`, `passwd` (SHA1 hex), `source=1` in querystring
        2. Backend setta cookie sessione
        3. Tutte le richieste successive autenticate via cookie
        4. DELETE /login invalida sessione (preceduto da TERM_SIGN su websocket)

  parameters:
    IdLCSQuery:
      name: idLCS
      in: query
      required: true
      schema:
        type: string
      description: Serial number LCS (Laundry Control System)
    IdLaundryQuery:
      name: laundry
      in: query
      required: true
      schema:
        type: integer
      description: idLaundry
    TimezoneQuery:
      name: timezone
      in: query
      required: false
      schema:
        type: string

  responses:
    EmptyOK:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Empty'

  schemas:
    User:
      type: object
      description: Cliente finale (card holder). Riferimento ANALISI.md sezione 2.
      properties:
        idUser:
          type: integer
        alias:
          type: string
          description: Nome visualizzato dal cliente
        blacklisted:
          type: boolean
        discountPercentage:
          type: number
          format: float
          description: Sconto piattaforma % (sommato a sconto card)
        priceTable:
          type: integer
          enum: [0, 1, 2]
          description: 0=Card standard, 1=Sconto Card 1, 2=Sconto Card 2
        sendInsertNotification:
          type: boolean
        lastMovement:
          type: string
          format: date-time
        activation:
          type: string
          format: date-time
        user:
          type: object
          properties:
            registrationDay:
              type: string
              format: date
            email:
              type: string
              format: email
            phone:
              type: string
            dateOfBirth:
              type: string
              format: date
            language:
              type: string
              enum: [it, en, es, fr, de, pt, pl]
        media:
          type: array
          items:
            $ref: '#/components/schemas/UserMedia'

    UserMedia:
      type: object
      description: Card/RFID di un utente
      properties:
        idUserMedia:
          type: integer
        serialNumber:
          type: string
        blacklisted:
          type: boolean

    UserGroup:
      type: object
      properties:
        idGroup:
          type: integer
        description:
          type: string
        isDeleted:
          type: boolean
        isSelected:
          type: boolean

    Laundry:
      type: object
      description: Lavanderia (sede). Contiene devices + automation + lockers.
      properties:
        idLaundry:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        idLCS:
          type: string
          description: Serial number LCS (Laundry Control System)
        configuration:
          type: object
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        catUser:
          type: object
        managerUser:
          type: object
        lavapiuLaundryIdentifier:
          type: string

    Device:
      type: object
      description: Lavatrice/asciugatrice. Riferimento ANALISI.md sezione 3.
      properties:
        idDevice:
          type: integer
        serialNumber:
          type: string
        type:
          type: string
          enum: [washing_machine, dryer, ironer, dispenser]
        model:
          type: string
        state:
          type: integer
          description: Stato operativo macchina
        operationDetails:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            duration:
              type: integer
              description: Minuti
        pricesConfiguration:
          type: array
          items:
            $ref: '#/components/schemas/PriceSlot'

    PriceSlot:
      type: object
      description: Slot di prezzo (per asciugatrice = un duration tier)
      properties:
        baseMinutes:
          type: integer
        price:
          type: number
          format: float
        discount1:
          type: number
          format: float
          description: "% sconto Card 1"
        discount2:
          type: number
          format: float
          description: "% sconto Card 2"
        quantity:
          type: integer

    Loyalty:
      type: object
      description: Promo / loyalty. Riferimento ANALISI.md sezione 4.
      properties:
        idLoyalty:
          type: integer
        name:
          type: string
        laundries:
          type: array
          items:
            type: integer
            description: idLaundry
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        type:
          type: integer
          description: Tipo loyalty (1-4 secondo ANALISI § 4)
        threshold:
          type: number
        service:
          type: object
        target:
          type: object
        award:
          type: object
        amount:
          type: number
        daysOfAward:
          type: integer
        erogationAtTheEnd:
          type: boolean
        notifications:
          type: array
          items:
            type: object
        isEnabled:
          type: boolean
        targetUserGroups:
          type: array
          items:
            type: integer

    Action:
      type: object
      description: Movimento queue verso cassa. Riferimento ANALISI.md sezione 5.
      properties:
        idAction:
          type: integer
        saveDate:
          type: string
          format: date-time
        sendDate:
          type: string
          format: date-time
          nullable: true
        lastMovement:
          type: string
          format: date-time
        loyalty:
          type: object
          nullable: true
        finalUser:
          type: object
          nullable: true
        media:
          type: integer
          description: idUserMedia

    Alarm:
      type: object
      description: Allarme configurato. Riferimento ANALISI.md sezione 6.
      properties:
        idLaundry:
          type: integer
        alarms:
          type: array
          items:
            type: object
            properties:
              type:
                type: integer
                enum: [1, 2, 3, 4, 5, 6, 7, 8]
                description: |
                  1=POWER_OUTAGE, 2=DEVICE_OFFLINE, 3=PAYMENT_FAILURE,
                  4=CASHBOX_FULL, 5=DOOR_OPEN, 6=DETERGENT_LOW,
                  7=FILTER_CLOG, 8=GENERIC
              contacts:
                type: array
                items:
                  type: object
                  properties:
                    idContact:
                      type: integer
              notes:
                type: string
              isModified:
                type: boolean

    Contact:
      type: object
      description: Contatto aziendale (rubrica per escalation allarmi).
      properties:
        idContact:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
        isRemoved:
          type: boolean

    Access:
      type: object
      description: Utente del gestionale web (login back-office)
      properties:
        idUser:
          type: integer
        name:
          type: string
        userLevel:
          type: integer
          enum: [1, 2, 3, 6, 7, 9, 10, 11]
          description: |
            1=ADM, 2=CAT, 3=GES, 6=GES_EXE, 7=LCS_MOBILE,
            9=OEM, 10=GES_OPERATOR, 11=PERFORMANCE
        disabled:
          type: boolean
        laundries:
          type: array
          items:
            type: object
            properties:
              idLaundry:
                type: integer
              isSelected:
                type: boolean
              configuration:
                type: object

    Reservation:
      type: object
      description: Prenotazione di una macchina (lavatrice/asciugatrice).
      properties:
        idReservation:
          type: integer
        device:
          type: integer
        startDate:
          type: string
          format: date-time
        updateDate:
          type: string
          format: date-time
        status:
          type: integer
          enum: [1, 2, 3, 4]
          description: 1=NEW, 2=PURCHASED, 3=NOT_PURCHASED, 4=DELETED

    Ticket:
      type: object
      description: Ticket assistenza aperto da un cliente.
      properties:
        idTicket:
          type: integer
        creationDate:
          type: string
          format: date-time
        updateDate:
          type: string
          format: date-time
          nullable: true
        pickupDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string

    Comment:
      type: object
      description: Commento/feedback community lasciato da un cliente.
      properties:
        idComment:
          type: integer
        creationDate:
          type: string
          format: date-time
        rating:
          type: integer
          minimum: 1
          maximum: 5
        feedback:
          type: array
          items:
            type: object
            properties:
              liked:
                type: boolean

    Notification:
      type: object
      description: Notifica calendar-based con title traductions multilingua.
      properties:
        idEvent:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        actions:
          type: array
          items:
            type: object
        titleTraductions:
          type: array
          items:
            type: object

    PaymentsConfig:
      type: object
      description: Configurazione gateway pagamento (Satispay, Argentea).
      properties:
        satispay:
          type: object
          properties:
            token:
              type: string
        argentea:
          type: object
          properties:
            terminalId:
              type: string
            terminalKey:
              type: string

    StatisticsRequest:
      type: object
      description: |
        Body comune ai 9 sub-tipi di `PUT /statistics?type=X`.
        Costruito client-side da `statisticsService.getRequestObject()`.
        I campi modality (`laundry`/`device`/`user`/`groupOfUsers`) sono
        mutuamente esclusivi.
      required: [start, end]
      properties:
        start:
          type: string
          description: '"YYYY-MM-DD HH:mm:ss"'
        end:
          type: string
          description: '"YYYY-MM-DD HH:mm:ss"'
        laundry:
          type: integer
          description: idLaundry (modality LAUNDRY)
        device:
          type: integer
          description: idDevice (modality DEVICE)
        user:
          type: integer
          description: idMedia (modality USER)
        groupOfUsers:
          type: array
          items:
            type: integer
          description: idGroup[] (modality GROUP_OF_USERS)

    RegistrationBonus:
      type: object
      description: Bonus credito alla registrazione di nuovi clienti.
      properties:
        amount:
          type: number
        currency:
          type: string
        isEnabled:
          type: boolean

    Empty:
      type: object
      description: Risposta vuota / success generico

    Error:
      type: object
      properties:
        error:
          type: string

security:
  - cookieAuth: []

paths:

  # ============================================================
  # AUTH / SESSIONE
  # ============================================================

  /login:
    get:
      operationId: loginCheck
      summary: Verifica stato login corrente
      tags: [auth]
      security: []
      x-source: services/loginService.js:56
      responses:
        '200':
          description: Sessione attiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
        '401':
          description: Non autenticato
    post:
      operationId: loginPost
      summary: Autentica utente con credenziali SHA1
      tags: [auth]
      security: []
      x-source: services/loginService.js:76
      parameters:
        - name: user
          in: query
          required: true
          schema:
            type: string
        - name: passwd
          in: query
          required: true
          schema:
            type: string
            description: SHA1 hex della password in chiaro
        - name: source
          in: query
          required: true
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Login OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
        '401':
          description: Credenziali errate
    delete:
      operationId: loginDelete
      summary: Logout (terminazione sessione)
      tags: [auth]
      x-source: services/loginService.js:94
      x-notes: |
        Il client invia TERM_SIGN (messageType=4) via WebSocket
        prima di chiamare questo endpoint.
      responses:
        '200':
          description: Logout OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'

  # ============================================================
  # APP / POLICY
  # ============================================================

  /version:
    get:
      operationId: versionGet
      summary: Versione applicazione
      tags: [app]
      security: []
      x-source: services/versionsService.js:10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  code:
                    type: integer

  /policy:
    get:
      operationId: policyGet
      summary: Versione corrente policy (privacy/terms)
      tags: [app]
      security: []
      x-source: services/policiesService.js:44
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
    put:
      operationId: policyAccept
      summary: Registra accettazione privacy + terms
      tags: [app]
      x-source: services/policiesService.js:111
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
        - name: privacy
          in: query
          required: true
          schema:
            type: boolean
        - name: terms
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  # ============================================================
  # LAUNDRIES / DEVICES
  # ============================================================

  /laundries:
    get:
      operationId: laundriesGet
      summary: Lista lavanderie con devices
      tags: [laundries]
      x-source: services/devicesService.js:70
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Laundry'
    post:
      operationId: laundriesSave
      summary: Crea o aggiorna lavanderia
      tags: [laundries]
      x-source: services/devicesService.js:416
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Laundry'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'
    put:
      operationId: laundryPricesSave
      summary: Salva prezzi/configurazione device intero
      tags: [laundries, dispenser]
      x-source: controllers/pricesController.js:50
      x-notes: |
        Endpoint anomalo: PUT /laundries usato dal pricesController
        per salvare pricesConfiguration di un device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idDevice:
                  type: integer
                idLaundry:
                  type: integer
                pricesConfiguration:
                  type: array
                  items:
                    $ref: '#/components/schemas/PriceSlot'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'
    delete:
      operationId: laundriesDelete
      summary: Elimina device o lavanderia (discriminator type)
      tags: [laundries]
      x-source: services/devicesService.js:459
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [device, laundry]
        - name: device
          in: query
          required: false
          schema:
            type: integer
            description: Required se type=device
        - name: laundry
          in: query
          required: false
          schema:
            type: integer
            description: Required se type=laundry
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /updates:
    get:
      operationId: updatesGet
      summary: Lista device aggiornati per LCS (eventualmente filtrato per device)
      tags: [laundries]
      x-source: services/devicesService.js:110
      parameters:
        - $ref: '#/components/parameters/IdLCSQuery'
        - name: idDevice
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
    put:
      operationId: updatesPut
      summary: Aggiorna firmware o configurazione device
      tags: [laundries]
      x-source: controllers/dashboardController.js:60
      parameters:
        - $ref: '#/components/parameters/IdLCSQuery'
        - name: key
          in: query
          required: true
          schema:
            type: string
            description: Password LCS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operationDetails:
                  type: object
                firmware:
                  type: integer
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /automation:
    get:
      operationId: automationGet
      summary: Configurazione domotica per LCS
      tags: [automation]
      x-source: services/devicesService.js:184
      parameters:
        - $ref: '#/components/parameters/IdLCSQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                description: Map idDomotica -> config
    put:
      operationId: automationUpdate
      summary: Cambia stato automazione (isOn / isManual / reboot)
      tags: [automation]
      x-source: controllers/dashboardController.js:139
      x-notes: |
        Tre varianti distinte sullo stesso path identificate da query:
        - isOn=bool -> accende/spegne
        - isManual=bool -> entra/esce modalita' manuale
        - key=string (senza isOn/isManual) -> reboot LCS
      parameters:
        - $ref: '#/components/parameters/IdLCSQuery'
        - name: idAutomation
          in: query
          required: true
          schema:
            type: string
        - name: isOn
          in: query
          required: false
          schema:
            type: boolean
        - name: isManual
          in: query
          required: false
          schema:
            type: boolean
        - name: key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /reboot:
    post:
      operationId: rebootCashbox
      summary: Reboot remoto cassa POS
      tags: [laundries]
      x-source: controllers/dashboardController.js:233
      parameters:
        - $ref: '#/components/parameters/IdLaundryQuery'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /dispenser:
    get:
      operationId: dispenserGet
      summary: Configurazione dispenser per lavanderia
      tags: [dispenser]
      x-source: services/devicesService.js:663
      parameters:
        - $ref: '#/components/parameters/IdLaundryQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      operationId: dispenserSave
      summary: Salva configurazione dispenser
      tags: [dispenser]
      x-source: controllers/dispenserController.js:16
      parameters:
        - $ref: '#/components/parameters/IdLaundryQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'

  /lockers:
    get:
      operationId: lockersGet
      summary: Lista locker/cassetti per LCS
      tags: [lockers]
      x-source: services/devicesService.js:695
      parameters:
        - $ref: '#/components/parameters/IdLCSQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    size:
                      type: string
                      enum: [S, L]
                    state:
                      type: integer
                      enum: [1, 2, 3]

  # ============================================================
  # CASHBOX UPDATES
  # ============================================================

  /cashboxUpdates:
    get:
      operationId: cashboxUpdatesGet
      summary: Lista firmware cassa + configurazioni pianificate
      tags: [cashbox]
      x-source: services/cashboxUpdatesService.js:14
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      type: object
                  configurations:
                    type: array
                    items:
                      type: object
    post:
      operationId: cashboxUpdateSchedule
      summary: Pianifica aggiornamento firmware cassa
      tags: [cashbox]
      x-source: services/cashboxUpdatesService.js:46
      parameters:
        - $ref: '#/components/parameters/IdLaundryQuery'
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            description: "YYYY-MM-DD HH:mm:ss"
        - name: firmware
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/EmptyOK'
    delete:
      operationId: cashboxUpdateCancel
