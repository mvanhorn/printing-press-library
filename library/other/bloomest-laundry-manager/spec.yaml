x-websocket:
  url: wss://o90feoupj8.execute-api.eu-west-1.amazonaws.com/bloomest
  source: services/websocketService.js:30
  description: |
    Stream real-time bidirezionale. Auto-reconnect su close/error.
    Handshake post-connect: sendMessage con WHO_AM_I.
  handshake:
    action: sendMessage
    data:
      messageType: 2
      idLCS: array<string>
      machineSN: array
      whoAmI: 1
  messageTypes:
    1: UPDATE_REQUEST
    2: WHO_AM_I
    4: TERM_SIGN
    5: UPDATE_HINT_AUTOMATION
    6: UPDATE_HINT_LOCKER
  notes: |
    sendTermSign() invia messageType=4 prima della chiusura.
    UPDATE_HINT_AUTOMATION / UPDATE_HINT_LOCKER triggherano refetch
    su GET /automation e GET /lockers rispettivamente.

