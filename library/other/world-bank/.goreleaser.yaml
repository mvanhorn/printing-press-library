version: 2
project_name: world-bank-pp-cli
changelog:
  disable: true
builds:
  - id: world-bank-pp-cli
    main: ./cmd/world-bank-pp-cli
    binary: world-bank-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/world-bank/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: world-bank-pp-mcp
    main: ./cmd/world-bank-pp-mcp
    binary: world-bank-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: world-bank-pp-cli
    repository:
      owner: luketheojohnson
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every World Bank indicator, queryable offline, with cross-country SQL and rankings no wrapper has."
    install: |
      bin.install "world-bank-pp-cli"
      bin.install "world-bank-pp-mcp"
