# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "ynab-pp-cli"
display_name = "YNAB"
description = "Every YNAB feature, plus a local mirror that makes reconciliation, payee trend analysis, and a ready-made ProjectionLab export instant instead of manual."
project_kind = "cli"

[secrets.file]
path = "~/.config/ynab-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
YNAB_API_TOKEN = true
YNAB_ENDPOINTS_TOKEN = true
