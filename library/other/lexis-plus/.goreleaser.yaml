version: 2
project_name: lexis-plus-pp-cli
changelog:
  disable: true
builds:
  - id: lexis-plus-pp-cli
    main: ./cmd/lexis-plus-pp-cli
    binary: lexis-plus-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/lexis-plus/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: lexis-plus-pp-mcp
    main: ./cmd/lexis-plus-pp-mcp
    binary: lexis-plus-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: lexis-plus-pp-cli
    repository:
      owner: bbenjyesq
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Pull California cases and annotated statutes from your own Lexis+ subscription straight into Word, by citation."
    install: |
      bin.install "lexis-plus-pp-cli"
      bin.install "lexis-plus-pp-mcp"
