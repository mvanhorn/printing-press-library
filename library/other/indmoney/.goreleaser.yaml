version: 2
project_name: indmoney-pp-cli
changelog:
  disable: true
builds:
  - id: indmoney-pp-cli
    main: ./cmd/indmoney-pp-cli
    binary: indmoney-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/indmoney/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: indmoney-pp-mcp
    main: ./cmd/indmoney-pp-mcp
    binary: indmoney-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: indmoney-pp-cli
    repository:
      owner: dev-abhirup-sc
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Scrape your INDmoney US stock portfolio, holdings, and full trade history from the terminal."
    install: |
      bin.install "indmoney-pp-cli"
      bin.install "indmoney-pp-mcp"
