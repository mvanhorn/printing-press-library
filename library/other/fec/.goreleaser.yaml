version: 2
project_name: fec-pp-cli
changelog:
  disable: true
builds:
  - id: fec-pp-cli
    main: ./cmd/fec-pp-cli
    binary: fec-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X fec-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: fec-pp-mcp
    main: ./cmd/fec-pp-mcp
    binary: fec-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: fec-pp-cli
    repository:
      owner: mvanhorn
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/fec-pp-cli"
    description: "This application programming interface (API)"
    install: |
      bin.install "fec-pp-cli"
      bin.install "fec-pp-mcp"
