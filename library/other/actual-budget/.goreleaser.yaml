version: 2
project_name: actual-budget-pp-cli
changelog:
  disable: true
builds:
  - id: actual-budget-pp-cli
    main: ./cmd/actual-budget-pp-cli
    binary: actual-budget-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/actual-budget/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: actual-budget-pp-mcp
    main: ./cmd/actual-budget-pp-mcp
    binary: actual-budget-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: actual-budget-pp-cli
    repository:
      owner: blujaxfan
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Your Actual Budget ledger in one static binary: search, SQL, reports and cleanup audits on a local copy pulled straight from your own Actual server, no Node required."
    install: |
      bin.install "actual-budget-pp-cli"
      bin.install "actual-budget-pp-mcp"
