version: 2
project_name: epropertyplus-pp-cli
changelog:
  disable: true
builds:
  - id: epropertyplus-pp-cli
    main: ./cmd/epropertyplus-pp-cli
    binary: epropertyplus-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/epropertyplus/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: epropertyplus-pp-mcp
    main: ./cmd/epropertyplus-pp-mcp
    binary: epropertyplus-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: epropertyplus-pp-cli
    repository:
      owner: startos00
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every land bank's public inventory, one command — enumerate, filter, export"
    install: |
      bin.install "epropertyplus-pp-cli"
      bin.install "epropertyplus-pp-mcp"
