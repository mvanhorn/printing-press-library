version: 2
project_name: zimmo-pp-cli
changelog:
  disable: true
builds:
  - id: zimmo-pp-cli
    main: ./cmd/zimmo-pp-cli
    binary: zimmo-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/zimmo/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: zimmo-pp-mcp
    main: ./cmd/zimmo-pp-mcp
    binary: zimmo-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: zimmo-pp-cli
    repository:
      owner: sambassio
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Belgian real estate from Zimmo with exact addresses, sold comps, commune prices per m² and a local store for deal sourcing."
    install: |
      bin.install "zimmo-pp-cli"
      bin.install "zimmo-pp-mcp"
