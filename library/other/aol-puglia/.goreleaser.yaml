version: 2
project_name: aol-puglia-pp-cli
changelog:
  disable: true
builds:
  - id: aol-puglia-pp-cli
    main: ./cmd/aol-puglia-pp-cli
    binary: aol-puglia-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/other/aol-puglia/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: aol-puglia-pp-mcp
    main: ./cmd/aol-puglia-pp-mcp
    binary: aol-puglia-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: aol-puglia-pp-cli
    repository:
      owner: aborruso
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "API per l'Albo Pretorio Online della Sanità Pugliese."
    install: |
      bin.install "aol-puglia-pp-cli"
      bin.install "aol-puglia-pp-mcp"
