version: 2
project_name: serply-pp-cli
changelog:
  disable: true
builds:
  - id: serply-pp-cli
    main: ./cmd/serply-pp-cli
    binary: serply-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/serply/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: serply-pp-mcp
    main: ./cmd/serply-pp-mcp
    binary: serply-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: serply-pp-cli
    repository:
      owner: googio
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Live Google, News, Scholar, Maps and Bing results, plus rank checks, SERP diffs and cited research briefs."
    install: |
      bin.install "serply-pp-cli"
      bin.install "serply-pp-mcp"
