version: 2
project_name: flowiseai-pp-cli
changelog:
  disable: true
builds:
  - id: flowiseai-pp-cli
    main: ./cmd/flowiseai-pp-cli
    binary: flowiseai-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X flowiseai-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: flowiseai-pp-mcp
    main: ./cmd/flowiseai-pp-mcp
    binary: flowiseai-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: flowiseai-pp-cli
    repository:
      owner: daniel-larson
      name: homebrew-tap
    homepage: "https://github.com/daniel-larson/flowiseai-pp-cli"
    description: "Every Flowise endpoint plus newsletter-grade compound commands no MCP or SDK has — built for agents that run as..."
    install: |
      bin.install "flowiseai-pp-cli"
      bin.install "flowiseai-pp-mcp"
