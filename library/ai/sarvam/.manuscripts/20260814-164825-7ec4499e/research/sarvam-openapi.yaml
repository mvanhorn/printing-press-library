          type: string
          description: Unique identifier of the job run
    DocAiJobStatusResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, partially_completed, failed, rejected]
        run_id:
          type: string
          nullable: true
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string
    DocAiGetResultsResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
        result:
          type: object
          description: Extracted fields per the requested schema
        annotations:
          type: object
          description: Confidence and sources for each extracted field
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string
    DocAiDownloadUrlResponse:
      type: object
