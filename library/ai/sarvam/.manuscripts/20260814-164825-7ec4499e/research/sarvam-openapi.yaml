        job_id:
          type: string
          description: UUID of the bulk job
        files:
          type: array
          items:
            type: string
          description: Output filenames to upload (e.g. "0.json")
    FilesUploadResponse:
      type: object
      required: [job_id, job_state, upload_urls, storage_container_type]
      properties:
        job_id:
          type: string
        job_state:
          type: string
          enum: [Accepted, Pending, Running, Completed, Failed]
        upload_urls:
