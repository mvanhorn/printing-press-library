            type: object
            properties:
              file_url:
                type: string
              file_metadata:
                type: object
        storage_container_type:
          type: string
          enum: [Azure, Local, Google, Azure_V1]
    FileDownloadRequest:
      type: object
      required: [job_id, files]
      properties:
        job_id:
          type: string
          description: UUID of the bulk job
        files:
          type: array
          items:
            type: string
          description: Output filenames to download (e.g. "0.json")
    FilesDownloadResponse:
      type: object
      required: [job_id, job_state, download_urls, storage_container_type]
      properties:
        job_id:
          type: string
        job_state:
          type: string
          enum: [Accepted, Pending, Running, Completed, Failed]
        download_urls:
          type: object
          additionalProperties:
            type: object
            properties:
              file_url:
                type: string
              file_metadata:
                type: object
        storage_container_type:
          type: string
          enum: [Azure, Local, Google, Azure_V1]
    JobStatusResponse:
      type: object
      required: [job_state, created_at, updated_at, job_id, storage_container_type]
      properties:
        job_state:
          type: string
          enum: [Accepted, Pending, Running, Completed, Failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        job_id:
          type: string
        storage_container_type:
          type: string
          enum: [Azure, Local, Google, Azure_V1]
        total_files:
          type: integer
          default: 0
        successful_files_count:
          type: integer
          default: 0
        failed_files_count:
          type: integer
          default: 0
        error_message:
          type: string
        job_details:
          type: array
          items:
            type: object
            properties:
              inputs:
                type: array
                items:
                  type: object
                  properties:
                    file_name:
                      type: string
                    file_id:
                      type: string
              outputs:
                type: array
                items:
                  type: object
                  properties:
                    file_name:
                      type: string
                    file_id:
                      type: string
              state:
                type: string
                enum: [Success, "API Error", "Internal Server Error"]
              error_message:
                type: string
                nullable: true
              exception_name:
                type: string
                nullable: true
    ChatCompletionRequest:
      type: object
      required: [messages, model]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          description: Conversation history
        model:
          type: string
          enum: [sarvam-105b, sarvam-105b-conversations]
          description: Chat model ID. sarvam-105b for complex reasoning, sarvam-105b-conversations for real-time voice workloads
        temperature:
          type: number
          default: 0.2
          description: Sampling temperature (0-2)
        top_p:
          type: number
          default: 1.0
          description: Nucleus sampling probability mass
        reasoning_effort:
          type: string
          enum: [low, medium, high]
          default: medium
          nullable: true
          description: Reasoning effort. Set to null to disable
        max_tokens:
          type: integer
          default: 2048
          description: Maximum tokens to generate
        stream:
          type: boolean
          default: false
          description: Stream the response via server-sent events
        stop:
          type: array
          items:
            type: string
          description: Up to 4 stop sequences
        n:
          type: integer
          default: 1
          description: Number of chat completion choices
        seed:
          type: integer
          nullable: true
          description: Beta — best-effort deterministic sampling
        frequency_penalty:
          type: number
          default: 0
          description: Penalize repeated tokens (-2.0 to 2.0)
        presence_penalty:
          type: number
          default: 0
          description: Penalize new topics (-2.0 to 2.0)
        wiki_grounding:
          type: boolean
          default: false
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ChatTool"
          description: Functions the model may call
        tool_choice:
          type: object
          properties:
            type:
              type: string
              enum: [function]
            function:
              type: object
              properties:
                name:
                  type: string
        response_format:
          type: object
          properties:
            type:
              type: string
              enum: [text, json_object, json_schema]
            json_schema:
              type: object
              properties:
                name:
                  type: string
                schema:
                  type: object
                strict:
                  type: boolean
                  default: false
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: Author of the message
        content:
          type: string
          description: Message content
        name:
          type: string
          nullable: true
          description: Optional participant name
        tool_call_id:
          type: string
          description: Tool call this message responds to (for tool role)
        tool_calls:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [function]
              function:
                type: object
                properties:
                  name:
                    type: string
                  arguments:
                    type: string
                    description: JSON string of arguments
    ChatTool:
      type: object
      required: [type, function]
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
              description: JSON Schema object describing the function parameters
    ChatCompletionResponse:
      type: object
      required: [id, choices, created, model, object]
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              finish_reason:
                type: string
                enum: [stop, length, tool_calls, content_filter, function_call]
              index:
                type: integer
              message:
                type: object
                properties:
                  content:
                    type: string
                    nullable: true
                  role:
                    type: string
                    enum: [assistant]
                  refusal:
                    type: string
                    nullable: true
                  reasoning_content:
                    type: string
                    nullable: true
                    description: Chain-of-thought reasoning text
                  tool_calls:
                    type: array
                    items:
                      type: object
              logprobs:
                type: object
        created:
          type: integer
          description: Unix timestamp (seconds)
        model:
          type: string
        object:
          type: string
          enum: [chat.completion]
        service_tier:
          type: string
          nullable: true
        system_fingerprint:
          type: string
          nullable: true
        usage:
          type: object
          properties:
            completion_tokens:
              type: integer
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
            completion_tokens_details:
              type: object
            prompt_tokens_details:
              type: object
    ModelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              created:
                type: integer
              owned_by:
                type: string
              object:
                type: string
                default: model
        object:
          type: string
          default: list
    PronunciationDictionaryResponse:
      type: object
      properties:
        dictionaries:
          type: array
          items:
            type: object
            properties:
              dictionary_id:
