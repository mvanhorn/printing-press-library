# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "pinecone-pp-cli"
display_name = "Pinecone"
description = "Every Pinecone API feature, plus local sync, snapshot history, and text-first search no other Pinecone tool has."
project_kind = "cli"

[secrets.file]
path = "~/.config/pinecone-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
PINECONE_API_KEY = true
