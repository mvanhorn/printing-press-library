version: 2
project_name: zylos-pp-cli
changelog:
  disable: true
builds:
  - id: zylos-pp-cli
    main: ./cmd/zylos-pp-cli
    binary: zylos-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/zylos/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: zylos-pp-mcp
    main: ./cmd/zylos-pp-mcp
    binary: zylos-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: zylos-pp-cli
    repository:
      owner: summingyu
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Zylos conversation, from the terminal — with offline search, analytics, and streaming no other tool offers."
    install: |
      bin.install "zylos-pp-cli"
      bin.install "zylos-pp-mcp"
