version: 2
project_name: bland-pp-cli
changelog:
  disable: true
builds:
  - id: bland-pp-cli
    main: ./cmd/bland-pp-cli
    binary: bland-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/bland/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: bland-pp-mcp
    main: ./cmd/bland-pp-mcp
    binary: bland-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: bland-pp-cli
    repository:
      owner: gregmushen
      name: homebrew-tap
    homepage: "https://github.com/gregmushen/bland-pp-cli"
    description: "Send a task-driven call and follow it through to the result."
    install: |
      bin.install "bland-pp-cli"
      bin.install "bland-pp-mcp"
