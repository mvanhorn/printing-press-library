version: 2
project_name: artyfacts-pp-cli
changelog:
  disable: true
builds:
  - id: artyfacts-pp-cli
    main: ./cmd/artyfacts-pp-cli
    binary: artyfacts-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/artyfacts/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: artyfacts-pp-mcp
    main: ./cmd/artyfacts-pp-mcp
    binary: artyfacts-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: artyfacts-pp-cli
    repository:
      owner: bernard-maltais
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Artyfacts — persistent workspace for AI agent work products"
    install: |
      bin.install "artyfacts-pp-cli"
      bin.install "artyfacts-pp-mcp"
