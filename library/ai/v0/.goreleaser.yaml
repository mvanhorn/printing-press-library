version: 2
project_name: v0-pp-cli
changelog:
  disable: true
builds:
  - id: v0-pp-cli
    main: ./cmd/v0-pp-cli
    binary: v0-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/v0/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: v0-pp-mcp
    main: ./cmd/v0-pp-mcp
    binary: v0-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: v0-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Generate and iterate on web apps with v0 from the terminal: create chats from prompts, stream agent output, sync history to a local SQLite mirror, and track credit spend across models."
    install: |
      bin.install "v0-pp-cli"
      bin.install "v0-pp-mcp"
