version: 2
project_name: gamma-pp-cli
changelog:
  disable: true
builds:
  - id: gamma-pp-cli
    main: ./cmd/gamma-pp-cli
    binary: gamma-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/gamma/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: gamma-pp-mcp
    main: ./cmd/gamma-pp-mcp
    binary: gamma-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: gamma-pp-cli
    repository:
      owner: anchalsharma19
      name: homebrew-tap
    homepage: "https://github.com/anchalsharma19/gamma-pp-cli"
    description: "Generate presentations, documents, websites, and social posts programmatically."
    install: |
      bin.install "gamma-pp-cli"
      bin.install "gamma-pp-mcp"
