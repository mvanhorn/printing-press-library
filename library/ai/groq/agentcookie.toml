# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "groq-pp-cli"
display_name = "Groq Cloud"
description = "Every Groq endpoint in your terminal, plus a local ledger that tracks token cost and rate-limit budget."
project_kind = "cli"

[secrets.file]
path = "~/.config/groq-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
GROQ_API_KEY = true
