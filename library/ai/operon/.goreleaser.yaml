version: 2
project_name: operon-pp-cli
changelog:
  disable: true
builds:
  - id: operon-pp-cli
    main: ./cmd/operon-pp-cli
    binary: operon-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/operon/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: operon-pp-mcp
    main: ./cmd/operon-pp-mcp
    binary: operon-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: operon-pp-cli
    repository:
      owner: yaooooooooooooooo
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Operon API endpoint, plus a local demand mirror, auction replay, and trust-history queries that the API does..."
    install: |
      bin.install "operon-pp-cli"
      bin.install "operon-pp-mcp"
