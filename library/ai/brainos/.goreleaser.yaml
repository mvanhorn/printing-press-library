version: 2
project_name: brainos-pp-cli
changelog:
  disable: true
builds:
  - id: brainos-pp-cli
    main: ./cmd/brainos-pp-cli
    binary: brainos-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/brainos/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: brainos-pp-mcp
    main: ./cmd/brainos-pp-mcp
    binary: brainos-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: brainos-pp-cli
    repository:
      owner: devin
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Your AI infrastructure CLI: offline analytics across trading, memory, agents, and MCP — all from one binary."
    install: |
      bin.install "brainos-pp-cli"
      bin.install "brainos-pp-mcp"
