version: 2
project_name: fish-audio-pp-cli
changelog:
  disable: true
builds:
  - id: fish-audio-pp-cli
    main: ./cmd/fish-audio-pp-cli
    binary: fish-audio-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/fish-audio/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: fish-audio-pp-mcp
    main: ./cmd/fish-audio-pp-mcp
    binary: fish-audio-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: fish-audio-pp-cli
    repository:
      owner: jongouveia
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Fish Audio text-to-speech, voice cloning, and transcription from the terminal, with a local render log that tracks every byte and dollar the API never records."
    install: |
      bin.install "fish-audio-pp-cli"
      bin.install "fish-audio-pp-mcp"
