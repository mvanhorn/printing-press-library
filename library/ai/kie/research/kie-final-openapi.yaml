          - system
          - user
          - assistant
          - tool
          description: 'Message role


            - **developer**: Developer-provided instructions that the model should follow, regardless
            of user messages. In o1 models and newer versions, developer messages replace the previous
            system messages.

            - **system**: Developer-provided instructions that the model should follow, regardless of
            user messages. In o1 models and newer versions, please use developer messages instead.

            - **user**: Messages sent by end users, containing prompts or additional context information.

            - **assistant**: Messages sent by the model in response to user messages.

            - **tool**: Content of tool messages.'
        content:
          type: array
          description: 'Message content array that can contain text and image objects.


            **Unified Media File Format:**


            Whether it''s images, videos, audio, or other document types, all media files use the same
            format structure:


            - The `type` field is always `"image_url"`

            - The `image_url` field name remains unchanged

            - The only thing that changes is the `url` value, which points to the corresponding media
            file address


            For example: images, videos, audio, PDFs, and other documents all use the same `{ type: ''image_url'',
            image_url: { url: ''...'' } }` structure.'
          items:
