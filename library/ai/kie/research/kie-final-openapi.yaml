                \ bright\",\n        \"model_name\": \"chirp-v3-5\",\n        \"title\": \"Iron Man\"\
                ,\n        \"tags\": \"electrifying, rock\",\n        \"createTime\": \"2025-01-01 00:00:00\"\
                ,\n        \"duration\": 228.28\n      }\n    ]\n  }\n}\n```"
