        : \"Get the current stock price for a given symbol\",\n      \"parameters\": {\n        \"type\"\
        : \"object\",\n        \"properties\": {\n          \"symbol\": {\n            \"type\": \"string\"\
        ,\n            \"description\": \"The stock symbol, e.g. AAPL\"\n          }\n        },\n   \
        \     \"required\": [\"symbol\"]\n      }\n    }\n  }\n]\n```\n\n### Function Declaration Requirements\n\
        \nWhen implementing function calling in your prompt, you need to create a `tools` array containing\
        \ one or more function declarations. You can define functions using JSON (specifically, a selected\
        \ subset of OpenAPI schema format).\n\nA single function declaration can include the following\
        \ parameters:\n\n- **`name`** (string, required): The unique name of the function (e.g., `get_weather_forecast`,\
        \ `send_email`). Use descriptive names without spaces or special characters (use underscores or\
        \ camelCase).\n\n- **`description`** (string, optional but recommended): A clear and detailed\
        \ description of what the function does and its purpose. This is crucial for the model to understand\
        \ when to use the function. Be specific and provide examples when necessary (e.g., \"Find movie\
        \ theaters by location, with an option to also find movies currently showing at those theaters.\"\
        ).\n\n- **`parameters`** (object, required): Defines the input parameters expected by the function.\
        \ Contains:\n  - **`type`** (string): Specifies the overall data type, must be `\"object\"`.\n\
        \  - **`properties`** (object): Lists individual parameters, each with:\n    - **`type`** (string):\
        \ The parameter's data type, such as `string`, `integer`, `boolean`, `array`.\n    - **`description`**\
        \ (string): Description of the parameter's purpose and format. Provide examples and constraints\
        \ (e.g., \"City and state, e.g. 'San Francisco, CA' or a postal code like '95616'.\").\n    -\
        \ **`enum`** (array, optional): If parameter values come from a fixed set, use `enum` to list\
        \ allowed values rather than just describing them in the description. This helps improve accuracy\
        \ (e.g., `\"enum\": [\"daylight\", \"cool\", \"warm\"]`).\n  - **`required`** (array): An array\
        \ of strings listing the parameter names required for the function to run.\n</Accordion>\n</AccordionGroup>\n\
        \n## Response Format Parameter\n\nThe `response_format` parameter is an optional JSON Schema object\
        \ that defines the structure of the response. When provided, the model will generate responses\
        \ that conform to this schema.\n\n<div style=\"padding: 20px; background-color: rgba(255, 87,\
        \ 34, 0.03); border: 1px solid rgba(255, 87, 34, 0.15); border-left: 6px solid #ff5722; border-radius:\
        \ 12px; margin: 25px 0;\">\n  <div style=\"display: flex; align-items: center; margin-bottom:\
        \ 15px;\">\n    <div style=\"background-color: #ff5722; color: #fff; padding: 3px 10px; border-radius:\
