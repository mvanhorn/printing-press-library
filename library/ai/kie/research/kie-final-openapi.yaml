                tools:
                - type: function
                  function:
                    name: googleSearch
                stream: true
                include_thoughts: true
                response_format:
                  type: json_schema
                  properties:
                    response:
                      type: string
            example:
              messages:
              - role: user
                content:
                - type: text
                  text: What is in this image?
                - type: image_url
                  image_url:
                    url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
              tools:
              - type: function
                function:
                  name: googleSearch
              stream: true
              include_thoughts: true
              reasoning_effort: high
