  /gemini-2.5-flash/v1/chat/completions:
    post:
      summary: Gemini 2.5 Flash (openai)
      deprecated: false
      description: "### Streaming Support\n\nWhen `stream: true` is set in the request, the API returns\
        \ responses as server-sent events (SSE) with `Content-Type: text/event-stream`. This allows for\
        \ progressive response delivery, where message deltas are sent incrementally as they are generated.\
        \ Each event contains partial message content, enabling real-time display of responses in your\
        \ application.\n\n**Streaming Response Format:**\n- Content-Type: `text/event-stream`\n- Each\
        \ event line starts with `data: ` followed by JSON\n- Events contain incremental message deltas\n\
        - Final event indicates completion with `finish_reason`\n\n<CardGroup cols={2}>\n  <Card title=\"\
        Multimodal\" icon=\"lucide-image\">\n    Supports text and image inputs\n  </Card>\n  <Card title=\"\
        Real-time Search\" icon=\"lucide-search\">\n    Google Search grounding enabled\n  </Card>\n \
        \ <Card title=\"Streaming\" icon=\"lucide-list-minus\">\n    Server-sent events support\n  </Card>\n\
        \  <Card title=\"Flexible Roles\" icon=\"lucide-users\">\n    Multiple message roles supported\n\
        \  </Card>\n</CardGroup>\n\n<div style=\"padding: 20px; background-color: rgba(255, 152, 0, 0.05);\
        \ border: 1px solid rgba(255, 152, 0, 0.15); border-left: 6px solid #ff9800; border-radius: 10px;\
        \ margin: 25px 0;\">\n  <div style=\"display: flex; align-items: center; margin-bottom: 12px;\"\
        >\n    <span style=\"font-size: 22px; margin-right: 10px;\">⚠️</span>\n    <strong style=\"color:\
        \ #e65100; font-size: 17px;\">Important: Unified Media Structure</strong>\n  </div>\n\n  <p style=\"\
        color: #444; margin-bottom: 15px; line-height: 1.6; font-size: 14px;\">\n    To simplify integration,\
        \ <b>all media types</b> (Images, Videos, Audio, or Documents) in the <code>messages</code> array\
        \ share the <b>exact same JSON structure</b>:\n  </p>\n\n  <ul style=\"color: #555; line-height:\
        \ 1.8; margin-bottom: 15px; font-size: 14px;\">\n    <li>The <code>type</code> field is <b>fixed</b>\
        \ as <code>\"image_url\"</code></li>\n    <li>The <code>image_url</code> key name <b>remains unchanged</b>\
        \ for all file types</li>\n    <li>Only the <code>url</code> value points to your specific media\
        \ file</li>\n  </ul>\n\n  <div style=\"background-color: #fdfdfd; padding: 12px; border-radius:\
        \ 6px; border: 1px solid #eee; font-family: 'SFMono-Regular', Consolas, monospace; font-size:\
        \ 13px; color: #d32f2f;\">\n    <span style=\"color: #888; font-style: italic;\">// Example for\
        \ Video/Audio/PDF/Image:</span><br>\n    { \"type\": \"image_url\", \"image_url\": { \"url\":\
        \ \"https://...\" } }\n  </div>\n</div>\n\n## Tools Parameter\n\nThe `tools` parameter is an optional\
        \ array that allows you to define functions the model can call. The array can contain multiple\
        \ objects. When using function calling, you can define multiple functions in the array.\n\n<div\
        \ style=\"padding: 20px; background-color: rgba(255, 152, 0, 0.05); border: 1px solid rgba(255,\
        \ 152, 0, 0.15); border-left: 6px solid #ffa000; border-radius: 12px; margin: 25px 0;\">\n  <div\
        \ style=\"display: flex; align-items: center; margin-bottom: 12px;\">\n    <div style=\"background-color:\
        \ #ffa000; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 800;\
