  /gemini/v1/models/gemini-3-5-flash:streamGenerateContent:
    post:
      summary: Gemini 3.5 Flash
      deprecated: false
      description: '### Streaming Support


        The Gemini endpoint returns streaming chunks from `streamGenerateContent`. Function calling responses
        appear in `candidates[].content.parts[].functionCall`.


        **Streaming Response Format:**

        - Content-Type: `text/event-stream` or provider stream chunks

        - Function calls are returned inside `parts[].functionCall`

        - Thinking output may be reflected through `thoughtSignature` and usage metadata


        ## Features


        - Standard chat with `contents`.

        - Google Search grounding with `googleSearch`.

        - Function calling with `functionDeclarations`.

        - Thinking configuration with `generationConfig.thinkingConfig`.


        ## Request Notes


        - Use `contents` as the primary conversation input.

        - Use `tools.googleSearch` to enable Google Search grounding.

        - Use `tools.functionDeclarations` to define callable functions.

        - Use `generationConfig.thinkingConfig` to control thoughts output and thinking level.


        ## Authentication


        Use the auth configuration for `X-Goog-Api-Key`. Do not add it as a regular request parameter.'
      operationId: gemini_3.5_flash
      tags:
      - Chat
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contents:
                  type: array
                  description: Conversation input for Gemini.
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - model
                        description: Content role.
                        examples:
                        - user
                      parts:
                        type: array
                        description: Content parts. Use text, inline_data, or provider-specific blocks.
                        items:
                          oneOf:
                          - type: object
                            properties:
                              text:
                                type: string
                                description: Plain text input.
                                examples:
                                - What is the weather in Beijing today?
                          - type: object
                            properties:
                              inline_data:
                                type: object
                                description: Inline binary payload.
                                properties:
                                  mime_type:
                                    type: string
                                    examples:
