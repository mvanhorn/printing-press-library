                weirdnessConstraint:
                  type: number
                  description: Controls experimental/creative deviation. Optional. Range 0–1, up to 2
                    decimal places.
                  minimum: 0
                  maximum: 1
                  multipleOf: 0.01
                  examples:
                  - 0.65
                audioWeight:
                  type: number
                  description: Balance weight for audio features vs. other factors. Optional. Range 0–1,
                    up to 2 decimal places.
                  minimum: 0
                  maximum: 1
                  multipleOf: 0.01
                  examples:
                  - 0.65
                personaId:
                  type: string
                  description: "Only available when Custom Mode (`customMode: true`) is enabled. Persona\
