                tools:
                  type: string
                include_thoughts:
                  type: boolean
                  description: Whether to include thought output.
                  examples:
                  - true
                reasoning_effort:
                  type: string
                  enum:
                  - low
                  - high
                  description: Thinking level.
                  examples:
                  - high
              required:
              - messages
