        \ 15px; padding-left: 18px; line-height: 1.6;\">\n    <li>Use <code>response_format</code> for\
        \ structured JSON output (e.g., JSON Mode).</li>\n    <li>Use <b>Function Calling</b> for interacting\
        \ with external tools and APIs.</li>\n  </ul>\n</div>\n\n<AccordionGroup>\n<Accordion title=\"\
        JSON Schema Support\">\nThe `response_format` follows the JSON Schema specification. Supported\
        \ types include:\n\n- **`string`**: For text values\n- **`number`**: For floating-point numbers\n\
        - **`integer`**: For whole numbers\n- **`boolean`**: For true/false values\n- **`object`**: For\
        \ structured data with key-value pairs\n- **`array`**: For lists of items\n- **`null`**: To allow\
        \ null values, add `\"null\"` to the type array (e.g., `{\"type\": [\"string\", \"null\"]}`)\n\
        \n#### Type-Specific Properties\n\n**For `object` values:**\n- `properties`: Object mapping property\
        \ names to their schema definitions\n- `required`: Array of required property names\n- `additionalProperties`:\
        \ Controls whether properties not in `properties` are allowed\n\n**For `string` values:**\n- `enum`:\
        \ List of specific possible string values for classification\n- `format`: Specifies string syntax\
        \ (e.g., `date-time`, `date`, `time`)\n\n**For `number` and `integer` values:**\n- `enum`: List\
        \ of specific possible numeric values\n- `minimum`: Inclusive minimum value\n- `maximum`: Inclusive\
        \ maximum value\n\n**For `array` values:**\n- `items`: Schema definition for all array elements\n\
        - `prefixItems`: List of schemas for the first N items (tuple-like structures)\n- `minItems`:\
        \ Minimum number of items in the array\n- `maxItems`: Maximum number of items in the array\n</Accordion>\n\
        \n<Accordion title=\"Example\">\n```json\n{\n  \"response_format\": {\n    \"type\": \"json_schema\"\
        ,\n    \"properties\": {\n      \"response\": {\n        \"type\": \"string\"\n      }\n    }\n\
        \  }\n}\n```\n</Accordion>\n\n<Accordion title=\"Best Practices\">\n- **Clear descriptions**:\
        \ Use the `description` field in the schema to clearly explain what each property means\n- **Strong\
        \ typing**: Use specific types (`integer`, `string`, `enum`) whenever possible\n- **Prompt engineering**:\
        \ Clearly state in your prompt what you want the model to extract or structure\n- **Validation**:\
        \ While structured output ensures JSON is syntactically correct, always validate the semantic\
        \ correctness of values in your application code\n</Accordion>\n</AccordionGroup>"
      operationId: gemini-3-pro-chat-completions
      tags:
      - Chat
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  description: 'An array of message objects. Each message has a role and content.


                    **Unified Media File Format:**


                    In the content array, whether it''s images, videos, audio, or other document types,
                    all media files use the same format structure:


                    - The `type` field is always `"image_url"`

                    - The `image_url` field name remains unchanged

                    - The only thing that changes is the `url` value, which points to the corresponding
                    media file address


                    For example: images, videos, audio, PDFs, and other documents all use the same `{
                    type: ''image_url'', image_url: { url: ''...'' } }` structure.'
                  items:
                    $ref: '#/components/schemas/Message'
                  minItems: 1
                stream:
                  type: boolean
                  default: true
                  description: If set to true, partial message deltas will be sent as server-sent events.
                    Default is true.
                tools:
                  type: array
                  description: 'An optional array of tools the model may call. The array can contain multiple
                    objects. Supports two formats:


                    1. **Google Search**: `{"type": "function", "function": {"name": "googleSearch"}}`
                    - Enables real-time information retrieval via Google Search.

                    2. **Function calling**: Define your own functions with name, description, and parameters.
                    You can define multiple functions in the array. Functions are defined using JSON (specifically,
                    a selected subset of OpenAPI schema format).


                    **Important**: Google Search and function calling are mutually exclusive - you cannot
                    use both in the same request. When using function calling, you can include multiple
                    function definitions. Function calling and `response_format` are also mutually exclusive
                    - you cannot use both in the same request.'
                  items:
                    $ref: '#/components/schemas/Tool'
                  minItems: 0
                include_thoughts:
                  type: boolean
                  description: Whether to include thoughts in the response. If set to true, thoughts will
                    be included in the response, otherwise they will not be included. Default is true.
                  default: true
                reasoning_effort:
                  type: string
                  enum:
                  - low
                  - high
                  description: The effort level for the model to use for reasoning. Low effort is faster
                    to respond, high effort is slower to respond but solves more complex problems. Default
                    is "high".
                  default: high
                response_format:
                  description: "Optional JSON Schema object defining the structure of the response. When\
                    \ provided, the model will generate responses that conform to this schema. **`response_format`\
                    \ and function calling are mutually exclusive** - you cannot use both in the same\
                    \ request.\n\nExample:\n```json\n{\n  \"type\": \"json_schema\",\n  \"properties\"\
                    : {\n    \"response\": {\n      \"type\": \"string\"\n    }\n  }\n}\n```"
                  $ref: '#/components/schemas/ResponseFormat'
              required:
              - messages
              examples:
              - messages:
                - role: user
                  content:
                  - type: text
                    text: What is in this image?
                  - type: image_url
                    image_url:
                      url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
                tools:
                - type: function
                  function:
                    name: googleSearch
                stream: true
                include_thoughts: true
                reasoning_effort: high
                response_format:
                  type: json_schema
                  properties:
                    response:
                      type: string
            example:
              messages:
              - role: user
                content:
                - type: text
                  text: What is in this image?
                - type: image_url
                  image_url:
                    url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
              tools:
              - type: function
                function:
                  name: googleSearch
              stream: true
              include_thoughts: true
              reasoning_effort: high
              response_format:
                type: json_schema
                json_schema:
                  name: structured_output
                  strict: true
                  schema:
                    type: object
                    properties:
                      response:
                        type: string
      responses:
        '200':
          description: Request successful. When `response_format` is provided, the response will conform
            to the specified JSON schema. Otherwise, returns the standard chat completion format.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the chat completion
                    examples:
                    - chatcmpl-example-123
                  object:
                    type: string
                    description: Object type
                    examples:
                    - chat.completion
                  created:
                    type: integer
                    format: int64
                    description: Unix timestamp of when the completion was created
                    examples:
                    - 1677652288
                  model:
                    type: string
                    description: Model name
                    examples:
                    - gemini-3-pro
                  choices:
                    type: array
                    description: Array of completion choices
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Index of the choice
                          examples:
                          - 0
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              examples:
                              - assistant
                            content:
                              type: string
                              description: Message content
                          required:
                          - role
                          - content
                        finish_reason:
                          type: string
                          description: Reason why the completion finished
                          examples:
                          - stop
                      required:
                      - index
                      - message
                      - finish_reason
                  usage:
                    type: object
