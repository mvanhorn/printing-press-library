                callBackUrl:
                  type: string
                  format: uri
                  description: 'The URL to receive audio extension task completion updates. Required for
                    all audio extension requests.


                    - System will POST task status and results to this URL when audio extension completes

                    - Callback includes extended audio files that seamlessly continue the uploaded track''s
                    style

                    - Your callback endpoint should accept POST requests with JSON payload containing
                    extended track results and audio URLs

                    - For detailed callback format and implementation guide, see [Audio Extension Callbacks](https://docs.kie.ai/suno-api/upload-and-extend-audio-callbacks)

                    - Alternatively, use the Get Music Details endpoint to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - https://api.example.com/callback
                vocalGender:
                  type: string
                  description: Vocal gender preference for the singing voice. Optional. Use 'm' for male
                    and 'f' for female. Based on practice, this parameter can only increase the probability
                    but cannot guarantee adherence to male/female voice instructions.
                  enum:
                  - m
                  - f
                  examples:
