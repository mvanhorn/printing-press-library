                    \ persona style to your music generation. \n\nTo generate a persona ID, use the [Generate\
                    \ Persona](https://docs.kie.ai/suno-api/generate-persona) endpoint to create a personalized\
                    \ music Persona based on generated music.\n\nTo generate a Voice ID, use the [Generate\
                    \ Voice](https://docs.kie.ai/suno-api/suno-voice-generate)endpoint"
                  examples:
                  - persona_123
                personaModel:
                  type: string
                  enum:
                  - style_persona
                  - voice_persona
                  description: The persona model is only available for models version 5 and 5.5.
                instrumental:
                  type: boolean
                  default: false
                  description: Indicates whether it is an instrumental track. If true, passing the `prompt`
                    and `vocalGender` parameters is prohibited.
            example:
              defaultParamFlag: true
              audioId: e231****-****-****-****-****8cadc7dc
              prompt: Extend the music with more relaxing notes and a gentle bridge section
              model: V4
              callBackUrl: https://api.example.com/callback
              style: Classical
              title: Peaceful Piano Extended
              continueAt: 60
              negativeTags: Heavy Metal, Upbeat Drums
              vocalGender: m
              styleWeight: 0.65
              weirdnessConstraint: 0.65
              audioWeight: 0.65
              personaId: persona_123
              personaModel: style_persona
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 401
                      - 402
                      - 404
                      - 409
                      - 422
                      - 429
                      - 451
                      - 455
                      - 500
                      description: 'Response status code


                        - **200**: Success - Request has been processed successfully

                        - **401**: Unauthorized - Authentication credentials are missing or invalid

                        - **402**: Insufficient Credits - Account does not have enough credits to perform
                        the operation

                        - **404**: Not Found - The requested resource or endpoint does not exist

                        - **409**: Conflict - WAV record already exists

                        - **422**: Validation Error - The request parameters failed validation checks

                        - **429**: Rate Limited - Request limit has been exceeded for this resource

                        - **451**: Unauthorized - Failed to fetch the image. Kindly verify any access
                        limits set by you or your service provider.

                        - **455**: Service Unavailable - System is currently undergoing maintenance

                        - **500**: Server Error - An unexpected error occurred while processing the request'
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        taskId:
                          type: string
                          description: Task ID for tracking task status. Use this ID with the "Get Music
                            Details" endpoint to query extension task details and results.
                          examples:
                          - 5c79****be8e
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
