        color: #444; margin-bottom: 15px; line-height: 1.6; font-size: 14px;\">\n    To simplify integration,\
        \ <b>all media types</b> (Images, Videos, Audio, or Documents) in the <code>messages</code> array\
        \ share the <b>exact same JSON structure</b>:\n  </p>\n\n  <ul style=\"color: #555; line-height:\
        \ 1.8; margin-bottom: 15px; font-size: 14px;\">\n    <li>The <code>type</code> field is <b>fixed</b>\
        \ as <code>\"image_url\"</code></li>\n    <li>The <code>image_url</code> key name <b>remains unchanged</b>\
