  /api/v1/vocal-removal/generate:
    post:
      summary: Vocal & Instrument Stem Separation
      deprecated: false
      description: "Use advanced audio processing technology to separate music into vocals, accompaniment,\
        \ and individual instrumental stems.\n\n### Usage Guide\n\n- Separate platform-generated mixes\
        \ into vocals, accompaniment, and individual instrumental components.\n- Supports three processing\
        \ modes:\n  - separate_vocal — 2-stem separation (vocals + accompaniment)\n  - split_stem — Up\
        \ to 12-stem separation\n  - split_stem_advanced — Advanced multi-stem separation, supporting\
        \ precise extraction of a single target stem through `stemName`\n- Suitable for karaoke production,\
        \ mixing, sample extraction, and detailed post-production.\n- Works best with professional AI-generated\
        \ mixes that have clearly separated vocals and instruments.\n- **Billing:** Each API call consumes\
        \ credits; **repeated calls for the same audio stem will be charged again** (no server-side caching).\n\
        - **Pricing:** Please check [**https://kie.ai/pricing**](https://kie.ai/pricing) for the current\
        \ credit cost per call.\n\n### Separation Mode Description\n\n| **Mode (`type`)** | **Returned\
        \ Stems** | **Typical Use Cases** | **Credit Cost** |\n| :---------------------------- | :---------------------------------------------------------------------------------------------------------------------------------\
        \ | :------------------------------------------ | :----------------------------- |\n| `separate_vocal`\
        \ *（default）*   | **2 stems** — Vocals + accompaniment                                       \
        \                                                                       | Quick vocal removal,\
        \ karaoke, and basic mixing               | **10 credits**  |\n| `split_stem`                \
        \  | **Up to 12 stems** — Vocals, backing vocals, drums, bass, guitar, keyboard, strings, brass,\
        \ woodwinds, percussion, synthesizer, FX/other;    | Advanced mixing, remixing, sound design,\
        \ and individual instrument extraction         |**50 credits**|\n| `split_stem_advanced`    |\
        \ Up to 12 stems — Same as `split_stem`, with support for specifying a single target stem through\
        \ `stemName` for precise separation             | Individual instrument extraction and detailed\
        \ post-production      | **20 credits**  |\n\n### Parameters\n\n| Name       | Type   | Description\
        \                                                                 |\n| :--------- | :----- | :-------------------------------------------------------------------\
        \ |\n| `taskId`   | string | The ID of the original music generation task                    \
        \                            |\n| `audioUrl`   | string | The URL of the user-uploaded audio file.\
        \ Required when processing user-uploaded audio. Cannot be used together with `audioId`.      \
        \                                         |\n| `audioId`  | string | Specifies the audio variant\
        \ to process when multiple versions exist. Cannot be used together with `audioUrl`.          \
        \                       |\n| `type`     | string | Separation mode: `separate_vocal`, `split_stem`,\
        \ or `split_stem_advanced`; defaults to `separate_vocal`     |\n| `stemName` | string | Takes\
        \ effect only when `type` is `split_stem`; specifies the name of the individual stem/instrument\
        \ to separate; |\n\n### Developer Notes\n\n- All returned audio file URLs are valid for **14 days**.\n\
        - Separation quality depends on the complexity and mixing characteristics of the original track.\n\
        - `separate_vocal` returns **2 stems** — vocals + accompaniment.\n- `split_stem` returns **up\
        \ to 12 independent stems** — vocals, backing vocals, drums, bass, guitar, keyboard, strings,\
        \ brass, woodwinds, percussion, synthesizer, and FX/other.\n- `split_stem_advanced` supports specifying\
        \ a single target stem through `stemName` for precise extraction.\n- **Billing:** Each request\
        \ consumes credits. Repeatedly submitting the same stem will **deduct credits again** (no server-side\
        \ caching)."
      operationId: separate-vocals
      tags:
      - Market
      parameters: []
      requestBody:
        content:
