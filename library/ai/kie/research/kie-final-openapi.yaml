openapi: 3.0.1
info:
  title: Kie.ai API
  description: 'Unified API for Kie.ai''s AI generation platform: image, video, music, and chat models,
    plus account and file utilities. Async generation endpoints return a taskId; poll the matching record-info/get-details
    endpoint (or use a callBackUrl) to retrieve results.'
  version: 1.0.0
servers:
- url: https://api.kie.ai
  description: Production
security:
- BearerAuth: []
paths:
  /api/v1/chat/credit:
    get:
      summary: Get Remaining Credits
      deprecated: false
      description: 'Get the current credit balance available in your account.


        ### Usage Guide


        * Use this interface to check your current credit balance

        * Monitor usage to ensure sufficient credits to continue using services

        * Plan credit replenishment based on usage patterns


        ### Developer Notes


        * All generation services require credit balance

        * Service access will be restricted when credits are exhausted

        * Credit consumption is based on specific services and usage volume'
      operationId: get-account-credits
      tags:
      - Common
      parameters: []
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum:
                    - 200
                    - 401
                    - 402
                    - 404
                    - 422
                    - 429
                    - 455
                    - 500
                    - 505
                    description: 'Response Status Code


                      | Code | Description |

                      |------|-------------|

                      | 200 | Success - Request has been processed successfully |

                      | 401 | Unauthorized - Authentication credentials are missing or invalid |

                      | 402 | Insufficient Credits - Account does not have enough credits to perform the
                      operation |

                      | 404 | Not Found - The requested resource or endpoint does not exist |

                      | 422 | Validation Error - The request parameters failed validation checks |

                      | 429 | Rate Limited - Request limit has been exceeded for this resource |

                      | 455 | Service Unavailable - System is currently undergoing maintenance |

                      | 500 | Server Error - An unexpected error occurred while processing the request
                      |

                      | 505 | Feature Disabled - The requested feature is currently disabled |'
                  msg:
                    type: string
                    description: Error message when code != 200
                    examples:
                    - success
                  data:
                    type: integer
                    description: Remaining credit quantity
                    examples:
                    - 100
                required:
                - code
                - msg
                - data
              example:
                code: 200
                msg: success
                data: 100
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
  /api/v1/common/download-url:
    post:
      summary: Get Download URL for Generated Files
      deprecated: false
      description: "# Get Download Link for Generated Files\n\n  Convert generated file URLs into downloadable\
        \ temporary links. Only supports files generated by kie.ai services.\n\n### Features\n\n* Convert\
        \ kie.ai generated file URLs into downloadable links\n* Supports all file types generated by the\
        \ kie.ai platform (images, videos, audio, etc.)\n* Temporary download links are valid for 20 minutes\n\
        * Secure access to generated content\n* Protected by API Key authentication\n\n### Important Notes\n\
        \nOnly supports file URLs generated by kie.ai services. External file URLs will return a 422 validation\
        \ error.\n\nDownloadable links expire after 20 minutes. Please ensure you download or cache content\
        \ within this timeframe."
      operationId: download-url
      tags:
      - Common
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  description: Image URL (Required)
                  type: string
              required:
              - url
            example: "{\n  \"url\": \"https://tempfile.aiquickdraw.com/path/to/image.jpg\" // 图片url（必填）\n\
              }"
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 401
                      - 402
                      - 404
                      - 422
                      - 429
                      - 455
                      - 500
                      - 505
                      description: 'Response Status Code


                        | Code | Description |

                        |------|-------------|

                        | 200 | Success - Request has been processed successfully |

                        | 401 | Unauthorized - Authentication credentials are missing or invalid |

                        | 402 | Insufficient Credits - Account does not have enough credits to perform
                        the operation |

                        | 404 | Not Found - The requested resource or endpoint does not exist |

                        | 422 | Validation Error - Invalid URL (External file URLs are not supported)
                        |

                        | 429 | Rate Limited - Request limit has been exceeded for this resource |

                        | 455 | Service Unavailable - System is currently undergoing maintenance |

                        | 500 | Server Error - An unexpected error occurred while processing the request
                        |

                        | 505 | Feature Disabled - The requested feature is currently disabled |'
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: string
                      format: uri
                      description: Downloadable URL for the file. Valid for 20 minutes.
                      examples:
                      - https://tempfile.1f6cxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxbd98
              example:
                code: 200
                msg: success
                data: https://tempfile.1f6cxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxbd98
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
  /api/v1/gpt4o-image/generate:
    post:
      summary: Generate 4o Image
      deprecated: false
      description: Create a new 4o Image generation task. Generated images are stored for 14 days, after
        which they expire.
      operationId: generate-4o-image
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: (Optional) Text prompt that conveys the creative idea you want the 4o model
                    to render. Required if neither `filesUrl` nor `fileUrl` is supplied. At least one
                    of `prompt` or `filesUrl` must be provided.
                  examples:
                  - A beautiful sunset over the mountains
                filesUrl:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: '(Optional) Up to 5 publicly reachable image URLs to serve as reference
                    or source material. Use this when you want to edit or build upon an existing picture.
                    If you don’t have reliable hosting, upload your images first via our File Upload API
                    quick‑start: https://docs.kie.ai/file-upload-api/quickstart. Supported formats: .jfif,
                    .pjpeg, .jpeg, .pjp, .jpg, .png, .webp. At least one of `prompt` or `filesUrl` must
                    be provided.'
                  examples:
                  - - https://example.com/image.png
                size:
                  type: string
                  description: (Required) Aspect ratio of the generated image. Must be one of the listed
                    values.
                  enum:
                  - '1:1'
                  - '3:2'
                  - '2:3'
                  examples:
                  - '1:1'
                callBackUrl:
                  type: string
                  format: uri
                  description: 'The URL to receive 4o image generation task completion updates. Optional
                    but recommended for production use.


                    - System will POST task status and results to this URL when 4o image generation completes

                    - Callback includes generated image URLs and task information for all variations

                    - Your callback endpoint should accept POST requests with JSON payload containing
                    image generation results

                    - For detailed callback format and implementation guide, see [4o Image Generation
                    Callbacks](https://docs.kie.ai/4o-image-api/generate-4-o-image-callbacks)

                    - Alternatively, use the Get 4o Image Details endpoint to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - https://your-callback-url.com/callback
                fileUrl:
                  type: string
                  format: uri
                  description: (Optional, Deprecated) File URL, such as an image URL. If fileUrl is provided,
                    4o image may create based on this image. This parameter will be deprecated in the
                    future, please use filesUrl instead.
                  deprecated: true
                  examples:
                  - https://example.com/image.png
              required:
              - size
              examples:
              - filesUrl:
                - https://example.com/image.png
                prompt: A beautiful sunset over the mountains
                size: '1:1'
                callBackUrl: https://your-callback-url.com/callback
                isEnhance: false
                uploadCn: false
                enableFallback: false
                fallbackModel: FLUX_MAX
            example:
              filesUrl:
              - https://example.com/image.png
              prompt: A beautiful sunset over the mountains
              size: '1:1'
              callBackUrl: https://your-callback-url.com/callback
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 400
                      - 401
                      - 402
                      - 404
                      - 422
                      - 429
                      - 455
                      - 500
                      - 550
                      description: "Response Status Codes\n\n- **200**: Success - Request has been processed\
                        \ successfully  \n- **400**: Format Error - The parameter is not in a valid JSON\
                        \ format  \n- **401**: Unauthorized - Authentication credentials are missing or\
                        \ invalid  \n- **402**: Insufficient Credits - Account does not have enough credits\
                        \ to perform the operation  \n- **404**: Not Found - The requested resource or\
                        \ endpoint does not exist  \n- **422**: Validation Error - The request parameters\
                        \ failed validation checks  \n- **429**: Rate Limited - Request limit has been\
                        \ exceeded for this resource  \n- **455**: Service Unavailable - System is currently\
                        \ undergoing maintenance  \n- **500**: Server Error - An unexpected error occurred\
                        \ while processing the request  \n  - Build Failed - vocal removal generation\
                        \ failed  \n- **550**: Connection Denied - Task was rejected due to a full queue,\
                        \ likely caused by source site's issues. Please contact the administrator to confirm."
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        taskId:
                          type: string
                          description: Task ID, can be used with [Get 4o Image Details](/4o-image-api/get-4-o-image-details)
                            to query task status
                          examples:
                          - task12345
              example:
                code: 200
                msg: success
                data:
                  taskId: task12345
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
      callbacks:
        on4oImageGenerated:
          '{$request.body#/callBackUrl}':
            post:
              summary: 4o Image Generation Task Callback
              description: When the 4o Image task is completed, the system will send the result to your
                provided callback URL via POST request
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: "Response Status Codes\n\n- **200**: Success - Image generation\
                            \ completed successfully  \n- **400**: Bad Request  \n  - The image content\
                            \ in filesUrl violates content policy  \n  - Image size exceeds maximum of\
                            \ 26214400 bytes  \n  - We couldn't process the provided image file (code=invalid_image_format)\
                            \  \n  - Your content was flagged by OpenAI as violating content policies\
                            \  \n- **451**: Download Failed - Unable to download image from the provided\
                            \ filesUrl  \n- **500**: Server Error  \n  - Please try again later  \n  -\
                            \ Failed to get user token  \n  - Failed to generate image  \n  - GPT 4O failed\
                            \ to edit the picture  \n  - null"
                          enum:
                          - 200
                          - 400
                          - 451
                          - 500
                        msg:
                          type: string
                          description: Status message
                          example: success
                        data:
                          type: object
                          properties:
                            taskId:
                              type: string
                              description: Task ID
                              example: task12345
                            info:
                              type: object
                              properties:
                                result_urls:
                                  type: array
                                  items:
                                    type: string
                                  description: List of generated image URLs
                                  example:
                                  - https://example.com/result/image1.png
                    example:
                      code: 200
                      msg: success
                      data:
                        taskId: task12345
                        info:
                          result_urls:
                          - https://example.com/result/image1.png
              responses:
                '200':
                  description: Callback received successfully
  /api/v1/gpt4o-image/record-info:
    get:
      summary: Get 4o Image Details
      deprecated: false
      description: 'Query 4o Image generation task details using taskId, including generation status,
        parameters and results.


        ### Status Descriptions

        - GENERATING: Generating in progress

        - SUCCESS: Generation successful

        - CREATE_TASK_FAILED: Failed to create task

        - GENERATE_FAILED: Generation failed


        ### Important Notes

        - Maximum query rate is 3 times per second per task'
      operationId: get-4o-image-details
      tags:
      - Market
      parameters:
      - name: taskId
        in: query
        description: Unique identifier of the 4o image generation task
        required: true
        example: task12345
        schema:
          type: string
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 401
                      - 402
                      - 404
                      - 422
                      - 429
                      - 455
                      - 500
                      description: "Response Status Codes\n\n- **200**: Success - Request has been processed\
                        \ successfully  \n- **401**: Unauthorized - Authentication credentials are missing\
                        \ or invalid  \n- **402**: Insufficient Credits - Account does not have enough\
                        \ credits to perform the operation  \n- **404**: Not Found - The requested resource\
                        \ or endpoint does not exist  \n- **422**: Validation Error - The request parameters\
                        \ failed validation checks  \n- **429**: Rate Limited - Request limit has been\
                        \ exceeded for this resource  \n- **455**: Service Unavailable - System is currently\
                        \ undergoing maintenance  \n- **500**: Server Error - An unexpected error occurred\
                        \ while processing the request  \n  - Build Failed - vocal removal generation\
                        \ failed"
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        taskId:
                          type: string
                          description: Unique identifier of the 4o image generation task
                          examples:
                          - task12345
                        paramJson:
                          type: string
                          description: Request parameters
                          examples:
                          - '{"prompt":"A beautiful sunset over the mountains","size":"1:1","isEnhance":false}'
                        completeTime:
                          type: integer
                          format: int64
                          description: Task completion time
                          examples:
                          - 1672574400000
                        response:
                          type: object
                          description: Final result
                          properties:
                            resultUrls:
                              type: array
                              items:
                                type: string
                              description: List of generated image URLs
                              examples:
                              - - https://example.com/result/image1.png
                        successFlag:
                          type: integer
                          format: int32
                          description: Generation status flag
                          examples:
                          - 1
                        status:
                          type: string
                          description: "Generation status text, possible values: GENERATING-In progress,\
                            \ SUCCESS-Successful, CREATE_TASK_FAILED-Task creation failed, GENERATE_FAILED-Generation\
                            \ failed\n\n- **200**: Success - Image generation completed successfully \
                            \ \n- **400**: Bad Request  \n  - The image content in filesUrl violates content\
                            \ policy  \n  - Image size exceeds maximum of 26214400 bytes  \n  - We couldn't\
                            \ process the provided image file (code=invalid_image_format)  \n  - Your\
                            \ content was flagged by OpenAI as violating content policies  \n  - Failed\
                            \ to fetch the image. Kindly verify any access limits set by you or your service\
                            \ provider  \n- **451**: Download Failed - Unable to download image from the\
                            \ provided filesUrl  \n- **500**: Internal Error  \n  - Failed to get user\
                            \ token  \n  - Please try again later  \n  - Failed to generate image  \n\
                            \  - GPT 4O failed to edit the picture  \n  - null"
                          enum:
                          - GENERATING
                          - SUCCESS
                          - CREATE_TASK_FAILED
                          - GENERATE_FAILED
                          examples:
                          - SUCCESS
                        errorCode:
                          type: integer
                          format: int32
                          description: Error code
                          enum:
                          - 200
                          - 400
                          - 451
                          - 500
                        errorMessage:
                          type: string
                          description: Error message
                          examples:
                          - ''
                        createTime:
                          type: integer
                          format: int64
                          description: Creation time
                          examples:
                          - 1672561200000
                        progress:
                          type: string
                          description: Progress, minimum value is "0.00", maximum value is "1.00"
                          examples:
                          - '1.00'
              example:
                code: 200
                msg: success
                data:
                  taskId: task12345
                  paramJson: '{"prompt":"A beautiful sunset over the mountains","size":"1:1","isEnhance":false}'
                  completeTime: 1672574400000
                  response:
                    resultUrls:
                    - https://example.com/result/image1.png
                  successFlag: 1
                  status: SUCCESS
                  errorCode: null
                  errorMessage: ''
                  createTime: 1672561200000
                  progress: '1.00'
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
  /api/v1/gpt4o-image/download-url:
    post:
      summary: Get Direct Download URL
      deprecated: false
      description: Convert an image URL to a direct download URL. This helps solve cross-domain issues
        when downloading images directly. The returned URL is valid for 20 minutes.
      operationId: get-4o-image-download-url
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  description: The task ID associated with the image generation
                  examples:
                  - task12345
                url:
                  type: string
                  format: uri
                  description: The original image URL that needs to be converted to a direct download
                    URL
                  examples:
                  - https://tempfile.aiquickdraw.com/v/xxxxxxx.png
              required:
              - taskId
              - url
              examples:
              - taskId: task12345
                url: https://tempfile.aiquickdraw.com/v/xxxxxxx.png
            example:
              taskId: task12345
              url: https://tempfile.aiquickdraw.com/v/xxxxxxx.png
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 401
                      - 404
                      - 422
                      - 451
                      - 455
                      - 500
                      description: "Response Status Codes\n\n- **200**: Success - Request has been processed\
                        \ successfully  \n- **401**: Unauthorized - Authentication credentials are missing\
                        \ or invalid  \n- **404**: Not Found - The requested resource or endpoint does\
                        \ not exist  \n- **422**: Validation Error  \n  - The request parameters failed\
                        \ validation checks  \n  - record is null  \n  - Temporarily supports records\
                        \ within 14 days  \n  - record result data is blank  \n  - record status is not\
                        \ success  \n  - record result data not exist  \n  - record result data is empty\
                        \  \n- **451**: Failed to fetch the image. Kindly verify any access limits set\
                        \ by you or your service provider  \n- **455**: Service Unavailable - System is\
                        \ currently undergoing maintenance  \n- **500**: Server Error - An unexpected\
                        \ error occurred while processing the request"
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: string
                      description: Direct download URL valid for 20 minutes
                      examples:
                      - https://xxxxxx.xxxxxxxx.r2.cloudflarestorage.com/v/xxxxxxx.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20250415T101007Z&X-Amz-SignedHeaders=host&X-Amz-Expires=1200&X-Amz-Credential=2464206aa3e576aa7c035d889be3a84e%2F20250415%2Fapac%2Fs3%2Faws4_request&X-Amz-Signature=122ae8bef09110e620841ab2ef8061c1818e754fc201408a9d1c6847b36fd3df
              example:
                code: 200
                msg: success
                data: https://xxxxxx.xxxxxxxx.r2.cloudflarestorage.com/v/xxxxxxx.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20250415T101007Z&X-Amz-SignedHeaders=host&X-Amz-Expires=1200&X-Amz-Credential=2464206aa3e576aa7c035d889be3a84e%2F20250415%2Fapac%2Fs3%2Faws4_request&X-Amz-Signature=122ae8bef09110e620841ab2ef8061c1818e754fc201408a9d1c6847b36fd3df
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
