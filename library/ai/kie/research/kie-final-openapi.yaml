  /api/v1/jobs/recordInfo:
    get:
      summary: Get Task Details
      deprecated: false
      description: 'Query the status and results of any task created in the Market models. This is a unified
        query interface that works with all models under the Market category.


        ### Supported Models

        This endpoint works with all Market models including:

        - **Seedream**: seedream, seedream-v4-text-to-image, etc.

        - **Grok Imagine**: text-to-image, image-to-video, text-to-video, upscale

        - **Kling**: text-to-video, image-to-video models

        - **ElevenLabs**: Audio processing models

        - **Claude**: Language models

        - **And any future models added to the Market**


        ### Task States

        - **waiting**: Task is queued and waiting to be processed

        - **queuing**: Task is in the processing queue

        - **generating**: Task is currently being processed

        - **success**: Task completed successfully

        - **fail**: Task failed


        ### Best Practices

        - **Use callbacks for production**: Include `callBackUrl` when creating tasks to avoid polling

        - **Implement exponential backoff**: Start with 2-3 second intervals, increase gradually

        - **Handle timeouts**: Stop polling after 10-15 minutes

        - **Download results immediately**: Generated content URLs typically expire after 24 hours'
      operationId: market-query-task
      tags:
      - Market
      parameters:
      - name: taskId
        in: query
        description: The unique task identifier returned when you created the task.
        required: true
        schema:
          type: string
          examples:
          - task_12345678
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - &id004
                  $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      description: The task data object containing all task information
                      properties:
                        taskId:
                          type: string
                          description: The unique identifier for this task
                          examples:
                          - task_12345678
                        model:
                          type: string
                          description: The model used for this task (e.g., grok-imagine/text-to-image,
                            seedream-4.0, kling-1.0)
                          examples:
                          - grok-imagine/text-to-image
                        state:
                          type: string
                          description: Current state of the task
                          enum:
                          - waiting
                          - queuing
                          - generating
                          - success
                          - fail
                          examples:
                          - success
                        param:
                          type: string
                          description: JSON string containing the original request parameters used to
                            create the task
                          examples:
                          - '{"model":"grok-imagine/text-to-image","callBackUrl":"https://your-domain.com/api/callback","input":{"prompt":"Cinematic
                            portrait...","aspect_ratio":"3:2"}}'
                        resultJson:
                          type: string
                          examples:
                          - '{"resultUrls":["https://example.com/generated-content.jpg"]}'
                          - '{"resultObject":{"subject_status":1}}'
                          - '{"resultObject":{"mask_urls":["https://example.com/mask_1", "https://example.com/mask_2"]}}'
                          description: 'A JSON string containing the generated URL. Only exists if the
                            status is "success".


                            Depending on `outputMediaType`, the structure is as follows:

                            - For images/media/videos: {resultUrls: []}

                            - If using Seedance 2 or Seedance 2 Fast with `return_last_frame` enabled:
                            {resultUrls: [], firstFrameUrl: [], lastFrameUrl: []}

                            - For text output: {resultObject: {}}


                            For OmniHuman series models:

                            - OmniHuman 1.5 Subject Detection (subject detection model): response structure
                            is {resultObject: {mask_urls: ["url1", "url2", ...]}}, returning a list of
                            mask image URLs corresponding to the detected subjects. The URLs returned
                            by this model are valid for 1 hour.

                            - OmniHuman 1.5 Human Identification (human identification model): response
                            structure is {resultObject: {subject_status: 1}}, where `subject_status` means
                            0 = no subject detected, 1 = subject detected, indicating whether a human
                            subject is detected in the image.'
                        failCode:
                          type: string
                          description: Error code if the task failed. Empty string if successful
                          examples:
                          - ''
                        failMsg:
                          type: string
                          description: Error message if the task failed. Empty string if successful
                          examples:
                          - ''
                        costTime:
                          type: integer
                          format: int64
                          description: Processing time in milliseconds (available when successful)
                          examples:
                          - 15000
                        completeTime:
                          type: integer
                          format: int64
                          description: Completion timestamp (Unix timestamp in milliseconds)
                          examples:
                          - 1698765432000
                        createTime:
                          type: integer
                          format: int64
                          description: Creation timestamp (Unix timestamp in milliseconds)
                          examples:
                          - 1698765400000
                        updateTime:
                          type: integer
                          format: int64
                          description: Update timestamp (Unix timestamp in milliseconds)
                          examples:
                          - 1698765432000
                        progress:
                          type: integer
                          description: Generation progress (0-100). Only returned when model is sora2
                            or sora2 pro.
                          minimum: 0
                          maximum: 100
                          examples:
                          - 45
                        creditsConsumed:
                          type: number
                          description: Credit consumption details for this task, indicating the actual
                            number of credits deducted during task execution.
              example:
                code: 505
                msg: success
                data:
                  taskId: task_12345678
                  model: grok-imagine/text-to-image
                  state: success
                  param: '{"model":"grok-imagine/text-to-image","callBackUrl":"https://your-domain.com/api/callback","input":{"prompt":"Cinematic
                    portrait...","aspect_ratio":"3:2"}}'
                  resultJson: '{"resultUrls":["https://example.com/generated-content.jpg"]}'
                  failCode: ''
                  failMsg: ''
                  costTime: 15000
                  completeTime: 1698765432000
                  createTime: 1698765400000
                  updateTime: 1698765432000
                  progress: 45
                  creditsConsumed: 50
          headers: {}
        '400':
          description: Bad Request - Missing or invalid taskId parameter
          content:
            application/json:
              schema: *id004
              example:
                code: 400
                msg: taskId parameter is required
          headers: {}
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema: *id004
              example:
                code: 401
                msg: Unauthorized
          headers: {}
        '404':
          description: Task Not Found - The specified taskId does not exist
          content:
            application/json:
              schema: *id004
              example:
                code: 404
                msg: Task not found
          headers: {}
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
              example:
                code: 422
                msg: recordInfo is null
                data: null
          headers: {}
        '429':
          description: Rate Limited - Too many requests
          content:
            application/json:
              schema: *id004
              example:
                code: 429
                msg: Rate limit exceeded
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'All API requests require a Bearer Token. Add header `Authorization: Bearer YOUR_API_KEY`.
        Get a key at https://kie.ai/api-key.'
  schemas:
    Base64UploadRequest:
      type: object
      properties:
        base64Data:
          type: string
          description: Base64 encoded file data. Supports pure Base64 strings or data URL format
          examples:
          - data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        uploadPath:
          type: string
          description: File upload path, without leading or trailing slashes
          examples:
          - images/base64
        fileName:
          type: string
          description: File name (optional), including file extension. If not provided, a random file
            name will be generated. If the same file name is uploaded again, the old file will be overwritten,
            but changes may not take effect immediately due to caching
          examples:
          - my-image.png
      required:
      - base64Data
      - uploadPath
    FileUploadResult:
      type: object
      properties:
        fileName:
          type: string
          description: File name
          examples:
          - uploaded-image.png
        filePath:
          type: string
          description: Complete file path in storage
          examples:
          - images/user-uploads/uploaded-image.png
        downloadUrl:
          type: string
          format: uri
          description: File download URL
          examples:
          - https://tempfile.redpandaai.co/xxx/images/user-uploads/uploaded-image.png
        fileSize:
          type: integer
          description: File size in bytes
          examples:
          - 154832
        mimeType:
          type: string
          description: File MIME type
          examples:
          - image/png
        uploadedAt:
          type: string
          format: date-time
          description: Upload timestamp
          examples:
          - '2025-01-01T12:00:00.000Z'
      required:
      - fileName
      - filePath
      - downloadUrl
      - fileSize
      - mimeType
      - uploadedAt
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 'Response status code


            - **200**: Success - Request has been processed successfully

            - **401**: Unauthorized - Authentication credentials are missing or invalid

            - **402**: Insufficient Credits - Account does not have enough credits to perform the operation

            - **404**: Not Found - The requested resource or endpoint does not exist

            - **422**: Validation Error - The request parameters failed validation checks

            - **429**: Rate Limited - Request limit has been exceeded for this resource

            - **433**: Request Limit - Sub-key Usage Exceeds Limit

            - **455**: Service Unavailable - System is currently undergoing maintenance

            - **500**: Server Error - An unexpected error occurred while processing the request

            - **501**: Generation Failed - Content generation task failed

            - **505**: Feature Disabled - The requested feature is currently disabled'
          enum:
          - 200
          - 401
          - 402
          - 404
          - 422
          - 429
          - 433
          - 455
          - 500
          - 501
          - 505
        msg:
          type: string
          description: Response message, error description when failed
          examples:
          - success
        data:
          type: object
          properties:
            taskId:
              type: string
              description: Task ID, can be used with Get Task Details endpoint to query task status
          required:
          - taskId
      title: response not with recordId
      required:
      - data
    ApiResponse1:
      type: object
      properties:
        code:
          type: integer
          enum:
          - 200
          - 401
          - 402
          - 404
          - 422
          - 429
          - 455
          - 500
          - 501
          - 505
          description: '响应状态码


            - **200**: 成功 - 请求已处理完成

            - **401**: 未授权 - 身份验证凭据缺失或无效

            - **402**: 积分不足 - 账户余额不足以执行该操作

            - **404**: 未找到 - 请求的资源或接口不存在

            - **422**: 参数验证错误 - 请求参数未通过校验

            - **429**: 调用频率超限 - 已超出该资源的请求限制

            - **455**: 服务不可用 - 系统正在维护中

            - **500**: 服务器内部错误 - 处理请求时发生意外故障

            - **501**: 生成失败 - 内容生成任务执行失败

            - **505**: 功能禁用 - 当前请求的功能已被禁用'
        msg:
          type: string
          description: 响应消息，请求失败时返回错误描述
          examples:
