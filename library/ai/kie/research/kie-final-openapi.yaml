  /api/v1/midi/generate:
    post:
      summary: Generate MIDI from Audio
      deprecated: false
      description: 'Convert separated audio tracks into MIDI format with detailed note information for
        each instrument.


        ## Usage Guide


        * Convert separated audio tracks into structured MIDI data containing pitch, timing, and velocity
        information

        * Requires a completed vocal separation task ID (from the Vocal Removal API)

        * Generates MIDI note data for multiple detected instruments including drums, bass, guitar, keyboards,
        and more

        * Ideal for music transcription, notation, remixing, or educational analysis

        * Best results on clean, well-separated audio tracks with clear instrument parts


        ## Prerequisites


        :::warning Required

        You must first use the [Vocal & Instrument Stem Separation](/suno-api/separate-vocals) API to
        separate your audio before generating MIDI.


        ## Parameter Reference


        | Name | Type | Description |

        | :--- | :--- | :--- |

        | **`taskId`** | string | **Required.** Task ID from a completed vocal separation. |

        | **`callBackUrl`** | string | **Required.** URL to receive MIDI generation completion notifications.
        |

        | **`audioId`** | string | **Optional.** Specifies which separated audio track to generate MIDI
        from. This `audioId` can be obtained from the `originData` array in the [Get Vocal Separation
        Details](/suno-api/get-vocal-separation-details) endpoint response. Each item in `originData`
        contains an `id` field that can be used here. If not provided, MIDI will be generated from all
        separated tracks. |


        ## Developer Notes


        * The callback will contain detailed note data for each detected instrument.

        * Each note includes: `pitch` (MIDI note number), `start` (seconds), `end` (seconds), `velocity`
        (0-1).

        * Not all instruments may be detected — depends on audio content.

        * **Pricing:** Check current per-call credit costs at [**https://kie.ai/pricing**](https://kie.ai/pricing).'
      operationId: generate-midi
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - taskId
              - callBackUrl
              properties:
                taskId:
                  type: string
                  description: Task ID from a completed vocal separation. This should be the taskId returned
                    from the Vocal & Instrument Stem Separation endpoint.
                  examples:
                  - 5c79****be8e
                callBackUrl:
                  type: string
                  format: uri
                  description: 'The URL to receive MIDI generation task completion updates. Required for
                    all MIDI generation requests.


                    - System will POST task status and MIDI note data to this URL when generation completes

                    - Callback includes detailed note information for each detected instrument with pitch,
                    timing, and velocity

                    - Your callback endpoint should accept POST requests with JSON payload containing
                    MIDI data

                    - For detailed callback format and implementation guide, see [MIDI Generation Callbacks](https://docs.kie.ai/suno-api/generate-midi-callbacks)

                    - Alternatively, use the Get MIDI Generation Details endpoint to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - https://example.callback
                audioId:
                  type: string
                  description: Optional. Specifies which separated audio track to generate MIDI from.
                    This audioId can be obtained from the `originData` array in the Get Vocal Separation
                    Details endpoint response. Each item in `originData` contains an `id` field that can
                    be used here. If not provided, MIDI will be generated from all separated tracks.
                  examples:
                  - 8ca376e7-******-08aaf2c6dd27
            example:
              taskId: 5c79****be8e
              callBackUrl: https://example.callback
              audioId: 8ca376e7-******-08aaf2c6dd27
      responses:
        '200':
          description: MIDI generation task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response status code
                    examples:
                    - 200
                  msg:
                    type: string
                    description: Response message
                    examples:
                    - success
                  data:
                    type: object
                    description: Response data containing task information
                    properties:
                      taskId:
                        type: string
                        description: Unique identifier for the MIDI generation task. Use this to query
                          task status or receive callback results.
                        examples:
                        - 5c79****be8e
              example:
                code: 200
                msg: success
                data:
                  taskId: 5c79****be8e
          headers: {}
        '500':
          description: request failed
          content:
