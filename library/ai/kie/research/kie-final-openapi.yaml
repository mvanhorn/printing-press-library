                      type:
                        type: string
                        examples:
                        - authentication_error
          headers: {}
        '429':
          description: Rate Limited - Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Rate limit exceeded
                      type:
                        type: string
                        examples:
                        - rate_limit_error
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
