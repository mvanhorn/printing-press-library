  /gpt-5-2/v1/chat/completions:
    post:
      summary: GPT 5.2
      deprecated: false
      description: "GPT-5-2 API is a next-generation multimodal model with exceptional reasoning capabilities,\
        \ supporting text and image inputs with Web Search grounding and adjustable reasoning effort.\n\
        \n<CardGroup cols={2}>\n  <Card title=\"Multimodal\" icon=\"lucide-image\">\n    Supports text\
        \ and image inputs\n  </Card>\n  <Card title=\"Real-time Search\" icon=\"lucide-search\">\n  \
        \  Web search grounding enabled\n  </Card>\n  <Card title=\"Reasoning Effort\" icon=\"lucide-list-minus\"\
        >\n    Adjustable reasoning effort level\n  </Card>\n  <Card title=\"Flexible Roles\" icon=\"\
        lucide-users\">\n    Multiple message roles supported\n  </Card>\n</CardGroup>\n\n## Unified Media\
        \ File Format\n\nIn the `messages` parameter's `content` array, only images are supported. All\
        \ image files use the same format structure:\n\n- The `type` field is always `\"image_url\"`\n\
        - The `image_url` field name remains unchanged\n- The only thing that changes is the `url` value,\
        \ which points to the corresponding image address\n\nFor example: `{ type: 'image_url', image_url:\
        \ { url: '...' } }` structure.\n\n## Tools Parameter\n\nThe `tools` parameter is an optional array\
        \ that allows you to enable Web Search grounding.\n\n### Web Search\n\nUse this format to enable\
        \ Web Search grounding:\n\n```json\n{\n  \"type\": \"function\",\n  \"function\": {\n    \"name\"\
        : \"web_search\"\n  }\n}\n```\n\nThis enables real-time information retrieval via Web Search.\n\
        \n## Response Example\n\n```json\n{\n  \"id\": \"chatcmpl-example-123\",\n  \"object\": \"chat.completion\"\
        ,\n  \"created\": 1741569952,\n  \"model\": \"gpt-5-2\",\n  \"choices\": [\n    {\n      \"index\"\
        : 0,\n      \"message\": {\n        \"role\": \"assistant\",\n        \"content\": \"hello,can\
        \ i help you?\",\n        \"refusal\": null,\n        \"annotations\": []\n      },\n      \"\
        logprobs\": null,\n      \"finish_reason\": \"stop\"\n    }\n  ],\n  \"usage\": {\n    \"prompt_tokens\"\
        : 10,\n    \"completion_tokens\": 50,\n    \"total_tokens\": 60\n  }\n}\n```"
      operationId: gpt-5-2-chat-completions
      tags:
      - Chat
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  description: 'An array of message objects. Each message has a role and content.


                    **Unified Media File Format:**


                    In the content array, only images are supported. All image files use the same format
                    structure:


                    - The `type` field is always `"image_url"`

                    - The `image_url` field name remains unchanged

                    - The only thing that changes is the `url` value, which points to the corresponding
                    image address


                    For example: `{ type: ''image_url'', image_url: { url: ''...'' } }` structure.'
                  items:
                    $ref: '#/components/schemas/Message'
                  minItems: 1
                tools:
                  type: array
                  description: 'An optional array of tools the model may call. Supports Web Search: `{"type":
                    "function", "function": {"name": "web_search"}}` - Enables real-time information retrieval
                    via Web Search.'
                  items:
                    $ref: '#/components/schemas/Tool'
                  minItems: 0
                reasoning_effort:
                  type: string
                  enum:
                  - low
                  - high
                  description: The effort level for the model to use for reasoning. Low effort is faster
                    to respond, high effort is slower to respond but solves more complex problems. Default
                    is "high".
                  default: high
              required:
              - messages
              examples:
              - messages:
                - role: user
                  content:
                  - type: text
                    text: What is in this image?
                  - type: image_url
                    image_url:
                      url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
                tools:
                - type: function
                  function:
                    name: web_search
                reasoning_effort: high
            example:
              messages:
              - role: user
                content:
                - type: text
                  text: What is in this image?
                - type: image_url
                  image_url:
                    url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
              tools:
              - type: function
                function:
                  name: web_search
              reasoning_effort: high
      responses:
        '200':
          description: Request successful. Returns the standard chat completion format.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the chat completion
                    examples:
                    - chatcmpl-example-123
                  object:
                    type: string
                    description: Object type
                    examples:
                    - chat.completion
                  created:
                    type: integer
                    format: int64
                    description: Unix timestamp of when the completion was created
                    examples:
                    - 1677652288
                  model:
                    type: string
                    description: Model name
                    examples:
                    - gpt-5-2
                  choices:
                    type: array
                    description: Array of completion choices
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Index of the choice
                          examples:
                          - 0
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              examples:
                              - assistant
                            content:
                              type: string
                              description: Message content
                          required:
                          - role
                          - content
                        finish_reason:
                          type: string
                          description: Reason why the completion finished
                          examples:
                          - stop
                      required:
                      - index
                      - message
                      - finish_reason
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                        description: Number of tokens in the prompt
                        examples:
                        - 10
                      completion_tokens:
                        type: integer
                        description: Number of tokens in the completion
                        examples:
                        - 50
                      total_tokens:
                        type: integer
                        description: Total number of tokens
                        examples:
                        - 60
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
          headers: {}
        '400':
          description: Bad Request - Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Invalid request parameters
                      type:
                        type: string
                        examples:
                        - invalid_request_error
          headers: {}
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Unauthorized
                      type:
                        type: string
                        examples:
                        - authentication_error
          headers: {}
        '429':
          description: Rate Limited - Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Rate limit exceeded
                      type:
                        type: string
                        examples:
                        - rate_limit_error
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
  /codex/v1/responses:
    post:
      summary: GPT 5.6 Terra
      deprecated: false
      description: "GPT 5.6 Terra API is a multimodal chat-completions style endpoint that accepts structured\
        \ input arrays, supports adjustable reasoning effort, and integrates web search or function calling\
        \ tools.\n\n<CardGroup cols={2}>\n  <Card title=\"Multimodal Input\" icon=\"\U0001F5BC️\">\n \
        \   Supports mixed text, image, and file inputs in a single message.\n  </Card>\n\n  <Card title=\"\
        Reasoning Control\" icon=\"\U0001F9E0\">\n    Adjustable reasoning effort from low to xhigh.\n\
        \  </Card>\n\n  <Card title=\"Tools & Web Search\" icon=\"✨\">\n    Integrates web search or custom\
        \ function calling tools.\n  </Card>\n\n  <Card title=\"Unified Endpoint\" icon=\"\U0001F4BB\"\
        >\n    Uses the unified <code>/api/v1/responses</code> endpoint with <code>model</code> set to\
        \ one of <code>gpt-5-6-terra</code>.\n  </Card>\n</CardGroup>\n\n## Tools & tool\\_choice\n\n\
        The `tools` array enables **web search** or **function calling** capabilities.\n\nWeb Search and\
        \ Function Calling are **mutually exclusive**.  \nIn a single request you should choose only one:\
        \ do not include both `{\"type\": \"web_search\"}` and `{\"type\": \"function\", ...}` in the\
        \ same `tools` array.\n\n<AccordionGroup>\n  <Accordion title=\"Web Search\">\n    Use the built-in\
        \ Web Search tool to retrieve up-to-date information:\n\n    ```json\n    {\n      \"tools\":\
        \ [\n        {\n          \"type\": \"web_search\"\n        }\n      ]\n    }\n    ```\n  </Accordion>\n\
        \n  <Accordion title=\"Function Calling\">\n    Define business functions that the model can call\
        \ when needed:\n\n    ```json\n    {\n      \"tools\": [\n        {\n          \"type\": \"function\"\
        ,\n          \"name\": \"get_current_weather\",\n          \"description\": \"Get the current\
        \ weather in a given location\",\n          \"parameters\": {\n            \"type\": \"object\"\
        ,\n            \"properties\": {\n              \"location\": {\n                \"type\": \"\
        string\",\n                \"description\": \"The city and state, e.g. San Francisco, CA\"\n \
        \             },\n              \"unit\": {\n                \"type\": \"string\",\n         \
        \       \"enum\": [\"celsius\", \"fahrenheit\"]\n              }\n            },\n           \
        \ \"required\": [\"location\", \"unit\"]\n          }\n        }\n      ],\n      \"tool_choice\"\
        : \"auto\"\n    }\n    ```\n\n    When function tools are configured in `tools`, set `tool_choice`\
        \ to `\"auto\"` so the model can decide when to call them.  \n    If you do not configure any\
        \ function tools, omit the `tool_choice` field.\n  </Accordion>\n</AccordionGroup>"
      operationId: gpt-5-6-terra-completions
      tags:
      - Chat
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: 'Target model name. Allowed values: `gpt-5-6-terra`.'
                  default: gpt-5-6-terra
                  enum:
                  - gpt-5-6-terra
                  examples:
                  - gpt-5-6-terra
                stream:
                  type: boolean
                  description: When true, responses stream in real time as server-sent events. When false,
                    the full response is returned at once after completion. Default is true.
                  default: false
                input:
                  oneOf:
                  - type: string
                    description: Input can be a string.
                  - type: array
                    description: Input can be an array; each element is a message object with role and
                      content.
                    items:
                      type: object
                      properties: {}
                    minItems: 1
                reasoning:
                  type: object
                  description: Reasoning configuration for the model.
                  properties:
                    effort:
                      type: string
                      description: Reasoning effort level. Higher values provide more thorough reasoning
                        but may increase latency. Defaults to "low".
                      enum:
                      - low
                      - medium
                      - high
                      - xhigh
                      default: low
                      examples:
                      - low
                tools:
                  type: array
                  description: Optional tools that the model may call. Either web search OR function calling
                    should be configured, but not both simultaneously.
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/ToolWebSearch'
                    - $ref: '#/components/schemas/ToolFunction'
                tool_choice:
                  type: string
                  description: Tool selection behavior. When function tools are configured in `tools`,
                    set this to `auto` so the model can decide when to call them.
                  examples:
                  - auto
              required:
              - model
              - input
              examples:
              - model: gpt-5.1-codex
                input:
                - role: user
                  content:
                  - type: input_text
                    text: What is in this image?
                  - type: input_image
                    image_url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
                tools:
                - type: web_search
                reasoning:
                  effort: high
            example:
              model: gpt-5-6-terra
              input:
              - role: user
                content:
                - type: input_text
                  text: What is in this image?
                - type: input_image
                  image_url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
              tools:
              - type: web_search
              reasoning:
                effort: high
      responses:
        '200':
          description: Request successful.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Streaming responses are sent as Server-Sent Events (SSE) with `Content-Type:\
                  \ text/event-stream`.\n\n**Standard output**\n\n- **Text delta event**: `event: response.output_text.delta`\n\
                  \  - `data.delta`: The incremental text content in the stream\n  - `data.type`: Event\
                  \ type, always `response.output_text.delta`\n- **Completion event**: `event: response.completed`\n\
                  \  - `data.response.usage`: Token usage information, such as `input_tokens` and `output_tokens`\n\
                  \n**Function Calling**\n\n- **Function call arguments delta event**: `event: response.function_call_arguments.delta`\n\
                  \  - `data.delta`: Incremental string content of the function call arguments\n  - `data.type`:\
                  \ Event type, always `response.function_call_arguments.delta`\n- **Completion event**:\
                  \ `event: response.completed`\n  - `data.response.usage`: Token usage information, such\
                  \ as `input_tokens` and `output_tokens`\n\nThe final line `data: [DONE]` is the stream\
                  \ end marker, indicating that no more events will be sent."
              example: "{\n  \"output\": [\n    {\n      \"type\": \"reasoning\",\n      \"id\": \"rs_xxx\"\
                ,\n      \"summary\": []\n    },\n    {\n      \"type\": \"message\",\n      \"role\"\
                : \"assistant\",\n      \"id\": \"msg_xxx\",\n      \"content\": [\n        {\n      \
                \    \"type\": \"output_text\",\n          \"text\": \"Hello! How can I help you today?\"\
                \n        }\n      ],\n      \"status\": \"completed\"\n    }\n  ],\n  \"usage\": {\n\
                \    \"total_tokens\": 4490,\n    \"output_tokens\": 47,\n    \"input_tokens\": 4443\n\
                \  },\n  \"credits_consumed\": 0.48,\n  \"status\": \"completed\"\n}"
          headers: {}
        '400':
          description: Bad Request - Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Invalid request parameters
                      type:
                        type: string
                        examples:
                        - invalid_request_error
          headers: {}
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Unauthorized
                      type:
                        type: string
                        examples:
                        - authentication_error
          headers: {}
        '429':
          description: Rate Limited - Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Rate limit exceeded
                      type:
                        type: string
                        examples:
                        - rate_limit_error
          headers: {}
        '500':
          description: 请求失败
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
  /claude/v1/messages:
    post:
      summary: Claude Sonnet 5
      deprecated: false
      description: '### Streaming Support


        When `stream: true` is set in the request, the API returns responses as server-sent events (SSE).
        Claude tool calling responses stream `tool_use` blocks and `input_json_delta` fragments.


        **Streaming Response Format:**

        - Content-Type: `text/event-stream`

        - Event names include `message_start`, `content_block_start`, `content_block_delta`, `message_delta`,
        and `message_stop`

        - Tool calls are emitted as `tool_use` content blocks

        - Final stop reason is often `tool_use` for function-calling requests


        ## Features


        - Standard chat with `messages`.

        - Function calling with `tools` and `input_schema`.

        - Optional stream response with Claude events.

        - Optional project-specific thinking flag.


        ## Request Notes


        - Put the current model name in the `model` field.

        - Use `messages` for conversation history.

        - Use `tools` to declare callable functions.

        - Set `stream` to `true` for SSE output.


        ## Authentication


        Use the auth configuration for `X-Api-Key` and `anthropic-version`. Do not add them as regular
        request parameters.'
      operationId: claude_sonnet_4_8
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: Model name. It must match the current document.
                  enum:
                  - claude-sonnet-5
                  examples:
                  - claude-sonnet-5
                messages:
                  type: array
                  description: Conversation messages in chronological order.
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                        description: Message role.
                        examples:
                        - user
                      content:
                        oneOf:
                        - type: string
                          description: Plain text content.
                        - type: array
                          description: Structured content blocks.
                          items:
                            type: object
                            additionalProperties: true
                        description: Message content.
                        examples:
                        - What is the weather like in Boston today?
                    required:
                    - role
                    - content
                  minItems: 1
                tools:
                  type: array
                  description: Optional callable tools. Each tool includes a name, description, and input_schema.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Function name.
                        examples:
                        - get_current_weather
                      description:
                        type: string
                        description: Human-readable function description.
                        examples:
                        - Get the current weather in a given location
                      input_schema:
                        type: object
                        description: JSON Schema for function parameters.
                        properties:
                          type:
                            type: string
                            description: Schema type.
                            examples:
                            - object
                          properties:
                            type: object
                            description: Function parameter definitions.
