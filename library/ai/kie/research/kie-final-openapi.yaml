  /api/v1/generate:
    post:
      summary: Generate Music
      deprecated: false
      description: "Generate music with or without lyrics using AI models.\n\n### Usage Guide\n- This\
        \ endpoint creates music based on your text prompt\n- Multiple variations will be generated for\
        \ each request\n- You can control detail level with custom mode and instrumental settings\n\n\
        ### Parameter Details\n- In Custom Mode (`customMode: true`):\n  - If `instrumental: true`: `style`\
        \ and `title` are required\n  - If `instrumental: false`: `style`, `prompt`, and `title` are required\n\
        \  - `duration` is an optional parameter and is only effective when model is set to V5_5.\n  -\
        \ Character limits vary by model:\n    - **V4**: `prompt`  3000 characters, `style` 200 characters\n\
        \    - **V4_5 & V4_5PLUS**: `prompt`  5000 characters, `style` 1000 characters\n    - **V4_5ALL**:\
        \ `prompt`  5000 characters, `style` 1000 characters\n    - **V5_5 & V5**: `prompt`  5000 characters,\
        \ `style` 1000 characters\n  - `title` length limit: 80 characters (all models)\n\n- In Non-custom\
        \ Mode (`customMode: false`):\n  - Only `prompt` is required regardless of `instrumental` setting\n\
        \  - `prompt` length limit: 500 characters\n  - Other parameters should be left empty\n\n### Developer\
        \ Notes\n- Recommendation for new users: Start with `customMode: false` for simpler usage\n- Generated\
        \ files are retained for 14 days\n- Callback process has three stages: `text` (text generation),\
        \ `first` (first track complete), `complete` (all tracks complete)"
      operationId: generate-music
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prompt
              - customMode
              - instrumental
              - model
              - callBackUrl
              properties:
                prompt:
                  type: string
                  description: "A description of the desired audio content.  \n- In Custom Mode (`customMode:\
                    \ true`): Required if `instrumental` is `false`. The prompt will be strictly used\
                    \ as the lyrics and sung in the generated track. Character limits by model:  \n  -\
                    \ **V4**: Maximum 3000 characters  \n  - **V4_5 & V4_5PLUS**: Maximum 5000 characters\
                    \  \n  - **V4_5ALL**: Maximum 5000 characters  \n  - **V5_5 & V5**: Maximum 5000 characters\
                    \  \n  Example: \"A calm and relaxing piano track with soft melodies\"  \n- In Non-custom\
                    \ Mode (`customMode: false`): Always required. The prompt serves as the core idea,\
                    \ and lyrics will be automatically generated based on it (not strictly matching the\
                    \ input). Maximum 500 characters.  \n  Example: \"A short relaxing piano tune\""
                  examples:
                  - A calm and relaxing piano track with soft melodies
                style:
                  type: string
                  description: "Music style specification for the generated audio.  \n- Required in Custom\
                    \ Mode (`customMode: true`). Defines the genre, mood, or artistic direction.  \n-\
                    \ Character limits by model:  \n  - **V4**: Maximum 200 characters  \n  - **V4_5 &\
                    \ V4_5PLUS**: Maximum 1000 characters  \n  - **V4_5ALL**: Maximum 1000 characters\
                    \  \n  - **V5_5 & V5**: Maximum 1000 characters  \n- Common examples: Jazz, Classical,\
                    \ Electronic, Pop, Rock, Hip-hop, etc."
                  examples:
                  - Classical
                title:
                  type: string
                  description: "Title for the generated music track.  \n- Required in Custom Mode (`customMode:\
                    \ true`).  \n- Max length: 80 characters.  \n- Will be displayed in player interfaces\
                    \ and filenames."
                  examples:
                  - Peaceful Piano Meditation
                customMode:
                  type: boolean
                  description: "Determines if advanced parameter customization is enabled.  \n- If `true`:\
                    \ Allows detailed control with specific requirements for `style` and `title` fields.\
                    \  \n- If `false`: Simplified mode where only `prompt` is required and other parameters\
                    \ are ignored."
                  examples:
                  - true
                instrumental:
                  type: boolean
                  description: "Determines if the audio should be instrumental (no lyrics).  \n- In Custom\
                    \ Mode (`customMode: true`):  \n  - If `true`: Only `style` and `title` are required.\
                    \  \n  - If `false`: `style`, `title`, and `prompt` are required (with prompt used\
                    \ as the exact lyrics).  \n- In Non-custom Mode (`customMode: false`): No impact on\
                    \ required fields (prompt only)."
                  examples:
                  - true
                model:
                  type: string
                  description: "The AI model version to use for generation.  \n- Required for all requests.\
                    \  \n- Available options:  \n  - **`V5_5`**：Custom Models Tailored to Your Unique\
                    \ Taste.  \n  - **`V5`**: Superior musical expression, faster generation.  \n  - **`V4_5PLUS`**:\
                    \ V4.5+ delivers richer sound, new ways to create, max 8 min.  \n  - **`V4_5`**: V4.5\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4_5ALL`**: V4.5ALL\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4`**: V4 improves\
                    \ vocal quality, max 4 min."
                  enum:
                  - V4
                  - V4_5
                  - V4_5PLUS
                  - V4_5ALL
                  - V5
                  - V5_5
                  examples:
                  - V4
                callBackUrl:
                  type: string
                  format: uri
                  description: 'The URL to receive music generation task completion updates. Required
                    for all music generation requests.


                    - System will POST task status and results to this URL when generation completes

                    - Callback process has three stages: `text` (text generation), `first` (first track
                    complete), `complete` (all tracks complete)

                    - Note: Some cases may skip `text` and `first` stages and return `complete` directly

                    - Your callback endpoint should accept POST requests with JSON payload containing
                    task results and audio URLs

                    - For detailed callback format and implementation guide, see [Music Generation Callbacks](https://docs.kie.ai/suno-api/generate-music-callbacks)

                    - Alternatively, use the Get Music Details endpoint to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - https://api.example.com/callback
                negativeTags:
                  type: string
                  description: Music styles or traits to exclude from the generated audio. Optional. Use
                    to avoid specific styles.
                  examples:
                  - Heavy Metal, Upbeat Drums
                vocalGender:
                  type: string
                  description: 'Vocal gender preference for the singing voice. Optional. Use ''m'' for
                    male and ''f'' for female. Note: This parameter is only effective when customMode
                    is true. Based on practice, this parameter can only increase the probability but cannot
                    guarantee adherence to male/female voice instructions.'
                  enum:
                  - m
                  - f
                  examples:
                  - m
                styleWeight:
                  type: number
                  description: Strength of adherence to the specified style. Optional. Range 0–1, up to
                    2 decimal places.
                  minimum: 0
                  maximum: 1
                  multipleOf: 0.01
                  examples:
                  - 0.65
                weirdnessConstraint:
                  type: number
                  description: Controls experimental/creative deviation. Optional. Range 0–1, up to 2
                    decimal places.
                  minimum: 0
                  maximum: 1
                  multipleOf: 0.01
                  examples:
                  - 0.65
                audioWeight:
                  type: number
                  description: Balance weight for audio features vs. other factors. Optional. Range 0–1,
                    up to 2 decimal places.
                  minimum: 0
                  maximum: 1
                  multipleOf: 0.01
                  examples:
                  - 0.65
                personaId:
                  type: string
                  description: "Only available when Custom Mode (`customMode: true`) is enabled. Persona\
                    \ ID or Voice ID to apply to the generated music. Optional. Use this to apply a specific\
                    \ persona style to your music generation. \n\nTo generate a persona ID, use the [Generate\
                    \ Persona](https://docs.kie.ai/suno-api/generate-persona) endpoint to create a personalized\
                    \ music Persona based on generated music.\n\nTo generate a Voice ID, use the [Generate\
                    \ Voice](https://docs.kie.ai/suno-api/suno-voice-generate)endpoint"
                  examples:
                  - persona_123
                personaModel:
                  type: string
                  enum:
                  - style_persona
                  - voice_persona
                  description: The persona model is only available for models version 5 and 5.5.
                duration:
                  type: number
                  default: 20
                  examples:
                  - 20
                  minimum: 10
                  maximum: 360
                  description: Audio duration. Optional; only effective when custom_mode is true and model
                    is V5_5.
            example:
              prompt: A calm and relaxing piano track with soft melodies
              customMode: true
              instrumental: true
              model: V4
              callBackUrl: https://api.example.com/callback
              style: Classical
              title: Peaceful Piano Meditation
              negativeTags: Heavy Metal, Upbeat Drums
              vocalGender: m
              styleWeight: 0.65
              weirdnessConstraint: 0.65
              audioWeight: 0.65
              personaId: persona_123
              personaModel: style_persona
              duration: 20
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 401
                      - 402
                      - 404
                      - 409
                      - 422
                      - 429
                      - 451
                      - 455
                      - 500
                      description: "Response Status Codes\n\n- **200**: Success - Request has been processed\
                        \ successfully  \n- **401**: Unauthorized - Authentication credentials are missing\
                        \ or invalid  \n- **402**: Insufficient Credits - Account does not have enough\
                        \ credits to perform the operation  \n- **404**: Not Found - The requested resource\
                        \ or endpoint does not exist  \n- **409**: Conflict - WAV record already exists\
                        \  \n- **422**: Validation Error - The request parameters failed validation checks\
                        \  \n- **429**: Rate Limited - Request limit has been exceeded for this resource\
                        \  \n- **451**: Unauthorized - Failed to fetch the image. Kindly verify any access\
                        \ limits set by you or your service provider  \n- **455**: Service Unavailable\
                        \ - System is currently undergoing maintenance  \n- **500**: Server Error - An\
                        \ unexpected error occurred while processing the request"
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        taskId:
                          type: string
                          description: Task ID for tracking task status. Use this ID with the "Get Music
                            Details" endpoint to query task details and results.
                          examples:
                          - 5c79****be8e
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response status code


                      - **200**: Success - Request has been processed successfully

                      - **401**: Unauthorized - Authentication credentials are missing or invalid

                      - **402**: Insufficient Credits - Account does not have enough credits to perform
                      the operation

                      - **404**: Not Found - The requested resource or endpoint does not exist

                      - **408**: Upstream is currently experiencing service issues. No result has been
                      returned for over 10 minutes.

                      - **422**: Validation Error - The request parameters failed validation checks

                      - **429**: Rate Limited - Request limit has been exceeded for this resource

                      - **455**: Service Unavailable - System is currently undergoing maintenance

                      - **500**: Server Error - An unexpected error occurred while processing the request

                      - **501**: Generation Failed - Content generation task failed

                      - **505**: Feature Disabled - The requested feature is currently disabled'
                  msg:
                    type: string
                    description: Response message, error description when failed
                  data:
                    type: object
                    properties: {}
                required:
                - code
                - msg
                - data
              example:
                code: 500
                msg: Server Error - An unexpected error occurred while processing the request
                data: null
          headers: {}
      callbacks:
        audioGenerated:
          '{request.body#/callBackUrl}':
            post:
              description: "System will call this callback when audio generation is complete.\n\n### Callback\
                \ Example\n```json\n{\n  \"code\": 200,\n  \"msg\": \"All generated successfully.\",\n\
                \  \"data\": {\n    \"callbackType\": \"complete\",\n    \"task_id\": \"2fac****9f72\"\
