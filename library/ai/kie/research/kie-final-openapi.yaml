        : {\n          \"location\": {\n            \"type\": \"string\",\n            \"description\"\
        : \"The city and state, e.g. San Francisco, CA\"\n          },\n          \"unit\": {\n      \
        \      \"type\": \"string\",\n            \"enum\": [\"celsius\", \"fahrenheit\"]\n          }\n\
        \        },\n        \"required\": [\"location\"]\n      }\n    }\n  },\n  {\n    \"type\": \"\
