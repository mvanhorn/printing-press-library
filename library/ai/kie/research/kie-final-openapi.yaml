        ## Time Range Instructions


        *   `infillStartS` must be less than `infillEndS`.

        *   Time values are precise to 2 decimal places, e.g., `10.50` seconds.

        *   The replacement time range must be between **6 and 60 seconds**.

        *   Replacement duration should not exceed **50%** of the original music''s total duration.


        ## Developer Notes


        *   Replacement segments will be regenerated based on the provided `prompt` and `tags`.

        *   Generated replacement segments will automatically blend with the original music''s preceding
        and following parts.

        *   Generated files will be retained for **14 days**.

        *   Query task status using the same interface as generating music: [Get Music Details](/suno-api/get-music-details).'
      operationId: replace-section
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prompt
              - tags
              - title
              - infillStartS
              - infillEndS
              - fullLyrics
              oneOf:
              - title: Replace section using existing audio
                required:
                - taskId
                - audioId
                not:
                  anyOf:
                  - required:
                    - uploadUrl
                  - required:
                    - model
                properties:
                  taskId:
                    type: string
                    description: Original task ID (parent task), used to identify the source music for
                      section replacement.
                    examples:
                    - 2fac****9f72
                  audioId:
                    type: string
                    description: Unique identifier of the audio track to replace. This ID is returned
                      in the callback data after music generation completes.
                    examples:
                    - e231****-****-****-****-****8cadc7dc
                type: object
              - title: Replace section using uploaded custom audio
                required:
                - uploadUrl
                - model
                not:
                  anyOf:
                  - required:
                    - taskId
                  - required:
                    - audioId
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                    description: URL of the custom audio uploaded by the user.
                    examples:
                    - https://example.com/audio.mp3
                  model:
                    type: string
                    description: "AI model version used for generation. \n- Available options:\n  - **`V5_5`**:\
                      \ A tailor-made exclusive model that fits your unique taste.  \n  - **`V5`**: Better\
                      \ musical expressiveness with faster generation speed.  \n  - **`V4_5PLUS`**: V4.5+\
                      \ with richer timbre, new creative methods, up to 8 minutes.  \n  - **`V4_5`**:\
                      \ V4.5 with smarter prompts, faster generation speed, up to 8 minutes.  \n  - **`V4_5ALL`**:\
                      \ V4.5ALL with smarter prompts, faster generation speed, up to 8 minutes.  \n  -\
                      \ **`V4`**: V4 with improved vocal quality, up to 4 minutes."
                    enum:
                    - V4
                    - V4_5
                    - V4_5PLUS
                    - V4_5ALL
                    - V5
                    - V5_5
                    examples:
                    - V4
                type: object
              properties:
                prompt:
                  type: string
                  description: Replaced lyrics
                  examples:
                  - A calm and relaxing piano track.
                tags:
                  type: string
                  description: Music style tags, such as jazz, electronic, etc.
                  examples:
                  - Jazz
                title:
                  type: string
                  description: Music title
                  examples:
                  - Relaxing Piano
                negativeTags:
                  type: string
                  description: Excluded music styles, used to avoid specific style elements in the replacement
                    segment
                  examples:
                  - Rock
                infillStartS:
                  type: number
                  description: Start time point for replacement (seconds), 2 decimal places. Must be less
                    than infillEndS. The time interval (infillEndS - infillStartS) must be between 6 and
                    60 seconds.
                  minimum: 0
                  examples:
                  - 10.5
                infillEndS:
                  type: number
                  description: End time point for replacement (seconds), 2 decimal places. Must be greater
                    than infillStartS. The time interval (infillEndS - infillStartS) must be between 6
                    and 60 seconds.
                  minimum: 0
                  examples:
                  - 20.75
                fullLyrics:
                  type: string
                  description: Complete lyrics after modification, combining both modified and unmodified
                    lyrics. This parameter contains the full lyrics text that will be used for the entire
                    song after the section replacement.
                  examples:
                  - '[Verse 1]

                    Original lyrics here

                    [Chorus]

                    Modified lyrics for this section

                    [Verse 2]

                    More original lyrics'
                callBackUrl:
                  type: string
                  format: uri
                  description: 'Callback URL for task completion. The system will send a POST request
                    to this URL when replacement is complete, containing task status and results.


                    - Your callback endpoint should be able to accept POST requests containing JSON payloads
                    with replacement results

                    - For detailed callback format and implementation guide, see [Replace Music Section
                    Callbacks](https://docs.kie.ai/suno-api/replace-section-callbacks)

                    - Alternatively, you can use the get music details interface to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - https://example.com/callback
            example:
              taskId: 2fac****9f72
              audioId: e231****-****-****-****-****8cadc7dc
              prompt: A calm and relaxing piano track.
              tags: Jazz
              title: Relaxing Piano
              negativeTags: Rock
              infillStartS: 10.5
              infillEndS: 20.75
              fullLyrics: '[Verse 1]

                Original lyrics here

                [Chorus]

                Modified lyrics for this section

                [Verse 2]

                More original lyrics'
              callBackUrl: https://example.com/callback
      responses:
