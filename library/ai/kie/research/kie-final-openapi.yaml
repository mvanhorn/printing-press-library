        \ (string): Description of the parameter's purpose and format. Provide examples and constraints\
        \ (e.g., \"City and state, e.g. 'San Francisco, CA' or a postal code like '95616'.\").\n    -\
        \ **`enum`** (array, optional): If parameter values come from a fixed set, use `enum` to list\
        \ allowed values rather than just describing them in the description. This helps improve accuracy\
        \ (e.g., `\"enum\": [\"daylight\", \"cool\", \"warm\"]`).\n  - **`required`** (array): An array\
        \ of strings listing the parameter names required for the function to run.\n</Accordion>\n</AccordionGroup>\n\
        \n## Response Format Parameter\n\nThe `response_format` parameter is an optional JSON Schema object\
        \ that defines the structure of the response. When provided, the model will generate responses\
        \ that conform to this schema.\n\n<div style=\"padding: 20px; background-color: rgba(255, 87,\
