                        examples:
                        - 50
                      total_tokens:
                        type: integer
                        description: Total number of tokens
                        examples:
                        - 60
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
          headers: {}
        '400':
          description: Bad Request - Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
