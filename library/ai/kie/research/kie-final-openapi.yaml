      summary: Extend AI Video
      deprecated: false
      description: "Extend existing AI-generated videos to create longer sequences.\n\n### Usage Guide\n\
        - Add additional segments to your AI-generated videos\n- Maintain visual consistency while extending\
        \ narratives\n- Create longer sequences for storytelling or demonstrations\n\n### Parameter Details\n\
        - `taskId` identifies the original video to extend\n- `prompt` guides how the video should continue\n\
        - `quality` video resolution, optional values are 720p or 1080p. \n- `waterMark` video watermark\
        \ text content, empty string means no watermark\n\n### Developer Notes\n- Extended videos are\
        \ stored for 14 days before automatic deletion\n- Extension maintains the same aspect ratio as\
        \ the original video\n- Extension works best when continuing the same subject/theme as the original\
        \ video"
      operationId: extend-ai-video
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - taskId
              - prompt
              - quality
              properties:
                taskId:
                  type: string
                  description: Unique identifier of the original video generation task. Must be a valid
                    task ID from a previously generated video.
                  examples:
                  - ee603959-debb-48d1-98c4-a6d1c717eba6
                prompt:
                  type: string
                  description: Descriptive text that guides the continuation of the video. Explain what
                    actions, movements, or developments should happen next. Be specific but maintain consistency
                    with the original video content.
                  examples:
                  - The cat continues dancing with more energy and excitement, spinning around with colorful
                    light effects intensifying
                quality:
                  type: string
                  description: Video resolution, optional values are 720p or 1080p.
                  examples:
                  - 720p
                waterMark:
                  type: string
