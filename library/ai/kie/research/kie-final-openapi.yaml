  /api/v1/generate/upload-extend:
    post:
      summary: Upload And Extend Audio
      deprecated: false
      description: '# Upload and Extend Music


        This API extends audio while preserving the original style, generating a longer and seamless audio
        track.


        ## Parameter Usage Guide


        :::note Character Limits

        Character limits vary by model version:


        - **Models V5\_5 and V5**: style (maximum 1,000 characters), title (maximum 100 characters), prompt
        (maximum 5,000 characters)

        - **Models V4\_5PLUS and V4\_5**: style (maximum 1,000 characters), title (maximum 100 characters),
        prompt (maximum 5,000 characters)

        - **Model V4\_5ALL**: style (maximum 1,000 characters), title (maximum 80 characters), prompt
        (maximum 5,000 characters)

        - **Model V4**: style (maximum 200 characters), title (maximum 80 characters), prompt (maximum
        3,000 characters)


        ### When `defaultParamFlag` is `true` (Custom Parameter Mode):


        - `instrumental: true`: Provide `style`, `title`, and `uploadUrl`. `prompt` and `vocalGender`
        are not required

        - `instrumental: false`: Provide `style`, `title`, and `uploadUrl`. `prompt` is optional and will
        be used as a prompt if provided. `vocalGender` is not required

        - `continueAt`: The point in seconds where the audio extension begins. It must be greater than
        0 and less than the total duration of the uploaded audio

        - `uploadUrl`: The URL of the audio file. The audio must not exceed 8 minutes

        - Character limits vary by model version. See the details above


        ### When `defaultParamFlag` is `false` (Non-Custom Parameter Mode):


        - Regardless of the `instrumental` setting, only `uploadUrl` is required

        - `prompt` is optional and will be used as a prompt if provided

        - When `instrumental` is `true`, `prompt` and `vocalGender` are not required

        - When `instrumental` is `false` and `prompt` is not provided, lyrics will be generated automatically

        - Other parameters will use the parameters of the original audio


        ## Developer Notes


        1. Generated files will be retained for **14 days**.

        2. The model version must match the source music.

        3. This feature is suitable for extending existing music.

        4. Please provide a valid audio URL for `uploadUrl`.


        ## Optional Parameters


        | Parameter | Type | Description |

        | :--- | :--- | :--- |

        | `prompt` | `string` | Describes how the music should be extended. Optional. If provided, it
        will be used as a prompt. Not required when `instrumental` is `true`. |

        | `vocalGender` | `string` | Vocal gender preference. `m` represents male vocals and `f` represents
        female vocals. Not required for this API. |

        | `styleWeight` | `number` | Controls adherence to the specified style. Range: 0–1, with up to
        two decimal places. Example: `0.65`. |

        | `weirdnessConstraint` | `number` | Controls the level of creativity. Range: 0–1, with up to
        two decimal places. Example: `0.65`. |

        | `audioWeight` | `number` | Controls the weight of audio elements. Range: 0–1, with up to two
        decimal places. Example: `0.65`. |

        | `personaId` | `string` | Available only when `defaultParamFlag` is `true`. To generate a personaId,
        visit [Generate Persona](/cn/suno-api/generate-persona). |'
      operationId: upload-and-extend-audio
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - uploadUrl
              - defaultParamFlag
              - continueAt
              - model
              - callBackUrl
              properties:
                uploadUrl:
                  type: string
                  format: uri
                  description: The URL for uploading audio files, required regardless of whether defaultParamFlag
                    is true or false. Ensure the uploaded audio does not exceed 8 minutes in length.
                  examples:
                  - https://storage.example.com/upload
                defaultParamFlag:
                  type: boolean
                  description: "Enable custom mode for advanced audio generation settings.  \n- Set to\
                    \ `true` to use custom parameter mode (requires `style`, `title`, and `uploadUrl`;\
                    \ if `instrumental` is `false`, `uploadUrl` and `prompt` are required). If `instrumental`\
                    \ is `false`, the prompt will be strictly used as lyrics.  \n- Set to `false` to use\
                    \ non-custom mode (only `uploadUrl` required). Lyrics will be automatically generated\
                    \ based on the prompt."
                  examples:
                  - true
                instrumental:
                  type: boolean
                  description: "Determines whether the audio is instrumental (without lyrics).\n- In custom\
                    \ parameter mode (`defaultParamFlag: true`):\n- If `true`: Only `style`, `title`,\
                    \ and `uploadUrl` are required; `prompt` and `vocalGender` do not need to be specified.\
                    \ \n- If `false`: `style`, `title`, and `uploadUrl` are required; `prompt` is optional\
                    \ (if provided, it serves as a prompt); `vocalGender` does not need to be specified.\n\
                    - In non-custom parameter mode (`defaultParamFlag: false`): Does not affect mandatory\
                    \ fields (only `uploadUrl` is required); `prompt` is optional. If set to `false`,\
                    \ lyrics will be automatically generated.\nOptional; defaults to `false`."
                  examples:
                  - true
                  default: false
                prompt:
                  type: string
                  description: 'Describe how the music should be extended. Optional; if provided, it will
                    be used as a prompt. Subject to model character limits:

                    - **V5_5 & V5**: Max 5,000 characters

                    - **V4_5PLUS & V4_5**: Max 5,000 characters

                    - **V4_5ALL**: Max 5,000 characters

                    - **V4**: Max 3,000 characters'
                  examples:
                  - Extend the music with more relaxing notes
                style:
                  type: string
                  description: "Music style, e.g., Jazz, Classical, Electronic. Character limits by model:\
                    \  \n- **V5_5 & V5**: Maximum 1000 characters  \n- **V4_5PLUS & V4_5**: Maximum 1000\
                    \ characters  \n- **V4_5ALL**: Maximum 1000 characters  \n- **V4**: Maximum 200 characters"
                  examples:
                  - Classical
                title:
                  type: string
                  description: "Music title. Character limits by model:  \n- **V5_5 & V5**: Maximum 100\
                    \ characters  \n- **V4_5PLUS & V4_5**: Maximum 100 characters  \n- **V4_5ALL**: Maximum\
                    \ 80 characters  \n- **V4**: Maximum 80 characters"
                  examples:
                  - Peaceful Piano Extended
                continueAt:
                  type: number
                  description: "The time point (in seconds) from which to start extending the music. \
                    \ \n- Required when `defaultParamFlag` is `true`.  \n- Value range: greater than 0\
                    \ and less than the total duration of the uploaded audio.  \n- Specifies the position\
                    \ in the original track where the extension should begin."
                  examples:
