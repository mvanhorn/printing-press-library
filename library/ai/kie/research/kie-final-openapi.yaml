        \ Video/Audio/PDF/Image:</span><br>\n    { \"type\": \"image_url\", \"image_url\": { \"url\":\
        \ \"https://...\" } }\n  </div>\n</div>\n\n## Tools Parameter\n\nThe `tools` parameter is an optional\
        \ array that allows you to define functions the model can call. The array can contain multiple\
        \ objects. When using function calling, you can define multiple functions in the array.\n\n<AccordionGroup>\n\
        <Accordion title=\"Google Search\">\nUse this format to enable Google Search grounding:\n\n```json\n\
        {\n  \"type\": \"function\",\n  \"function\": {\n    \"name\": \"googleSearch\"\n  }\n}\n```\n\
        \nThis enables real-time information retrieval via Google Search.\n</Accordion>\n</AccordionGroup>"
