  /api/v1/responses:
    post:
      summary: GPT Codex
      deprecated: false
      description: "GPT Codex API is a multimodal chat-completions style endpoint that accepts structured\
        \ input arrays, supports adjustable reasoning effort, and integrates web search or function calling\
        \ tools.\n\n<CardGroup cols={2}>\n  <Card title=\"Multimodal Input\" icon=\"\U0001F5BC️\">\n \
        \   Supports mixed text, image, and file inputs in a single message.\n  </Card>\n\n  <Card title=\"\
        Reasoning Control\" icon=\"\U0001F9E0\">\n    Adjustable reasoning effort from low to xhigh.\n\
        \  </Card>\n\n  <Card title=\"Tools & Web Search\" icon=\"✨\">\n    Integrates web search or custom\
        \ function calling tools.\n  </Card>\n\n  <Card title=\"Unified Endpoint\" icon=\"\U0001F4BB\"\
        >\n    Uses the unified <code>/api/v1/responses</code> endpoint with <code>model</code> set to\
        \ one of <code>gpt-5-codex</code>, <code>gpt-5.1-codex</code>, <code>gpt-5.2-codex</code>, <code>gpt-5.3-codex</code>,\
        \ <code>gpt-5.4-codex</code>.\n  </Card>\n</CardGroup>\n\n## Tools & tool\\_choice\n\nThe `tools`\
        \ array enables **web search** or **function calling** capabilities.\n\nWeb Search and Function\
        \ Calling are **mutually exclusive**.  \nIn a single request you should choose only one: do not\
        \ include both `{\"type\": \"web_search\"}` and `{\"type\": \"function\", ...}` in the same `tools`\
        \ array.\n\n<AccordionGroup>\n  <Accordion title=\"Web Search\">\n    Use the built-in Web Search\
        \ tool to retrieve up-to-date information:\n\n    ```json\n    {\n      \"tools\": [\n       \
        \ {\n          \"type\": \"web_search\"\n        }\n      ]\n    }\n    ```\n  </Accordion>\n\n\
        \  <Accordion title=\"Function Calling\">\n    Define business functions that the model can call\
        \ when needed:\n\n    ```json\n    {\n      \"tools\": [\n        {\n          \"type\": \"function\"\
        ,\n          \"name\": \"get_current_weather\",\n          \"description\": \"Get the current\
        \ weather in a given location\",\n          \"parameters\": {\n            \"type\": \"object\"\
        ,\n            \"properties\": {\n              \"location\": {\n                \"type\": \"\
        string\",\n                \"description\": \"The city and state, e.g. San Francisco, CA\"\n \
        \             },\n              \"unit\": {\n                \"type\": \"string\",\n         \
        \       \"enum\": [\"celsius\", \"fahrenheit\"]\n              }\n            },\n           \
        \ \"required\": [\"location\", \"unit\"]\n          }\n        }\n      ],\n      \"tool_choice\"\
        : \"auto\"\n    }\n    ```\n\n    When function tools are configured in `tools`, set `tool_choice`\
        \ to `\"auto\"` so the model can decide when to call them.  \n    If you do not configure any\
        \ function tools, omit the `tool_choice` field.\n  </Accordion>\n</AccordionGroup>"
      operationId: gpt-codex-responses
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: 'Target model name. Allowed values: `gpt-5-codex`, `gpt-5.1-codex`, `gpt-5.2-codex`,
                    `gpt-5.3-codex`、`gpt-5.4-codex`.'
                  enum:
                  - gpt-5-codex
                  - gpt-5.1-codex
                  - gpt-5.2-codex
                  - gpt-5.3-codex
                  - gpt-5.4-codex
                  examples:
                  - gpt-5.1-codex
                stream:
                  type: boolean
                  description: When true, responses stream in real time as server-sent events. When false,
                    the full response is returned at once after completion. Default is true.
                  default: false
                input:
                  oneOf:
                  - type: string
                    description: Input can be a string.
                  - type: array
                    description: Input can be an array; each element is a message object with role and
                      content.
                    items:
                      type: object
                      properties: {}
                    minItems: 1
                reasoning:
                  type: object
                  description: Reasoning configuration for the model.
                  properties:
                    effort:
                      type: string
                      description: Reasoning effort level. Higher values provide more thorough reasoning
                        but may increase latency. Defaults to "low".
                      enum:
                      - low
                      - medium
                      - high
                      - xhigh
                      default: low
                      examples:
                      - low
                tools:
                  type: array
                  description: Optional tools that the model may call. Either web search OR function calling
                    should be configured, but not both simultaneously.
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/ToolWebSearch'
                    - $ref: '#/components/schemas/ToolFunction'
                tool_choice:
                  type: string
                  description: Tool selection behavior. When function tools are configured in `tools`,
                    set this to `auto` so the model can decide when to call them.
                  examples:
                  - auto
              required:
              - model
              - input
              examples:
              - model: gpt-5.1-codex
                input:
                - role: user
                  content:
                  - type: input_text
                    text: What is in this image?
                  - type: input_image
                    image_url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
                tools:
                - type: web_search
                reasoning:
                  effort: high
            example:
              model: gpt-5.1-codex
              stream: false
              input:
              - role: user
                content:
                - type: input_text
                  text: What is in this image?
                - type: input_image
                  image_url: https://file.aiquickdraw.com/custom-page/akr/section-images/1759055072437dqlsclj2.png
              tools:
              - type: web_search
              reasoning:
                effort: high
      responses:
        '200':
          description: Request successful.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Streaming responses are sent as Server-Sent Events (SSE) with `Content-Type:\
                  \ text/event-stream`.\n\n**Standard output**\n\n- **Text delta event**: `event: response.output_text.delta`\n\
                  \  - `data.delta`: The incremental text content in the stream\n  - `data.type`: Event\
                  \ type, always `response.output_text.delta`\n- **Completion event**: `event: response.completed`\n\
                  \  - `data.response.usage`: Token usage information, such as `input_tokens` and `output_tokens`\n\
                  \n**Function Calling**\n\n- **Function call arguments delta event**: `event: response.function_call_arguments.delta`\n\
                  \  - `data.delta`: Incremental string content of the function call arguments\n  - `data.type`:\
                  \ Event type, always `response.function_call_arguments.delta`\n- **Completion event**:\
                  \ `event: response.completed`\n  - `data.response.usage`: Token usage information, such\
                  \ as `input_tokens` and `output_tokens`\n\nThe final line `data: [DONE]` is the stream\
                  \ end marker, indicating that no more events will be sent."
              example: "{\n  \"output\": [\n    {\n      \"type\": \"reasoning\",\n      \"id\": \"rs_xxx\"\
                ,\n      \"summary\": []\n    },\n    {\n      \"type\": \"message\",\n      \"role\"\
                : \"assistant\",\n      \"id\": \"msg_xxx\",\n      \"content\": [\n        {\n      \
                \    \"type\": \"output_text\",\n          \"text\": \"Hello! How can I help you today?\"\
                \n        }\n      ],\n      \"status\": \"completed\"\n    }\n  ],\n  \"usage\": {\n\
                \    \"total_tokens\": 4490,\n    \"output_tokens\": 47,\n    \"input_tokens\": 4443\n\
                \  },\n  \"credits_consumed\": 0.48,\n  \"status\": \"completed\"\n}"
          headers: {}
        '400':
          description: Bad Request - Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Invalid request parameters
                      type:
                        type: string
                        examples:
                        - invalid_request_error
          headers: {}
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Unauthorized
                      type:
                        type: string
                        examples:
                        - authentication_error
          headers: {}
        '429':
          description: Rate Limited - Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                        - Rate limit exceeded
                      type:
                        type: string
                        examples:
                        - rate_limit_error
          headers: {}
        '500':
          description: 请求失败
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
