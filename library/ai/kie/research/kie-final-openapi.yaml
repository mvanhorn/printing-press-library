  /api/v1/generate/extend:
    post:
      summary: Extend Music
      deprecated: false
      description: "Extend or modify existing music by creating a continuation based on a source audio\
        \ track.\n\n### Usage Guide\n- This endpoint allows you to extend existing music tracks\n- You\
        \ can choose to use original parameters or set new custom parameters\n- Extended music will maintain\
        \ style consistency with the source track\n\n### Parameter Details\n- With Custom Parameters (`defaultParamFlag:\
        \ true`):\n  - `prompt`, `style`, `title` and `continueAt` are required\n  - Character limits\
        \ vary by model:\n    - **V4**: `prompt` 3000 characters, `style` 200 characters, `title` 80 characters\n\
        \    - **V4_5 & V4_5PLUS**: `prompt` 5000 characters, `style` 1000 characters, `title` 100 characters\n\
        \    - **V4_5ALL**: `prompt` 5000 characters, `style` 1000 characters, `title` 80 characters\n\
        \    - **V5_5 & V5**: `prompt` 5000 characters, `style` 1000 characters, `title` 100 characters\n\
        \n- With Original Parameters (`defaultParamFlag: false`):\n  - Only `audioId` is required\n  -\
        \ Other parameters will be inherited from the source audio\n\n### Developer Notes\n- Generated\
        \ files are retained for 14 days\n- Model version must match the source audio's model version\n\
        - Callback process follows the same pattern as the music generation endpoint"
      operationId: extend-music
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - defaultParamFlag
              - audioId
              - model
              - callBackUrl
              properties:
                defaultParamFlag:
                  type: boolean
                  description: "Controls parameter source for extension.  \n- If `true`: Use custom parameters\
                    \ specified in this request. Requires `continueAt`, `prompt`, `style`, and `title`.\
                    \  \n- If `false`: Use original audio parameters. Only `audioId` is required, other\
                    \ parameters are inherited."
                  examples:
                  - true
                audioId:
                  type: string
                  description: Unique identifier of the audio track to extend. Required for all extension
                    requests.
                  examples:
                  - e231****-****-****-****-****8cadc7dc
                prompt:
                  type: string
                  description: 'Prompt describing the desired audio extension content.

                    - Required when `defaultParamFlag` is `true` (this parameter is not needed if `instrumental`
                    is `true`).

                    - Character limits by model:

                    - **V4**: Max 3,000 characters

                    - **V4_5 and V4_5PLUS**: Max 5,000 characters

                    - **V4_5ALL**: Max 5,000 characters

                    - **V5_5 and V5**: Max 5,000 characters

                    - Describe how the music should continue or evolve in the extended section.'
                  examples:
                  - Extend the music with more relaxing notes and a gentle bridge section
                style:
                  type: string
                  description: "Music style specification for the extended audio.  \n- Required when `defaultParamFlag`\
                    \ is `true`.  \n- Character limits by model:  \n  - **V4**: Maximum 200 characters\
                    \  \n  - **V4_5 & V4_5PLUS**: Maximum 1000 characters  \n  - **V4_5ALL**: Maximum\
                    \ 1000 characters  \n  - **V5_5 & V5**: Maximum 1000 characters  \n- Should typically\
                    \ align with the original audio's style for best results."
                  examples:
                  - Classical
                title:
                  type: string
                  description: "Title for the extended music track.  \n- Required when `defaultParamFlag`\
                    \ is `true`.  \n- Character limits by model:  \n  - **V4**: Maximum 80 characters\
                    \  \n  - **V4_5 & V4_5PLUS**: Maximum 100 characters  \n  - **V4_5ALL**: Maximum 80\
                    \ characters  \n  - **V5_5 & V5**: Maximum 100 characters  \n- Will be displayed in\
                    \ player interfaces and filenames."
                  examples:
                  - Peaceful Piano Extended
                continueAt:
                  type: number
                  description: "The time point (in seconds) from which to start extending the music. \
                    \ \n- Required when `defaultParamFlag` is `true`.  \n- Value range: greater than 0\
                    \ and less than the total duration of the generated audio.  \n- Specifies the position\
                    \ in the original track where the extension should begin."
                  examples:
                  - 60
                model:
                  type: string
                  description: "The AI model version to use for generation.  \n- Required for all requests.\
                    \  \n- Available options:  \n  - **`V5_5`**：Custom Models Tailored to Your Unique\
                    \ Taste.  \n  - **`V5`**: Superior musical expression, faster generation.  \n  - **`V4_5PLUS`**:\
                    \ V4.5+ delivers richer sound, new ways to create, max 8 min.  \n  - **`V4_5`**: V4.5\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4_5ALL`**: V4.5ALL\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4`**: V4 improves\
                    \ vocal quality, max 4 min."
                  enum:
                  - V4
                  - V4_5
                  - V4_5PLUS
                  - V4_5ALL
                  - V5
                  - V5_5
                  examples:
                  - V4
                callBackUrl:
                  type: string
                  format: uri
                  description: 'The URL to receive music extension task completion updates. Required for
