                                    type: string
                                    description: file mime type
                                  file_uri:
                                    type: string
                    required:
                    - role
                    - parts
                  minItems: 1
                tools:
                  type: array
                  description: Optional Gemini tools. Supports googleSearch and functionDeclarations.
                  items:
                    oneOf:
                    - type: object
                      properties:
                        googleSearch:
                          type: object
                          description: Google Search grounding tool.
                          additionalProperties: false
                    - type: object
                      properties:
                        functionDeclarations:
                          type: array
                          description: Function declaration list.
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Function name.
                                examples:
                                - get_weather_forecast
                              description:
                                type: string
                                description: Function description.
                                examples:
                                - Get the weather forecast for a given location
                              parameters:
                                type: object
                                description: Function parameter schema.
                                properties:
                                  type:
                                    type: string
                                    examples:
                                    - OBJECT
                                  properties:
                                    type: object
                                    additionalProperties: true
                                  required:
                                    type: array
                                    items:
                                      type: string
                                examples:
                                - type: OBJECT
                                  properties:
                                    location:
                                      type: STRING
                                      description: The city name, e.g. Beijing
                                  required:
                                  - location
                            required:
                            - name
                            - description
                            - parameters
                generationConfig:
                  type: object
                  description: Generation configuration.
                  properties:
                    thinkingConfig:
                      type: object
                      description: Thinking configuration.
                      properties:
                        includeThoughts:
                          type: boolean
                          description: Whether to include thought output.
                          examples:
                          - true
                        thinkingLevel:
                          type: string
                          enum:
                          - low
                          - high
                          description: Thinking level.
                          examples:
                          - high
                stream:
                  type: boolean
                  description: If set to true, the provider returns stream chunks.
