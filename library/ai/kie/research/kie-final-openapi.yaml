  /api/v1/veo/generate:
    post:
      summary: Generate Veo3.1 Video
      deprecated: false
      description: '### Veo 3.1 Generation API


        Our **Veo 3.1 Generation API** is more than a direct wrapper around Google''s baseline. It layers
        extensive optimisation and reliability tooling on top of the official models, giving you greater
        flexibility and markedly higher success rates — **25% of the official Google pricing** (see [kie.ai/pricing](https://kie.ai/pricing)
        for full details).


        | Capability | Details |

        | :------------------- | :------ |

        | **Models** | • **Veo 3.1 Quality** — flagship model, highest fidelity• **Veo 3.1 Fast** — cost-efficient
        variant that still delivers strong visual results• **Veo 3.1 Lite** — most cost-effective model
        for high-volume generation |

        | **Tasks** | • **Text → Video**• **Image → Video** (single reference frame or first and last
        frames)• **Material → Video** (based on material images) |

        | **Generation Modes** | • **TEXT\_2\_VIDEO** — Text-to-video: using text prompts only• **FIRST\_AND\_LAST\_FRAMES\_2\_VIDEO**
        — First and last frames to video: generate transition videos using one or two images• **REFERENCE\_2\_VIDEO**
        — Material-to-video: based on material images (**Fast model** and **Lite model**, supports **16:9
        & 9:16**) |

        | **Aspect Ratios** | Supports both native **16:9** and **9:16** outputs. **Auto** mode lets the
        system decide aspect ratio based on input materials and internal strategy (for production control,
        we recommend explicitly setting `aspect_ratio`). |

        | **Output Quality** | Both **16:9** and **9:16** support **1080P** and **4K** outputs. **4K requires
        extra credits** (approximately **2× the credits of generating a Fast mode video**)|

        | **Audio Track** | All videos ship with background audio by default. In rare cases, upstream
        may suppress audio when the scene is deemed sensitive (e.g. minors). |


        ### Why our Veo 3.1 API is different


        1. **True vertical video** – Native Veo 3.1 supports **9:16** output, delivering authentic vertical
        videos without the need for re-framing or manual editing.

        2. **Global language reach** – Our flow supports multilingual prompts by default (no extra configuration
        required).

        3. **Significant cost savings** – Our rates are 25% of Google''s direct API pricing.'
      operationId: generate-veo3-1-video
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: 'Text prompt describing the desired video content. Required for all generation
                    modes.


                    - Should be detailed and specific in describing video content

                    - Can include actions, scenes, style and other information

                    - For image-to-video, describe how you want the image to come alive'
                  examples:
                  - A dog playing in a park
                imageUrls:
                  type: array
                  items:
                    type: string
                  description: 'Image URL list (used in image-to-video mode). Supports 1 or 2 images:


                    - **1 image**: The generated video will unfold around this image, with the image content
                    presented dynamically

                    - **2 images**: The first image serves as the video''s first frame, and the second
                    image serves as the video''s last frame, with the video transitioning between them

                    - Must be valid image URLs

                    - Images must be accessible to the API server.'
                  examples:
                  - - http://example.com/image1.jpg
                    - http://example.com/image2.jpg
                model:
                  type: string
                  description: 'Select the model type to use.


                    - veo3: Veo 3.1 Quality, supports both text-to-video and image-to-video generation

                    - veo3_fast: Veo3.1 Fast generation model, supports both text-to-video、image-to-video
                    and materials-to-video generation

                    - veo3_lite: Veo3.1 Lite generation model, supports both text-to-video、image-to-video
                    and materials-to-video generation'
                  enum:
                  - veo3
                  - veo3_fast
                  - veo3_lite
                  default: veo3_fast
                  examples:
                  - veo3_fast
                generationType:
                  type: string
                  description: "Video generation mode (optional). Specifies different video generation\
                    \ approaches:\n\n- **TEXT_2_VIDEO**: Text-to-video - Generate videos using only text\
                    \ prompts\n- **FIRST_AND_LAST_FRAMES_2_VIDEO**: First and last frames to video - Flexible\
                    \ image-to-video generation mode\n  - 1 image: Generate video based on the provided\
                    \ image\n  - 2 images: First image as first frame, second image as last frame, generating\
                    \ transition video\n- **REFERENCE_2_VIDEO**: Reference-to-video - Generate videos\
                    \ based on reference images, requires 1-3 images in imageUrls (minimum 1, maximum\
                    \ 3)\n\n**Important Notes**:\n- REFERENCE_2_VIDEO mode currently supports the veo3_fast\
                    \ and veo3_lite models.\n- If not specified, the system will automatically determine\
                    \ the generation mode based on whether imageUrls are provided"
                  enum:
                  - TEXT_2_VIDEO
                  - FIRST_AND_LAST_FRAMES_2_VIDEO
                  - REFERENCE_2_VIDEO
                  examples:
                  - TEXT_2_VIDEO
                aspect_ratio:
                  type: string
                  description: "Video aspect ratio. Specifies the dimension ratio of the generated video.\
                    \ Available options:\n\n- 16:9: Landscape video format. \n- 9:16: Portrait video format,\
                    \ suitable for mobile short videos\n- Auto: In auto mode, the video will be automatically\
                    \ center-cropped based on whether your uploaded image is closer to 16:9 or 9:16.\n\
                    \nDefault value is 16:9."
                  enum:
                  - '16:9'
                  - '9:16'
                  - Auto
                  default: '16:9'
                  examples:
                  - '16:9'
                callBackUrl:
                  type: string
                  description: 'Completion callback URL for receiving video generation status updates.


                    - Optional but recommended for production use

                    - System will POST task completion status to this URL when the video generation is
                    completed

                    - Callback will include task results, video URLs, and status information

                    - Your callback endpoint should accept POST requests with JSON payload

                    - For detailed callback format and implementation guide, see [Callback Documentation](https://docs.kie.ai/veo3-api/generate-veo-3-video-callbacks)

                    - Alternatively, use the Get Video Details endpoint to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - http://your-callback-url.com/complete
                enableFallback:
                  type: boolean
                  description: "Deprecated Enable fallback functionality. When set to true, if the official\
                    \ Veo3.1 video generation service is unavailable or encounters exceptions, the system\
                    \ will automatically switch to a backup model for video generation to ensure task\
                    \ continuity and reliability. Default value is false.\n\n- When fallback is enabled,\
                    \ backup model will be used for the following errors:\n  - public error minor upload\n\
                    \  - Your prompt was flagged by Website as violating content policies\n  - public\
                    \ error prominent people upload\n- Fallback mode requires 16:9 aspect ratio and uses\
                    \ 1080p resolution by default\n- **Note**: Videos generated through fallback mode\
                    \ cannot be accessed via the Get 1080P Video endpoint\n- **Credit Consumption**: Successful\
                    \ fallback has different credit consumption, please see https://kie.ai/pricing for\
                    \ pricing details\n\n**Note: This parameter is deprecated. Please remove this parameter\
                    \ from your requests. The system has automatically optimized the content review mechanism\
                    \ without requiring manual fallback configuration.**"
                  default: false
                  deprecated: true
                  examples:
                  - false
                enableTranslation:
                  type: boolean
                  description: 'Enable prompt translation to English. When set to true, the system will
                    automatically translate prompts to English before video generation for better generation
                    results. Default value is true.


                    - true: Enable translation, prompts will be automatically translated to English

                    - false: Disable translation, use original prompts directly for generation'
                  default: false
                  examples:
                  - true
                watermark:
                  type: string
                  description: 'Watermark text.


                    - Optional parameter

                    - If provided, a watermark will be added to the generated video'
                  examples:
                  - MyBrand
                resolution:
                  type: string
                  enum:
                  - 720p
                  - 1080p
                  - 4k
                  default: 720p
                  description: Controls the pixel dimensions of the generated image. Higher resolution
                    results in greater clarity and detail, while lower resolution allows for faster generation.
                duration:
                  type: integer
                  description: 'The duration of the generated video, in seconds. Optional values are 4,
                    6, 8.

                    **Important Note**:

                    - The REFERENCE_2_VIDEO mode currently only supports a duration of 8 seconds.'
                  enum:
                  - 4
                  - 6
                  - 8
                  examples:
                  - 8
                  default: 8
              required:
              - prompt
              examples:
              - prompt: A dog playing in a park
                imageUrls:
                - http://example.com/image1.jpg
                - http://example.com/image2.jpg
                model: veo3_fast
                watermark: MyBrand
                callBackUrl: http://your-callback-url.com/complete
                aspect_ratio: '16:9'
                seeds: 12345
                enableFallback: false
                enableTranslation: true
                generationType: REFERENCE_2_VIDEO
            example:
              prompt: A dog playing in a park
              imageUrls:
              - http://example.com/image1.jpg
              - http://example.com/image2.jpg
              model: veo3_fast
              watermark: MyBrand
              callBackUrl: http://your-callback-url.com/complete
              aspect_ratio: '16:9'
              enableFallback: false
              enableTranslation: true
              generationType: REFERENCE_2_VIDEO
