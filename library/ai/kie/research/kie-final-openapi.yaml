                    \ use the [Generate Persona](https://docs.kie.ai/suno-api/generate-persona) endpoint\
                    \ to create a personalized music Persona based on generated music.\n\nTo generate\
                    \ a Voice ID, use the [Generate Voice](https://docs.kie.ai/suno-api/suno-voice-generate)endpoint"
                  examples:
                  - persona_123
                personaModel:
                  type: string
                  enum:
                  - style_persona
                  - voice_persona
                  description: The persona model is only available for models version 5 and 5.5.
            example:
              uploadUrl: https://storage.example.com/upload
              defaultParamFlag: true
              instrumental: true
              continueAt: 60
              model: V4
              callBackUrl: https://api.example.com/callback
              prompt: Extend the music with more relaxing notes
              style: Classical
              title: Peaceful Piano Extended
