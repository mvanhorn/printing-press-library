  /api/v1/generate/mashup:
    post:
      summary: Generate Mashup Music
      deprecated: false
      description: 'Create remix music using AI models by combining multiple audio tracks.


        ## Usage Guide


        - This interface creates remix music from up to 2 uploaded audio files.

        - It combines elements from multiple tracks into a coherent new piece.

        - You can control the level of detail using custom mode and instrumental settings.


        ## Parameter Details


        - `uploadUrlList` is required and must contain exactly 2 audio file URLs.


        ### In Custom Mode (`customMode: true`)


        Character limits for `prompt` across different models:


        | Model | `prompt` Limit | `style` Limit |

        |:---|:---|:---|

        | **V4** | 3000 characters | 200 characters |

        | **V4_5** and **V4_5PLUS** | 5000 characters | 1000 characters |

        | **V4_5ALL** | 5000 characters | 1000 characters |

        | **V5** and **V5_5** | 5000 characters | 1000 characters |


        - `title` length limit: 80 characters (all models).


        ### In Non-Custom Mode (`customMode: false`)


        - `prompt` length limit: 500 characters.

        - `instrumental`: Whether to generate instrumental music.

        - Other parameters should be left empty.


        ## Developer Notes


        New users are advised to start with `customMode: false`, which is simpler.


        - Generated files will be retained for 14 days.

        - The callback process has three stages: `text` (text generation), `first` (first track complete),
        `complete` (all complete).

        - Uploaded audio files must have publicly accessible URLs.

        - `uploadUrlList` must contain exactly 2 audio file URLs to initiate remix generation.


        ## Optional Parameters


        | Parameter | Type | Description |

        |:---|:---|:---|

        | `vocalGender` | string | Vocal gender preference. `m` for male, `f` for female. **Note**: This
        parameter only takes effect when `customMode` is `true`. In practice, this parameter only increases
        the probability but does not guarantee adherence to the specified vocal gender. |

        | `styleWeight` | number | Strength of adherence to style. **Note**: This parameter only takes
        effect when `customMode` is `true`. Range is 0–1, with two decimal places. Example: `0.61`. |

        | `weirdnessConstraint` | number | Creativity/discreteness level. **Note**: This parameter only
        takes effect when `customMode` is `true`. Range is 0–1, with two decimal places. Example: `0.72`.
        |

        | `audioWeight` | number | Weight of audio elements. **Note**: This parameter only takes effect
        when `customMode` is `true`. Range is 0–1, with two decimal places. Example: `0.65`. |'
      operationId: generate-mashup
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - uploadUrlList
              - style
              - title
              - customMode
              - model
              - callBackUrl
              properties:
                uploadUrlList:
                  type: array
                  description: Array of audio file URLs to mashup. Must contain exactly 2 URLs. Each URL
                    must be publicly accessible.
                  items:
                    type: string
                    format: uri
                  minItems: 2
                  maxItems: 2
                  examples:
                  - - https://example.com/audio1.mp3
                    - https://example.com/audio2.mp3
                prompt:
                  type: string
                  description: "A description of the desired audio content.  \n- In Custom Mode (`customMode:\
                    \ true`): Required if `instrumental` is `false`. The prompt will be strictly used\
                    \ as the lyrics and sung in the generated track. Character limits by model:  \n  -\
                    \ **V4**: Maximum 3000 characters  \n  - **V4_5 & V4_5PLUS**: Maximum 5000 characters\
                    \  \n  - **V4_5ALL**: Maximum 5000 characters  \n  - **V5 & V5_5**: Maximum 5000 characters\
                    \  \n  Example: \"A calm and relaxing piano track with soft melodies\"  \n- In Non-custom\
                    \ Mode (`customMode: false`): Always required. The prompt serves as the core idea,\
                    \ and lyrics will be automatically generated based on it (not strictly matching the\
                    \ input). Maximum 500 characters.  \n  Example: \"A short relaxing piano tune\""
                  examples:
                  - A calm and relaxing piano track with soft melodies
                style:
                  type: string
                  description: "Music style specification for the generated audio.  \n- Only available\
                    \ and required in Custom Mode (`customMode: true`). Defines the genre, mood, or artistic\
                    \ direction.  \n- Character limits by model:  \n  - **V4**: Maximum 200 characters\
                    \  \n  - **V4_5 & V4_5PLUS**: Maximum 1000 characters  \n  - **V4_5ALL**: Maximum\
                    \ 1000 characters  \n  - **V5 & V5_5**: Maximum 1000 characters  \n- Common examples:\
                    \ Jazz, Classical, Electronic, Pop, Rock, Hip-hop, etc."
                  examples:
                  - Jazz
                title:
                  type: string
                  description: "Title for the generated music track.  \n- Only available and required\
                    \ in Custom Mode (`customMode: true`).  \n- Max length: 80 characters.  \n- Will be\
                    \ displayed in player interfaces and filenames."
                  examples:
                  - Relaxing Piano
                customMode:
                  type: boolean
                  description: "Determines if advanced parameter customization is enabled.  \n- If `true`:\
                    \ Allows detailed control with specific requirements for `style` and `title` fields.\
                    \  \n- If `false`: Simplified mode where only `prompt` is required and other parameters\
                    \ are ignored."
                  examples:
                  - true
                instrumental:
                  type: boolean
                  description: "Determines if the audio should be instrumental (no lyrics).  \n- In Custom\
                    \ Mode (`customMode: true`):  \n  - If `true`: Only `style` and `title` are required.\
                    \  \n  - If `false`: `style`, `title`, and `prompt` are required (with prompt used\
                    \ as the exact lyrics).  \n- In Non-custom Mode (`customMode: false`): No impact on\
                    \ required fields (prompt only)."
                  examples:
                  - true
                model:
                  type: string
                  description: "The AI model version to use for generation.  \n- Required for all requests.\
                    \  \n- Available options:  \n  - **`V5_5`**: Custom Models Tailored to Your Unique\
                    \ Taste.\n  - **`V5`**: Superior musical expression, faster generation.  \n  - **`V4_5PLUS`**:\
                    \ V4.5+ delivers richer sound, new ways to create, max 8 min.  \n  - **`V4_5`**: V4.5\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4_5ALL`**: V4.5ALL\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4`**: V4 improves\
                    \ vocal quality, max 4 min."
                  enum:
                  - V4
                  - V4_5
                  - V4_5PLUS
