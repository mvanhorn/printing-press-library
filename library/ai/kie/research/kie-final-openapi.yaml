      deprecated: false
      description: "Query the validation phrase generation result for a Suno Voice task.\n\nUse this endpoint\
        \ with the `taskId` returned by the validation phrase generation or regeneration endpoint. When\
        \ the task is ready, the response contains `validateInfo`, which is the phrase the user needs\
