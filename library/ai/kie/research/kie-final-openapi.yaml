  /api/v1/generate/generate-persona:
    post:
      summary: Generate Persona
      deprecated: false
      description: "Create a personalized music Persona based on generated music, giving the music a unique\
        \ identity and characteristics.\n\n## Usage Guide\n\nUse this endpoint to create Personas (music\
        \ characters) for generated music:\n* Requires the `taskId` from music generation related endpoints\
        \ (generate, extend) and audio ID\n* Customize the Persona name and description to give music\
        \ unique personality\n* Generated Personas can be used for subsequent music creation and style\
        \ transfer\n\n## Parameter Details\n\n*   **`taskId`** (Required): Can be obtained from the following\
        \ endpoints:\n    *   [Generate Music](/suno-api/generate-music) (`/api/v1/generate`)\n    * \
        \  [Extend Music](/suno-api/extend-music) (`/api/v1/generate/extend`)\n*   **`audioId`** (Required):\
        \ Specifies the audio ID to create Persona for\n*   **`name`** (Required): Assigns an easily recognizable\
        \ name to the Persona\n*   **`description`** (Required): Describes the Persona's musical characteristics,\
        \ style, and personality\n\n## Developer Notes\n\n:::caution Important Requirements\n*   **Ensure\
        \ the music generation task is fully completed** before calling this endpoint. If the music is\
        \ still generating, this endpoint will return a failure.\n*   **Model Requirement**: Persona generation\
        \ only supports `taskId` from music generated with models above v3.5 (v3.5 itself is **not** supported).\n\
        *   Each audio ID can only generate a Persona **once**.\n\n*   It is recommended to provide detailed\
        \ descriptions for Personas to better capture musical characteristics.\n*   The returned `personaId`\
        \ can be used in subsequent music generation requests to create music with similar style characteristics.\n\
        *   You can apply the `personaId` to the following endpoints:\n    *   [Generate Music](/suno-api/generate-music)\n\
        \    *   [Extend Music](/suno-api/extend-music)\n\n## Parameter Example\n\n```json\n{\n  \"taskId\"\
        : \"5c79****be8e\",\n  \"audioId\": \"e231****-****-****-****-****8cadc7dc\",\n  \"name\": \"\
        Electronic Pop Singer\",\n  \"description\": \"A modern electronic music style pop singer, skilled\
        \ in dynamic rhythms and synthesizer tones\"\n}\n```\n\nEnsure that the music generation task\
        \ corresponding to the `taskId` is complete and the `audioId` is within the valid range.\n\nProviding\
        \ detailed and specific descriptions for Personas helps the system more accurately capture musical\
        \ style characteristics."
      operationId: generate-persona
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - taskId
              - audioId
              - name
              - description
              properties:
                taskId:
                  type: string
                  description: 'Unique identifier of the original music generation task. This can be a
                    taskId returned from any of the following endpoints:

                    - Generate Music (/api/v1/generate)

                    - Extend Music (/api/v1/generate/extend)'
                  examples:
                  - 5c79****be8e
                audioId:
                  type: string
                  description: Unique identifier of the audio track to create Persona for. This ID is
                    returned in the callback data after music generation completes.
                  examples:
                  - e231****-****-****-****-****8cadc7dc
                name:
                  type: string
                  description: Name for the Persona. A descriptive name that captures the essence of the
                    musical style or character.
                  examples:
                  - Electronic Pop Singer
                description:
                  type: string
                  description: Detailed description of the Persona's musical characteristics, style, and
                    personality. Be specific about genre, mood, instrumentation, and vocal qualities.
                  examples:
                  - A modern electronic music style pop singer, skilled in dynamic rhythms and synthesizer
                    tones
                ' vocalStart':
                  type: number
                  description: Start time (in seconds) for Persona analysis segment extraction. Used to
                    specify the time point in the audio from which to extract the segment for Persona
                    analysis. Must be less than vocalEnd, and vocalEnd - vocalStart must be between 10–30
                    seconds. Defaults to 0.0.
                  default: 0
                  examples:
                  - 12.5
                  minimum: 0
                ' vocalEnd':
                  type: number
                  description: End time (in seconds) for Persona analysis segment extraction. Together
                    with vocalStart, used to specify the time range for analysis. vocalEnd - vocalStart
                    must be between 10–30 seconds. Defaults to 30.0.
                  multipleOf: 0.01
                  default: 30
                  examples:
                  - 25.8
                  minimum: 0
                style:
                  type: string
                  description: Optional. Used to supplement the description of the music style tag corresponding
                    to the Persona, such as "Electronic Pop", "Jazz Trio", etc.
            example:
              taskId: 5c79****be8e
              audioId: e231****-****-****-****-****8cadc7dc
              name: Electronic Pop Singer
              description: A modern electronic music style pop singer, skilled in dynamic rhythms and
                synthesizer tones
              vocalStart: 0
              vocalEnd: 30
              style: Electronic Pop
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    code:
                      type: integer
                      enum:
                      - 200
                      - 401
                      - 402
                      - 404
                      - 409
                      - 422
                      - 429
                      - 451
                      - 455
                      - 500
                      description: "Response Status Codes\n\n- **200**: Success - Request has been processed\
                        \ successfully  \n- **401**: Unauthorized - Authentication credentials are missing\
                        \ or invalid  \n- **402**: Insufficient Credits - Account does not have enough\
                        \ credits to perform the operation  \n- **404**: Not Found - The requested resource\
                        \ or endpoint does not exist  \n- **409**: Conflict - Persona already exists for\
                        \ this music\n- **422**: Validation Error - The request parameters failed validation\
                        \ checks  \n- **429**: Rate Limited - Request limit has been exceeded for this\
                        \ resource  \n- **451**: Unauthorized - Failed to fetch the music data. Kindly\
                        \ verify any access limits set by you or your service provider  \n- **455**: Service\
                        \ Unavailable - System is currently undergoing maintenance  \n- **500**: Server\
                        \ Error - An unexpected error occurred while processing the request"
                    msg:
                      type: string
                      description: Error message when code != 200
                      examples:
                      - success
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        personaId:
                          type: string
                          description: Unique identifier for the generated Persona. This personaId can
                            be used in subsequent music generation requests (Generate Music, Extend Music,
                            Upload And Cover Audio, Upload And Extend Audio) to create music with similar
                            style characteristics.
                          examples:
                          - a1b2****c3d4
                        name:
                          type: string
                          description: Name of the Persona as provided in the request.
                          examples:
                          - Electronic Pop Singer
                        description:
                          type: string
                          description: Description of the Persona's musical characteristics, style, and
                            personality as provided in the request.
                          examples:
                          - A modern electronic music style pop singer, skilled in dynamic rhythms and
                            synthesizer tones
          headers: {}
        '500':
          description: request failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
