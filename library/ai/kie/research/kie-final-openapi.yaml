        \ font-weight: bold;\">Function Calling</code>\n    </div>\n  </div>\n\n  <p style=\"color: #666;\
        \ font-size: 13px; margin-top: 15px; font-style: italic;\">\n    * You cannot use both features\
        \ in the same request. Please choose the one that best suits your needs.\n  </p>\n</div>\n\n<AccordionGroup>\n\
        <Accordion title=\"Google Search\">\nUse this format to enable Google Search grounding:\n\n```json\n\
        {\n  \"type\": \"function\",\n  \"function\": {\n    \"name\": \"googleSearch\"\n  }\n}\n```\n\
        \nThis enables real-time information retrieval via Google Search.\n</Accordion>\n\n<Accordion\
        \ title=\"Function Calling\">\nDefine your own functions with parameters. You can define multiple\
        \ functions in the `tools` array:\n\n```json\n[\n  {\n    \"type\": \"function\",\n    \"function\"\
        : {\n      \"name\": \"get_current_weather\",\n      \"description\": \"Get the current weather\
