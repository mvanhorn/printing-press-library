  /api/v1/generate/upload-cover:
    post:
      summary: Upload And Cover Audio
      deprecated: false
      description: "This API creates a cover version of an audio track by transforming it into a new style\
        \ while retaining its core melody. It incorporates Suno's upload capability, enabling users to\
        \ upload an audio file for processing. The expected result is a refreshed audio track with a new\
        \ style, keeping the original melody intact.\n\n## Parameter Usage Guide\n\n:::note Character\
        \ Limits\nCharacter limits vary depending on the model version:\n\n*   **Model V5_5 and V5**:\
        \ `style` (max 1000 chars), `title` (max 100 chars), `prompt` (max 5000 chars)\n*   **Models V4.5PLUS\
        \ and V4.5**: `style` (max 1000 chars), `title` (max 100 chars), `prompt` (max 5000 chars)\n*\
        \   **Model V4.5ALL**: `style` (max 1000 chars), `title` (max 80 chars), `prompt` (max 5000 chars)\n\
        *   **Model V4**: `style` (max 200 chars), `title` (max 80 chars), `prompt` (max 3000 chars)\n\
        \n*   **When `customMode` is `true` (Custom Mode):**\n    *   If `instrumental` is `true`: `style`,\
        \ `title`, and `uploadUrl` are required.\n    *   If `instrumental` is `false`: `style`, `prompt`,\
        \ `title`, and `uploadUrl` are required.\n    *   **Character limits vary by model version** (see\
        \ note above).\n    *   `uploadUrl` is used to specify the upload location of the audio file;\
        \ ensure the uploaded audio does not exceed 8 minutes in length.\n\n*   **When `customMode` is\
        \ `false` (Non-custom Mode):**\n    *   Only `prompt` and `uploadUrl` are required, regardless\
        \ of the `instrumental` setting.\n    *   `prompt` length limit: 500 characters.\n    *   Other\
        \ parameters should be left empty.\n\n## Developer Notes\n\n1.  **Quick Start for New Users:**\
        \ Set `customMode` to `false`, `instrumental` to `false`, and provide only `prompt` and `uploadUrl`.\
        \ This is the simplest configuration to quickly test the API and experience the results.\n2. \
        \ Generated files will be deleted after **15 days**.\n3.  Ensure all required parameters are provided\
        \ based on the `customMode` and `instrumental` settings to avoid errors.\n4.  Pay attention to\
        \ character limits for `prompt`, `style`, and `title` to ensure successful processing.\n5.  **Callback\
        \ Process Stages:** The callback process has three stages: `text` (text generation complete),\
        \ `first` (first track complete), and `complete` (all tracks complete).\n6.  **Active Status Check:**\
        \ You can use the [Get Music Generation Details](/suno-api/get-music-details) endpoint to actively\
        \ check the task status instead of waiting for callbacks.\n7.  The `uploadUrl` parameter is used\
        \ to specify the upload location of the audio file; please provide a valid URL.\n\n## Optional\
        \ Parameters\n\n*   `vocalGender` (`string`): Vocal gender preference. Use `m` for male, `f` for\
        \ female.\n*   `styleWeight` (`number`): Strength of adherence to style. Range 0–1, up to 2 decimal\
        \ places. Example: `0.65`.\n*   `weirdnessConstraint` (`number`): Controls creative deviation.\
        \ Range 0–1, up to 2 decimal places. Example: `0.65`.\n*   `audioWeight` (`number`): Balance weight\
        \ for audio features. Range 0–1, up to 2 decimal places. Example: `0.65`.\n*   `personaId` (`string`):\
        \ Persona ID to apply to the generated music. Only available when Custom Mode is enabled (i.e.,\
        \ `customMode` is `true`). To create one, use [Generate Persona](/suno-api/generate-persona)."
      operationId: upload-and-cover-audio
      tags:
      - Market
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - uploadUrl
              - prompt
              - customMode
              - instrumental
              - model
              - callBackUrl
              properties:
                uploadUrl:
                  type: string
                  format: uri
                  description: The URL for uploading audio files, required regardless of whether customMode
                    and instrumental are true or false. Ensure the uploaded audio does not exceed 8 minutes
                    in length.
                  examples:
                  - https://storage.example.com/upload
                prompt:
                  type: string
                  description: "A description of the desired audio content.  \n- In Custom Mode (`customMode:\
                    \ true`):  Required if `instrumental` is `false`. The prompt will be strictly used\
                    \ as the lyrics and sung in the generated track. Character limits by model:  \n  -\
                    \ **V5_5 & V5**: Maximum 5000 characters  \n  - **V4_5PLUS & V4_5**: Maximum 5000\
                    \ characters  \n  - **V4_5ALL**: Maximum 5000 characters  \n  - **V4**: Maximum 3000\
                    \ characters  \n  Example: \"A calm and relaxing piano track with soft melodies\"\
                    \  \n- In Non-custom Mode (`customMode: false`): Always required. The prompt serves\
                    \ as the core idea, and lyrics will be automatically generated based on it (not strictly\
                    \ matching the input). Max length: 500 characters.  \n  Example: \"A short relaxing\
                    \ piano tune\""
                  examples:
                  - A calm and relaxing piano track with soft melodies
                style:
                  type: string
                  description: "The music style or genre for the audio.  \n- Required in Custom Mode (`customMode:\
                    \ true`). Examples: \"Jazz\", \"Classical\", \"Electronic\". Character limits by model:\
                    \  \n  - **V5_5 & V5**: Maximum 1000 characters  \n  - **V4_5PLUS & V4_5**: Maximum\
                    \ 1000 characters  \n  - **V4_5ALL**: Maximum 1000 characters  \n  - **V4**: Maximum\
                    \ 200 characters  \n  Example: \"Classical\"  \n- In Non-custom Mode (`customMode:\
                    \ false`): Leave empty."
                  examples:
                  - Classical
                title:
                  type: string
                  description: "The title of the generated music track.  \n- Required in Custom Mode (`customMode:\
                    \ true`). Character limits by model:  \n  - **V5_5 & V5**: Maximum 100 characters\
                    \  \n  - **V4_5PLUS & V4_5**: Maximum 100 characters  \n  - **V4_5ALL**: Maximum 80\
                    \ characters  \n  - **V4**: Maximum 80 characters  \n  Example: \"Peaceful Piano Meditation\"\
                    \  \n- In Non-custom Mode (`customMode: false`): Leave empty."
                  examples:
                  - Peaceful Piano Meditation
                customMode:
                  type: boolean
                  description: "Enables Custom Mode for advanced audio generation settings.  \n- Set to\
                    \ `true` to use Custom Mode (requires `style` and `title`; `prompt` required if `instrumental`\
                    \ is `false`). The prompt will be strictly used as lyrics if `instrumental` is `false`.\
                    \  \n- Set to `false` for Non-custom Mode (only `prompt` is required). Lyrics will\
                    \ be auto-generated based on the prompt."
                  examples:
                  - true
                instrumental:
                  type: boolean
                  description: "Determines if the audio should be instrumental (no lyrics).  \n- In Custom\
                    \ Mode (`customMode: true`):  \n  - If `true`: Only `style` and `title` are required.\
                    \  \n  - If `false`: `style`, `title`, and `prompt` are required (with `prompt` used\
                    \ as the exact lyrics).  \n- In Non-custom Mode (`customMode: false`): No impact on\
                    \ required fields (`prompt` only). Lyrics are auto-generated if `instrumental` is\
                    \ `false`."
                  examples:
                  - true
                model:
                  type: string
                  description: "The AI model version to use for generation.  \n- Required for all requests.\
                    \  \n- Available options:  \n  - **`V5_5`**：Custom Models Tailored to Your Unique\
                    \ Taste.  \n  - **`V5`**: Superior musical expression, faster generation.  \n  - **`V4_5PLUS`**:\
                    \ V4.5+ delivers richer sound, new ways to create, max 8 min.  \n  - **`V4_5`**: V4.5\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4_5ALL`**: V4.5ALL\
                    \ enables smarter prompts, faster generations, max 8 min.  \n  - **`V4`**: V4 improves\
                    \ vocal quality, max 4 min."
                  enum:
                  - V4
                  - V4_5
                  - V4_5PLUS
                  - V4_5ALL
                  - V5
                  - V5_5
                  examples:
                  - V4
                negativeTags:
                  type: string
                  description: "Music styles or traits to exclude from the generated audio.  \n- Optional.\
                    \ Use to avoid specific styles.  \n  Example: \"Heavy Metal, Upbeat Drums\""
                  examples:
                  - Heavy Metal, Upbeat Drums
                callBackUrl:
                  type: string
                  format: uri
                  description: 'The URL to receive audio covering task completion updates. Required for
                    all audio covering requests.


                    - System will POST task status and results to this URL when audio covering completes

                    - Callback includes generated covered audio files with new style while preserving
                    original melody

                    - Your callback endpoint should accept POST requests with JSON payload containing
                    covered track results and audio URLs

                    - For detailed callback format and implementation guide, see [Audio Covering Callbacks](https://docs.kie.ai/suno-api/upload-and-cover-audio-callbacks)

                    - Alternatively, use the Get Music Details endpoint to poll task status

                    - To ensure callback security, see [Webhook Verification Guide](/common-api/webhook-verification)
                    for signature verification implementation'
                  examples:
                  - https://api.example.com/callback
