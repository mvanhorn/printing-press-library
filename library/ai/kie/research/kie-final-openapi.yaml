        \ tasks created via Get 4K Video\n\n## Status Descriptions\n\n| successFlag | Description |\n\
        |------------|-------------|\n| `0` | Generating — task is currently being processed |\n| `1`\
        \ | Success — task completed successfully |\n| `2` | Failed — task failed before completion |\n\
        | `3` | Generation Failed — task created successfully but upstream generation failed |\n\n## Important\
        \ Notes\n\n* Query task status using `taskId`\n* You may poll this endpoint periodically until\
        \ the task completes\n* Callback mechanisms push completion events, but **this endpoint remains\
        \ the final authority**\n* `fallbackFlag` is a **legacy field** and may appear only in older regular\
