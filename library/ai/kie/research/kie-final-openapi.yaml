        - `success`: the validation and voice creation flow has completed\n\n## Continue the Flow\n\n\
        After receiving `validateInfo`, record or upload the user's verification audio and submit it to\
        \ the voice generation endpoint:\n\n<Card\n  title=\"Generate Voice\"\n  icon=\"lucide-mic\"\n\
        \  href=\"/suno-api/suno-voice-generate\"\n>\n  Submit the user's verification audio to generate\
        \ the final custom voice\n</Card>\n\nRelated resources\n\n<CardGroup cols={2}>\n  <Card title=\"\
        Generate Validation Phrase\" icon=\"lucide-file-audio\" href=\"/suno-api/suno-voice-validate\"\
        > Create a validation phrase from source audio </Card>\n  <Card title=\"Regenerate Validation\
        \ Phrase\" icon=\"lucide-refresh-cw\" href=\"/suno-api/suno-voice-regenerate\"> Generate a new\
        \ phrase for an existing task </Card>\n</CardGroup>"
      operationId: suno-voice-validate-info
      tags:
      - Market
      parameters:
      - name: taskId
        in: query
        description: 任务id
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                        description: Task ID
