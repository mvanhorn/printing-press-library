        \  </Card>\n</CardGroup>\n\n<div style=\"padding: 20px; background-color: rgba(255, 152, 0, 0.05);\
        \ border: 1px solid rgba(255, 152, 0, 0.15); border-left: 6px solid #ff9800; border-radius: 10px;\
        \ margin: 25px 0;\">\n  <div style=\"display: flex; align-items: center; margin-bottom: 12px;\"\
        >\n    <span style=\"font-size: 22px; margin-right: 10px;\">⚠️</span>\n    <strong style=\"color:\
        \ #e65100; font-size: 17px;\">Important: Unified Media Structure</strong>\n  </div>\n\n  <p style=\"\
        color: #444; margin-bottom: 15px; line-height: 1.6; font-size: 14px;\">\n    To simplify integration,\
        \ <b>all media types</b> (Images, Videos, Audio, or Documents) in the <code>messages</code> array\
        \ share the <b>exact same JSON structure</b>:\n  </p>\n\n  <ul style=\"color: #555; line-height:\
        \ 1.8; margin-bottom: 15px; font-size: 14px;\">\n    <li>The <code>type</code> field is <b>fixed</b>\
        \ as <code>\"image_url\"</code></li>\n    <li>The <code>image_url</code> key name <b>remains unchanged</b>\
        \ for all file types</li>\n    <li>Only the <code>url</code> value points to your specific media\
        \ file</li>\n  </ul>\n\n  <div style=\"background-color: #fdfdfd; padding: 12px; border-radius:\
        \ 6px; border: 1px solid #eee; font-family: 'SFMono-Regular', Consolas, monospace; font-size:\
        \ 13px; color: #d32f2f;\">\n    <span style=\"color: #888; font-style: italic;\">// Example for\
        \ Video/Audio/PDF/Image:</span><br>\n    { \"type\": \"image_url\", \"image_url\": { \"url\":\
        \ \"https://...\" } }\n  </div>\n</div>\n\n## Tools Parameter\n\nThe `tools` parameter is an optional\
        \ array that allows you to define functions the model can call. The array can contain multiple\
        \ objects. When using function calling, you can define multiple functions in the array.\n\n<AccordionGroup>\n\
        <Accordion title=\"Function Calling\">\nDefine your own functions with parameters. You can define\
        \ multiple functions in the `tools` array:\n\n```json\n[\n  {\n    \"type\": \"function\",\n \
        \   \"function\": {\n      \"name\": \"get_current_weather\",\n      \"description\": \"Get the\
        \ current weather in a given location\",\n      \"parameters\": {\n        \"type\": \"object\"\
        ,\n        \"properties\": {\n          \"location\": {\n            \"type\": \"string\",\n \
        \           \"description\": \"The city and state, e.g. San Francisco, CA\"\n          },\n  \
        \        \"unit\": {\n            \"type\": \"string\",\n            \"enum\": [\"celsius\", \"\
        fahrenheit\"]\n          }\n        },\n        \"required\": [\"location\"]\n      }\n    }\n\
        \  },\n  {\n    \"type\": \"function\",\n    \"function\": {\n      \"name\": \"get_stock_price\"\
        ,\n      \"description\": \"Get the current stock price for a given symbol\",\n      \"parameters\"\
        : {\n        \"type\": \"object\",\n        \"properties\": {\n          \"symbol\": {\n     \
        \       \"type\": \"string\",\n            \"description\": \"The stock symbol, e.g. AAPL\"\n\
        \          }\n        },\n        \"required\": [\"symbol\"]\n      }\n    }\n  }\n]\n```\n\n\
        ### Function Declaration Requirements\n\nWhen implementing function calling in your prompt, you\
        \ need to create a `tools` array containing one or more function declarations. You can define\
        \ functions using JSON (specifically, a selected subset of OpenAPI schema format).\n\nA single\
        \ function declaration can include the following parameters:\n\n- **`name`** (string, required):\
        \ The unique name of the function (e.g., `get_weather_forecast`, `send_email`). Use descriptive\
        \ names without spaces or special characters (use underscores or camelCase).\n\n- **`description`**\
        \ (string, optional but recommended): A clear and detailed description of what the function does\
        \ and its purpose. This is crucial for the model to understand when to use the function. Be specific\
        \ and provide examples when necessary (e.g., \"Find movie theaters by location, with an option\
        \ to also find movies currently showing at those theaters.\").\n\n- **`parameters`** (object,\
        \ required): Defines the input parameters expected by the function. Contains:\n  - **`type`**\
        \ (string): Specifies the overall data type, must be `\"object\"`.\n  - **`properties`** (object):\
        \ Lists individual parameters, each with:\n    - **`type`** (string): The parameter's data type,\
        \ such as `string`, `integer`, `boolean`, `array`.\n    - **`description`** (string): Description\
        \ of the parameter's purpose and format. Provide examples and constraints (e.g., \"City and state,\
        \ e.g. 'San Francisco, CA' or a postal code like '95616'.\").\n    - **`enum`** (array, optional):\
        \ If parameter values come from a fixed set, use `enum` to list allowed values rather than just\
        \ describing them in the description. This helps improve accuracy (e.g., `\"enum\": [\"daylight\"\
        , \"cool\", \"warm\"]`).\n  - **`required`** (array): An array of strings listing the parameter\
        \ names required for the function to run.\n</Accordion>\n</AccordionGroup>"
      operationId: gemini-3-5-flash-chat-completions
      tags:
