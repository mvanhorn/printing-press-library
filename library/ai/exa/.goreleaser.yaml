version: 2
project_name: exa-pp-cli
changelog:
  disable: true
builds:
  - id: exa-pp-cli
    main: ./cmd/exa-pp-cli
    binary: exa-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/exa/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: exa-pp-mcp
    main: ./cmd/exa-pp-mcp
    binary: exa-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: exa-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Exa search API feature, plus local history, spend tracking, and diffing no other Exa tool has."
    install: |
      bin.install "exa-pp-cli"
      bin.install "exa-pp-mcp"
