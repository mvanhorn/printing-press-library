name: tavily
display_name: Tavily
version: "1.0"
base_url: https://api.tavily.com
cli_description: "Web search, content extraction, site crawling, URL mapping, and deep research from the command line — with offline search, credit tracking, and agent-native output."

auth:
  type: bearer_token
  header: Authorization
  prefix: Bearer
  in: header
  env_vars:
    - TAVILY_API_KEY

resources:
  web-search:
    description: "Real-time web search optimized for AI and RAG applications"
    endpoints:
      search:
        method: POST
        path: /search
        description: "Execute a web search query with configurable depth, filtering, and AI-generated answers"
        params:
          - name: query
            type: string
            required: true
            description: "The search query to execute"
          - name: search_depth
            type: string
            required: false
            default: basic
            description: "Search depth: basic (1 credit), advanced (2 credits)"
            enum: [basic, advanced]
          - name: chunks_per_source
            type: integer
            required: false
            default: 3
            description: "Max content chunks per source (1-3), advanced depth only"
          - name: max_results
            type: integer
            required: false
            default: 5
            description: "Number of search results to return (0-20)"
          - name: topic
            type: string
            required: false
            default: general
            description: "Search category"
            enum: [general, news]
          - name: time_range
            type: string
            required: false
            description: "Filter results by recency: day, week, month, year"
            enum: [day, week, month, year, d, w, m, y]
          - name: start_date
            type: string
            required: false
            description: "Results after this date (YYYY-MM-DD)"
          - name: end_date
            type: string
            required: false
            description: "Results before this date (YYYY-MM-DD)"
          - name: include_answer
            type: string
            required: false
            default: "false"
            description: "Include LLM-generated answer: true, basic, or advanced"
          - name: include_raw_content
            type: string
            required: false
            default: "false"
            description: "Include cleaned page content: true, markdown, or text"
          - name: include_images
            type: boolean
            required: false
            default: false
            description: "Include query-related and per-result images"
          - name: include_image_descriptions
            type: boolean
            required: false
            default: false
            description: "Add descriptive text to images"
          - name: include_favicon
            type: boolean
            required: false
            default: false
            description: "Include favicon URL per result"
          - name: include_domains
            type: array
            required: false
            description: "Whitelist domains to search within (max 300)"
          - name: exclude_domains
            type: array
            required: false
            description: "Blacklist domains to exclude (max 150)"
          - name: country
            type: string
            required: false
            description: "Boost results from a specific country (general topic only)"
          - name: auto_parameters
            type: boolean
            required: false
            default: false
            description: "Auto-configure parameters using AI (2 credits)"
          - name: exact_match
            type: boolean
            required: false
            default: false
            description: "Return only exact phrase matches"
          - name: include_usage
            type: boolean
            required: false
            default: false
            description: "Include credit usage in response"

  extract:
    description: "Content extraction from web pages"
    endpoints:
      extract:
        method: POST
        path: /extract
        description: "Extract clean content from one or more URLs"
        params:
          - name: urls
            type: array
            required: true
            description: "URL or list of URLs to extract (max 20)"
          - name: query
            type: string
            required: false
            description: "User intent for reranking extracted content chunks"
          - name: chunks_per_source
            type: integer
            required: false
            default: 3
            description: "Content snippets per source (1-5), requires query"
          - name: extract_depth
            type: string
            required: false
            default: basic
            description: "Extraction mode: basic or advanced"
            enum: [basic, advanced]
          - name: include_images
            type: boolean
            required: false
            default: false
            description: "Include extracted image URLs"
          - name: include_favicon
            type: boolean
            required: false
            default: false
            description: "Include favicon URL for results"
          - name: format
            type: string
            required: false
            default: markdown
            description: "Output format"
            enum: [markdown, text]
          - name: timeout
            type: number
            required: false
            description: "Timeout in seconds (1.0-60.0)"
          - name: include_usage
            type: boolean
            required: false
            default: false
            description: "Include credit usage information"

  crawl:
    description: "Systematic website traversal and content extraction"
    endpoints:
      crawl:
        method: POST
        path: /crawl
        description: "Crawl a website starting from a root URL, extracting content from discovered pages"
        params:
          - name: url
            type: string
            required: true
            description: "The root URL to begin the crawl"
          - name: instructions
            type: string
            required: false
            description: "Natural language guidance for the crawler (2 credits per 10 pages)"
          - name: chunks_per_source
            type: integer
            required: false
            default: 3
            description: "Max relevant chunks per source (1-5)"
          - name: max_depth
            type: integer
            required: false
            default: 1
            description: "How far from the base URL to explore (1-5)"
          - name: max_breadth
            type: integer
            required: false
            default: 20
            description: "Links to follow per page level (1-500)"
          - name: limit
            type: integer
            required: false
            default: 50
            description: "Total links processed before stopping"
          - name: select_paths
            type: array
            required: false
            description: "Regex patterns for URL path inclusion"
          - name: select_domains
            type: array
            required: false
            description: "Regex patterns for domain inclusion"
          - name: exclude_paths
            type: array
            required: false
            description: "Regex patterns for URL path exclusion"
          - name: exclude_domains
            type: array
            required: false
            description: "Regex patterns for domain exclusion"
          - name: allow_external
            type: boolean
            required: false
            default: true
            description: "Include external domain links in results"
          - name: include_images
            type: boolean
            required: false
            default: false
            description: "Include images in results"
          - name: extract_depth
            type: string
            required: false
            default: basic
            description: "Extraction depth: basic or advanced"
            enum: [basic, advanced]
          - name: format
            type: string
            required: false
            default: markdown
            description: "Output format: markdown or text"
            enum: [markdown, text]
          - name: include_favicon
            type: boolean
            required: false
            default: false
            description: "Include favicon URLs"
          - name: timeout
            type: number
            required: false
            default: 150
            description: "Wait duration in seconds (10-150)"
          - name: include_usage
            type: boolean
            required: false
            default: false
            description: "Include credit usage information"

  map:
    description: "Website structure discovery and URL mapping"
    endpoints:
      map:
        method: POST
        path: /map
        description: "Discover the URL structure of a website from a root URL"
        params:
          - name: url
            type: string
            required: true
            description: "The root URL to begin mapping"
          - name: instructions
            type: string
            required: false
            description: "Natural language guidance for crawling (2 credits per 10 pages)"
          - name: max_depth
            type: integer
            required: false
            default: 1
            description: "Depth limit from base URL (1-5)"
          - name: max_breadth
            type: integer
            required: false
            default: 20
            description: "Links per page level (1-500)"
          - name: limit
            type: integer
            required: false
            default: 50
            description: "Total link processing cap"
          - name: select_paths
            type: array
            required: false
            description: "Regex patterns for URL path inclusion"
          - name: select_domains
            type: array
            required: false
            description: "Regex patterns for domain inclusion"
          - name: exclude_paths
            type: array
            required: false
            description: "Regex patterns for URL path exclusion"
          - name: exclude_domains
            type: array
            required: false
            description: "Regex patterns for domain exclusion"
          - name: allow_external
            type: boolean
            required: false
            default: true
            description: "Include external domain links"
          - name: timeout
            type: number
            required: false
            default: 150
            description: "Request timeout in seconds (10-150)"
          - name: include_usage
            type: boolean
            required: false
            default: false
            description: "Return credit usage information"

  research:
    description: "Comprehensive multi-step research with citations"
    endpoints:
      create:
        method: POST
        path: /research
        description: "Start a research task that investigates a topic across multiple sources"
        params:
          - name: input
            type: string
            required: true
            description: "The research task or question to investigate"
          - name: model
            type: string
            required: false
            default: auto
            description: "Research scope: mini (fast/narrow), pro (comprehensive), auto"
            enum: [mini, pro, auto]
          - name: stream
            type: boolean
            required: false
            default: false
            description: "Enable Server-Sent Events streaming response"
          - name: output_schema
            type: object
            required: false
            description: "JSON Schema defining structured response format"
          - name: citation_format
            type: string
            required: false
            default: numbered
            description: "Citation style for the report"
            enum: [numbered, mla, apa, chicago]

  usage:
    description: "Credit usage and account information"
    endpoints:
      get:
        method: GET
        path: /usage
        description: "Get credit usage for the current billing cycle"
        params: []

  keys:
    description: "Enterprise API key management"
    endpoints:
      generate:
        method: POST
        path: /generate-keys
        base_url: https://api-key-generator.tavily.com
        description: "Generate new API keys (Enterprise only)"
        params:
          - name: permission_level
            type: string
            required: true
            description: "Key permission level"
            enum: [admin, user]
          - name: name
            type: string
            required: false
            description: "Custom key identifier"
          - name: key_type
            type: string
            required: false
            default: development
            description: "Key classification"
            enum: [development, production]
          - name: key_limit
            type: integer
            required: false
            default: 200
            description: "Credit allocation per key (1-100000)"
          - name: ttl_hours
            type: integer
            required: false
            default: 10
            description: "Hours until auto-deactivation (1-8760)"
          - name: count
            type: integer
            required: false
            default: 1
            description: "Number of keys to generate (1-200)"
      deactivate:
        method: POST
        path: /deactivate-keys
        base_url: https://api-key-generator.tavily.com
        description: "Deactivate API keys (Enterprise only)"
        params:
          - name: request_id
            type: string
            required: false
            description: "Bulk-deactivate all keys from a generation request"
      info:
        method: GET
        path: /key-info
        base_url: https://api-key-generator.tavily.com
        description: "Get information about the current API key (Enterprise only)"
        params: []
