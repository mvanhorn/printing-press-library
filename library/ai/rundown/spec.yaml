      - canonical: education-training
        aliases: ["education", "teaching", "training", "edtech"]
      - canonical: human-resources-recruiting
        aliases: ["hr", "recruiting", "recruitment", "hiring", "talent"]
      - canonical: legal
        aliases: ["law", "legal services"]
      - canonical: real-estate-construction
        aliases: ["real estate", "property", "construction"]
      - canonical: retail-ecommerce
        aliases: ["retail", "ecommerce", "e-commerce", "shopping"]
      - canonical: media-entertainment
        aliases: ["media", "entertainment", "content"]
      - canonical: professional-services
        aliases: ["consulting", "professional services", "agency"]
      - canonical: personal-lifestyle
        aliases: ["personal", "lifestyle", "life admin"]
      - canonical: nonprofit-social-impact
        aliases: ["nonprofit", "charity", "social impact", "ngo"]
      - canonical: manufacturing-supply-chain
        aliases: ["manufacturing", "supply chain", "logistics ops"]
      - canonical: transportation-logistics
        aliases: ["transportation", "logistics", "shipping"]
      - canonical: hospitality-travel
        aliases: ["hospitality", "travel", "hotels"]
      - canonical: sports-fitness
        aliases: ["sports", "fitness", "training gym"]
      - canonical: agriculture-food
        aliases: ["agriculture", "food", "farming"]
      - canonical: energy-utilities
        aliases: ["energy", "utilities", "power"]
      - canonical: government-public-sector
        aliases: ["government", "public sector", "gov"]
      - canonical: cross-industry
        aliases: ["general", "any industry", "cross industry"]
