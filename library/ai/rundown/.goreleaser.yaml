version: 2
project_name: rundown-pp-cli
changelog:
  disable: true
builds:
  - id: rundown-pp-cli
    main: ./cmd/rundown-pp-cli
    binary: rundown-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/ai/rundown/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: rundown-pp-mcp
    main: ./cmd/rundown-pp-mcp
    binary: rundown-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: rundown-pp-cli
    repository:
      owner: amrbody71-commits
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Search the community's AI workflows offline, and rank them by week - two things the site's own API cannot do."
    install: |
      bin.install "rundown-pp-cli"
      bin.install "rundown-pp-mcp"
