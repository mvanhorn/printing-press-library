x-tagGroups:
- name: Resources
  tags:
  - Contacts
  - Campaigns
  - Lists
  - Forms
  - Automations
  - Domains
  - Users
  - Contact Fields
x-mcp:
  transport:
  - stdio
  - http
  orchestration: code
  endpoint_tools: hidden
  intents:
  - name: campaign_performance
    description: Read a campaign and its authoritative performance counters, optionally
      including costly link statistics. Returns stats; for offline cohort and resend
      decisions use workflow campaign-review. Read-only; two API calls.
    params:
    - name: campaign_id
      type: integer
      required: true
      description: ID of the campaign to inspect.
    - name: include_links
      type: boolean
      description: Include optional link-level counters, increasing server work.
    steps:
    - endpoint: campaigns.get
      bind:
        id: ${input.campaign_id}
      capture: campaign
    - endpoint: campaigns.get-stats
      bind:
        id: ${campaign.id}
        include_link_stats: ${input.include_links}
      capture: stats
    returns: stats
x-pp-default-rate-limit: 0.9
x-learn:
  entity_lookup_seeds:
    engagement:
    - canonical: non_openers
      aliases:
      - non-openers
      - unopened recipients
    - canonical: openers
      aliases:
      - opened recipients
    - canonical: clickers
      aliases:
      - clicked recipients
    custom_field_type:
    - canonical: text
      aliases:
      - text field
    - canonical: number
      aliases:
      - numeric field
    - canonical: date
      aliases:
      - date field
  synonyms:
    most recent: latest
