        \ link rather than reading a counter, so leaving it off keeps this endpoint\
        \ as cheap as it has always been."
      parameters:
      - name: include_link_stats
        in: query
        schema:
          type: boolean
          default: false
        description: When true, include the link_stats breakdown in the response
      - name: link_limit
        in: query
