      required: true
      schema:
        type: integer
    post:
      operationId: sendCampaign
      tags:
      - Campaigns
      summary: Send a campaign immediately
      description: "Schedules a draft campaign for immediate sending. The campaign\
        \ must:\n- Not already be sent or scheduled\n- Have at least one list assigned\n\
        - Not be a confirmation (double opt-in) email \u2014 those are delivered to\
        \ each\n  contact as they subscribe, never as a broadcast\n- The user must\
        \ not be in a warmup/throttle period\n\nAll existing abuse prevention applies\
        \ automatically: content approval workflow,\nsending throttles, spam detection,\
        \ and bounce rate monitoring.\n"
      responses:
        '200':
          description: Campaign scheduled for sending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Campaign has no lists assigned
        '403':
          description: Forbidden (cannot send; a large campaign is already scheduled
            and must finish first)
        '409':
          description: Campaign already sent or scheduled, or the campaign is a confirmation
            (double opt-in) email, which is sent to each contact as they subscribe.
