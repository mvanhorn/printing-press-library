openapi: 3.0.3
info:
  title: SendFox API
  description: '# Introduction

    SendFox''s REST API lets you manage contacts, campaigns, lists, automations, and
    forms programmatically. It uses OAuth 2.0 for authentication.


    Compatible with AI agents (Claude, ChatGPT, etc.) via the OpenAPI spec. Available
    at `GET /openapi.yaml`.


    # Authentication

    ### Personal Access Token

    Create a personal access token at https://sendfox.com/account/oauth. Once created,
    use it in the `Authorization` header:

    ```

    Authorization: Bearer {TOKEN}

    ```


    ### OAuth 2.0 Client

    For integrations that require user authentication, create an OAuth 2.0 client
    at https://sendfox.com/account/oauth


    * Authorization URL: https://sendfox.com/oauth/authorize

    * Access Token URL: https://sendfox.com/oauth/token


    # Rate Limits

    API requests are limited to **60 requests per minute** per authenticated user.
    Rate limit status is returned in response headers:

    - `X-RateLimit-Limit`: Maximum requests per minute

    - `X-RateLimit-Remaining`: Remaining requests in current window

    - `Retry-After`: Seconds until rate limit resets (only on 429 responses)


    # Error Responses

    All error responses use standard HTTP status codes and Laravel''s default error
    format:

    - `message`: Human-readable error description

    - `errors`: Field-level validation errors (on 422 responses)


    # Plans & API Access

    API access requires a **Lifetime** or **Empire** plan. Free users cannot use the
    API.


    Accounts restricted by SendFox cannot use authenticated API endpoints. These requests
    return `403 Forbidden` with the error code `account_restricted` and a link to
    the account status page.

    '
  version: 1.4.0
  x-logo:
    url: /img/sendfox-logo.svg
servers:
- url: https://api.sendfox.com
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://sendfox.com/oauth/authorize
          tokenUrl: https://sendfox.com/oauth/token
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
      x-auth-env-vars:
      - SENDFOX_API_TOKEN
      - SENDFOX_BEARER_AUTH
      x-auth-key-url: https://sendfox.com/account/oauth
      description: Personal access token. Compatibility alias SENDFOX_BEARER_AUTH
        remains supported.
  responses:
    Forbidden:
      description: 'Forbidden. Most often an ownership/authorization failure (Laravel''s
        default `{"message": "..."}` shape). If the account is restricted by SendFox,
        the response instead carries the structured `account_restricted` body with
        a link to the account status page.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/AccountRestrictedError'
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        ip_address:
          type: string
        unsubscribed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - email
    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: string
        preview_text:
          type: string
          maxLength: 191
          nullable: true
          description: Inbox preview snippet shown beneath the subject line in most
            email clients.
        html:
          type: string
        from_name:
          type: string
        from_email:
          type: string
          format: email
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - title
      - subject
      - html
      - from_name
      - from_email
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error description
        errors:
          type: object
          description: Field-level validation errors (on 422 responses)
          additionalProperties:
            type: array
            items:
              type: string
    AccountRestrictedError:
      type: object
      required:
      - error
      - code
      - account_status_url
      properties:
        error:
          type: string
          example: API access is unavailable while the account is restricted.
        code:
          type: string
          enum:
          - account_restricted
        account_status_url:
          type: string
          format: uri
          example: https://sendfox.com/account/status
    Form:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        landing_page_id:
          type: integer
          nullable: true
        redirect_url:
          type: string
          nullable: true
        gdpr_required:
          type: boolean
        url:
          type: string
          description: Public subscribe URL
        lists:
          type: array
          items:
            $ref: '#/components/schemas/ContactList'
          description: Attached lists (included on create/update)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - title
      - lists
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        contacts_count:
          type: integer
        contact_limit:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserContactField:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
          description: Human-readable field label
        name:
          type: string
          description: Machine-readable slug (auto-generated from label)
        type:
          type: string
          enum:
          - text
          - number
          - date
          description: Field type
      required:
      - label
    WhitelabelDomain:
      type: object
      properties:
        id:
          type: integer
        domain:
          type: string
        sendgrid_whitelabel_domain_id:
          type: integer
          nullable: true
        validated_at:
          type: string
          format: date-time
          nullable: true
        dns:
          type: object
          description: DNS records from SendGrid (included on show)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - domain
    ContactList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
        average_email_open_percent:
          type: number
          format: float
        average_email_click_percent:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
    ContactTag:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        color:
          type: string
          description: Brand palette hex color (e.g. "#FF644D").
        contacts_count:
          type: integer
          description: Number of contacts carrying the tag (included on list/show).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
    Automation:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        automation_triggers:
          type: array
          items:
            $ref: '#/components/schemas/AutomationTrigger'
        automation_items:
          type: array
          items:
            $ref: '#/components/schemas/AutomationItem'
    AutomationTrigger:
      type: object
      properties:
        id:
          type: integer
        automation_id:
          type: integer
        type:
          type: string
          enum:
          - apply_list
          - open_campaign
          - click_campaign
        list_id:
          type: integer
          nullable: true
        campaign_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AutomationItem:
      type: object
      properties:
        id:
          type: integer
        automation_id:
          type: integer
        campaign_id:
          type: integer
        delay_hours:
          type: integer
        send_order:
          type: integer
        campaign:
          $ref: '#/components/schemas/Campaign'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactFilter:
      type: object
      description: An engagement filter over the account's contacts. Every condition
        is AND-ed. Omitting the object entirely means "all contacts".
      properties:
        status:
          type: string
          enum:
          - active
          - engaged
          - inactive
          - new
          - unconfirmed
          - unsubscribed
          - bounced
          - invalid
        last_opened_after:
          type: string
          format: date-time
        last_opened_before:
          type: string
          format: date-time
          description: "Excludes contacts who never opened \u2014 use never_opened\
            \ for those"
        last_clicked_after:
          type: string
          format: date-time
        last_clicked_before:
          type: string
          format: date-time
        last_sent_after:
          type: string
          format: date-time
        last_sent_before:
          type: string
          format: date-time
        created_after:
          type: string
          format: date-time
        created_before:
          type: string
          format: date-time
        never_opened:
          type: boolean
        never_clicked:
          type: boolean
        never_sent:
          type: boolean
        in_list_ids:
          type: array
          items:
            type: integer
        not_in_list_ids:
          type: array
          items:
            type: integer
        tag_ids:
          type: array
          items:
            type: integer
        not_tag_ids:
          type: array
          items:
            type: integer
        opened_campaign_id:
          type: integer
          description: "Bulk actions only \u2014 not available on GET /contacts"
        not_opened_campaign_id:
          type: integer
          description: "Contacts the campaign sent to who did not open it. Bulk actions\
            \ only \u2014 not available on GET /contacts"
        clicked_campaign_id:
          type: integer
          description: "Bulk actions only \u2014 not available on GET /contacts"
    BulkContactAction:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        action:
          type: string
          enum:
          - apply_tag
          - remove_tag
          - add_to_list
          - remove_from_list
        target_id:
          type: integer
        dry_run:
          type: boolean
        filter:
          type: string
          description: Human-readable rendering of the filter that was applied
        matched_count:
          type: integer
          nullable: true
          description: Number of contacts the filter matched; null until counted
        processed_count:
          type: integer
        error:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    CampaignStats:
      type: object
      properties:
        link_stats:
          type: array
          description: "The campaign's links ranked by click count, most-clicked first.\
            \ Present only when include_link_stats is true \u2014 it is the one part\
            \ of this payload that queries rather than reading a stored counter."
          items:
            type: object
            properties:
              url:
                type: string
              clicks:
                type: integer
        sent_count:
          type: integer
        unique_open_count:
          type: integer
        unique_click_count:
          type: integer
        unsubscribe_count:
          type: integer
        bounce_count:
          type: integer
        spam_count:
          type: integer
        open_rate:
          type: number
          format: float
        click_rate:
          type: number
          format: float
        unsubscribe_rate:
          type: number
          format: float
        bounce_rate:
          type: number
          format: float
        spam_rate:
          type: number
          format: float
    BatchResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
security:
- bearerAuth: []
paths:
  /contacts:
    get:
      operationId: listContacts
      tags:
      - Contacts
      summary: List contacts
      description: "Returns a paginated list of contacts (100 per page by default,\
        \ up to 1000 via `per_page`).\n\nSupports engagement filtering through `filter[...]`\
        \ query parameters, so you can answer\nquestions like \"who last opened over\
        \ a year ago\" without paging the whole account. All\nfilter conditions are\
        \ AND-ed. Pass `count_only=true` to get just the number of matches \u2014\n\
        the cheapest way to size an audience before acting on it.\n"
      parameters:
      - name: query
        in: query
        schema:
          type: string
        description: Search query for filtering contacts
      - name: unsubscribed
        in: query
        schema:
          type: boolean
        description: Filter unsubscribed contacts
      - name: email
        in: query
        schema:
          type: string
        description: Filter by specific email
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Contacts per page
      - name: count_only
        in: query
        schema:
          type: boolean
        description: Return only the number of matching contacts, with no contact
          records
      - name: filter-status
        in: query
        schema:
          type: string
          enum:
          - active
          - engaged
          - inactive
          - new
          - unconfirmed
          - unsubscribed
          - bounced
          - invalid
        description: Engagement status
        x-url-name: filter[status]
      - name: filter-last-opened-after
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts whose most recent open is on or after this date
        x-url-name: filter[last_opened_after]
      - name: filter-last-opened-before
        in: query
        schema:
          type: string
          format: date-time
        description: "Contacts whose most recent open is before this date. Excludes\
          \ contacts who never opened \u2014 use filter[never_opened] for those."
        x-url-name: filter[last_opened_before]
      - name: filter-last-clicked-after
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts whose most recent click is on or after this date
        x-url-name: filter[last_clicked_after]
      - name: filter-last-clicked-before
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts whose most recent click is before this date
        x-url-name: filter[last_clicked_before]
      - name: filter-last-sent-after
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts last sent to on or after this date
        x-url-name: filter[last_sent_after]
      - name: filter-last-sent-before
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts last sent to before this date
        x-url-name: filter[last_sent_before]
      - name: filter-created-after
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts created on or after this date
        x-url-name: filter[created_after]
      - name: filter-created-before
        in: query
        schema:
          type: string
          format: date-time
        description: Contacts created before this date
        x-url-name: filter[created_before]
      - name: filter-never-opened
        in: query
        schema:
          type: boolean
        description: Only contacts who have never opened an email
        x-url-name: filter[never_opened]
      - name: filter-never-clicked
        in: query
        schema:
          type: boolean
        description: Only contacts who have never clicked a link
        x-url-name: filter[never_clicked]
      - name: filter-never-sent
        in: query
        schema:
          type: boolean
        description: Only contacts who have never been sent an email
        x-url-name: filter[never_sent]
      - name: filter-in-list-ids
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Only contacts in any of these lists
        x-url-name: filter[in_list_ids]
      - name: filter-not-in-list-ids
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Exclude contacts in any of these lists
        x-url-name: filter[not_in_list_ids]
      - name: filter-tag-ids
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Only contacts carrying any of these tags
        x-url-name: filter[tag_ids]
      - name: filter-not-tag-ids
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Exclude contacts carrying any of these tags
        x-url-name: filter[not_tag_ids]
      - name: page
        in: query
        description: Page number for paginated contacts; not used for count-only requests.
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Contact'
                    current_page:
                      type: integer
                    total:
                      type: integer
                    per_page:
                      type: integer
                - type: object
                  description: Returned when count_only is true
                  properties:
                    count:
                      type: integer
                    filter:
                      type: string
                      description: Human-readable rendering of the filter that was
                        applied
        '401':
          description: Unauthorized
        '422':
          description: Invalid filter, or a list/tag id the account does not own
      x-pp-resource: contacts
    post:
      operationId: createContact
      tags:
      - Contacts
      summary: Create a new contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                first_name:
                  type: string
                last_name:
                  type: string
                ip_address:
                  type: string
                lists:
                  type: array
                  items:
                    type: integer
                  description: Array of list IDs to add the contact to
                contact_fields:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Contact limit exceeded
      x-pp-resource: contacts
  /contacts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getContact
      tags:
      - Contacts
      summary: Get a specific contact
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contact not found
      x-pp-resource: contacts
    patch:
      operationId: updateContact
      tags:
      - Contacts
      summary: Update a contact
      description: Update contact details including name, list memberships, and custom
        fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                lists:
                  type: array
                  items:
                    type: integer
                  description: Array of list IDs (replaces all current list memberships)
                contact_fields:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                        nullable: true
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-pp-resource: contacts
    delete:
      operationId: deleteContact
      tags:
      - Contacts
      summary: Delete a contact
      description: Soft-deletes a contact and cancels any scheduled deliverables
      responses:
        '200':
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contact not found
      x-pp-resource: contacts
  /contacts/{id}/activity:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getContactActivity
      tags:
      - Contacts
      summary: Get email activity for a contact
      description: Returns paginated email deliverables and contact-level engagement
        summary
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    type: object
                    properties:
                      last_sent_at:
                        type: string
                        format: date-time
                        nullable: true
                      last_opened_at:
                        type: string
                        format: date-time
                        nullable: true
                      last_clicked_at:
                        type: string
                        format: date-time
                        nullable: true
                      unsubscribed_at:
                        type: string
                        format: date-time
                        nullable: true
                      bounced_at:
                        type: string
                        format: date-time
                        nullable: true
                  deliverables:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            campaign_title:
                              type: string
                            campaign_id:
                              type: integer
                            sent_at:
                              type: string
                              format: date-time
                              nullable: true
                            opened_at:
                              type: string
                              format: date-time
                              nullable: true
                            clicked_at:
                              type: string
                              format: date-time
                              nullable: true
                            bounced_at:
                              type: string
                              format: date-time
                              nullable: true
                            unsubscribed_at:
                              type: string
                              format: date-time
                              nullable: true
                            spam_at:
                              type: string
                              format: date-time
                              nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contact not found
      x-pp-resource: contacts
  /contacts/batch:
    post:
      operationId: batchImportContacts
      tags:
      - Contacts
      summary: Batch import contacts
      description: Import up to 1,000 contacts in a single request. Creates new contacts
        or updates existing ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required:
                    - email
                    properties:
                      email:
                        type: string
                        format: email
                      first_name:
                        type: string
                      last_name:
                        type: string
                      lists:
                        type: array
                        items:
                          type: integer
      responses:
        '200':
          description: Batch import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '402':
          description: Contact limit would be exceeded
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-pp-resource: contacts
  /contacts/bulk-actions:
    post:
      operationId: createBulkContactAction
      tags:
      - Contacts
      summary: Apply a tag or list change to every contact matching a filter
      description: "Queues one action against every contact the filter matches, applied\
        \ in chunks in the\nbackground. Returns immediately with an id to poll.\n\n\
        **Run with `dry_run: true` first.** A dry run reports how many contacts match\
        \ and changes\nnothing \u2014 it is the only way to catch a filter that matches\
        \ more than intended, and a bulk\nwrite is not undoable. An empty filter (which\
        \ would match the whole account) is rejected\nunless it is a dry run.\n\n\
        Per-campaign conditions (`opened_campaign_id`, `not_opened_campaign_id`,\n\
        `clicked_campaign_id`) are available here but not on `GET /contacts`, because\
        \ they are\nresolved in the background rather than inside a request.\n\nBulk\
        \ delete and bulk unsubscribe are deliberately not offered.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - target_id
              properties:
                action:
                  type: string
                  enum:
                  - apply_tag
                  - remove_tag
                  - add_to_list
                  - remove_from_list
                target_id:
                  type: integer
                  description: The tag id (apply_tag/remove_tag) or list id (add_to_list/remove_from_list)
                dry_run:
                  type: boolean
                  default: false
                  description: "When true, only count the matches \u2014 nothing is\
                    \ modified"
                filter:
                  $ref: '#/components/schemas/ContactFilter'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkContactAction'
        '403':
          description: The account is restricted
        '422':
          description: Invalid filter, an unowned target or filter id, or an empty
            filter on a non-dry run
      x-pp-resource: contacts
