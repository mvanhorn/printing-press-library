      summary: Update a draft campaign
      description: Only draft campaigns (not yet sent) can be updated. All fields
        are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 191
                subject:
                  type: string
                  maxLength: 191
                preview_text:
                  type: string
                  maxLength: 191
                  nullable: true
                  description: Inbox preview snippet. Pass null to clear.
                html:
                  type: string
                  maxLength: 1000000
                from_name:
                  type: string
                  maxLength: 191
                from_email:
                  type: string
                  format: email
                  maxLength: 191
                scheduled_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Set to null to unschedule, or a datetime to schedule
                lists:
                  type: array
                  items:
                    type: integer
                  description: Replaces all list assignments
                excluded_lists:
                  type: array
                  items:
                    type: integer
                  description: Replaces the excluded lists (contacts in these lists
                    are removed from the send).
                to_contact_tags:
                  type: array
                  items:
                    type: integer
                  description: Replaces the included tag audience (contacts carrying
                    these tags receive the campaign).
                excluded_contact_tags:
                  type: array
                  items:
                    type: integer
                  description: Replaces the excluded tag audience (contacts carrying
                    these tags are removed from the send).
      responses:
        '200':
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Campaign already sent, or a scheduled_at was supplied for a
            confirmation (double opt-in) email. A confirmation email is delivered
            to each contact as they subscribe and cannot be scheduled; its content
            can still be updated.
        '422':
          description: Validation error
      x-pp-resource: campaigns
    delete:
      operationId: deleteCampaign
      tags:
      - Campaigns
      summary: Delete a draft campaign
      description: Only draft campaigns (not yet sent) can be deleted. Uses soft delete.
      responses:
        '200':
          description: Campaign deleted
          content:
            application/json:
              schema:
                type: object
                properties:
