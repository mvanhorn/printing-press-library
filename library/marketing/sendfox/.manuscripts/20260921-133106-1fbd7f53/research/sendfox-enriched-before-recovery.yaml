      - name: page
        in: query
        description: Page number for the documented paginated response.
        schema:
          type: integer
          minimum: 1
          default: 1
    post:
      operationId: createCampaign
      tags:
      - Campaigns
      summary: Create a new campaign
      description: 'Creates a campaign as a draft. To send it, use the send endpoint
        or provide scheduled_at.

        Subject lines cannot start with "RE:" or "FWD:".

        At least one list is required if scheduled_at is provided.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 191
                subject:
                  type: string
                  maxLength: 191
                preview_text:
                  type: string
                  maxLength: 191
                  nullable: true
                  description: Inbox preview snippet shown beneath the subject line.
                    Optional.
                html:
                  type: string
                  maxLength: 1000000
                  description: Email body HTML content
                from_name:
                  type: string
                  maxLength: 191
                from_email:
                  type: string
                  format: email
                  maxLength: 191
                scheduled_at:
                  type: string
                  format: date-time
                  description: Schedule send time (omit for draft). Must include at
                    least one list.
                lists:
                  type: array
                  items:
                    type: integer
                  description: Array of list IDs to send to
                excluded_lists:
                  type: array
                  items:
                    type: integer
                  description: List IDs whose contacts should be excluded from the
                    send. Exclusion wins over inclusion.
                to_contact_tags:
                  type: array
                  items:
                    type: integer
                  description: Tag IDs whose contacts should receive the campaign.
                    Can be combined with lists.
                excluded_contact_tags:
                  type: array
                  items:
                    type: integer
                  description: Tag IDs whose contacts should be excluded from the
                    send. Exclusion wins over inclusion.
              required:
              - title
              - subject
              - html
              - from_name
              - from_email
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '403':
          description: Forbidden (not subscribed or cannot schedule)
        '422':
          description: Validation error or configuration required (e.g., timezone
            not set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-pp-resource: campaigns
