      parameters:
      - name: page
        in: query
        description: Page number for the documented paginated response.
        schema:
          type: integer
          minimum: 1
          default: 1
    post:
      operationId: createContactField
      tags:
      - Contact Fields
      summary: Create a custom contact field
      description: 'Creates a custom field for contacts. The `name` is auto-generated
        from the `label` as a slug.


        `contact_field_type_id` is a fixed UUID identifying the field''s data type.
        It is the same

        for every account, and the type *names* are not accepted as input:


        | Type   | `contact_field_type_id`                |

        | ------ | -------------------------------------- |

        | text   | `0abe5601-7738-43c8-858f-81911ecf89ee` |

        | number | `e43c6471-b3ff-4541-80c5-964c62decd15` |

        | date   | `fe7dd76c-5113-4159-bc7c-0dbf0ed8d404` |


        The value is immutable after creation and is not returned by any endpoint
        - responses

        carry the human-readable `type` (`text`, `number`, `date`) instead.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 191
                  description: Human-readable field label
                contact_field_type_id:
                  type: string
                  description: UUID of the field's data type. Must be one of the enumerated
                    values below; the names `text`, `number` and `date` are not accepted.
                  enum:
                  - 0abe5601-7738-43c8-858f-81911ecf89ee
                  - e43c6471-b3ff-4541-80c5-964c62decd15
                  - fe7dd76c-5113-4159-bc7c-0dbf0ed8d404
                  example: 0abe5601-7738-43c8-858f-81911ecf89ee
              required:
              - label
              - contact_field_type_id
      responses:
        '201':
          description: Contact field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContactField'
        '422':
          description: Validation error
      x-pp-resource: contact-fields
