            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: search
            type: string
            description: "Match on distinct ID, city, browser, OS, or device"
          - name: page
            type: int
            default: 1
            description: "Page number"
          - name: pageSize
            flag_name: page-size
            type: int
            default: 20
            description: "Results per page"
          - name: country
            type: string
            description: "Filter by 2-letter country code"
          - name: browser
            type: string
            description: "Filter by browser name"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1783500000000;--page-size=5"
        response:
          type: array
          item: Session
        response_path: data
      stats:
        method: GET
        path: "/api/websites/{website_id}/sessions/stats"
        description: "Session-level summary: pageviews, visitors, visits, countries, events"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1783500000000"
      weekly:
        method: GET
        path: "/api/websites/{website_id}/sessions/weekly"
        description: "7x24 day-of-week by hour session heatmap counts"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: timezone
            type: string
            default: UTC
            description: "IANA timezone (e.g. Europe/Paris)"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1783500000000"
      get:
        method: GET
        path: "/api/websites/{website_id}/sessions/{session_id}"
        description: "Single session detail (totals, first/last seen, device, geo)"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: session_id
            type: string
            required: true
            positional: true
            description: "Session UUID"
        response:
          type: object
          item: SessionDetail
      activity:
        method: GET
        path: "/api/websites/{website_id}/sessions/{session_id}/activity"
        description: "Chronological pageviews and events of one session"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: session_id
            type: string
            required: true
            positional: true
            description: "Session UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
      properties:
        method: GET
        path: "/api/websites/{website_id}/sessions/{session_id}/properties"
        description: "Identify-data properties attached to one session"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: session_id
            type: string
            required: true
            positional: true
            description: "Session UUID"

  events:
