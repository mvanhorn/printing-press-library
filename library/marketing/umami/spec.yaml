  send:
    description: "Send tracking data (no auth; the collection endpoint)"
    endpoints:
      event:
        method: POST
        path: "/api/send"
        description: "Send a pageview, custom event, or identify payload (requires a realistic User-Agent)"
        no_auth: true
        example: "  umami-pp-cli send --type event --payload '{\"website\":\"f1fa838a-fc6a-49c1-bdef-c3688dc92574\",\"url\":\"/cli-test\",\"name\":\"cli_smoke\"}'"
        body:
          - name: type
            type: string
            required: true
            default: event
            enum: [event, identify, performance]
            description: "Payload type"
          - name: payload
            type: object
            required: true
            description: "JSON: {website (uuid), url?, referrer?, title?, hostname?, name? (event), data?, tag?, id?}"

  config:
    description: "Instance configuration"
    endpoints:
      get:
        method: GET
        path: "/api/config"
        description: "Public instance config: cloud mode, private mode, tracker script name"
        no_auth: true

