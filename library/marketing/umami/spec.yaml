name: umami
description: "Umami Analytics v3 CLI — full API coverage with a local mirror for portfolio rollups, SEO deltas, and anomaly detection"
version: "0.1.0"
base_url: "http://localhost:3000"
health_check_path: "/api/heartbeat"
category: marketing

auth:
  type: bearer_token
  header: "Authorization"
  format: "Bearer {token}"
  env_vars:
    - UMAMI_TOKEN
    - UMAMI_API_KEY

config:
  format: toml
  path: "~/.config/umami-pp-cli/config.toml"

cache:
  enabled: true
  stale_after: 24h

mcp:
  transport: [stdio, http]
  orchestration: code
  endpoint_tools: hidden

resources:
  websites:
    description: "Manage websites and query their traffic stats"
    endpoints:
      list:
        method: GET
        path: "/api/websites"
        description: "List all websites the account can access"
        example: "  umami-pp-cli websites list --page-size 50"
        params:
          - name: search
            type: string
            description: "Filter websites by name or domain"
          - name: page
            type: int
            default: 1
            description: "Page number"
          - name: pageSize
            flag_name: page-size
            type: int
            default: 20
            description: "Results per page"
          - name: includeTeams
            flag_name: include-teams
            type: bool
            description: "Include team-owned websites"
        response:
          type: array
          item: Website
        response_path: data
      get:
        method: GET
        path: "/api/websites/{website_id}"
        description: "Get a website by ID"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574"
        response:
          type: object
          item: Website
      create:
        method: POST
        path: "/api/websites"
        description: "Create a new website"
        body:
          - name: name
            type: string
            required: true
            description: "Website display name"
          - name: domain
            type: string
            required: true
            description: "Website domain (e.g. example.com)"
          - name: teamId
            flag_name: team-id
            type: string
            description: "Team UUID to own the website"
        response:
          type: object
          item: Website
      update:
        method: POST
        path: "/api/websites/{website_id}"
        description: "Update a website's name, domain, or share ID"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
        body:
          - name: name
            type: string
            description: "New display name"
          - name: domain
            type: string
            description: "New domain"
          - name: shareId
            flag_name: share-id
            type: string
            description: "Public share ID"
        response:
          type: object
          item: Website
      delete:
        method: DELETE
        path: "/api/websites/{website_id}"
        description: "Delete a website and all its data"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
      reset:
        method: POST
        path: "/api/websites/{website_id}/reset"
        description: "Wipe all collected data for a website (irreversible)"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
      transfer:
        method: POST
        path: "/api/websites/{website_id}/transfer"
        description: "Transfer a website to a user or a team"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
        body:
          - name: userId
            flag_name: user-id
            type: string
            description: "Destination user UUID (exactly one of --user-id / --team-id)"
          - name: teamId
            flag_name: team-id
            type: string
            description: "Destination team UUID (exactly one of --user-id / --team-id)"
      active:
        method: GET
        path: "/api/websites/{website_id}/active"
        description: "Visitors active in the last 5 minutes"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574"
      daterange:
        method: GET
        path: "/api/websites/{website_id}/daterange"
        description: "First and last collected data timestamps"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574"
      values:
        method: GET
        path: "/api/websites/{website_id}/values"
        description: "Distinct values for a filter field (autocomplete helper)"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: type
            type: string
            required: true
            enum: [path, referrer, title, query, os, browser, device, country, region, city, tag, hostname, distinctId, language, event, utmSource, utmMedium, utmCampaign, utmContent, utmTerm]
            description: "Field to list distinct values for"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: search
            type: string
            description: "Filter values containing this text"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--type=path;--start-at=1746000000000;--end-at=1783500000000"
      stats:
        method: GET
        path: "/api/websites/{website_id}/stats"
        description: "Traffic summary: pageviews, visitors, visits, bounces, total time (with optional prev/yoy comparison)"
        example: "  umami-pp-cli websites stats f1fa838a-fc6a-49c1-bdef-c3688dc92574 --start-at 1746000000000 --end-at 1783500000000 --compare prev"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: compare
            type: string
            enum: [prev, yoy]
            description: "Add a comparison period: prev (previous equal-length) or yoy (one year back)"
          - name: path
            type: string
            description: "Filter by URL path (v3 name; operator prefixes like c.blog supported)"
          - name: referrer
            type: string
            description: "Filter by referrer domain"
          - name: country
            type: string
            description: "Filter by 2-letter country code"
          - name: browser
            type: string
            description: "Filter by browser name"
          - name: os
            type: string
            description: "Filter by operating system"
          - name: device
            type: string
            description: "Filter by device type (desktop, mobile, tablet)"
          - name: event
            type: string
            description: "Filter by custom event name"
          - name: hostname
            type: string
            description: "Filter by hostname (v3 name for host)"
          - name: tag
            type: string
            description: "Filter by tag"
          - name: utmSource
            flag_name: utm-source
            type: string
            description: "Filter by utm_source"
          - name: utmMedium
            flag_name: utm-medium
            type: string
            description: "Filter by utm_medium"
          - name: utmCampaign
            flag_name: utm-campaign
            type: string
            description: "Filter by utm_campaign"
          - name: segment
            type: string
            description: "Saved segment UUID to apply"
          - name: cohort
            type: string
            description: "Saved cohort UUID to apply"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1783500000000"
      pageviews:
        method: GET
        path: "/api/websites/{website_id}/pageviews"
        description: "Pageviews and sessions time series"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: unit
            type: string
            default: day
            enum: [year, month, day, hour, minute]
            description: "Series bucket size"
          - name: timezone
            type: string
            default: UTC
            description: "IANA timezone for bucketing (e.g. Europe/Paris)"
          - name: compare
            type: string
            enum: [prev, yoy]
            description: "Add a comparison series"
          - name: path
            type: string
            description: "Filter by URL path"
          - name: referrer
            type: string
            description: "Filter by referrer domain"
          - name: country
            type: string
            description: "Filter by 2-letter country code"
          - name: event
            type: string
            description: "Filter by custom event name"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1783500000000"
      metrics:
        method: GET
        path: "/api/websites/{website_id}/metrics"
        description: "Top-N breakdown for one dimension (path, referrer, country, channel, event, ...)"
        example: "  umami-pp-cli websites metrics f1fa838a-fc6a-49c1-bdef-c3688dc92574 --type referrer --start-at 1746000000000 --end-at 1783500000000 --limit 10"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: type
            type: string
            required: true
            enum: [path, fullPath, entry, exit, referrer, domain, title, query, event, tag, hostname, utmSource, utmMedium, utmCampaign, utmContent, utmTerm, browser, os, device, screen, language, country, city, region, distinctId, channel]
            description: "Dimension to break down by (v3 names: path not url, hostname not host)"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: limit
            type: int
            default: 500
            description: "Max rows returned"
          - name: offset
            type: int
            description: "Rows to skip"
          - name: search
            type: string
            description: "Contains-match on the dimension value"
          - name: path
            type: string
            description: "Filter by URL path"
          - name: referrer
            type: string
            description: "Filter by referrer domain"
          - name: country
            type: string
            description: "Filter by 2-letter country code"
          - name: event
            type: string
            description: "Filter by custom event name"
          - name: segment
            type: string
            description: "Saved segment UUID to apply"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--type=referrer;--start-at=1746000000000;--end-at=1783500000000;--limit=10"
        response:
          type: array
          item: MetricRow
      metrics-expanded:
        method: GET
        path: "/api/websites/{website_id}/metrics/expanded"
        description: "Top-N breakdown with full per-item stats (pageviews, visitors, visits, bounces, totaltime)"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: type
            type: string
            required: true
            enum: [path, entry, exit, referrer, title, query, event, tag, hostname, browser, os, device, country, city, region, channel]
            description: "Dimension to break down by"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: limit
            type: int
            default: 100
            description: "Max rows returned"
          - name: search
            type: string
            description: "Contains-match on the dimension value"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--type=path;--start-at=1746000000000;--end-at=1783500000000;--limit=10"
        response:
          type: array
          item: ExpandedMetric

  sessions:
    description: "Query visitor sessions"
