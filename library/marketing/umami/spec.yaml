      stats:
        method: GET
        path: "/api/websites/{website_id}/event-data/stats"
        description: "Totals of events, properties, and records"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1783500000000"
      pivot:
        method: GET
        path: "/api/websites/{website_id}/event-data-pivot"
        description: "Pivoted event rows with property keys and values"
        happy_args: "website_id=f1fa838a-fc6a-49c1-bdef-c3688dc92574;--start-at=1746000000000;--end-at=1793500000000;--event-name=cli_smoke"
        params:
          - name: website_id
            type: string
            required: true
            positional: true
            description: "Website UUID"
          - name: startAt
            flag_name: start-at
            type: int
            required: true
            description: "Range start (epoch milliseconds)"
          - name: endAt
            flag_name: end-at
            type: int
            required: true
            description: "Range end (epoch milliseconds)"
          - name: eventName
            flag_name: event-name
            type: string
            description: "Restrict to one event name"
          - name: page
            type: int
            default: 1
            description: "Page number"
          - name: pageSize
            flag_name: page-size
            type: int
