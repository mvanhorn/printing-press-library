version: 2
project_name: traffic-intel-pp-cli
changelog:
  disable: true
builds:
  - id: traffic-intel-pp-cli
    main: ./cmd/traffic-intel-pp-cli
    binary: traffic-intel-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/traffic-intel/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: traffic-intel-pp-cli
    repository:
      owner: user
      name: homebrew-tap
    homepage: "https://github.com/cathrynlavery/printing-press-library-private"
    description: "Private combined SEO and traffic intelligence CLI for GSC, GA4, and Ahrefs evidence."
    install: |
      bin.install "traffic-intel-pp-cli"
