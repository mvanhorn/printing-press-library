version: 2
project_name: pinterest-pp-cli
changelog:
  disable: true
builds:
  - id: pinterest-pp-cli
    main: ./cmd/pinterest-pp-cli
    binary: pinterest-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X pinterest-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: pinterest-pp-mcp
    main: ./cmd/pinterest-pp-mcp
    binary: pinterest-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: pinterest-pp-cli
    repository:
      owner: shourovchowdhury91-debug
      name: homebrew-tap
    homepage: "https://github.com/shourovchowdhury91-debug/pinterest-pp-cli"
    description: "Every Pinterest board, pin, and ad — plus offline analytics no other tool can answer in a single command."
    install: |
      bin.install "pinterest-pp-cli"
      bin.install "pinterest-pp-mcp"
