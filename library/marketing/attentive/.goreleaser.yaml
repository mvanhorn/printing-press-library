version: 2
project_name: attentive-pp-cli
changelog:
  disable: true
builds:
  - id: attentive-pp-cli
    main: ./cmd/attentive-pp-cli
    binary: attentive-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X attentive-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: attentive-pp-mcp
    main: ./cmd/attentive-pp-mcp
    binary: attentive-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: attentive-pp-cli
    repository:
      owner: debgotwired
      name: homebrew-tap
    homepage: "https://github.com/debgotwired/attentive-pp-cli"
    description: "For any questions, reach out to your Attentive point of contact (if applicable) or [api@attentivemobile."
    install: |
      bin.install "attentive-pp-cli"
      bin.install "attentive-pp-mcp"
