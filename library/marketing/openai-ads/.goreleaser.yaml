version: 2
project_name: openai-ads-pp-cli
changelog:
  disable: true
builds:
  - id: openai-ads-pp-cli
    main: ./cmd/openai-ads-pp-cli
    binary: openai-ads-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/openai-ads/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: openai-ads-pp-mcp
    main: ./cmd/openai-ads-pp-mcp
    binary: openai-ads-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: openai-ads-pp-cli
    repository:
      owner: bobeglz
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The first OpenAI Ads client that can write, and the only one that keeps local history."
    install: |
      bin.install "openai-ads-pp-cli"
      bin.install "openai-ads-pp-mcp"
