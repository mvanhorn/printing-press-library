# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "openai-ads-pp-cli"
display_name = "OpenAI Ads"
description = "The first OpenAI Ads client that can write, and the only one that keeps local history."
project_kind = "cli"

[secrets.file]
path = "~/.config/openai-ads-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
OPENAI_ADS_API_KEY = true
OPENAI_ADS_CONVERSIONS_API_KEY = true
