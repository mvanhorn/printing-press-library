version: 2
project_name: kickstarter-pp-cli
changelog:
  disable: true
builds:
  - id: kickstarter-pp-cli
    main: ./cmd/kickstarter-pp-cli
    binary: kickstarter-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/kickstarter/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: kickstarter-pp-mcp
    main: ./cmd/kickstarter-pp-mcp
    binary: kickstarter-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: kickstarter-pp-cli
    repository:
      owner: usc-tk
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Kickstarter scraper, plus the first programmatic Magazine path and a Surf transport that clears Cloudflare..."
    install: |
      bin.install "kickstarter-pp-cli"
      bin.install "kickstarter-pp-mcp"
