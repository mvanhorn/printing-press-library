version: 2
project_name: zoho-campaigns-pp-cli
changelog:
  disable: true
builds:
  - id: zoho-campaigns-pp-cli
    main: ./cmd/zoho-campaigns-pp-cli
    binary: zoho-campaigns-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/zoho-campaigns/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: zoho-campaigns-pp-mcp
    main: ./cmd/zoho-campaigns-pp-mcp
    binary: zoho-campaigns-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: zoho-campaigns-pp-cli
    repository:
      owner: kentrichardmartin
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Zoho Campaigns operation, plus report history, offline search, and headless self-refreshing OAuth no other tool has."
    install: |
      bin.install "zoho-campaigns-pp-cli"
      bin.install "zoho-campaigns-pp-mcp"
