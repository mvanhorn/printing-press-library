version: 2
project_name: postscript-pp-cli
changelog:
  disable: true
builds:
  - id: postscript-pp-cli
    main: ./cmd/postscript-pp-cli
    binary: postscript-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X postscript-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: postscript-pp-mcp
    main: ./cmd/postscript-pp-mcp
    binary: postscript-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: postscript-pp-cli
    repository:
      owner: debgotwired
      name: homebrew-tap
    homepage: "https://github.com/debgotwired/postscript-pp-cli"
    description: "Compact OpenAPI spec assembled from the official Postscript ReadMe endpoint pages listed in https://developers."
    install: |
      bin.install "postscript-pp-cli"
      bin.install "postscript-pp-mcp"
