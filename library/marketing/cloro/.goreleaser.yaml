version: 2
project_name: cloro-pp-cli
changelog:
  disable: true
builds:
  - id: cloro-pp-cli
    main: ./cmd/cloro-pp-cli
    binary: cloro-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/cloro/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: cloro-pp-mcp
    main: ./cmd/cloro-pp-mcp
    binary: cloro-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: cloro-pp-cli
    repository:
      owner: rbatista191
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "ChatGPT, Google AI Mode and Gemini answers with their cited sources, Google results with the AI Overview, and a citation check across engines."
    install: |
      bin.install "cloro-pp-cli"
      bin.install "cloro-pp-mcp"
