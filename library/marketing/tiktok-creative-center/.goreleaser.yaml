version: 2
project_name: tiktok-creative-center-pp-cli
changelog:
  disable: true
builds:
  - id: tiktok-creative-center-pp-cli
    main: ./cmd/tiktok-creative-center-pp-cli
    binary: tiktok-creative-center-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/tiktok-creative-center/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: tiktok-creative-center-pp-mcp
    main: ./cmd/tiktok-creative-center-pp-mcp
    binary: tiktok-creative-center-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: tiktok-creative-center-pp-cli
    repository:
      owner: jtz18
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "TikTok trending hashtags, viral content"
    install: |
      bin.install "tiktok-creative-center-pp-cli"
      bin.install "tiktok-creative-center-pp-mcp"
