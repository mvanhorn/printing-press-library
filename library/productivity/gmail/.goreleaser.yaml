version: 2
project_name: gmail-pp-cli
changelog:
  disable: true
builds:
  - id: gmail-pp-cli
    main: ./cmd/gmail-pp-cli
    binary: gmail-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/gmail/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: gmail-pp-mcp
    main: ./cmd/gmail-pp-mcp
    binary: gmail-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: gmail-pp-cli
    repository:
      owner: rahulbansal16
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Gmail API surface plus the things Gmail itself will not give you: scheduled sends, sender analytics, follow-up tracking, and an offline full-text mailbox."
    install: |
      bin.install "gmail-pp-cli"
      bin.install "gmail-pp-mcp"
