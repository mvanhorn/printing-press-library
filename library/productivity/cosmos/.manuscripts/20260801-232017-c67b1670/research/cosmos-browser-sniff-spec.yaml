                cover {
                  url
                  notSafeForWorkStatus
                  __typename
                }
                __typename
              }
              __typename
            }

            fragment GlobalSearchTermRecentSearchListItem on SearchTermGlobalSearchHistoryEntry {
              searchTerm
              __typename
