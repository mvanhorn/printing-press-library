  alls:
    description: GraphQL BFF operations for alls
    endpoints:
      elements:
        method: POST
        path: "/graphql"
        description: Fetch alls elements
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: GetAllElements
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: |-
            query GetAllElements($userId: UserId!, $filters: AllElementsFilters, $order: ElementOrder, $pageCursor: String, $pageSize: Int = 40, $isLoggedIn: Boolean!) {
              allElementsV2(
                userId: $userId
                filters: $filters
                order: $order
                meta: {pageSize: $pageSize, pageCursor: $pageCursor}
              ) {
                items {
                  ...ElementTile
                  userContext(userId: $userId) @include(if: $isLoggedIn) {
                    ...ElementUserContext
                    __typename
                  }
                  __typename
                }
                meta {
                  nextPageCursor
                  count
                  __typename
                }
                __typename
              }
            }

            fragment ElementTile on ElementTile {
              __typename
              id
              processingState
              contentAccessibility
              createdAt
              isFeatured
              isReadyToShow
              hasIllegalReports
              ownerId
              owner {
                username
                isVerifiedProfile
                verifiedProfile {
                  slug
                  avatarUrl
                  avatarThumbnailCropParameters {
                    width
                    height
                    __typename
                  }
                  __typename
                }
                __typename
              }
              shareUrl
              originalClusterId
              generatedCaption {
                text
                __typename
              }
              source {
                ...ElementSource
                __typename
              }
              ... on MediaElementTile {
                hasMoreMedia
                multipleMedia {
                  ...ElementMedia
                  __typename
                }
                media {
                  ...ElementMedia
                  __typename
                }
                __typename
              }
              ... on ProductElementTile {
                media {
                  ...ElementMedia
                  __typename
                }
                productPrice: price {
                  value
                  currency
                  __typename
                }
                productBrand: brand
                productTitle: name
                productDescription: description
                __typename
              }
              ... on WebsiteElementTile {
                media {
                  ...ElementMedia
                  __typename
                }
                websiteTitle: title
                websiteDescription: description
                __typename
              }
              ... on TextElementTile {
                text
                __typename
              }
            }

            fragment ElementMedia on Media {
              mediaId
              url
              width
              height
              notSafeForWorkStatus
              aiGenerated
              __typename
              ... on StaticImage {
                blurHash
                __typename
              }
              ... on AnimatedImage {
                blurHash
                video {
                  url
                  thumbnailUrl
                  __typename
                }
                __typename
              }
              ... on Video {
                thumbnail {
                  hash
                  url
                  __typename
                }
                duration
                isStored
                mux {
                  playbackUrl
                  mp4Url(quality: LOW)
                  downloadableUrl: mp4Url(quality: HIGH)
                  __typename
                }
                width
                height
                __typename
              }
              ... on Media {
                __typename
              }
            }

            fragment ElementSource on ElementSource {
              url
              isEditable
              isPublicDomain
              author {
                username
                fullName
                profileUrl
                avatarUrl
                __typename
