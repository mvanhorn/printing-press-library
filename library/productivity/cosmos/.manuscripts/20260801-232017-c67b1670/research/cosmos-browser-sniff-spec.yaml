---
name: cosmos
description: Discovered API spec for cosmos
version: 0.1.0
base_url: https://api.cosmos.so
spec_source: sniffed
http_transport: standard
auth:
  type: bearer_token
  header: Authorization
  format: ''
  env_vars:
  - COSMOS_TOKEN
  env_var_specs:
  - name: COSMOS_TOKEN
    kind: per_call
    required: true
    sensitive: true
    inferred: true
auth_warnings:
- 'rejected auth candidate "q" from query: search input'
- 'rejected auth candidate "query" from body: search input'
config:
  format: toml
  path: "~/.config/cosmos-pp-cli/config.toml"
resources:
  actives:
    description: GraphQL BFF operations for actives
    endpoints:
      imports:
        method: POST
        path: "/graphql"
        description: Fetch actives imports
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: GetActiveImports
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: |-
            query GetActiveImports($userId: UserId!, $clusterId: ClusterId) {
              activeImports(userId: $userId, clusterId: $clusterId) {
                items {
                  userId
                  sourceUrl
                  sourceType
                  numberOfElements
                  clusterId
                  status
                  __typename
                }
                importProgressTracker {
                  totalElementsInImport
                  elementsImported
                  __typename
                }
                meta {
                  pageSize
                  count
                  __typename
                }
                __typename
              }
            }
          description: GraphQL query document
          fields: []
        - name: variables
          type: object
          required: false
          positional: false
          default: {}
          description: GraphQL variables as JSON
          fields: []
        - name: extensions
          type: object
          required: false
          positional: false
          default:
            clientLibrary:
              name: "@apollo/client"
              version: 4.1.4
          description: GraphQL extensions as JSON
          fields: []
        response:
          type: object
          item: get_active_imports
        pagination:
        observed_auth:
        - authorization
  activities:
    description: GraphQL BFF operations for activities
    endpoints:
      get:
        method: POST
        path: "/graphql"
        description: Fetch activities
        params: []
        body:
        - name: operationName
          type: string
          required: true
          positional: false
          default: GetActivities
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: |-
            query GetActivities($ownerId: UserId!, $start: DateTime, $end: DateTime, $onlyFollows: Boolean, $pageCursor: String) {
              activityFeed(
                meta: {pageSize: 16, pageCursor: $pageCursor}
                filters: {ownerId: $ownerId, start: $start, end: $end, onlyFollows: $onlyFollows}
              ) {
                items {
                  ...ActivityLogEntry
                  __typename
                }
                meta {
                  nextPageCursor
                  __typename
                }
                __typename
              }
            }

            fragment ActivityLogEntry on ActivityInterface {
              id
              isRead
              createdAt
              ...ClusterFollowerClusterCreatedActivityLogEntry
              ...CollaborationInviteActivityLogEntry
              ...UserFollowerClusterCreatedActivityLogEntry
              ...ClusterFollowerClusterCreatedActivityLogEntry
              ...UserFollowedActivityLogEntry
              ...UserConnectedYourElementAggregatableActivityLogEntry
              ...UserConnectedElementToCollaborativeClusterAggregatableActivityLogEntry
              ...UsersFollowedYourClusterAggregatableActivityLogEntry
              ...ImportCompleteAtomicActivityLogEntry
              ...ImportFailedAtomicActivityLogEntry
              ...UserAcceptedCollaborationInviteAtomicActivityLogEntry
              __typename
            }

            fragment ClusterFollowerClusterCreatedActivityLogEntry on ClusterFollowerClusterCreatedActivity {
              id
              ownerId
              isRead
              createdAt
              creator {
                ...UserPublicProfile
                __typename
              }
              cluster {
                id
                name
                slug
                owner {
                  id
                  username
                  __typename
                }
                cover {
                  url
                  blurHash
                  notSafeForWorkStatus
                  aiGenerated
                  __typename
                }
                parentCluster {
                  id
                  slug
                  name
                  __typename
                }
                __typename
              }
              __typename
            }

            fragment UserPublicProfile on UserPublicProfile {
              id
              fullName
              username
              avatarUrl
              isPremium
              isVerifiedProfile
              publicElementsCluster {
                id
                numberOfElements
                __typename
              }
              verifiedProfile {
                ...VerifiedProfile
                __typename
              }
              __typename
            }

            fragment VerifiedProfile on VerifiedProfile {
              __typename
              id
              slug
              isPublic
              status
              name
              avatarUrl
              avatarThumbnailCropParameters {
                width
                height
                __typename
              }
              coverImage {
                url
                hash
                thumbnailUrl
                __typename
              }
            }

            fragment CollaborationInviteActivityLogEntry on CollaborationInviteActivity {
