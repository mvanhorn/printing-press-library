        - name: variables
          type: object
          required: false
          positional: false
          default: {}
          description: GraphQL variables as JSON
          fields: []
        - name: extensions
          type: object
          required: false
          positional: false
          default:
            clientLibrary:
              name: "@apollo/client"
              version: 4.1.4
          description: GraphQL extensions as JSON
          fields: []
        response:
