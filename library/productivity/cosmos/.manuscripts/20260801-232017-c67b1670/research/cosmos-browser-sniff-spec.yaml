            fragment ElementMedia on Media {
              mediaId
              url
              width
              height
              notSafeForWorkStatus
              aiGenerated
              __typename
              ... on StaticImage {
                blurHash
                __typename
              }
              ... on AnimatedImage {
                blurHash
                video {
                  url
                  thumbnailUrl
                  __typename
                }
                __typename
              }
              ... on Video {
                thumbnail {
                  hash
