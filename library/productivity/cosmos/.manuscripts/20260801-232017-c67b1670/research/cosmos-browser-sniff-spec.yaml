          required: true
          positional: false
          default: GetAllElementsCount
          description: GraphQL operation name
          fields: []
        - name: query
          type: string
          required: false
          positional: false
          default: |-
            query GetAllElementsCount($userId: UserId!) {
              allElementsV2(userId: $userId) {
