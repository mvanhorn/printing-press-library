version: 2
project_name: zotero-research-library-pp-cli
changelog:
  disable: true
builds:
  - id: zotero-research-library-pp-cli
    main: ./cmd/zotero-research-library-pp-cli
    binary: zotero-research-library-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/zotero-research-library/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: zotero-research-library-pp-mcp
    main: ./cmd/zotero-research-library-pp-mcp
    binary: zotero-research-library-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: zotero-research-library-pp-cli
    repository:
      owner: erash11
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Your entire Zotero research library, searchable offline — version-based incremental sync into SQLite with full-text search no other Zotero tool has."
    install: |
      bin.install "zotero-research-library-pp-cli"
      bin.install "zotero-research-library-pp-mcp"
