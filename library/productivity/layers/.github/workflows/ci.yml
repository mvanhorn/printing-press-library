name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/layers-pp-cli ./cmd/layers-pp-mcp
