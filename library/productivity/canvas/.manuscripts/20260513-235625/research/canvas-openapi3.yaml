      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quiz[title]:
                  type: string
                  description: The quiz title.
                quiz[description]:
                  type: string
                  description: A description of the quiz.
                quiz[quiz_type]:
                  type: string
                  description: The type of quiz.
                quiz[assignment_group_id]:
                  type: integer
                  description: 'The assignment group id to put the assignment in.
                    Defaults to the top

                    assignment group in the course. Only valid if the quiz is graded,
                    i.e. if

                    quiz_type is "assignment" or "graded_survey".'
                quiz[time_limit]:
                  type: integer
                  description: 'Time limit to take this quiz, in minutes. Set to null
                    for no time limit.

                    Defaults to null.'
                quiz[shuffle_answers]:
                  type: boolean
                  description: 'If true, quiz answers for multiple choice questions
                    will be randomized for

                    each student. Defaults to false.'
                quiz[hide_results]:
                  type: string
                  description: 'Dictates whether or not quiz results are hidden from
                    students.

                    If null, students can see their results after any attempt.

                    If "always", students can never see their results.

                    If "until_after_last_attempt", students can only see results after
                    their

                    last attempt. (Only valid if allowed_attempts > 1). Defaults to
                    null.'
                quiz[show_correct_answers]:
                  type: boolean
                  description: 'Only valid if hide_results=null

                    If false, hides correct answers from students when quiz results
                    are viewed.

                    Defaults to true.'
                quiz[show_correct_answers_last_attempt]:
                  type: boolean
                  description: 'Only valid if show_correct_answers=true and allowed_attempts
                    > 1

                    If true, hides correct answers from students when quiz results
                    are viewed

                    until they submit the last attempt for the quiz.

                    Defaults to false.'
                quiz[show_correct_answers_at]:
                  type: string
                  description: 'Only valid if show_correct_answers=true

                    If set, the correct answers will be visible by students only after
                    this

                    date, otherwise the correct answers are visible once the student
                    hands in

                    their quiz submission.'
                quiz[hide_correct_answers_at]:
                  type: string
                  description: 'Only valid if show_correct_answers=true

                    If set, the correct answers will stop being visible once this
                    date has

                    passed. Otherwise, the correct answers will be visible indefinitely.'
                quiz[allowed_attempts]:
                  type: integer
                  description: 'Number of times a student is allowed to take a quiz.

                    Set to -1 for unlimited attempts.

                    Defaults to 1.'
                quiz[scoring_policy]:
                  type: string
                  description: 'Required and only valid if allowed_attempts > 1.

                    Scoring policy for a quiz that students can take multiple times.

                    Defaults to "keep_highest".'
                quiz[one_question_at_a_time]:
                  type: boolean
                  description: 'If true, shows quiz to student one question at a time.

                    Defaults to false.'
                quiz[cant_go_back]:
                  type: boolean
                  description: 'Only valid if one_question_at_a_time=true

                    If true, questions are locked after answering.

                    Defaults to false.'
                quiz[access_code]:
                  type: string
                  description: 'Restricts access to the quiz with a password.

                    For no access code restriction, set to null.

                    Defaults to null.'
                quiz[ip_filter]:
                  type: string
                  description: "Restricts access to the quiz to computers in a specified\
                    \ IP range.\nFilters can be a comma-separated list of addresses,\
                    \ or an address followed by a mask\n\nExamples:\n  \"192.168.217.1\"\
                    \n  \"192.168.217.1/24\"\n  \"192.168.217.1/255.255.255.0\"\n\n\
                    For no IP filter restriction, set to null.\nDefaults to null."
                quiz[due_at]:
                  type: string
                  description: 'The day/time the quiz is due.

                    Accepts times in ISO 8601 format, e.g. 2011-10-21T18:48Z.'
                quiz[lock_at]:
                  type: string
                  description: 'The day/time the quiz is locked for students.

                    Accepts times in ISO 8601 format, e.g. 2011-10-21T18:48Z.'
                quiz[unlock_at]:
                  type: string
                  description: 'The day/time the quiz is unlocked for students.

                    Accepts times in ISO 8601 format, e.g. 2011-10-21T18:48Z.'
                quiz[published]:
                  type: boolean
                  description: 'Whether the quiz should have a draft state of published
                    or unpublished.

                    NOTE: If students have started taking the quiz, or there are any

                    submissions for the quiz, you may not unpublish a quiz and will
                    recieve

                    an error.'
                quiz[one_time_results]:
                  type: boolean
                  description: 'Whether students should be prevented from viewing
                    their quiz results past

                    the first time (right after they turn the quiz in.)

                    Only valid if "hide_results" is not set to "always".

                    Defaults to false.'
                quiz[only_visible_to_overrides]:
                  type: boolean
                  description: 'Whether this quiz is only visible to overrides (Only
                    useful if

                    ''differentiated assignments'' account setting is on)

                    Defaults to false.'
