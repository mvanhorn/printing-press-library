  /v1/courses/{course_id}/modules:
    get:
      operationId: list_modules
      summary: List modules
      tags:
      - modules
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: "- \"items\": Return module items inline if possible.\n  This\
          \ parameter suggests that Canvas return module items directly\n  in the\
          \ Module object JSON, to avoid having to make separate API\n  requests for\
          \ each module when enumerating modules and items. Canvas\n  is free to omit\
          \ 'items' for any particular module if it deems them\n  too numerous to\
          \ return inline. Callers must be prepared to use the\n  {api:ContextModuleItemsApiController#index\
          \ List Module Items API}\n  if items are not returned.\n- \"content_details\"\
          : Requires 'items'. Returns additional\n  details with module items specific\
          \ to their associated content items.\n  Includes standard lock information\
          \ for each item."
      - name: search_term
        in: query
        required: false
        schema:
          type: string
        description: 'The partial name of the modules (and module items, if ''items''
          is

          specified with include[]) to match and return.'
      - name: student_id
        in: query
        required: false
        schema:
          type: string
        description: Returns module completion information for the student with this
          id.
      responses:
        '200':
          description: OK
    post:
      operationId: create_module
      summary: Create a module
      tags:
      - modules
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                module[name]:
                  type: string
                  description: The name of the module
                module[unlock_at]:
                  type: string
                  description: The date the module will unlock
                module[position]:
                  type: integer
                  description: The position of this module in the course (1-based)
                module[require_sequential_progress]:
                  type: boolean
                  description: Whether module items must be unlocked in order
                module[prerequisite_module_ids]:
                  type: array
                  description: 'IDs of Modules that must be completed before this
                    one is unlocked.

                    Prerequisite modules must precede this module (i.e. have a lower
                    position

                    value), otherwise they will be ignored'
                module[publish_final_grade]:
                  type: boolean
                  description: 'Whether to publish the student''s final grade for
                    the course upon

                    completion of this module.'
