                    "must_contribute": Only applies to "Assignment", "Discussion",
                    and "Page" types

                    "must_submit", "min_score": Only apply to "Assignment" and "Quiz"
                    types

                    "must_mark_done": Only applies to "Assignment" and "Page" types

