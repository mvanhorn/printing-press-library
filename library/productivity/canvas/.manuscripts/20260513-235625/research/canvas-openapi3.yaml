                    1. the assignment MUST be a group assignment (a group_category_id
                    is assigned to it)

                    2. the ID must identify an active group in the group set the assignment
                    is in

                    3. the ID must not be targetted by a different override


                    See {Appendix: Group assignments} for more info.'
                assignment_override[course_section_id]:
                  type: integer
                  description: 'The ID

                    of the override''s target section. If present, must identify an
                    active

                    section of the assignment''s course not already targetted by a
                    different

                    override.'
                assignment_override[due_at]:
                  type: string
                  description: 'The day/time

                    the overridden assignment is due. Accepts times in ISO 8601 format,
                    e.g.

                    2014-10-21T18:48:00Z. If absent, this override will not affect
                    due date.

                    May be present but null to indicate the override removes any previous
                    due

                    date.'
                assignment_override[unlock_at]:
