  /v1/courses/{id}:
    delete:
      operationId: delete_conclude_course
      summary: Delete/Conclude a course
      tags:
      - courses
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: event
        in: query
        required: true
        schema:
          type: string
        description: The action to take on the course.
      responses:
        '200':
          description: OK
    get:
      operationId: get_single_course_courses
      summary: Get a single course
      tags:
      - courses
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: "- \"all_courses\": Also search recently deleted courses.\n-\
          \ \"permissions\": Include permissions the current user has\n  for the course.\n\
          - \"observed_users\": Include observed users in the enrollments\n- \"course_image\"\
          : Include course image url if a course image has been set\n- \"banner_image\"\
          : Include course banner image url if the course is a Canvas for\n  Elementary\
          \ subject and a banner image has been set\n- \"concluded\": Optional information\
          \ to include with Course. Indicates whether\n  the course has been concluded,\
          \ taking course and term dates into account.\n- \"lti_context_id\": Include\
          \ course LTI tool id.\n- \"post_manually\": Include course post policy.\
          \ If the post policy is manually post grades,\n  the value will be true.\
          \ If the post policy is automatically post grades, the value will be false."
      - name: teacher_limit
        in: query
        required: false
        schema:
          type: integer
        description: 'The maximum number of teacher enrollments to show.

          If the course contains more teachers than this, instead of giving the teacher

          enrollments, the count of teachers will be given under a _teacher_count_
          key.'
      responses:
        '200':
          description: OK
    put:
      operationId: update_course
      summary: Update a course
      tags:
      - courses
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                course[account_id]:
                  type: integer
                  description: The unique ID of the account to move the course to.
                course[name]:
                  type: string
                  description: 'The name of the course. If omitted, the course will
                    be named "Unnamed

                    Course."'
                course[course_code]:
                  type: string
                  description: The course code for the course.
                course[start_at]:
                  type: string
                  description: 'Course start date in ISO8601 format, e.g. 2011-01-01T01:00Z

                    This value is ignored unless ''restrict_enrollments_to_course_dates''
                    is set to true,

                    or the course is already published.'
                course[end_at]:
                  type: string
                  description: 'Course end date in ISO8601 format. e.g. 2011-01-01T01:00Z

                    This value is ignored unless ''restrict_enrollments_to_course_dates''
                    is set to true.'
                course[license]:
                  type: string
                  description: 'The name of the licensing. Should be one of the following
                    abbreviations

                    (a descriptive name is included in parenthesis for reference):

                    - ''private'' (Private Copyrighted)

                    - ''cc_by_nc_nd'' (CC Attribution Non-Commercial No Derivatives)

                    - ''cc_by_nc_sa'' (CC Attribution Non-Commercial Share Alike)

                    - ''cc_by_nc'' (CC Attribution Non-Commercial)

                    - ''cc_by_nd'' (CC Attribution No Derivatives)

                    - ''cc_by_sa'' (CC Attribution Share Alike)

                    - ''cc_by'' (CC Attribution)

                    - ''public_domain'' (Public Domain).'
                course[is_public]:
                  type: boolean
                  description: Set to true if course is public to both authenticated
                    and unauthenticated users.
                course[is_public_to_auth_users]:
                  type: boolean
                  description: Set to true if course is public only to authenticated
                    users.
                course[public_syllabus]:
                  type: boolean
                  description: Set to true to make the course syllabus public.
                course[public_syllabus_to_auth]:
                  type: boolean
                  description: Set to true to make the course syllabus to public for
                    authenticated users.
                course[public_description]:
                  type: string
                  description: A publicly visible description of the course.
                course[allow_student_wiki_edits]:
                  type: boolean
                  description: If true, students will be able to modify the course
                    wiki.
                course[allow_wiki_comments]:
                  type: boolean
                  description: If true, course members will be able to comment on
                    wiki pages.
                course[allow_student_forum_attachments]:
                  type: boolean
                  description: If true, students can attach files to forum posts.
                course[open_enrollment]:
                  type: boolean
                  description: Set to true if the course is open enrollment.
                course[self_enrollment]:
                  type: boolean
                  description: Set to true if the course is self enrollment.
                course[restrict_enrollments_to_course_dates]:
                  type: boolean
                  description: 'Set to true to restrict user enrollments to the start
                    and end dates of the

                    course. Setting this value to false will

                    remove the course end date (if it exists), as well as the course
                    start date

                    (if the course is unpublished).'
                course[term_id]:
                  type: integer
                  description: The unique ID of the term to create to course in.
                course[sis_course_id]:
                  type: string
                  description: The unique SIS identifier.
                course[integration_id]:
                  type: string
                  description: The unique Integration identifier.
                course[hide_final_grades]:
                  type: boolean
                  description: 'If this option is set to true, the totals in student
                    grades summary will

                    be hidden.'
                course[time_zone]:
                  type: string
                  description: 'The time zone for the course. Allowed time zones are

                    {http://www.iana.org/time-zones IANA time zones} or friendlier

                    {http://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html
                    Ruby on Rails time zones}.'
                course[apply_assignment_group_weights]:
                  type: boolean
                  description: Set to true to weight final grade based on assignment
                    groups percentages.
                course[storage_quota_mb]:
                  type: integer
                  description: 'Set the storage quota for the course, in megabytes.
                    The caller must have

                    the "Manage storage quotas" account permission.'
                offer:
                  type: boolean
                  description: 'If this option is set to true, the course will be
                    available to students

                    immediately.'
                course[event]:
                  type: string
                  description: "The action to take on each course.\n* 'claim' makes\
                    \ a course no longer visible to students. This action is also\
                    \ called \"unpublish\" on the web site.\n  A course cannot be\
                    \ unpublished if students have received graded submissions.\n\
                    * 'offer' makes a course visible to students. This action is also\
                    \ called \"publish\" on the web site.\n* 'conclude' prevents future\
                    \ enrollments and makes a course read-only for all participants.\
                    \ The course still appears\n  in prior-enrollment lists.\n* 'delete'\
                    \ completely removes the course from the web site (including course\
                    \ menus and prior-enrollment lists).\n  All enrollments are deleted.\
                    \ Course content may be physically deleted at a future date.\n\
                    * 'undelete' attempts to recover a course that has been deleted.\
                    \ This action requires account administrative rights.\n  (Recovery\
                    \ is not guaranteed; please conclude rather than delete a course\
                    \ if there is any possibility the course\n  will be used again.)\
                    \ The recovered course will be unpublished. Deleted enrollments\
                    \ will not be recovered."
                course[default_view]:
                  type: string
                  description: 'The type of page that users will see when they first
                    visit the course

                    * ''feed'' Recent Activity Dashboard

                    * ''wiki'' Wiki Front Page

                    * ''modules'' Course Modules/Sections Page

                    * ''assignments'' Course Assignments List

                    * ''syllabus'' Course Syllabus Page

                    other types may be added in the future'
                course[syllabus_body]:
                  type: string
                  description: The syllabus body for the course
                course[syllabus_course_summary]:
                  type: boolean
                  description: Optional. Indicates whether the Course Summary (consisting
                    of the course's assignments and calendar events) is displayed
                    on the syllabus page. Defaults to +true+.
                course[grading_standard_id]:
                  type: integer
                  description: The grading standard id to set for the course.  If
                    no value is provided for this argument the current grading_standard
                    will be un-set from this course.
                course[grade_passback_setting]:
                  type: string
                  description: Optional. The grade_passback_setting for the course.
                    Only 'nightly_sync' and '' are allowed
                course[course_format]:
                  type: string
                  description: Optional. Specifies the format of the course. (Should
                    be either 'on_campus' or 'online')
                course[image_id]:
                  type: integer
                  description: 'This is a file ID corresponding to an image file in
                    the course that will

                    be used as the course image.

                    This will clear the course''s image_url setting if set.  If you
                    attempt

                    to provide image_url and image_id in a request it will fail.'
                course[image_url]:
                  type: string
                  description: 'This is a URL to an image to be used as the course
                    image.

                    This will clear the course''s image_id setting if set.  If you
                    attempt

                    to provide image_url and image_id in a request it will fail.'
                course[remove_image]:
                  type: boolean
                  description: 'If this option is set to true, the course image url
                    and course image

                    ID are both set to nil'
                course[remove_banner_image]:
                  type: boolean
                  description: 'If this option is set to true, the course banner image
                    url and course

                    banner image ID are both set to nil'
                course[blueprint]:
                  type: boolean
                  description: Sets the course as a blueprint course.
                course[blueprint_restrictions]:
                  type: string
                  description: 'Sets a default set to apply to blueprint course objects
                    when restricted,

                    unless _use_blueprint_restrictions_by_object_type_ is enabled.

                    See the {api:Blueprint_Courses:BlueprintRestriction Blueprint
                    Restriction} documentation'
                course[use_blueprint_restrictions_by_object_type]:
                  type: boolean
                  description: 'When enabled, the _blueprint_restrictions_ parameter
                    will be ignored in favor of

                    the _blueprint_restrictions_by_object_type_ parameter'
                course[blueprint_restrictions_by_object_type]:
                  type: string
                  description: "Allows setting multiple {api:Blueprint_Courses:BlueprintRestriction\
                    \ Blueprint Restriction}\nto apply to blueprint course objects\
                    \ of the matching type when restricted.\nThe possible object types\
                    \ are \"assignment\", \"attachment\", \"discussion_topic\", \"\
                    quiz\" and \"wiki_page\".\nExample usage:\n  course[blueprint_restrictions_by_object_type][assignment][content]=1"
                course[homeroom_course]:
                  type: boolean
                  description: 'Sets the course as a homeroom course. The setting
                    takes effect only when the course is associated

                    with a Canvas for Elementary-enabled account.'
                course[sync_enrollments_from_homeroom]:
                  type: string
                  description: 'Syncs enrollments from the homeroom that is set in
                    homeroom_course_id. The setting only takes effect when the

                    course is associated with a Canvas for Elementary-enabled account
                    and sync_enrollments_from_homeroom is enabled.'
                course[homeroom_course_id]:
                  type: string
                  description: 'Sets the Homeroom Course id to be used with sync_enrollments_from_homeroom.
                    The setting only takes effect when the

                    course is associated with a Canvas for Elementary-enabled account
                    and sync_enrollments_from_homeroom is enabled.'
                course[template]:
                  type: boolean
                  description: Enable or disable the course as a template that can
                    be selected by an account
                course[course_color]:
                  type: string
                  description: 'Sets a color in hex code format to be associated with
                    the course. The setting takes effect only when the course

                    is associated with a Canvas for Elementary-enabled account.'
                course[friendly_name]:
                  type: string
                  description: 'Set a friendly name for the course. If this is provided
                    and the course is associated with a Canvas for

                    Elementary account, it will be shown instead of the course name.
                    This setting takes priority over

                    course nicknames defined by individual users.'
                course[enable_course_paces]:
                  type: boolean
                  description: 'Enable or disable Course Pacing for the course. This
                    setting only has an effect when the Course Pacing feature flag
                    is

                    enabled for the sub-account. Otherwise, Course Pacing are always
                    disabled.'
                course[conditional_release]:
                  type: boolean
                  description: Enable or disable individual learning paths for students
                    based on assessment
                course[post_manually]:
                  type: boolean
                  description: 'When true, all grades in the course will be posted
                    manually.

                    When false, all grades in the course will be automatically posted.

                    Use with caution as this setting will override any assignment
                    level post policy.'
                override_sis_stickiness:
                  type: boolean
                  description: 'Default is true. If false, any fields containing “sticky”
                    changes will not be updated.

                    See SIS CSV Format documentation for information on which fields
                    can have SIS stickiness'
  /v1/courses/{course_id}/settings:
    get:
      operationId: get_course_settings
      summary: Get course settings
      tags:
      - courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
    put:
      operationId: update_course_settings
      summary: Update course settings
      tags:
      - courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_final_grade_override:
                  type: boolean
                  description: Let student final grades for a grading period or the
                    total grades for the course be overridden
                allow_student_discussion_topics:
                  type: boolean
                  description: Let students create discussion topics
                allow_student_forum_attachments:
                  type: boolean
                  description: Let students attach files to discussions
                allow_student_discussion_editing:
                  type: boolean
                  description: Let students edit or delete their own discussion replies
                allow_student_organized_groups:
                  type: boolean
                  description: Let students organize their own groups
                allow_student_discussion_reporting:
                  type: boolean
                  description: Let students report offensive discussion content
                allow_student_anonymous_discussion_topics:
                  type: boolean
                  description: Let students create anonymous discussion topics
                filter_speed_grader_by_student_group:
                  type: boolean
                  description: Filter SpeedGrader to only the selected student group
                hide_final_grades:
                  type: boolean
                  description: Hide totals in student grades summary
                hide_distribution_graphs:
                  type: boolean
                  description: Hide grade distribution graphs from students
                hide_sections_on_course_users_page:
                  type: boolean
                  description: Disallow students from viewing students in sections
                    they do not belong to
                lock_all_announcements:
                  type: boolean
                  description: Disable comments on announcements
                usage_rights_required:
                  type: boolean
                  description: Copyright and license information must be provided
                    for files before they are published.
                restrict_student_past_view:
                  type: boolean
                  description: Restrict students from viewing courses after end date
