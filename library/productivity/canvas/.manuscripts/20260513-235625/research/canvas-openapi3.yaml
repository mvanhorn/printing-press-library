  /v1/announcements:
    get:
      operationId: list_announcements
      summary: List announcements
      tags:
      - announcements
      parameters:
      - name: context_codes
        in: query
        required: true
        schema:
          type: array
        description: 'List of context_codes to retrieve announcements for (for example,
          +course_123+). Only courses

          are presently supported. The call will fail unless the caller has View Announcements
          permission

          in all listed courses.'
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: 'Only return announcements posted since the start_date (inclusive).

          Defaults to 14 days ago. The value should be formatted as: yyyy-mm-dd or
          ISO 8601 YYYY-MM-DDTHH:MM:SSZ.'
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: 'Only return announcements posted before the end_date (inclusive).

          Defaults to 28 days from start_date. The value should be formatted as: yyyy-mm-dd
          or ISO 8601 YYYY-MM-DDTHH:MM:SSZ.

          Announcements scheduled for future posting will only be returned to course
          administrators.'
      - name: available_after
        in: query
        required: false
        schema:
          type: string
        description: 'Only return announcements having locked_at nil or after available_after
          (exclusive).

          The value should be formatted as: yyyy-mm-dd or ISO 8601 YYYY-MM-DDTHH:MM:SSZ.

          Effective only for students (who don''t have moderate forum right).'
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
        description: 'Only return active announcements that have been published.

          Applies only to requesting users that have permission to view

          unpublished items.

          Defaults to false for users with access to view unpublished items,

          otherwise true and unmodifiable.'
      - name: latest_only
        in: query
        required: false
        schema:
          type: boolean
        description: 'Only return the latest announcement for each associated context.

          The response will include at most one announcement for each

          specified context in the context_codes[] parameter.

          Defaults to false.'
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: "Optional list of resources to include with the response. May\
          \ include\na string of the name of the resource. Possible values are:\n\"\
          sections\", \"sections_user_count\"\nif \"sections\" is passed, includes\
          \ the course sections that are associated\nwith the topic, if the topic\
          \ is specific to certain sections of the course.\nIf \"sections_user_count\"\
          \ is passed, then:\n  (a) If sections were asked for *and* the topic is\
          \ specific to certain\n      course sections sections, includes the number\
          \ of users in each\n      section. (as part of the section json asked for\
          \ above)\n  (b) Else, includes at the root level the total number of users\
          \ in the\n      topic's context (group or course) that the topic applies\
          \ to."
      responses:
        '200':
          description: OK
  /v1/courses/{course_id}/enrollments:
    get:
      operationId: list_enrollments_courses
      summary: List enrollments
      tags:
      - enrollments
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: type
        in: query
        required: false
        schema:
          type: array
        description: 'A list of enrollment types to return. Accepted values are

          ''StudentEnrollment'', ''TeacherEnrollment'', ''TaEnrollment'',

          ''DesignerEnrollment'', and ''ObserverEnrollment.'' If omitted, all enrollment

          types are returned. This argument is ignored if `role` is given.'
      - name: role
        in: query
        required: false
        schema:
          type: array
        description: 'A list of enrollment roles to return. Accepted values include
          course-level

          roles created by the {api:RoleOverridesController#add_role Add Role API}

          as well as the base enrollment types accepted by the `type` argument above.'
      - name: state
        in: query
        required: false
        schema:
          type: array
        description: 'Filter by enrollment state. If omitted, ''active'' and ''invited''
          enrollments

          are returned. The following synthetic states are supported only when

          querying a user''s enrollments (either via user_id argument or via user

          enrollments endpoint): +current_and_invited+, +current_and_future+, +current_future_and_restricted+,
          +current_and_concluded+'
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: 'Array of additional information to include on the enrollment
          or user records.

          "avatar_url" and "group_ids" will be returned on the user record. If "current_points"

          is specified, the fields "current_points" and (if the caller has

          permissions to manage grades) "unposted_current_points" will be included

          in the "grades" hash for student enrollments.'
      - name: user_id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by user_id (only valid for course or section enrollment

          queries). If set to the current user''s id, this is a way to

          determine if the user has any enrollments in the course or section,

          independent of whether the user has permission to view other people

          on the roster.'
      - name: grading_period_id
        in: query
        required: false
        schema:
          type: integer
        description: 'Return grades for the given grading_period.  If this parameter
          is not

          specified, the returned grades will be for the whole course.'
      - name: enrollment_term_id
        in: query
        required: false
        schema:
          type: integer
        description: 'Returns only enrollments for the specified enrollment term.
          This parameter

          only applies to the user enrollments path. May pass the ID from the

          enrollment terms api or the SIS id prepended with ''sis_term_id:''.'
      - name: sis_account_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only enrollments for the specified SIS account ID(s).
          Does not

          look into sub_accounts. May pass in array or string.'
      - name: sis_course_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only enrollments matching the specified SIS course ID(s).

          May pass in array or string.'
      - name: sis_section_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only section enrollments matching the specified SIS
          section ID(s).

          May pass in array or string.'
      - name: sis_user_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only enrollments for the specified SIS user ID(s). May
          pass in

          array or string.'
      - name: created_for_sis_id
        in: query
        required: false
        schema:
          type: array
        description: 'If sis_user_id is present and created_for_sis_id is true, Returns
          only

          enrollments for the specified SIS ID(s).

          If a user has two sis_id''s, one enrollment may be created using one of
          the

          two ids. This would limit the enrollments returned from the endpoint to

          enrollments that were created from a sis_import with that sis_user_id'
      responses:
        '200':
          description: OK
    post:
      operationId: enroll_user_courses
      summary: Enroll a user
      tags:
      - enrollments
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollment[start_at]:
                  type: string
                  description: The start time of the enrollment, in ISO8601 format.
                    e.g. 2012-04-18T23:08:51Z
                enrollment[end_at]:
                  type: string
                  description: The end time of the enrollment, in ISO8601 format.
                    e.g. 2012-04-18T23:08:51Z
                enrollment[user_id]:
                  type: string
                  description: The ID of the user to be enrolled in the course.
                enrollment[type]:
                  type: string
                  description: 'Enroll the user as a student, teacher, TA, observer,
                    or designer. If no

                    value is given, the type will be inferred by +enrollment[role]+
                    if supplied,

                    otherwise ''StudentEnrollment'' will be used.'
                enrollment[role]:
                  type: string
                  description: Assigns a custom course-level role to the user.
                enrollment[role_id]:
                  type: integer
                  description: Assigns a custom course-level role to the user.
                enrollment[enrollment_state]:
                  type: string
                  description: 'If set to ''active,'' student will be immediately
                    enrolled in the course.

                    Otherwise they will be required to accept a course invitation.
                    Default is

                    ''invited.''.


                    If set to ''inactive'', student will be listed in the course roster
                    for

                    teachers, but will not be able to participate in the course until

                    their enrollment is activated.'
                enrollment[course_section_id]:
                  type: integer
                  description: 'The ID of the course section to enroll the student
                    in. If the

                    section-specific URL is used, this argument is redundant and will
                    be

                    ignored.'
                enrollment[limit_privileges_to_course_section]:
                  type: boolean
                  description: "If set, the enrollment will only allow the user to\
                    \ see and interact with\nusers enrolled in the section given by\
                    \ course_section_id.\n* For teachers and TAs, this includes grading\
                    \ privileges.\n* Section-limited students will not see any users\
                    \ (including teachers\n  and TAs) not enrolled in their sections.\n\
                    * Users may have other enrollments that grant privileges to\n\
                    \  multiple sections in the same course."
                enrollment[notify]:
                  type: boolean
                  description: 'If true, a notification will be sent to the enrolled
                    user.

                    Notifications are not sent by default.'
                enrollment[self_enrollment_code]:
                  type: string
                  description: 'If the current user is not allowed to manage enrollments
                    in this

                    course, but the course allows self-enrollment, the user can self-

                    enroll as a student in the default section by passing in a valid

                    code. When self-enrolling, the user_id must be ''self''. The

                    enrollment_state will be set to ''active'' and all other arguments

                    will be ignored.'
                enrollment[self_enrolled]:
                  type: boolean
                  description: 'If true, marks the enrollment as a self-enrollment,
                    which gives

                    students the ability to drop the course if desired. Defaults to
                    false.'
                enrollment[associated_user_id]:
                  type: integer
                  description: 'For an observer enrollment, the ID of a student to
                    observe.

                    This is a one-off operation; to automatically observe all a

                    student''s enrollments (for example, as a parent), please use

                    the {api:UserObserveesController#create User Observees API}.'
                enrollment[sis_user_id]:
                  type: string
                  description: 'Required if the user is being enrolled from another
                    trusted account.

                    The unique identifier for the user (sis_user_id) must also be

                    accompanied by the root_account parameter. The user_id will be
                    ignored.'
                enrollment[integration_id]:
                  type: string
                  description: 'Required if the user is being enrolled from another
                    trusted account.

                    The unique identifier for the user (integration_id) must also
                    be

                    accompanied by the root_account parameter. The user_id will be
                    ignored.'
                root_account:
                  type: string
                  description: 'The domain of the account to search for the user.
                    Will be a no-op

                    unless the sis_user_id or integration_id parameter is also included.'
