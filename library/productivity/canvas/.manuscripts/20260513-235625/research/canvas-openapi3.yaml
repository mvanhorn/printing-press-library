                    the overridden assignment becomes unlocked. Accepts times in ISO
                    8601

                    format, e.g. 2014-10-21T18:48:00Z. If absent, this override will
                    not

                    affect the unlock date. May be present but null to indicate the
                    override

                    removes any previous unlock date.'
                assignment_override[lock_at]:
