          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new display name of the file, with a limit of 255
                    characters.
                parent_folder_id:
                  type: string
                  description: 'The id of the folder to move this file into.

                    The new folder must be in the same context as the original parent
                    folder.

                    If the file is in a context without folders this does not apply.'
                on_duplicate:
                  type: string
                  description: 'If the file is moved to a folder containing a file
                    with the same name,

                    or renamed to a name matching an existing file, the API call will
                    fail

                    unless this parameter is supplied.


                    "overwrite":: Replace the existing file with the same name

                    "rename":: Add a qualifier to make the new filename unique'
                lock_at:
                  type: string
                  description: The datetime to lock the file at
                unlock_at:
                  type: string
                  description: The datetime to unlock the file at
                locked:
                  type: boolean
                  description: Flag the file as locked
                hidden:
                  type: boolean
                  description: Flag the file as hidden
                visibility_level:
                  type: string
                  description: Configure which roles can access this file
    delete:
      operationId: delete_file
      summary: Delete file
