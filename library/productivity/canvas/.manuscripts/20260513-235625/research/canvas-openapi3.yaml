                assignment[description]:
                  type: string
                  description: The assignment's description, supports HTML.
                assignment[assignment_group_id]:
                  type: integer
                  description: 'The assignment group id to put the assignment in.

                    Defaults to the top assignment group in the course.'
                assignment[assignment_overrides]:
                  type: array
                  description: List of overrides for the assignment.
                assignment[only_visible_to_overrides]:
                  type: boolean
                  description: 'Whether this assignment is only visible to overrides

                    (Only useful if ''differentiated assignments'' account setting
                    is on)'
                assignment[published]:
                  type: boolean
                  description: 'Whether this assignment is published.

                    (Only useful if ''draft state'' account setting is on)

                    Unpublished assignments are not visible to students.'
                assignment[grading_standard_id]:
                  type: integer
                  description: 'The grading standard id to set for the course.  If
                    no value is provided for this argument the current grading_standard
                    will be un-set from this course.

                    This will update the grading_type for the course to ''letter_grade''
                    unless it is already ''gpa_scale''.'
                assignment[omit_from_final_grade]:
                  type: boolean
                  description: Whether this assignment is counted towards a student's
                    final grade.
                assignment[hide_in_gradebook]:
                  type: boolean
                  description: Whether this assignment is shown in the gradebook.
                assignment[quiz_lti]:
                  type: boolean
                  description: 'Whether this assignment should use the Quizzes 2 LTI
                    tool. Sets the

                    submission type to ''external_tool'' and configures the external
                    tool

                    attributes to use the Quizzes 2 LTI tool configured for this course.

                    Has no effect if no Quizzes 2 LTI tool is configured.'
                assignment[moderated_grading]:
                  type: boolean
                  description: Whether this assignment is moderated.
                assignment[grader_count]:
                  type: integer
                  description: 'The maximum number of provisional graders who may
                    issue grades for this

                    assignment. Only relevant for moderated assignments. Must be a
                    positive

                    value, and must be set to 1 if the course has fewer than two active

                    instructors. Otherwise, the maximum value is the number of active

                    instructors in the course minus one, or 10 if the course has more
                    than 11

                    active instructors.'
                assignment[final_grader_id]:
                  type: integer
                  description: 'The user ID of the grader responsible for choosing
                    final grades for this

                    assignment. Only relevant for moderated assignments.'
                assignment[grader_comments_visible_to_graders]:
                  type: boolean
                  description: 'Boolean indicating if provisional graders'' comments
                    are visible to other

                    provisional graders. Only relevant for moderated assignments.'
                assignment[graders_anonymous_to_graders]:
                  type: boolean
                  description: 'Boolean indicating if provisional graders'' identities
                    are hidden from

                    other provisional graders. Only relevant for moderated assignments.'
                assignment[graders_names_visible_to_final_grader]:
                  type: boolean
                  description: 'Boolean indicating if provisional grader identities
                    are visible to the

                    the final grader. Only relevant for moderated assignments.'
                assignment[anonymous_grading]:
                  type: boolean
                  description: 'Boolean indicating if the assignment is graded anonymously.
                    If true,

                    graders cannot see student identities.'
                assignment[allowed_attempts]:
                  type: integer
                  description: The number of submission attempts allowed for this
                    assignment. Set to -1 for unlimited attempts.
                assignment[annotatable_attachment_id]:
                  type: integer
                  description: 'The Attachment ID of the document being annotated.


                    Only applies when submission_types includes "student_annotation".'
                assignment[asset_processors]:
                  type: array
                  description: 'Document processors for this assignment. New document
                    processors can only be added

                    via the interactive LTI Deep Linking flow (in a browser), not
                    via API token or JWT authentication.

                    Deletion of document processors (passing an empty array) is allowed
                    via API.'
                assignment[peer_review][points_possible]:
                  type: number
                  description: The maximum points possible for peer reviews.
                assignment[peer_review][grading_type]:
                  type: string
                  description: 'The strategy used for grading peer reviews.

                    Defaults to "points" if this field is omitted.'
                assignment[peer_review][due_at]:
                  type: string
                  description: 'The day/time the peer reviews are due. Must be between
                    the lock dates if there are lock dates.

                    Accepts times in ISO 8601 format, e.g. 2025-08-20T12:10:00Z.'
                assignment[peer_review][lock_at]:
                  type: string
                  description: 'The day/time the peer reviews are locked after. Must
                    be after the due date if there is a due date.

                    Accepts times in ISO 8601 format, e.g. 2025-08-25T12:10:00Z.'
                assignment[peer_review][unlock_at]:
                  type: string
                  description: 'The day/time the peer reviews are unlocked. Must be
                    before the due date if there is a due date.

                    Accepts times in ISO 8601 format, e.g. 2025-08-15T12:10:00Z.'
                assignment[peer_review][peer_review_overrides]:
                  type: array
                  description: List of overrides for the peer reviews.
