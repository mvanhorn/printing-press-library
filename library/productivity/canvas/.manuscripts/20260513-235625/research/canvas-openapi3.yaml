  /v1/courses/{course_id}/discussion_topics/{topic_id}/summaries/{summary_id}/feedback:
    post:
      operationId: summary_feedback_courses
      summary: Summary Feedback
      tags:
      - discussion_topics
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: summary_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _action:
                  type: string
                  description: 'Required

                    The action to take on the summary. Possible values are:

                    - "seen": Marks the summary as seen. This action saves the feedback
                    if it''s not already persisted.

                    - "like": Marks the summary as liked.

                    - "dislike": Marks the summary as disliked.

                    - "add_comment": Adds a written comment to a disliked summary.
                    Requires the "comment" parameter.

                    - "reset_like": Resets the like status of the summary.

                    - "regenerate": Regenerates the summary feedback.

                    - "disable_summary": Disables the summary feedback.

                    Any other value will result in an error response.'
                comment:
                  type: string
                  description: 'Optional

                    A written explanation for the dislike. Only used with the "add_comment"
                    action. Maximum 1024 characters.'
