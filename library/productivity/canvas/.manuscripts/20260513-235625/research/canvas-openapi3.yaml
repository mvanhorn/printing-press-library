openapi: 3.0.0
info:
  title: Canvas LMS API
  version: 1.0.0
  description: Canvas LMS REST API
  x-cli-description: The first Canvas CLI with transparent pagination, cross-course
    analytics, and offline SQLite sync.
servers:
- url: https://canvas.txstate.edu/api
  description: Canvas Instance
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      x-auth-vars:
      - name: CANVAS_API_TOKEN
        kind: per_call
        required: true
        sensitive: true
        description: Canvas personal access token (Settings → Approved Integrations
          → New Access Token)
      - name: CANVAS_BASE_URL
        kind: per_call
        required: true
        sensitive: false
        description: Your Canvas instance URL (e.g. https://canvas.txstate.edu)
  schemas: {}
security:
- bearerAuth: []
paths:
  /v1/courses:
    get:
      operationId: list_your_courses
      summary: List your courses
      tags:
      - courses
      parameters:
      - name: enrollment_type
        in: query
        required: false
        schema:
          type: string
        description: 'When set, only return courses where the user is enrolled as
          this type. For

          example, set to "teacher" to return only courses where the user is

          enrolled as a Teacher.  This argument is ignored if enrollment_role is given.'
      - name: enrollment_role
        in: query
        required: false
        schema:
          type: string
        description: 'Deprecated

          When set, only return courses where the user is enrolled with the specified

          course-level role.  This can be a role created with the

          {api:RoleOverridesController#add_role Add Role API} or a base role type
          of

          ''StudentEnrollment'', ''TeacherEnrollment'', ''TaEnrollment'', ''ObserverEnrollment'',

          or ''DesignerEnrollment''.'
      - name: enrollment_role_id
        in: query
        required: false
        schema:
          type: integer
        description: 'When set, only return courses where the user is enrolled with
          the specified

          course-level role.  This can be a role created with the

          {api:RoleOverridesController#add_role Add Role API} or a built_in role type
          of

          ''StudentEnrollment'', ''TeacherEnrollment'', ''TaEnrollment'', ''ObserverEnrollment'',

          or ''DesignerEnrollment''.'
      - name: enrollment_state
        in: query
        required: false
        schema:
          type: string
        description: 'When set, only return courses where the user has an enrollment
          with the given state.

          This will respect section/course/term date overrides.'
      - name: exclude_blueprint_courses
        in: query
        required: false
        schema:
          type: boolean
        description: When set, only return courses that are not configured as blueprint
          courses.
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: "- \"needs_grading_count\": Optional information to include with\
          \ each Course.\n  When needs_grading_count is given, and the current user\
          \ has grading\n  rights, the total number of submissions needing grading\
          \ for all\n  assignments is returned.\n- \"syllabus_body\": Optional information\
          \ to include with each Course.\n  When syllabus_body is given the user-generated\
          \ html for the course\n  syllabus is returned.\n- \"public_description\"\
          : Optional information to include with each Course.\n  When public_description\
          \ is given the user-generated text for the course\n  public description\
          \ is returned.\n- \"total_scores\": Optional information to include with\
          \ each Course.\n  When total_scores is given, any student enrollments will\
          \ also\n  include the fields 'computed_current_score', 'computed_final_score',\n\
          \  'computed_current_grade', and 'computed_final_grade', as well as (if\n\
          \  the user has permission) 'unposted_current_score',\n  'unposted_final_score',\
          \ 'unposted_current_grade', and\n  'unposted_final_grade' (see Enrollment\
          \ documentation for more\n  information on these fields). This argument\
          \ is ignored if the course is\n  configured to hide final grades.\n- \"\
          current_grading_period_scores\": Optional information to include with\n\
          \  each Course. When current_grading_period_scores is given and total_scores\n\
          \  is given, any student enrollments will also include the fields\n  'has_grading_periods',\n\
          \  'totals_for_all_grading_periods_option', 'current_grading_period_title',\n\
          \  'current_grading_period_id', current_period_computed_current_score',\n\
          \  'current_period_computed_final_score',\n  'current_period_computed_current_grade',\
          \ and\n  'current_period_computed_final_grade', as well as (if the user\
          \ has permission)\n  'current_period_unposted_current_score',\n  'current_period_unposted_final_score',\n\
          \  'current_period_unposted_current_grade', and\n  'current_period_unposted_final_grade'\
          \ (see Enrollment documentation for\n  more information on these fields).\
          \ In addition, when this argument is\n  passed, the course will have a 'has_grading_periods'\
          \ attribute\n  on it. This argument is ignored if the total_scores argument\
          \ is not\n  included. If the course is configured to hide final grades,\
          \ the\n  following fields are not returned:\n  'totals_for_all_grading_periods_option',\n\
          \  'current_period_computed_current_score',\n  'current_period_computed_final_score',\n\
          \  'current_period_computed_current_grade',\n  'current_period_computed_final_grade',\n\
          \  'current_period_unposted_current_score',\n  'current_period_unposted_final_score',\n\
          \  'current_period_unposted_current_grade', and\n  'current_period_unposted_final_grade'\n\
          - \"grading_periods\": Optional information to include with each Course.\
          \ When\n  grading_periods is given, a list of the grading periods associated\
          \ with\n  each course is returned.\n- \"term\": Optional information to\
          \ include with each Course. When\n  term is given, the information for the\
          \ enrollment term for each course\n  is returned.\n- \"account\": Optional\
          \ information to include with each Course. When\n  account is given, the\
          \ account json for each course is returned.\n- \"course_progress\": Optional\
          \ information to include with each Course.\n  When course_progress is given,\
          \ each course will include a\n  'course_progress' object with the fields:\
          \ 'requirement_count', an integer\n  specifying the total number of requirements\
          \ in the course,\n  'requirement_completed_count', an integer specifying\
          \ the total number of\n  requirements in this course that have been completed,\
          \ and\n  'next_requirement_url', a string url to the next requirement item,\
          \ and\n  'completed_at', the date the course was completed (null if incomplete).\n\
          \  'next_requirement_url' will be null if all requirements have been\n \
          \ completed or the current module does not require sequential progress.\n\
          \  \"course_progress\" will return an error message if the course is not\n\
          \  module based or the user is not enrolled as a student in the course.\n\
          - \"sections\": Section enrollment information to include with each Course.\n\
          \  Returns an array of hashes containing the section ID (id), section name\n\
          \  (name), start and end dates (start_at, end_at), as well as the enrollment\n\
          \  type (enrollment_role, e.g. 'StudentEnrollment').\n- \"storage_quota_used_mb\"\
          : The amount of storage space used by the files in this course\n- \"total_students\"\
          : Optional information to include with each Course.\n  Returns an integer\
          \ for the total amount of active and invited students.\n- \"passback_status\"\
          : Include the grade passback_status\n- \"favorites\": Optional information\
          \ to include with each Course.\n  Indicates if the user has marked the course\
          \ as a favorite course.\n- \"teachers\": Teacher information to include\
          \ with each Course.\n  Returns an array of hashes containing the {api:Users:UserDisplay\
          \ UserDisplay} information\n  for each teacher in the course.\n- \"observed_users\"\
          : Optional information to include with each Course.\n  Will include data\
          \ for observed users if the current user has an\n  observer enrollment.\n\
          - \"tabs\": Optional information to include with each Course.\n  Will include\
          \ the list of tabs configured for each course.  See the\n  {api:TabsController#index\
          \ List available tabs API} for more information.\n- \"course_image\": Optional\
          \ information to include with each Course. Returns course\n  image url if\
          \ a course image has been set.\n- \"banner_image\": Optional information\
          \ to include with each Course. Returns course\n  banner image url if the\
          \ course is a Canvas for Elementary subject and a banner\n  image has been\
          \ set.\n- \"concluded\": Optional information to include with each Course.\
          \ Indicates whether\n  the course has been concluded, taking course and\
          \ term dates into account.\n- \"post_manually\": Optional information to\
          \ include with each Course. Returns true if\n  the course post policy is\
          \ set to Manually post grades. Returns false if the the course\n  post policy\
          \ is set to Automatically post grades."
      - name: state
        in: query
        required: false
        schema:
          type: array
        description: 'If set, only return courses that are in the given state(s).

          By default, "available" is returned for students and observers, and

          anything except "deleted", for all other enrollment types'
      responses:
        '200':
          description: OK
  /v1/users/{user_id}/courses:
    get:
      operationId: list_courses_for_user
      summary: List courses for a user
      tags:
      - courses
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: "- \"needs_grading_count\": Optional information to include with\
          \ each Course.\n  When needs_grading_count is given, and the current user\
          \ has grading\n  rights, the total number of submissions needing grading\
          \ for all\n  assignments is returned.\n- \"syllabus_body\": Optional information\
          \ to include with each Course.\n  When syllabus_body is given the user-generated\
          \ html for the course\n  syllabus is returned.\n- \"public_description\"\
          : Optional information to include with each Course.\n  When public_description\
          \ is given the user-generated text for the course\n  public description\
          \ is returned.\n- \"total_scores\": Optional information to include with\
          \ each Course.\n  When total_scores is given, any student enrollments will\
          \ also\n  include the fields 'computed_current_score', 'computed_final_score',\n\
          \  'computed_current_grade', and 'computed_final_grade' (see Enrollment\n\
          \  documentation for more information on these fields). This argument\n\
          \  is ignored if the course is configured to hide final grades.\n- \"current_grading_period_scores\"\
          : Optional information to include with\n  each Course. When current_grading_period_scores\
          \ is given and total_scores\n  is given, any student enrollments will also\
          \ include the fields\n  'has_grading_periods',\n  'totals_for_all_grading_periods_option',\
          \ 'current_grading_period_title',\n  'current_grading_period_id', current_period_computed_current_score',\n\
          \  'current_period_computed_final_score',\n  'current_period_computed_current_grade',\
          \ and\n  'current_period_computed_final_grade', as well as (if the user\
          \ has permission)\n  'current_period_unposted_current_score',\n  'current_period_unposted_final_score',\n\
          \  'current_period_unposted_current_grade', and\n  'current_period_unposted_final_grade'\
          \ (see Enrollment documentation for\n  more information on these fields).\
          \ In addition, when this argument is\n  passed, the course will have a 'has_grading_periods'\
          \ attribute\n  on it. This argument is ignored if the course is configured\
          \ to hide final\n  grades or if the total_scores argument is not included.\n\
          - \"grading_periods\": Optional information to include with each Course.\
          \ When\n  grading_periods is given, a list of the grading periods associated\
          \ with\n  each course is returned.\n- \"term\": Optional information to\
          \ include with each Course. When\n  term is given, the information for the\
          \ enrollment term for each course\n  is returned.\n- \"account\": Optional\
          \ information to include with each Course. When\n  account is given, the\
          \ account json for each course is returned.\n- \"course_progress\": Optional\
          \ information to include with each Course.\n  When course_progress is given,\
          \ each course will include a\n  'course_progress' object with the fields:\
          \ 'requirement_count', an integer\n  specifying the total number of requirements\
          \ in the course,\n  'requirement_completed_count', an integer specifying\
          \ the total number of\n  requirements in this course that have been completed,\
          \ and\n  'next_requirement_url', a string url to the next requirement item,\
          \ and\n  'completed_at', the date the course was completed (null if incomplete).\n\
          \  'next_requirement_url' will be null if all requirements have been\n \
          \ completed or the current module does not require sequential progress.\n\
          \  \"course_progress\" will return an error message if the course is not\n\
          \  module based or the user is not enrolled as a student in the course.\n\
          - \"sections\": Section enrollment information to include with each Course.\n\
          \  Returns an array of hashes containing the section ID (id), section name\n\
          \  (name), start and end dates (start_at, end_at), as well as the enrollment\n\
          \  type (enrollment_role, e.g. 'StudentEnrollment').\n- \"storage_quota_used_mb\"\
          : The amount of storage space used by the files in this course\n- \"total_students\"\
          : Optional information to include with each Course.\n  Returns an integer\
          \ for the total amount of active and invited students.\n- \"passback_status\"\
          : Include the grade passback_status\n- \"favorites\": Optional information\
          \ to include with each Course.\n  Indicates if the user has marked the course\
          \ as a favorite course.\n- \"teachers\": Teacher information to include\
          \ with each Course.\n  Returns an array of hashes containing the {api:Users:UserDisplay\
          \ UserDisplay} information\n  for each teacher in the course.\n- \"observed_users\"\
          : Optional information to include with each Course.\n  Will include data\
          \ for observed users if the current user has an\n  observer enrollment.\n\
          - \"tabs\": Optional information to include with each Course.\n  Will include\
          \ the list of tabs configured for each course.  See the\n  {api:TabsController#index\
          \ List available tabs API} for more information.\n- \"course_image\": Optional\
          \ information to include with each Course. Returns course\n  image url if\
          \ a course image has been set.\n- \"banner_image\": Optional information\
          \ to include with each Course. Returns course\n  banner image url if the\
          \ course is a Canvas for Elementary subject and a banner\n  image has been\
          \ set.\n- \"concluded\": Optional information to include with each Course.\
          \ Indicates whether\n  the course has been concluded, taking course and\
          \ term dates into account.\n- \"post_manually\": Optional information to\
          \ include with each Course. Returns true if\n  the course post policy is\
          \ set to \"Manually\". Returns false if the the course post\n  policy is\
          \ set to \"Automatically\"."
      - name: state
        in: query
        required: false
        schema:
          type: array
        description: 'If set, only return courses that are in the given state(s).

          By default, "available" is returned for students and observers, and

          anything except "deleted", for all other enrollment types'
      - name: enrollment_state
        in: query
        required: false
        schema:
          type: string
        description: 'When set, only return courses where the user has an enrollment
          with the given state.

          This will respect section/course/term date overrides.'
      - name: homeroom
        in: query
        required: false
        schema:
          type: boolean
        description: If set, only return homeroom courses.
      - name: account_id
        in: query
        required: false
        schema:
          type: string
        description: If set, only include courses associated with this account
      responses:
        '200':
          description: OK
  /v1/courses/{course_id}/users/{user_id}/progress:
    get:
      operationId: get_user_progress
      summary: Get user progress
      tags:
      - courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
  /v1/accounts/{account_id}/courses:
    post:
      operationId: create_new_course
      summary: Create a new course
      tags:
      - courses
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                course[name]:
                  type: string
                  description: 'The name of the course. If omitted, the course will
                    be named "Unnamed

                    Course."'
                course[course_code]:
                  type: string
                  description: The course code for the course.
                course[start_at]:
                  type: string
                  description: 'Course start date in ISO8601 format, e.g. 2011-01-01T01:00Z

                    This value is ignored unless ''restrict_enrollments_to_course_dates''
                    is set to true.'
                course[end_at]:
                  type: string
                  description: 'Course end date in ISO8601 format. e.g. 2011-01-01T01:00Z

                    This value is ignored unless ''restrict_enrollments_to_course_dates''
                    is set to true.'
                course[license]:
                  type: string
                  description: 'The name of the licensing. Should be one of the following
                    abbreviations

                    (a descriptive name is included in parenthesis for reference):

                    - ''private'' (Private Copyrighted)

                    - ''cc_by_nc_nd'' (CC Attribution Non-Commercial No Derivatives)

                    - ''cc_by_nc_sa'' (CC Attribution Non-Commercial Share Alike)

                    - ''cc_by_nc'' (CC Attribution Non-Commercial)

                    - ''cc_by_nd'' (CC Attribution No Derivatives)

                    - ''cc_by_sa'' (CC Attribution Share Alike)

                    - ''cc_by'' (CC Attribution)

                    - ''public_domain'' (Public Domain).'
                course[is_public]:
                  type: boolean
                  description: Set to true if course is public to both authenticated
                    and unauthenticated users.
                course[is_public_to_auth_users]:
                  type: boolean
                  description: Set to true if course is public only to authenticated
                    users.
                course[public_syllabus]:
                  type: boolean
                  description: Set to true to make the course syllabus public.
                course[public_syllabus_to_auth]:
                  type: boolean
                  description: Set to true to make the course syllabus public for
                    authenticated users.
                course[public_description]:
                  type: string
                  description: A publicly visible description of the course.
                course[allow_student_wiki_edits]:
                  type: boolean
                  description: If true, students will be able to modify the course
                    wiki.
                course[allow_wiki_comments]:
                  type: boolean
                  description: If true, course members will be able to comment on
                    wiki pages.
                course[allow_student_forum_attachments]:
                  type: boolean
                  description: If true, students can attach files to forum posts.
                course[open_enrollment]:
                  type: boolean
                  description: Set to true if the course is open enrollment.
                course[self_enrollment]:
                  type: boolean
                  description: Set to true if the course is self enrollment.
                course[restrict_enrollments_to_course_dates]:
                  type: boolean
                  description: 'Set to true to restrict user enrollments to the start
                    and end dates of the

                    course. This value must be set to true

                    in order to specify a course start date and/or end date.'
                course[term_id]:
                  type: string
                  description: The unique ID of the term to create to course in.
                course[sis_course_id]:
                  type: string
                  description: The unique SIS identifier.
                course[integration_id]:
                  type: string
                  description: The unique Integration identifier.
                course[hide_final_grades]:
                  type: boolean
                  description: 'If this option is set to true, the totals in student
                    grades summary will

                    be hidden.'
                course[apply_assignment_group_weights]:
                  type: boolean
                  description: Set to true to weight final grade based on assignment
                    groups percentages.
                course[time_zone]:
                  type: string
                  description: 'The time zone for the course. Allowed time zones are

                    {http://www.iana.org/time-zones IANA time zones} or friendlier

                    {http://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html
                    Ruby on Rails time zones}.'
                offer:
                  type: boolean
                  description: 'If this option is set to true, the course will be
                    available to students

                    immediately.'
                enroll_me:
                  type: boolean
                  description: Set to true to enroll the current user as the teacher.
                skip_course_template:
                  type: boolean
                  description: 'If this option is set to true, the template of the
                    account will not be applied to this course

                    It means copy_from_course_template will not be executed. This
                    option is thought for a course copy.'
                course[default_view]:
                  type: string
                  description: 'The type of page that users will see when they first
                    visit the course

                    * ''feed'' Recent Activity Dashboard

                    * ''modules'' Course Modules/Sections Page

                    * ''assignments'' Course Assignments List

                    * ''syllabus'' Course Syllabus Page

                    other types may be added in the future'
                course[syllabus_body]:
                  type: string
                  description: The syllabus body for the course
                course[grading_standard_id]:
                  type: integer
                  description: The grading standard id to set for the course.  If
                    no value is provided for this argument the current grading_standard
                    will be un-set from this course.
                course[grade_passback_setting]:
                  type: string
                  description: Optional. The grade_passback_setting for the course.
                    Only 'nightly_sync', 'disabled', and '' are allowed
                course[course_format]:
                  type: string
                  description: Optional. Specifies the format of the course. (Should
                    be 'on_campus', 'online', or 'blended')
                course[post_manually]:
                  type: boolean
                  description: 'Default is false.

                    When true, all grades in the course must be posted manually, and
                    will not be automatically posted.

                    When false, all grades in the course will be automatically posted.'
                enable_sis_reactivation:
                  type: boolean
                  description: When true, will first try to re-activate a deleted
                    course with matching sis_course_id if possible.
    put:
      operationId: update_courses
      summary: Update courses
      tags:
      - courses
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                course_ids:
                  type: array
                  description: List of ids of courses to update. At most 500 courses
                    may be updated in one call.
                event:
                  type: string
                  description: "The action to take on each course.  Must be one of\
                    \ 'offer', 'conclude', 'delete', or 'undelete'.\n* 'offer' makes\
                    \ a course visible to students. This action is also called \"\
                    publish\" on the web site.\n* 'conclude' prevents future enrollments\
                    \ and makes a course read-only for all participants. The course\
                    \ still appears\n  in prior-enrollment lists.\n* 'delete' completely\
                    \ removes the course from the web site (including course menus\
                    \ and prior-enrollment lists).\n  All enrollments are deleted.\
                    \ Course content may be physically deleted at a future date.\n\
                    * 'undelete' attempts to recover a course that has been deleted.\
                    \ (Recovery is not guaranteed; please conclude\n  rather than\
                    \ delete a course if there is any possibility the course will\
                    \ be used again.) The recovered course\n  will be unpublished.\
                    \ Deleted enrollments will not be recovered."
  /v1/courses/{course_id}/files:
    get:
      operationId: list_files_courses
      summary: List files
      tags:
      - files
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: content_types
        in: query
        required: false
        schema:
          type: array
        description: 'Filter results by content-type. You can specify type/subtype
          pairs (e.g.,

          ''image/jpeg''), or simply types (e.g., ''image'', which will match

          ''image/gif'', ''image/jpeg'', etc.).'
      - name: exclude_content_types
        in: query
        required: false
        schema:
          type: array
        description: 'Exclude given content-types from your results. You can specify
          type/subtype pairs (e.g.,

          ''image/jpeg''), or simply types (e.g., ''image'', which will match

          ''image/gif'', ''image/jpeg'', etc.).'
      - name: search_term
        in: query
        required: false
        schema:
          type: string
        description: The partial name of the files to match and return.
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: 'Array of additional information to include.


          "user":: the user who uploaded the file or last edited its content

          "usage_rights":: copyright and license information for the file (see UsageRights)'
      - name: only
        in: query
        required: false
        schema:
          type: array
        description: 'Array of information to restrict to. Overrides include[]


          "names":: only returns file name information'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Sort results by this field. Defaults to 'name'. Note that `sort=user`
          implies `include[]=user`.
      - name: order
        in: query
        required: false
        schema:
          type: string
        description: The sorting order. Defaults to 'asc'.
      responses:
        '200':
          description: OK
  /v1/courses/{course_id}/students:
    get:
      operationId: list_students
      summary: List students
      tags:
      - courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
  /v1/courses/{course_id}/users:
    get:
      operationId: list_users_in_course_users
      summary: List users in course
      tags:
      - courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: search_term
        in: query
        required: false
        schema:
          type: string
        description: The partial name or full ID of the users to match and return
          in the results list.
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: When set, sort the results of the search based on the given field.
      - name: enrollment_type
        in: query
        required: false
        schema:
          type: array
        description: 'When set, only return users where the user is enrolled as this
          type.

          "student_view" implies include[]=test_student.

          This argument is ignored if enrollment_role is given.'
      - name: enrollment_role
        in: query
        required: false
        schema:
          type: string
        description: 'Deprecated

          When set, only return users enrolled with the specified course-level role.  This
          can be

          a role created with the {api:RoleOverridesController#add_role Add Role API}
          or a

          base role type of ''StudentEnrollment'', ''TeacherEnrollment'', ''TaEnrollment'',

          ''ObserverEnrollment'', or ''DesignerEnrollment''.'
      - name: enrollment_role_id
        in: query
        required: false
        schema:
          type: integer
        description: 'When set, only return courses where the user is enrolled with
          the specified

          course-level role.  This can be a role created with the

          {api:RoleOverridesController#add_role Add Role API} or a built_in role id
          with type

          ''StudentEnrollment'', ''TeacherEnrollment'', ''TaEnrollment'', ''ObserverEnrollment'',

          or ''DesignerEnrollment''.'
      - name: section_ids
        in: query
        required: false
        schema:
          type: array
        description: When set, only return users who are enrolled in the given section(s).
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: '- "enrollments":

          Optionally include with each Course the user''s current and invited

          enrollments. If the user is enrolled as a student, and the account has

          permission to manage or view all grades, each enrollment will include a

          ''grades'' key with ''current_score'', ''final_score'', ''current_grade''
          and

          ''final_grade'' values.

          - "locked": Optionally include whether an enrollment is locked.

          - "avatar_url": Optionally include avatar_url.

          - "bio": Optionally include each user''s bio.

          - "test_student": Optionally include the course''s Test Student,

          if present. Default is to not include Test Student.

          - "custom_links": Optionally include plugin-supplied custom links for each
          student,

          such as analytics information

          - "current_grading_period_scores": if enrollments is included as

          well as this directive, the scores returned in the enrollment

          will be for the current grading period if there is one. A

          ''grading_period_id'' value will also be included with the

          scores. if grading_period_id is nil there is no current grading

          period and the score is a total score.

          - "uuid": Optionally include the users uuid'
      - name: user_id
        in: query
        required: false
        schema:
          type: string
        description: 'If this parameter is given and it corresponds to a user in the
          course,

          the +page+ parameter will be ignored and the page containing the specified
          user

          will be returned instead.'
      - name: user_ids
        in: query
        required: false
        schema:
          type: array
        description: 'If included, the course users set will only include users with
          IDs

          specified by the param. Note: this will not work in conjunction

          with the "user_id" argument but multiple user_ids can be included.'
      - name: enrollment_state
        in: query
        required: false
        schema:
          type: array
        description: 'When set, only return users where the enrollment workflow state
          is of one of the given types.

          "active" and "invited" enrollments are returned by default.'
      responses:
        '200':
          description: OK
