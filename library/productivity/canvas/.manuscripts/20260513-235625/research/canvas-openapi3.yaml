  /v1/courses/{course_id}/assignments/{assignment_id}/submissions:
    post:
      operationId: submit_assignment_courses
      summary: Submit an assignment
      tags:
      - submissions
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment[text_comment]:
                  type: string
                  description: Include a textual comment with the submission.
                submission[group_comment]:
                  type: boolean
                  description: 'Whether or not this comment should be sent to the
                    entire group (defaults

                    to false). Ignored if this is not a group assignment or if no
                    text_comment

                    is provided.'
                submission[submission_type]:
                  type: string
                  description: 'The type of submission being made. The assignment
                    submission_types must

                    include this submission type as an allowed option, or the submission
                    will be rejected with a 400 error.


                    The submission_type given determines which of the following parameters
                    is

                    used. For instance, to submit a URL, +submission[submission_type]+
                    must be

                    set to "online_url", otherwise the +submission[url]+ parameter
                    will be

                    ignored.


                    "basic_lti_launch" requires the assignment submission_type "online"
                    or "external_tool"'
                submission[body]:
                  type: string
                  description: 'Submit the assignment as an HTML document snippet.
                    Note this HTML snippet

                    will be sanitized using the same ruleset as a submission made
                    from the

                    Canvas web UI. The sanitized HTML will be returned in the response
                    as the

                    submission body. Requires a submission_type of "online_text_entry".'
                submission[url]:
                  type: string
                  description: 'Submit the assignment as a URL. The URL scheme must
                    be "http" or "https",

                    no "ftp" or other URL schemes are allowed. If no scheme is given
                    (e.g.

                    "www.example.com") then "http" will be assumed. Requires a submission_type

                    of "online_url" or "basic_lti_launch".'
                submission[file_ids]:
                  type: array
                  description: 'Submit the assignment as a set of one or more previously
                    uploaded files

                    residing in the submitting user''s files section (or the group''s
                    files

                    section, for group assignments).


                    To upload a new file to submit, see the submissions {api:SubmissionsApiController#create_file
                    Upload a file API}.


                    Requires a submission_type of "online_upload".'
                submission[media_comment_id]:
                  type: string
                  description: 'The media comment id to submit. Media comment ids
                    can be submitted via

                    this API, however, note that there is not yet an API to generate
                    or list

                    existing media comments, so this functionality is currently of
                    limited use.


                    Requires a submission_type of "media_recording".'
                submission[media_comment_type]:
                  type: string
                  description: The type of media comment being submitted.
                submission[user_id]:
                  type: integer
                  description: Submit on behalf of the given user. Requires grading
                    permission.
                submission[annotatable_attachment_id]:
                  type: integer
                  description: 'The Attachment ID of the document being annotated.
                    This should match

                    the annotatable_attachment_id on the assignment.


                    Requires a submission_type of "student_annotation".'
                submission[submitted_at]:
                  type: string
                  description: Choose the time the submission is listed as submitted
                    at.  Requires grading permission.
    get:
      operationId: list_assignment_submissions_courses
      summary: List assignment submissions
      tags:
      - submissions
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: Associations to include with the group.  "group" will add group_id
          and group_name.
      - name: grouped
        in: query
        required: false
        schema:
          type: boolean
        description: If this argument is true, the response will be grouped by student
          groups.
      responses:
        '200':
          description: OK
