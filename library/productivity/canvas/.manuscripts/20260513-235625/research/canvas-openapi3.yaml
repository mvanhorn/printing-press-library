  /v1/courses/{course_id}/assignments/{assignment_id}/submissions/{user_id}:
    get:
      operationId: get_single_submission_courses
      summary: Get a single submission
      tags:
      - submissions
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: Associations to include with the group.
      responses:
        '200':
          description: OK
    put:
      operationId: grade_or_comment_on_submission_courses
      summary: Grade or comment on a submission
      tags:
      - submissions
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment[text_comment]:
                  type: string
                  description: Add a textual comment to the submission.
                comment[attempt]:
                  type: integer
                  description: The attempt number (starts at 1) to associate the comment
                    with.
                comment[group_comment]:
                  type: boolean
                  description: 'Whether or not this comment should be sent to the
                    entire group (defaults

                    to false). Ignored if this is not a group assignment or if no
                    text_comment

                    is provided.'
                comment[media_comment_id]:
                  type: string
                  description: 'Add an audio/video comment to the submission. Media
                    comments can be added

                    via this API, however, note that there is not yet an API to generate
                    or

                    list existing media comments, so this functionality is currently
                    of

                    limited use.'
                comment[media_comment_type]:
                  type: string
                  description: The type of media comment being added.
                comment[file_ids]:
                  type: array
                  description: 'Attach files to this comment that were previously
                    uploaded using the

                    Submission Comment API''s files action'
                include:
                  type: array
                  description: 'Associations to include with the submission. "submission_comments"
                    is always included by default.

                    - "submission_comments": Comments on the submission (always included)

                    - "visibility": Whether the assignment is visible to the owner
                    of the submission

                    - "sub_assignment_submissions": Sub-assignment submissions for
                    discussion checkpoints

                    - "peer_review_submissions": Peer review submission data when
                    peer review allocation and grading is enabled

                    - "provisional_grades": Provisional grades (only available for
                    moderated assignments)

                    - "group": Group information (id and name) for group assignments'
                prefer_points_over_scheme:
                  type: boolean
                  description: Treat posted_grade as points if the value matches a
                    grading scheme value
                submission[posted_grade]:
                  type: string
                  description: "Assign a score to the submission, updating both the\
                    \ \"score\" and \"grade\"\nfields on the submission record. This\
                    \ parameter can be passed in a few\ndifferent formats:\n\npoints::\
                    \ A floating point or integral value, such as \"13.5\". The grade\n\
                    \  will be interpreted directly as the score of the assignment.\n\
                    \  Values above assignment.points_possible are allowed, for awarding\n\
                    \  extra credit.\npercentage:: A floating point value appended\
                    \ with a percent sign, such as\n   \"40%\". The grade will be\
                    \ interpreted as a percentage score on the\n   assignment, where\
                    \ 100% == assignment.points_possible. Values above 100%\n   are\
                    \ allowed, for awarding extra credit.\nletter grade:: A letter\
                    \ grade, following the assignment's defined letter\n   grading\
                    \ scheme. For example, \"A-\". The resulting score will be the\
                    \ high\n   end of the defined range for the letter grade. For\
                    \ instance, if \"B\" is\n   defined as 86% to 84%, a letter grade\
                    \ of \"B\" will be worth 86%. The\n   letter grade will be rejected\
                    \ if the assignment does not have a defined\n   letter grading\
                    \ scheme. For more fine-grained control of scores, pass in\n \
                    \  points or percentage rather than the letter grade.\n\"pass/complete/fail/incomplete\"\
                    :: A string value of \"pass\" or \"complete\"\n   will give a\
                    \ score of 100%. \"fail\" or \"incomplete\" will give a score\
                    \ of\n   0.\n\nNote that assignments with grading_type of \"pass_fail\"\
                    \ can only be\nassigned a score of 0 or assignment.points_possible,\
                    \ nothing inbetween. If\na posted_grade in the \"points\" or \"\
                    percentage\" format is sent, the grade\nwill only be accepted\
                    \ if the grade equals one of those two values."
                submission[excuse]:
                  type: boolean
                  description: Sets the "excused" status of an assignment.
                submission[late_policy_status]:
                  type: string
                  description: "Sets the late policy status to either \"late\", \"\
                    missing\", \"extended\", \"none\", or null.\n  NB: \"extended\"\
                    \ values can only be set in the UI when the \"UI features for\
                    \ 'extended' Submissions\" Account Feature is on"
                submission[sticker]:
                  type: string
                  description: Sets the sticker for the submission.
                submission[seconds_late_override]:
                  type: integer
                  description: Sets the seconds late if late policy status is "late"
                submission[peer_review]:
                  type: boolean
                  description: 'When true, updates the peer review sub assignment
                    submission instead of

                    the parent assignment submission. The parent assignment must have
                    peer reviews

                    enabled, the peer_review_allocation_and_grading feature flag must
                    be enabled

                    for the course, and the assignment must have an associated peer
                    review

                    sub assignment. If any of these conditions are not met, the API
                    will

                    return a 422 error.'
                rubric_assessment:
                  type: string
                  description: "Assign a rubric assessment to this assignment submission.\
                    \ The\nsub-parameters here depend on the rubric for the assignment.\
                    \ The general\nformat is, for each row in the rubric:\n\nThe points\
                    \ awarded for this row.\n  rubric_assessment[criterion_id][points]\n\
                    \nThe rating id for the row.\n  rubric_assessment[criterion_id][rating_id]\n\
                    \nComments to add for this row.\n  rubric_assessment[criterion_id][comments]\n\
                    \nFor example, if the assignment rubric is (in JSON format):\n\
                    \  !!!javascript\n  [\n    {\n      'id': 'crit1',\n      'points':\
                    \ 10,\n      'description': 'Criterion 1',\n      'ratings':\n\
                    \      [\n        { 'id': 'rat1', 'description': 'Good', 'points':\
                    \ 10 },\n        { 'id': 'rat2', 'description': 'Poor', 'points':\
                    \ 3 }\n      ]\n    },\n    {\n      'id': 'crit2',\n      'points':\
                    \ 5,\n      'description': 'Criterion 2',\n      'ratings':\n\
                    \      [\n        { 'id': 'rat1', 'description': 'Exemplary',\
                    \ 'points': 5 },\n        { 'id': 'rat2', 'description': 'Complete',\
                    \ 'points': 5 },\n        { 'id': 'rat3', 'description': 'Incomplete',\
                    \ 'points': 0 }\n      ]\n    }\n  ]\n\nThen a possible set of\
                    \ values for rubric_assessment would be:\n    rubric_assessment[crit1][points]=3&rubric_assessment[crit1][rating_id]=rat1&rubric_assessment[crit2][points]=5&rubric_assessment[crit2][rating_id]=rat2&rubric_assessment[crit2][comments]=Well%20Done."
