  /v1/users/{user_id}/enrollments:
    get:
      operationId: list_enrollments_users
      summary: List enrollments
      tags:
      - enrollments
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: array
        description: 'A list of enrollment types to return. Accepted values are

          ''StudentEnrollment'', ''TeacherEnrollment'', ''TaEnrollment'',

          ''DesignerEnrollment'', and ''ObserverEnrollment.'' If omitted, all enrollment

          types are returned. This argument is ignored if `role` is given.'
      - name: role
        in: query
        required: false
        schema:
          type: array
        description: 'A list of enrollment roles to return. Accepted values include
          course-level

          roles created by the {api:RoleOverridesController#add_role Add Role API}

          as well as the base enrollment types accepted by the `type` argument above.'
      - name: state
        in: query
        required: false
        schema:
          type: array
        description: 'Filter by enrollment state. If omitted, ''active'' and ''invited''
          enrollments

          are returned. The following synthetic states are supported only when

          querying a user''s enrollments (either via user_id argument or via user

          enrollments endpoint): +current_and_invited+, +current_and_future+, +current_future_and_restricted+,
          +current_and_concluded+'
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: 'Array of additional information to include on the enrollment
          or user records.

          "avatar_url" and "group_ids" will be returned on the user record. If "current_points"

          is specified, the fields "current_points" and (if the caller has

          permissions to manage grades) "unposted_current_points" will be included

          in the "grades" hash for student enrollments.'
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: 'Filter by user_id (only valid for course or section enrollment

          queries). If set to the current user''s id, this is a way to

          determine if the user has any enrollments in the course or section,

          independent of whether the user has permission to view other people

          on the roster.'
      - name: grading_period_id
        in: query
        required: false
        schema:
          type: integer
        description: 'Return grades for the given grading_period.  If this parameter
          is not

          specified, the returned grades will be for the whole course.'
      - name: enrollment_term_id
        in: query
        required: false
        schema:
          type: integer
        description: 'Returns only enrollments for the specified enrollment term.
          This parameter

          only applies to the user enrollments path. May pass the ID from the

          enrollment terms api or the SIS id prepended with ''sis_term_id:''.'
      - name: sis_account_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only enrollments for the specified SIS account ID(s).
          Does not

          look into sub_accounts. May pass in array or string.'
      - name: sis_course_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only enrollments matching the specified SIS course ID(s).

          May pass in array or string.'
      - name: sis_section_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only section enrollments matching the specified SIS
          section ID(s).

          May pass in array or string.'
      - name: sis_user_id
        in: query
        required: false
        schema:
          type: array
        description: 'Returns only enrollments for the specified SIS user ID(s). May
          pass in

          array or string.'
      - name: created_for_sis_id
        in: query
        required: false
        schema:
          type: array
        description: 'If sis_user_id is present and created_for_sis_id is true, Returns
          only

          enrollments for the specified SIS ID(s).

          If a user has two sis_id''s, one enrollment may be created using one of
          the

          two ids. This would limit the enrollments returned from the endpoint to

          enrollments that were created from a sis_import with that sis_user_id'
      responses:
        '200':
          description: OK
