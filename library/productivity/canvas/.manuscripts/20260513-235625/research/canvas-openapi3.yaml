  /v1/calendar_events:
    get:
      operationId: list_calendar_events
      summary: List calendar events
      tags:
      - calendar_events
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Defaults to "event"
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: 'Only return events since the start_date (inclusive).

          Defaults to today. The value should be formatted as: yyyy-mm-dd or ISO 8601
          YYYY-MM-DDTHH:MM:SSZ.'
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: 'Only return events before the end_date (inclusive).

          Defaults to start_date. The value should be formatted as: yyyy-mm-dd or
          ISO 8601 YYYY-MM-DDTHH:MM:SSZ.

          If end_date is the same as start_date, then only events on that day are

          returned.'
      - name: undated
        in: query
        required: false
        schema:
          type: boolean
        description: 'Defaults to false (dated events only).

          If true, only return undated events and ignore start_date and end_date.'
      - name: all_events
        in: query
        required: false
        schema:
          type: boolean
        description: 'Defaults to false (uses start_date, end_date, and undated criteria).

          If true, all events are returned, ignoring start_date, end_date, and undated
          criteria.'
      - name: context_codes
        in: query
        required: false
        schema:
          type: array
        description: 'List of context codes of courses, groups, users, or accounts
          whose events you want to see.

          If not specified, defaults to the current user (i.e personal calendar,

          no course/group events). Limited to 10 context codes, additional ones are

          ignored. The format of this field is the context type, followed by an

          underscore, followed by the context id. For example: course_42'
      - name: excludes
        in: query
        required: false
        schema:
          type: array
        description: Array of attributes to exclude. Possible values are "description",
          "child_events" and "assignment"
      - name: includes
        in: query
        required: false
        schema:
          type: array
        description: Array of optional attributes to include. Possible values are
          "web_conference" and "series_natural_language"
      - name: important_dates
        in: query
        required: false
        schema:
          type: boolean
        description: 'Defaults to false.

          If true, only events with important dates set to true will be returned.'
      - name: blackout_date
        in: query
        required: false
        schema:
          type: boolean
        description: 'Defaults to false.

          If true, only events with blackout date set to true will be returned.'
      responses:
        '200':
          description: OK
    post:
      operationId: create_calendar_event
      summary: Create a calendar event
      tags:
      - calendar_events
      parameters: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_event[context_code]:
                  type: string
                  description: 'Context code of the course, group, user, or account
                    whose calendar

                    this event should be added to.'
                calendar_event[title]:
                  type: string
                  description: Short title for the calendar event.
                calendar_event[description]:
                  type: string
                  description: Longer HTML description of the event.
                calendar_event[start_at]:
                  type: string
                  description: Start date/time of the event.
                calendar_event[end_at]:
                  type: string
                  description: End date/time of the event.
                calendar_event[location_name]:
                  type: string
                  description: Location name of the event.
                calendar_event[location_address]:
                  type: string
                  description: Location address
                calendar_event[time_zone_edited]:
                  type: string
                  description: 'Time zone of the user editing the event. Allowed time
                    zones are

                    {http://www.iana.org/time-zones IANA time zones} or friendlier

                    {http://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html
                    Ruby on Rails time zones}.'
                calendar_event[all_day]:
                  type: boolean
                  description: When true event is considered to span the whole day
                    and times are ignored.
                calendar_event[child_event_data][X][start_at]:
                  type: string
                  description: 'Section-level start time(s) if this is a course event.
                    X can be any

                    identifier, provided that it is consistent across the start_at,
                    end_at

                    and context_code'
                calendar_event[child_event_data][X][end_at]:
                  type: string
                  description: Section-level end time(s) if this is a course event.
                calendar_event[child_event_data][X][context_code]:
                  type: string
                  description: Context code(s) corresponding to the section-level
                    start and end time(s).
                calendar_event[duplicate][count]:
                  type: number
                  description: Number of times to copy/duplicate the event.  Count
                    cannot exceed 200.
                calendar_event[duplicate][interval]:
                  type: number
                  description: Defaults to 1 if duplicate `count` is set.  The interval
                    between the duplicated events.
                calendar_event[duplicate][frequency]:
                  type: string
                  description: Defaults to "weekly".  The frequency at which to duplicate
                    the event
                calendar_event[duplicate][append_iterator]:
                  type: boolean
                  description: 'Defaults to false.  If set to `true`, an increasing
                    counter number will be appended to the event title

                    when the event is duplicated.  (e.g. Event 1, Event 2, Event 3,
                    etc)'
                calendar_event[rrule]:
                  type: string
                  description: 'The recurrence rule to create a series of recurring
                    events.

                    Its value is the {https://icalendar.org/iCalendar-RFC-5545/3-8-5-3-recurrence-rule.html
                    iCalendar RRULE}

                    defining how the event repeats. Unending series not supported.'
                calendar_event[blackout_date]:
                  type: boolean
                  description: 'If the blackout_date is true, this event represents
                    a holiday or some

                    other special day that does not count in course pacing.'
