          Note that the API will prefer matching on canonical user ID if the ID has

          a numeric form. It will only search against other fields if non-numeric

          in form, or if the numeric value doesn''t yield any matches. Queries by

          administrative users will search on SIS ID, Integration ID, login ID,

          name, or email address'
      - name: enrollment_type
        in: query
        required: false
        schema:
          type: string
        description: 'When set, only return users enrolled with the specified course-level
          base role.

          This can be a base role type of ''student'', ''teacher'',

          ''ta'', ''observer'', or ''designer''.'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'The column to sort results by. For efficiency, use +id+ if you
          intend to retrieve

          many pages of results. In the future, other sort options may be rate-limited

          after 50 pages.'
      - name: order
        in: query
        required: false
        schema:
          type: string
        description: The order to sort the given column by.
      - name: include_deleted_users
        in: query
        required: false
        schema:
          type: boolean
        description: 'When set to true and used with an account context, returns users
          who have deleted

          pseudonyms for the context'
      - name: uuids
        in: query
        required: false
        schema:
          type: array
        description: 'When set, only return users with the specified UUIDs. UUIDs
          after the first 100

          are ignored.'
