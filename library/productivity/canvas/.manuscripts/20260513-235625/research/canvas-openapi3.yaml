                  description: 'Valid if the event whose ID is in the URL is part
                    of a series.

                    Update just the event whose ID is in in the URL, all events

                    in the series, or the given event and all those following.

                    Some updates may create a new series. For example, changing the
                    start time

                    of this and all following events from the middle of a series.'
                calendar_event[blackout_date]:
                  type: boolean
                  description: 'If the blackout_date is true, this event represents
                    a holiday or some

                    other special day that does not count in course pacing.'
    delete:
      operationId: delete_calendar_event
      summary: Delete a calendar event
      tags:
      - calendar_events
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: cancel_reason
        in: query
        required: false
        schema:
          type: string
        description: Reason for deleting/canceling the event.
      - name: which
        in: query
        required: false
        schema:
          type: string
        description: 'Valid if the event whose ID is in the URL is part of a series.

          Delete just the event whose ID is in in the URL, all events

          in the series, or the given event and all those following.'
      responses:
        '200':
          description: OK
