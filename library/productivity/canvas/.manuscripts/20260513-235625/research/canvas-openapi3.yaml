                  type: integer
                  description: Submit on behalf of the given user. Requires grading
                    permission.
                submission[annotatable_attachment_id]:
                  type: integer
                  description: 'The Attachment ID of the document being annotated.
                    This should match

                    the annotatable_attachment_id on the assignment.


                    Requires a submission_type of "student_annotation".'
                submission[submitted_at]:
                  type: string
                  description: Choose the time the submission is listed as submitted
                    at.  Requires grading permission.
