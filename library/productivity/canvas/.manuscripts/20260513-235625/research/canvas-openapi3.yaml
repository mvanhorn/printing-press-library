                  type: boolean
                  description: Show the course summary (list of assignments and calendar
                    events) on the syllabus page. Default is true.
                default_due_time:
                  type: string
                  description: 'Set the default due time for assignments. This is
                    the time that will be pre-selected in the Canvas user interface

                    when setting a due date for an assignment. It does not change
                    when any existing assignment is due. It should be

                    given in 24-hour HH:MM:SS format. The default is "23:59:59". Use
                    "inherit" to inherit the account setting.'
                conditional_release:
                  type: boolean
                  description: Enable or disable individual learning paths for students
                    based on assessment
