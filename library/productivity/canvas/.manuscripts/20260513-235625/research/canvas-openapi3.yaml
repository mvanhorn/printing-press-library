  /v1/courses/{course_id}/students/submissions:
    get:
      operationId: list_submissions_for_multiple_assignments_courses
      summary: List submissions for multiple assignments
      tags:
      - submissions
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        description: ID
      - name: student_ids
        in: query
        required: false
        schema:
          type: array
        description: 'List of student ids to return submissions for. If this argument
          is

          omitted, return submissions for the calling user. Students may only list

          their own submissions. Observers may only list those of associated

          students. The special id "all" will return submissions for all students

          in the course/section as appropriate.'
      - name: assignment_ids
        in: query
        required: false
        schema:
          type: array
        description: 'List of assignments to return submissions for. If none are given,

          submissions for all assignments are returned.'
      - name: grouped
        in: query
        required: false
        schema:
          type: boolean
        description: 'If this argument is present, the response will be grouped by
          student,

          rather than a flat array of submissions.'
      - name: post_to_sis
        in: query
        required: false
        schema:
          type: boolean
        description: 'If this argument is set to true, the response will only include

          submissions for assignments that have the post_to_sis flag set to true and

          user enrollments that were added through sis.'
      - name: submitted_since
        in: query
        required: false
        schema:
          type: string
        description: 'If this argument is set, the response will only include submissions
          that

          were submitted after the specified date_time. This will exclude

          submissions that do not have a submitted_at which will exclude unsubmitted

          submissions.

          The value must be formatted as ISO 8601 YYYY-MM-DDTHH:MM:SSZ.'
      - name: graded_since
        in: query
        required: false
        schema:
          type: string
        description: 'If this argument is set, the response will only include submissions
          that

          were graded after the specified date_time. This will exclude

          submissions that have not been graded.

          The value must be formatted as ISO 8601 YYYY-MM-DDTHH:MM:SSZ.'
      - name: grading_period_id
        in: query
        required: false
        schema:
          type: integer
        description: 'The id of the grading period in which submissions are being
          requested

          (Requires grading periods to exist on the account)'
      - name: workflow_state
        in: query
        required: false
        schema:
          type: string
        description: The current status of the submission
      - name: enrollment_state
        in: query
        required: false
        schema:
          type: string
        description: 'The current state of the enrollments. If omitted will include
          all

          enrollments that are not deleted.'
      - name: state_based_on_date
        in: query
        required: false
        schema:
          type: boolean
        description: 'If omitted it is set to true. When set to false it will ignore
          the effective

          state of the student enrollments and use the workflow_state for the

          enrollments. The argument is ignored unless enrollment_state argument is

          also passed.'
      - name: order
        in: query
        required: false
        schema:
          type: string
        description: 'The order submissions will be returned in.  Defaults to "id".  Doesn''t

          affect results for "grouped" mode.'
      - name: order_direction
        in: query
        required: false
        schema:
          type: string
        description: 'Determines whether ordered results are returned in ascending
          or descending

          order.  Defaults to "ascending".  Doesn''t affect results for "grouped"
          mode.'
      - name: include
        in: query
        required: false
        schema:
          type: array
        description: 'Associations to include with the group. `total_scores` requires
          the

          `grouped` argument.'
      responses:
        '200':
          description: OK
