# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "plaud-web-pp-cli"
display_name = "Plaud Web"
description = "Unofficial Plaud Web endpoints observed from a user's signed-in Plaud Web session for organizing user-owned recordings."
project_kind = "cli"

[secrets.file]
path = "~/.config/plaud-web-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
PLAUD_WEB_BEARER_AUTH = true
