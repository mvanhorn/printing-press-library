version: 2
project_name: concur-pp-cli
changelog:
  disable: true
builds:
  - id: concur-pp-cli
    main: ./cmd/concur-pp-cli
    binary: concur-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/concur/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: concur-pp-mcp
    main: ./cmd/concur-pp-mcp
    binary: concur-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: concur-pp-cli
    repository:
      owner: enlewof
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every expense-report and travel workflow Concur's web app offers, plus policy validation, approval triage, and duplicate detection no Concur tool has -- filed through the same session your browser already uses."
    install: |
      bin.install "concur-pp-cli"
      bin.install "concur-pp-mcp"
