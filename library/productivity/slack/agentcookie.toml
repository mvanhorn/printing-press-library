# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "slack-pp-cli"
display_name = "Slack"
description = "Every Slack read your token can make, mirrored to local SQLite so your history outlives Slack's own retention wall."
project_kind = "cli"

[secrets.file]
path = "~/.config/slack-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
SLACK_BOT_TOKEN = true
SLACK_USER_TOKEN = true
