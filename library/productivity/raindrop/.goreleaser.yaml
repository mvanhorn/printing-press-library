version: 2
project_name: raindrop-pp-cli
changelog:
  disable: true
builds:
  - id: raindrop-pp-cli
    main: ./cmd/raindrop-pp-cli
    binary: raindrop-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/raindrop/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: raindrop-pp-mcp
    main: ./cmd/raindrop-pp-mcp
    binary: raindrop-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: raindrop-pp-cli
    repository:
      owner: srijits
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Complete Raindrop.io control plus offline search, safe cleanup, and durable knowledge workflows."
    install: |
      bin.install "raindrop-pp-cli"
      bin.install "raindrop-pp-mcp"
