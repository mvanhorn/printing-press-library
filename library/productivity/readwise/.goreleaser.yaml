version: 2
project_name: readwise-pp-cli
changelog:
  disable: true
builds:
  - id: readwise-pp-cli
    main: ./cmd/readwise-pp-cli
    binary: readwise-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/readwise/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: readwise-pp-mcp
    main: ./cmd/readwise-pp-mcp
    binary: readwise-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: readwise-pp-cli
    repository:
      owner: vinnyp
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Readwise and Reader feature, plus a local mirror of your whole library that you can search, triage and dedupe offline."
    install: |
      bin.install "readwise-pp-cli"
      bin.install "readwise-pp-mcp"
