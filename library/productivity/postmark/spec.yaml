components:
  schemas:
    Attachment:
      description: An attachment for an email message.
      properties:
        Name:
          type: string
        Content:
          type: string
        ContentType:
          type: string
        ContentID:
          type: string
    AttachmentCollection:
      type: array
      items:
        $ref: '#/components/schemas/Attachment'
    BounceActivationResponse:
      properties:
        Message:
          type: string
        Bounce:
          $ref: '#/components/schemas/BounceInfoResponse'
    BounceCountElement:
      properties:
        Name:
          type: string
        Count:
          type: integer
        Type:
          type: string
    BounceDumpResponse:
      properties:
