  securitySchemes:
    serverToken:
      type: apiKey
      in: header
      name: X-Postmark-Server-Token
      x-auth-vars:
      - name: POSTMARK_SERVER_TOKEN
        kind: per_call
        required: false
        sensitive: true
        description: Server API token for one Postmark server. Set this OR POSTMARK_ACCOUNT_TOKEN with --server <name>.
      x-auth-key-url: https://account.postmarkapp.com/servers
    accountToken:
      type: apiKey
      in: header
      name: X-Postmark-Account-Token
      x-auth-vars:
      - name: POSTMARK_ACCOUNT_TOKEN
        kind: per_call
        required: false
        sensitive: true
        description: Account API token. Required for servers, domains, senders, template push, and data removals; also lets
          --server <name> look up server tokens.
      x-auth-key-url: https://account.postmarkapp.com/api_tokens
