        SMTPApiErrors:
          type: integer
    OutboundSearchResponse:
      description: ''
      properties:
        TotalCount:
          type: integer
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/OutboundMessageDetail'
          description: JSON array of message objects (up to 500)
    SendEmailBatchRequest:
      type: array
      items:
        $ref: '#/components/schemas/SendEmailRequest'
    SendEmailBatchResponse:
      type: array
      items:
        $ref: '#/components/schemas/SendEmailResponse'
    SendEmailRequest:
      properties:
        From:
          description: The sender email address. Must have a registered and confirmed Sender Signature.
          type: string
          example: sender@example.com
        To:
          description: Recipient email address. Multiple addresses are comma seperated. Max 50.
          type: string
          example: jane@example.com
        Cc:
          description: Recipient email address. Multiple addresses are comma seperated. Max 50.
          type: string
        Bcc:
          description: Bcc recipient email address. Multiple addresses are comma seperated. Max 50.
          type: string
        Subject:
          description: Email Subject
          type: string
          example: Your receipt
        Tag:
          description: Email tag that allows you to categorize outgoing emails and get detailed statistics.
          type: string
        HtmlBody:
          description: If no TextBody specified HTML email message
          type: string
        TextBody:
          description: If no HtmlBody specified Plain text email message
          type: string
          example: Thanks for your order.
        ReplyTo:
          description: Reply To override email address. Defaults to the Reply To set in the sender signature.
          type: string
        TrackOpens:
          description: Activate open tracking for this email.
          type: boolean
        TrackLinks:
          type: string
          enum:
          - None
          - HtmlAndText
          - HtmlOnly
          - TextOnly
          description: 'Link tracking: None, HtmlAndText, HtmlOnly, or TextOnly'
        Headers:
          type: array
          items:
            $ref: '#/components/schemas/MessageHeader'
          description: 'JSON array of custom headers: [{"Name":"X-Order-ID","Value":"1234"}]'
        Attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: 'JSON array of attachments: [{"Name":"invoice.pdf","Content":"<base64>","ContentType":"application/pdf"}]'
        MessageStream:
          type: string
          description: Message stream ID to send through. Defaults to the server's transactional stream (outbound).
        Metadata:
          type: object
          additionalProperties:
            type: string
          description: Custom key/value metadata stored with the message (searchable via metadata_<key>).
      required:
      - From
      - To
    SendEmailResponse:
      description: The standard response when a postmark message is sent
      properties:
        To:
          type: string
        SubmittedAt:
          type: string
          format: date-time
        MessageID:
          type: string
        ErrorCode:
          type: integer
        Message:
          type: string
    SendEmailTemplatedBatchRequest:
      properties:
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/EmailWithTemplateRequest'
          description: JSON array of message objects (up to 500)
    SenderListingResults:
