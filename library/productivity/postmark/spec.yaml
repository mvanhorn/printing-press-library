openapi: 3.0.3
info:
  title: Postmark
  version: '2026-09-30'
  description: Postmark transactional and broadcast email API. Server-scoped endpoints authenticate with the X-Postmark-Server-Token
    header; account-scoped endpoints (servers, domains, sender signatures, template push, data removals) use X-Postmark-Account-Token.
  x-display-name: Postmark
  x-website: https://postmarkapp.com
servers:
- url: https://api.postmarkapp.com
security:
- serverToken: []
  accountToken: []
x-learn:
  ticker_patterns:
  - ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  entity_lookup_seeds:
    bounce_type:
    - canonical: HardBounce
      aliases:
      - hard bounce
      - hard bounces
      - permanent bounce
    - canonical: SoftBounce
      aliases:
      - soft bounce
      - soft bounces
    - canonical: Transient
      aliases:
      - deferred
      - temporary failure
    - canonical: SpamComplaint
      aliases:
      - spam complaint
      - complaint
      - marked as spam
    - canonical: Blocked
      aliases:
      - blocked bounce
    - canonical: DnsError
      aliases:
      - dns error
    - canonical: AutoResponder
      aliases:
      - auto responder
      - out of office
    suppression_reason:
    - canonical: HardBounce
      aliases:
      - hard bounce suppression
    - canonical: SpamComplaint
      aliases:
      - spam complaint suppression
    - canonical: ManualSuppression
      aliases:
      - manual suppression
      - manually suppressed
    message_stream_type:
    - canonical: Transactional
      aliases:
      - transactional stream
      - outbound stream
    - canonical: Broadcasts
      aliases:
      - broadcast stream
      - broadcast
      - broadcasts stream
    - canonical: Inbound
      aliases:
      - inbound stream
    message_event:
    - canonical: Delivered
      aliases:
      - delivery
      - delivered event
    - canonical: Opened
      aliases:
      - open
      - opens
    - canonical: LinkClicked
      aliases:
      - click
      - clicks
      - link click
    - canonical: Bounced
      aliases:
      - bounce event
    - canonical: SubscriptionChanged
      aliases:
      - unsubscribe
      - subscription change
    template_type:
    - canonical: Standard
      aliases:
      - standard template
    - canonical: Layout
      aliases:
      - layout
      - layouts
      - layout template
paths:
  /bounces:
    get:
      operationId: list
      tags:
      - Bounces API
      summary: Get bounces
      parameters:
      - name: count
        in: query
        required: true
        description: Number of bounces to return per request. Max 500.
        schema:
          type: integer
          maximum: 500
          default: 100
      - name: offset
        in: query
        required: true
        description: Number of bounces to skip.
        schema:
          type: integer
          default: 0
      - name: type
        in: query
        required: false
        description: Filter by type of bounce
        schema:
          type: string
          enum:
          - HardBounce
          - Transient
          - Unsubscribe
          - Subscribe
          - AutoResponder
          - AddressChange
          - DnsError
          - SpamNotification
          - OpenRelayTest
          - Unknown
          - SoftBounce
          - VirusNotification
          - ChallengeVerification
          - BadEmailAddress
          - SpamComplaint
          - ManuallyDeactivated
          - Unconfirmed
          - Blocked
          - SMTPApiError
          - InboundError
          - DMARCPolicy
          - TemplateRenderingFailed
      - name: inactive
        in: query
        required: false
        description: Filter by emails that were deactivated by Postmark due to the bounce. Set to true or false. If this isn't
          specified it will return both active and inactive.
        schema:
          type: boolean
      - name: emailFilter
        in: query
        required: false
        description: Filter by email address
        schema:
          type: string
          format: email
      - name: messageID
        in: query
        required: false
        description: Filter by messageID
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: Filter by tag
        schema:
          type: string
      - name: todate
        in: query
        required: false
        description: Filter messages up to the date specified. e.g. `2014-02-01` or `2014-02-01T10:00:00` (Eastern Time)
        schema:
          type: string
      - name: fromdate
        in: query
        required: false
        description: Filter messages starting from the date specified. e.g. `2014-02-01` or `2014-02-01T10:00:00` (Eastern
          Time)
        schema:
          type: string
      - name: messagestream
        in: query
        required: false
        description: Filter by message stream ID. Defaults to the transactional stream (outbound).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BounceSearchResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: bounces
    x-resource-id: ID
  /bounces/{bounceid}:
    get:
      operationId: get
      tags:
      - Bounces API
      summary: Get a single bounce
      parameters:
      - name: bounceid
        in: path
        required: true
        description: The ID of the bounce to retrieve.
        schema:
          type: string
          example: '692560173'
        example: '692560173'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BounceInfoResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: bounces
      x-happy-args: --json
  /bounces/{bounceid}/activate:
    put:
      operationId: activate
      tags:
      - Bounces API
      summary: Activate a bounce
      parameters:
      - name: bounceid
        in: path
        required: true
        description: The ID of the Bounce to activate.
        schema:
          type: string
          example: '692560173'
        example: '692560173'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BounceActivationResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: bounces
  /bounces/{bounceid}/dump:
    get:
      tags:
      - Bounces API
      summary: Get bounce dump
      parameters:
      - name: bounceid
        in: path
        required: true
        description: The ID for the bounce dump to retrieve.
        schema:
          type: string
          example: '692560173'
        example: '692560173'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BounceDumpResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      operationId: dump
      x-postmark-token: server
      x-pp-resource: bounces
      x-happy-args: --json
  /data-removals:
    post:
      operationId: create
      tags:
      - Data Removals API
      summary: Request irreversible removal of a recipient's data (enabled on request by Postmark)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - RequestedFor
              properties:
                RequestedBy:
                  type: string
                  example: privacy@example.com
                RequestedFor:
                  type: string
                  example: jane@example.com
                NotifyWhenCompleted:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRemovalStatus'
        '422':
          description: Postmark API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
      x-postmark-token: account
      x-pp-resource: data-removals
      x-live-dogfood-requires-tier: data-removals-enabled
  /data-removals/{dataRemovalId}:
    get:
      operationId: get
      tags:
      - Data Removals API
      summary: Check a data removal request
      parameters:
      - name: dataRemovalId
        in: path
        required: true
        description: Data removal request ID
        schema:
          type: string
          example: '91011'
        example: '91011'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRemovalStatus'
        '422':
          description: Postmark API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
      x-postmark-token: account
      x-pp-resource: data-removals
      x-happy-args: --json
      x-live-dogfood-requires-tier: data-removals-enabled
  /deliverystats:
    get:
      operationId: deliveryStats
      summary: Get delivery stats
      tags:
      - Bounces API
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatsResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: bounces
  /domains:
    get:
      operationId: list
      summary: List Domains
      tags:
      - Domains API
      parameters:
      - name: count
        in: query
        required: true
        description: Number of records to return per request. Max 500.
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
      - name: offset
        in: query
        required: true
        description: Number of records to skip
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListingResults'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
    post:
      operationId: create
      summary: Create a Domain
      tags:
      - Domains API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreationModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainExtendedInformation'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
    x-resource-id: ID
  /domains/{domainid}:
    get:
      operationId: get
      tags:
      - Domains API
      summary: Get a Domain
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Domain that should be retrieved.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainExtendedInformation'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
      x-happy-args: --json
    put:
      operationId: update
      tags:
      - Domains API
      summary: Update a Domain
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Domain that should be modified by the request.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainEditingModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainExtendedInformation'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
    delete:
      operationId: delete
      tags:
      - Domains API
      summary: Delete a Domain
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Domain that should be deleted by the request.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
  /domains/{domainid}/rotatedkim:
    post:
      operationId: rotateDkim
      tags:
      - Domains API
      summary: Rotate DKIM Key
      description: 'Creates a new DKIM key to replace your current key. Until the DNS entries are confirmed,

        the new values will be in the `DKIMPendingHost` and `DKIMPendingTextValue` fields.

        After the new DKIM value is verified in DNS, the pending values will migrate to

        `DKIMTextValue` and `DKIMPendingTextValue` and Postmark will begin to sign emails

        with the new DKIM key.

        '
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Sender Signature for which a new DKIM Key should be generated.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DKIMRotationResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
  /domains/{domainid}/verifydkim:
    put:
      operationId: verifyDkim
      tags:
      - Domains API
      summary: Request DNS Verification for DKIM
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Domain for which DKIM DNS records should be verified.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainExtendedInformation'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
  /domains/{domainid}/verifyreturnpath:
    put:
      operationId: verifyReturnPath
      tags:
      - Domains API
      summary: Request DNS Verification for Return-Path
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Domain for which Return-Path DNS records should be verified.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainExtendedInformation'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: account
      x-pp-resource: domains
  /domains/{domainid}/verifyspf:
    post:
      operationId: verifySpf
      tags:
      - Domains API
      summary: Request DNS Verification for SPF (deprecated by Postmark)
      parameters:
      - name: domainid
        in: path
        required: true
        description: The ID for the Domain for which SPF DNS records should be verified.
        schema:
          type: string
          example: '2345678'
        example: '2345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSPFResult'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      deprecated: true
      x-postmark-token: account
      x-pp-resource: domains
  /email:
    post:
      operationId: send
      tags:
      - Sending API
      summary: Send a single email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: email
  /email/batch:
    post:
      operationId: sendBatch
      tags:
      - Sending API
      summary: Send a batch of emails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailBatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailBatchResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: email
  /email/batchWithTemplates:
    post:
      operationId: sendBatchWithTemplates
      tags:
      - Sending API
      - Templates API
      summary: Send a batch of email using templates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailTemplatedBatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailBatchResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: email
  /email/bulk:
    post:
      operationId: sendBulk
      tags:
      - Bulk Email API
      summary: Send one message to many recipients (bulk). Requires account approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRequestStatus'
        '422':
          description: Postmark API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
      x-postmark-token: server
      x-pp-resource: email
      x-live-dogfood-requires-tier: bulk-approved
    get:
      operationId: bulkList
      tags:
      - Bulk Email API
      summary: List bulk requests on this server, newest first
      parameters:
      - name: count
        in: query
        required: false
        description: Number of requests to return
        schema:
          type: integer
      - name: paginationKey
        in: query
        required: false
        description: Opaque cursor from the previous page's PaginationKey
        schema:
          type: string
      x-pp-pagination: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Requests:
                    type: array
                    description: Bulk request status objects, newest first.
                  PaginationKey:
                    type: string
        '422':
          description: Postmark API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
      x-postmark-token: server
      x-pp-resource: email
      x-live-dogfood-requires-tier: bulk-approved
  /email/bulk/{bulkRequestId}:
    get:
      operationId: bulkStatus
      tags:
      - Bulk Email API
      summary: Get the status of one bulk request
      parameters:
      - name: bulkRequestId
        in: path
        required: true
        description: Bulk request ID (UUID)
        schema:
          type: string
          example: f24af63c-533d-4b7a-ad65-4a7b3202d3a7
        example: f24af63c-533d-4b7a-ad65-4a7b3202d3a7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRequestStatus'
        '422':
          description: Postmark API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
      x-postmark-token: server
      x-pp-resource: email
      x-happy-args: --json
      x-live-dogfood-requires-tier: bulk-approved
  /email/withTemplate:
    post:
      operationId: sendWithTemplate
      tags:
      - Sending API
      - Templates API
      summary: Send an email using a Template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailWithTemplateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '422':
          description: An error was generated due to incorrect use of the API. See the Message associated with this response
            for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPostmarkResponse'
        '500':
          description: Indicates an internal server error occurred.
      x-postmark-token: server
      x-pp-resource: email
  /message-streams:
    get:
      operationId: list
      tags:
      - Message Streams API
      summary: List message streams on this server
      parameters:
      - name: MessageStreamType
        in: query
        required: false
        description: Filter by stream type
        schema:
          type: string
          enum:
          - All
          - Inbound
          - Transactional
          - Broadcasts
          default: All
      - name: IncludeArchivedStreams
        in: query
