      - name: iconId
        type: string
      - name: iconType
        type: string

  Routine:
    fields:
      - name: routineId
        type: string
      - name: title
        type: string

  LinkedCalendar:
    fields:
      - name: calendarId
        type: string
      - name: name
        type: string
      - name: color
        type: string
      - name: externalCalendarId
        type: string
      - name: externalCalendarProvider
        type: string
      - name: email
        type: string
      - name: hidden
        type: bool
      - name: isReadOnly
        type: bool
      - name: connected
        type: bool
      - name: iconId
        type: string
      - name: iconType
        type: string

  Configuration:
    fields:
      - name: streaksVersion
        type: int
