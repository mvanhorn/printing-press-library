version: 2
project_name: normattiva-pp-cli
changelog:
  disable: true
builds:
  - id: normattiva-pp-cli
    main: ./cmd/normattiva-pp-cli
    binary: normattiva-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/normattiva/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: normattiva-pp-mcp
    main: ./cmd/normattiva-pp-mcp
    binary: normattiva-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: normattiva-pp-cli
    repository:
      owner: luigipastore61063-del
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Italian law in your terminal: resolve citations, read any article at any date, diff versions and track amendments."
    install: |
      bin.install "normattiva-pp-cli"
      bin.install "normattiva-pp-mcp"
