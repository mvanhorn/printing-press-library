version: 2
project_name: productive-pp-cli
changelog:
  disable: true
builds:
  - id: productive-pp-cli
    main: ./cmd/productive-pp-cli
    binary: productive-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/productive/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: productive-pp-mcp
    main: ./cmd/productive-pp-mcp
    binary: productive-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: productive-pp-cli
    repository:
      owner: dericknwq
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Fast, paginated Productive.io financial pulls — recognized-revenue-by-budget-month and recognized-vs-invoiced reconciliation as first-class commands, built for a revenue-recognition pipeline instead of a chat window."
    install: |
      bin.install "productive-pp-cli"
      bin.install "productive-pp-mcp"
