extra_commands:
  - name: "blueprint sync"
    description: "Mirror every scenario's blueprint into a local git repo (auto-canonicalized)"
  - name: "blueprint promote"
    description: "Promote a scenario from one team to another with auto-remap of connection/hook/data-store IDs"
  - name: "blueprint diff"
    description: "Diff two blueprint snapshots from the local snapshot table"
  - name: "blueprint restore"
    description: "Restore a blueprint snapshot to the live API"
  - name: "scenarios run-wait"
    description: "Trigger a scenario and block until execution finishes; emit bundles as JSON"
  - name: "scenarios list-all-teams"
    description: "Union scenarios across every team the token can see; supports --stale Nd"
  - name: "dlq inbox"
    description: "Cross-scenario DLQ inbox grouped by error fingerprint with bulk retry/resolve"
  - name: "connections audit"
    description: "Find unused, expiring, or repeatedly errored connections"
  - name: "hooks map"
    description: "Webhook to scenario routing map; flags orphan and shared hooks"

mcp:
  transport: [stdio, http]
