name: plaud
category: productivity
description: "Every conversation, queryable — your transcripts as a searchable history, not a feed."
cli_description: "Every conversation, queryable — your transcripts as a searchable history, not a feed."
version: "0.1.0"
base_url: "https://api.plaud.ai"

auth:
  type: bearer_token
  header: "Authorization"
  in: header
  env_vars:
    - PLAUD_TOKEN

config:
  format: yaml
  path: "~/.plaud-pp-cli/config.yaml"

# MCP enrichment — multi-transport for remote agent reach + named intents
# for canonical multi-step workflows.
# Plaud has 14 endpoints, so endpoint_tools stays visible (not hidden).
mcp:
  transport: [stdio, http]
  intents:
    - name: fetch_recording_with_transcript
      description: "Get a recording's full detail plus its speaker-diarized transcript and AI summary in one call."
      params:
        - name: id
          type: string
          required: true
          description: "Plaud file_id of the recording"
      steps:
        - endpoint: recordings.get
          bind:
            id: ${input.id}
          capture: recording
        - endpoint: ai.transsumm
          bind:
            id: ${input.id}
          capture: transcript
      returns: transcript

    - name: list_recent_recordings
      description: "List recordings within a time window, sorted by start_time descending. Useful for 'show me what I've recorded recently'."
      params:
        - name: limit
          type: integer
          description: "Max recordings to return (default 50)"
      steps:
        - endpoint: recordings.list
          bind:
            limit: ${input.limit}
            is_desc: "true"
          capture: recordings
      returns: recordings

    - name: get_shareable_link_for_recording
      description: "Create a public shareable link for one recording with permission flags."
      params:
        - name: id
          type: string
          required: true
          description: "Recording ID"
      steps:
        - endpoint: recordings.share
          bind:
            id: ${input.id}
          capture: link
      returns: link

    - name: export_recording_as_document
      description: "Export a recording's transcript or summary as DOCX/PDF/TXT/MD."
      params:
        - name: file_id
          type: string
          required: true
          description: "Recording ID"
        - name: prompt_type
          type: string
          required: true
          description: "Either 'trans' or 'summary'"
        - name: to_format
          type: string
          required: true
          description: "docx, pdf, txt, or md"
      steps:
        - endpoint: recordings.export
          bind:
            file_id: ${input.file_id}
            prompt_type: ${input.prompt_type}
            to_format: ${input.to_format}
          capture: export
      returns: export

    - name: trash_recordings_batch
      description: "Move multiple recordings to trash in one call. Returns the batch result with counts."
      params:
        - name: ids
          type: string
          required: true
          description: "JSON array of recording IDs to trash"
      steps:
        - endpoint: recordings.trash
          bind:
            ids: ${input.ids}
          capture: result
      returns: result

    - name: get_recording_audio_url
      description: "Get a pre-signed 24-hour audio download URL for one recording. Optional opus flag for OGG."
      params:
        - name: id
          type: string
          required: true
          description: "Recording ID"
        - name: is_opus
          type: boolean
          description: "Return OGG/Opus instead of MP3"
      steps:
        - endpoint: recordings.audio_url
          bind:
            id: ${input.id}
            is_opus: ${input.is_opus}
          capture: url
      returns: url

    - name: enrich_recordings_by_ids
      description: "Fetch full transcripts + AI content for a batch of recordings in a single call. More efficient than per-recording fetches."
      params:
        - name: ids
          type: string
          required: true
          description: "JSON array of recording IDs"
      steps:
        - endpoint: recordings.list_by_ids
          bind:
            ids: ${input.ids}
          capture: enriched
      returns: enriched

resources:
  users:
    description: "Plaud account"
    endpoints:
      me:
        method: GET
        path: "/user/me"
        description: "Get the authenticated user (cached after sync)"
        response:
          type: object
          item: User

  ai:
    description: "AI subsystem"
    endpoints:
      status:
        method: GET
        path: "/ai/status"
        description: "Check Plaud AI subsystem reachability and current operational state. Useful as a lightweight smoke test before running heavier transcript or summary calls."
        response:
          type: object
          item: AIStatus

      transsumm:
        method: POST
        path: "/ai/transsumm/{id}"
        description: "Combined transcript + AI summary (newer recordings)"
        params:
          - name: id
            type: string
            required: true
            positional: true
            description: "Recording ID"
        body:
          - name: refresh
            type: bool
            description: "Force re-fetch from API instead of local store"
        response:
          type: object
          item: TranssumResult

  recordings:
    description: "Voice recordings"
    endpoints:
      list:
        method: GET
        path: "/file/simple/web"
        description: "List recordings (after sync, served from local store)"
        params:
          - name: skip
            type: int
            description: "Pagination offset"
          - name: limit
            type: int
            description: "Page size (default 50)"
          - name: is_trash
            type: int
            description: "0=active (default), 1=trashed, 2=all"
          - name: sort_by
            type: string
            description: "Sort field: start_time or edit_time (default start_time)"
          - name: is_desc
            type: bool
            description: "Descending order (default true)"
        response:
          type: array
          item: Recording

      get:
        method: GET
        path: "/file/detail/{id}"
        description: "Get full recording detail including content_list"
        params:
          - name: id
            type: string
            required: true
            positional: true
            description: "Recording ID"
        response:
          type: object
          item: RecordingDetail

      list_by_ids:
        method: POST
        path: "/file/list"
        description: "Fetch specific recordings by ID list (returns trans_result + ai_content)"
        body:
          - name: ids
            type: array
            required: true
            description: "Array of recording IDs"
        response:
          type: array
          item: Recording

      audio_url:
        method: GET
        path: "/file/temp-url/{id}"
        description: "Get pre-signed audio download URL (24-hour TTL)"
        params:
          - name: id
            type: string
            required: true
            positional: true
            description: "Recording ID"
          - name: is_opus
            type: bool
            description: "Return OGG/Opus instead of MP3"
        response:
          type: object
          item: AudioURL

      export:
        method: POST
        path: "/file/document/export"
        description: "Export transcript or summary as DOCX/PDF/TXT/MD"
        body:
          - name: file_id
            type: string
            required: true
            description: "Recording ID"
          - name: prompt_type
            type: string
            required: true
            description: "trans or summary"
          - name: to_format
            type: string
            required: true
            description: "docx, pdf, txt, or md"
          - name: title
            type: string
            description: "Document title (defaults to recording filename)"
          - name: create_time
            type: int
            description: "Recording start_time (epoch seconds)"
          - name: with_speaker
            type: int
            description: "1 to include speaker labels (transcript only)"
          - name: with_timestamp
            type: int
            description: "1 to include timestamps (transcript only)"
          - name: trans_content
            type: string
            description: "Transcript content (if not fetched server-side)"
          - name: summary_content
            type: string
            description: "Summary content (if not fetched server-side)"
          - name: summary_id
            type: string
            description: "Summary task_id"
        response:
          type: object
          item: ExportResult

      share:
        method: POST
        path: "/file/share-url/{id}"
        description: "Create a shareable public link for the recording"
        params:
          - name: id
            type: string
            required: true
            positional: true
            description: "Recording ID"
        body:
          - name: can_view_transcript
            type: bool
            description: "Allow viewers to see the transcript"
          - name: can_view_summary
            type: bool
            description: "Allow viewers to see the summary"
          - name: can_download_audio
            type: bool
            description: "Allow viewers to download the audio"
          - name: expires_in
            type: int
            description: "Expiry in seconds (omit for no expiry)"
        response:
          type: object
          item: ShareableLink

      trash:
        method: POST
        path: "/file/trash/"
        description: "Move recordings to trash (batch)"
        body:
          - name: ids
            type: array
            required: true
            description: "Array of recording IDs to trash"
        response:
          type: object
          item: BatchResult

      untrash:
        method: POST
        path: "/file/untrash/"
        description: "Restore recordings from trash (batch)"
        body:
          - name: ids
            type: array
            required: true
            description: "Array of recording IDs to restore"
        response:
          type: object
          item: BatchResult

      delete:
        method: DELETE
        path: "/file/"
        description: "Permanently delete recordings (batch, irreversible)"
        body:
          - name: ids
            type: array
            required: true
            description: "Array of recording IDs to permanently delete"
        response:
          type: object
          item: BatchResult

      upload_info:
        method: POST
        path: "/others/upload-info"
        description: "Pre-flight telemetry call (used internally before exports)"
        body:
          - name: info
            type: object
            required: true
            description: "Telemetry envelope { event_cat, event_param: { action, file_key, file_id, summary_id, from } }"
        response:
          type: object
          item: BatchResult

  filetags:
    description: "Folders/tags for recordings"
    endpoints:
      list:
        method: GET
        path: "/filetag/"
        description: "List the user's file tags (folder structure)"
        response:
          type: array
          item: FileTag

extra_commands:
  - name: auth
    description: "Authenticate with Plaud (email+password → JWT)"
    requires_store: false
    subcommands:
      - name: login
        description: "Log in with email and password, persist JWT to config"
      - name: logout
        description: "Clear stored credentials and JWT"
      - name: status
        description: "Show current login status, region, JWT expiry"

  - name: search
    description: "Full-text search across transcripts (FTS5 over local store)"
    requires_store: true

  - name: sync
    description: "Sync recordings, transcripts, and summaries to local SQLite"
    requires_store: true

  - name: sql
    description: "Run a read-only SQL query against the local store"
    requires_store: true

  - name: doctor
    description: "Verify JWT, region, /user/me reachability, store schema"
    requires_store: false

  - name: commitments
    description: "Surface every promise across all transcripts (regex over speaker-diarized content)"
    requires_store: true

  - name: topic
    description: "Trace how often a topic comes up over time (bucketed mention counts)"
    requires_store: true

  - name: about
    description: "Every utterance by one named speaker, optionally filtered by topic"
    requires_store: true

  - name: forgotten
    description: "Commitments you made with no follow-up signal in any later recording"
    requires_store: true

  - name: themes
    description: "N-gram frequency deltas between two time windows (emerging vs decaying)"
    requires_store: true

  - name: cross-meeting
    description: "Every utterance by a person about a topic, ordered chronologically (drift detection)"
    requires_store: true

  - name: silence
    description: "Speakers who used to appear but haven't in N days (last recording + last topic)"
    requires_store: true

  - name: mentioned-me
    description: "Third-party mentions of the authenticated user across transcripts"
    requires_store: true

  - name: speakers
    description: "List speakers across the corpus with appearance counts and last-heard timestamps"
    requires_store: true

  - name: export
    description: "Bulk export to Obsidian, plain Markdown, or JSON"
    requires_store: true
    subcommands:
      - name: obsidian
        description: "Export recordings to an Obsidian vault structure (YAML frontmatter + transcript + summary)"
      - name: markdown
        description: "Export recordings as plain Markdown files (one per recording)"
      - name: jsonl
        description: "Export recordings as JSONL (one recording per line)"
