version: 2
project_name: plaud-pp-cli
changelog:
  disable: true
builds:
  - id: plaud-pp-cli
    main: ./cmd/plaud-pp-cli
    binary: plaud-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/plaud/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: plaud-pp-mcp
    main: ./cmd/plaud-pp-mcp
    binary: plaud-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: plaud-pp-cli
    repository:
      owner: jnalv414
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every conversation, queryable — your transcripts as a searchable history, not a feed."
    install: |
      bin.install "plaud-pp-cli"
      bin.install "plaud-pp-mcp"
