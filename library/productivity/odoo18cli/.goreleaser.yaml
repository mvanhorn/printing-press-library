version: 2
project_name: odoo18cli-pp-cli
changelog:
  disable: true
builds:
  - id: odoo18cli-pp-cli
    main: ./cmd/odoo18cli-pp-cli
    binary: odoo18cli-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/odoo18cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: odoo18cli-pp-mcp
    main: ./cmd/odoo18cli-pp-mcp
    binary: odoo18cli-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: odoo18cli-pp-cli
    repository:
      owner: andreampiovesana
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Generic Odoo 18 CLI covering the main business models: sales, purchases, products, partners, manufacturing,..."
    install: |
      bin.install "odoo18cli-pp-cli"
      bin.install "odoo18cli-pp-mcp"
