        - name: limit
          in: query
          schema: { type: integer, default: 80 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: order
          in: query
          schema: { type: string, default: "date_order desc" }
      responses:
        "200":
          description: "List of purchase orders"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"

  /xmlrpc/2/object/purchase.order/read:
    post:
      operationId: "getPurchaseOrder"
      summary: "Get a single purchase order by ID"
      tags: ["purchases"]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Purchase order record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"

  /xmlrpc/2/object/purchase.order/create:
    post:
      operationId: "createPurchaseOrder"
      summary: "Create a new purchase order (RFQ)"
      tags: ["purchases"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id: { type: integer, description: "Vendor partner ID" }
                date_order: { type: string, format: date-time }
                user_id: { type: integer }
                payment_term_id: { type: integer }
                notes: { type: string }
      responses:
        "200":
          description: "New purchase order ID"
          content:
            application/json:
              schema:
                type: integer

  # ─── PRODUCTS ────────────────────────────────────────────────────────────

  /xmlrpc/2/object/product.template/search_read:
    post:
      operationId: "listProducts"
      summary: "List product templates"
      tags: ["products"]
      parameters:
        - name: domain
          in: query
          description: "Odoo domain filter as JSON"
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 80 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: order
          in: query
          schema: { type: string, default: "name asc" }
      responses:
        "200":
          description: "List of products"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /xmlrpc/2/object/product.template/read:
    post:
      operationId: "getProduct"
      summary: "Get a single product template by ID"
      tags: ["products"]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Product record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /xmlrpc/2/object/product.template/create:
    post:
      operationId: "createProduct"
      summary: "Create a new product template"
      tags: ["products"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                default_code: { type: string, description: "Internal reference" }
                categ_id: { type: integer }
                list_price: { type: number, description: "Sales price" }
                standard_price: { type: number, description: "Cost" }
                type:
                  type: string
                  enum: [consu, service, product]
                  description: "consu=consumable, service=service, product=storable"
                uom_id: { type: integer }
      responses:
        "200":
          description: "New product ID"
          content:
            application/json:
              schema:
                type: integer

  /xmlrpc/2/object/product.template/write:
    post:
      operationId: "updateProduct"
      summary: "Update product template fields"
      tags: ["products"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
                name: { type: string }
                list_price: { type: number }
                standard_price: { type: number }
                active: { type: boolean }
                default_code: { type: string }
      responses:
        "200":
          description: "True on success"
          content:
            application/json:
              schema:
                type: boolean

