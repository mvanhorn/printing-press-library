  /xmlrpc/2/object/res.partner/create:
    post:
      operationId: "createPartner"
      summary: "Create a new partner"
      tags: ["partners"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                is_company: { type: boolean }
                vat: { type: string, description: "Tax ID / VAT number" }
                street: { type: string }
                city: { type: string }
                country_id: { type: integer }
                customer_rank: { type: integer }
                supplier_rank: { type: integer }
      responses:
        "200":
          description: "New partner ID"
          content:
            application/json:
              schema:
