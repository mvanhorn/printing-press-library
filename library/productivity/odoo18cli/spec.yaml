openapi: "3.1.0"
info:
  title: "Odoo 18"
  description: |
    Generic Odoo 18 CLI covering the main business models: sales, purchases,
    products, partners, manufacturing, inventory, and accounting.

    Connects to the Odoo XML-RPC external API at /xmlrpc/2/common (auth)
    and /xmlrpc/2/object (ORM: search_read, read, create, write).

    Supports multiple Odoo instances via profiles:
      odoo18cli --profile edarredo partners list --limit 10

    Auth: set ODOO_URL, ODOO_DB, ODOO_USER, ODOO_API_KEY environment variables.
    Generate an API key in Odoo via Settings → Users → your user → Account Security.
  version: "1.0.0"
  x-auth-instructions: "Generate an API key in Odoo: Settings → Users → your user → Account Security tab."
  x-display-name: "Odoo 18"

x-auth-type: "api-key"
x-auth-env-var: "ODOO_API_KEY"

servers:
  - url: "https://your-odoo.example.com"
    description: "Odoo 18 instance (override with --url flag or ODOO_URL env var)"

paths:
  /xmlrpc/2/common:
    post:
      operationId: "authenticate"
      summary: "Authenticate and get UID"
      description: |
        Calls common.authenticate(db, username, api_key, {}) via XML-RPC.
        Returns integer UID used in all subsequent object calls.
      tags: ["auth"]
      x-auth-skip: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                db: { type: string }
                username: { type: string }
                api_key: { type: string }
      responses:
        "200":
          description: "UID returned"
          content:
            application/json:
              schema:
                type: integer

  # ─── SALES ───────────────────────────────────────────────────────────────

  /xmlrpc/2/object/sale.order/search_read:
    post:
      operationId: "listSalesOrders"
      summary: "List sales orders"
      description: |
        Calls execute_kw on sale.order/search_read. Returns sales orders
        matching the optional domain filter.
      tags: ["sales"]
      parameters:
        - name: domain
          in: query
          description: "Odoo domain filter as JSON (e.g. [[\"state\",\"=\",\"sale\"]])"
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 80 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: order
          in: query
          schema: { type: string, default: "date_order desc" }
      responses:
        "200":
          description: "List of sales orders"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleOrder"

  /xmlrpc/2/object/sale.order/read:
    post:
      operationId: "getSalesOrder"
      summary: "Get a single sales order by ID"
      tags: ["sales"]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Sales order record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleOrder"

  /xmlrpc/2/object/sale.order/create:
    post:
      operationId: "createSalesOrder"
      summary: "Create a new sales order"
      tags: ["sales"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id: { type: integer, description: "Customer partner ID" }
                date_order: { type: string, format: date-time }
                user_id: { type: integer, description: "Salesperson ID" }
                team_id: { type: integer, description: "Sales team ID" }
                payment_term_id: { type: integer }
                note: { type: string }
      responses:
        "200":
          description: "New sales order ID"
          content:
            application/json:
              schema:
                type: integer

  /xmlrpc/2/object/sale.order/action_confirm:
    post:
      operationId: "confirmSalesOrder"
      summary: "Confirm a quotation into a sales order"
      tags: ["sales"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200":
          description: "True on success"
          content:
            application/json:
              schema:
                type: boolean

  # ─── PURCHASES ───────────────────────────────────────────────────────────

  /xmlrpc/2/object/purchase.order/search_read:
