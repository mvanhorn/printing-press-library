  # ─── INVOICES ────────────────────────────────────────────────────────────

  /xmlrpc/2/object/account.move/search_read:
    post:
      operationId: "listInvoices"
      summary: "List invoices and bills"
      description: |
        Calls execute_kw on account.move/search_read. Use domain to filter
        by move_type (out_invoice, in_invoice, out_refund, in_refund).
      tags: ["invoices"]
      parameters:
        - name: domain
          in: query
          description: "Odoo domain filter as JSON (e.g. [[\"move_type\",\"=\",\"out_invoice\"]])"
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 80 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: order
          in: query
          schema: { type: string, default: "invoice_date desc" }
      responses:
        "200":
          description: "List of invoices"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /xmlrpc/2/object/account.move/read:
    post:
      operationId: "getInvoice"
      summary: "Get a single invoice or bill by ID"
      tags: ["invoices"]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "Invoice record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

components:
  schemas:
    SaleOrder:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "Order reference (e.g. S00042)" }
        partner_id: { description: "Customer [id, name]" }
        partner_name: { type: string }
        date_order: { type: string, format: date-time }
        amount_untaxed: { type: number }
        amount_tax: { type: number }
        amount_total: { type: number }
        currency_id: { description: "Currency [id, name]" }
        state:
          type: string
          enum: [draft, sent, sale, done, cancel]
          description: "draft=Quotation, sent=Sent, sale=Sales Order, done=Locked, cancel=Cancelled"
        user_id: { description: "Salesperson [id, name]" }
        team_id: { description: "Sales team [id, name]" }
        payment_term_id: { description: "Payment terms [id, name]" }
        invoice_status:
          type: string
          enum: [upselling, invoiced, to invoice, nothing]
        note: { type: string }

    PurchaseOrder:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "Order reference (e.g. P00042)" }
        partner_id: { description: "Vendor [id, name]" }
        date_order: { type: string, format: date-time }
        date_approve: { type: string, format: date-time }
        amount_untaxed: { type: number }
        amount_tax: { type: number }
        amount_total: { type: number }
        currency_id: { description: "Currency [id, name]" }
        state:
          type: string
          enum: [draft, sent, to approve, purchase, done, cancel]
        user_id: { description: "Purchase representative [id, name]" }
        payment_term_id: { description: "Payment terms [id, name]" }
        invoice_status:
          type: string
          enum: [nothing, to invoice, invoiced]

    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        default_code: { type: string, description: "Internal reference" }
        categ_id: { description: "Category [id, name]" }
        list_price: { type: number, description: "Sales price" }
        standard_price: { type: number, description: "Cost" }
        type:
          type: string
          enum: [consu, service, product]
        uom_id: { description: "Unit of measure [id, name]" }
        active: { type: boolean }
        sale_ok: { type: boolean }
        purchase_ok: { type: boolean }

    Partner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        mobile: { type: string }
        is_company: { type: boolean }
        customer_rank: { type: integer, description: "> 0 = customer" }
        supplier_rank: { type: integer, description: "> 0 = vendor" }
        vat: { type: string, description: "Tax ID / VAT number" }
        street: { type: string }
        city: { type: string }
        zip: { type: string }
        country_id: { description: "Country [id, name]" }
        property_payment_term_id: { description: "Customer payment terms [id, name]" }
        property_supplier_payment_term_id: { description: "Vendor payment terms [id, name]" }

    ManufacturingOrder:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "MO reference (e.g. WH/MO/00042)" }
        product_id: { description: "Product to produce [id, name]" }
        product_qty: { type: number }
        product_uom_id: { description: "Unit of measure [id, name]" }
        bom_id: { description: "Bill of materials [id, name]" }
        date_start: { type: string, format: date-time }
        date_finished: { type: string, format: date-time }
        date_deadline: { type: string, format: date-time }
        state:
          type: string
          enum: [draft, confirmed, progress, to_close, done, cancel]
        user_id: { description: "Responsible [id, name]" }
        company_id: { description: "Company [id, name]" }
        qty_producing: { type: number }
        qty_produced: { type: number }

    Bom:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, description: "BOM reference" }
        product_tmpl_id: { description: "Product template [id, name]" }
        product_id: { description: "Product variant [id, name]" }
        product_qty: { type: number }
        product_uom_id: { description: "Unit of measure [id, name]" }
        type:
          type: string
          enum: [normal, phantom, subcontract]
        active: { type: boolean }

    Workcenter:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        active: { type: boolean }
        time_efficiency: { type: number, description: "Efficiency %" }
        capacity: { type: number }
        costs_hour: { type: number }

    Workorder:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        production_id: { description: "Manufacturing order [id, name]" }
        product_id: { description: "Product [id, name]" }
        workcenter_id: { description: "Work center [id, name]" }
        state:
          type: string
          enum: [pending, waiting, ready, progress, done, cancel]
        date_start: { type: string, format: date-time }
        date_finished: { type: string, format: date-time }
        duration_expected: { type: number, description: "Expected duration (minutes)" }
        duration: { type: number, description: "Actual duration (minutes)" }

    Transfer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "Transfer reference (e.g. WH/OUT/00042)" }
        partner_id: { description: "Contact [id, name]" }
        picking_type_id: { description: "Operation type [id, name]" }
        origin: { type: string, description: "Source document" }
        scheduled_date: { type: string, format: date-time }
        date_done: { type: string, format: date-time }
        state:
          type: string
          enum: [draft, waiting, confirmed, assigned, done, cancel]
        company_id: { description: "Company [id, name]" }

    StockMove:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        picking_id: { description: "Transfer [id, name]" }
        product_id: { description: "Product [id, name]" }
        product_uom: { description: "Unit [id, name]" }
        product_uom_qty: { type: number, description: "Demanded quantity" }
        quantity_done: { type: number }
        date: { type: string, format: date-time }
        state:
          type: string
          enum: [draft, cancel, waiting, confirmed, partially_available, assigned, done]
        location_id: { description: "Source location [id, name]" }
        location_dest_id: { description: "Destination location [id, name]" }

    StockQuant:
      type: object
      properties:
        id: { type: integer }
        product_id: { description: "Product [id, name]" }
        location_id: { description: "Location [id, name]" }
        lot_id: { description: "Lot/Serial [id, name]" }
        quantity: { type: number, description: "On-hand quantity" }
        reserved_quantity: { type: number }
        in_date: { type: string, format: date-time }

    Pricelist:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        currency_id: { description: "Currency [id, name]" }
        active: { type: boolean }

    SupplierPrice:
      type: object
      properties:
        id: { type: integer }
        product_tmpl_id: { description: "Product template [id, name]" }
        product_id: { description: "Product variant [id, name]" }
        partner_id: { description: "Vendor [id, name]" }
        price: { type: number }
        min_qty: { type: number }
        delay: { type: integer, description: "Lead time (days)" }
        currency_id: { description: "Currency [id, name]" }

    Account:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        account_type:
          type: string
          description: "asset_receivable, asset_cash, liability_payable, income, expense, etc."
        active: { type: boolean }
        reconcile: { type: boolean }

    JournalEntryLine:
      type: object
      properties:
        id: { type: integer }
        move_id: { description: "Journal entry [id, name]" }
        account_id: { description: "Account [id, name]" }
        partner_id: { description: "Partner [id, name]" }
        name: { type: string, description: "Label" }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }
        date: { type: string, format: date }
        currency_id: { description: "Currency [id, name]" }
        reconciled: { type: boolean }

    Invoice:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "Invoice reference (e.g. INV/2024/00042)" }
        partner_id: { description: "Customer/Vendor [id, name]" }
        date: { type: string, format: date }
        invoice_date: { type: string, format: date }
        invoice_date_due: { type: string, format: date }
        amount_untaxed: { type: number }
        amount_tax: { type: number }
        amount_total: { type: number }
        amount_residual: { type: number, description: "Outstanding balance" }
        currency_id: { description: "Currency [id, name]" }
        state:
          type: string
          enum: [draft, posted, cancel]
        payment_state:
          type: string
          enum: [not_paid, in_payment, paid, partial, reversed, invoicing_legacy]
        move_type:
          type: string
          enum: [out_invoice, out_refund, in_invoice, in_refund, out_receipt, in_receipt, entry]
          description: "out_invoice=Customer Invoice, in_invoice=Vendor Bill"
        invoice_user_id: { description: "Salesperson [id, name]" }
        journal_id: { description: "Journal [id, name]" }

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Odoo-API-Key
      description: "Odoo API key (used as password in XML-RPC calls)"

security:
  - apiKey: []
