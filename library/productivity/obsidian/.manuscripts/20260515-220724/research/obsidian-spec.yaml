name: obsidian
display_name: Obsidian
description: Filesystem-direct CLI for Obsidian vaults — three-layer-protocol frontmatter enforcement, instant offline FTS5 search, token-efficient agent reads, plus optional Local REST API passthrough.
version: "0.1.0"
base_url: "http://127.0.0.1:27123"
cli_description: "Every Obsidian CLI feature, plus protocol-aware frontmatter enforcement, instant offline FTS5 search, and token-efficient agent reads no other Obsidian tool ships."

auth:
  type: bearer_token
  header: Authorization
  in: header
  env_vars:
    - OBSIDIAN_REST_TOKEN
  description: |
    The CLI defaults to filesystem mode and needs no token. Set OBSIDIAN_REST_TOKEN
    only when using --rest mode, which proxies through the coddingtonbear/obsidian-local-rest-api
    community plugin (the Obsidian app must be running with the plugin enabled).

config:
  format: toml
  path: "~/.config/obsidian-pp-cli/config.toml"

resources:
  rest:
    description: Optional Local REST API passthrough (requires the Obsidian app running with the Local REST API community plugin enabled).
    endpoints:
      ping:
        method: GET
        path: /
        description: Verify the Local REST API plugin is reachable.
        no_auth: true
      active:
        method: GET
        path: /active/
        description: Read the file currently open in the Obsidian editor (requires --rest mode).
      append-active:
        method: PATCH
        path: /active/
        description: Append text to the file currently open in the Obsidian editor.
        body:
          - name: text
            type: string
            required: true
            description: Text to append to the active file.
      delete-active:
        method: DELETE
        path: /active/
        description: Delete the file currently open in the Obsidian editor.
      commands:
        method: GET
        path: /commands/
        description: List available Obsidian commands (REST plugin only).
      exec-command:
        method: POST
        path: /commands/{commandId}/
        description: Execute an Obsidian command by its ID.
        params:
          - name: commandId
            type: string
            required: true
            positional: true
            description: Obsidian command identifier from `rest commands`.
      tags:
        method: GET
        path: /tags/
        description: List all tags in the vault via the REST plugin.
      search-simple:
        method: POST
        path: /search/simple/
        description: Simple text search through the REST plugin.
        params:
          - name: query
            type: string
            required: true
            description: Search text.
          - name: contextLength
            type: int
            description: Characters of context to include around matches.

mcp:
  transport: [stdio, http]
