version: 2
project_name: chainels-pp-cli
changelog:
  disable: true
builds:
  - id: chainels-pp-cli
    main: ./cmd/chainels-pp-cli
    binary: chainels-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/chainels/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: chainels-pp-mcp
    main: ./cmd/chainels-pp-mcp
    binary: chainels-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: chainels-pp-cli
    repository:
      owner: user
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Chainels endpoint as a typed command, plus the cross-community search, turnover variance, and stale-issue..."
    install: |
      bin.install "chainels-pp-cli"
      bin.install "chainels-pp-mcp"
