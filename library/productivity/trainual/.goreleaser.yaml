version: 2
project_name: trainual-pp-cli
changelog:
  disable: true
builds:
  - id: trainual-pp-cli
    main: ./cmd/trainual-pp-cli
    binary: trainual-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/trainual/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: trainual-pp-mcp
    main: ./cmd/trainual-pp-mcp
    binary: trainual-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: trainual-pp-cli
    repository:
      owner: devin
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Trainual feature plus compliance audit, assignment gap detection, and training analytics no other tool provides."
    install: |
      bin.install "trainual-pp-cli"
      bin.install "trainual-pp-mcp"
