version: 2
project_name: zohomail-pp-cli
changelog:
  disable: true
builds:
  - id: zohomail-pp-cli
    main: ./cmd/zohomail-pp-cli
    binary: zohomail-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: zohomail-pp-cli
    repository:
      owner: matt-van-horn
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Read, search, inspect, and send Zoho Mail messages from the terminal"
    install: |
      bin.install "zohomail-pp-cli"
