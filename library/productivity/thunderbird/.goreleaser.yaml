version: 2
project_name: thunderbird-pp-cli
changelog:
  disable: true
builds:
  - id: thunderbird-pp-cli
    main: ./cmd/thunderbird-pp-cli
    binary: thunderbird-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/thunderbird/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: thunderbird-pp-mcp
    main: ./cmd/thunderbird-pp-mcp
    binary: thunderbird-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: thunderbird-pp-cli
    repository:
      owner: bri1003
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Search, read and audit the mail Thunderbird already downloaded — offline, read-only, no credentials."
    install: |
      bin.install "thunderbird-pp-cli"
      bin.install "thunderbird-pp-mcp"
