version: 2
project_name: trello-pp-cli
changelog:
  disable: true
builds:
  - id: trello-pp-cli
    main: ./cmd/trello-pp-cli
    binary: trello-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/trello/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: trello-pp-mcp
    main: ./cmd/trello-pp-mcp
    binary: trello-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: trello-pp-cli
    repository:
      owner: techwithtam
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Trello feature, plus a local SQLite mirror, offline search, and cross-board analytics no other Trello tool has."
    install: |
      bin.install "trello-pp-cli"
      bin.install "trello-pp-mcp"
