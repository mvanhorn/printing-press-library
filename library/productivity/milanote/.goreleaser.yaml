version: 2
project_name: milanote-pp-cli
changelog:
  disable: true
builds:
  - id: milanote-pp-cli
    main: ./cmd/milanote-pp-cli
    binary: milanote-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/milanote/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: milanote-pp-mcp
    main: ./cmd/milanote-pp-mcp
    binary: milanote-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: milanote-pp-cli
    repository:
      owner: beausterling
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Treat a Milanote board like an addressable canvas: native headings, lists and checkboxes, laid out on an even grid, and read back as Markdown."
    install: |
      bin.install "milanote-pp-cli"
      bin.install "milanote-pp-mcp"
