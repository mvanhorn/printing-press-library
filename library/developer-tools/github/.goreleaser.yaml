version: 2
project_name: github-pp-cli
changelog:
  disable: true
builds:
  - id: github-pp-cli
    main: ./cmd/github-pp-cli
    binary: github-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/github/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: github-pp-mcp
    main: ./cmd/github-pp-mcp
    binary: github-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: github-pp-cli
    repository:
      owner: brandon-charles-novice-developer
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every gh issue, PR, repo, and code-search workflow, plus a local SQLite mirror, offline full-text search"
    install: |
      bin.install "github-pp-cli"
      bin.install "github-pp-mcp"
