# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "github-pp-cli"
display_name = "GitHub"
description = "Every gh issue, PR, repo, and code-search workflow, plus a local SQLite mirror, offline full-text search, and cross-entity joins no GitHub tool offers."
project_kind = "cli"

[secrets.file]
path = "~/.config/github-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
GH_TOKEN = true
GITHUB_TOKEN = true
