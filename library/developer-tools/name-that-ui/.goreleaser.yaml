version: 2
project_name: name-that-ui-pp-cli
changelog:
  disable: true
builds:
  - id: name-that-ui-pp-cli
    main: ./cmd/name-that-ui-pp-cli
    binary: name-that-ui-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/name-that-ui/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: name-that-ui-pp-mcp
    main: ./cmd/name-that-ui-pp-mcp
    binary: name-that-ui-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: name-that-ui-pp-cli
    repository:
      owner: henrybranchadams
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Turn vague UI language into exact, source-backed component and style guidance that coding agents can use directly."
    install: |
      bin.install "name-that-ui-pp-cli"
      bin.install "name-that-ui-pp-mcp"
