version: 2
project_name: asc-pp-cli
changelog:
  disable: true
builds:
  - id: asc-pp-cli
    main: ./cmd/asc-pp-cli
    binary: asc-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/asc/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: asc-pp-mcp
    main: ./cmd/asc-pp-mcp
    binary: asc-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: asc-pp-cli
    repository:
      owner: justinwfu
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "A read-only App Store Connect cockpit that shows every app you ship at once — review state, builds, downloads, and ratings in one glance."
    install: |
      bin.install "asc-pp-cli"
      bin.install "asc-pp-mcp"
