version: 2
project_name: crates-io-pp-cli
changelog:
  disable: true
builds:
  - id: crates-io-pp-cli
    main: ./cmd/crates-io-pp-cli
    binary: crates-io-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/crates-io/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: crates-io-pp-mcp
    main: ./cmd/crates-io-pp-mcp
    binary: crates-io-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: crates-io-pp-cli
    repository:
      owner: sdhilip200
      name: homebrew-tap
    homepage: "https://github.com/sdhilip200/crates-io-pp-cli"
    description: "Read-only endpoints for crates.io ecosystem intelligence."
    install: |
      bin.install "crates-io-pp-cli"
      bin.install "crates-io-pp-mcp"
