# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "rapidapi-pp-cli"
display_name = "Rapidapi"
description = "RapidAPI Hub marketplace CLI - search APIs, browse categories & collections, inspect providers"
project_kind = "cli"

[secrets.file]
path = "~/.config/rapidapi-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
RAPIDAPI_COOKIE = true
RAPIDAPI_CSRF_TOKEN = true
