version: 2
project_name: rapidapi-pp-cli
changelog:
  disable: true
builds:
  - id: rapidapi-pp-cli
    main: ./cmd/rapidapi-pp-cli
    binary: rapidapi-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/rapidapi/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: rapidapi-pp-mcp
    main: ./cmd/rapidapi-pp-mcp
    binary: rapidapi-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: rapidapi-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "RapidAPI Hub marketplace CLI - search APIs, browse categories & collections, inspect providers"
    install: |
      bin.install "rapidapi-pp-cli"
      bin.install "rapidapi-pp-mcp"
