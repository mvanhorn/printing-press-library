version: 2
project_name: cisa-kev-pp-cli
changelog:
  disable: true
builds:
  - id: cisa-kev-pp-cli
    main: ./cmd/cisa-kev-pp-cli
    binary: cisa-kev-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X cisa-kev-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: cisa-kev-pp-mcp
    main: ./cmd/cisa-kev-pp-mcp
    binary: cisa-kev-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: cisa-kev-pp-cli
    repository:
      owner: solomon-neas
      name: homebrew-tap
    homepage: "https://github.com/solomon-neas/cisa-kev-pp-cli"
    description: "Public JSON feed for the CISA Known Exploited Vulnerabilities catalog."
    install: |
      bin.install "cisa-kev-pp-cli"
      bin.install "cisa-kev-pp-mcp"
