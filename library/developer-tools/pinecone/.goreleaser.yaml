version: 2
project_name: pinecone-pp-cli
changelog:
  disable: true
builds:
  - id: pinecone-pp-cli
    main: ./cmd/pinecone-pp-cli
    binary: pinecone-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/pinecone/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: pinecone-pp-mcp
    main: ./cmd/pinecone-pp-mcp
    binary: pinecone-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: pinecone-pp-cli
    repository:
      owner: dan-bronson
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Pinecone API endpoint, plus cross-index search, namespace drift detection, and offline cost estimation."
    install: |
      bin.install "pinecone-pp-cli"
      bin.install "pinecone-pp-mcp"
