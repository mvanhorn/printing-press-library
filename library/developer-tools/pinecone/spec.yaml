                      message: Internal server error
                    status: 500
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
      x-auth-env-vars:
      - PINECONE_API_KEY
  schemas:
    CreateIndexFromBackupRequest:
      description: The configuration needed to create a Pinecone index from a backup.
      type: object
      properties:
        name:
          example: example-index
          description: 'The name of the index. Resource name must be 1-45 characters
            long, start and end with an alphanumeric character, and consist only of
            lower case alphanumeric characters or ''-''.

            '
          type: string
          minLength: 1
          maxLength: 45
        tags:
          $ref: '#/components/schemas/IndexTags'
        deletion_protection:
          $ref: '#/components/schemas/DeletionProtection'
      required:
      - name
    ReadCapacity:
      description: By default the index will be created with read capacity  mode `OnDemand`.
        If you prefer to allocate dedicated read  nodes for your workload, you must
        specify mode `Dedicated` and additional configurations for `node_type` and
        `scaling`.
      discriminator:
        propertyName: mode
        mapping:
          OnDemand: '#/components/schemas/ReadCapacityOnDemandSpec'
          Dedicated: '#/components/schemas/ReadCapacityDedicatedSpec'
      oneOf:
      - $ref: '#/components/schemas/ReadCapacityOnDemandSpec'
      - $ref: '#/components/schemas/ReadCapacityDedicatedSpec'
    MetadataSchema:
      example:
        fields:
          description:
            filterable: true
          genre:
            filterable: true
          year:
            filterable: true
      description: 'Schema for the behavior of Pinecone''s internal metadata index.
        By default, all metadata is indexed; when `schema` is present, only fields
        which are present in the `fields` object with a `filterable: true` are indexed.
        Note that `filterable: false` is not currently supported.'
      type: object
      properties:
        fields:
          description: A map of metadata field names to their configuration. The field
            name must be a valid metadata field name. The field name must be unique.
          type: object
          additionalProperties:
            type: object
            properties:
              filterable:
                description: Whether the field is filterable. If true, the field is
                  indexed and can be used in filters. Only true values are allowed.
                type: boolean
      required:
      - fields
    IndexSpec:
      description: 'The spec object defines how the index should be deployed.


        For serverless indexes, you define only the [cloud and region](http://docs.pinecone.io/guides/index-data/create-an-index#cloud-regions)
        where the index should be hosted. For pod-based indexes, you define the [environment](http://docs.pinecone.io/guides/indexes/pods/understanding-pod-based-indexes#pod-environments)
        where the index should be hosted, the [pod type and size](http://docs.pinecone.io/guides/indexes/pods/understanding-pod-based-indexes#pod-types)
        to use, and other index characteristics.

        '
      type: object
      oneOf:
      - title: Serverless
        type: object
        properties:
          serverless:
            $ref: '#/components/schemas/ServerlessSpec'
        required:
        - serverless
        additionalProperties: false
      - title: Pod-based
        type: object
        properties:
          pod:
            $ref: '#/components/schemas/PodSpec'
        required:
        - pod
        additionalProperties: false
      - title: BYOC
        type: object
        properties:
          byoc:
            $ref: '#/components/schemas/ByocSpec'
        required:
        - byoc
        additionalProperties: false
    ConfigureIndexRequest:
      description: Configuration used to scale an index.
      type: object
      properties:
        spec:
          description: The spec object defines how the index should be deployed.  Only
            some attributes of an index's spec may be updated.  In general, you can
            modify settings related to scaling and  configuration but you cannot change
            the cloud or region  where the index is hosted.
          oneOf:
          - title: Serverless
            type: object
            properties:
              serverless:
                description: Updated configuration for serverless indexes
                type: object
                properties:
                  read_capacity:
                    $ref: '#/components/schemas/ReadCapacity'
            required:
            - serverless
            additionalProperties: false
          - title: Pod-based
            type: object
            properties:
              pod:
                description: Updated configuration for pod-based indexes
                type: object
                properties:
                  replicas:
                    description: The number of replicas. Replicas duplicate your index.
                      They provide higher availability and throughput. Replicas can
                      be scaled up or down as your needs change.
                    default: 1
                    type: integer
                    format: int32
                    minimum: 1
                  pod_type:
                    description: The type of pod to use. One of `s1`, `p1`, or `p2`
                      appended with `.` and one of `x1`, `x2`, `x4`, or `x8`.
                    default: p1.x1
                    type: string
            required:
            - pod
            additionalProperties: false
          - title: BYOC
            type: object
            properties:
              byoc:
                description: Updated configuration for a BYOC index
                type: object
                properties:
                  read_capacity:
                    $ref: '#/components/schemas/ReadCapacity'
            required:
            - byoc
            additionalProperties: false
        deletion_protection:
          $ref: '#/components/schemas/DeletionProtection'
        tags:
          $ref: '#/components/schemas/IndexTags'
        embed:
          example:
            field_map:
              text: your-text-field
            model: multilingual-e5-large
            read_parameters:
              input_type: query
              truncate: NONE
            write_parameters:
              input_type: passage
          description: 'Configure the integrated inference embedding settings for
            this index.


            You can convert an existing index to an integrated index by specifying
            the embedding model and field_map. The index vector type and dimension
            must match the model vector type and dimension, and the index similarity
