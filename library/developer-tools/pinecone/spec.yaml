  /models:
    get:
      tags:
      - Inference
      summary: List available models
      description: "List the embedding and reranking models hosted by Pinecone. \n\
        \nYou can use hosted models as an integrated part of Pinecone operations or\
        \ for standalone embedding and reranking. For more details, see [Vector embedding](https://docs.pinecone.io/guides/index-data/indexing-overview#vector-embedding)\
        \ and [Rerank results](https://docs.pinecone.io/guides/search/rerank-results)."
      operationId: list_models
      parameters:
      - in: header
        name: X-Pinecone-Api-Version
        description: Required date-based version header
        required: true
        schema:
          default: 2026-04
          type: string
        style: simple
      - in: query
        name: type
        description: Filter models by type ('embed' or 'rerank').
        schema:
          description: 'Filter models by type.

            Possible values: `embed` or `rerank`.'
          x-enum:
          - embed
          - rerank
          type: string
        example: embed
        style: form
      - in: query
        name: vector_type
        description: Filter embedding models by vector type ('dense' or 'sparse').
          Only relevant when `type=embed`.
        schema:
          description: 'Filter models by vector type.

            Possible values: `dense` or `sparse`.'
          x-enum:
          - dense
          - sparse
          type: string
        example: sparse
        style: form
      responses:
        '200':
          description: The list of available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfoList'
              examples:
                multiple-models:
                  summary: Multiple available models.
                  value:
                    models:
                    - default_dimension: 256
                      max_batch_size: 96
                      max_sequence_length: 512
                      modality: text
                      model: example-embedding-model
                      provider_name: Embedding Model Provider
                      short_description: An example embedding model.
                      supported_dimensions:
                      - 256
                      - 512
                      supported_metrics:
                      - cosine
                      - euclidean
                      supported_parameters:
                      - allowed_values:
                        - value1
                        - value2
                        parameter: example_required_param
                        required: true
                        type: one_of
                        value_type: string
                      - allowed_values:
                        - value1
                        - value2
                        default: value1
                        parameter: example_param_with_default
                        required: false
                        type: one_of
                        value_type: string
                      - default: 5
                        max: 10
                        min: 0
                        parameter: example_numeric_range
                        required: false
                        type: numeric_range
                        value_type: integer
                      type: embed
                      vector_type: dense
                    - max_batch_size: 100
                      max_sequence_length: 1024
                      modality: text
                      model: example-reranking-model
                      provider_name: Reranking Model Provider
                      short_description: An example reranking model.
                      supported_parameters:
                      - default: true
                        parameter: example_any_value
                        required: false
                        type: any
                        value_type: boolean
                      type: rerank
        '401':
          description: 'Unauthorized. Possible causes: Invalid API key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Invalid API key.
                    status: 401
        '404':
          description: Model not found.
          content:
            application/json:
              schema:
