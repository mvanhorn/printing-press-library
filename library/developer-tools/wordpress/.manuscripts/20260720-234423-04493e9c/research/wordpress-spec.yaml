    description: "oEmbed discovery and proxying (core /oembed/1.0)"
    endpoints:
      get:
        method: GET
        path: "/oembed/1.0/embed"
        description: oEmbed response for a URL on this site
        no_auth: true
        params:
          - name: url
            type: string
            required: true
            description: URL of the post to embed
            format: uri
          - name: format
            type: string
            default: json
            enum: [json, xml]
            description: Response format
          - name: maxwidth
            type: int
            description: Maximum embed width in pixels
        response:
          type: object
      proxy:
        method: GET
        path: "/oembed/1.0/proxy"
        description: Proxy an external oEmbed request through this site
        params:
          - name: url
            type: string
            required: true
            description: External URL to fetch oEmbed data for
            format: uri
          - name: maxwidth
            type: int
            description: Maximum embed width in pixels
          - name: maxheight
            type: int
            description: Maximum embed height in pixels
          - name: discover
            type: bool
            default: true
            description: Whether to perform oEmbed discovery on the URL
        response:
          type: object
