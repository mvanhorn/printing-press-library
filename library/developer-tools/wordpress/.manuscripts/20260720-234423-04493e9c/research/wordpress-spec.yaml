name: wordpress
description: "WordPress REST API CLI — manage any WordPress site over HTTPS, no SSH required"
version: 0.1.0
category: developer-tools
base_url: "https://wordpress.org/news/wp-json"
health_check_path: "/wp/v2"
auth:
  type: api_key
  header: Authorization
  format: "Basic {username}:{password}"
  in: header
  env_vars: [WORDPRESS_USER, WORDPRESS_APP_PASSWORD]
config:
  format: toml
  path: "~/.config/wordpress-pp-cli/config.toml"
cache:
  enabled: true
  stale_after: 24h
  refresh_timeout: 30s
learn:
  entity_lookup_seeds:
    post_status:
      - canonical: publish
        aliases: [published, live, public]
      - canonical: draft
        aliases: [drafts, unpublished, wip]
      - canonical: future
        aliases: [scheduled, queued]
      - canonical: pending
        aliases: [pending review, awaiting review, submitted]
      - canonical: private
        aliases: [hidden]
      - canonical: trash
        aliases: [trashed, deleted, bin]
    post_type:
      - canonical: post
        aliases: [posts, article, articles, blog post]
      - canonical: page
        aliases: [pages, static page]
      - canonical: attachment
        aliases: [media, image, images, upload, uploads]
      - canonical: wp_block
        aliases: [reusable block, synced pattern, block]
      - canonical: wp_template
        aliases: [template, site template]
      - canonical: wp_template_part
        aliases: [template part, header template, footer template]
      - canonical: nav_menu_item
        aliases: [menu item, nav item]
    context:
      - canonical: view
        aliases: [read, public view]
      - canonical: edit
        aliases: [editor, raw, with raw fields]
      - canonical: embed
        aliases: [minimal, summary]
    comment_status:
      - canonical: approved
        aliases: [approve, live comments]
      - canonical: hold
        aliases: [pending, moderation, unapproved, awaiting moderation]
      - canonical: spam
        aliases: [junk]
  ticker_patterns: ["^[0-9]+$"]
  synonyms:
    most recent: latest
    newest: latest
    writer: author
    categories: category
    tags: tag
  stopwords: [wordpress, wp, site]
mcp:
  transport: [stdio, http]
  orchestration: code
  endpoint_tools: hidden
resources:
  site-health:
    description: WordPress Site Health checks
    endpoints:
      directory-sizes:
        method: GET
        path: "/wp-site-health/v1/directory-sizes"
        response:
          type: object
      authorization-header:
        method: GET
        path: "/wp-site-health/v1/tests/authorization-header"
        response:
          type: object
      background-updates:
        method: GET
        path: "/wp-site-health/v1/tests/background-updates"
        response:
          type: object
      dotorg-communication:
        method: GET
        path: "/wp-site-health/v1/tests/dotorg-communication"
        response:
          type: object
      https-status:
        method: GET
        path: "/wp-site-health/v1/tests/https-status"
        response:
          type: object
      loopback-requests:
        method: GET
        path: "/wp-site-health/v1/tests/loopback-requests"
        response:
          type: object
      page-cache:
        method: GET
        path: "/wp-site-health/v1/tests/page-cache"
        response:
          type: object
  block-directory:
    description: Search the block directory
    endpoints:
      search:
        method: GET
        path: "/wp/v2/block-directory/search"
        params:
          - name: context
            type: string
            default: view
            enum: [view]
            description: "Scope under which the request is made; determines fields present in response."
          - name: page
            type: int
            default: 1
            description: Current page of the collection.
          - name: per_page
            type: int
            default: 10
            description: Maximum number of items to be returned in result set.
          - name: term
            type: string
            required: true
            description: Limit result set to blocks matching the search term.
        response:
          type: array
        no_auth: true
  block-patterns:
    description: Block pattern categories
    endpoints:
      categories:
        method: GET
        path: "/wp/v2/block-patterns/categories"
        response:
          type: array
        no_auth: true
      list:
        method: GET
        path: "/wp/v2/block-patterns/patterns"
        response:
          type: array
        no_auth: true
  block-renderer:
    description: Render a block server-side
    endpoints:
      render:
        method: GET
        path: "/wp/v2/block-renderer/{name}"
        params:
          - name: name
            type: string
            positional: true
            required: true
            description: Name identifier
          - name: name
            type: string
            description: Unique registered name for the block.
          - name: context
            type: string
            enum: [edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: attributes
            type: string
            description: Attributes for the block.
          - name: post_id
            type: int
            description: ID of the post context.
        response:
          type: object
  block-types:
    description: Registered block types
    endpoints:
      list:
        method: GET
        path: "/wp/v2/block-types"
        params:
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: namespace
            type: string
            description: Block namespace.
        response:
          type: array
        no_auth: true
      get:
        method: GET
        path: "/wp/v2/block-types/{namespace}"
        params:
          - name: namespace
            type: string
            positional: true
            required: true
            description: Namespace identifier
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: namespace
            type: string
            description: Block namespace.
        response:
          type: object
        no_auth: true
  blocks:
    description: "Reusable blocks (wp_block)"
    endpoints:
      list:
        method: GET
        path: "/wp/v2/blocks"
        params:
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: page
            type: int
            default: 1
            description: Current page of the collection.
          - name: per_page
            type: int
            default: 10
            description: Maximum number of items to be returned in result set.
          - name: search
            type: string
            description: Limit results to those matching a string.
          - name: after
            type: string
            description: Limit response to posts published after a given ISO8601 compliant date.
            format: date-time
          - name: modified_after
            type: string
            description: Limit response to posts modified after a given ISO8601 compliant date.
            format: date-time
          - name: before
            type: string
            description: Limit response to posts published before a given ISO8601 compliant date.
            format: date-time
          - name: modified_before
            type: string
            description: Limit response to posts modified before a given ISO8601 compliant date.
            format: date-time
          - name: exclude
            type: string
            description: "Ensure result set excludes specific IDs. (comma-separated)"
          - name: include
            type: string
            description: "Limit result set to specific IDs. (comma-separated)"
          - name: search_semantics
            type: string
            enum: [exact]
            description: How to interpret the search input.
          - name: offset
            type: int
            description: Offset the result set by a specific number of items.
          - name: order
            type: string
            default: desc
            enum: [asc, desc]
            description: Order sort attribute ascending or descending.
          - name: orderby
            type: string
            default: date
            enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title]
            description: Sort collection by post attribute.
          - name: search_columns
            type: string
            enum: [post_title, post_content, post_excerpt]
            description: "Array of column names to be searched. (comma-separated)"
          - name: slug
            type: string
            description: "Limit result set to posts with one or more specific slugs. (comma-separated)"
          - name: status
            type: string
            default: publish
            enum: [publish, future, draft, pending, private, trash, auto-draft, inherit, any]
            description: "Limit result set to posts assigned one or more statuses. (comma-separated)"
          - name: tax_relation
            type: string
            enum: [AND, OR]
            description: Limit result set based on relationship between multiple taxonomies.
          - name: wp_pattern_category
            type: string
            description: Limit result set to items with specific terms assigned in the wp_pattern_category taxonomy.
          - name: wp_pattern_category_exclude
            type: string
            description: Limit result set to items except those with specific terms assigned in the wp_pattern_category taxonomy.
        response:
          type: array
      create:
        method: POST
        path: "/wp/v2/blocks"
        body:
          - name: date
            type: string
            description: "The date the post was published, in the site's timezone."
            format: date-time
          - name: date_gmt
            type: string
            description: "The date the post was published, as GMT."
            format: date-time
          - name: slug
            type: string
            description: An alphanumeric identifier for the post unique to its type.
          - name: status
            type: string
            enum: [publish, future, draft, pending, private]
            description: A named status for the post.
          - name: password
            type: string
            description: A password to protect access to the content and excerpt.
          - name: title
            type: string
            description: The title for the post.
          - name: content
            type: string
            description: The content for the post.
          - name: excerpt
            type: string
            description: The excerpt for the post.
          - name: meta
            type: string
            description: Meta fields.
          - name: template
            type: string
            description: The theme file to use to display the post.
          - name: wp_pattern_category
            type: string
            description: "The terms assigned to the post in the wp_pattern_category taxonomy. (comma-separated)"
        response:
          type: object
      get:
        method: GET
        path: "/wp/v2/blocks/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
          - name: id
            type: int
            description: Unique identifier for the post.
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: excerpt_length
            type: int
            description: Override the default excerpt length.
          - name: password
            type: string
            description: The password for the post if it is password protected.
        response:
          type: object
      update:
        method: POST
        path: "/wp/v2/blocks/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        body:
          - name: id
            type: int
            description: Unique identifier for the post.
          - name: date
            type: string
            description: "The date the post was published, in the site's timezone."
            format: date-time
          - name: date_gmt
            type: string
            description: "The date the post was published, as GMT."
            format: date-time
          - name: slug
            type: string
            description: An alphanumeric identifier for the post unique to its type.
          - name: status
            type: string
            enum: [publish, future, draft, pending, private]
            description: A named status for the post.
          - name: password
            type: string
            description: A password to protect access to the content and excerpt.
          - name: title
            type: string
            description: The title for the post.
          - name: content
            type: string
            description: The content for the post.
          - name: excerpt
            type: string
            description: The excerpt for the post.
          - name: meta
            type: string
            description: Meta fields.
          - name: template
            type: string
            description: The theme file to use to display the post.
          - name: wp_pattern_category
            type: string
            description: "The terms assigned to the post in the wp_pattern_category taxonomy. (comma-separated)"
        response:
          type: object
      delete:
        method: DELETE
        path: "/wp/v2/blocks/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        response:
          type: object
  blocks-autosaves:
    description: Blocks autosaves
    endpoints:
      get:
        method: GET
        path: "/wp/v2/blocks/{parent}/autosaves/{id}"
        params:
          - name: parent
            type: int
            positional: true
            required: true
            description: Parent identifier
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
          - name: parent
            type: int
            description: The ID for the parent of the autosave.
          - name: id
            type: int
            description: The ID for the autosave.
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
        response:
          type: object
  block-revisions:
    description: Blocks revisions
    endpoints:
      list:
        method: GET
        path: "/wp/v2/blocks/{parent}/revisions"
        params:
          - name: parent
            type: int
            positional: true
            required: true
            description: Parent identifier
          - name: parent
            type: int
            description: The ID for the parent of the revision.
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: page
            type: int
            default: 1
            description: Current page of the collection.
          - name: per_page
            type: int
            description: Maximum number of items to be returned in result set.
          - name: search
            type: string
            description: Limit results to those matching a string.
          - name: exclude
            type: string
            description: "Ensure result set excludes specific IDs. (comma-separated)"
          - name: include
            type: string
            description: "Limit result set to specific IDs. (comma-separated)"
          - name: offset
            type: int
            description: Offset the result set by a specific number of items.
          - name: order
            type: string
            default: desc
            enum: [asc, desc]
            description: Order sort attribute ascending or descending.
          - name: orderby
            type: string
            default: date
            enum: [date, id, include, relevance, slug, include_slugs, title]
            description: Sort collection by object attribute.
        response:
          type: array
      get:
        method: GET
        path: "/wp/v2/blocks/{parent}/revisions/{id}"
        params:
          - name: parent
            type: int
            positional: true
            required: true
            description: Parent identifier
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
          - name: parent
            type: int
            description: The ID for the parent of the revision.
          - name: id
            type: int
            description: Unique identifier for the revision.
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
        response:
          type: object
      delete:
        method: DELETE
        path: "/wp/v2/blocks/{parent}/revisions/{id}"
        params:
          - name: parent
            type: int
            positional: true
            required: true
            description: Parent identifier
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        response:
          type: object
  categories:
    description: Categories
    endpoints:
      list:
        method: GET
        path: "/wp/v2/categories"
        params:
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: page
            type: int
            default: 1
            description: Current page of the collection.
          - name: per_page
            type: int
            default: 10
            description: Maximum number of items to be returned in result set.
          - name: search
            type: string
            description: Limit results to those matching a string.
          - name: exclude
            type: string
            description: "Ensure result set excludes specific IDs. (comma-separated)"
          - name: include
            type: string
            description: "Limit result set to specific IDs. (comma-separated)"
          - name: order
            type: string
            default: asc
            enum: [asc, desc]
            description: Order sort attribute ascending or descending.
          - name: orderby
            type: string
            default: name
            enum: [id, include, name, slug, include_slugs, term_group, description, count]
            description: Sort collection by term attribute.
          - name: hide_empty
            type: bool
            default: false
            description: Whether to hide terms not assigned to any posts.
          - name: parent
            type: int
            description: Limit result set to terms assigned to a specific parent.
          - name: post
            type: int
            description: Limit result set to terms assigned to a specific post.
          - name: slug
            type: string
            description: "Limit result set to terms with one or more specific slugs. (comma-separated)"
        response:
          type: array
        no_auth: true
      create:
        method: POST
        path: "/wp/v2/categories"
        body:
          - name: description
            type: string
            description: HTML description of the term.
          - name: name
            type: string
            required: true
            description: HTML title for the term.
          - name: slug
            type: string
            description: An alphanumeric identifier for the term unique to its type.
          - name: parent
            type: int
            description: The parent term ID.
          - name: meta
            type: string
            description: Meta fields.
        response:
          type: object
      get:
        method: GET
        path: "/wp/v2/categories/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
          - name: id
            type: int
            description: Unique identifier for the term.
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
        response:
          type: object
        no_auth: true
      update:
        method: POST
        path: "/wp/v2/categories/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        body:
          - name: id
            type: int
            description: Unique identifier for the term.
          - name: description
            type: string
            description: HTML description of the term.
          - name: name
            type: string
            description: HTML title for the term.
          - name: slug
            type: string
            description: An alphanumeric identifier for the term unique to its type.
          - name: parent
            type: int
            description: The parent term ID.
          - name: meta
            type: string
            description: Meta fields.
        response:
          type: object
      delete:
        method: DELETE
        path: "/wp/v2/categories/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        response:
          type: object
  comments:
    description: Comments
    endpoints:
      list:
        method: GET
        path: "/wp/v2/comments"
        params:
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: page
            type: int
            default: 1
            description: Current page of the collection.
          - name: per_page
            type: int
            default: 10
            description: Maximum number of items to be returned in result set.
          - name: search
            type: string
            description: Limit results to those matching a string.
          - name: after
            type: string
            description: Limit response to comments published after a given ISO8601 compliant date.
            format: date-time
          - name: author
            type: string
            description: "Limit result set to comments assigned to specific user IDs. Requires authorization. (comma-separated)"
          - name: author_exclude
            type: string
            description: "Ensure result set excludes comments assigned to specific user IDs. Requires authorization. (comma-separated)"
          - name: author_email
            type: string
            description: Limit result set to that from a specific author email. Requires authorization.
            format: email
          - name: before
            type: string
            description: Limit response to comments published before a given ISO8601 compliant date.
            format: date-time
          - name: exclude
            type: string
            description: "Ensure result set excludes specific IDs. (comma-separated)"
          - name: include
            type: string
            description: "Limit result set to specific IDs. (comma-separated)"
          - name: offset
            type: int
            description: Offset the result set by a specific number of items.
          - name: order
            type: string
            default: desc
            enum: [asc, desc]
            description: Order sort attribute ascending or descending.
          - name: orderby
            type: string
            default: date_gmt
            enum: [date, date_gmt, id, include, post, parent, type]
            description: Sort collection by comment attribute.
          - name: parent
            type: string
            description: "Limit result set to comments of specific parent IDs. (comma-separated)"
          - name: parent_exclude
            type: string
            description: "Ensure result set excludes specific parent IDs. (comma-separated)"
          - name: post
            type: string
            description: "Limit result set to comments assigned to specific post IDs. (comma-separated)"
          - name: status
            type: string
            default: approve
            description: Limit result set to comments assigned a specific status. Requires authorization.
          - name: type
            type: string
            default: comment
            description: Limit result set to comments assigned a specific type. Requires authorization.
          - name: password
            type: string
            description: The password for the post if it is password protected.
        response:
          type: array
        no_auth: true
      create:
        method: POST
        path: "/wp/v2/comments"
        body:
          - name: author
            type: int
            description: "The ID of the user object, if author was a user."
          - name: author_email
            type: string
            description: Email address for the comment author.
            format: email
          - name: author_ip
            type: string
            description: IP address for the comment author.
            format: ip
          - name: author_name
            type: string
            description: Display name for the comment author.
          - name: author_url
            type: string
            description: URL for the comment author.
            format: uri
          - name: author_user_agent
            type: string
            description: User agent for the comment author.
          - name: content
            type: string
            description: The content for the comment.
          - name: date
            type: string
            description: "The date the comment was published, in the site's timezone."
            format: date-time
          - name: date_gmt
            type: string
            description: "The date the comment was published, as GMT."
            format: date-time
          - name: parent
            type: int
            default: 0
            description: The ID for the parent of the comment.
          - name: post
            type: int
            default: 0
            description: The ID of the associated post object.
          - name: status
            type: string
            description: State of the comment.
          - name: meta
            type: string
            description: Meta fields.
        response:
          type: object
      get:
        method: GET
        path: "/wp/v2/comments/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
          - name: id
            type: int
            description: Unique identifier for the comment.
          - name: context
            type: string
            default: view
            enum: [view, embed, edit]
            description: "Scope under which the request is made; determines fields present in response."
          - name: password
            type: string
            description: "The password for the parent post of the comment (if the post is password protected)."
        response:
          type: object
        no_auth: true
      update:
        method: POST
        path: "/wp/v2/comments/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        body:
          - name: id
            type: int
            description: Unique identifier for the comment.
          - name: author
            type: int
            description: "The ID of the user object, if author was a user."
          - name: author_email
            type: string
            description: Email address for the comment author.
            format: email
          - name: author_ip
            type: string
            description: IP address for the comment author.
            format: ip
          - name: author_name
            type: string
            description: Display name for the comment author.
          - name: author_url
            type: string
            description: URL for the comment author.
            format: uri
          - name: author_user_agent
            type: string
            description: User agent for the comment author.
          - name: content
            type: string
            description: The content for the comment.
          - name: date
            type: string
            description: "The date the comment was published, in the site's timezone."
            format: date-time
          - name: date_gmt
            type: string
            description: "The date the comment was published, as GMT."
            format: date-time
          - name: parent
            type: int
            description: The ID for the parent of the comment.
          - name: post
            type: int
            description: The ID of the associated post object.
          - name: status
            type: string
            description: State of the comment.
          - name: meta
            type: string
            description: Meta fields.
        response:
          type: object
      delete:
        method: DELETE
        path: "/wp/v2/comments/{id}"
        params:
          - name: id
            type: int
            positional: true
            required: true
            description: Id identifier
        response:
          type: object
  font-collections:
    description: Font collections
