openapi: 3.0.3
info:
  title: Internet Archive Wayback CDX Server API
  version: "1.0.0"
  description: >
    Query the Internet Archive's Wayback Machine capture index (CDX Server API).
    Given a URL, return the list of archived captures (timestamp, original URL,
    HTTP status, MIME type, and content digest). No authentication required.
    The content digest (SHA1) enables change detection: consecutive identical
    digests mean the page did not change; a digest flip marks a real content change.
servers:
  - url: https://web.archive.org
    description: Wayback Machine CDX server
paths:
  /cdx/search/cdx:
    get:
      operationId: searchCaptures
      summary: Search archived captures for a URL
      description: >
        Return archived captures the Wayback Machine knows for a URL. Supports
        field selection, time bounds, match scope, and collapsing.
      parameters:
        - name: url
          in: query
          required: true
          description: The URL to look up (e.g. example.com or http://example.com/path).
          schema:
            type: string
        - name: output
          in: query
          required: false
          description: Output format. Use json for machine-readable rows.
          schema:
            type: string
            enum: [json, text]
            default: json
        - name: fl
          in: query
          required: false
          description: Comma-separated fields to return (e.g. timestamp,original,statuscode,mimetype,digest,length).
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Lower bound timestamp (YYYYMMDDhhmmss, any prefix).
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Upper bound timestamp (YYYYMMDDhhmmss, any prefix).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Limit the number of rows. Negative values return the most recent N.
          schema:
            type: integer
        - name: matchType
          in: query
          required: false
          description: Match scope for the url parameter.
          schema:
            type: string
            enum: [exact, prefix, host, domain]
        - name: collapse
          in: query
          required: false
          description: Collapse adjacent rows on a field (e.g. digest, or timestamp:8 for daily).
          schema:
            type: string
        - name: filter
          in: query
          required: false
          description: Filter rows by a field regex (e.g. statuscode:200, !mimetype:warc/revisit).
          schema:
            type: string
        - name: showNumPages
          in: query
          required: false
          description: Return only the number of index pages for the query.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Zero-based page index for paginated retrieval of large result sets.
          schema:
            type: integer
      responses:
        "200":
          description: Capture rows. With output=json, a JSON array whose first element is the header row.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
