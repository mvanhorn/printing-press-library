version: 2
project_name: wayback-goat-pp-cli
changelog:
  disable: true
builds:
  - id: wayback-goat-pp-cli
    main: ./cmd/wayback-goat-pp-cli
    binary: wayback-goat-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X wayback-goat-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: wayback-goat-pp-mcp
    main: ./cmd/wayback-goat-pp-mcp
    binary: wayback-goat-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: wayback-goat-pp-cli
    repository:
      owner: alex-bresler
      name: homebrew-tap
    homepage: "https://github.com/alex-bresler/wayback-goat-pp-cli"
    description: "Query the Internet Archive's Wayback Machine capture index (CDX Server API)."
    install: |
      bin.install "wayback-goat-pp-cli"
      bin.install "wayback-goat-pp-mcp"
