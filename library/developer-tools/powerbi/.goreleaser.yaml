version: 2
project_name: powerbi-pp-cli
changelog:
  disable: true
builds:
  - id: powerbi-pp-cli
    main: ./cmd/powerbi-pp-cli
    binary: powerbi-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/powerbi/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: powerbi-pp-mcp
    main: ./cmd/powerbi-pp-mcp
    binary: powerbi-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: powerbi-pp-cli
    repository:
      owner: user
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Pull data from the Microsoft Power BI REST API for analysis in Claude — every read-only feature pbicli has, plus..."
    install: |
      bin.install "powerbi-pp-cli"
      bin.install "powerbi-pp-mcp"
