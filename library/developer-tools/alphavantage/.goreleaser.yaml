version: 2
project_name: alphavantage-pp-cli
changelog:
  disable: true
builds:
  - id: alphavantage-pp-cli
    main: ./cmd/alphavantage-pp-cli
    binary: alphavantage-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/alphavantage/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: alphavantage-pp-mcp
    main: ./cmd/alphavantage-pp-mcp
    binary: alphavantage-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: alphavantage-pp-cli
    repository:
      owner: lokisbo
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Alpha Vantage function, plus a local SQLite cache and quota-aware planning no other AV tool has."
    install: |
      bin.install "alphavantage-pp-cli"
      bin.install "alphavantage-pp-mcp"
