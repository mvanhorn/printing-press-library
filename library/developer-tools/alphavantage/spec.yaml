        response:
          type: object
      ipo:
        method: GET
        path: "/query"
        description: "IPO calendar for the next 3 months (IPO_CALENDAR, CSV)"
        params:
          - name: function
            type: string
            required: false
            default: IPO_CALENDAR
            description: "Alpha Vantage function"
          - name: datatype
            type: string
            required: false
            default: csv
            description: "Response format (csv native)"
        response:
          type: object

  fx:
    description: "Foreign exchange rates"
    endpoints:
      intraday:
        method: GET
        path: "/query"
        description: "Intraday FX (FX_INTRADAY, premium for full history)"
        params:
          - name: function
            type: string
            required: false
            default: FX_INTRADAY
            description: "Alpha Vantage function"
          - name: from_symbol
            type: string
            required: true
            positional: true
            description: "From currency code (e.g., USD)"
          - name: to_symbol
            type: string
            required: true
            positional: true
            description: "To currency code (e.g., JPY)"
          - name: interval
            type: string
            required: false
            default: 5min
            description: "Interval (1min, 5min, 15min, 30min, 60min)"
          - name: outputsize
            type: string
            required: false
            default: compact
            description: "compact or full"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format"
        response:
          type: object
      daily:
        method: GET
        path: "/query"
        description: "Daily FX rates (FX_DAILY)"
        params:
          - name: function
            type: string
            required: false
            default: FX_DAILY
            description: "Alpha Vantage function"
          - name: from_symbol
