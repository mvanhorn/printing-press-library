      intraday:
        method: GET
        path: "/query"
        description: "Intraday crypto time series (DIGITAL_CURRENCY_INTRADAY)"
        params:
          - name: function
            type: string
            required: false
            default: CRYPTO_INTRADAY
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Crypto symbol (e.g., BTC, ETH)"
          - name: market
            type: string
            required: false
            default: USD
            description: "Quote market (e.g., USD, EUR, CNY)"
          - name: interval
