            description: "From currency code"
          - name: to_symbol
            type: string
            required: true
            positional: true
            description: "To currency code"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format"
        response:
          type: object
      monthly:
        method: GET
        path: "/query"
        description: "Monthly FX rates (FX_MONTHLY)"
        params:
          - name: function
            type: string
            required: false
            default: FX_MONTHLY
            description: "Alpha Vantage function"
          - name: from_symbol
            type: string
            required: true
            positional: true
            description: "From currency code"
          - name: to_symbol
            type: string
            required: true
            positional: true
            description: "To currency code"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format"
