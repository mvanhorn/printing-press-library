        description: "Annual and quarterly cash flow statements (CASH_FLOW)"
        params:
          - name: function
            type: string
            required: false
            default: CASH_FLOW
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      earnings:
        method: GET
        path: "/query"
        description: "Historical earnings (EPS) data (EARNINGS)"
        params:
          - name: function
            type: string
            required: false
            default: EARNINGS
            description: "Alpha Vantage function"
          - name: symbol
