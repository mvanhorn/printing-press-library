          type: object

  crypto:
    description: "Cryptocurrency exchange rates and time series"
    endpoints:
      rate:
        method: GET
        path: "/query"
        description: "Realtime exchange rate between two currencies, crypto or fiat (CURRENCY_EXCHANGE_RATE)"
        params:
          - name: function
            type: string
            required: false
            default: CURRENCY_EXCHANGE_RATE
            description: "Alpha Vantage function"
          - name: from_currency
            type: string
            required: true
            positional: true
            description: "From currency (e.g., BTC)"
          - name: to_currency
            type: string
            required: true
            positional: true
            description: "To currency (e.g., USD)"
