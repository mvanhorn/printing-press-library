name: alphavantage
description: "Every Alpha Vantage feature, plus local SQLite cache, FTS5 news search, and quota-aware planning no other Alpha Vantage tool has."
version: "0.1.0"
base_url: "https://www.alphavantage.co"
health_check_path: "/query?function=MARKET_STATUS"

auth:
  type: api_key
  header: apikey
  in: query
  format: "{token}"
  env_vars:
    - ALPHAVANTAGE_API_KEY
  key_url: "https://www.alphavantage.co/support/#api-key"
  description: "Free Alpha Vantage API key. Free tier is 25 requests/day; the CLI tracks quota in a local quota_log."
  verify_path: "/query?function=MARKET_STATUS"

config:
  format: toml
  path: "~/.config/alphavantage-pp-cli/config.toml"

mcp:
  transport: [stdio, http]
  orchestration: code
  endpoint_tools: hidden

resources:
  quote:
    description: "Latest stock quotes and bulk realtime quotes"
    endpoints:
      get:
        method: GET
        path: "/query"
        description: "Latest price and volume for a single ticker (GLOBAL_QUOTE)"
        params:
          - name: function
            type: string
            required: false
            default: GLOBAL_QUOTE
            description: "Alpha Vantage function (defaults to GLOBAL_QUOTE)"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker (e.g., AAPL, NVDA, MSFT)"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format (json or csv)"
        response:
          type: object
      bulk:
        method: GET
        path: "/query"
        description: "Realtime quotes for up to 100 US symbols (premium tier)"
        params:
          - name: function
            type: string
            required: false
            default: REALTIME_BULK_QUOTES
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Comma-separated tickers up to 100 (e.g., AAPL,MSFT,NVDA)"
        response:
          type: object

  series:
    description: "Stock time series (intraday, daily, weekly, monthly)"
    endpoints:
      intraday:
        method: GET
        path: "/query"
        description: "Intraday OHLCV time series at 1/5/15/30/60-min intervals (premium for full 20y history)"
        params:
          - name: function
            type: string
            required: false
            default: TIME_SERIES_INTRADAY
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
          - name: interval
            type: string
            required: false
            default: 5min
            description: "Time interval (1min, 5min, 15min, 30min, 60min)"
          - name: adjusted
            type: bool
            required: false
            default: true
            description: "Adjust for splits/dividends"
          - name: extended_hours
            type: bool
            required: false
            default: true
            description: "Include pre/post-market data"
          - name: month
            type: string
            required: false
            default: ""
            description: "Specific month in YYYY-MM (for historical slicing)"
          - name: outputsize
            type: string
            required: false
            default: compact
            description: "compact (last 100 datapoints) or full (entire history)"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format (json or csv)"
        response:
          type: object
      daily:
        method: GET
        path: "/query"
        description: "Daily OHLCV time series (20+ years; --adjusted requires premium)"
        params:
          - name: function
            type: string
            required: false
            default: TIME_SERIES_DAILY
            description: "Alpha Vantage function (TIME_SERIES_DAILY or TIME_SERIES_DAILY_ADJUSTED)"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
          - name: adjusted
            type: bool
            required: false
            default: false
            description: "If true, requests TIME_SERIES_DAILY_ADJUSTED (premium)"
          - name: outputsize
            type: string
            required: false
            default: compact
            description: "compact (last 100 datapoints) or full (entire history)"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format (json or csv)"
        response:
          type: object
      weekly:
        method: GET
        path: "/query"
        description: "Weekly OHLCV time series (--adjusted adds dividend events)"
        params:
          - name: function
            type: string
            required: false
            default: TIME_SERIES_WEEKLY
            description: "Alpha Vantage function (TIME_SERIES_WEEKLY or TIME_SERIES_WEEKLY_ADJUSTED)"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
          - name: adjusted
            type: bool
            required: false
            default: false
            description: "If true, requests TIME_SERIES_WEEKLY_ADJUSTED"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format (json or csv)"
        response:
          type: object
      monthly:
        method: GET
        path: "/query"
        description: "Monthly OHLCV time series (--adjusted adds dividend events)"
        params:
          - name: function
            type: string
            required: false
            default: TIME_SERIES_MONTHLY
            description: "Alpha Vantage function (TIME_SERIES_MONTHLY or TIME_SERIES_MONTHLY_ADJUSTED)"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
          - name: adjusted
            type: bool
            required: false
            default: false
            description: "If true, requests TIME_SERIES_MONTHLY_ADJUSTED"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format (json or csv)"
        response:
          type: object

  tickers:
    description: "Ticker symbol search (SYMBOL_SEARCH)"
    endpoints:
      lookup:
        method: GET
        path: "/query"
        description: "Search for tickers by keywords with match scoring (SYMBOL_SEARCH)"
        params:
          - name: function
            type: string
            required: false
            default: SYMBOL_SEARCH
            description: "Alpha Vantage function"
          - name: keywords
            type: string
            required: true
            positional: true
            description: "Search keywords (e.g., 'apple', 'tesla')"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format (json or csv)"
        response:
          type: object

  market:
    description: "Global market status"
    endpoints:
      status:
        method: GET
        path: "/query"
        description: "Open/close status for major global equity markets (MARKET_STATUS)"
        params:
          - name: function
            type: string
            required: false
            default: MARKET_STATUS
            description: "Alpha Vantage function"
        response:
          type: object

  options:
    description: "Options chain data (premium for realtime; HISTORICAL_OPTIONS free with limits)"
    endpoints:
      realtime:
        method: GET
        path: "/query"
        description: "Realtime US options chain with Greeks and IV (REALTIME_OPTIONS, premium)"
        params:
          - name: function
            type: string
            required: false
            default: REALTIME_OPTIONS
            description: "Alpha Vantage function (REALTIME_OPTIONS or with --fmv REALTIME_OPTIONS_FMV)"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Underlying ticker"
          - name: contract
            type: string
            required: false
            default: ""
            description: "Specific contract symbol (filters chain)"
          - name: require_greeks
            type: bool
            required: false
            default: false
            description: "Require Greeks/IV in response"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format"
        response:
          type: object
      historical:
        method: GET
        path: "/query"
        description: "Historical options chain (HISTORICAL_OPTIONS, 15+ years)"
        params:
          - name: function
            type: string
            required: false
            default: HISTORICAL_OPTIONS
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Underlying ticker"
          - name: date
            type: string
            required: false
            default: ""
            description: "Date in YYYY-MM-DD (default: latest available)"
          - name: datatype
            type: string
            required: false
            default: json
            description: "Response format"
        response:
          type: object

  news:
    description: "News & sentiment (NEWS_SENTIMENT)"
    endpoints:
      sentiment:
        method: GET
        path: "/query"
        description: "Live and historical market news with per-ticker sentiment scores (NEWS_SENTIMENT)"
        params:
          - name: function
            type: string
            required: false
            default: NEWS_SENTIMENT
            description: "Alpha Vantage function"
          - name: tickers
            type: string
            required: false
            default: ""
            description: "Comma-separated tickers (e.g., AAPL,MSFT,NVDA)"
          - name: topics
            type: string
            required: false
            default: ""
            description: "Comma-separated topics (technology, earnings, ipo, mergers_and_acquisitions, financial_markets, economy_fiscal, economy_monetary, economy_macro, energy_transportation, finance, life_sciences, manufacturing, real_estate, retail_wholesale, blockchain)"
          - name: time_from
            type: string
            required: false
            default: ""
            description: "Lower bound, format YYYYMMDDTHHMM (e.g., 20260101T0000)"
          - name: time_to
            type: string
            required: false
            default: ""
            description: "Upper bound, format YYYYMMDDTHHMM"
          - name: sort
            type: string
            required: false
            default: LATEST
            description: "Sort order: LATEST | EARLIEST | RELEVANCE"
          - name: limit
            type: int
            required: false
            default: 50
            description: "Max items (1-1000)"
        response:
          type: object

  earnings:
    description: "Earnings call transcripts (EARNINGS_CALL_TRANSCRIPT)"
    endpoints:
      transcript:
        method: GET
        path: "/query"
        description: "Earnings call transcript with LLM-generated speaker sentiment"
        params:
          - name: function
            type: string
            required: false
            default: EARNINGS_CALL_TRANSCRIPT
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
          - name: quarter
            type: string
            required: false
            default: ""
            description: "Quarter in YYYYQN format (e.g., 2025Q4)"
        response:
          type: object

  movers:
    description: "Top gainers, losers, and most active (TOP_GAINERS_LOSERS)"
    endpoints:
      top:
        method: GET
        path: "/query"
        description: "Top 20 gainers, losers, and most actively traded US tickers"
        params:
          - name: function
            type: string
            required: false
            default: TOP_GAINERS_LOSERS
            description: "Alpha Vantage function"
        response:
          type: object

  insider:
    description: "Insider transactions (Form 4 filings)"
    endpoints:
      transactions:
        method: GET
        path: "/query"
        description: "Latest and historical insider transactions for a ticker (INSIDER_TRANSACTIONS)"
        params:
          - name: function
            type: string
            required: false
            default: INSIDER_TRANSACTIONS
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object

  institutional:
    description: "Institutional ownership (13F)"
    endpoints:
      holdings:
        method: GET
        path: "/query"
        description: "Institutional holdings for a ticker (INSTITUTIONAL_HOLDINGS)"
        params:
          - name: function
            type: string
            required: false
            default: INSTITUTIONAL_HOLDINGS
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object

  windows:
    description: "Advanced analytics over fixed or sliding windows (ANALYTICS_FIXED_WINDOW / ANALYTICS_SLIDING_WINDOW)"
    endpoints:
      fixed:
        method: GET
        path: "/query"
        description: "Fixed-window analytics: MEAN/STDDEV/CORRELATION across multiple tickers (ANALYTICS_FIXED_WINDOW)"
        params:
          - name: function
            type: string
            required: false
            default: ANALYTICS_FIXED_WINDOW
            description: "Alpha Vantage function"
          - name: SYMBOLS
            flag_name: tickers
            aliases: [symbols]
            type: string
            required: true
            description: "Comma-separated tickers (e.g., AAPL,MSFT,IBM)"
          - name: RANGE
            flag_name: range
            type: string
            required: false
            default: full
            description: "Time range (full, 1day, 1week, 1month, 3month, 1year, etc.)"
          - name: INTERVAL
            flag_name: interval
            type: string
            required: false
            default: DAILY
            description: "Interval: 1min, 5min, 15min, 30min, 60min, DAILY, WEEKLY, MONTHLY"
          - name: OHLC
            flag_name: ohlc
            type: string
            required: false
            default: close
            description: "Price field: open, high, low, close"
          - name: CALCULATIONS
            flag_name: calculations
            type: string
            required: false
            default: MEAN
            description: "Comma-separated calculations: MIN, MAX, MEAN, MEDIAN, CUMULATIVE_RETURN, VARIANCE, STDDEV, MAX_DRAWDOWN, HISTOGRAM, AUTOCORRELATION, COVARIANCE, CORRELATION"
        response:
          type: object
      sliding:
        method: GET
        path: "/query"
        description: "Sliding-window analytics across multiple tickers (ANALYTICS_SLIDING_WINDOW)"
        params:
          - name: function
            type: string
            required: false
            default: ANALYTICS_SLIDING_WINDOW
            description: "Alpha Vantage function"
          - name: SYMBOLS
            flag_name: tickers
            aliases: [symbols]
            type: string
            required: true
            description: "Comma-separated tickers"
          - name: RANGE
            flag_name: range
            type: string
            required: false
            default: full
            description: "Time range"
          - name: INTERVAL
            flag_name: interval
            type: string
            required: false
            default: DAILY
            description: "Interval"
          - name: OHLC
            flag_name: ohlc
            type: string
            required: false
            default: close
            description: "Price field"
          - name: WINDOW_SIZE
            flag_name: window-size
            type: int
            required: false
            default: 20
            description: "Sliding window size in datapoints"
          - name: CALCULATIONS
            flag_name: calculations
            type: string
            required: false
            default: MEAN
            description: "Calculations (see fixed)"
        response:
          type: object

  fundamentals:
    description: "Company fundamentals (overview, statements, dividends, splits, ETFs)"
    endpoints:
      overview:
        method: GET
        path: "/query"
        description: "Company profile, ratios, and metrics (COMPANY_OVERVIEW)"
        params:
          - name: function
            type: string
            required: false
            default: OVERVIEW
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      income:
        method: GET
        path: "/query"
        description: "Annual and quarterly income statements (INCOME_STATEMENT)"
        params:
          - name: function
            type: string
            required: false
            default: INCOME_STATEMENT
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      balance:
        method: GET
        path: "/query"
        description: "Annual and quarterly balance sheets (BALANCE_SHEET)"
        params:
          - name: function
            type: string
            required: false
            default: BALANCE_SHEET
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
