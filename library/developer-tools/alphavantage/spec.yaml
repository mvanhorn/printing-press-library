            required: true
            positional: true
            description: "From currency code"
          - name: to_symbol
            type: string
            required: true
            positional: true
            description: "To currency code"
          - name: outputsize
            type: string
            required: false
            default: compact
            description: "compact or full"
          - name: datatype
            type: string
            required: false
