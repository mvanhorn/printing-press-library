            default: EARNINGS_ESTIMATES
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      dividends:
        method: GET
        path: "/query"
        description: "Historical dividend payments (DIVIDENDS)"
        params:
          - name: function
            type: string
            required: false
            default: DIVIDENDS
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
