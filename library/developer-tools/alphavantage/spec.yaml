            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      shares:
        method: GET
        path: "/query"
        description: "Outstanding share count (SHARES_OUTSTANDING)"
        params:
          - name: function
            type: string
            required: false
            default: SHARES_OUTSTANDING
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      listings:
        method: GET
        path: "/query"
        description: "Listing/delisting status snapshot (LISTING_STATUS, CSV)"
        params:
          - name: function
            type: string
            required: false
            default: LISTING_STATUS
            description: "Alpha Vantage function"
          - name: date
            type: string
            required: false
            default: ""
            description: "Snapshot date in YYYY-MM-DD"
          - name: state
            type: string
            required: false
            default: active
            description: "active or delisted"
          - name: datatype
            type: string
            required: false
            default: csv
            description: "Response format (csv native for this endpoint)"
        response:
          type: object
      etf:
        method: GET
        path: "/query"
        description: "ETF profile and holdings (ETF_PROFILE)"
        params:
          - name: function
            type: string
            required: false
            default: ETF_PROFILE
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: true
            positional: true
            description: "ETF ticker (e.g., SPY, QQQ)"
        response:
          type: object

  calendar:
    description: "Earnings and IPO calendars"
    endpoints:
      earnings:
        method: GET
        path: "/query"
        description: "Earnings calendar for next 3/6/12 months (EARNINGS_CALENDAR, CSV)"
        params:
          - name: function
            type: string
            required: false
            default: EARNINGS_CALENDAR
            description: "Alpha Vantage function"
          - name: symbol
            type: string
            required: false
            default: ""
            description: "Optional ticker filter"
          - name: horizon
            type: string
            required: false
            default: 3month
            description: "3month, 6month, or 12month"
          - name: datatype
            type: string
            required: false
            default: csv
