            required: true
            positional: true
            description: "Stock ticker"
        response:
          type: object
      earnings-estimates:
        method: GET
        path: "/query"
        description: "Projected earnings estimates (EARNINGS_ESTIMATES)"
        params:
          - name: function
            type: string
