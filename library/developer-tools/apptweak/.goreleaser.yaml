version: 2
project_name: apptweak-pp-cli
changelog:
  disable: true
builds:
  - id: apptweak-pp-cli
    main: ./cmd/apptweak-pp-cli
    binary: apptweak-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/apptweak/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: apptweak-pp-mcp
    main: ./cmd/apptweak-pp-mcp
    binary: apptweak-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: apptweak-pp-cli
    repository:
      owner: rk-labs-tech
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every AppTweak endpoint in a local-first CLI — keyword rank fan-outs, competitor metadata diffs"
    install: |
      bin.install "apptweak-pp-cli"
      bin.install "apptweak-pp-mcp"
