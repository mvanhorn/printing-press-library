version: 2
project_name: apple-search-ads-pp-cli
changelog:
  disable: true
builds:
  - id: apple-search-ads-pp-cli
    main: ./cmd/apple-search-ads-pp-cli
    binary: apple-search-ads-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/apple-search-ads/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: apple-search-ads-pp-mcp
    main: ./cmd/apple-search-ads-pp-mcp
    binary: apple-search-ads-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: apple-search-ads-pp-cli
    repository:
      owner: rk-labs-tech
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Apple Search Ads feature, plus local cost analytics, bid optimization"
    install: |
      bin.install "apple-search-ads-pp-cli"
      bin.install "apple-search-ads-pp-mcp"
