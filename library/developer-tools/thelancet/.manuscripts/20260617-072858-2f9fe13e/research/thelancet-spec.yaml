openapi: 3.0.0
info:
  title: The Lancet / CrossRef API
  version: 1.0.0
  description: Search and analyze Lancet articles

servers:
  - url: https://api.crossref.org/v1

paths:
  /works:
    get:
      operationId: searchWorks
      summary: Search articles
      tags:
        - articles
      parameters:
        - name: query
          in: query
          schema:
            type: string
          example: CRISPR
        - name: rows
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object

  /works/{doi}:
    get:
      operationId: getWork
      summary: Get article by DOI
      tags:
        - articles
      parameters:
        - name: doi
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                type: object
