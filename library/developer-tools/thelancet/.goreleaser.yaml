version: 2
project_name: thelancet-pp-cli
changelog:
  disable: true
builds:
  - id: thelancet-pp-cli
    main: ./cmd/thelancet-pp-cli
    binary: thelancet-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/thelancet/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: thelancet-pp-mcp
    main: ./cmd/thelancet-pp-mcp
    binary: thelancet-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: thelancet-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//thelancet-pp-cli"
    description: "Search Lancet articles offline and analyze author impact, institutional networks"
    install: |
      bin.install "thelancet-pp-cli"
      bin.install "thelancet-pp-mcp"
