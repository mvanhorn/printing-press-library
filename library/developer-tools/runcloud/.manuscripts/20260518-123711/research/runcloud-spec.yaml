name: runcloud
description: "Fleet-wide visibility for RunCloud v3 — every SSL cert, PHP version, blocked IP, and SSH key across the whole workspace in one command."
version: "0.1.0"
base_url: "https://manage.runcloud.io/api/v3"

auth:
  type: bearer_token
  header: "Authorization"
  format: "Bearer {api_key}"
  env_vars:
    - RUNCLOUD_API_TOKEN

config:
  format: toml
  path: "~/.config/runcloud-cli/config.toml"

mcp:
  transport: [stdio, http]
  orchestration: code
  endpoint_tools: hidden

resources:
  servers:
    description: "Manage RunCloud servers"
    endpoints:
      list:
        method: GET
        path: "/servers"
        description: "List all servers in your account"
        params:
          - name: page
            type: int
            description: "Page number"
          - name: perPage
            type: int
            description: "Items per page (max 40)"
          - name: search
            type: string
            description: "Substring search across server names and IPs"
          - name: sortColumn
            type: string
            description: "Column to sort by (e.g. name, createdAt)"
          - name: sortDirection
            type: string
            description: "Sort direction (asc or desc)"
        response:
          type: array
          item: Server
        pagination:
          type: page
          page_field: "page"
          per_page_field: "perPage"
          total_field: "meta.pagination.total"

      get:
        method: GET
        path: "/servers/{serverId}"
        description: "Get a server by ID"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        response:
          type: object
          item: Server

      create:
        method: POST
        path: "/servers"
        description: "Register a new server with RunCloud (v3 supports nginx/ols web server and native/containerized install)"
        body:
          - name: name
            type: string
            required: true
            description: "Friendly server name"
          - name: ipAddress
            type: string
            required: true
            description: "Public IPv4 address of the target server"
          - name: webServerType
            type: string
            required: true
            description: "Web server stack: nginx or ols (OpenLiteSpeed)"
          - name: installationType
            type: string
            required: true
            description: "Installation type: native or containerized (v3-new)"
          - name: provider
            type: string
            description: "Cloud provider: digitalocean, linode, upcloud, hetzner, vultr"
          - name: databaseType
            type: string
            description: "Database type: mysql or mariadb (default: mariadb)"
        response:
          type: object
          item: Server

      delete:
        method: DELETE
        path: "/servers/{serverId}"
        description: "Remove a server from your RunCloud account"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"

      health:
        method: GET
        path: "/servers/{serverId}/health/latest"
        description: "Get latest server health snapshot (v3: uptime, load, disk, memory in a single payload)"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        response:
          type: object
          item: ServerHealth

      disk_cleanup:
        method: POST
        path: "/servers/{serverId}/health/diskcleaner"
        description: "Trigger server disk cleanup (purges logs and cache to reclaim space)"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"

      stats:
        method: GET
        path: "/servers/{serverId}/stats"
        description: "Get server performance metrics (legacy v2 endpoint; prefer 'servers health' on v3)"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        response:
          type: object
          item: ServerStats

      hardware:
        method: GET
        path: "/servers/{serverId}/hardwareinfo"
        description: "Get server hardware specifications (CPU, RAM, OS, kernel)"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        response:
          type: object
          item: ServerHardware

      install_script:
        method: GET
        path: "/servers/{serverId}/installationscript"
        description: "Retrieve the bash installation script to run on the target server"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"

      shared:
        method: GET
        path: "/servers/shared"
        description: "List servers shared with your account"
        params:
          - name: search
            type: string
            description: "Substring search"
        response:
          type: array
          item: Server

      php_versions:
        method: GET
        path: "/servers/{serverId}/php/version"
        description: "List PHP versions available on this server"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"

      change_php_cli:
        method: PATCH
        path: "/servers/{serverId}/php/cli"
        description: "Change the server-wide PHP CLI version"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        body:
          - name: phpVersion
            type: string
            required: true
            description: "Target PHP version (e.g. php82rc)"

      ssh_settings:
        method: GET
        path: "/servers/{serverId}/settings/ssh"
        description: "Get SSH configuration for this server"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"

      update_ssh_settings:
        method: PATCH
        path: "/servers/{serverId}/settings/ssh"
        description: "Update SSH configuration"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        body:
          - name: passwordlessLogin
            type: bool
            description: "Disable password login"
          - name: useDns
            type: bool
            description: "Enable reverse DNS lookups"
          - name: preventRootLogin
            type: bool
            description: "Disallow root SSH login"

      meta_update:
        method: PATCH
        path: "/servers/{serverId}/settings/meta"
        description: "Update server name and provider"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        body:
          - name: name
            type: string
            description: "New server name"
          - name: provider
            type: string
            description: "Provider tag"

      autoupdate:
        method: PATCH
        path: "/servers/{serverId}/settings/autoupdate"
        description: "Configure automatic security/software updates"
        params:
          - name: serverId
            type: int
            required: true
            positional: true
            description: "Server ID"
        body:
          - name: softwareUpdate
            type: bool
            description: "Enable automatic software updates"
          - name: securityUpdate
            type: bool
            description: "Enable automatic security updates"

  webapps:
    description: "Manage web applications across servers"
    endpoints:
      list:
        method: GET
        path: "/servers/{serverId}/webapps"
        description: "List web applications on a server"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: page
            type: int
            description: "Page number"
          - name: perPage
            type: int
            description: "Items per page"
          - name: search
            type: string
            description: "Substring search"
          - name: sortColumn
            type: string
          - name: sortDirection
            type: string
        response:
          type: array
          item: WebApp
        pagination:
          type: page
          page_field: "page"
          per_page_field: "perPage"
          total_field: "meta.pagination.total"

      get:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}"
        description: "Get a web application by ID"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      create:
        method: POST
        path: "/servers/{serverId}/webapps/custom"
        description: "Create a custom web application"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
        body:
          - name: webApplicationName
            type: string
            required: true
            description: "Web app name"
          - name: domainName
            type: string
            required: true
            description: "Primary domain"
          - name: user
            type: string
            required: true
            description: "System user that owns the web app"
          - name: publicPath
            type: string
            description: "Public path under the document root"
          - name: phpVersion
            type: string
            description: "PHP version (e.g. php82rc)"
          - name: stack
            type: string
            description: "Stack mode (hybrid, nativenginx)"
          - name: stackMode
            type: string
            description: "Stack mode flavor (production, development)"
          - name: clickjackingProtection
            type: bool
          - name: xssProtection
            type: bool
          - name: mimeSniffingProtection
            type: bool
          - name: processManager
            type: string
            description: "PHP-FPM process manager (dynamic, ondemand, static)"
          - name: processManagerStartServers
            type: int
          - name: processManagerMinSpareServers
            type: int
          - name: processManagerMaxSpareServers
            type: int
          - name: processManagerMaxChildren
            type: int
          - name: processManagerMaxRequests
            type: int
          - name: openBasedir
            type: string
          - name: timezone
            type: string

      create_wordpress:
        method: POST
        path: "/servers/{serverId}/webapps/wordpress"
        description: "Provision a WordPress webapp in one call (v3 native): creates the webapp + database + db user + grant atomically"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
        body:
          - name: name
            type: string
            required: true
            description: "Web app name"
          - name: domainName
            type: string
            required: true
            description: "Domain name for the WordPress site"
          - name: siteTitle
            type: string
            required: true
            description: "WordPress site title"
          - name: adminUsername
            type: string
            required: true
            description: "WordPress admin username"
          - name: password
            type: string
            required: true
            description: "WordPress admin password"
          - name: adminEmail
            type: string
            required: true
            description: "WordPress administrator email"
          - name: dbUser
            type: string
            description: "Database user (autogenerated if empty)"
          - name: dbPassword
            type: string
            description: "Database password (autogenerated if empty)"
          - name: dbName
            type: string
            description: "Database name (autogenerated if empty)"
          - name: dbPrefix
            type: string
            description: "Database table prefix (autogenerated if empty)"
          - name: user
            type: int
            description: "System user ID (defaults to RunCloud user)"
          - name: publicPath
            type: string
            description: "Public path under the document root"
          - name: phpVersion
            type: string
            description: "PHP version (e.g. php82rc)"
          - name: stack
            type: string
            description: "Stack (hybrid, nativenginx)"
          - name: stackMode
            type: string
            description: "Stack mode (production, development)"
          - name: apiId
            type: int
            description: "Cloudflare integration ID (optional)"
          - name: canvas_id
            type: int
            description: "WordPress canvas ID (optional)"
          - name: proxy
            type: bool
            description: "Enable Cloudflare proxy"

      delete:
        method: DELETE
        path: "/servers/{serverId}/webapps/{webAppId}"
        description: "Delete a web application"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      default_set:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/default"
        description: "Mark this web app as the server default"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      default_unset:
        method: DELETE
        path: "/servers/{serverId}/webapps/{webAppId}/default"
        description: "Remove default status from this web app"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      rebuild:
        method: PATCH
        path: "/servers/{serverId}/webapps/{webAppId}/rebuild"
        description: "Rebuild the web application's nginx/PHP-FPM configuration"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      settings:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/settings"
        description: "Retrieve all settings for a web application"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      change_php:
        method: PATCH
        path: "/servers/{serverId}/webapps/{webAppId}/settings/php"
        description: "Change the PHP version for this web application"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"
        body:
          - name: phpVersion
            type: string
            required: true
            description: "Target PHP version"

      update_fpmnginx:
        method: PATCH
        path: "/servers/{serverId}/webapps/{webAppId}/settings/fpmnginx"
        description: "Update PHP-FPM and nginx settings"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      logs:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/log"
        description: "View the activity log for this web app"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"

      alias:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/alias"
        description: "Create an alias web application sharing this one's document root"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            positional: true
            description: "Web app ID"
        body:
          - name: webApplicationName
            type: string
            required: true
          - name: domainName
            type: string
            required: true

  domains:
    description: "Manage domain attachments for a web application"
    endpoints:
      list:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/domains"
        description: "List domains for a web app"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
        response:
          type: array
          item: Domain

      get:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/domains/{domainId}"
        description: "Get a domain by ID"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: domainId
            type: int
            required: true
            positional: true
            description: "Domain ID"

      add:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/domains"
        description: "Attach a new domain to a web app"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
        body:
          - name: name
            type: string
            required: true
            description: "Domain name (e.g. example.com)"
        response:
          type: object
          item: Domain

      delete:
        method: DELETE
        path: "/servers/{serverId}/webapps/{webAppId}/domains/{domainId}"
        description: "Remove a domain from a web app"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: domainId
            type: int
            required: true
            positional: true
            description: "Domain ID"

  ssl:
    description: "Manage SSL certificates for a web application (basic mode)"
    endpoints:
      get:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/ssl"
        description: "Get the current SSL configuration"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"

      install:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/ssl"
        description: "Install an SSL certificate (Let's Encrypt or custom)"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
        body:
          - name: provider
            type: string
            required: true
            description: "letsencrypt or custom"
          - name: enableHttp
            type: bool
            description: "Allow HTTP traffic alongside HTTPS"
          - name: enableHsts
            type: bool
            description: "Enable HSTS"
          - name: privateKey
            type: string
            description: "Private key (custom mode)"
          - name: certificate
            type: string
            description: "Certificate (custom mode)"
          - name: ssl_protocol_id
            type: int
            description: "SSL protocol ID"
          - name: authorizationMethod
            type: string
            description: "http-01 or dns-01"

      update:
        method: PATCH
        path: "/servers/{serverId}/webapps/{webAppId}/ssl/{sslId}"
        description: "Update SSL configuration (HSTS, HTTP toggle, protocol)"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: sslId
            type: int
            required: true
            positional: true
            description: "SSL ID"
        body:
          - name: enableHttp
            type: bool
          - name: enableHsts
            type: bool
          - name: ssl_protocol_id
            type: int

      redeploy:
        method: PUT
        path: "/servers/{serverId}/webapps/{webAppId}/ssl/{sslId}"
        description: "Force a Let's Encrypt redeploy of the SSL certificate"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: sslId
            type: int
            required: true
            positional: true
            description: "SSL ID"

      delete:
        method: DELETE
        path: "/servers/{serverId}/webapps/{webAppId}/ssl/{sslId}"
        description: "Delete the SSL certificate"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: sslId
            type: int
            required: true
            positional: true
            description: "SSL ID"

  ssl_advanced:
    description: "Advanced per-domain SSL mode (one cert per domain)"
    endpoints:
      status:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/ssl/advanced"
        description: "Check whether advanced per-domain SSL is enabled"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"

      switch:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/ssl/advanced"
        description: "Switch between basic and advanced SSL modes"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
        body:
          - name: mode
            type: string
            description: "basic or advanced"

      install_domain:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/domains/{domainId}/ssl"
        description: "Install SSL for a specific domain (advanced mode only)"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: domainId
            type: int
            required: true
            positional: true
            description: "Domain ID"
        body:
          - name: provider
            type: string
            required: true
            description: "letsencrypt or custom"

      get_domain:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/domains/{domainId}/ssl"
        description: "Get SSL details for a specific domain"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: domainId
            type: int
            required: true
            positional: true
            description: "Domain ID"

      redeploy_domain:
        method: PUT
        path: "/servers/{serverId}/webapps/{webAppId}/domains/{domainId}/ssl/{sslId}"
        description: "Force a redeploy of a per-domain SSL certificate"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: domainId
            type: int
            required: true
            description: "Domain ID"
          - name: sslId
            type: int
            required: true
            positional: true
            description: "SSL ID"

      delete_domain:
        method: DELETE
        path: "/servers/{serverId}/webapps/{webAppId}/domains/{domainId}/ssl/{sslId}"
        description: "Delete a per-domain SSL certificate"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: domainId
            type: int
            required: true
            description: "Domain ID"
          - name: sslId
            type: int
            required: true
            positional: true
            description: "SSL ID"

  git:
    description: "Git integration for web applications"
    endpoints:
      clone:
        method: POST
        path: "/servers/{serverId}/webapps/{webAppId}/git"
        description: "Connect a git repository to a web app"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
        body:
          - name: provider
            type: string
            required: true
            description: "github, gitlab, bitbucket, custom"
          - name: repository
            type: string
            required: true
            description: "Repository (owner/repo or full URL)"
          - name: branch
            type: string
            required: true
            description: "Branch name"

      get:
        method: GET
        path: "/servers/{serverId}/webapps/{webAppId}/git"
        description: "Get the current git connection"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"

      change_branch:
        method: PATCH
        path: "/servers/{serverId}/webapps/{webAppId}/git/{gitId}/branch"
        description: "Switch the active branch"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
            description: "Web app ID"
          - name: gitId
            type: int
            required: true
            positional: true
            description: "Git connection ID"
        body:
          - name: branch
            type: string
            required: true
            description: "Branch name"

      update_script:
        method: PATCH
        path: "/servers/{serverId}/webapps/{webAppId}/git/{gitId}/script"
        description: "Update the deploy script"
        params:
          - name: serverId
            type: int
            required: true
            description: "Server ID"
          - name: webAppId
            type: int
            required: true
