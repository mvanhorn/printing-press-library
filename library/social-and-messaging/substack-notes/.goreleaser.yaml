version: 2
project_name: substack-notes-pp-cli
changelog:
  disable: true
builds:
  - id: substack-notes-pp-cli
    main: ./cmd/substack-notes-pp-cli
    binary: substack-notes-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/social-and-messaging/substack-notes/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: substack-notes-pp-mcp
    main: ./cmd/substack-notes-pp-mcp
    binary: substack-notes-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: substack-notes-pp-cli
    repository:
      owner: petergyang
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Unofficial Substack Notes endpoints observed from the authenticated web app."
    install: |
      bin.install "substack-notes-pp-cli"
      bin.install "substack-notes-pp-mcp"
