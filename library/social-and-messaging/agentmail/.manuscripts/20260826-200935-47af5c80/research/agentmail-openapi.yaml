  /v0/inboxes/{inbox_id}/metrics/events:
    get:
      operationId: query-events
      summary: Query Events
      description: |-
        Counts of email events (sent, delivered, bounced, etc.) over time for
        the inbox. Defaults to the last 24 hours; `start` must be within the
        last 90 days, and a future `end` is clamped to now. Omit `period` for
        individual event counts, or set it to sum counts into buckets of that
        many seconds.

        **CLI:**
        ```bash
        agentmail inboxes:metrics query --inbox-id <inbox_id>
        ```
      tags:
        - inboxes > metrics
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_inboxes:InboxId'
        - name: event_types
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:MetricEventTypes'
        - name: start
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:Start'
        - name: end
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:End'
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:Period'
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:MetricLimit'
        - name: descending
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:Descending'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_metrics:QueryMetricsResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ValidationErrorResponse'
  /v0/inboxes/{inbox_id}/metrics/usage:
    get:
      operationId: query-usage
      summary: Query Usage
      description: |-
        Cumulative usage series for the inbox. Each point is the running total
        of the usage type at that timestamp, not the change within the bucket.
        Inbox-scoped queries carry `storage_bytes`, `message_count`, and
        `thread_count`; requested types that don't apply to the scope are
        ignored. Defaults to the last 24 hours; `start` must be within the
        last 90 days, and a future `end` is clamped to now. The range divided
        by `period` must not exceed 1000 buckets.
      tags:
        - inboxes > metrics
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/type_inboxes:InboxId'
        - name: usage_types
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:UsageTypes'
        - name: start
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:Start'
        - name: end
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:End'
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:Period'
        - name: limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:MetricLimit'
        - name: descending
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_metrics:Descending'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_metrics:QueryUsageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ValidationErrorResponse'
