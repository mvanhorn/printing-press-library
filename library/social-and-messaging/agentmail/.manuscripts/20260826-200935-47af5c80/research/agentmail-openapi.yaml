                $ref: '#/components/schemas/type_:ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-keys:UpdatePublicKeyNameRequest'
    delete:
      operationId: revoke-public-key
      summary: Revoke Public-Key Credential
      description: |-
        Permanently revoke one public-key credential. This hard-deletes the
        credential; repeating the request returns not found. Requires
        `api_key_delete`.
      tags:
        - api-keys
      parameters:
        - name: api_key_id
          in: path
          description: Public-key credential ID returned by registration.
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Response with status 204
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ErrorResponse'
  /v0/api-keys/public-keys/agentid-sign-in/revoke-all:
    post:
      operationId: revoke-all-agent-id-sign-in-keys
      summary: Revoke All AgentID Sign-In Keys
      description: |-
        Invalidate every current public-key credential in the caller's
        organization by advancing its AgentID key generation. The caller must be
        organization-scoped and either have `api_key_delete` or, for a verified
        self-serve agent organization, use an unrestricted unmanaged bearer
        credential. No request body is accepted.

        `Idempotency-Key` is required and must be a UUID. Reusing the same UUID
        returns the original permanent receipt without advancing the generation
        again. A new UUID performs a new generation advance.
      tags:
        - api-keys
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Required UUID identifying this revoke-all operation permanently.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-keys:RevokeAllAgentIdSignInKeysResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ValidationErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ErrorResponse'
