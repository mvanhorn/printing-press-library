    type_api-keys:PublicJwkCoordinate:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      minLength: 43
      maxLength: 43
      description: A 32-byte P-256 coordinate encoded as unpadded base64url.
      title: PublicJwkCoordinate
    type_api-keys:PublicJwk:
      type: object
      properties:
        kty:
          type: string
          enum:
            - EC
        crv:
          type: string
          enum:
            - P-256
        x:
          $ref: '#/components/schemas/type_api-keys:PublicJwkCoordinate'
        'y':
          $ref: '#/components/schemas/type_api-keys:PublicJwkCoordinate'
      required:
        - kty
        - crv
        - x
        - 'y'
      description: |-
        A public P-256 JWK. The object accepts exactly `kty`, `crv`, `x`, and `y`.
        Private key material such as `d`, embedded key IDs, and all other members
        are rejected. The server also rejects coordinates that are not a point on
        P-256.
      title: PublicJwk
    type_api-keys:PublicKeyMaterial:
      type: object
      properties:
        jwk:
          $ref: '#/components/schemas/type_api-keys:PublicJwk'
        fingerprint:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          description: RFC 7638 SHA-256 JWK thumbprint encoded as unpadded base64url.
      required:
        - jwk
        - fingerprint
      description: Registered public key material and its server-computed RFC 7638 thumbprint.
      title: PublicKeyMaterial
    type_api-keys:PublicKeyScope:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - organization
              description: 'Discriminator value: organization'
          required:
            - type
        - type: object
          properties:
            type:
              type: string
              enum:
                - pod
              description: 'Discriminator value: pod'
            id:
              type: string
              format: uuid
              description: ID of the pod.
          required:
            - type
            - id
        - type: object
          properties:
            type:
              type: string
              enum:
                - inbox
              description: 'Discriminator value: inbox'
            id:
              type: string
              format: email
              maxLength: 254
              description: ID of the inbox.
          required:
            - type
            - id
      discriminator:
        propertyName: type
      description: The immutable scope in which a public-key credential can approve AgentID sign-in.
      title: PublicKeyScope
    type_api-keys:PublicKeyCredential:
      type: object
      properties:
        api_key_id:
          type: string
          format: uuid
          description: Server-generated credential ID. Store this value as the signing key's `kid`.
        type:
          type: string
          enum:
            - public_key
          description: Server-owned credential discriminator. Callers cannot select or update it.
        name:
          $ref: '#/components/schemas/type_api-keys:Name'
          description: Human-readable credential name.
        public_key:
          $ref: '#/components/schemas/type_api-keys:PublicKeyMaterial'
        scope:
          $ref: '#/components/schemas/type_api-keys:PublicKeyScope'
        expires_at:
          type: string
          format: date-time
          description: Immutable absolute expiry. Omitted when the credential does not expire.
        revoked_at:
          type: string
          format: date-time
          description: Present when organization-wide revoke-all invalidated this credential generation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - api_key_id
        - type
        - name
        - public_key
        - scope
        - created_at
        - updated_at
      description: |-
        An AgentID sign-in credential. `type` and `api_key_id` are server-owned;
        use `api_key_id` as the JWS `kid`. This response never contains a bearer
        secret or private key.
      title: PublicKeyCredential
    type_api-keys:ListPublicKeysResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/type_:Count'
        next_page_token:
          $ref: '#/components/schemas/type_:PageToken'
        public_keys:
          type: array
          items:
            $ref: '#/components/schemas/type_api-keys:PublicKeyCredential'
          description: Public-key credentials only, ordered by creation time descending by default.
      required:
        - count
        - public_keys
      title: ListPublicKeysResponse
    type_api-keys:CreatePublicKeyRequest:
      type: object
      properties:
        public_key:
          $ref: '#/components/schemas/type_api-keys:PublicJwk'
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Defaults to `AgentID key {first eight fingerprint characters}`.
        scope:
          $ref: '#/components/schemas/type_api-keys:PublicKeyScope'
          description: |-
            Omit to inherit the registering bearer key's exact scope. An explicit
            scope must be the caller's scope or a live descendant.
        expires_at:
          type: string
          format: date-time
          description: |-
            Future absolute expiry. Omit to inherit the registering bearer key's
            expiry. A child credential cannot outlive its creator.
      required:
        - public_key
      description: |-
        Register only a public P-256 JWK. Credential type, `api_key_id`, sign-in
        eligibility, permissions, and generation are server-owned and are not
        request properties.
      title: CreatePublicKeyRequest
    type_api-keys:UpdatePublicKeyNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - name
      description: |-
        Rename a public-key credential. Key material, ID, type, scope, sign-in
        eligibility, permissions, generation, and expiry are immutable.
      title: UpdatePublicKeyNameRequest
    type_api-keys:RevokeAllAgentIdSignInKeysResponse:
      type: object
      properties:
        previous_generation:
          type: integer
          minimum: 0
        current_generation:
          type: integer
          minimum: 1
        revoked_at:
          type: string
          format: date-time
      required:
        - previous_generation
        - current_generation
        - revoked_at
      description: Permanent idempotency receipt for an organization-wide AgentID sign-in key revocation.
      title: RevokeAllAgentIdSignInKeysResponse
