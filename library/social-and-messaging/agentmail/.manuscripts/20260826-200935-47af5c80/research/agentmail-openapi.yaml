              schema:
                $ref: '#/components/schemas/type_api-keys:ListPublicKeysResponse'
    post:
      operationId: create-public-key
      summary: Register Public-Key Credential
      description: |-
        Register a public P-256 JWK using an existing AgentMail bearer API key
        with `api_key_create`. Re-registering the same JWK creates a new
        credential ID; it does not replace or recover an earlier credential.
        The private key must never be sent to AgentMail.
      tags:
        - api-keys
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_api-keys:PublicKeyCredential'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ValidationErrorResponse'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_:ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_api-keys:CreatePublicKeyRequest'
  /v0/api-keys/public-keys/{api_key_id}:
    patch:
      operationId: update-public-key-name
      summary: Rename Public-Key Credential
      description: |-
        Rename the credential. All security-relevant fields are immutable.
        Requires `api_key_update`.
      tags:
        - api-keys
      parameters:
        - name: api_key_id
          in: path
