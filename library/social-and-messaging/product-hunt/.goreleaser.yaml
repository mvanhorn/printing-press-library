version: 2
project_name: product-hunt-pp-cli
changelog:
  disable: true
builds:
  - id: product-hunt-pp-cli
    main: ./cmd/product-hunt-pp-cli
    binary: product-hunt-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/social-and-messaging/product-hunt/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: product-hunt-pp-mcp
    main: ./cmd/product-hunt-pp-mcp
    binary: product-hunt-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: product-hunt-pp-cli
    repository:
      owner: actionsslave
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Product Hunt feature, plus launch-day momentum tracking, offline search, and a local database no other Product..."
    install: |
      bin.install "product-hunt-pp-cli"
      bin.install "product-hunt-pp-mcp"
