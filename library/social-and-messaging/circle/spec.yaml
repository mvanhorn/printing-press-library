      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                space_id:
                  type: integer
                  description: ID of the basic space to create the post in
                status:
                  type: string
                  enum:
                  - draft
                  - published
                  - scheduled
                  description: Post status. Defaults to published. Use scheduled together with published_at to schedule the post.
                name:
                  type: string
                  description: Title of the post
                slug:
                  type: string
                  description: URL slug for the post. Generated from the name when omitted.
                tiptap_body:
                  type: object
                  description: Post content in Tiptap JSON format. See https://api.circle.so/get-started/concepts/tiptap-editor
                  properties:
                    body:
                      type: object
                      properties:
                        type:
                          type: string
                        content:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              text:
                                type: string
                                nullable: true
                              marks:
                                type: array
                                items:
                                  type: object
                              attrs:
                                type: object
                      required:
                      - type
                      - content
                cover_image:
                  type: string
                  description: signed_id of the cover image
                internal_custom_html:
                  type: string
                  description: Custom HTML shown below the post. Saved only for community admins when the custom HTML feature is enabled for the community.
                is_truncation_disabled:
                  type: boolean
                  description: When true, post lists show the full post body instead of a truncated preview
                is_comments_closed:
                  type: boolean
                  description: When true, the post is closed to new comments
                is_comments_enabled:
                  type: boolean
                  description: Whether comments are shown on the post. Set to false to hide comments.
                is_liking_enabled:
                  type: boolean
                  description: Whether likes are shown on the post. Set to false to hide likes.
                hide_meta_info:
                  type: boolean
                  description: When true, hides the author name and information on the post
                hide_from_featured_areas:
                  type: boolean
                  description: When true, the post does not appear in featured areas such as the homepage or weekly digest
                meta_title:
                  type: string
                  description: SEO meta title for the post page
                meta_description:
                  type: string
                  description: SEO meta description for the post page
                opengraph_title:
                  type: string
                  description: Open Graph title used in link previews
                opengraph_description:
                  type: string
                  description: Open Graph description used in link previews
                published_at:
                  type: string
                  description: Publish time as an ISO 8601 datetime. For scheduled posts, when the post goes live; for published posts, defaults to the creation time. Ignored for drafts.
                created_at:
                  type: string
                  description: Creation timestamp to set on the post, as an ISO 8601 datetime
                topics:
                  type: array
                  items:
                    type: integer
                  description: IDs of topics to tag the post with
                skip_notifications:
                  type: boolean
                  description: When true, suppresses notifications during this request. Defaults to false. Does not suppress notifications when a scheduled post is published later.
                is_pinned:
                  type: boolean
                  description: When true and the post is published, pins it to the top of its space
                user_email:
                  type: string
                  description: email of the author (preferred over user_id)
                user_id:
                  type: integer
                  description: id of the author
              required:
              - space_id
              - name
            examples:
              tiptap_post:
                summary: Create a post with a Tiptap paragraph
                value:
                  space_id: 123
                  name: Welcome
                  tiptap_body:
                    body:
                      type: doc
                      content:
                      - type: paragraph
                        content:
                        - type: text
