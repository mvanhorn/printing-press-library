      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Provide exactly one of community_member_id or email. Blank values are treated as absent.
              properties:
                community_member_id:
                  type: integer
                  description: Community member ID of an existing community member to add to the access group. Provide exactly one of community_member_id or email. Blank values count as absent.
