          type: integer
          description: Seconds to wait before showing the popup form.
        popup_frequency:
          type: integer
          description: Days before the popup appears again for a visitor who closed it.
        embed_styles:
          type: object
          nullable: true
          description: Colors used when the form is embedded on another site.
          properties:
            form:
              type: object
              properties:
                backgroundColor:
                  type: string
                  description: Form background color, such as "#FFFFFF".
                color:
                  type: string
                  description: Form text color, such as "#545861".
            button:
              type: object
              properties:
                backgroundColor:
                  type: string
                  description: Button background color, such as "#2B2E33".
                color:
                  type: string
                  description: Button text color, such as "#FFFFFF".
        standalone_page_styles:
          type: object
          nullable: true
          description: Colors used on the form's standalone page.
          properties:
            form:
              type: object
              properties:
                backgroundColor:
                  type: string
                  description: Form background color, such as "#FFFFFF".
                color:
                  type: string
                  description: Form text color, such as "#545861".
            button:
              type: object
              properties:
                backgroundColor:
                  type: string
                  description: Button background color, such as "#2B2E33".
                color:
                  type: string
                  description: Button text color, such as "#FFFFFF".
        elements:
          type: array
          description: Full list of form elements to keep. Applied only when the array is non-empty; an empty array is ignored and leaves the form's elements unchanged. Elements with an existing id are updated, elements without an id are created, and existing elements left out are deleted, except fields that already have submissions, which are hidden instead. Sending a non-empty list for a draft form also publishes it.
          items:
            $ref: '#/components/schemas/form_element'
    form_element:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: ID of an existing element to update. Omit to create a new element.
        position:
          type: integer
          description: Order of the element in the form, starting at 0.
        type:
          type: string
          enum:
          - text
          - field
          - button
          - layout
          description: 'Element type: text, field, button, or layout. Cannot be changed on an existing element.'
        parent_element_id:
          type: integer
          nullable: true
          description: ID of the layout element this element is nested in. New elements take their parent from where they are nested in children.
        attributes:
          type: object
          description: 'Element-specific attributes, by type. text: text_type (title, subtitle or paragraph) and value. field: field_type (contact_email, contact_name, short_answer, long_answer, single_choice, multiple_choice, dropdown, number, email or link), label, placeholder, required, hidden, options (the list of choices, required for single_choice, multiple_choice and dropdown fields that are not linked to a profile field) and profile_field_id. button: label and styles. layout: layout_type (stack) and styles.'
        children:
          type: array
          description: Child elements nested within this element. Each child follows the same structure as a form_element and can be nested recursively.
          items:
            type: object
