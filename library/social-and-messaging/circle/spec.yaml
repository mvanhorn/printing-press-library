paths:
  /access_groups/{access_group_id}/content:
    patch:
      summary: Replace access-group content. Submit complete desired lists; omitted lists are cleared, invalid/foreign IDs are ignored, and all-filtered nonblank input clears content. Both lists omitted/empty returns 422. Member propagation is asynchronous.
      tags:
      - Access Groups
      description: Replaces all spaces and space groups assigned to an access group. Submit the complete desired lists; an omitted list is treated as empty, removing existing associations of that type. IDs outside this community or invalid IDs are silently discarded. If at least one submitted list is nonblank but all IDs are filtered out, both lists become empty and existing content is cleared. If both lists are omitted or empty, the request fails with 422. Member access propagation is asynchronous; a successful response does not mean every member's access has finished updating.
      security:
      - token_auth: []
      parameters:
      - name: access_group_id
        in: path
        required: true
        description: ID of the access group whose content is replaced
        schema:
          type: integer
      responses:
        '200':
          description: Access group content replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_group_content'
        '422':
          description: No content was provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Access group not found in this community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                space_ids:
                  type: array
                  description: Complete replacement list of space IDs. Omit this list or pass an empty list to remove all current space assignments. Invalid and foreign IDs are silently ignored.
                  items:
                    type: integer
                space_group_ids:
                  type: array
                  description: Complete replacement list of space-group IDs. Omit this list or pass an empty list to remove all current space-group assignments. Invalid and foreign IDs are silently ignored.
                  items:
                    type: integer
        required: true
  /access_groups/{access_group_id}/community_members:
    post:
      summary: Add Member to Access Group
      tags:
      - Access Group Members
      description: Adds an existing community member, identified by email or community_member_id, to an active access group. The email and community_member_id must belong to a member of this community. Provide exactly one of community_member_id or email
