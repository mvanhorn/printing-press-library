                  type: string
                filter_type:
                  type: string
                  enum:
                  - is
                  - is_not
                  - contains
                  - does_not_contain
                  - gt
                  - lt
                  - eq
              required:
              - key
              - value
          - type: array
            items:
              type: object
              properties:
                email:
                  type: string
                  format: email
                community_member_id:
                  type: integer
              required:
              - email
