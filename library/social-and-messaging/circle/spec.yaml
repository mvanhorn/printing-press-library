                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                section_id:
                  type: integer
                  example: 1
                  description: ID of the course section the lesson is added to. The lesson is placed at the end of the section
                name:
                  type: string
                  example: New lesson
                  description: Lesson name
                status:
                  type: string
                  enum:
                  - draft
                  - published
                  description: Publication status of the lesson. Defaults to draft
                body_html:
                  type: string
                  example: <p>Lesson body</p>
                  description: Lesson body as HTML, converted to the rich text format. Ignored when rich_text_body is also sent
                is_comments_enabled:
                  type: boolean
                  example: true
                  description: Whether comments are enabled on the lesson. Defaults to true
                is_featured_media_enabled:
                  type: boolean
                  example: true
                  description: Whether the lesson's featured media is enabled. Defaults to true
                is_featured_media_download_enabled:
                  type: boolean
                  example: true
                  description: Whether members can download the lesson's featured media file. Defaults to false
                thumbnail:
                  type: string
                  description: signed_id of the lesson thumbnail image returned from the direct upload endpoint
                featured_media:
                  type: string
                  description: signed_id of the lesson featured media file returned from the direct upload endpoint
                rich_text_body:
                  type: object
                  description: Lesson body as a TipTap JSON document under the body key, replacing the whole lesson body. See https://api.circle.so/get-started/concepts/tiptap-editor for the format
                  properties:
                    body:
                      type: object
                      properties:
                        type:
                          type: string
                        content:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              text:
                                type: string
                                nullable: true
                              marks:
                                type: array
                                items:
                                  type: object
                              attrs:
                                type: object
                      required:
                      - type
                      - content
              required:
              - name
              - section_id
        required: true
        description: Course lesson params
