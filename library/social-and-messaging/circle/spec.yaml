  /profile_fields:
    post:
      summary: Create Profile Field
      tags:
      - Profile Fields
      description: 'Creates a new custom profile field for the community.


        Every part of the field is stated explicitly: `pages_attributes` lists the pages the field

        appears on and whether it is visible on each, `choices_attributes` lists the options for a

        select or checkbox field in the order given by `sort_key`, and `number_options_attributes`

        configures a number field. Nothing is derived — what you send is what is stored.


        To hide a field everywhere, send every page with `visible: false`.

        '
      security:
      - token_auth: []
      parameters: []
      responses:
        '201':
          description: Profile field created successfully
          content:
            application/json:
              examples:
                success:
                  value:
                    id: 1
                    label: Department
                    field_type: text
                    key: department
                    placeholder: e.g., Engineering
                    description: Your department
                    required: false
                    allow_null: true
                    platform_field: false
                    archived: false
                    created_at: '2025-10-27T14:00:00.000Z'
                    updated_at: '2025-10-27T14:00:00.000Z'
                    number_options: null
                    choices: []
                    pages:
                    - id: 1
                      name: signup
                      position: 1
                      visible: true
                      created_at: '2025-10-27T14:00:00.000Z'
                      updated_at: '2025-10-27T14:00:00.000Z'
              schema:
                $ref: '#/components/schemas/profile_field'
        '422':
          description: Invalid profile field params
          content:
            application/json:
              examples:
                unprocessable_content:
                  value:
                    success: false
                    message: Can't create profile field. There are some errors.
                    error_details: Key has already been taken
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_field:
                  type: object
                  properties:
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: Field label shown to members
                      example: Department
                    field_type:
                      type: string
                      enum:
                      - text
                      - select
                      - checkbox
                      - textarea
                      - link
                      - number
                      description: Type of field to create
                    key:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: ^[a-z0-9_]+$
                      description: Unique identifier for the field within the community. Lowercase letters, numbers and underscores only
                    description:
                      type: string
                      description: Help text shown to members
                    placeholder:
                      type: string
                      description: Placeholder text. Only meaningful for text, textarea and link fields
                    required:
                      type: boolean
                      description: Whether members must fill the field in. Defaults to false
                    allow_null:
                      type: boolean
                      description: Whether the field may be left empty. Defaults to false
                    pages_attributes:
                      type: array
                      description: The pages the field appears on. Send all four to state visibility explicitly
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            enum:
                            - signup
                            - edit_profile
                            - profile_view
                            - community_view
                            description: Page the field appears on
                          visible:
                            type: boolean
                            description: Whether the field is visible on this page
                        required:
                        - name
                        - visible
                    choices_attributes:
                      type: array
                      maxItems: 50
                      description: Options for a select or checkbox field. Required for those types, must be absent otherwise
                      items:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Option label
                          sort_key:
                            type: integer
                            description: Position of the option, ascending
                        required:
                        - value
                    number_options_attributes:
                      type: object
                      description: Formatting for a number field. Required for that type, must be absent otherwise
                      properties:
                        format:
                          type: string
                          enum:
                          - number
                          - percentage
                          - custom
                          - unformatted
                          description: How the number is formatted
                        decimal:
                          type: integer
                          minimum: 0
                          description: Number of decimal places
                        text:
                          type: string
                          description: Custom text shown alongside the number. Required when format is custom
                        position:
                          type: string
                          enum:
                          - left
                          - right
                          description: Which side of the number the custom text sits on
                      required:
                      - format
                  required:
                  - label
                  - field_type
                  - key
                  - pages_attributes
              required:
              - profile_field
        required: true
        description: Profile field attributes
    get:
      summary: Profile Fields List
      tags:
      - Profile Fields
      description: Lists the community's profile fields as a paginated list. Returns active fields by default, or archived fields when archived is 'true', and can be filtered by a case-insensitive partial label match.
