        description: Space ID
      - name: date_from
        in: query
        schema:
          type: string
          format: date_time
        required: false
        description: Filters messages created after the provided ISO8601 timestamp
      - name: first_unread_message_id
        in: query
        schema:
          type: integer
        required: false
        description: First unread message ID to include additional chat context
      responses:
        '200':
          description: Space AI summary
          content:
            application/json:
              examples:
                success:
                  value:
                    overview: The space 'latest-updates' highlights recent announcements and product discussions.
