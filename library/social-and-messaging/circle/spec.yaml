  /paywalls/search:
    get:
      summary: Search Paywalls
      tags:
      - Paywalls
      description: 'Search a community''s paywalls and their prices. Only authorized community admins may search. Ordinary search remains available when both contextual parameters are omitted.

        Before the host paywall is saved, search active targets in the host currency and inspect their subscription group to choose an add-on or upgrade. After saving, first resolve/read the current host with an ordinary paywall search filtered by paywall_id=<saved host ID>; verify the returned host ID, group, currency, and prices, then repeat the search with both contextual parameters. For example, use upsell_subtype=addon for an add-on, or upsell_subtype=upgrade for a same-group plan or eligible self-cycle. A draft host is eligible for a self-cycle only when its prices meet the existing cycle-upgrade rules.

        Contextual filters, sorting, and pagination apply to the eligible candidate set. This is configuration discovery only; it does not change member subscriptions or the community billing plan and does not guarantee a checkout quote, trial, or purchase. For workflow trigger setup, use a returned PaywallPrice ID when the workflow field asks for a price ID, and a paywall ID when it asks for a paywall ID. Ordinary search includes prices of all statuses; prefer active prices for new triggers and retain inactive-price visibility for existing workflow references.'
      security:
      - token_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      - name: name
        in: query
        required: false
        description: Filter by paywall name or display name (partial match)
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Comma-separated list of statuses (e.g. draft,active,inactive)
        schema:
          type: string
      - name: currency
        in: query
        required: false
        description: Comma-separated list of currency codes
        schema:
          type: string
      - name: paywall_id
        in: query
        required: false
        description: Comma-separated list of paywall IDs to include
        schema:
          type: string
      - name: exclude_paywall_id
        in: query
        required: false
        description: Comma-separated list of paywall IDs to exclude
        schema:
          type: string
      - name: subscription_group_id
        in: query
        required: false
        description: Comma-separated list of subscription group IDs to include
        schema:
          type: string
      - name: exclude_subscription_group_id
        in: query
        required: false
        description: Comma-separated list of subscription group IDs to exclude
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: 'Sort field (one of: title, status, created_at). Defaults to created_at'
        schema:
          type: string
      - name: direction
        in: query
        required: false
        description: Sort direction (asc or desc). Defaults to desc. Only takes effect when sort is also given -- direction alone is ignored
        schema:
          type: string
      - name: upsell_host_paywall_id
        in: query
        required: false
        description: Saved host paywall ID for contextual discovery. Provide with upsell_subtype; omit both for ordinary search.
        schema:
          type: integer
      - name: upsell_subtype
        in: query
        required: false
        description: Contextual upsell discovery type. One of addon or upgrade; provide with upsell_host_paywall_id.
        schema:
          type: string
          enum:
          - addon
          - upgrade
      responses:
        '200':
          description: Retrieves a list of paywalls for a community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paywalls_list'
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Community is not eligible for admin API v2 access or caller is not authorized to search paywalls
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: The contextual host paywall was not found in this community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          description: Contextual search parameters are incomplete or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
