  /advanced_search:
    get:
      summary: Advanced Search
      tags:
      - Advanced Search
      description: 'Searches the community by keyword across members, spaces, posts, comments, lessons and

        events. The type parameter picks what to search (general searches members and spaces), and

        filters narrow the results. Results are paginated and include highlighted matches.

        '
      security:
      - token_auth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        required: false
        description: Page number
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
        description: Number of records per page
      - name: query
        in: query
        schema:
          type: string
        required: true
        description: Search query
      - name: type
        in: query
        schema:
          type: string
          enum:
          - general
          - members
          - posts
          - comments
          - spaces
          - lessons
          - events
          - entity_list
          - mentions
        required: false
        description: Search type
      - name: mention_scope
        in: query
        schema:
          type: string
          enum:
          - space
          - group_chat
          - thread
          - direct
        required: false
        description: Mention scope
      - name: filters
        in: query
        schema:
          type: object
          properties:
            space_ids:
              type: array
              items:
                type: string
              description: IDs of spaces to restrict results to
            topic_ids:
              type: array
              items:
                type: string
              description: IDs of post topics to restrict results to
            member_tag_ids:
              type: array
              items:
                type: string
              description: IDs of member tags to restrict results to
            author_name:
              type: string
              description: Matches results whose author name contains this text
            status:
              type: string
              enum:
              - upcoming
              - past
              description: 'Event timing, applied only when type is events: upcoming for events starting now or later, past for events that already started'
        style: deepObject
        explode: true
        required: false
        description: Filters
