                        visible: true
                        created_at: '2025-10-27T14:00:00.000Z'
                        updated_at: '2025-10-27T14:00:00.000Z'
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  has_next_page:
                    type: boolean
                  count:
                    type: integer
                  page_count:
                    type: integer
