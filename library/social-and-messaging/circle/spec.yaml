      description: 'Schedules a legacy (non-access-group-enabled) paywall''s member access to be

        recomputed and re-granted for every subscriber. This is asynchronous: the response

        returns a scheduled PaywallJob resource before the underlying worker runs, so member

        access has not changed yet when the response is returned. Access-group-enabled paywalls

        already propagate access changes on every edit and reject this action with a 422.


        A repeat call for the same paywall within the ~5-minute dedup window (or while

        the scheduled worker is still running) returns 201 with the same PaywallJob

        rather than creating a new one -- the id is not a signal that a fresh sync

        was scheduled.

        '
      security:
      - token_auth: []
      parameters:
      - name: paywall_id
        in: path
        schema:
          type: integer
        required: true
        description: Paywall ID
      responses:
        '201':
          description: Member access sync scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paywall_member_access_sync'
        '422':
          description: Paywall already propagates member access via access groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
        '404':
          description: Paywall not found (nonexistent or belongs to another community)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                $ref: '#/components/schemas/error'
