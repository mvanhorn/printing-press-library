name: kaloricke-tabulky
description: "Czech-language nutrition tracking from kaloricketabulky.cz: food/activity/recipe search with full macro breakdown, daily diary, weight log, and 10 transcendence features powered by a local SQLite cache."
version: "0.1.0"
base_url: "https://www.kaloricketabulky.cz"
owner: "Vladimir Orany"
owner_name: "Vladimir Orany"

# Cookie session auth. The user logs in once via the custom MD5-password flow
# (hand-coded `auth login --email` command) or imports cookies from a Chrome
# session (`auth login --chrome`). Subsequent requests send the JSESSIONID +
# <session-cookie-name> cookies.
auth:
  type: cookie
  header: Cookie
  cookie_domain: ".kaloricketabulky.cz"
  cookies:
    - JSESSIONID
    - <session-cookie-name>

config:
  format: toml
  path: "~/.config/kaloricke-tabulky/config.toml"

# All endpoints share the envelope shape:
#   {requestId, code, message, data}
# Success is code:0. Errors are usually non-200 + Tomcat HTML, or 200 with code≠0.
response_path: "data"

resources:
  # ===================== PUBLIC SEARCH =====================
  food:
    description: "Search the 244 000-food Czech database and look up nutrition by slug"
    endpoints:
      search:
        method: GET
        path: "/autocomplete/foodstuff"
        no_auth: true
        description: "Search foods by Czech text (diacritics-tolerant on server)"
        params:
          - name: query
            type: string
            required: true
            description: "Search query (Czech name like 'jablko', 'tvaroh'); minimum 3 chars"
          - name: page
            type: int
            description: "Pagination page number (1-indexed)"
          - name: format
            type: string
            default: "json"
            hidden: true
        response_path: ""  # autocomplete returns raw array, not enveloped
        response:
          type: array
          item: FoodstuffMatch

  activity:
    description: "Search the catalog of physical activities (kcal/min metadata)"
    endpoints:
      search:
        method: GET
        path: "/autocomplete/activity"
        no_auth: true
        description: "Search activities by text (e.g. 'běh', 'plavání', 'joga')"
        params:
          - name: query
            type: string
            required: true
            description: "Search query"
          - name: page
            type: int
            description: "Page number"
          - name: format
            type: string
            default: "json"
            hidden: true
        response_path: ""
        response:
          type: array
          item: ActivityMatch

  recipe:
    description: "Search recipes (called 'meals' in the underlying API)"
    endpoints:
      search:
        method: GET
        path: "/autocomplete/meal"
        no_auth: true
        description: "Search recipes by text"
        params:
          - name: query
            type: string
            required: true
            description: "Search query"
          - name: page
            type: int
            description: "Page number"
          - name: format
            type: string
            default: "json"
            hidden: true
        response_path: ""
        response:
          type: array
          item: RecipeMatch

  # ===================== GLOBAL SEARCH =====================
  find:
    description: "Combined search across foods, activities, and recipes"
    endpoints:
      all:
        method: GET
        path: "/autocomplete/foodstuff-activity-meal"
        no_auth: true
        description: "One search across all entity types"
        params:
          - name: query
            type: string
            required: true
            description: "Search query"
          - name: page
            type: int
            description: "Page number"
          - name: format
            type: string
            default: "json"
            hidden: true
        response_path: ""
        response:
          type: array
          item: SearchHit

  # ===================== PUBLIC STATS =====================
  stats:
    description: "Public counters published on the home page"
    endpoints:
      foodstuff_count:
        method: GET
        path: "/home/foodstuff/count"
        no_auth: true
        description: "Total foods in the catalog"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: CountEnvelope
      diary_count:
        method: GET
        path: "/home/diary/count"
        no_auth: true
        description: "Total diary entries across all users"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: CountEnvelope
      user_count:
        method: GET
        path: "/home/user/count"
        no_auth: true
        description: "Total registered users"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: CountEnvelope

  # ===================== AUTHENTICATED DIARY =====================
  diary:
    description: "Daily food + activity diary; default date is today"
    endpoints:
      get:
        method: GET
        path: "/user/diary/{date}/get"
        description: "Get diary for a date (Czech DD.MM.YYYY format)"
        params:
          - name: date
            type: string
            required: true
            positional: true
            description: "Date in DD.MM.YYYY (Czech locale)"
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: DiaryDay
      days_filled:
        method: GET
        path: "/user/diary/filled-out"
        description: "Which days have any diary entries"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: FilledDays

  # ===================== AUTHENTICATED STATISTICS =====================
  summary:
    description: "Daily summary including energy, drink, macro targets, and weight history"
    endpoints:
      get:
        method: GET
        path: "/statistic/summary/{date}/get"
        description: "Get daily summary (energy, drink targets, monthly weight history)"
        params:
          - name: date
            type: string
            required: true
            positional: true
            description: "Date in DD.MM.YYYY"
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: SummaryDay

  achievements:
    description: "Achievements + tips engine"
    endpoints:
      list:
        method: GET
        path: "/statistic/analysis/achievements/get"
        description: "List achievements"
        params:
          - name: type
            type: string
            description: "Achievement type filter (optional)"
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: array
          item: Achievement

  streak:
    description: "Logging streak gamification"
    endpoints:
      get:
        method: GET
        path: "/user/streak"
        description: "Get logging streak"
        params:
          - name: date
            type: string
            description: "Date in DD.MM.YYYY (defaults to today server-side)"
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: StreakInfo

  # ===================== AUTHENTICATED USER DATA =====================
  weight:
    description: "Record weight; history is in summary.monthWeight"
    endpoints:
      add:
        method: POST
        path: "/user/weight/add"
        description: "Record weight for a date"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        body:
          - name: weight
            type: number
            required: true
            description: "Weight in kg"
          - name: date
            type: string
            required: true
            description: "Date in DD.MM.YYYY (Czech locale, no spaces)"
        response:
          type: object
          item: ApiResponse

  favorite:
    description: "Per-user favorite foods and activities"
    endpoints:
      list_food:
        method: GET
        path: "/user/settings/favorite/foodstuff"
        description: "List favorite foods"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: array
          item: FoodstuffMatch
      list_activity:
        method: GET
        path: "/user/settings/favorite/activity"
        description: "List favorite activities"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: array
          item: ActivityMatch

  meal:
    description: "User-defined custom meals (saved meal templates)"
    endpoints:
      list:
        method: GET
        path: "/user/settings/meal/list"
        description: "List saved meals"
        params:
          - name: limit
            type: int
            default: 100
            description: "Max meals to return"
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: array
          item: SavedMeal

  notifications:
    description: "In-app and site-wide messages"
    endpoints:
      inapp:
        method: GET
        path: "/user/messages/inapp"
        description: "In-app messages for the current user"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: array
          item: Message
      site:
        method: GET
        path: "/site/messages"
        description: "Site-wide messages"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: array
          item: Message

  session:
    description: "Session lifecycle"
    endpoints:
      keepalive:
        method: GET
        path: "/session/keepalive"
        description: "Extend the session (cookie refresh)"
        params:
          - name: format
            type: string
            default: "json"
            hidden: true
        response:
          type: object
          item: ApiResponse

types:
  ApiResponse:
    fields:
      - name: requestId
        type: string
      - name: code
        type: int
      - name: message
        type: string
      - name: data

  CountEnvelope:
    fields:
      - name: requestId
        type: string
      - name: code
        type: int
      - name: message
        type: string
      - name: data
        type: int

  FoodstuffMatch:
    fields:
      - name: clazz
        type: string
      - name: id
        type: string
      - name: url
        type: string
      - name: title
        type: string
      - name: type
        type: string
      - name: unit
        type: string
      - name: value
        type: string
      - name: favorite
        type: bool
      - name: brandName
        type: string
      - name: hasImage
        type: bool
      - name: isLiquid
        type: bool
      - name: locked
        type: bool

  ActivityMatch:
    fields:
      - name: clazz
        type: string
      - name: id
        type: string
      - name: url
        type: string
      - name: title
        type: string
      - name: type
        type: string
      - name: value
        type: string

  RecipeMatch:
    fields:
      - name: clazz
        type: string
      - name: id
        type: string
      - name: url
        type: string
      - name: title
        type: string
      - name: value
        type: string
      - name: unit
        type: string

  SearchHit:
    fields:
      - name: clazz
        type: string
      - name: id
        type: string
      - name: url
        type: string
      - name: title
        type: string
      - name: value
        type: string

  DiaryDay:
    fields:
      - name: date
        type: int
      - name: energyUnit
        type: string
      - name: times
        type: array
        item: MealSlot

  MealSlot:
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: foodstuff
        type: array
      - name: notes
        type: array

  FilledDays:
    fields:
      - name: dates
        type: array

  SummaryDay:
    fields:
      - name: date
        type: string
      - name: todayEnergy
        type: string
      - name: todayEnergyTarget
        type: string
      - name: energyUnit
        type: string
      - name: energyUnitCode
        type: string
      - name: todayDrink
        type: string
      - name: todayDrinkTarget
        type: string
      - name: monthWeight
        type: array
        item: WeightRecord

  WeightRecord:
    fields:
      - name: description
        type: string
      - name: value
        type: number

  Achievement:
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: description
        type: string
      - name: type
        type: string
      - name: progress
        type: number

  StreakInfo:
    fields:
      - name: current
        type: int
      - name: longest
        type: int
      - name: date
        type: string

  SavedMeal:
    fields:
      - name: id
        type: string
      - name: title
        type: string

  Message:
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: body
        type: string
      - name: timestamp
        type: string
