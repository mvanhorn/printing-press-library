version: 2
project_name: bestfoodtrucks-pp-cli
changelog:
  disable: true
builds:
  - id: bestfoodtrucks-pp-cli
    main: ./cmd/bestfoodtrucks-pp-cli
    binary: bestfoodtrucks-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/bestfoodtrucks/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: bestfoodtrucks-pp-mcp
    main: ./cmd/bestfoodtrucks-pp-mcp
    binary: bestfoodtrucks-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: bestfoodtrucks-pp-cli
    repository:
      owner: enlewof
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The only Best Food Trucks client that can tell you where a truck goes, not just what's parked outside today."
    install: |
      bin.install "bestfoodtrucks-pp-cli"
      bin.install "bestfoodtrucks-pp-mcp"
