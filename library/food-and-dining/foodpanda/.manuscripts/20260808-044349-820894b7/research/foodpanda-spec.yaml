      - name: rating
        type: float
      - name: review_number
        type: int
      - name: minimum_delivery_fee
        type: float
      - name: minimum_order_amount
        type: float
      - name: delivery_fee
        type: float
      - name: original_delivery_fee
        type: float
      - name: service_fee
        type: float
      - name: small_order_fee
        type: float
      - name: small_order_fee_cap
        type: float
      - name: delivery_fee_source
        type: string
      - name: delivery_fee_type
        type: string
      - name: is_busy
        type: bool
      - name: is_active
        type: bool
      - name: latitude
        type: float
      - name: longitude
        type: float
      - name: food_license_number
        type: string
      - name: vertical
        type: string

  Review:
