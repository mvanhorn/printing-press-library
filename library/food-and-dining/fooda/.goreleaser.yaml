version: 2
project_name: fooda-pp-cli
changelog:
  disable: true
builds:
  - id: fooda-pp-cli
    main: ./cmd/fooda-pp-cli
    binary: fooda-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/fooda/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: fooda-pp-mcp
    main: ./cmd/fooda-pp-mcp
    binary: fooda-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: fooda-pp-cli
    repository:
      owner: enlewof
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "CLI for Fooda workplace lunch (app.fooda."
    install: |
      bin.install "fooda-pp-cli"
      bin.install "fooda-pp-mcp"
