name: texas-roadhouse
description: Waitlist CLI for Texas Roadhouse. Find a nearby store, read the quote, join and leave the list.
version: 0.1.0
base_url: https://www.texasroadhouse.com
spec_source: sniffed
auth:
    type: none
    header: ""
    format: ""
    env_vars: []
auth_warnings:
    - 'rejected auth candidate "limit" from query: search input'
config:
    format: toml
    path: ~/.config/texas-roadhouse-pp-cli/config.toml
resources:
    mapbox:
        description: Operations on mapbox.places
        endpoints:
            get_mapbox.places:
                method: GET
                path: /api/mapbox/geocoding/v5/mapbox.places/{id}
                description: GET /api/mapbox/geocoding/v5/mapbox.places/{id}
                params:
                    - name: country
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: The id path segment
                      fields: []
                    - name: types
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                body: []
                response:
                    type: array
                    item: MapboxPlaceFeature
                pagination: null
                response_path: features
    stores:
        description: Operations on near
        endpoints:
            list_near:
                method: GET
                path: /api/stores/near
                description: GET /api/stores/near
                params:
                    - name: lat
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: limit
                      type: integer
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: long
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: nomnom
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: nomnom_calendars_from
                      type: integer
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: nomnom_calendars_to
                      type: integer
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: nomnom_exclude_extref
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                    - name: radius
                      type: integer
                      required: false
                      positional: false
                      default: null
                      description: ""
                      fields: []
                body: []
                response:
                    type: array
                    item: NearRestaurant
                pagination: null
                response_path: restaurants
    texasroadhouse:
        description: Operations on test
        endpoints:
            get_quote:
                method: GET
                path: /api/texasroadhouse/waitlist/{waitlist_id}/quote
                description: GET /api/texasroadhouse/waitlist/{waitlist_id}/quote
                params:
                    - name: waitlist_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: The waitlist_id path segment
                      fields: []
                body: []
                response:
                    type: object
                    item: Quote
                pagination: null
            get_settings:
                method: GET
                path: /api/texasroadhouse/waitlist/{waitlist_id}/settings
                description: GET /api/texasroadhouse/waitlist/{waitlist_id}/settings
                params:
                    - name: waitlist_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: The waitlist_id path segment
                      fields: []
                body: []
                response:
                    type: array
                    item: SettingSpecialSeatingType
                pagination: null
                response_path: SpecialSeatingTypes
            get_test:
                method: GET
                path: /api/texasroadhouse/waitlist/{waitlist_id}/test
                description: GET /api/texasroadhouse/waitlist/{waitlist_id}/test
                params:
                    - name: waitlist_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: The waitlist_id path segment
                      fields: []
                body: []
                response:
                    type: object
                    item: Test
                pagination: null
            get_status:
                method: GET
                path: /api/texasroadhouse/waitlist/{waitlist_id}/requests/{request_id}/status
                description: GET waitlist request status. Query clientid=texasroadhouse.
                params:
                    - name: waitlist_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: "Store extref (not internal store id). Springfield MO is 218."
                      fields: []
                    - name: request_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: "Waitlist request id from a successful submit."
                      fields: []
                    - name: clientid
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: "Must be texasroadhouse"
                      fields: []
                body: []
                response:
                    type: object
                    item: WaitlistStatus
                pagination: null
            submit:
                method: POST
                path: /api/texasroadhouse/waitlist/{waitlist_id}/submit
                description: Join a store waitlist. Always pass --dry-run unless the user named a store, party size, and said yes.
                params:
                    - name: waitlist_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: "Store extref (not internal store id). Springfield MO is 218."
                      fields: []
                body:
                    - name: EmailAddress
                      type: string
                      required: true
                      positional: false
                      default: null
                      description: "Guest email"
                      fields: []
                    - name: FirstName
                      type: string
                      required: true
                      positional: false
                      default: null
                      description: "Guest first name"
                      fields: []
                    - name: LastName
                      type: string
                      required: true
                      positional: false
                      default: null
                      description: "Guest last name"
                      fields: []
                    - name: IsSmoking
                      type: bool
                      required: false
                      positional: false
                      default: null
                      description: "Always false in the web app"
                      fields: []
                    - name: PrimaryPhoneAreaCode
                      type: string
                      required: true
                      positional: false
                      default: null
                      description: "3-digit area code"
                      fields: []
                    - name: PrimaryPhoneExtension
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: "Usually empty"
                      fields: []
                    - name: PrimaryPhoneNumber
                      type: string
                      required: true
                      positional: false
                      default: null
                      description: "Local number as xxx-xxxx"
                      fields: []
                    - name: PrimaryPhoneType
                      type: integer
                      required: false
                      positional: false
                      default: null
                      description: "Web app sends 1"
                      fields: []
                    - name: PartySize
                      type: number
                      required: true
                      positional: false
                      default: null
                      description: "Party size, max 6"
                      fields: []
                    - name: WaitMinutes
                      type: integer
                      required: true
                      positional: false
                      default: null
                      description: "From quote MinQuote for this party size"
                      fields: []
                    - name: Platform
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: "Web app sends web"
                      fields: []
                response:
                    type: object
                    item: WaitlistSubmitResult
                pagination: null
            checkin:
                method: POST
                path: /api/texasroadhouse/waitlist/{waitlist_id}/checkin
                description: Mark the party HERE after the guest texts HERE once everyone has arrived (text REMOVE to leave). Not a host-stand visit. Do not fire without a yes.
                params:
                    - name: waitlist_id
                      type: string
                      required: true
                      positional: true
                      default: null
                      description: "Store extref (not internal store id). Springfield MO is 218."
                      fields: []
                body: []
                response:
                    type: object
                    item: WaitlistCheckinResult
                pagination: null
            cancel:
                method: POST
                path: /api/texasroadhouse/waitlist/cancel
                description: Cancel a waitlist request. Guests can also text REMOVE to leave; CLI leave is this cancel command. Do not fire without a yes.
                params:
                    - name: clientid
                      type: string
                      required: false
                      positional: false
                      default: null
                      description: "Must be texasroadhouse"
                      fields: []
                body:
                    - name: waitlistRequestId
                      type: integer
                      required: true
                      positional: false
                      default: null
                      description: "Numeric request id from submit (JSON number, not a string)"
                      fields: []
                    - name: siteId
                      type: string
                      required: true
                      positional: false
                      default: null
                      description: "Store extref"
                      fields: []
                response:
                    type: object
                    item: WaitlistCancelResult
                pagination: null

