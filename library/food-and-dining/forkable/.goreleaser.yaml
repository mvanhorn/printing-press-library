version: 2
project_name: forkable-pp-cli
changelog:
  disable: true
builds:
  - id: forkable-pp-cli
    main: ./cmd/forkable-pp-cli
    binary: forkable-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/forkable/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: forkable-pp-mcp
    main: ./cmd/forkable-pp-mcp
    binary: forkable-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: forkable-pp-cli
    repository:
      owner: enlewof
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "A CLI and MCP server for your Forkable office-lunch program, with a local database and history, spend, and preference queries the web app cannot answer, plus commands to set, confirm, and skip meal orders (dry-run by default; --confirm to apply)."
    install: |
      bin.install "forkable-pp-cli"
      bin.install "forkable-pp-mcp"
