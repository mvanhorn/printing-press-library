version: 2
project_name: open-food-facts-pp-cli
changelog:
  disable: true

builds:
  - id: open-food-facts-pp-cli
    main: ./cmd/open-food-facts-pp-cli
    binary: open-food-facts-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/open-food-facts/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: open-food-facts-pp-cli
    repository:
      owner: trevin-chow
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Look up Open Food Facts products, nutrition, allergens, comparisons, and bounded category/search data from public APIs."
    install: |
      bin.install "open-food-facts-pp-cli"
