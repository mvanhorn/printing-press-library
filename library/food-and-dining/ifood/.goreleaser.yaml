version: 2
project_name: ifood-pp-cli
changelog:
  disable: true
builds:
  - id: ifood-pp-cli
    main: ./cmd/ifood-pp-cli
    binary: ifood-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/ifood/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ifood-pp-mcp
    main: ./cmd/ifood-pp-mcp
    binary: ifood-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ifood-pp-cli
    repository:
      owner: matheuscoelhomalta
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Agent-ready iFood grocery quoting with browser-owned authentication and confirmation-gated cart planning."
    install: |
      bin.install "ifood-pp-cli"
      bin.install "ifood-pp-mcp"
