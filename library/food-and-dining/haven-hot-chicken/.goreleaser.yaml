version: 2
project_name: haven-hot-chicken-pp-cli
changelog:
  disable: true
builds:
  - id: haven-hot-chicken-pp-cli
    main: ./cmd/haven-hot-chicken-pp-cli
    binary: haven-hot-chicken-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/food-and-dining/haven-hot-chicken/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: haven-hot-chicken-pp-mcp
    main: ./cmd/haven-hot-chicken-pp-mcp
    binary: haven-hot-chicken-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: haven-hot-chicken-pp-cli
    repository:
      owner: wirelesstkd
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Browse Haven menus, compare locations, and plan a meal from saved prices."
    install: |
      bin.install "haven-hot-chicken-pp-cli"
      bin.install "haven-hot-chicken-pp-mcp"
