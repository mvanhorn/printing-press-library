version: 2
project_name: goose-pp-cli
changelog:
  disable: true
builds:
  - id: goose-pp-cli
    main: ./cmd/goose-pp-cli
    binary: goose-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/goose/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: goose-pp-mcp
    main: ./cmd/goose-pp-mcp
    binary: goose-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: goose-pp-cli
    repository:
      owner: corey-pensky
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Run your goose.pet facility from the terminal — today's roster, customer lookup, vaccine warnings, and bulk CSV..."
    install: |
      bin.install "goose-pp-cli"
      bin.install "goose-pp-mcp"
