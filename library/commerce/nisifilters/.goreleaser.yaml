version: 2
project_name: nisifilters-pp-cli
changelog:
  disable: true
builds:
  - id: nisifilters-pp-cli
    main: ./cmd/nisifilters-pp-cli
    binary: nisifilters-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/nisifilters/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: nisifilters-pp-mcp
    main: ./cmd/nisifilters-pp-mcp
    binary: nisifilters-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: nisifilters-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//nisifilters-pp-cli"
    description: "A read-only, offline-first mirror and search engine for the public NiSi Italia filter catalog and content."
    install: |
      bin.install "nisifilters-pp-cli"
      bin.install "nisifilters-pp-mcp"
