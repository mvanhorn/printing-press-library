version: 2
project_name: edeka-pp-cli
changelog:
  disable: true
builds:
  - id: edeka-pp-cli
    main: ./cmd/edeka-pp-cli
    binary: edeka-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/edeka/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: edeka-pp-mcp
    main: ./cmd/edeka-pp-mcp
    binary: edeka-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: edeka-pp-cli
    repository:
      owner: jimpresting
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Shop your local EDEKA market from the terminal or an agent: offers, basket by text, earliest pickup slot, checkout with a confirmation gate."
    install: |
      bin.install "edeka-pp-cli"
      bin.install "edeka-pp-mcp"
