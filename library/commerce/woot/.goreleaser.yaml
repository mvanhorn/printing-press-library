version: 2
project_name: woot-pp-cli
changelog:
  disable: true
builds:
  - id: woot-pp-cli
    main: ./cmd/woot-pp-cli
    binary: woot-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/woot/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: woot-pp-mcp
    main: ./cmd/woot-pp-mcp
    binary: woot-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: woot-pp-cli
    repository:
      owner: TheFabulousMoolah
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Search Woot's live All Deals catalog with filters, prices, offline full-text search, and read-only GraphQL access."
    install: |
      bin.install "woot-pp-cli"
      bin.install "woot-pp-mcp"
