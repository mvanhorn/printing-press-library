version: 2
project_name: amazon-pp-cli
changelog:
  disable: true
builds:
  - id: amazon-pp-cli
    main: ./cmd/amazon-pp-cli
    binary: amazon-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/amazon/internal/cli.Version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: amazon-pp-mcp
    main: ./cmd/amazon-pp-mcp
    binary: amazon-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - checkout-helper/*
checksum:
  name_template: checksums.txt
