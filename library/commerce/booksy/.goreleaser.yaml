version: 2
project_name: booksy-pp-cli
changelog:
  disable: true
builds:
  - id: booksy-pp-cli
    main: ./cmd/booksy-pp-cli
    binary: booksy-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/booksy/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: booksy-pp-mcp
    main: ./cmd/booksy-pp-mcp
    binary: booksy-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: booksy-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//booksy-pp-cli"
    description: "Book a haircut in Poland from the terminal — search barbers, compare prices and reviews, check open slots, and book, with a dry-run-by-default booking guard."
    install: |
      bin.install "booksy-pp-cli"
      bin.install "booksy-pp-mcp"
