# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "priority-pp-cli"
display_name = "Priority Software"
description = "The entire Priority REST API — every form, subform, batch, and attachment — plus offline sync, schema intelligence, and throttle-safe bulk operations no other Priority tool has."
project_kind = "cli"

[secrets.file]
path = "~/.config/priority-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
PRIORITY_API_PASSWORD = true
PRIORITY_API_USERNAME = true
