 und Unterhitze vorheizen und die Auflaufform (38 x 26 cm) mit etwas Butter einreiben.","name":"Schritt 3","url":"https://www.rewe.de/rezepte/gnocchi-spinat-auflauf-hirtenkaese/#step_3"},{"@type":"HowToStep","text":"Den Inhalt aus der Pfanne in die Auflaufform geben und den Hirtenkäse über den Auflauf bröseln.","name":"Schritt 4","url":"https://www.rewe.de/rezepte/gnocchi-spinat-auflauf-hirtenkaese/#step_4"},{"@type":"HowToStep","text":"Im Backofen ca. 20 Minuten backen, bis der Käse goldbraun ist.","name":"Schritt 5","url":"https://www.rewe.de/rezepte/gnocchi-spinat-auflauf-hirtenkaese/#step_5"}],"servingType":"portions","datePublished":"2025-05-22"}'
