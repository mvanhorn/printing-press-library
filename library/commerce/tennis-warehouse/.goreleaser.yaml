version: 2
project_name: tennis-warehouse-pp-cli
changelog:
  disable: true
builds:
  - id: tennis-warehouse-pp-cli
    main: ./cmd/tennis-warehouse-pp-cli
    binary: tennis-warehouse-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/tennis-warehouse/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: tennis-warehouse-pp-mcp
    main: ./cmd/tennis-warehouse-pp-mcp
    binary: tennis-warehouse-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: tennis-warehouse-pp-cli
    repository:
      owner: blake-johnson
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every racquet Tennis Warehouse sells — new and used — searchable offline with spec compare, substitute finder,..."
    install: |
      bin.install "tennis-warehouse-pp-cli"
      bin.install "tennis-warehouse-pp-mcp"
