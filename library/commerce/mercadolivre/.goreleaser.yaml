version: 2
project_name: mercadolivre-pp-cli
changelog:
  disable: true
builds:
  - id: mercadolivre-pp-cli
    main: ./cmd/mercadolivre-pp-cli
    binary: mercadolivre-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/mercadolivre/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: mercadolivre-pp-mcp
    main: ./cmd/mercadolivre-pp-mcp
    binary: mercadolivre-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: mercadolivre-pp-cli
    repository:
      owner: wandreis
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Search Mercado Livre, compare prices and technical specs across listings, and build cotações — offline-persisted and agent-native, for procurement automation."
    install: |
      bin.install "mercadolivre-pp-cli"
      bin.install "mercadolivre-pp-mcp"
