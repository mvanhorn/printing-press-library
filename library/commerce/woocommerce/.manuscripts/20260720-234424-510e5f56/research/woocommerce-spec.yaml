  order-notes:
    description: Manage notes attached to WooCommerce orders
    endpoints:
      list:
        method: GET
        path: /wc/v3/orders/{order_id}/notes
        description: List order notes.
        params:
        - name: order_id
          type: int
          required: true
          description: The order ID.
          positional: true
        - name: context
          type: string
          required: false
          description: Scope under which the request is made; determines fields present in response.
          default: view
          enum:
          - view
          - edit
        - name: type
          type: string
          required: false
          description: Limit result to customers or internal notes.
          default: any
          enum:
          - any
          - customer
          - internal
        response:
          type: array
      create:
        method: POST
        path: /wc/v3/orders/{order_id}/notes
        description: Create order notes.
        params:
        - name: order_id
          type: int
          required: true
          description: The order ID.
          positional: true
        body:
        - name: note
          type: string
          required: true
          description: Order note content.
        - name: customer_note
          type: bool
          required: false
          description: If true, the note will be shown to customers and they will be notified. If false, the note will be for admin reference only.
          default: false
        - name: added_by_user
          type: bool
          required: false
          description: If true, this note will be attributed to the current user. If false, the note will be attributed to the system.
          default: false
      get:
        method: GET
        path: /wc/v3/orders/{order_id}/notes/{id}
        description: Get order notes.
        params:
        - name: order_id
          type: int
          required: true
          description: The order ID.
          positional: true
        - name: id
          type: int
          required: true
          description: Unique identifier for the resource.
          positional: true
        - name: context
          type: string
          required: false
          description: Scope under which the request is made; determines fields present in response.
          default: view
          enum:
          - view
          - edit
        response:
          type: object
      delete:
        method: DELETE
        path: /wc/v3/orders/{order_id}/notes/{id}
        description: Delete order notes.
        params:
        - name: order_id
          type: int
          required: true
          description: The order ID.
          positional: true
        - name: id
          type: int
          required: true
          description: Unique identifier for the resource.
          positional: true
        - name: force
          type: bool
          required: false
          description: Required to be true, as resource does not support trashing.
          default: false
  order-refunds:
    description: Manage refunds attached to WooCommerce orders
    endpoints:
      list:
        method: GET
        path: /wc/v3/orders/{order_id}/refunds
        description: List order refunds.
        params:
        - name: order_id
          type: int
          required: true
          description: The order ID.
          positional: true
        - name: context
          type: string
          required: false
          description: Scope under which the request is made; determines fields present in response.
          default: view
          enum:
          - view
          - edit
        - name: page
          type: int
          required: false
          description: Current page of the collection.
          default: 1
        - name: per_page
          type: int
          required: false
          description: Maximum number of items to be returned in result set.
          default: 10
        - name: search
          type: string
          required: false
          description: Limit results to those matching a string.
        - name: after
          type: string
          required: false
          description: Limit response to resources published after a given ISO8601 compliant date.
          format: date-time
