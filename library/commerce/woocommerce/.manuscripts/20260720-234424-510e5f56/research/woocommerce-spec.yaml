name: woocommerce
description: WooCommerce REST API CLI - manage your store and inspect any WooCommerce catalog
version: 0.1.0
base_url: https://woocommerce.com/wp-json
health_check_path: /wc/v3
auth:
  type: api_key
  header: Authorization
  format: Basic {consumer_key}:{consumer_secret}
  env_vars:
  - WOOCOMMERCE_CONSUMER_KEY
  - WOOCOMMERCE_CONSUMER_SECRET
config:
  format: toml
  path: ~/.config/woocommerce-pp-cli/config.toml
category: commerce
cache:
  enabled: true
  stale_after: 6h
  refresh_timeout: 30s
learn:
  entity_lookup_seeds:
    order_status:
    - canonical: pending
      aliases:
      - pending payment
      - unpaid
      - awaiting payment
      - not paid
    - canonical: processing
      aliases:
      - paid
      - unfulfilled
      - awaiting fulfillment
      - to ship
      - new orders
      - open
    - canonical: on-hold
      aliases:
      - on hold
      - held
      - awaiting stock
      - waiting
    - canonical: completed
      aliases:
      - fulfilled
      - shipped
      - done
      - finished
    - canonical: cancelled
      aliases:
      - canceled
      - voided
      - killed
    - canonical: refunded
      aliases:
      - returned
      - money back
      - reimbursed
    - canonical: failed
      aliases:
      - payment failed
      - declined
      - errored
      - rejected
    - canonical: checkout-draft
      aliases:
      - draft
      - abandoned
      - incomplete checkout
    product_type:
    - canonical: simple
      aliases:
      - standard
      - basic
      - plain
    - canonical: variable
      aliases:
      - with variations
      - has options
      - configurable
      - variants
    - canonical: grouped
      aliases:
      - group
      - product group
    - canonical: external
      aliases:
      - affiliate
      - external product
      - referral
    stock_status:
    - canonical: instock
      aliases:
      - in stock
      - available
      - have stock
    - canonical: outofstock
      aliases:
      - out of stock
      - sold out
      - unavailable
      - no stock
    - canonical: onbackorder
      aliases:
      - backorder
      - on backorder
      - backordered
    discount_type:
    - canonical: percent
      aliases:
      - percentage
      - percent off
      - '% off'
    - canonical: fixed_cart
      aliases:
      - fixed cart discount
      - cart discount
      - order discount
    - canonical: fixed_product
      aliases:
      - fixed product discount
      - per item discount
  synonyms:
    most recent: latest
    sku code: sku
    line items: items
    gross: total
  stopwords:
  - store
  - shop
resources:
  coupons:
    description: Manage WooCommerce coupons
    endpoints:
      list:
        method: GET
        path: /wc/v3/coupons
        description: List coupons.
        params:
        - name: context
          type: string
          required: false
          description: Scope under which the request is made; determines fields present in response.
          default: view
          enum:
          - view
          - edit
        - name: page
          type: int
          required: false
          description: Current page of the collection.
          default: 1
        - name: per_page
          type: int
          required: false
          description: Maximum number of items to be returned in result set.
          default: 10
        - name: search
          type: string
          required: false
          description: Limit results to those matching a string.
        - name: after
          type: string
          required: false
          description: Limit response to resources published after a given ISO8601 compliant date.
          format: date-time
        - name: before
          type: string
          required: false
          description: Limit response to resources published before a given ISO8601 compliant date.
          format: date-time
        - name: modified_after
          type: string
          required: false
          description: Limit response to resources modified after a given ISO8601 compliant date.
          format: date-time
        - name: modified_before
          type: string
          required: false
          description: Limit response to resources modified before a given ISO8601 compliant date.
          format: date-time
        - name: dates_are_gmt
          type: bool
          required: false
          description: Whether to consider GMT post dates when limiting response by published or modified date.
          default: false
        - name: exclude
          type: string
          required: false
          description: Ensure result set excludes specific IDs. (comma-separated)
        - name: include
          type: string
          required: false
          description: Limit result set to specific ids. (comma-separated)
        - name: offset
          type: int
          required: false
          description: Offset the result set by a specific number of items.
        - name: order
          type: string
          required: false
          description: Order sort attribute ascending or descending.
          default: desc
          enum:
          - asc
          - desc
        - name: orderby
          type: string
          required: false
          description: Sort collection by object attribute.
          default: date
          enum:
          - date
          - id
          - include
          - title
          - slug
          - modified
        - name: code
          type: string
          required: false
          description: Limit result set to resources with a specific code.
        response:
          type: array
          item: Coupon
        pagination:
          type: page
      create:
        method: POST
        path: /wc/v3/coupons
        description: Create coupons.
        body:
        - name: code
          type: string
          required: true
          description: Coupon code.
        - name: amount
          type: string
          required: false
          description: The amount of discount. Should always be numeric, even if setting a percentage.
        - name: status
          type: string
          required: false
          description: The status of the coupon. Should always be draft, published, or pending review
        - name: discount_type
          type: string
          required: false
          description: Determines the type of discount that will be applied.
          default: fixed_cart
          enum:
          - percent
          - fixed_cart
          - fixed_product
          - sign_up_fee
          - sign_up_fee_percent
          - recurring_fee
          - recurring_percent
          - renewal_percent
          - renewal_fee
          - renewal_cart
          - initial_cart
        - name: description
          type: string
          required: false
          description: Coupon description.
        - name: date_expires
          type: string
          required: false
          description: The date the coupon expires, in the site's timezone.
        - name: date_expires_gmt
          type: string
          required: false
          description: The date the coupon expires, as GMT.
        - name: individual_use
          type: bool
          required: false
          description: If true, the coupon can only be used individually. Other applied coupons will be removed from the cart.
          default: false
        - name: product_ids
          type: string
          required: false
          description: List of product IDs the coupon can be used on. (comma-separated)
        - name: excluded_product_ids
          type: string
          required: false
          description: List of product IDs the coupon cannot be used on. (comma-separated)
        - name: usage_limit
          type: int
          required: false
          description: How many times the coupon can be used in total.
        - name: usage_limit_per_user
          type: int
          required: false
          description: How many times the coupon can be used per customer.
        - name: limit_usage_to_x_items
          type: int
          required: false
          description: Max number of items in the cart the coupon can be applied to.
        - name: free_shipping
          type: bool
          required: false
          description: If true and if the free shipping method requires a coupon, this coupon will enable free shipping.
          default: false
        - name: product_categories
          type: string
          required: false
          description: List of category IDs the coupon applies to. (comma-separated)
        - name: excluded_product_categories
          type: string
          required: false
          description: List of category IDs the coupon does not apply to. (comma-separated)
        - name: exclude_sale_items
          type: bool
          required: false
          description: If true, this coupon will not be applied to items that have sale prices.
          default: false
        - name: minimum_amount
          type: string
          required: false
          description: Minimum order amount that needs to be in the cart before coupon applies.
        - name: maximum_amount
          type: string
          required: false
          description: Maximum order amount allowed when using the coupon.
        - name: email_restrictions
          type: string
          required: false
          description: List of email addresses that can use this coupon. (comma-separated)
        - name: meta_data
          type: string
          required: false
          description: Meta data. (comma-separated)
      get:
        method: GET
        path: /wc/v3/coupons/{id}
        description: Get coupons.
        params:
        - name: id
          type: int
          required: true
          description: Unique identifier for the resource.
          positional: true
        - name: context
          type: string
          required: false
          description: Scope under which the request is made; determines fields present in response.
          default: view
          enum:
          - view
          - edit
        response:
          type: object
          item: Coupon
      update:
        method: PUT
        path: /wc/v3/coupons/{id}
        description: Update coupons.
        params:
        - name: id
          type: int
          required: true
          description: Unique identifier for the resource.
          positional: true
        body:
        - name: code
          type: string
          required: false
          description: Coupon code.
        - name: amount
          type: string
          required: false
          description: The amount of discount. Should always be numeric, even if setting a percentage.
        - name: status
          type: string
          required: false
          description: The status of the coupon. Should always be draft, published, or pending review
        - name: discount_type
          type: string
          required: false
          description: Determines the type of discount that will be applied.
          enum:
          - percent
          - fixed_cart
          - fixed_product
          - sign_up_fee
          - sign_up_fee_percent
          - recurring_fee
          - recurring_percent
          - renewal_percent
          - renewal_fee
          - renewal_cart
          - initial_cart
        - name: description
          type: string
          required: false
          description: Coupon description.
        - name: date_expires
          type: string
          required: false
          description: The date the coupon expires, in the site's timezone.
        - name: date_expires_gmt
