version: 2
project_name: etsy-pp-cli
changelog:
  disable: true
builds:
  - id: etsy-pp-cli
    main: ./cmd/etsy-pp-cli
    binary: etsy-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/etsy/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: etsy-pp-mcp
    main: ./cmd/etsy-pp-mcp
    binary: etsy-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: etsy-pp-cli
    repository:
      owner: vinnyp
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Etsy Open API v3 commands plus a local SQLite store for offline fee reports, ledger reconciliation, listing and GPSR audits, market research, and previewed bulk edits."
    install: |
      bin.install "etsy-pp-cli"
      bin.install "etsy-pp-mcp"
