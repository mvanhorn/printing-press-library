version: 2
project_name: quickcommerce-pp-cli
changelog:
  disable: true
builds:
  - id: quickcommerce-pp-cli
    main: ./cmd/quickcommerce-pp-cli
    binary: quickcommerce-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/quickcommerce/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: quickcommerce-pp-mcp
    main: ./cmd/quickcommerce-pp-mcp
    binary: quickcommerce-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: quickcommerce-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Compare live Indian product prices, stock, and delivery ETAs from the terminal, then keep the history locally."
    install: |
      bin.install "quickcommerce-pp-cli"
      bin.install "quickcommerce-pp-mcp"
