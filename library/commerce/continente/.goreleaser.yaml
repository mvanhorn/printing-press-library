version: 2
project_name: continente-pp-cli
changelog:
  disable: true
builds:
  - id: continente-pp-cli
    main: ./cmd/continente-pp-cli
    binary: continente-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/continente/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: continente-pp-mcp
    main: ./cmd/continente-pp-mcp
    binary: continente-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: continente-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//continente-pp-cli"
    description: "Read-oriented storefront endpoints observed on continente.pt."
    install: |
      bin.install "continente-pp-cli"
      bin.install "continente-pp-mcp"
