version: 2
project_name: iqos-pp-cli
changelog:
  disable: true
builds:
  - id: iqos-pp-cli
    main: ./cmd/iqos-pp-cli
    binary: iqos-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/iqos/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: iqos-pp-mcp
    main: ./cmd/iqos-pp-mcp
    binary: iqos-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: iqos-pp-cli
    repository:
      owner: nicolas-correa
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every IQOS product, store, and flavor across 30+ global markets — synced locally, searchable offline."
    install: |
      bin.install "iqos-pp-cli"
      bin.install "iqos-pp-mcp"
