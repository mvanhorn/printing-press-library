version: 2
project_name: flipkart-pp-cli
changelog:
  disable: true
builds:
  - id: flipkart-pp-cli
    main: ./cmd/flipkart-pp-cli
    binary: flipkart-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X flipkart-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: flipkart-pp-mcp
    main: ./cmd/flipkart-pp-mcp
    binary: flipkart-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: flipkart-pp-cli
    repository:
      owner: rajiv-lokare
      name: homebrew-tap
    homepage: "https://github.com/rajiv-lokare/flipkart-pp-cli"
    description: "Every Flipkart scraper's features, plus a local price-history and deal-tracking layer no single-shot script can offer."
    install: |
      bin.install "flipkart-pp-cli"
      bin.install "flipkart-pp-mcp"
