version: 2
project_name: spothero-pp-cli
changelog:
  disable: true
builds:
  - id: spothero-pp-cli
    main: ./cmd/spothero-pp-cli
    binary: spothero-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/spothero/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: spothero-pp-mcp
    main: ./cmd/spothero-pp-mcp
    binary: spothero-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: spothero-pp-cli
    repository:
      owner: amansk
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Find, quote, book and cancel SpotHero parking from the terminal, with spend caps and hard gates."
    install: |
      bin.install "spothero-pp-cli"
      bin.install "spothero-pp-mcp"
