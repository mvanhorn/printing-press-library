version: 2
project_name: pricena-ae-pp-cli
changelog:
  disable: true
builds:
  - id: pricena-ae-pp-cli
    main: ./cmd/pricena-ae-pp-cli
    binary: pricena-ae-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/pricena-ae/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: pricena-ae-pp-mcp
    main: ./cmd/pricena-ae-pp-mcp
    binary: pricena-ae-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: pricena-ae-pp-cli
    repository:
      owner: aamin-labs
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Unofficial HTML surface for ae.pricena.com product search and product detail pages."
    install: |
      bin.install "pricena-ae-pp-cli"
      bin.install "pricena-ae-pp-mcp"
