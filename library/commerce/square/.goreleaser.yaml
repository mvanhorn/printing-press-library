version: 2
project_name: square-pp-cli
changelog:
  disable: true
builds:
  - id: square-pp-cli
    main: ./cmd/square-pp-cli
    binary: square-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/commerce/square/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: square-pp-mcp
    main: ./cmd/square-pp-mcp
    binary: square-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: square-pp-cli
    repository:
      owner: wirelesstkd
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every current Square API operation, plus local reconciliation and history the remote API cannot provide by itself."
    install: |
      bin.install "square-pp-cli"
      bin.install "square-pp-mcp"
