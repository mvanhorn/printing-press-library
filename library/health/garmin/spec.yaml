  /usersummary-service/stats/steps/weekly/{end}/{weeks}:
    get:
      operationId: stepsWeekly
      tags:
        - steps
      summary: List weekly step aggregates for a number of weeks ending on a date
      description: |
        Weekly step buckets instead of daily ones, about a year of them in a single request.
        The daily form would take thirteen requests for the same span. Use this for long-horizon trend
        questions and fall back to the daily form when a specific date matters.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
