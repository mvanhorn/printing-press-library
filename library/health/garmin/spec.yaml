components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        DI OAuth2 access token from `POST https://diauth.garmin.com/di-oauth2-service/oauth/token`.
        Obtained by exchanging a Garmin SSO service ticket (grant type
        `https://connectapi.garmin.com/di-oauth2-service/oauth/grant/service_ticket`; form fields
        `client_id`, `service_ticket`, `grant_type`, `service_url`; header `Authorization: Basic
        base64(client_id + ":")`) and refreshed with `grant_type=refresh_token` at the same URL.
        Client ids in use: GARMIN_CONNECT_MOBILE_ANDROID_DI_2025Q2 (newest), …_2024Q4, …_DI,
        GARMIN_CONNECT_MOBILE_IOS_DI. Sources: python-garminconnect `client.py:170-180`
        (constants), `client.py:1313-1376` (exchange), `client.py:1378-1416` (refresh);
        bpauli/gccli `internal/garminauth/di.go:15-28` (constants), `di.go:46-63` (exchange, one
        client id only — a service ticket is single-use), `di.go:69-110` (refresh),
        `di.go:161-172` (native headers). The token response carries `access_token`,
        `refresh_token`, `expires_in`, `refresh_token_expires_in` (`di.go:32-38`); the refresh-token
        TTL value is UNVERIFIED (server-side claim). The CLI stores only `access_token`,
        `refresh_token` and `client_id` (python-garminconnect `client.py:1504-1511`), never a
        password, in a 0600 file inside a 0700 directory written O_CREAT|O_EXCL|O_NOFOLLOW then
        atomically renamed (`client.py:1529-1552`).

      x-auth-key-url: https://sso.garmin.com/portal/sso/en-US/sign-in
      x-auth-vars:
        - name: GARMIN_ACCESS_TOKEN
          kind: per_call
          required: false
          sensitive: true
          description: An access token obtained elsewhere. Garmin issues no personal API key, so there is normally nothing to put here — run `auth login` instead. A token set here is used as-is, is never refreshed, and is not the account `auth status` reports for this home.
        - name: GARMIN_TOKEN
          kind: per_call
          required: false
          sensitive: true
          description: Same as GARMIN_ACCESS_TOKEN.
      x-auth-instructions: |
        Run `garmin-pp-cli auth login --email <your Garmin account email>`. It opens your browser at Garmin's sign-in page, catches the redirect back to a loopback port, exchanges the ticket for a token pair, and refuses to store a token whose account email does not match the one you named. Sign out of Garmin in the browser first if another household member has used it, and re-run `auth login` per account with that account's own GARMIN_HOME. There is no key to copy and paste: Garmin issues no personal API token, and the password is never seen by this CLI.
  parameters:
    DIBackend:
      name: DI-Backend
      in: header
      required: false
      schema:
        type: string
        enum: [connectapi.garmin.com]
      description: |
        Request header used only by Garmin's older cookie-based auth path. It is a header value, not a
        hostname to call, and it is not sent alongside a bearer token, so it has no default: the
        generated commands send it only when `--di-backend` is passed explicitly. Set it only if you
        are deliberately exercising that fallback.
    DisplayName:
      name: displayName
      in: path
      required: true
      schema:
        type: string
      description: The account's `displayName`, taken from `account social-profile` and URL-encoded. Garmin answers 403 when it is missing.
    StartDate:
      name: start
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DateString'
      description: Inclusive start date, YYYY-MM-DD.
    EndDate:
      name: end
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DateString'
      description: Inclusive end date, YYYY-MM-DD.
    DatePath:
      name: date
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DateString'
      description: Calendar date, YYYY-MM-DD.
    DateQuery:
      name: date
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DateString'
      description: Calendar date, YYYY-MM-DD.
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Numeric activity id, the `activityId` field of a row from `activities list`. Always a positive integer.

  responses:
    Unauthorized:
      description: The token is missing, expired, or was rejected by Garmin's data tier. Refresh it; if the refresh also fails, run `auth login` again. #369 class). Refresh, then re-login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Forbidden. Observed unauthenticated as `{"message":"HTTP 403 Forbidden","error":"ForbiddenException"}` (N131.0 auth research §4.2 probe D). Also the result of a literal `None` displayName in the path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    DateString:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      format: date
      description: Calendar date in YYYY-MM-DD form.
      examples: ['2026-09-01']

    FreeFormObject:
      type: object
