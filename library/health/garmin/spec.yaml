  /download-service/files/activity/{activityId}:
    get:
      operationId: activitiesDownloadOriginal
      tags:
        - activities
      summary: Download the original activity file for one activity
      description: |
        Fetches the original recorded file for one activity as a ZIP containing the device FIT file.
        This is the sanctioned export route for raw per-second data that the JSON endpoints do not
        expose. Binary response; write it to a file rather than parsing it.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: ZIP archive holding the original FIT file.
          content:
            # Measured against Garmin on 2026-09-14 (N131.5.5 F-2): this path
            # answers HTTP 406 NotAcceptableException to
            # `Accept: application/octet-stream` AND to `Accept:
            # application/zip`, and serves the ZIP to `Accept: */*` — the body
            # comes back as `Content-Type: application/x-zip-compressed`, which
            # is why neither concrete type matched. Declaring
            # */* beside application/zip is how the spec says so: the generated
            # response stays binary (any binary media type or string/binary
            # schema decides that), while the per-endpoint Accept override is
            # withheld because */* is not a concrete type — leaving the client's
            # own binary default, which is `*/*`.
            application/zip:
              schema:
                type: string
                format: binary
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
