      description: |
        The zone boundaries the account has configured, per sport. These are settings, not measurements:
        read them to label time-in-zone numbers, and expect them to change only when the user edits them
        or Garmin auto-detects a new threshold.
      x-pp-resource: heart_rate
  /usersummary-service/usersummary/daily/{displayName}:
    get:
      operationId: wellnessDailySummary
      tags:
        - wellness
      summary: Show the daily wellness summary for one date
      description: |
        The single-day roll-up: steps, floors, intensity minutes, calories, resting heart rate and
        stress. Check `includesWellnessData` before reading any wellness field — an account with no
        wearable returns the envelope with the series absent, not zeroes.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/DisplayName'
        - name: calendarDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateString'
      responses:
        '200':
          description: Daily summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-source:
