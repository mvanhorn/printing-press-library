openapi: 3.1.0
info:
  title: Garmin Connect (unofficial) — v1 endpoint set
  version: 0.1.0
  summary: Hand-authored OpenAPI 3.1 description of the Garmin Connect internal API paths used by the garmin-pp-cli spike.
  description: |
    Hand-written spec for the Printing Press (`cli-printing-press generate --spec`). Garmin publishes
    no OpenAPI document for Garmin Connect; every path here was read from maintained community
    clients (python-garminconnect `__init__.py` and `client.py`, matin/garth, tcgoetz/GarminDB,
    Pythe1337N/garmin-connect) on 2026-09-07. **Every path here was then executed against two live
    Garmin accounts on 2026-09-07 (36/36 and 37/37 rows HTTP 200); response *shapes* remain
    unverified wherever a schema says so.** Each operation carries an `x-source` extension citing
    the client file:line it was read from, and the operations confirmed by the live probe cite that
    probe too; response schemas carry `x-shape: partially-verified` or `unverified` wherever the client source does not
    show the keys and no live row settled them.

    ## Authentication (see `components.securitySchemes.bearer`)

    Data calls authenticate with `Authorization: Bearer <DI access token>`. The token is minted by
    exchanging a Garmin SSO service ticket at `POST https://diauth.garmin.com/di-oauth2-service/oauth/token`
    (form fields `client_id`, `service_ticket`, `grant_type=https://connectapi.garmin.com/di-oauth2-service/oauth/grant/service_ticket`,
    `service_url`; header `Authorization: Basic base64(client_id + ":")`) and later refreshed at the
    same URL with `grant_type=refresh_token`. The exchange and refresh live outside this spec's
    server (they target `diauth.garmin.com`, not `connectapi.garmin.com`) and are implemented by the
    CLI's `auth login` (loopback-redirect browser SSO) and `auth refresh`; they are not operations here.

    ## Required headers

    With a DI bearer token the data calls send only `Authorization: Bearer`, `Accept: application/json`
    and the native-app header set (`client.py:452-459` `get_api_headers` DI branch; gccli
    `internal/garminapi/client.go:89-91`). `DI-Backend: connectapi.garmin.com` belongs ONLY to
    python-garminconnect's JWT_WEB cookie fallback (`client.py:460-472`) and is NOT sent with a DI
    token (corrected 2026-09-07 after the spike's source-fidelity audit, finding SF-F1). The optional
    `DIBackend` parameter below is kept for that fallback only.

    ## Dates and windows

    All date parameters are `YYYY-MM-DD` strings. Range endpoints marked `x-max-window-days: 28`
    accept at most 28 calendar days per request; a caller walks longer ranges in 28-day windows
    (`start`, `start+27`), (`start+28`, `start+55`), … and merges the pages.

    ## `{displayName}`

    Several paths interpolate the account's `displayName`, read once from
    `GET /userprofile-service/socialProfile` (operation `getSocialProfile`). It is URL-encoded
    before entering the path.
  contact:
    name: garmin-pp-spike (N131)
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://connectapi.garmin.com
    description: Garmin Connect API tier (data calls). Token exchange/refresh use https://diauth.garmin.com and are not modelled here.

security:
  - bearer: []

tags:
  - name: account
    description: 'Bootstrap and identity: social profile, unit settings, and the account email a login is checked against.'
  - name: sleep
    description: Sleep score trends, server-aggregated nightly summaries, and full per-night detail.
  - name: fitness
    description: "Fitness level over time: VO2 max, max-met values, and Garmin's fitness-age estimate."
  - name: training
    description: Training status over a window and the daily training-readiness score.
  - name: heart-rate
    description: Configured heart-rate zones, daily heart-rate detail, and per-activity time in zone.
  - name: steps
    description: Daily and weekly step totals against the account's goal.
  - name: wellness
    description: 'Daily wellness roll-ups: the day summary, intensity minutes, resting heart rate, and hydration.'
  - name: activities
    description: The activity feed, per-activity detail and splits, lifetime breakdowns, and original file downloads.
paths:
  /userprofile-service/socialProfile:
    get:
      operationId: accountSocialProfile
      tags:
        - account
      summary: Show the signed-in account's social profile and displayName
      description: |
        Returns the account's public profile. The `displayName` field is the account key that several
        other Garmin paths interpolate, so this is the first call after a login and the cheapest way to
        confirm a stored token still works: a 401 or 403 here means the token was rejected by the data
        tier.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
      responses:
        '200':
          description: Social profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 856
          symbol: _load_social_profile
        - file: python-garminconnect/garminconnect/client.py
          line: 434
          symbol: _verify_token
      x-class: point

      x-pp-resource: account
  /userprofile-service/userprofile/user-settings:
    get:
      operationId: accountSettings
      tags:
        - account
      summary: Show account settings, including the measurement unit system
      description: |
        Returns the account's settings. Read this once per home to learn whether the account reports
        distances in metric or statute units before formatting any distance, pace or weight.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
      responses:
        '200':
          description: User settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 418-420
          symbol: garmin_connect_user_settings_url
        - file: python-garminconnect/garminconnect/__init__.py
          line: 3125-3130
          symbol: get_user_profile
      x-class: point

      x-pp-resource: account
  /sleep-service/stats/sleep/daily/{start}/{end}:
    get:
      operationId: sleepStats
      tags:
        - sleep
      summary: List server-aggregated daily sleep summaries for a date range
      description: |
        One row per night between `start` and `end`, aggregated by Garmin. At most 28 calendar days per
        request; `history` fills longer ranges into the local archive in 28-day windows, oldest day
        first, de-duplicating on the calendar date. Rows arrive under `individualStats`.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Sleep stats for the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepStatsRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 1938
          symbol: get_sleep_daily
      x-class: range
      x-max-window-days: 28

      x-pp-resource: sleep
      x-pp-syncable: false
  /wellness-service/stats/daily/sleep/score/{start}/{end}:
    get:
      operationId: sleepScoreStats
      tags:
        - sleep
      summary: List the nightly sleep score for a date range
      description: |
        The sleep score trend: one row per calendar date with the score value and qualifier. Cheaper
        than fetching per-night detail when the question is about a trend rather than one night. At most
        28 calendar days per request.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: One row per calendar date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SleepScoreDay'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: garth/src/garth/stats/sleep.py
          line: 12-15
          symbol: DailySleep
        - file: python-garminconnect/garminconnect/__init__.py
          line:
          note: not present (grep 2026-09-07)
      x-class: range
      x-max-window-days: 28

      x-pp-resource: sleep
      x-pp-syncable: false
  /wellness-service/wellness/dailySleepData/{displayName}:
    get:
      operationId: sleepNight
      tags:
        - sleep
      summary: Show full sleep detail for one night
      description: |
        Everything Garmin recorded for a single night: stage minutes, sleep windows, restlessness and
        the sleep-score breakdown. One request per night, so a trend question should use the range
        commands instead. This is the account-scoped path variant; `night-alt` is the same payload
        without the displayName in the path.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/DisplayName'
        - $ref: '#/components/parameters/DateQuery'
        - name: nonSleepBufferMinutes
          in: query
          required: false
          schema:
            type: integer
            default: 60
          description: Minutes of buffer around the sleep window. 60 is the value Garmin's own clients send.
      responses:
        '200':
          description: Sleep detail for the night ending on `date`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySleepData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 481
          symbol: garmin_connect_daily_sleep_url
        - file: python-garminconnect/garminconnect/__init__.py
          line: 1903-1917
          symbol: get_sleep_data
        - file: garth/src/garth/data/sleep.py
          line: 116
          symbol: SleepData.get
      x-class: per-day
      x-variant:
        group: sleep-detail
        role: primary
        alternate: getDailySleepAlt

      x-pp-resource: sleep
      x-pp-syncable: false
  /sleep-service/sleep/dailySleepData:
    get:
      operationId: sleepNightAlt
      tags:
        - sleep
      summary: Show full sleep detail for one night (path variant without displayName)
      description: |
        Identical payload to `night`, on the sleep-service path that takes the date as a query parameter.
        It needs no displayName, so it works before the bootstrap profile call has run, and it is the
        fallback if the account-scoped path ever changes.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: Sleep detail for the night ending on `date`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySleepData'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: garth/src/garth/data/daily_sleep_data.py
          line: 135
          symbol: DailySleepData.get
        - file: garmin-connect/src/garmin/UrlClass.ts
          line: 68-70
          symbol: DAILY_SLEEP
        - file: python-garminconnect/garminconnect/__init__.py
          line:
          note: not present (grep 2026-09-07)
      x-class: per-day
      x-variant:
        group: sleep-detail
        role: alternate
        primary: getDailySleep

      x-pp-resource: sleep
      x-pp-syncable: false
  /metrics-service/metrics/maxmet/daily/{start}/{end}:
    get:
      operationId: fitnessMaxMetrics
      tags:
        - fitness
      summary: List VO2 max and max-met values for a date range
      description: |
        Fitness-level trend: VO2 max, generic and cycling, plus Garmin's max-met value, one row per date.
        Only dates with a measurement appear; days without a qualifying activity are absent rather than
        zero. At most 28 calendar days per request.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Max-met rows for the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeFormObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 436
          symbol: garmin_connect_metrics_url
        - file: python-garminconnect/garminconnect/__init__.py
          line: 1474-1493
          symbol: get_max_metrics / get_max_metrics_range
      x-class: range
      x-max-window-days: 28
      x-max-window-days-note: UNVERIFIED for this path; applied by analogy with the usersummary stats endpoints.

      x-pp-resource: fitness
      x-pp-syncable: false
  /fitnessage-service/fitnessage/{date}:
    get:
      operationId: fitnessAge
      tags:
        - fitness
      summary: Show the fitness-age estimate for one date
      description: |
        Garmin's fitness-age estimate and the components it was computed from for a single date. There
        is no range form, so a fitness-age trend costs one request per day and is what the local archive
        exists for.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/DatePath'
      responses:
        '200':
          description: Fitness age data for the date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeFormObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 560
          symbol: garmin_connect_fitnessage
        - file: python-garminconnect/garminconnect/__init__.py
          line: 2250-2256
          symbol: get_fitnessage_data
      x-class: per-day

      x-pp-resource: fitness
      x-pp-syncable: false
  /mobile-gateway/usersummary/trainingstatus/latest/{end}:
    get:
      operationId: trainingStatus
      tags:
        - training
      summary: List daily training status ending on a date
      description: |
        Training status with acute and chronic load, for the days ending on the given date.
        The status values are productive, maintaining, unproductive, detraining and their siblings.
        Returns a page of days, not a single day; treat the end date as the anchor.
        Requires `--end`.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Training-status rows for the page ending on `end`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingStatusDay'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: garth/src/garth/stats/training_status/daily.py
          line: 35-38
          symbol: DailyTrainingStatus
        - file: python-garminconnect/garminconnect/__init__.py
          line:
          note: not present; pgc uses /metrics-service/metrics/trainingstatus/aggregated/{date} at line 532
      x-class: range
      x-max-window-days: 28

      x-pp-resource: training
      x-pp-syncable: false
  /metrics-service/metrics/trainingreadiness/{date}:
    get:
      operationId: trainingReadiness
      tags:
        - training
      summary: Show the training-readiness score for one date
      description: |
        Garmin's training-readiness score for a single date, with the inputs it was built from.
        Those inputs are sleep, recovery, HRV and acute load. One request per day; a readiness trend
        comes from the local archive, not from this endpoint.
        Requires `--date`.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - $ref: '#/components/parameters/DatePath'
      responses:
        '200':
          description: Training readiness entries for the date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FreeFormObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 525
          symbol: garmin_connect_training_readiness_url
        - file: python-garminconnect/garminconnect/__init__.py
          line: 2077-2083
          symbol: get_training_readiness
      x-class: per-day

      x-pp-resource: training
      x-pp-syncable: false
  /fitnessstats-service/activity:
    get:
      operationId: activitiesBreakdown
      tags:
        - activities
      summary: Summarise lifetime activity totals grouped by activity type
      description: |
        Server-side aggregation of every activity on the account into totals per parent activity type,
        by duration or distance. Answers 'what does this account actually do, and how much' in one
        request instead of paging the whole activity list.
      parameters:
        - $ref: '#/components/parameters/DIBackend'
        - name: startDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateString'
        - name: endDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateString'
        - name: aggregation
          in: query
          required: true
          schema:
            type: string
            enum: [lifetime]
            default: lifetime
        - name: groupByParentActivityType
          in: query
          required: true
          schema:
            type: boolean
            default: true
          description: Garmin expects the capitalised literal strings `True` and `False` here, not lowercase.
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [distance, duration, movingDuration, elevationGain]
            default: distance
      responses:
        '200':
          description: Aggregated totals per parent activity type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeFormObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-source:
        - file: python-garminconnect/garminconnect/__init__.py
          line: 559
          symbol: garmin_connect_fitnessstats
        - file: python-garminconnect/garminconnect/__init__.py
          line: 2713-2742
          symbol: get_progress_summary_between_dates
      x-class: range
      x-max-window-days-note: No 28-day chunking in any client read for this path; window limit UNVERIFIED.
      # startDate and endDate are required and carry no default, so the
      # synthesized example omitted them and printed a command that exits 2
      # with `required flag "start-date" not set` (N131.5.5 F-5). aggregation
      # is hidden and defaulted; an example should not teach it.
      x-pp-example: garmin-pp-cli activities breakdown --start-date 2026-01-01 --end-date 2026-06-30 --metric duration

      x-pp-resource: activities
