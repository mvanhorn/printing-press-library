version: 2
project_name: rakuten-travel-pp-cli
changelog:
  disable: true
builds:
  - id: rakuten-travel-pp-cli
    main: ./cmd/rakuten-travel-pp-cli
    binary: rakuten-travel-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/rakuten-travel/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: rakuten-travel-pp-mcp
    main: ./cmd/rakuten-travel-pp-mcp
    binary: rakuten-travel-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: rakuten-travel-pp-cli
    repository:
      owner: zjsng
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Inspect real Japan room offers with explicit dates, party and price units."
    install: |
      bin.install "rakuten-travel-pp-cli"
      bin.install "rakuten-travel-pp-mcp"
