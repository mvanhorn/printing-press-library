version: 2
project_name: ecbo-cloak-pp-cli
changelog:
  disable: true
builds:
  - id: ecbo-cloak-pp-cli
    main: ./cmd/ecbo-cloak-pp-cli
    binary: ecbo-cloak-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/ecbo-cloak/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ecbo-cloak-pp-mcp
    main: ./cmd/ecbo-cloak-pp-mcp
    binary: ecbo-cloak-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ecbo-cloak-pp-cli
    repository:
      owner: zjsng-trav
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Discover Japan luggage storage and inspect read-only source offers."
    install: |
      bin.install "ecbo-cloak-pp-cli"
      bin.install "ecbo-cloak-pp-mcp"
