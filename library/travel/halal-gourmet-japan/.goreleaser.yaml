version: 2
project_name: halal-gourmet-japan-pp-cli
changelog:
  disable: true
builds:
  - id: halal-gourmet-japan-pp-cli
    main: ./cmd/halal-gourmet-japan-pp-cli
    binary: halal-gourmet-japan-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/halal-gourmet-japan/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: halal-gourmet-japan-pp-mcp
    main: ./cmd/halal-gourmet-japan-pp-mcp
    binary: halal-gourmet-japan-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: halal-gourmet-japan-pp-cli
    repository:
      owner: zjsng
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Compare explicit food and prayer evidence across Japan with source dates and honest unknowns."
    install: |
      bin.install "halal-gourmet-japan-pp-cli"
      bin.install "halal-gourmet-japan-pp-mcp"
