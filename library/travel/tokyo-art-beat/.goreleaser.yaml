version: 2
project_name: tokyo-art-beat-pp-cli
changelog:
  disable: true
builds:
  - id: tokyo-art-beat-pp-cli
    main: ./cmd/tokyo-art-beat-pp-cli
    binary: tokyo-art-beat-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/tokyo-art-beat/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: tokyo-art-beat-pp-mcp
    main: ./cmd/tokyo-art-beat-pp-mcp
    binary: tokyo-art-beat-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# No verified Homebrew tap is configured; use the library installer or Go install.
