    LiveSearchRequest:
      type: object
      required:
      - origin_airport
      - destination_airport
      - departure_date
      - source
      properties:
        origin_airport:
          type: string
          description: The origin airport to search from.
        destination_airport:
          type: string
          description: The destination airport to search to.
        departure_date:
          type: string
          format: date
          description: Departure date to search, in YYYY-MM-DD format.
        source:
          $ref: '#/components/schemas/Source'
        disable_filters:
          type: boolean
          default: false
          description: Disables filters for dynamic pricing and mismatched airports. Where supported by
            the mileage program, this may also return mixed-cabin itineraries. Results with a computed
            mixed-cabin percentage include MixedCabinPct.
        show_dynamic_pricing:
          type: boolean
          default: false
          description: Disables only filters for dynamic pricing, but not for mismatched airports.
        smart_cache:
          type: boolean
          default: false
          description: When true, an eligible failed live search can return matching cached availability
            instead. The fallback preserves the requested source, airports, departure date, seat count,
            filter settings, and stored result identifiers. Cache-resolved responses do not create live
            provider billing records. Definitive unsupported-source or unsupported-route responses do
            not use the fallback. If no matching cached search exists, the original live-search error
            is returned.
        seat_count:
          type: integer
          default: 1
          minimum: 1
          maximum: 9
          description: Number of adult passengers to search for, between 1-9 seats.
    RefreshRequest:
      type: object
      required:
      - availability_ids
      properties:
        availability_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 250
          description: 1 to 250 availability object IDs, as returned by /search or /availability. Duplicates
            are ignored.
    RefreshResponse:
      type: object
      properties:
        items:
          type: array
          description: Per-item state for every requested ID.
          items:
            type: object
            properties:
              availability_id:
                type: string
              status:
                type: string
                description: 'Current state of this item: `queued` (queued by this call, one credit charged),
                  `processing` (still being refreshed), `succeeded` (the data was refreshed), `failed`
                  (the refresh did not complete; its credit was refunded, and the item can be re-queued
                  after a short cooldown), `fresh` (updated within the last 3 hours, nothing to do), `skipped_outage`
                  (the mileage program currently has an outage), `not_refreshable` (this program does
                  not support refreshing), `not_found` (unknown ID), or `insufficient_quota` (stale, but
                  beyond your remaining daily quota; not queued or charged, and can be re-submitted once
                  quota frees up or resets). Only `queued` costs a credit.'
              updated_at:
                type: string
                format: date-time
                description: The availability's current updated_at, when known (RFC 3339).
        queued:
          type: integer
          description: Items queued (and credits charged) by this call.
        refunded:
          type: integer
          description: Credits refunded by this call for newly detected failures.
        counts:
          type: object
          properties:
            processing:
              type: integer
              description: Items queued or in flight (includes items just queued).
            succeeded:
              type: integer
              description: Items whose data was updated.
            failed:
              type: integer
              description: Items whose refresh did not complete.
        complete:
          type: boolean
          description: True once no items are still processing; stop polling.
        quota:
          type: object
          description: Your daily API quota after this request. Refresh charges and refunds share the
            same pool as regular API calls.
          properties:
            limit:
              type: integer
              description: Total API calls allowed per UTC day.
            used:
              type: integer
              description: Calls consumed so far today, including refresh credits.
            remaining:
              type: integer
              description: Calls left today.
            reset_seconds:
              type: integer
              description: Seconds until the quota resets at UTC midnight.
    Destination:
      type: object
      properties:
        airport:
          type: string
          description: The IATA code on the other end of the route.
        economy:
          type: integer
          nullable: true
          description: Cheapest raw nonstop economy mileage price across all sources, or null if no nonstop
            economy availability.
        premium:
          type: integer
          nullable: true
          description: Cheapest raw nonstop premium economy mileage price across all sources, or null.
        business:
          type: integer
          nullable: true
          description: Cheapest raw nonstop business mileage price across all sources, or null.
        first:
          type: integer
          nullable: true
          description: Cheapest raw nonstop first class mileage price across all sources, or null.
    DestinationsResponse:
      type: object
      properties:
        origin_airport:
          type: string
          description: Echoes the requested origin. Present only when origin_airport was supplied.
        destination_airport:
          type: string
          description: Echoes the requested destination. Present only when destination_airport was supplied.
        destinations:
          type: array
          description: Reachable airports on the other end. Empty when the airport has no known nonstop
            routes.
          items:
            $ref: '#/components/schemas/Destination'
        success:
          type: boolean
      additionalProperties: true
paths:
  /search:
    get:
      operationId: cachedSearch
      summary: Cached search
      description: Search Seats.aero cached award availability between one or more origin and destination
        airports, across one or more mileage programs. This is the flagship cached-search endpoint behind
        seats.aero's own web app.
      tags:
      - availability
      x-pp-resource: awards
      x-happy-args: --origin-airport=JFK;--destination-airport=LHR;--cabins=business;--take=5
      parameters:
      - name: origin_airport
        in: query
        required: true
        description: A list of origin airports. Comma-delimited if multiple, such as "SFO,LAX".
        schema:
          type: string
      - name: destination_airport
        in: query
        required: true
        description: A list of destination airports. Comma-delimited if multiple, such as "FRA,LHR".
        schema:
          type: string
      - name: start_date
        in: query
        description: Results must depart between start_date and end_date when specified, in YYYY-MM-DD
          format.
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Results must depart between start_date and end_date when specified, in YYYY-MM-DD
          format.
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        description: A cursor you obtained from a previous search call.
        schema:
          type: integer
      - name: take
        in: query
        description: Maximum amount of results to respond with. Must be >= 10 and <= 1000.
        schema:
          type: integer
          default: 500
          minimum: 10
          maximum: 1000
      - name: skip
        in: query
        description: How many results to skip.
        schema:
          type: integer
      - name: order_by
        in: query
        description: By default, results are ordered by departure date and then by available cabins, with
          available premium cabins ranked above results without them available. You can alternatively
          specify lowest_mileage in this parameter to return results with the cheapest prices first.
        schema:
          type: string
          enum:
          - ''
          - lowest_mileage
      - name: include_trips
        in: query
        description: Include trip-level details in the API response. This may degrade response time and
          sizing.
        schema:
          type: boolean
          default: false
      - name: only_direct_flights
        in: query
        description: Only return results that have a direct flight available. Respects the cabin parameter
          if provided.
        schema:
          type: boolean
          default: false
      - name: carriers
        in: query
        description: Only return results involving these comma-separated carriers (i.e. "DL,AA"). Respects
          the cabin parameter if provided.
        schema:
          type: string
      - name: include_filtered
        in: query
        description: Return results that only have raw (filtered) results. Enable this when using the
          raw fields to prevent dynamic price filtering.
        schema:
          type: boolean
          default: false
      - name: sources
        in: query
        description: A list of mileage programs to filter by. Comma-delimited if multiple, such as "aeroplan,united".
        schema:
          type: string
      - name: minify_trips
        in: query
        description: When include_trips and minify_trips are both enabled, returns a reduced amount of
          fields in each trip to improve performance.
        schema:
          type: boolean
      - name: cabins
        in: query
        description: 'Results must have these cabins available when specified. Comma-delimited if multiple,
          such as "economy,business". Must not be provided if "cabin" was provided. Replaces the singular
          `cabin` parameter used on other endpoints: `cabin` is not accepted here.'
        schema:
          type: string
      - name: min_cabin_pct
        in: query
        description: Minimum percentage of each itinerary's distance that must be flown in its reported
          Cabin or a higher cabin. Must be a whole number from 0 to 100. For example, 75 permits up to
          25% of the journey in a lower cabin. Omit this parameter or set it to 100 to exclude itineraries
          with any distance below the reported Cabin.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
      responses:
        '200':
          description: Cached availability results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /availability:
    get:
      operationId: bulkAvailability
      summary: Bulk availability
      description: Retrieve a large amount of availability objects from one specific mileage program.
      tags:
      - availability
      x-happy-args: --source=aeroplan;--cabin=business;--take=5
      parameters:
      - name: source
        in: query
        required: true
        description: The mileage program to retrieve availability from.
        schema:
          $ref: '#/components/schemas/Source'
      - name: cabin
        in: query
        description: 'Only returns results with this cabin available. Must be one of: [economy, premium,
          business, first]'
        schema:
          $ref: '#/components/schemas/CabinClass'
      - name: start_date
        in: query
        description: Only returns results between start_date and end_date when specified.
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Only returns results between start_date and end_date when specified.
        schema:
          type: string
          format: date
      - name: origin_region
        in: query
        description: 'Only returns results originating in this region when specified. Must be one of:
          [North America, South America, Africa, Asia, Europe, Oceania]'
        schema:
          type: string
      - name: destination_region
        in: query
        description: 'Only returns results arriving in this region when specified. Must be one of: [North
          America, South America, Africa, Asia, Europe, Oceania]'
        schema:
          type: string
      - name: take
        in: query
        description: How many results to return. Must be >=10 and <= 1000 if specified, otherwise 500.
        schema:
          type: integer
          default: 500
          minimum: 10
          maximum: 1000
      - name: cursor
        in: query
        description: Cursor you retrieved from a previous availability response.
        schema:
          type: integer
      - name: skip
        in: query
        description: How many results to skip that you have already retrieved. Use this with the cursor
          to paginate responses.
        schema:
          type: integer
          default: 0
      - name: include_filtered
        in: query
        description: Return results that only have raw (filtered) results. Enable this when using the
          raw fields to prevent dynamic price filtering.
        schema:
          type: boolean
          default: false
      - name: min_cabin_pct
        in: query
        description: Minimum percentage of each itinerary's distance that must be flown in its reported
          Cabin or a higher cabin. Must be a whole number from 0 to 100. For example, 75 permits up to
          25% of the journey in a lower cabin. Omit this parameter or set it to 100 to exclude itineraries
          with any distance below the reported Cabin.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
      responses:
        '200':
          description: Bulk availability results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /trips/{id}:
    get:
      operationId: getTrip
      summary: Get trip
      description: Retrieve flight-level information from an Availability object by its revalidation/trip
        ID from search or availability results.
      tags:
      - trips
      x-happy-args: <id>=3Afa4uutcjPPE5SMS1ihQ2n1YRd
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the availability object.
        schema:
          type: string
      - name: include_filtered
        in: query
        description: Include expensive dynamically-priced results that may have been filtered out.
        schema:
          type: boolean
          default: false
      - name: min_cabin_pct
        in: query
        description: Minimum percentage of each itinerary's distance that must be flown in its reported
          Cabin or a higher cabin. Must be a whole number from 0 to 100. For example, 75 permits up to
          25% of the journey in a lower cabin. Omit this parameter or set it to 100 to exclude itineraries
          with any distance below the reported Cabin.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
      responses:
        '200':
          description: Trip details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
  /routes:
    x-resource-id: ID
    get:
      operationId: getRoutes
      summary: Get routes
      description: Get all origin-destination routes tracked for a mileage program.
      tags:
      - routes
      x-pp-pagination: none
      x-happy-args: --source=aeroplan
      parameters:
      - name: source
        in: query
        required: true
        description: The mileage program to list tracked routes for.
        schema:
          $ref: '#/components/schemas/Source'
      responses:
        '200':
          description: Route list. Returned as a bare JSON array of every tracked route for the source
            in one response (no pagination) -- this can be tens of thousands of rows for some programs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
  /destinations:
    get:
      operationId: getDestinations
      summary: Get destinations
      description: Returns the airports reachable from (or to) a single airport, along with the cheapest
        raw nonstop mileage price per cabin, aggregated across every source. Only direct/nonstop itineraries
        are considered; connecting prices are excluded. Supply exactly one of origin_airport or destination_airport.
        A cabin with no nonstop availability is returned as null (never 0).
      tags:
      - destinations
      x-happy-args: --origin-airport=JFK
      parameters:
      - name: origin_airport
        in: query
        description: Origin IATA code (3 letters). When supplied, the response lists reachable destinations
          and their cheapest nonstop price. Provide either this or destination_airport, not both. Metro/alias
          codes are expanded automatically.
        schema:
          type: string
      - name: destination_airport
        in: query
        description: Destination IATA code (3 letters). When supplied, the response lists origin airports
          from which this airport is reachable nonstop, and their cheapest price. Provide either this
          or origin_airport, not both. Metro/alias codes are expanded automatically.
        schema:
          type: string
      responses:
        '200':
          description: Nonstop reachability fan-out from (or to) the requested airport.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationsResponse'
  /refresh:
    post:
      operationId: refreshAvailability
      summary: Refresh cached data
      description: Use this endpoint to refresh old cached data. Pro API keys only; commercial-agreement
        keys cannot use /refresh (use /live). Credit-metered -- the response quota block shows remaining
        refreshes.
      tags:
      - refresh
      x-live-dogfood-requires-tier: refresh-credits
      x-happy-stdin: '{"availability_ids":["3Afa4uutcjPPE5SMS1ihQ2n1YRd"]}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Per-ID refresh status plus remaining daily quota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
  /live:
    post:
      operationId: liveSearch
      summary: Live search
      description: Commercial-agreement API keys only; Pro keys receive 403 -- do not retry. 5-15 s latency.
      tags:
      - live
      x-pp-mutation: false
      x-live-dogfood-requires-tier: commercial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveSearchRequest'
      responses:
        '200':
          description: Live search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSearchResponse'
