        results:
          type: array
          items:
            $ref: '#/components/schemas/LiveSearchResult'
        bookingLinks:
          type: array
          items:
            $ref: '#/components/schemas/BookingLink'
        success:
          type: boolean
        cached:
          type: boolean
          nullable: true
          description: True when an opted-in request (smart_cache) was resolved from cached availability
