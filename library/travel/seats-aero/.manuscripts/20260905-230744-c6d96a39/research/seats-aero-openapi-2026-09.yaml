      - aeroplan
      - alaska
      - velocity
      - qantas
      - connectmiles
      - azul
      - smiles
      - flyingblue
      - jetblue
      - qatar
      - turkish
      - singapore
      - ethiopian
      - saudia
      - finnair
      - lufthansa
      - frontier
      - spirit
      description: Mileage program source identifier (26 programs tracked by the Partner API).
    CabinClass:
      type: string
      enum:
      - economy
      - premium
      - business
      - first
    Route:
      type: object
      properties:
        ID:
          type: string
        OriginAirport:
          type: string
        OriginRegion:
          type: string
        DestinationAirport:
          type: string
        DestinationRegion:
          type: string
        Distance:
          type: integer
        Source:
