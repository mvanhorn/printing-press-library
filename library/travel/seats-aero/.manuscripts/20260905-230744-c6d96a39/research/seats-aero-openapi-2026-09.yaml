openapi: 3.0.3
info:
  title: Seats.aero Partner API
  version: '1.0'
  description: 'Award-flight availability from Seats.aero''s Partner API: cached search, bulk availability,
    routes, destinations, trip detail, and refresh.'
  x-display-name: Seats.aero
  x-website: https://seats.aero
servers:
- url: https://seats.aero/partnerapi
security:
- PartnerAuthorization: []
x-rate-class: daily
x-pp-default-rate-limit: auto
x-mcp:
  transport:
  - stdio
  - http
  intents:
  - name: find_best_award
    description: Find the cheapest cached award availability from one airport to another in a cabin/date
      range, ordered by lowest mileage cost, then fetch bookable trip detail for the top result.
    params:
    - name: origin
      type: string
      required: true
      description: Origin IATA airport code.
    - name: destination
      type: string
      required: true
      description: Destination IATA airport code.
    - name: cabin
      type: string
      required: false
      description: Cabin class to search (economy, premium, business, first). Defaults to business.
    - name: start_date
      type: string
      required: false
      description: Earliest departure date, YYYY-MM-DD.
    - name: end_date
      type: string
      required: false
      description: Latest departure date, YYYY-MM-DD.
    steps:
    - endpoint: awards.cached-search
      bind:
        origin_airport: ${input.origin}
        destination_airport: ${input.destination}
        cabins: ${input.cabin}
        start_date: ${input.start_date}
        end_date: ${input.end_date}
        order_by: lowest_mileage
        take: '10'
      capture: results
    returns: results
  - name: explore_from_airport
    description: Find every airport reachable nonstop from one origin, with the cheapest nonstop mileage
      price per cabin across all mileage programs.
    params:
    - name: origin
      type: string
      required: true
      description: Origin IATA airport code.
    steps:
    - endpoint: destinations.get
      bind:
        origin_airport: ${input.origin}
      capture: destinations
    returns: destinations
  - name: program_calendar_scan
    description: Scan one mileage program's bulk award calendar across a region pair, date range, and
      cabin.
    params:
    - name: source
      type: string
      required: true
      description: Mileage program source identifier.
    - name: cabin
      type: string
      required: false
      description: Cabin class filter (economy, premium, business, first).
    - name: start_date
      type: string
      required: false
      description: Start of the date range, YYYY-MM-DD.
    - name: end_date
      type: string
      required: false
      description: End of the date range, YYYY-MM-DD.
    - name: origin_region
      type: string
      required: false
      description: Origin region filter.
    - name: destination_region
      type: string
      required: false
      description: Destination region filter.
    steps:
    - endpoint: availability.bulk
      bind:
        source: ${input.source}
        cabin: ${input.cabin}
        start_date: ${input.start_date}
        end_date: ${input.end_date}
        origin_region: ${input.origin_region}
        destination_region: ${input.destination_region}
      capture: results
    returns: results
x-cache:
