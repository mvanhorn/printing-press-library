        NumDaysOut:
          type: integer
          nullable: true
          description: How many days out this route is currently tracked/observed. Present on /routes
            rows and on the nested Route inside search/availability results.
      additionalProperties: true
    Coordinates:
      type: object
      properties:
        Lat:
          type: number
        Lon:
          type: number
    BookingLink:
      type: object
