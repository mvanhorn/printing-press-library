version: 2
project_name: traveloka-pp-cli
changelog:
  disable: true
builds:
  - id: traveloka-pp-cli
    main: ./cmd/traveloka-pp-cli
    binary: traveloka-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/traveloka/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: traveloka-pp-mcp
    main: ./cmd/traveloka-pp-mcp
    binary: traveloka-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: traveloka-pp-cli
    repository:
      owner: jet-sng
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Research dated flights and hotel stays with source price bases, complete itineraries and comparable quote snapshots."
    install: |
      bin.install "traveloka-pp-cli"
      bin.install "traveloka-pp-mcp"
