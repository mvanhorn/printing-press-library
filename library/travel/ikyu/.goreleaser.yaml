version: 2
project_name: ikyu-pp-cli
changelog:
  disable: true
builds:
  - id: ikyu-pp-cli
    main: ./cmd/ikyu-pp-cli
    binary: ikyu-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/ikyu/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ikyu-pp-mcp
    main: ./cmd/ikyu-pp-mcp
    binary: ikyu-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ikyu-pp-cli
    repository:
      owner: zjsng
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library/tree/main/library/travel/ikyu"
    description: "Find the room and plan that make a Japan stay worthwhile."
    install: |
      bin.install "ikyu-pp-cli"
      bin.install "ikyu-pp-mcp"
