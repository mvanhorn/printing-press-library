version: 2
project_name: yamato-pp-cli
changelog:
  disable: true
builds:
  - id: yamato-pp-cli
    main: ./cmd/yamato-pp-cli
    binary: yamato-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/yamato/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: yamato-pp-mcp
    main: ./cmd/yamato-pp-mcp
    binary: yamato-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: yamato-pp-cli
    repository:
      owner: zjsng
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Plan Japan luggage forwarding with source rates, calendar deadlines and acceptance evidence."
    install: |
      bin.install "yamato-pp-cli"
      bin.install "yamato-pp-mcp"
