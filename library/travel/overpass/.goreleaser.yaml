version: 2
project_name: overpass-pp-cli
changelog:
  disable: true
builds:
  - id: overpass-pp-cli
    main: ./cmd/overpass-pp-cli
    binary: overpass-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/overpass/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: overpass-pp-mcp
    main: ./cmd/overpass-pp-mcp
    binary: overpass-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: overpass-pp-cli
    repository:
      owner: justinwfu
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Find things worth photographing by name instead of by OpenStreetMap tag, with automatic failover across Overpass mirrors."
    install: |
      bin.install "overpass-pp-cli"
      bin.install "overpass-pp-mcp"
