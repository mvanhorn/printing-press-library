version: 2
project_name: thepointsguy-pp-cli
changelog:
  disable: true
builds:
  - id: thepointsguy-pp-cli
    main: ./cmd/thepointsguy-pp-cli
    binary: thepointsguy-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/thepointsguy/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: thepointsguy-pp-mcp
    main: ./cmd/thepointsguy-pp-mcp
    binary: thepointsguy-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: thepointsguy-pp-cli
    repository:
      owner: megumikuo
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "The first CLI and local database for The Points Guy: search every article, look up any card's real terms, and turn points valuations into answers you can script."
    install: |
      bin.install "thepointsguy-pp-cli"
      bin.install "thepointsguy-pp-mcp"
