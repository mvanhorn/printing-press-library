version: 2
project_name: asoview-pp-cli
changelog:
  disable: true
builds:
  - id: asoview-pp-cli
    main: ./cmd/asoview-pp-cli
    binary: asoview-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/asoview/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: asoview-pp-mcp
    main: ./cmd/asoview-pp-mcp
    binary: asoview-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: asoview-pp-cli
    repository:
      owner: zjsng-trav
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Discover and compare Japan leisure tickets with explicit price units, terms and public dated availability."
    install: |
      bin.install "asoview-pp-cli"
      bin.install "asoview-pp-mcp"
