version: 2
project_name: wanderlog-pp-cli
changelog:
  disable: true
builds:
  - id: wanderlog-pp-cli
    main: ./cmd/wanderlog-pp-cli
    binary: wanderlog-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/wanderlog/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: wanderlog-pp-mcp
    main: ./cmd/wanderlog-pp-mcp
    binary: wanderlog-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: wanderlog-pp-cli
    repository:
      owner: zjsng
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Clone shared Wanderlog plans into editable trips, then mine guides and places for agent-ready planning."
    install: |
      bin.install "wanderlog-pp-cli"
      bin.install "wanderlog-pp-mcp"
