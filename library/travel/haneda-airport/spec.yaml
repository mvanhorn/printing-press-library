name: haneda-airport
description: First-party Haneda Airport public flight boards and published schedules.
version: 0.1.0
base_url: https://www.tokyo-haneda.com
spec_source: sniffed
auth:
  type: none
  header: ''
  format: ''
  env_vars: []
config:
  format: toml
  path: ~/.config/haneda-airport-pp-cli/config.toml
resources:
  source:
    description: Raw read-only public source shapes; use domain flights, catalog and
      schedule commands for planning.
    endpoints:
      schedule-domestic-arrivals:
        method: GET
        path: /app_resource/flight/data/dms/hdacfasc.json
        description: Read the raw first-party schedule-domestic-arrivals JSON source.
        params: []
        body: []
        response:
          type: array
          item: HdacfascJsonFlightInfo
        pagination: null
        response_path: flight_info
        mutation: false
      schedule-international-arrivals:
        method: GET
        path: /app_resource/flight/data/int/hdacfasc.json
        description: Read the raw first-party schedule-international-arrivals JSON
          source.
        params: []
        body: []
        response:
          type: array
          item: HdacfascJsonFlightInfo2
        pagination: null
        response_path: flight_info
        mutation: false
      schedule-domestic-departures:
        method: GET
        path: /app_resource/flight/data/dms/hdacfdsc.json
        description: Read the raw first-party schedule-domestic-departures JSON source.
        params: []
        body: []
        response:
          type: array
          item: HdacfdscJsonFlightInfo
        pagination: null
        response_path: flight_info
        mutation: false
      schedule-international-departures:
        method: GET
        path: /app_resource/flight/data/int/hdacfdsc.json
        description: Read the raw first-party schedule-international-departures JSON
          source.
        params: []
        body: []
        response:
          type: array
          item: HdacfdscJsonFlightInfo2
        pagination: null
        response_path: flight_info
        mutation: false
      board:
        method: POST
        path: /en/app/api/v2/flight/search
        description: Read the raw first-party board JSON source.
        params: []
        body:
        - name: airlineCodes
          type: array
          required: false
          positional: false
          default: []
          description: ''
          fields: []
          flag_name: airline-codes
        - name: airportCodes
          type: array
          required: false
          positional: false
          default: []
          description: ''
          fields: []
          flag_name: airport-codes
        - name: arrivalType
          type: int
          required: false
          positional: false
          default: 1
          description: 'Provider arrivalType: 1 departure, 2 arrival.'
          fields: []
          flag_name: direction-code
        - name: exactMatch
          type: bool
          required: false
          positional: false
          default: false
          description: ''
          fields: []
          flag_name: exact-match
        - name: flightNumber
          type: string
          required: false
          positional: false
          default: ''
          description: ''
          fields: []
          flag_name: flight-number
        - name: flightType
          type: int
          required: false
          positional: false
          default: 2
          description: 'Provider flightType: 1 domestic, 2 international.'
          fields: []
          flag_name: kind-code
        - name: searchDt
          type: string
          required: true
          positional: false
          default: null
          description: JST service date in YYYYMMDD.
          fields: []
          flag_name: search-date
          format: date
        - name: status
          type: array
          required: false
          positional: false
          default:
          - 0
          description: ''
          fields: []
          flag_name: status-codes
        request_content_type: application/json
        response:
          type: array
          item: SearchFlightlist
        pagination: null
        response_path: flightlists
        mutation: false
        happy_args: --search-date=20261003
        example: '  haneda-airport-pp-cli source board --search-date 20261003 --limit
          5 --agent'
      disruption-summary:
        method: GET
        path: /en/app_resource/flight/flightStatus/flight_status.json
        description: Read the raw first-party disruption-summary JSON source.
        params: []
        body: []
        response:
          type: object
          item: FlightStatusJson
        pagination: null
        mutation: false
      airports-domestic:
        method: GET
        path: /site_resource/flight/data/dms/city_list_search.json
        description: Read the raw first-party airports-domestic JSON source.
        params: []
        body: []
        response:
          type: object
          item: CityListSearchJson
        pagination: null
        mutation: false
      airports-international:
        method: GET
        path: /site_resource/flight/data/int/city_list_search.json
        description: Read the raw first-party airports-international JSON source.
        params: []
        body: []
        response:
          type: object
          item: CityListSearchJson2
        pagination: null
        mutation: false
      airlines-domestic:
        method: GET
        path: /site_resource/flight/data/dms/company_list_search.json
        description: Read the raw first-party airlines-domestic JSON source.
        params: []
        body: []
        response:
          type: object
          item: CompanyListSearchJson
        pagination: null
        mutation: false
      airlines-international:
        method: GET
        path: /site_resource/flight/data/int/company_list_search.json
        description: Read the raw first-party airlines-international JSON source.
        params: []
        body: []
        response:
          type: object
          item: CompanyListSearchJson2
        pagination: null
        mutation: false
