category: travel
cli_description: Query first-party Haneda flight boards with precise dates, codeshares
  and terminal handoffs.
http_transport: standard
health_check_path: /site_resource/flight/data/dms/company_list_search.json
cache:
  enabled: false
mcp:
  transport:
  - stdio
  endpoint_tools: hidden
learn:
  ticker_patterns:
  - ^[A-Z0-9]{2}[0-9]{1,4}$
  - ^[A-Z]{3}$
  synonyms:
    cancelled: canceled
    departures: departure
    arrivals: arrival
  entity_lookup_seeds:
    airport:
    - canonical: HND
      aliases:
      - Haneda
      - 羽田
      - Tokyo Haneda
    - canonical: CTS
      aliases:
      - SPK
      - 札幌
      - 新千歳
      - Sapporo
      - New Chitose
    - canonical: KIX
      aliases:
      - 大阪関西
      - Kansai
    - canonical: SIN
      aliases:
      - Singapore
      - シンガポール
    airline:
    - canonical: ANA
      aliases:
      - NH
    - canonical: JAL
      aliases:
      - JL
    terminal:
    - canonical: T1
      aliases:
      - Terminal 1
      - 第1ターミナル
    - canonical: T2
      aliases:
      - Terminal 2
      - 第2ターミナル
    - canonical: T3
      aliases:
      - Terminal 3
      - 第3ターミナル
