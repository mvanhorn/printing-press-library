name: smartex
description: Read-only smartEX Shinkansen fares, products, deadlines, luggage and booking handoff
version: 0.1.0
category: travel
base_url: https://smart-ex.jp
health_check_path: /en/product/plan/service/
auth:
  type: none
learn:
  disabled: true
resources:
  reference:
    description: Fresh official public reference pages; extracted links and metadata
    endpoints:
      service:
        method: GET
        path: /en/product/plan/service/
        base_url: https://smart-ex.jp
        description: Extract official service source metadata and relevant links
        response_format: html
        html_extract:
          mode: links
          link_prefixes: [/en/product, /en/reservation, /en/entraining, /en/info]
        response:
          type: object
      booking-window:
        method: GET
        path: /en/reservation/useful/accept_time/
