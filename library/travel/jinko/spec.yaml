components:
  schemas:
    AddProductRequest:
      properties:
        attributes:
          additionalProperties: true
          type: object
        domain:
          $ref: "#/components/schemas/ProductDomain"
        reference_id:
          type: string
        snapshot:
          additionalProperties: true
          type: object
      required:
        - domain
      type: object
    AddProductResponse:
      properties:
        product_id:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
      type: object
    AdviceQuantiles:
      properties:
        max_fare:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: MaxFare is the highest fare seen for this route (in display currency)
        min_fare:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: MinFare is the lowest fare seen for this route (in display currency)
        percentile_25:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Percentile25 is the 25th percentile fare (in display currency)
        percentile_50:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Percentile50 is the median fare (in display currency)
        percentile_75:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Percentile75 is the 75th percentile fare (in display currency)
      type: object
    Amount:
      properties:
        currency:
          description: Currency code (ISO 4217)
          type: string
        decimal_places:
          description: |-
            Number of decimal places for this currency
            Common values: 2 for USD/EUR/GBP, 0 for JPY/KRW, 3 for BHD/KWD
          maximum: 4
          minimum: 0
          type: integer
        value:
          description: |-
            Value in smallest currency unit (e.g., cents for USD, yen for JPY)
            Example: 120.34 EUR = 12034, 1000 JPY = 1000
          type: integer
      required:
        - currency
      type: object
    AmountInfo:
      properties:
        currency:
          type: string
        decimal_places:
          type: integer
        value:
          type: integer
      type: object
    Ancillary:
      properties:
        applicable_pax_types:
          description: nil = all pax types
          items:
            type: string
          type: array
        assistance_details:
          $ref: "#/components/schemas/AssistanceDetails"
        baggage_details:
          allOf:
            - $ref: "#/components/schemas/BaggageDetails"
          description: Type-specific details (only the relevant one is populated)
        category:
          allOf:
            - $ref: "#/components/schemas/AncillaryCategory"
          description: BAGGAGE, SEAT, MEAL, ...
        description:
          description: optional longer description
          type: string
        journey_ref_id:
          description: '"outward", "return", nil = all'
          type: string
        label:
          description: human-readable, e.g. "1 bag - 23kg"
          type: string
        max_quantity:
          description: Constraints
          type: integer
        meal_details:
          $ref: "#/components/schemas/MealDetails"
        mutually_exclusive:
          description: conflicting offer_ids
          items:
            type: string
          type: array
        offer_id:
          description: Identity
          type: string
        price:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Pricing
        provider_metadata:
          additionalProperties:
            type: string
          description: Provider-specific opaque data — passed through to booking
          type: object
        scope:
          allOf:
            - $ref: "#/components/schemas/AncillaryScope"
          description: Scope — defines who/what this applies to
        seat_details:
          $ref: "#/components/schemas/SeatDetails"
        segment_ref_ids:
          description: nil = all segments
          items:
            type: string
          type: array
      type: object
    AncillaryCategory:
      enum:
        - BAGGAGE
        - SEAT
        - MEAL
        - CABIN_BAG_UPGRADE
        - SPORTS_EQUIPMENT
        - PRIORITY_BOARDING
        - SPECIAL_ASSISTANCE
        - INSURANCE
        - LOUNGE
        - FREQUENT_FLYER
        - OTHER
      type: string
      x-enum-varnames:
        - AncillaryCategoryBaggage
        - AncillaryCategorySeat
        - AncillaryCategoryMeal
        - AncillaryCategoryCabinBagUpgrade
        - AncillaryCategorySportsEquipment
        - AncillaryCategoryPriorityBoarding
        - AncillaryCategorySpecialAssistance
        - AncillaryCategoryInsurance
        - AncillaryCategoryLounge
        - AncillaryCategoryFrequentFlyer
        - AncillaryCategoryOther
    AncillaryOffer:
      properties:
        description:
          type: string
        label:
          type: string
        max_quantity:
          type: integer
        offer_id:
          type: string
        per_pax:
          type: boolean
        price_per_unit:
          $ref: "#/components/schemas/DevPlatformMoney"
        type:
          description: '"bag" | "seat" | "meal" | "assistance" | ...'
          type: string
      type: object
    AncillaryRequest:
      properties:
        selections:
          items:
            $ref: "#/components/schemas/SelectedAncillary"
          type: array
        trip_id:
          type: string
      required:
        - trip_id
      type: object
    AncillaryResponse:
      properties:
        quoted_item_id:
          type: integer
        selected_ancillaries:
          items:
            $ref: "#/components/schemas/SelectedAncillary"
          type: array
        total_with_ancillaries:
          $ref: "#/components/schemas/Money"
        trip_id:
          type: string
      type: object
    AncillaryScope:
      enum:
        - PER_PAX_PER_SEGMENT
        - PER_PAX_PER_JOURNEY
        - PER_PAX_PER_BOOKING
        - PER_BOOKING
      type: string
      x-enum-varnames:
        - AncillaryScopePerPaxPerSegment
        - AncillaryScopePerPaxPerJourney
        - AncillaryScopePerPaxPerBooking
        - AncillaryScopePerBooking
    AssignOrgAdminRequest:
      properties:
        workos_user_id:
          type: string
      required:
        - workos_user_id
      type: object
    AssistanceDetails:
      properties:
        description:
          description: e.g. "Wheelchair to aircraft cabin seat"
          type: string
        ssr_code:
          description: WCHR, WCHS, WCHC, BLND, DEAF
          type: string
      type: object
    AuditEntry:
      properties:
        action:
          type: string
        actor_id:
          type: string
        details:
          type: string
        timestamp:
          type: string
      type: object
    AuthorizationType:
      enum:
        - payment_intent
        - checkout_session
        - refund
      type: string
      x-enum-varnames:
        - AuthorizationTypePaymentIntent
        - AuthorizationTypeCheckoutSession
        - AuthorizationTypeRefund
    BaggageDetails:
      properties:
        dimensions:
          type: string
        pieces:
          type: integer
        weight_kg:
          type: integer
        weight_lb:
          type: integer
      type: object
    BaggageInfo:
      properties:
        description:
          description: Description for display
          type: string
        id:
          description: Unique identifier (required for purchasable options)
          type: string
        is_included:
          description: Whether baggage is included in fare
          type: boolean
        journey_id:
          description: Journey this applies to (if journey-specific)
          type: string
        pieces:
          description: Number of pieces
          type: integer
        price_per_bag:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Price per bag
        segment_id:
          description: Segment this applies to (if segment-specific)
          type: string
        total_price:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Total price
        weight:
          description: Weight per piece
          type: number
        weight_unit:
          description: Weight unit (KG, LB, or PC)
          type: string
      type: object
    CabinType:
      enum:
        - economy
        - premium_economy
        - business
        - first
      type: string
      x-enum-varnames:
        - CabinTypeEconomy
        - CabinTypePremiumEconomy
        - CabinTypeBusiness
        - CabinTypeFirst
    CancellationDetails:
      properties:
        cancellation_id:
          type: string
        cancelled_at:
          type: string
        initiated_by:
          type: string
        reason:
          type: string
        refund_amount:
          $ref: "#/components/schemas/Money"
      type: object
    CarrierInfo:
      properties:
        code:
          description: Airline code (IATA or ICAO)
          type: string
        is_lcc:
          description: Whether the airline is a low-cost carrier
          type: boolean
        logo:
          description: URL to the airline logo
          type: string
        name:
          description: Airline name
          type: string
      type: object
    CarryOnBaggage:
      properties:
        description:
          description: Description for display
          type: string
        dimensions:
          description: Dimensions of the carry-on bag (e.g., "25 x 33 x 20 cm")
          type: string
        pieces:
          description: Number of carry-on pieces allowed
          type: integer
        weight:
          description: Weight limit per piece
          type: number
        weight_unit:
          description: Weight unit (KG or LB)
          type: string
      type: object
    CartCreateRequest:
      properties:
        metadata:
          additionalProperties: true
          type: object
        payment_type:
          $ref: "#/components/schemas/PaymentType"
        platform:
          $ref: "#/components/schemas/CartPlatform"
        session_id:
          type: string
        source:
          $ref: "#/components/schemas/CartSource"
        tenant:
          type: string
        user_id:
          type: string
      required:
        - platform
        - session_id
        - source
