openapi: 3.0.0
info:
  contact: {}
  title: ""
  version: ""
servers:
  - url: https://mcp-bff.gojinko.com
    description: Production
  - url: https://mcp-bff.dev.gojinko.com
    description: Development
paths:
  "/api/v1/devplatform/admin/users/{id}/role":
    patch:
      description: Update the role of a devplatform user (admin only)
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        description: New role
        required: true
      responses:
        "200":
          description: id and role
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Update a user's role
      tags:
        - devplatform_admin
  "/api/v1/devplatform/admin/users/{id}/topup":
    post:
      description: Add credits to a user's rate limit balance (admin only)
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
        description: Top-up amount
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Top up user credits
      tags:
        - devplatform_admin
  /api/v1/devplatform/keys/validate:
    post:
      description: Validate an API key without incrementing rate limit counter
        (public, no auth required)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyKeyRequest"
        description: API key to validate
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyKeyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Validate an API key without consuming quota
      tags:
        - devplatform_keys
  /api/v1/devplatform/keys/verify:
    post:
      description: Verify an API key and increment rate limit counter (public, no auth
        required)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyKeyRequest"
        description: API key to verify
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyKeyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Verify an API key
      tags:
        - devplatform_keys
  /api/v1/devplatform/orgs:
    get:
      description: List all devplatform organizations (admin only)
      responses:
        "200":
          description: orgs array
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List all organizations
      tags:
        - devplatform_orgs
    post:
      description: Create a new devplatform organization (admin only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
        description: Organization creation payload
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Create an organization
      tags:
        - devplatform_orgs
  "/api/v1/devplatform/orgs/{id}":
    get:
      description: Get organization details by ID (org_admin or admin)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Get an organization
      tags:
        - devplatform_orgs
  "/api/v1/devplatform/orgs/{id}/admins":
    patch:
      description: Assign a user as admin of an organization by WorkOS ID (admin only)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignOrgAdminRequest"
        description: WorkOS user ID to assign as admin
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Assign an org admin
      tags:
        - devplatform_orgs
  "/api/v1/devplatform/orgs/{id}/partner-keys":
    post:
      description: Create a partner API key that can be used to create shadow users
        (admin only)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartnerKeyRequest"
        description: Partner key name
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Create a partner API key for an organization
      tags:
        - devplatform_orgs
  "/api/v1/devplatform/orgs/{id}/users":
    get:
      description: List all users belonging to an organization (org_admin or admin)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: users array
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List users in an organization
      tags:
        - devplatform_orgs
    post:
      description: Create a shadow user that can later be claimed by a real identity
        (partner key or admin auth)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShadowUserRequest"
        description: Shadow user details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Create a shadow user in an organization
      tags:
        - devplatform_orgs
  "/api/v1/devplatform/orgs/{id}/users/{user_id}/keys/{key_id}":
    delete:
      description: Revoke an API key for a specific user in an organization (org_admin
        or admin)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: integer
        - description: User ID
          in: path
          name: user_id
          required: true
          schema:
            type: integer
        - description: API Key ID
          in: path
          name: key_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: message
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Revoke a user's API key within an organization
      tags:
        - devplatform_orgs
  /api/v1/devplatform/users:
    get:
      description: List all users or filter by status (pending, active, suspended).
        Admin only.
      parameters:
        - description: Filter by status (pending, active, suspended)
          in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: users array
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List devplatform users
      tags:
        - devplatform_users
    post:
      description: Create a new developer platform user (admin only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        description: User creation payload
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Create a new devplatform user
      tags:
        - devplatform_users
  "/api/v1/devplatform/users/{workos_id}/approve":
    patch:
      description: Approve a pending devplatform user by WorkOS ID (admin only)
      parameters:
        - description: WorkOS User ID
          in: path
          name: workos_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Approve a pending user
      tags:
        - devplatform_users
  "/api/v1/devplatform/users/{workos_id}/keys/resolve":
    get:
      description: Resolve the active API key for a user by WorkOS ID (admin only)
      parameters:
        - description: WorkOS User ID
          in: path
          name: workos_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListItem"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Resolve active API key for a user
      tags:
        - devplatform_keys
  /api/v1/devplatform/users/me:
    get:
      description: Get the devplatform user profile for the authenticated JWT user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Get current authenticated user
      tags:
        - devplatform_users
  /api/v1/devplatform/users/me/claim:
    post:
      description: Link a real WorkOS identity to an existing shadow user account.
        Email is taken from JWT, not request body.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Claim a shadow user account
      tags:
        - devplatform_users
  /api/v1/devplatform/users/me/keys:
    get:
      description: List all API keys for the authenticated user
      responses:
        "200":
          description: keys array
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List API keys
      tags:
        - devplatform_keys
    post:
      description: Create a new API key for the authenticated user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
        description: Key creation payload
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Create a new API key
      tags:
        - devplatform_keys
  "/api/v1/devplatform/users/me/keys/{id}":
    delete:
      description: Revoke an API key by ID for the authenticated user
      parameters:
        - description: API Key ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: message
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Revoke an API key
      tags:
        - devplatform_keys
  /api/v1/devplatform/users/me/register:
    post:
      description: Self-register a new devplatform account using the authenticated JWT
        identity
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                name:
                  type: string
              type: object
        description: Registration payload (email required)
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Register a new developer account
      tags:
        - devplatform_users
  /api/v1/devplatform/users/me/usage:
    get:
      description: Get API usage and rate limit statistics for the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Get API usage statistics
      tags:
        - devplatform_users
  /api/v1/devplatform/users/status:
    post:
      description: Check whether a devplatform user exists and their current status
        (public, no auth)
      requestBody:
        content:
          application/json:
            schema:
              properties:
                workos_user_id:
                  type: string
              type: object
        description: WorkOS user ID
        required: true
      responses:
        "200":
          description: id, workos_user_id, status
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Check user status by WorkOS ID
      tags:
        - devplatform_users
  /api/v1/flights/check:
    post:
      description: Check a flight offer from search results to get confirmed
        availability and detailed fare options
      parameters:
        - description: Target a specific provider (sabre, travelfusion). When omitted, all
            enabled providers are called.
          in: query
          name: provider
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightCheckRequest"
        description: Flight check request
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightCheckResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Check flight availability and get detailed pricing
      tags:
        - flights
  /api/v1/flights/destination-search:
    post:
      description: Search for destination cities with cheapest flight options based on
        filter criteria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationSearchRequest"
        description: Destination search request
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationSearchResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Search destinations by flight criteria
      tags:
        - flights
  /api/v1/flights/refund-check:
    post:
      description: Check whether a flight booking is eligible for a refund and get the
        refund amount
      parameters:
        - description: Target a specific provider (sabre, travelfusion). When omitted,
            uses request body provider field.
          in: query
          name: provider
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundCheckRequest"
        description: Refund check request
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundCheckResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Check flight refund eligibility
      tags:
        - flights
  /api/v1/flights/search:
    post:
      description: Search flights with filter-based criteria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightSearchRequest"
        description: Flight search request
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightSearchResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Search flights (synchronous, filter-based)
      tags:
        - flights
  /api/v1/hotels/semantic-search:
    post:
      description: Search hotels with a natural-language query (e.g. "beach
      requestBody:
        content:
          application/json:
