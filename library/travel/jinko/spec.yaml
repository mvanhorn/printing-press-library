          description: >-
            QuotedCartID is the ID of the most recent quoted cart for this cart.

            Nil when no quote has been scheduled yet. Required by callers that need

            to invoke /fulfillment/schedule, which expects both cart_id and

            quoted_cart_id in its request body.
