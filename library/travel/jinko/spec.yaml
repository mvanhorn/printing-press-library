            (e.g. ["facility_ids", "min_star_rating"]). Absent if none.
          items:
            type: string
          type: array
        soft_filters_applied:
          description: |-
            SoftFiltersApplied lists which soft filters were evaluated on the
            response (e.g. ["max_price", "refundable_only"]). Absent if none.
          items:
            type: string
          type: array
        strict_matches:
          description: |-
            StrictMatches is the number of hotels with AT LEAST ONE rate that
            passes every soft filter the LLM extracted.
          type: integer
        total_returned:
          description: |-
            TotalReturned is the number of hotels in the response after hard
            filters but before any soft-filter consideration.
          type: integer
