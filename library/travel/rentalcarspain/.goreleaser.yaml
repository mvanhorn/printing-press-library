version: 2
project_name: rentalcarspain-pp-cli
changelog:
  disable: true
builds:
  - id: rentalcarspain-pp-cli
    main: ./cmd/rentalcarspain-pp-cli
    binary: rentalcarspain-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/rentalcarspain/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: rentalcarspain-pp-mcp
    main: ./cmd/rentalcarspain-pp-mcp
    binary: rentalcarspain-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: rentalcarspain-pp-cli
    repository:
      owner: zetabytelab
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Watch Málaga car-rental prices the way you already do — DoYouSpain's cheapest supplier, cross-checked direct, always with full insurance — now in one command with local price history and drop alerts."
    install: |
      bin.install "rentalcarspain-pp-cli"
      bin.install "rentalcarspain-pp-mcp"
