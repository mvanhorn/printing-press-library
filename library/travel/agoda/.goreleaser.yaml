version: 2
project_name: agoda-pp-cli
changelog:
  disable: true
builds:
  - id: agoda-pp-cli
    main: ./cmd/agoda-pp-cli
    binary: agoda-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/travel/agoda/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: agoda-pp-mcp
    main: ./cmd/agoda-pp-mcp
    binary: agoda-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: agoda-pp-cli
    repository:
      owner: devacto
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Search Agoda hotels with the true all-in price, and re-rank by what you will actually pay."
    install: |
      bin.install "agoda-pp-cli"
      bin.install "agoda-pp-mcp"
