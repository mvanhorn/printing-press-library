version: 2
project_name: tag-helpdesk-pp-cli
changelog:
  disable: true
builds:
  - id: tag-helpdesk-pp-cli
    main: ./cmd/tag-helpdesk-pp-cli
    binary: tag-helpdesk-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/project-management/tag-helpdesk/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: tag-helpdesk-pp-mcp
    main: ./cmd/tag-helpdesk-pp-mcp
    binary: tag-helpdesk-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: tag-helpdesk-pp-cli
    repository:
      owner: andreampiovesana
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Odoo 18 CE helpdesk ticket management for tag.msg.it. Connects to the Odoo XML-RPC external API at /xmlrpc/2/common..."
    install: |
      bin.install "tag-helpdesk-pp-cli"
      bin.install "tag-helpdesk-pp-mcp"
