version: 2
project_name: redmine-pp-cli
changelog:
  disable: true
builds:
  - id: redmine-pp-cli
    main: ./cmd/redmine-pp-cli
    binary: redmine-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/project-management/redmine/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: redmine-pp-mcp
    main: ./cmd/redmine-pp-mcp
    binary: redmine-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: redmine-pp-cli
    repository:
      owner: yosimasu
      name: homebrew-tap
    homepage: "https://github.com/yosimasu/redmine-pp-cli"
    description: "Every Redmine feature, plus a local mirror that finally answers the cross-project questions the Roadmap page never could."
    install: |
      bin.install "redmine-pp-cli"
      bin.install "redmine-pp-mcp"
