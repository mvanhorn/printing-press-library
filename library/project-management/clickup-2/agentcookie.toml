# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "clickup-pp-cli"
display_name = "ClickUp"
description = "Every ClickUp endpoint, plus a local SQLite mirror with full-text search and cross-task analytics no other ClickUp CLI ships."
project_kind = "cli"

[secrets.file]
path = "~/.config/clickup-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
CLICKUP_API_TOKEN = true
CLICKUP_TOKEN = true
