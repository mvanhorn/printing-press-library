version: 2
project_name: stac-pp-cli
changelog:
  disable: true
builds:
  - id: stac-pp-cli
    main: ./cmd/stac-pp-cli
    binary: stac-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/maps/stac/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: stac-pp-mcp
    main: ./cmd/stac-pp-mcp
    binary: stac-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: stac-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//stac-pp-cli"
    description: "The first Go single-binary STAC CLI: every search filter the Python tools have, plus an offline cache, scene ranking, coverage, and asset resolution no other STAC tool offers."
    install: |
      bin.install "stac-pp-cli"
      bin.install "stac-pp-mcp"
