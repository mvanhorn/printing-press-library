version: 2
project_name: cloudflare-pp-cli
changelog:
  disable: true
builds:
  - id: cloudflare-pp-cli
    main: ./cmd/cloudflare-pp-cli
    binary: cloudflare-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X cloudflare-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: cloudflare-pp-mcp
    main: ./cmd/cloudflare-pp-mcp
    binary: cloudflare-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: cloudflare-pp-cli
    repository:
      owner: alex-osti
      name: homebrew-tap
    homepage: "https://github.com/alex-osti/cloudflare-pp-cli"
    description: "The unified Cloudflare CLI agents and operators both want — every product covered, with offline cache,..."
    install: |
      bin.install "cloudflare-pp-cli"
      bin.install "cloudflare-pp-mcp"
