# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "wpengine-pp-cli"
display_name = "WP Engine"
description = "Every WP Engine Hosting Platform API operation, plus a local fleet mirror that answers cross-account audit questions the portal cannot."
project_kind = "cli"

[secrets.file]
path = "~/.config/wpengine-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
WP_ENGINE_API_PASSWORD = true
WP_ENGINE_API_USERNAME = false
