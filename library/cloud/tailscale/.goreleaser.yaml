version: 2
project_name: tailscale-pp-cli
changelog:
  disable: true
builds:
  - id: tailscale-pp-cli
    main: ./cmd/tailscale-pp-cli
    binary: tailscale-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/cloud/tailscale/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: tailscale-pp-mcp
    main: ./cmd/tailscale-pp-mcp
    binary: tailscale-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: tailscale-pp-cli
    repository:
      owner: cathrynlavery
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Tailscale admin from the terminal, with safe route and policy edits an agent can plan before it writes."
    install: |
      bin.install "tailscale-pp-cli"
      bin.install "tailscale-pp-mcp"
