# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "tailscale-pp-cli"
display_name = "Tailscale"
description = "Tailscale admin from the terminal, with safe route and policy edits an agent can plan before it writes."
project_kind = "cli"

[secrets.file]
path = "~/.config/tailscale-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
TAILSCALE_API_KEY = true
