version: 2
project_name: servosity-msp-cli
changelog:
  disable: true
builds:
  - id: servosity-msp-cli
    main: ./cmd/servosity-msp-cli
    binary: servosity-msp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X servosity-msp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: servosity-msp-mcp
    main: ./cmd/servosity-msp-mcp
    binary: servosity-msp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: servosity-msp-cli
    repository:
      owner: servosity
      name: homebrew-tap
    homepage: "https://github.com/servosity/servosity-msp-cli"
    description: "Servosity REST API surface available to authenticated MSP partners."
    install: |
      bin.install "servosity-msp-cli"
      bin.install "servosity-msp-mcp"
