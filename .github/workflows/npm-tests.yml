name: npm package tests

# npm-publish.yml runs `npm test` only after a version tag lands, so a broken
# test script used to surface as a failed publish. Run the same steps on PRs.

on:
  pull_request:
    paths:
      - '.github/workflows/npm-tests.yml'
      - 'npm/**'

permissions:
  contents: read

concurrency:
  group: npm-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Keep in step with npm-publish.yml so this proves what publish will run.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: npm/package-lock.json

      - name: Install dependencies
        working-directory: npm
        run: npm ci

      - name: Test
        working-directory: npm
        run: npm test
