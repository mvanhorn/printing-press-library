name: Update per-CLI release ledger

# Assigns per-CLI release versions after library changes merge to main. This
# keeps CHANGELOG.md, .printing-press-release.json, and the compiled runtime
# version in sync without making contributors manually bump 233 independent
# CLIs or fight changelog conflicts in feature PRs.
#
# Source of truth: tools/release-ledger/main.go.
# `go run` is given that file alone, so the module resolver lives in it too.

on:
  push:
    branches: [main]
    paths:
      - 'library/**'
      - 'tools/release-ledger/**'
      - '.github/scripts/push-generated-artifact/**'
      - '.github/workflows/update-cli-release-ledger.yml'
  workflow_dispatch:
    inputs:
      changed_from:
        description: 'Base ref/sha to diff from'
        required: false
      changed_to:
        description: 'Head ref/sha to diff to'
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  update:
    name: Update and commit
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      ref: ${{ steps.targets.outputs.ref }}
      pushed: ${{ steps.commit.outputs.pushed }}
    # Keep release-ledger runs serialized because push.sh rebases but cannot
    # recover rebase conflicts or recompute CalVer versions. GitHub permits
    # only one pending run per group: a newer push can evict a pending sibling,
    # and this workflow's own ledger push can self-evict a pending run too.
    # Each successful ledger commit records the logical commit processed
    # through; a later surviving run starts from that low-water mark and
    # replays every first-parent commit after it, so either eviction is recoverable.
    concurrency:
      group: update-cli-release-ledger-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.ADMIN_PUSH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Pin CI Go to .go-version
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_CHANGED_FROM: ${{ inputs.changed_from }}
          MANUAL_CHANGED_TO: ${{ inputs.changed_to }}
        run: |
          set -euo pipefail

          release_subject='chore(releases): update CLI release ledger [skip ci]'
          low_water_mark=''
          legacy_release_commit=''
          while IFS=$'\t' read -r release_commit release_subject_candidate; do
            if [ "$release_subject_candidate" != "$release_subject" ]; then
              continue
            fi
            if [ -z "$legacy_release_commit" ]; then
              legacy_release_commit="$release_commit"
            fi
            marker="$(git show -s --format=%B "$release_commit" | awk '/^Processed through: / { sub(/^Processed through: /, ""); print; exit }')"
            if [[ "$marker" =~ ^[0-9a-fA-F]{40}$ ]] && git cat-file -e "$marker^{commit}" 2>/dev/null; then
              low_water_mark="$marker"
              break
            fi
          done < <(git log --first-parent --format='%H%x09%s')
          if [ -z "$low_water_mark" ] && [ -n "$legacy_release_commit" ]; then
            # Older bot commits predate the marker; their first parent is the
            # closest available representation of the already-processed tip.
            low_water_mark="$(git rev-parse "$legacy_release_commit^")"
          fi

          changed_from="$low_water_mark"
          changed_to="$EVENT_SHA"
          # Explicit workflow_dispatch inputs are independent escape hatches
          # for repairing or replaying a deliberately chosen range.
          if [ -n "$MANUAL_CHANGED_FROM" ]; then
            changed_from="$MANUAL_CHANGED_FROM"
          fi
          if [ -n "$MANUAL_CHANGED_TO" ]; then
            changed_to="$MANUAL_CHANGED_TO"
          fi
          if [ -z "$changed_from" ] || [ "$changed_from" = "0000000000000000000000000000000000000000" ]; then
            changed_from="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          if [ -z "$changed_to" ]; then
            changed_to="$(git rev-parse HEAD)"
          fi
          changed_from="$(git rev-parse "$changed_from^{commit}")"
          changed_to="$(git rev-parse "$changed_to^{commit}")"

          commits="$(go run ./tools/release-ledger/main.go \
            --list-first-parent \
            --changed-from "$changed_from" \
            --changed-to "$changed_to")"

          {
            echo "changed_from=$changed_from"
            echo "changed_to=$changed_to"
            echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commits<<EOF"
            echo "$commits"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Run release-ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMITS: ${{ steps.meta.outputs.commits }}
          RELEASED_AT: ${{ steps.meta.outputs.released_at }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_COMMITS" ]; then
            echo "No first-parent commits to process."
            exit 0
          fi

          while IFS= read -r changed_to; do
            [ -z "$changed_to" ] && continue
            changed_from="$(git rev-parse "$changed_to^")"
            pr_number="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${changed_to}/pulls" \
              --jq '.[0].number // ""' 2>/dev/null || true)"
            pr_title="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${changed_to}/pulls" \
              --jq '.[0].title // ""' 2>/dev/null || true)"
            pr_url="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${changed_to}/pulls" \
              --jq '.[0].html_url // ""' 2>/dev/null || true)"
            if [ -z "$pr_title" ]; then
              pr_title="$(git log -1 --pretty=%s "$changed_to")"
            fi

            args=(
              --changed-from "$changed_from"
              --changed-to "$changed_to"
              --released-at "$RELEASED_AT"
              --source-commit "$changed_to"
              --change-title "$pr_title"
            )
            if [ -n "$pr_number" ]; then
              args+=(--change-pr "$pr_number")
            fi
            if [ -n "$pr_url" ]; then
              args+=(--change-url "$pr_url")
            fi
            go run ./tools/release-ledger/main.go "${args[@]}"
          done <<< "$RELEASE_COMMITS"
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- library; then
            echo "No release-ledger changes; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library
          git commit \
            -m "chore(releases): update CLI release ledger [skip ci]" \
            -m "Processed through: ${{ steps.meta.outputs.changed_to }}"
          # A sibling writer can land after a rebase but before the push.
          # Retry the complete fetch/rebase/push sequence.
          bash .github/scripts/push-generated-artifact/push.sh main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Select CLIs to rebuild
        id: targets
        env:
          CHANGED_FROM: ${{ steps.meta.outputs.changed_from }}
          CHANGED_TO: ${{ steps.meta.outputs.changed_to }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          set -euo pipefail
          # Stamped CLIs plus any whose build inputs changed without a stamp
          # (the ledger skips deletion-only changes).
          {
            if [ "$PUSHED" = "true" ]; then
              git diff-tree --no-commit-id --name-only -r HEAD -- 'library/*/*/.printing-press-release.json'
            fi
            if [ -n "$CHANGED_FROM" ] && [ -n "$CHANGED_TO" ]; then
              git diff --name-only "$CHANGED_FROM" "$CHANGED_TO" -- \
                'library/*/*/cmd/*' 'library/*/*/internal/*' 'library/*/*/go.mod' 'library/*/*/go.sum' 'library/*/*/manifest.json'
            fi
          } | awk -F/ 'NF >= 3 { print $2 "/" $3 }' | sort -u > "$RUNNER_TEMP/targets"
          targets=$(while IFS= read -r target; do
            # Nested modules (library/ai/v0/vzero) have no catalog-root go.mod.
            # Normal CLIs still resolve to library/<cat>/<slug>.
            module_dir="$(bash tools/release-ledger/resolve-module-dir.sh "library/${target}")"
            if [ -f "${module_dir}/go.mod" ]; then
              printf '%s ' "$target"
            fi
          done < "$RUNNER_TEMP/targets")
          echo "targets=${targets% }" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CLIs to rebuild at $(git rev-parse HEAD): ${targets:-none}"

  # The ledger commit is [skip ci], and anything triggered by the merge commit
  # runs before the version is stamped (issue #1908), so build and index from
  # the ledger commit here. A separate job so "Re-run failed jobs" replays it.
  dispatch:
    name: Rebuild CLIs and regenerate the registry
    needs: update
    if: needs.update.outputs.targets != '' || needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGETS: ${{ needs.update.outputs.targets }}
          BUILD_REF: ${{ needs.update.outputs.ref }}
          PUSHED: ${{ needs.update.outputs.pushed }}
        run: |
          set -uo pipefail
          failed=0
          dispatch() {
            for attempt in 1 2 3; do
              gh workflow run "$@" && return 0
              echo "::warning::gh workflow run $* failed (attempt ${attempt}/3)"
              sleep $((attempt * 10))
            done
            echo "::error::Could not dispatch: gh workflow run $*"
            failed=1
          }
          read -r -a targets <<< "$TARGETS"
          # Stay under build-mcpb.yml's 42-CLI-per-run limit.
          for ((i = 0; i < ${#targets[@]}; i += 40)); do
            batch="${targets[*]:i:40}"
            echo "Dispatching build-mcpb.yml at ${BUILD_REF} for: ${batch}"
            dispatch build-mcpb.yml --ref main -f cli="${batch}" -f ref="${BUILD_REF}"
          done
          if [ "$PUSHED" = "true" ]; then
            dispatch generate-registry.yml --ref main
          fi
          exit "$failed"
