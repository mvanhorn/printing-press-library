name: Backfill release checksums

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be published without uploading'
        type: boolean
        default: true
      source:
        description: 'Add source-commit and source-tree lines to existing checksums.txt files instead. Run only while no build-mcpb.yml run is queued or in progress. It infers that one build produced every asset from upload times, which release metadata cannot prove.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The source backfill reads each release's tree from history.
          fetch-depth: 0
      - name: Publish missing checksums.txt or source lines
        env:
          # GITHUB_TOKEN cannot write releases in this repo; see build-mcpb.yml.
          GH_TOKEN: ${{ secrets.RELEASE_WRITE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          args=(--repo "${GITHUB_REPOSITORY}" --all-missing)
          if [ "${SOURCE}" = "true" ]; then
            args=(--repo "${GITHUB_REPOSITORY}" --all-missing-source)
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/release-checksums/release_checksums.py "${args[@]}"
