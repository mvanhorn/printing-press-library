name: Build CLI release artifacts

# Builds cross-platform release artifacts for printed CLIs and publishes them
# under a moving `<slug>-current` tag. Each release contains:
#   - .mcpb bundles for Claude Desktop (3 platforms: darwin/arm64, windows/amd64, windows/arm64)
#   - raw CLI binaries for terminal users (6 platforms: standard Go matrix)
#
# The README in each CLI links to releases/download/<slug>-current/<asset>,
# so each release rebuilds and the URLs stay stable forever.
#
# Triggers (workflow_dispatch only):
#   - update-cli-release-ledger.yml dispatches this after its ledger commit, for
#     every CLI it stamped, so binaries report the released version. Building
#     on the merge-commit push compiled the previous version (issue #1908).
#
# Auth: requires GENERATOR_READ_TOKEN (fine-grained PAT with Contents:read on
# mvanhorn/cli-printing-press) so the bundle job can `go install` the
# cli-printing-press generator from a private repo. The build-cli job doesn't
# need it — printed CLIs only depend on public Go modules.

on:
  workflow_dispatch:
    inputs:
      cli:
        description: 'CLIs to rebuild as space-separated <category>/<slug> (at most 42)'
        required: true
      ref:
        description: 'Commit SHA to build (default: the dispatched ref)'
        required: false

permissions:
  contents: write  # for creating/updating releases

env:
  # The ledger passes its own commit so a sibling merge landing on main before
  # this run starts is not built under the previous version.
  BUILD_REF: ${{ inputs.ref || github.sha }}

jobs:
  detect:
    name: Detect affected CLIs
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
      - id: detect
        name: Determine affected CLIs
        env:
          INPUT_CLI: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full commit SHA, got '${BUILD_REF}'."
            exit 1
          fi
          read -r -a targets <<< "$INPUT_CLI"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::No CLI target provided. Specify a target with cli=<category>/<slug>, for example cli=media-and-entertainment/substack."
            exit 1
          fi
          # build-cli runs each target on 6 platforms and a matrix caps at 256 jobs.
          if [ "${targets[0]}" = "all" ] || [ "${#targets[@]}" -gt 42 ]; then
            echo "::error::At most 42 CLIs per run (GitHub Actions' 256-job matrix limit across 6 platforms). Split the list into batches."
            exit 1
          fi
          for target in "${targets[@]}"; do
            if [[ ! "$target" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]] || [ ! -d "library/$target" ]; then
              echo "::error::Unknown CLI target '${target}'. Expected a path like media-and-entertainment/substack under library/."
              exit 1
            fi
          done
          affected=$(printf '%s\n' "${targets[@]}" | sort -u | jq -R . | jq -s -c .)
          # Filter out empty/null entries
          affected=$(printf '%s' "$affected" | jq -c '[ .[] | select(. != null and . != "") ]')
          count=$(printf '%s' "$affected" | jq 'length')
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Affected CLIs ($count): $affected"

  bundle:
    name: Bundle ${{ matrix.target }} (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
        platform:
          # Scoped to platforms Claude Desktop actually runs on. Intel Macs
          # dropped because Apple Silicon dominates the install base; Linux
          # dropped because Claude Desktop doesn't ship there at all (Linux
          # Claude Code users have the focused skill path instead of MCPB).
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    concurrency:
      # Cancel in-flight bundles when a newer push for the same (cli, platform)
      # lands. The newer source supersedes the older, so completing the older
      # build would just produce assets we'd overwrite seconds later.
      group: bundle-${{ matrix.target }}-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Locate module-dir resolver
        run: |
          set -euo pipefail
          # BUILD_REF is the source checkout and can predate this helper.
          # Read the helper from the workflow revision (GITHUB_SHA) into a
          # separate git dir. Do not use the copy in the source tree: an
          # older commit does not have it, and a caller must not be able to
          # swap it by checking out a different ref. If the workflow revision
          # has no helper, leave the path empty. The next step then uses the
          # catalog root, which is the right directory for a root-module CLI.
          dest="${RUNNER_TEMP}/resolve-module-dir.sh"
          rm -f "$dest"
          work="${RUNNER_TEMP}/workflow-rev.git"
          rm -rf "$work"
          git init --bare "$work" >/dev/null
          url="$(git remote get-url origin)"
          if git --git-dir="$work" fetch --no-tags --depth=1 "$url" "$GITHUB_SHA" \
            && git --git-dir="$work" cat-file -e "${GITHUB_SHA}:tools/release-ledger/resolve-module-dir.sh"; then
            git --git-dir="$work" show "${GITHUB_SHA}:tools/release-ledger/resolve-module-dir.sh" > "$dest"
          fi
          if [ -s "$dest" ]; then
            echo "RESOLVE_MODULE_DIR_SH=${dest}" >> "$GITHUB_ENV"
          else
            echo "RESOLVE_MODULE_DIR_SH=" >> "$GITHUB_ENV"
          fi
      - name: Resolve Go module directory
        id: module
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          catalog="library/${CLI_TARGET}"
          if [ -n "${RESOLVE_MODULE_DIR_SH:-}" ]; then
            module_dir="$(bash "$RESOLVE_MODULE_DIR_SH" "$catalog")"
          else
            module_dir="$catalog"
          fi
          # Normal CLIs keep library/<cat>/<slug>/go.sum. A nested module
          # (library/ai/v0/vzero) has the sum next to its go.mod.
          echo "gosum=${module_dir}/go.sum" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: ${{ steps.module.outputs.gosum }}
      - name: Pin CI Go to .go-version
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Configure git for private modules
        env:
          TOKEN: ${{ secrets.GENERATOR_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GENERATOR_READ_TOKEN secret is not set. The workflow needs a fine-grained PAT with Contents:read on mvanhorn/cli-printing-press."
            exit 1
          fi
          git config --global url."https://oauth2:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install cli-printing-press
        env:
          GOPRIVATE: github.com/mvanhorn/*
        run: |
          go install github.com/mvanhorn/cli-printing-press/v4/cmd/cli-printing-press@latest
          cli-printing-press --version
      - name: Bundle MCPB
        env:
          CLI_TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cli_dir="library/${CLI_TARGET}"
          os="${PLATFORM%/*}"
          arch="${PLATFORM#*/}"
          slug=$(basename "${CLI_TARGET}")
          # Set artifact-name env vars unconditionally so the upload step
          # always has valid values, even when we early-exit below.
          # "__" after the slug is the delimiter. A hyphen matches other CLIs
          # that share this slug as a prefix (github / github-contents).
          # "_" is not a legal slug character. The release asset filename
          # below is unchanged.
          echo "SLUG=${slug}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${os}-${arch}" >> "$GITHUB_ENV"
          if [ ! -f "${cli_dir}/manifest.json" ]; then
            echo "::warning::${cli_dir} has no manifest.json — skipping bundle (likely pre-v3.0.0; needs regen via printing-press-publish)."
            exit 0
          fi
          out="${RUNNER_TEMP}/out/${slug}-pp-mcp-${os}-${arch}.mcpb"
          mkdir -p "$(dirname "$out")"
          cli-printing-press bundle "$cli_dir" --platform "${PLATFORM}" --output "$out"
          ls -lh "$out"
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcpb-${{ env.SLUG }}__${{ env.PLATFORM_TAG }}
          path: ${{ runner.temp }}/out/*.mcpb
          if-no-files-found: ignore
          retention-days: 7

  build-cli:
    name: Build CLI ${{ matrix.target }} (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
        # Standard Go cross-compile matrix. Linux included because terminal
        # users on servers/CI want it; the MCPB matrix above is narrower
        # because Claude Desktop doesn't ship on Linux.
        platform:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    concurrency:
      group: build-cli-${{ matrix.target }}-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Locate module-dir resolver
        run: |
          set -euo pipefail
          # BUILD_REF is the source checkout and can predate this helper.
          # Read the helper from the workflow revision (GITHUB_SHA) into a
          # separate git dir. Do not use the copy in the source tree: an
          # older commit does not have it, and a caller must not be able to
          # swap it by checking out a different ref. If the workflow revision
          # has no helper, leave the path empty. The next step then uses the
          # catalog root, which is the right directory for a root-module CLI.
          dest="${RUNNER_TEMP}/resolve-module-dir.sh"
          rm -f "$dest"
          work="${RUNNER_TEMP}/workflow-rev.git"
          rm -rf "$work"
          git init --bare "$work" >/dev/null
          url="$(git remote get-url origin)"
          if git --git-dir="$work" fetch --no-tags --depth=1 "$url" "$GITHUB_SHA" \
            && git --git-dir="$work" cat-file -e "${GITHUB_SHA}:tools/release-ledger/resolve-module-dir.sh"; then
            git --git-dir="$work" show "${GITHUB_SHA}:tools/release-ledger/resolve-module-dir.sh" > "$dest"
          fi
          if [ -s "$dest" ]; then
            echo "RESOLVE_MODULE_DIR_SH=${dest}" >> "$GITHUB_ENV"
          else
            echo "RESOLVE_MODULE_DIR_SH=" >> "$GITHUB_ENV"
          fi
      - name: Resolve Go module directory
        id: module
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          catalog="library/${CLI_TARGET}"
          if [ -n "${RESOLVE_MODULE_DIR_SH:-}" ]; then
            module_dir="$(bash "$RESOLVE_MODULE_DIR_SH" "$catalog")"
          else
            module_dir="$catalog"
          fi
          echo "dir=${module_dir}" >> "$GITHUB_OUTPUT"
          echo "gosum=${module_dir}/go.sum" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: ${{ steps.module.outputs.gosum }}
      - name: Pin CI Go to .go-version
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Build CLI binary
        env:
          CLI_TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          MODULE_DIR: ${{ steps.module.outputs.dir }}
        run: |
          set -euo pipefail
          cli_dir="library/${CLI_TARGET}"
          os="${PLATFORM%/*}"
          arch="${PLATFORM#*/}"
          slug=$(basename "${CLI_TARGET}")
          # cli_name is the authoritative binary name. Reading it from
          # .printing-press.json keeps this step honest when a CLI's directory
          # basename and cli_name diverge (e.g. an abbreviated slug paired
          # with a longer spec-derived binary name). Falling back to the
          # derived form preserves behavior for entries whose manifest
          # predates this field. See PR #455 / issue #688 for the jira case
          # this prevents.
          cli_name=$(jq -er '.cli_name' "${cli_dir}/.printing-press.json" 2>/dev/null || printf '%s-pp-cli' "${slug}")
          echo "SLUG=${slug}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${os}-${arch}" >> "$GITHUB_ENV"
          ext=""
          if [ "$os" = "windows" ]; then
            ext=".exe"
          fi
          out="${RUNNER_TEMP}/out/${slug}-pp-cli-${os}-${arch}${ext}"
          mkdir -p "$(dirname "$out")"
          # A catalog root with no go.mod keeps the module one directory down
          # (library/ai/v0/vzero). Normal CLIs resolve to the catalog root.
          cd "$MODULE_DIR"
          # CGO_ENABLED=0 — printed CLIs use the pure-Go modernc/sqlite driver
          # so cross-compile works without C toolchains. Matches the goreleaser
          # config the CLI ships with.
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w' \
            -o "$out" "./cmd/${cli_name}"
          ls -lh "$out"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ env.SLUG }}__${{ env.PLATFORM_TAG }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Release ${{ matrix.target }}
    needs: [detect, bundle, build-cli]
    # !cancelled() so a single CLI's bundle/build failure doesn't cascade-skip
    # release for every other successful CLI in the same matrix run. Each
    # release matrix entry is per-app (keyed on matrix.target) and downloads
    # only its own slug's artifacts, so apps don't share fate. Per-app
    # success is then enforced by the strict gate inside the release script.
    if: ${{ !cancelled() && needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect.outputs.affected) }}
    concurrency:
      # Cancel in-flight releases for the same CLI when a newer push lands.
      # gh release upload --clobber is per-asset, so a canceled mid-upload
      # is recovered by the superseding run's upload pass.
      group: release-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Locate module-dir resolver
        run: |
          set -euo pipefail
          # BUILD_REF is the source checkout and can predate this helper.
          # Read the helper from the workflow revision (GITHUB_SHA) into a
          # separate git dir. Do not use the copy in the source tree: an
          # older commit does not have it, and a caller must not be able to
          # swap it by checking out a different ref. If the workflow revision
          # has no helper, leave the path empty. The next step then uses the
          # catalog root, which is the right directory for a root-module CLI.
          dest="${RUNNER_TEMP}/resolve-module-dir.sh"
          rm -f "$dest"
          work="${RUNNER_TEMP}/workflow-rev.git"
          rm -rf "$work"
          git init --bare "$work" >/dev/null
          url="$(git remote get-url origin)"
          if git --git-dir="$work" fetch --no-tags --depth=1 "$url" "$GITHUB_SHA" \
            && git --git-dir="$work" cat-file -e "${GITHUB_SHA}:tools/release-ledger/resolve-module-dir.sh"; then
            git --git-dir="$work" show "${GITHUB_SHA}:tools/release-ledger/resolve-module-dir.sh" > "$dest"
          fi
          if [ -s "$dest" ]; then
            echo "RESOLVE_MODULE_DIR_SH=${dest}" >> "$GITHUB_ENV"
          else
            echo "RESOLVE_MODULE_DIR_SH=" >> "$GITHUB_ENV"
          fi
      - name: Compute slug
        id: slug
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          slug=$(basename "${CLI_TARGET}")
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
      # "__" is the slug delimiter from the upload names. A hyphen glob
      # also matches CLIs whose slug continues past this one.
      - name: Download MCPB artifacts for this CLI
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/dl
          pattern: mcpb-${{ steps.slug.outputs.slug }}__*
          merge-multiple: true
      - name: Download CLI binary artifacts for this CLI
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/dl
          pattern: cli-${{ steps.slug.outputs.slug }}__*
          merge-multiple: true
      - name: List downloaded artifacts and enforce per-app gate
        env:
          CLI_TARGET: ${{ matrix.target }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          ls -lh "${RUNNER_TEMP}/dl" || true
          mcpb_count=$(find "${RUNNER_TEMP}/dl" -name '*.mcpb' 2>/dev/null | wc -l | tr -d ' ')
          # CLI binaries have no consistent extension — count what's left after excluding .mcpb.
          all_count=$(find "${RUNNER_TEMP}/dl" -type f 2>/dev/null | wc -l | tr -d ' ')
          cli_count=$((all_count - mcpb_count))
          echo "Found ${mcpb_count} .mcpb file(s) and ${cli_count} CLI binary file(s)."
          # Strict per-app gate: an app's release only publishes when both
          # its CLI binaries AND (if it ships an MCPB) its bundles produced
          # at least one artifact. A partial release (CLI without MCPB or
          # vice versa) confuses users by hiding the upstream build failure
          # behind a moving "-current" tag that looks healthy. The
          # manifest.json existence check on the MCPB side is forward-
          # compatibility for future CLI-only entries that legitimately
          # ship without a bundle.
          if [ "$cli_count" = "0" ]; then
            echo "::warning::Skipping release for ${SLUG}: no CLI binaries produced (build-cli matrix failed for this app)."
            exit 0
          fi
          if [ -f "library/${CLI_TARGET}/manifest.json" ] && [ "$mcpb_count" = "0" ]; then
            echo "::warning::Skipping release for ${SLUG}: app declares manifest.json (expects MCPB) but no .mcpb produced (bundle matrix failed for this app)."
            exit 0
          fi
      # A replayed or late run must not replace a newer release built from a
      # later ledger commit.
      - name: Skip if main has a newer release
        id: current
        env:
          CLI_TARGET: ${{ matrix.target }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          ledger="library/${CLI_TARGET}/.printing-press-release.json"
          [ -f "$ledger" ] || exit 0
          git fetch --no-tags --depth=1 origin main
          built=$(jq -r .version "$ledger")
          latest=$(git show "FETCH_HEAD:${ledger}" 2>/dev/null | jq -r .version || true)
          if [ "$built" != "$latest" ]; then
            echo "::notice::Not publishing ${SLUG} ${built}: main's release ledger is at '${latest:-removed}'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify CLI version matches the release ledger
        if: steps.current.outputs.skip != 'true'
        env:
          CLI_TARGET: ${{ matrix.target }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          cli_dir="library/${CLI_TARGET}"
          ledger="${cli_dir}/.printing-press-release.json"
          # Read the version the build compiled (same checkout, no -X override)
          # instead of running the binary in a job that holds the release PAT.
          # Same directory the stamper writes, including a nested module such
          # as library/ai/v0/vzero. Either file may be absent.
          if [ -n "${RESOLVE_MODULE_DIR_SH:-}" ]; then
            module_dir="$(bash "$RESOLVE_MODULE_DIR_SH" "$cli_dir")"
          else
            module_dir="$cli_dir"
          fi
          stamped=$({ cat "${module_dir}/internal/cli/version.go" "${module_dir}/internal/cli/root.go" 2>/dev/null || true; } \
            | sed -nE 's/.*var[[:space:]]+version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' | head -n 1)
          if [ ! -f "$ledger" ] || [ -z "$stamped" ]; then
            echo "::notice::Skipping version check for ${SLUG}: no release ledger or stampable version var."
            exit 0
          fi
          expected=$(jq -er .version "$ledger")
          if [ "$stamped" != "$expected" ]; then
            echo "::error::${SLUG} was built with version ${stamped} but the release ledger says ${expected}. Refusing to publish a mislabeled build."
            exit 1
          fi
          echo "${SLUG} was built with ${expected}, matching the release ledger."
      - name: Verify release-write PAT
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_WRITE_TOKEN secret is not set. Without it, the release step cannot create or update releases. See the PR that introduced this for setup instructions."
            exit 1
          fi
          # Probe the user identity. If the token is unrecognized, this 401s
          # before the release step gets a chance to fail with a confusing
          # "error checking for existing release". On success, prints the
          # authenticated login so the runtime audit trail shows which
          # account's PAT actually executed the release.
          if ! resp=$(gh api /user --jq '.login' 2>&1); then
            echo "::error::RELEASE_WRITE_TOKEN failed authentication. Verify the PAT exists, hasn't expired, and includes Contents:write on this repo. Raw error: ${resp}"
            exit 1
          fi
          echo "Release token authenticated as: ${resp}"
          # Verify the token has access to this specific repo. If the PAT
          # was scoped to a different repo (e.g., the generator), this 404s.
          if ! gh api "/repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null 2>&1; then
            echo "::error::RELEASE_WRITE_TOKEN does not have access to ${GITHUB_REPOSITORY}. Re-scope the PAT to include this repo."
            exit 1
          fi
          echo "PAT confirmed for repo ${GITHUB_REPOSITORY}."
      - name: Publish release ${{ steps.slug.outputs.slug }}-current
        if: steps.current.outputs.skip != 'true'
        env:
          # Use a fine-grained PAT (Contents:write on this repo) instead of
          # the default GITHUB_TOKEN. The workflow's GITHUB_TOKEN reports
          # contents:write in its permissions log but the API still 403s on
          # release creation — likely a silent installation-token cap from
          # the GitHub Actions integration itself, invisible from the API.
          # The PAT bypasses that cap by acting as the user who minted it.
          GH_TOKEN: ${{ secrets.RELEASE_WRITE_TOKEN }}
          SLUG: ${{ steps.slug.outputs.slug }}
          CLI_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="${SLUG}-current"
          # Skip if neither bundle nor CLI artifacts were produced.
          if ! find "${RUNNER_TEMP}/dl" -type f -print -quit | grep -q .; then
            echo "No artifacts to publish for ${SLUG}; skipping release."
            exit 0
          fi
          # Exact asset names. A glob on ${SLUG}-* would publish another
          # CLI's binaries onto this release. Partial platform sets are fine.
          owned_suffixes=(
            pp-cli-darwin-amd64
            pp-cli-darwin-arm64
            pp-cli-linux-amd64
            pp-cli-linux-arm64
            pp-cli-windows-amd64.exe
            pp-cli-windows-arm64.exe
            pp-mcp-darwin-arm64.mcpb
            pp-mcp-windows-amd64.mcpb
            pp-mcp-windows-arm64.mcpb
          )
          foreign=0
          for f in "${RUNNER_TEMP}/dl"/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            owned=0
            for suffix in "${owned_suffixes[@]}"; do
              if [ "$base" = "${SLUG}-${suffix}" ]; then
                owned=1
                break
              fi
            done
            if [ "$owned" -ne 1 ]; then
              echo "::error::Refusing to publish ${base} on ${tag}: not a ${SLUG} release asset."
              foreign=1
            fi
          done
          if [ "$foreign" -ne 0 ]; then
            exit 1
          fi
          # shellcheck disable=SC2016
          notes=$(printf 'Auto-built artifacts for **%s** at commit %s.\n\n**Claude Desktop:** download the matching `.mcpb` file and double-click to install.\n\n**Terminal CLI:** download the binary matching your platform. On macOS you may need to clear the Gatekeeper quarantine: `xattr -d com.apple.quarantine <binary>`. On Unix, `chmod +x <binary>`.\n\n**Verify:** `checksums.txt` lists the SHA-256 of every asset on this release. Check the file you downloaded with `grep '"'"' <file>$'"'"' checksums.txt | sha256sum -c` (macOS: `shasum -a 256 -c`).\n\n_This is a moving tag — it always points at the latest build._' "${CLI_TARGET}" "${BUILD_REF}")
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Updating existing release ${tag}"
            gh release upload "${tag}" "${RUNNER_TEMP}"/dl/* --clobber
            gh release edit "${tag}" --notes "${notes}" --target "${BUILD_REF}"
          else
            echo "Creating new release ${tag}"
            gh release create "${tag}" "${RUNNER_TEMP}"/dl/* \
              --title "${SLUG} (latest build)" \
              --notes "${notes}" \
              --target "${BUILD_REF}" \
              --latest=false
          fi
          python3 .github/scripts/release-checksums/release_checksums.py \
            --repo "${GITHUB_REPOSITORY}" --tag "${tag}"
